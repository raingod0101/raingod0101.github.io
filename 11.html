<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>雨神大亨 | Raingod</title>
<style>
    * { touch-action: none; user-select: none; box-sizing: border-box; }
    body { margin: 0; background: #020617; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
    #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

    .top-bar {
        position: absolute !important;
        top: 110px !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid #38bdf8;
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        padding: 8px 20px;
        border-radius: 30px;
        pointer-events: auto;
        backdrop-filter: blur(8px);
        display: flex;
        gap: 16px;
        align-items: center;
        white-space: nowrap;
        z-index: 999 !important;
    }
    .hud-item { font-size: 12px; font-weight: bold; color: #f8fafc; }
    .money { color: #4ade80; font-size: 16px; font-weight: 900; }
    .dark-matter { color: #c084fc; font-size: 12px; }

    .skill-bar {
        position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 8px; pointer-events: auto;
    }
    .skill-btn {
        background: rgba(15, 23, 42, 0.9); border: 1px solid #38bdf8; color: #fff;
        padding: 7px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; gap: 2px; transition: all 0.2s;
        min-width: 72px;
    }
    .skill-btn:hover:not(:disabled) { background: #0284c7; }
    .skill-btn:disabled, .skill-btn.cooling { opacity: 0.45; border-color: #475569; cursor: not-allowed; }
    .sk-ico { font-size: 15px; line-height: 1; }
    .sk-cd { font-size: 9px; color: #f59e0b; }

    .panel {
        position: absolute; bottom: 15px; right: 15px;
        width: 330px; max-height: 78vh; overflow-y: auto;
        background: rgba(15, 23, 42, 0.95); border: 1px solid #334155; border-radius: 12px;
        pointer-events: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px);
    }
    .panel::-webkit-scrollbar { width: 4px; }
    .panel::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 4px; }

    .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 2px; }
    .tab-btn {
        background: #1e293b; color: #94a3b8; border: none; padding: 7px 2px;
        font-size: 10px; font-weight: bold; border-radius: 6px; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .tab-btn.active { background: #0284c7; color: #fff; }

    .btn {
        background: linear-gradient(135deg, #1e293b, #0f172a); color: #fff; border: 1px solid #38bdf8;
        padding: 8px 10px; font-weight: bold; font-size: 11px; border-radius: 8px; cursor: pointer;
        display: flex; justify-content: space-between; align-items: center; transition: all 0.2s;
        gap: 8px; text-align: left;
    }
    .btn:hover:not(:disabled) { background: linear-gradient(135deg, #0284c7, #0369a1); border-color: #38bdf8; }
    .btn:disabled { opacity: 0.35; border-color: #475569; cursor: not-allowed; }
    .rebirth-btn { background: linear-gradient(135deg, #7e22ce, #581c87); border-color: #c084fc; }
    .btn .desc { font-size: 9px; color: #94a3b8; font-weight: normal; display: block; margin-top: 2px; }

    .quest-box {
        background: rgba(30, 41, 59, 0.6); border: 1px dashed #38bdf8; padding: 6px 8px;
        border-radius: 6px; font-size: 10px; color: #e2e8f0; margin-bottom: 2px;
    }
    .inspector {
        background: rgba(8, 47, 73, 0.7); border: 1px solid #0ea5e9; border-radius: 8px;
        padding: 8px; font-size: 11px; color: #e0f2fe; display: flex; flex-direction: column; gap: 6px;
    }
    .inspector .row { display: flex; gap: 6px; }
    .inspector .row .btn { flex: 1; justify-content: center; font-size: 10px; padding: 6px; }
    .ach-row { font-size: 10px; color: #cbd5e1; display: flex; justify-content: space-between; padding: 4px 2px; border-bottom: 1px dashed #1e293b; }
    .ach-row.done { color: #4ade80; }

    #tycoon-leaderboard-button { position: absolute; top: 160px; right: 15px; z-index: 20; pointer-events: auto; padding: 9px 14px; border: 1px solid #38bdf8; border-radius: 20px; color: #fff; background: rgba(15,23,42,0.9); font-weight: bold; cursor: pointer; }
    #tycoon-leaderboard { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(2,6,23,0.94); color: #fff; }
    .tycoon-leaderboard-card { width: min(520px, 100%); max-height: 80vh; overflow-y: auto; padding: 20px; border: 1px solid #38bdf8; border-radius: 16px; background: #0b1020; }
    .tycoon-leaderboard-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 4px; border-bottom: 1px solid #26334a; }
    .mobile-shop-toggle, .mobile-panel-close { display: none; }

    @media (max-width: 700px), (max-height: 500px) and (pointer: coarse) {
        .nav-content { gap: 6px; padding: 0 8px !important; }
        .brand { flex: 0 0 auto; white-space: nowrap; }
        .nav-links { flex: 1; min-width: 0; justify-content: space-evenly; gap: 0 !important; margin-left: 4px !important; }
        .nav-item { padding: 6px 3px !important; font-size: 11px !important; white-space: nowrap; }
        .login-btn { flex: 0 0 auto; padding: 6px 8px !important; white-space: nowrap; }

        .top-bar {
            top: calc(60px + env(safe-area-inset-top)) !important;
            left: 8px !important;
            width: calc(100% - 16px) !important;
            transform: none !important;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 8px;
            padding: 7px 10px;
            border-radius: 12px;
            white-space: normal;
        }
        .hud-item { font-size: 10px; }
        .money { font-size: 13px; }
        .dark-matter { font-size: 10px; }

        #tycoon-leaderboard-button { top: 146px; right: 8px; max-width: 46%; padding: 8px 10px; font-size: 11px; }

        .skill-bar {
            bottom: max(8px, env(safe-area-inset-bottom));
            left: 8px; right: 8px; transform: none; gap: 5px;
        }
        .skill-btn { flex: 1; min-width: 0; padding: 6px 2px; font-size: 8px; }
        .sk-ico { font-size: 13px; }
        .sk-cd { font-size: 8px; }

        .panel {
            display: none; left: 0; right: 0; bottom: 0; width: 100%;
            max-height: 56dvh;
            padding: 10px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
            border-radius: 14px 14px 0 0;
            touch-action: pan-y; -webkit-overflow-scrolling: touch;
        }
        #ui.shop-open .panel { display: flex; }
        #ui.shop-open .skill-bar { display: none; }
        .mobile-panel-close {
            display: block; align-self: flex-end; padding: 7px 12px; border: 1px solid #64748b;
            border-radius: 8px; background: #1e293b; color: #fff; font-weight: bold; touch-action: manipulation;
        }
        .mobile-shop-toggle {
            display: block; position: absolute; right: 10px;
            bottom: calc(62px + env(safe-area-inset-bottom)); z-index: 15;
            padding: 9px 13px; border: 1px solid #38bdf8; border-radius: 20px;
            background: rgba(15, 23, 42, 0.95); color: #fff; font-weight: bold;
            pointer-events: auto; touch-action: manipulation;
        }
        #ui.shop-open .mobile-shop-toggle { display: none; }

        .tab-btn { min-height: 40px; font-size: 9px; }
        .btn { min-height: 40px; font-size: 11px; touch-action: manipulation; }
        #tycoon-leaderboard { padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom)); }
        .tycoon-leaderboard-card { max-height: 85dvh; padding: 14px; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
        .tycoon-leaderboard-row { flex-direction: column; gap: 4px; }
    }
</style>
</head>

<script>

   雨神大亨 · 全面進化版
   ========================================================= */
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const SAVE_KEY = 'raingod_tycoon_save';
const TYCOON_LEADERBOARD_URL = 'https://game-24b43-default-rtdb.firebaseio.com/raingod_tycoon_leaderboard';

/* ---- roundRect polyfill ---- */
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (typeof r === 'number') r = [r, r, r, r];
        const [tl, tr, br, bl] = r;
        this.beginPath();
        this.moveTo(x + tl, y);
        this.lineTo(x + w - tr, y); this.quadraticCurveTo(x + w, y, x + w, y + tr);
        this.lineTo(x + w, y + h - br); this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
        this.lineTo(x + bl, y + h); this.quadraticCurveTo(x, y + h, x, y + h - bl);
        this.lineTo(x, y + tl); this.quadraticCurveTo(x, y, x + tl, y);
        this.closePath();
        return this;
    };
}

/* ---- 畫布尺寸 / DPR ---- */
let W = window.innerWidth, H = window.innerHeight, DPR = Math.min(window.devicePixelRatio || 1, 2);
const resize = () => {
    W = window.innerWidth; H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cvs.width = Math.floor(W * DPR);
    cvs.height = Math.floor(H * DPR);
    cvs.style.width = W + 'px';
    cvs.style.height = H + 'px';
};
window.addEventListener('resize', resize);
resize();

   資料定義
   ========================================================= */

    venom:    { name: '毒液塔',   icon: '🧪', cost: 120000, range: 240, cd: 22,  dmg: 22,  poison: 14, color: '#84cc16', desc: '持續中毒傷害' },
    tesla:    { name: '電磁塔',   icon: '🌩️', cost: 220000, range: 210, cd: 38,  dmg: 78,  chain: 3, color: '#facc15', desc: '連鎖閃電' },
    blackhole:{ name: '黑洞塔',   icon: '🌌', cost: 420000, range: 280, cd: 5,   dmg: 10,  pull: true, color: '#c084fc', desc: '牽引持續傷害' },
    missile:  { name: '導彈塔',   icon: '🚀', cost: 750000, range: 420, cd: 92,  dmg: 340, splash: 110, color: '#fb7185', desc: '追蹤範圍爆炸' },

function saveGame() {
    if (!storageReady) return;
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
            money, darkMatter, minerLevel, capacity, techTier, playerDamageLevel, turretDamageLevel,
            player: { x: p.x, y: p.y, bag: [] },
            bots: bots.map(b => ({ x: b.x, y: b.y, bag: [] })),
            turrets: turrets.map(t => ({ x: t.x, y: t.y, type: t.type, lv: t.lv })),
            talents, wave, bestWave, waveTimer, isWaveActive: false,
            skillCd, isOverclocked, overclockTimer, quest, achievements, totalKills, maxCombo
        }));
    } catch (e) { /* ignore */ }
}

function loadGame(data) {
    if (!data || typeof data !== 'object' || Array.isArray(data)) return;
    const num = (v, f) => Number.isFinite(Number(v)) ? Number(v) : f;
    const arr = v => Array.isArray(v) ? v.filter(o => o && typeof o === 'object').slice(0, 2000) : [];

    money = Math.max(0, num(data.money, money));
    darkMatter = Math.max(0, num(data.darkMatter, darkMatter));
    minerLevel = Math.max(0, Math.floor(num(data.minerLevel, minerLevel)));
    capacity = Math.max(1, Math.floor(num(data.capacity, capacity)));
    techTier = Math.min(5, Math.max(1, Math.floor(num(data.techTier, techTier))));
    playerDamageLevel = Math.max(0, Math.floor(num(data.playerDamageLevel, playerDamageLevel)));
    turretDamageLevel = Math.max(0, Math.floor(num(data.turretDamageLevel, turretDamageLevel)));
    if (data.player && typeof data.player === 'object') {
        if (Number.isFinite(Number(data.player.x))) p.x = Number(data.player.x);
        if (Number.isFinite(Number(data.player.y))) p.y = Number(data.player.y);
    }
    p.tx = p.x; p.ty = p.y;

    bots = arr(data.bots).map(b => ({
        x: num(b.x, 120), y: num(b.y, H / 2), bag: [], speed: 4.5,
        phase: Math.random() * Math.PI * 2
    }));
    turrets = arr(data.turrets)
        .filter(t => TURRET_DEFS[t.type])
        .map(t => ({
            x: num(t.x, 300), y: num(t.y, 300), type: t.type,
            lv: Math.max(1, Math.floor(num(t.lv, 1))),
            cd: 0, angle: 0, flash: 0
        }));

    if (data.talents && typeof data.talents === 'object') {
        Object.keys(talents).forEach(k => { talents[k] = Math.max(0, Math.floor(num(data.talents[k], talents[k]))); });
    }
    wave = Math.max(1, Math.floor(num(data.wave, wave)));
    bestWave = Math.max(0, Math.floor(num(data.bestWave, bestWave)));
    totalKills = Math.max(0, Math.floor(num(data.totalKills, totalKills)));
    maxCombo = Math.max(0, Math.floor(num(data.maxCombo, maxCombo)));
    waveTimer = Math.max(0, Math.floor(num(data.waveTimer, waveTimer)));
    isWaveActive = false;
    if (Array.isArray(data.skillCd) && data.skillCd.length >= 4) {
        skillCd = data.skillCd.slice(0, 4).map(v => Math.max(0, num(v, 0)));
    }
    isOverclocked = data.isOverclocked === true;
    overclockTimer = Math.max(0, Math.floor(num(data.overclockTimer, overclockTimer)));
    if (data.quest && typeof data.quest === 'object') quest = { ...quest, ...data.quest };
    if (data.achievements && typeof data.achievements === 'object') achievements = { ...data.achievements };
}

async function openTycoonLeaderboard() {
    if (!await window.raingodRequireAuth('排行榜')) return;
    document.getElementById('tycoon-leaderboard').style.display = 'flex';
    await refreshTycoonLeaderboard();
}
function closeTycoonLeaderboard() {
    document.getElementById('tycoon-leaderboard').style.display = 'none';
}
async function refreshTycoonLeaderboard() {
    const status = document.getElementById('tycoon-leaderboard-status');
    const list = document.getElementById('tycoon-leaderboard-list');
    if (!await window.raingodRequireAuth('排行榜')) return;
    const uid = window.raingodCurrentUser.uid;
    status.textContent = '排行榜載入中…';
    try {
        const response = await fetch(`${TYCOON_LEADERBOARD_URL}.json`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        if (window.raingodCurrentUser?.uid !== uid) return;
        const rows = await response.json() || {};
        const entries = Object.entries(rows)
            .filter(([, row]) => row && Number.isFinite(Number(row.wave)))
            .sort((a, b) => Number(b[1].wave) - Number(a[1].wave) || Number(b[1].darkMatter || 0) - Number(a[1].darkMatter || 0))
            .slice(0, 50);
        list.replaceChildren();
        entries.forEach(([entryUid, row], index) => {
            const item = document.createElement('div');
            item.className = 'tycoon-leaderboard-row';
            const name = document.createElement('span');
            name.textContent = `${index + 1}. ${row.name || '玩家'}${entryUid === uid ? '（你）' : ''}`;
            const value = document.createElement('strong');
            value.textContent = `第 ${Math.floor(Number(row.wave))} 波 · ${Math.floor(Number(row.darkMatter) || 0)} 暗物質`;
            item.append(name, value);
            list.appendChild(item);
        });
        status.textContent = entries.length ? `已載入 ${entries.length} 位玩家，依最高波數排序。` : '目前還沒有排行榜資料。';
    } catch (error) {
        console.error('載入雨神大亨排行榜失敗：', error);
        status.textContent = '排行榜載入失敗，請稍後重試。';
    }
}
async function uploadTycoonLeaderboardScore() {
    const currentUser = window.raingodCurrentUser;
    if (!currentUser) return;
    const uid = currentUser.uid;
    const scoreWave = Math.max(1, bestWave, wave);
    const scoreDarkMatter = Math.floor(darkMatter);
    const entryUrl = `${TYCOON_LEADERBOARD_URL}/${encodeURIComponent(uid)}.json`;
    try {
        const previousResponse = await fetch(entryUrl);
        if (!previousResponse.ok) throw new Error(`HTTP ${previousResponse.status}`);
        const previous = await previousResponse.json();
        if (window.raingodCurrentUser?.uid !== uid) return;
        if (previous && (Number(previous.wave) > scoreWave ||
            (Number(previous.wave) === scoreWave && Number(previous.darkMatter) >= scoreDarkMatter))) return;
        const response = await fetch(entryUrl, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: currentUser.displayName || (currentUser.email ? currentUser.email.split('@')[0] : '雨神玩家'),
                wave: scoreWave,
                darkMatter: scoreDarkMatter,
                updatedAt: Date.now()
            })
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
    } catch (error) {
        console.error('上傳雨神大亨排行榜失敗：', error);
    }
}
async function initializeTycoon() {
    await window.raingodFirebaseReady;
    await window.raingodAuthReady;
    await window.raingodBindStorage('raingod-tycoon', [SAVE_KEY], { [SAVE_KEY]: null }, data => {
        loadGame(data[SAVE_KEY]);
        storageReady = true;
        saveGame();
        if (window.raingodCurrentUser) uploadTycoonLeaderboardScore();
    });
    window.raingodOnAuthStateChanged(currentUser => {
        const button = document.getElementById('tycoon-leaderboard-button');
        button.textContent = currentUser ? '🏆 排行榜' : '🏆 登入後查看排行榜';
        if (currentUser) uploadTycoonLeaderboardScore();
        else {
            closeTycoonLeaderboard();
            document.getElementById('tycoon-leaderboard-list').replaceChildren();
            document.getElementById('tycoon-leaderboard-status').textContent = '請登入帳號後查看。';
        }
    });
    requestAnimationFrame(draw);
}

/* =========================================================
   工具函式
   ========================================================= */
const rnd = (a, b) => a + Math.random() * (b - a);
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

function triggerShake(d) { shakeTime = Math.max(shakeTime, d); }

function addFloat(x, y, text, color, size) {
    if (floatTexts.length > 90) floatTexts.shift();
    floatTexts.push({ x, y, text, color: color || '#4ade80', alpha: 1, size: size || 14, vy: -0.9 });
}

function addParticles(x, y, color, count, speed) {
    if (particles.length > 420) count = Math.min(count, 4);
    const sp = speed || 8;
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const v = rnd(0.4, 1) * sp;
        particles.push({
            x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
            size: rnd(1.5, 4.5), color, alpha: 1, decay: rnd(0.02, 0.05)
        });
    }
}

function addShock(x, y, color, r, maxR, life) {
    shocks.push({ x, y, color, r: r || 4, maxR: maxR || 80, life: life || 1 });
}

function addBeam(x1, y1, x2, y2, color, width, life) {
    beams.push({ x1, y1, x2, y2, color, width: width || 3, life: life || 12, maxLife: life || 12 });
}

function getTurretCost(type) {
    const owned = turrets.filter(t => t.type === type).length;
    return Math.floor(TURRET_DEFS[type].cost * Math.pow(1.32, owned));
}

/* =========================================================
   塔的建造 / 升級 / 出售
   ========================================================= */
function beginPlacement(type) {
    const cost = getTurretCost(type);
    if (money < cost) {
        addFloat(W / 2, H / 2, '金錢不足！', '#ef4444', 16);
        return;
    }
    placingTurret = type;
    selectedTurret = null;
    updateInspector();
}

function cancelPlacement() { placingTurret = null; }

function placeTurret(type, x, y) {
    const cost = getTurretCost(type);
    if (money < cost) { placingTurret = null; return; }
    // 避免和已有塔重疊
    if (turrets.some(t => dist(t.x, t.y, x, y) < 32)) {
        addFloat(x, y, '位置重疊', '#ef4444');
        return;
    }
    if (x < 200 && y < 620) { /* 允許 */ }
    money -= cost;
    turrets.push({ x, y, type, lv: 1, cd: 0, angle: 0, flash: 0 });
    addParticles(x, y, TURRET_DEFS[type].color, 14, 9);
    addShock(x, y, TURRET_DEFS[type].color, 6, 60, 1);
    addFloat(x, y - 24, '建造完成！', TURRET_DEFS[type].color, 13);
    placingTurret = null;
    saveGame();
}

function upgradeCost(t) {
    const base = TURRET_DEFS[t.type].cost;
    return Math.floor(base * 0.6 * Math.pow(1.55, t.lv - 1));
}

function sellValue(t) {
    const base = TURRET_DEFS[t.type].cost;
    return Math.floor(base * 0.5 * (1 + (t.lv - 1) * 0.3));
}

function selectTurretAt(x, y) {
    let found = null, bestD = 34;
    turrets.forEach(t => {
        const d = dist(t.x, t.y, x, y);
        if (d < bestD) { bestD = d; found = t; }
    });
    selectedTurret = found;
    updateInspector();
}

function updateInspector() {
    const box = document.getElementById('turret-inspector');
    if (!selectedTurret || !turrets.includes(selectedTurret)) {
        box.style.display = 'none';
        selectedTurret = null;
        return;
    }
    const t = selectedTurret;
    const d = TURRET_DEFS[t.type];
    const upCost = upgradeCost(t);
    const sellV = sellValue(t);
    box.style.display = 'flex';
    box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong style="color:${d.color}">${d.icon} ${d.name} Lv.${t.lv}</strong>
            <span style="font-size:9px;color:#7dd3fc">射程 ${Math.round(d.range * (1 + talents.rangeLv * 0.1) * (1 + (t.lv - 1) * 0.06))}</span>
        </div>
        <div class="row">
            <button class="btn" onclick="doUpgradeSelected()" ${money < upCost ? 'disabled' : ''}>升級 $${upCost.toLocaleString()}</button>
            <button class="btn" style="border-color:#f87171" onclick="doSellSelected()">出售 +$${sellV.toLocaleString()}</button>
        </div>
        <div class="row">
            <button class="btn" style="justify-content:center" onclick="deselectTurret()">取消選取</button>
        </div>`;
}

function doUpgradeSelected() {
    const t = selectedTurret;
    if (!t) return;
    const c = upgradeCost(t);
    if (money < c) return;
    money -= c;
    t.lv++;
    addParticles(t.x, t.y, TURRET_DEFS[t.type].color, 10, 7);
    addFloat(t.x, t.y - 24, `Lv.${t.lv}`, TURRET_DEFS[t.type].color);
    updateInspector();
    saveGame();
}

function doSellSelected() {
    const t = selectedTurret;
    if (!t) return;
    const v = sellValue(t);
    money += v;
    addFloat(t.x, t.y - 20, `+$${v.toLocaleString()}`, '#4ade80');
    addParticles(t.x, t.y, '#94a3b8', 12, 6);
    turrets = turrets.filter(x => x !== t);
    selectedTurret = null;
    updateInspector();
    saveGame();
}

function deselectTurret() {
    selectedTurret = null;
    updateInspector();
}

function useSkill(n) {
    if (skillCd[n - 1] > 0) return;
    if (n === 1) {
        isOverclocked = true; overclockTimer = 600; skillCd[0] = 1800;
        addFloat(p.x, p.y - 30, '⚡ 系統超頻！', '#f59e0b', 16);
        addShock(p.x, p.y, '#f59e0b', 8, 120, 1);
    } else if (n === 2) {
        skillCd[1] = 2400;
        triggerShake(26);
        addShock(W / 2, H / 2, '#e11d48', 10, Math.max(W, H), 1.6);
        addFloat(W / 2, H / 2 - 60, '💥 軌道離子砲全螢幕打擊！', '#e11d48', 18);
        enemies.slice().forEach(e => {
            damageEnemy(e, 320 + wave * 70, '#e11d48', false);
            addParticles(e.x, e.y, '#e11d48', 10, 10);
        });
    } else if (n === 3) {
        freezeTimer = 300; skillCd[2] = 2100;
        addFloat(W / 2, H / 2, '❄️ 時間凍結 5 秒！', '#7dd3fc', 17);
        addShock(W / 2, H / 2, '#7dd3fc', 10, Math.max(W, H) * 0.8, 1.4);
    } else if (n === 4) {
        singularityTimer = 240; skillCd[3] = 2700;
        addFloat(W / 2, H / 2, '🌀 引力奇點展開！', '#c084fc', 17);
        addShock(W / 2, H / 2, '#c084fc', 10, Math.max(W, H) * 0.7, 1.4);
    }
}

/* =========================================================
   波次
   ========================================================= */
function pickWaveModifier() {
    if (wave <= 3) return WAVE_MODS[0];
    return WAVE_MODS[Math.floor(Math.random() * WAVE_MODS.length)];
}

function spawnWave() {
    isWaveActive = true;
    bestWave = Math.max(bestWave, wave);
    waveMod = pickWaveModifier();

    const isBossWave = (wave % 5 === 0);
    let baseCount = 8 + wave * 4;
    let count = Math.round(baseCount * (waveMod.countMul || 1));
    count = Math.min(count, 90);

    if (waveMod.name !== '常規波次') {
        addFloat(W / 2, 130, `${waveMod.icon} ${waveMod.name}：${waveMod.desc}`, '#fbbf24', 15);
    }

    const hpMul = waveMod.hpMul || 1;
    const spdMul = waveMod.spdMul || 1;

    for (let i = 0; i < count; i++) {
        setTimeout(() => {
            if (!isWaveActive) return;
            const r = Math.random();
            let type = 'crawler';
            if (r < 0.16) type = 'runner';
            else if (r < 0.34) type = 'tank';
            else if (r < 0.48) type = 'bomber';
            else if (r < 0.62) type = 'splitter';
            else if (r < 0.72) type = 'healer';
            else if (r < 0.82) type = 'shield';
            else if (r < 0.92) type = 'phantom';

            if (waveMod.elite && r > 0.72) type = Math.random() < 0.5 ? 'shield' : 'tank';
            if (isBossWave && i === count - 1) type = 'boss';

            spawnEnemy(type, hpMul, spdMul);
        }, i * 380);
    }
    saveGame();
    uploadTycoonLeaderboardScore();
}

function spawnEnemy(type, hpMul, spdMul) {
    const d = ENEMY_DEFS[type];
    const scale = 1 + (wave - 1) * 0.22;
    const hp = (d.hp + wave * 42) * scale * (hpMul || 1);
    const e = {
        type, x: W + 50 + Math.random() * 120,
        y: rnd(90, H - 90),
        hp, maxHp: hp,
        shield: d.shield ? d.shield * scale : 0,
        maxShield: d.shield ? d.shield * scale : 0,
        speed: d.spd * (spdMul || 1) * (1 + Math.min(wave * 0.012, 0.5)),
        baseSpeed: d.spd * (spdMul || 1) * (1 + Math.min(wave * 0.012, 0.5)),
        reward: (d.reward + wave * 32),
        seed: Math.random() * Math.PI * 2,
        hitFlash: 0, slowT: 0, slowFactor: 1,
        poison: 0, poisonDmg: 0,
        dead: false, wave: 0
    };
    enemies.push(e);
}

/* =========================================================
   傷害 / 擊殺
   ========================================================= */
function damageEnemy(e, dmg, color, crit) {
    if (!e || e.dead) return;
    let remain = dmg;
    if (e.shield > 0) {
        const absorbed = Math.min(e.shield, remain);
        e.shield -= absorbed;
        remain -= absorbed;
        if (absorbed > 0) addParticles(e.x, e.y, '#38bdf8', 2, 5);
    }
    e.hp -= remain;
    e.hitFlash = 4;
    if (dmg >= 25 || crit) {
        addFloat(e.x + rnd(-6, 6), e.y - 18, Math.round(dmg).toString(), crit ? '#fbbf24' : (color || '#fff'), crit ? 15 : 11);
    }
    if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
    if (e.dead) return;
    e.dead = true;

    combo++; comboTimer = 200;
    maxCombo = Math.max(maxCombo, combo);
    totalKills++;

    const comboMul = 1 + Math.min(combo, 60) * 0.015;
    const moneyMul = (1 + darkMatter * 0.08) * (1 + talents.moneyLv * 0.25) * comboMul;
    const gain = e.reward * moneyMul;
    money += gain;

    addFloat(e.x, e.y - 10, `+$${Math.floor(gain).toLocaleString()}`, '#4ade80', 12);
    addParticles(e.x, e.y, ENEMY_DEFS[e.type].color, e.type === 'boss' ? 34 : 10, e.type === 'boss' ? 14 : 8);
    if (e.type === 'boss') {
        addShock(e.x, e.y, '#e11d48', 8, 160, 1.3);
        triggerShake(20);
    }

    // 分裂
    if (ENEMY_DEFS[e.type].split) {
        for (let i = 0; i < 2; i++) {
            const c = {
                type: 'crawler', x: e.x + rnd(-14, 14), y: e.y + rnd(-14, 14),
                hp: e.maxHp * 0.22, maxHp: e.maxHp * 0.22, shield: 0, maxShield: 0,
                speed: e.baseSpeed * 1.3, baseSpeed: e.baseSpeed * 1.3,
                reward: e.reward * 0.28, seed: Math.random() * 6.28,
                hitFlash: 0, slowT: 0, slowFactor: 1, poison: 0, poisonDmg: 0, dead: false, wave: 0
            };
            enemies.push(c);
        }
    }

    updateQuests('kill', 1);
}

/* =========================================================
   任務 / 成就
   ========================================================= */
function updateQuests(type, amount) {
    if (quest.type === type) {
        quest.current += amount;
        if (quest.current >= quest.target) {
            money += quest.reward;
            addFloat(W / 2, 150, `🎉 完成任務！+$${quest.reward}`, '#f59e0b', 16);
            const targets = [30, 50, 80, 120];
            const t = targets[Math.floor(Math.random() * targets.length)];
            quest = { type: 'kill', target: t, current: 0, reward: t * 140, desc: `擊殺 ${t} 隻異形蟲` };
        }
    }
}

function checkAchievements() {
    const snapshot = {
        bestWave, totalKills, maxCombo, money,
        turretCount: turrets.length
    };
    let changed = false;
    ACHIEVEMENTS.forEach(a => {
        if (achievements[a.id]) return;
        if (a.check(snapshot)) {
            achievements[a.id] = true;
            darkMatter += a.reward;
            changed = true;
            addFloat(W / 2, 180, `🏆 成就達成：${a.name} +${a.reward} DM`, '#fbbf24', 15);
            addParticles(W / 2, 180, '#fbbf24', 20, 10);
        }
    });
    if (changed) { refreshAchUI(); saveGame(); }
}

/* =========================================================
   購買 / 升級
   ========================================================= */
function buyBot() {
    const cost = Math.floor(500 * Math.pow(1.3, bots.length));
    if (money < cost) return;
    money -= cost;
    bots.push({
        x: 120, y: H / 2, bag: [], speed: 4.5,
        phase: Math.random() * Math.PI * 2
    });
    addParticles(120, H / 2, '#38bdf8', 10);
    saveGame();
}

function upgrade(type) {
    if (type === 'miner') {
        const cost = Math.floor(1000 * Math.pow(1.5, minerLevel));
        if (money < cost) return;
        money -= cost; minerLevel++;
    } else if (type === 'capacity') {
        const cost = Math.floor(1500 * (capacity / 2));
        if (money < cost) return;
        money -= cost; capacity += 2;
    } else if (type === 'playerDamage') {
        const cost = Math.floor(1000 * Math.pow(1.6, playerDamageLevel));
        if (money < cost) return;
        money -= cost; playerDamageLevel++;
    } else if (type === 'turretDamage') {
        const cost = Math.floor(1500 * Math.pow(1.6, turretDamageLevel));
        if (money < cost) return;
        money -= cost; turretDamageLevel++;
    }
    saveGame();
}

function buyTalent(type) {
    const key = type + 'Lv';
    if (!(key in talents)) return;
    const cost = (talents[key] + 1) * 5;
    if (darkMatter < cost) return;
    darkMatter -= cost;
    talents[key]++;
    addParticles(p.x, p.y, '#c084fc', 12);
    saveGame();
}

function unlockTier(tier) {
    const costs = { 2: 2500, 3: 25000, 4: 200000, 5: 2000000 };
    if (techTier === tier - 1 && money >= costs[tier]) {
        money -= costs[tier];
        techTier = tier;
        addFloat(W / 2, 150, `🔓 工廠升級至 Tier ${tier}`, '#38bdf8', 15);
        saveGame();
    }
}

function triggerRebirth() {
    const earnedDM = Math.floor(money / 100000);
    if (earnedDM <= 0 && money < 100000) {
        addFloat(W / 2, H / 2, '至少需要 $100,000 才能轉生', '#ef4444', 15);
        return;
    }
    darkMatter += Math.max(1, earnedDM);
    money = 2000; minerLevel = 0; capacity = 4; techTier = 1;
    playerDamageLevel = 0; turretDamageLevel = 0;
    p.bag = []; bots = []; items = []; turrets = []; enemies = [];
    bullets = []; beams = []; particles = []; shocks = []; selectedTurret = null;
    wave = 1; waveTimer = 20 * 60; isWaveActive = false; combo = 0;
    updateInspector();
    addFloat(W / 2, H / 2, `🌌 量子轉生成功！+${Math.max(1, earnedDM)} DM`, '#c084fc', 20);
    addShock(W / 2, H / 2, '#c084fc', 10, Math.max(W, H), 1.6);
    triggerShake(30);
    saveGame();
}

function triggerNextWave() {
    if (!isWaveActive) { waveTimer = 0; saveGame(); }
}

/* =========================================================
   更新邏輯
   ========================================================= */
function update() {
    frame++;
    const b = getBuildings();

    // 玩家移動
    p.x += (p.tx - p.x) * 0.18;
    p.y += (p.ty - p.y) * 0.18;
    p.atkRange = 220 * (1 + talents.rangeLv * 0.1);

    // 冷卻
    for (let i = 0; i < skillCd.length; i++) if (skillCd[i] > 0) skillCd[i]--;
    if (overclockTimer > 0) { overclockTimer--; if (overclockTimer === 0) isOverclocked = false; }
    if (freezeTimer > 0) freezeTimer--;
    if (singularityTimer > 0) singularityTimer--;
    if (comboTimer > 0) { comboTimer--; if (comboTimer === 0) combo = 0; }

    // 波次
    if (!isWaveActive) {
        waveTimer--;
        if (waveTimer <= 0) spawnWave();
    } else if (enemies.length === 0) {
        isWaveActive = false;
        wave++;
        waveTimer = 20 * 60;
        const bonus = 1500 * wave * (1 + talents.moneyLv * 0.25);
        money += bonus;
        darkMatter += 1;
        addFloat(W / 2, H / 2, `🎉 第 ${wave - 1} 波完成！+$${Math.floor(bonus).toLocaleString()}`, '#f59e0b', 18);
        addShock(W / 2, H / 2, '#f59e0b', 10, 220, 1.4);
        saveGame();
        uploadTycoonLeaderboardScore();
    }

    // 產礦
    const spawnInterval = isOverclocked ? 4 : Math.max(6, 35 - minerLevel * 4);
    if (frame % spawnInterval === 0 && items.length < 50) {
        items.push({
            x: b.extractor.x + b.extractor.w + 15,
            y: b.extractor.y + b.extractor.h / 2 + rnd(-18, 18),
            type: 'RAW', bob: Math.random() * 6.28
        });
    }

    // 機兵 AI
    bots.forEach(bot => {
        const speed = bot.speed * (1 + talents.spdLv * 0.15) * (isOverclocked ? 1.8 : 1);
        let target;
        if (bot.bag.length === 0) {
            const it = items[0];
            target = it ? { x: it.x, y: it.y } : { x: b.extractor.x + b.extractor.w + 15, y: b.extractor.y + b.extractor.h / 2 };
        } else {
            const top = bot.bag[bot.bag.length - 1];
            if (top.type === 'RAW') target = center(b.smelter);
            else if (top.type === 'STEEL' && b.chipFab) target = center(b.chipFab);
            else if (top.type === 'CHIP' && b.nukeFab) target = center(b.nukeFab);
            else if (top.type === 'BATTERY' && b.qFab) target = center(b.qFab);
            else if (top.type === 'CORE' && b.antiFab) target = center(b.antiFab);
            else target = center(b.hub);
        }
        const dx = target.x - bot.x, dy = target.y - bot.y, d = Math.hypot(dx, dy);
        if (d > 5) { bot.x += (dx / d) * speed; bot.y += (dy / d) * speed; }
        interact(bot, b);
    });

    interact(p, b);

    // 玩家自動攻擊
    p.cooldown--;
    const dmgMult = (1 + darkMatter * 0.08) * (1 + talents.dmgLv * 0.2);
    const critChance = talents.critLv * 0.05;
    const basePlayerDmg = 30 * dmgMult * (1 + playerDamageLevel * 0.25);

    if (p.cooldown <= 0 && enemies.length > 0) {
        let target = null, bestD = p.atkRange;
        enemies.forEach(e => { const d = dist(p.x, p.y, e.x, e.y); if (d < bestD) { bestD = d; target = e; } });
        if (target) {
            p.angle = Math.atan2(target.y - p.y, target.x - p.x);
            const crit = Math.random() < critChance;
            bullets.push({
                x: p.x, y: p.y, target, dmg: basePlayerDmg * (crit ? 2 : 1),
                speed: 16, color: crit ? '#fbbf24' : '#38bdf8', size: crit ? 6 : 4,
                crit, kind: 'player'
            });
            p.cooldown = isOverclocked ? 4 : 9;
            addParticles(p.x + Math.cos(p.angle) * 16, p.y + Math.sin(p.angle) * 16, '#7dd3fc', 2, 4);
        }
    }

    // 防衛塔
    turrets.forEach(t => {
        if (t.cd > 0) t.cd--;
        if (t.flash > 0) t.flash--;
        const def = TURRET_DEFS[t.type];
        const range = def.range * (1 + talents.rangeLv * 0.1) * (1 + (t.lv - 1) * 0.06);
        const dmg = def.dmg * dmgMult * (1 + turretDamageLevel * 0.2) * Math.pow(1.22, t.lv - 1);

        // 黑洞塔持續效果
        if (t.type === 'blackhole') {
            enemies.forEach(e => {
                const d = dist(t.x, t.y, e.x, e.y);
                if (d < range) {
                    damageEnemy(e, dmg / 12, '#c084fc', false);
                    e.x += (t.x - e.x) * 0.045;
                    e.y += (t.y - e.y) * 0.045;
                }
            });
            if (frame % 6 === 0) addParticles(t.x + rnd(-range * 0.6, range * 0.6), t.y + rnd(-range * 0.6, range * 0.6), '#c084fc', 1, 2);
        }

        if (t.cd > 0) return;

        let target = null, bestD = range;
        enemies.forEach(e => { const d = dist(t.x, t.y, e.x, e.y); if (d < bestD) { bestD = d; target = e; } });
        if (!target) return;

        t.angle = Math.atan2(target.y - t.y, target.x - t.x);
        t.flash = 5;

        if (t.type === 'gatling') {
            const crit = Math.random() < critChance;
            bullets.push({ x: t.x, y: t.y, target, dmg: dmg * (crit ? 2 : 1), speed: 18, color: crit ? '#fde047' : '#f59e0b', size: 3.5, crit, kind: 'gatling' });
            t.cd = isOverclocked ? 3 : Math.max(3, def.cd - (t.lv - 1));
        } else if (t.type === 'laser') {
            addBeam(t.x, t.y, target.x, target.y, '#3b82f6', 4, 10);
            damageEnemy(target, dmg, '#3b82f6', false);
            addParticles(target.x, target.y, '#93c5fd', 6, 8);
            t.cd = Math.max(8, def.cd - (t.lv - 1) * 2);
        } else if (t.type === 'mortar') {
            bullets.push({
                x: t.x, y: t.y, target, dmg, speed: 9, color: '#a855f7',
                splash: def.splash * (1 + (t.lv - 1) * 0.1), size: 7, kind: 'mortar'
            });
            t.cd = Math.max(18, def.cd - (t.lv - 1) * 3);
        } else if (t.type === 'frost') {
            addBeam(t.x, t.y, target.x, target.y, '#7dd3fc', 2, 8);
            enemies.forEach(e => {
                if (dist(e.x, e.y, target.x, target.y) < 70) {
                    e.slowT = 150;
                    e.slowFactor = Math.max(0.25, 1 - def.slow * (1 + (t.lv - 1) * 0.12));
                    addParticles(e.x, e.y, '#7dd3fc', 3, 5);
                }
            });
            damageEnemy(target, dmg, '#7dd3fc', false);
            t.cd = Math.max(6, def.cd - (t.lv - 1));
        } else if (t.type === 'venom') {
            bullets.push({ x: t.x, y: t.y, target, dmg, speed: 12, color: '#84cc16', size: 5, kind: 'venom', poison: def.poison * (1 + (t.lv - 1) * 0.3) });
            t.cd = Math.max(9, def.cd - (t.lv - 1) * 2);
        } else if (t.type === 'tesla') {
            let chainTarget = target;
            const hit = new Set();
            for (let c = 0; c < def.chain; c++) {
                if (!chainTarget) break;
                hit.add(chainTarget);
                if (c === 0) addBeam(t.x, t.y, chainTarget.x, chainTarget.y, '#facc15', 3, 9);
                else addBeam(prev.x, prev.y, chainTarget.x, chainTarget.y, '#fde047', 2.5, 8);
                damageEnemy(chainTarget, dmg * Math.pow(0.72, c), '#facc15', false);
                addParticles(chainTarget.x, chainTarget.y, '#fde047', 5, 8);
                var prev = chainTarget;
                let next = null, nd = 160;
                enemies.forEach(e => {
                    if (hit.has(e)) return;
                    const d = dist(prev.x, prev.y, e.x, e.y);
                    if (d < nd) { nd = d; next = e; }
                });
                chainTarget = next;
            }
            t.cd = Math.max(16, def.cd - (t.lv - 1) * 3);
        } else if (t.type === 'missile') {
            bullets.push({
                x: t.x, y: t.y, target, dmg, speed: 8, color: '#fb7185',
                splash: def.splash * (1 + (t.lv - 1) * 0.1), size: 6, kind: 'missile'
            });
            t.cd = Math.max(35, def.cd - (t.lv - 1) * 6);
        } else if (t.type === 'railgun') {
            const ang = Math.atan2(target.y - t.y, target.x - t.x);
            const len = range * 1.6;
            const ex = t.x + Math.cos(ang) * len, ey = t.y + Math.sin(ang) * len;
            addBeam(t.x, t.y, ex, ey, '#22d3ee', 7, 14);
            addShock(t.x, t.y, '#22d3ee', 6, 70, 1);
            enemies.forEach(e => {
                // 點到直線距離
                const dx = ex - t.x, dy = ey - t.y;
                const l2 = dx * dx + dy * dy;
                let u = ((e.x - t.x) * dx + (e.y - t.y) * dy) / l2;
                u = Math.max(0, Math.min(1, u));
                const px = t.x + u * dx, py = t.y + u * dy;
                if (dist(e.x, e.y, px, py) < 26) {
                    damageEnemy(e, dmg, '#22d3ee', false);
                    addParticles(e.x, e.y, '#67e8f9', 8, 10);
                }
            });
            t.cd = Math.max(60, def.cd - (t.lv - 1) * 10);
        }
    });

    // 子彈
    for (let i = bullets.length - 1; i >= 0; i--) {
        const bul = bullets[i];
        const tx = bul.target && !bul.target.dead ? bul.target.x : (bul.lastX || bul.x);
        const ty = bul.target && !bul.target.dead ? bul.target.y : (bul.lastY || bul.y);
        bul.lastX = tx; bul.lastY = ty;

        const dx = tx - bul.x, dy = ty - bul.y;
        const d = Math.hypot(dx, dy);
        if (d < 14) {
            if (bul.splash) {
                addShock(bul.x, bul.y, bul.color, 6, bul.splash, 1);
                addParticles(bul.x, bul.y, bul.color, 12, 10);
                enemies.forEach(e => {
                    if (dist(bul.x, bul.y, e.x, e.y) < bul.splash) damageEnemy(e, bul.dmg, bul.color, false);
                });
                triggerShake(8);
            } else if (bul.target && !bul.target.dead) {
                damageEnemy(bul.target, bul.dmg, bul.color, bul.crit);
                addParticles(bul.x, bul.y, bul.color, 4, 6);
                if (bul.poison) { bul.target.poison = 180; bul.target.poisonDmg = bul.poison; }
            }
            bullets.splice(i, 1);
        } else if (d > 0) {
            bul.x += (dx / d) * bul.speed;
            bul.y += (dy / d) * bul.speed;
            if (bul.kind === 'missile' || bul.kind === 'mortar') {
                addParticles(bul.x, bul.y, bul.color, 1, 1.5);
            }
        }
    }

    // 敵群
    const freezeMul = freezeTimer > 0 ? 0.15 : 1;
    enemies.forEach(e => {
        if (e.dead) return;
        if (e.hitFlash > 0) e.hitFlash--;
        if (e.slowT > 0) e.slowT--;
        const slow = e.slowT > 0 ? e.slowFactor : 1;

        // 中毒
        if (e.poison > 0) {
            e.poison--;
            damageEnemy(e, e.poisonDmg / 6, '#84cc16', false);
            if (frame % 8 === 0) addParticles(e.x, e.y, '#84cc16', 1, 2);
        }

        // 治療蟲
        if (ENEMY_DEFS[e.type].heal && frame % 30 === 0) {
            enemies.forEach(o => {
                if (o === e || o.dead) return;
                if (dist(o.x, o.y, e.x, e.y) < 130) {
                    o.hp = Math.min(o.maxHp, o.hp + o.maxHp * 0.06);
                    addParticles(o.x, o.y, '#14b8a6', 3, 4);
                }
            });
        }

        // 引力奇點
        if (singularityTimer > 0) {
            const cx = W / 2, cy = H / 2;
            e.x += (cx - e.x) * 0.012;
            e.y += (cy - e.y) * 0.012;
            if (frame % 10 === 0) damageEnemy(e, 12, '#c084fc', false);
        }

        e.x -= e.speed * slow * freezeMul;

        if (!e.dead && e.x < -50) {
            e.x = W + 50;
            e.y = rnd(90, H - 90);
            e.hp = Math.min(e.maxHp, e.hp + e.maxHp * 0.2);
            addParticles(W, e.y, '#ef4444', 6, 6);
        }
    });

    // 清理死亡敵人
    if (enemies.some(e => e.dead)) {
        enemies = enemies.filter(e => !e.dead);
    }

    // 特效
    if (shakeTime > 0) shakeTime--;
    for (let i = floatTexts.length - 1; i >= 0; i--) {
        const f = floatTexts[i];
        f.y += f.vy; f.alpha -= 0.018;
        if (f.alpha <= 0) floatTexts.splice(i, 1);
    }
    for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx; pt.y += pt.vy;
        pt.vx *= 0.96; pt.vy *= 0.96;
        pt.alpha -= pt.decay;
        if (pt.alpha <= 0) particles.splice(i, 1);
    }
    for (let i = beams.length - 1; i >= 0; i--) {
        beams[i].life--;
        if (beams[i].life <= 0) beams.splice(i, 1);
    }
    for (let i = shocks.length - 1; i >= 0; i--) {
        const s = shocks[i];
        s.r += (s.maxR - s.r) * 0.14;
        s.life -= 0.045;
        if (s.life <= 0) shocks.splice(i, 1);
    }

    // 成就
    if (frame % 30 === 0) checkAchievements();

    // UI 同步
    if (frame % 6 === 0) updateUI();
    if (frame % 180 === 0) saveGame();
}

function center(bld) { return { x: bld.x + bld.w / 2, y: bld.y + bld.h / 2 }; }

function processConvert(obj, from, to, bld) {
    const idx = obj.bag.findIndex(i => i.type === from);
    if (idx >= 0) {
        obj.bag[idx] = { type: to };
        addParticles(bld.x + bld.w / 2, bld.y + bld.h / 2, ITEMS[to].color, 5, 5);
    }
}

function interact(obj, b) {
    // 撿礦
    for (let i = items.length - 1; i >= 0; i--) {
        if (obj.bag.length >= capacity) break;
        if (dist(obj.x, obj.y, items[i].x, items[i].y) < 30) {
            obj.bag.push(items.splice(i, 1)[0]);
        }
    }

    const cSmelt = center(b.smelter);
    if (dist(obj.x, obj.y, cSmelt.x, cSmelt.y) < 52) processConvert(obj, 'RAW', 'STEEL', b.smelter);
    if (b.chipFab) { const c = center(b.chipFab); if (dist(obj.x, obj.y, c.x, c.y) < 52) processConvert(obj, 'STEEL', 'CHIP', b.chipFab); }
    if (b.nukeFab) { const c = center(b.nukeFab); if (dist(obj.x, obj.y, c.x, c.y) < 52) processConvert(obj, 'CHIP', 'BATTERY', b.nukeFab); }
    if (b.qFab) { const c = center(b.qFab); if (dist(obj.x, obj.y, c.x, c.y) < 52) processConvert(obj, 'BATTERY', 'CORE', b.qFab); }
    if (b.antiFab) { const c = center(b.antiFab); if (dist(obj.x, obj.y, c.x, c.y) < 52) processConvert(obj, 'CORE', 'ANTIM', b.antiFab); }

    const cHub = center(b.hub);
    if (dist(obj.x, obj.y, cHub.x, cHub.y) < 74 && obj.bag.length > 0) {
        const mult = (1 + darkMatter * 0.08) * (1 + talents.moneyLv * 0.25);
        const total = obj.bag.reduce((s, it) => s + ITEMS[it.type].val, 0) * mult;
        obj.bag = [];
        money += total;
        addFloat(cHub.x, cHub.y - 30, `+$${Math.floor(total).toLocaleString()}`, '#4ade80', 13);
    }
}

/* =========================================================
   UI 更新
   ========================================================= */
function updateUI() {
    document.getElementById('m').innerText = Math.floor(money).toLocaleString();
    document.getElementById('dm').innerText = darkMatter;
    document.getElementById('waveNum').innerText = wave;
    document.getElementById('enemyCount').innerText = enemies.length;
    document.getElementById('comboNum').innerText = combo;
    document.getElementById('waveTimer').innerText = isWaveActive ? '戰鬥中' : Math.ceil(waveTimer / 60) + 's';

    for (let i = 0; i < 4; i++) {
        const el = document.getElementById('cd' + (i + 1));
        const btn = document.querySelector(`.skill-btn[data-skill="${i + 1}"]`);
        if (skillCd[i] > 0) {
            el.innerText = Math.ceil(skillCd[i] / 60) + 's';
            btn.classList.add('cooling');
        } else {
            el.innerText = '就緒';
            btn.classList.remove('cooling');
        }
    }

    document.getElementById('questText').innerText = quest.desc;
    document.getElementById('questProg').innerText = `${quest.current}/${quest.target}`;

    document.getElementById('tDmgCost').innerText = `${(talents.dmgLv + 1) * 5} DM`;
    document.getElementById('tSpdCost').innerText = `${(talents.spdLv + 1) * 5} DM`;
    document.getElementById('tRangeCost').innerText = `${(talents.rangeLv + 1) * 5} DM`;
    document.getElementById('tCritCost').innerText = `${(talents.critLv + 1) * 5} DM`;
    document.getElementById('tMoneyCost').innerText = `${(talents.moneyLv + 1) * 5} DM`;

    // 塔價格
    TURRET_ORDER.forEach(id => {
        const el = document.querySelector(`[data-cost="${id}"]`);
        if (!el) return;
        const c = getTurretCost(id);
        el.innerText = '$' + c.toLocaleString();
        const btn = el.closest('button');
        if (btn) btn.disabled = money < c;
    });

    document.getElementById('minerLv').innerText = minerLevel;
    document.getElementById('capLv').innerText = capacity;
    document.getElementById('bCost').innerText = `$${Math.floor(500 * Math.pow(1.3, bots.length)).toLocaleString()}`;
    document.getElementById('mCost').innerText = `$${Math.floor(1000 * Math.pow(1.5, minerLevel)).toLocaleString()}`;
    document.getElementById('cCost').innerText = `$${Math.floor(1500 * (capacity / 2)).toLocaleString()}`;
    document.getElementById('playerDamageLv').innerText = playerDamageLevel;
    document.getElementById('playerDamageCost').innerText = `$${Math.floor(1000 * Math.pow(1.6, playerDamageLevel)).toLocaleString()}`;
    document.getElementById('turretDamageLv').innerText = turretDamageLevel;
    document.getElementById('turretDamageCost').innerText = `$${Math.floor(1500 * Math.pow(1.6, turretDamageLevel)).toLocaleString()}`;

    document.getElementById('rebirthGain').innerText = `+${Math.floor(money / 100000)} DM`;

    // 工廠解鎖按鈕狀態
    document.querySelectorAll('[data-unlock]').forEach(btn => {
        const tier = parseInt(btn.dataset.unlock, 10);
        btn.disabled = techTier !== tier - 1;
        if (techTier >= tier) btn.style.opacity = '0.3';
        else btn.style.opacity = '';
    });

    // 天賦按鈕
    document.querySelectorAll('[data-talent]').forEach(btn => {
        const key = btn.dataset.talent + 'Lv';
        btn.disabled = darkMatter < (talents[key] + 1) * 5;
    });

    if (selectedTurret) updateInspector();
}

/* =========================================================
   繪製
   ========================================================= */
function draw() {
    const time = frame / 60;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // 背景
    const bg = ctx.createRadialGradient(W * 0.5, H * 0.45, 60, W * 0.5, H * 0.45, Math.max(W, H) * 0.8);
    bg.addColorStop(0, '#0b1729');
    bg.addColorStop(1, '#020617');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // 星空
    for (let i = 0; i < 60; i++) {
        const sx = ((i * 137.5) % W);
        const sy = ((i * 219.3) % H);
        const tw = 0.35 + 0.5 * Math.abs(Math.sin(time * 0.8 + i));
        ctx.fillStyle = `rgba(148,197,253,${tw * 0.5})`;
        ctx.fillRect(sx, sy, 1.6, 1.6);
    }

    // 網格
    ctx.strokeStyle = 'rgba(30, 41, 59, 0.45)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x < W; x += 56) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = 0; y < H; y += 56) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();

    ctx.save();
    if (shakeTime > 0) {
        const k = shakeTime / 26;
        ctx.translate(rnd(-9, 9) * k, rnd(-9, 9) * k);
    }

    const b = getBuildings();

    // 建築物
    Object.values(b).forEach(bld => drawBuilding(bld, time));

    // 塔
    turrets.forEach(t => drawTurret(t, time));

    // 放置預覽
    if (placingTurret) {
        const def = TURRET_DEFS[placingTurret];
        const mx = mouseX || p.x, my = mouseY || p.y;
        const range = def.range * (1 + talents.rangeLv * 0.1);
        ctx.save();
        ctx.globalAlpha = 0.28;
        ctx.fillStyle = def.color;
        ctx.beginPath(); ctx.arc(mx, my, range, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 0.7;
        ctx.strokeStyle = def.color; ctx.lineWidth = 1.5;
        ctx.setLineDash([6, 6]);
        ctx.beginPath(); ctx.arc(mx, my, range, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 0.85;
        drawTurretShape(mx, my, placingTurret, 1, 0, time, 0);
        ctx.restore();
    }

    // 選中的塔
    if (selectedTurret && turrets.includes(selectedTurret)) {
        const def = TURRET_DEFS[selectedTurret.type];
        const range = def.range * (1 + talents.rangeLv * 0.1) * (1 + (selectedTurret.lv - 1) * 0.06);
        ctx.save();
        ctx.strokeStyle = def.color;
        ctx.globalAlpha = 0.55;
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 8]);
        ctx.beginPath(); ctx.arc(selectedTurret.x, selectedTurret.y, range, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 0.9;
        ctx.beginPath(); ctx.arc(selectedTurret.x, selectedTurret.y, 30, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
    }

    // 光束
    beams.forEach(bm => {
        const a = bm.life / bm.maxLife;
        ctx.save();
        ctx.globalAlpha = a;
        ctx.strokeStyle = bm.color;
        ctx.lineWidth = bm.width;
        ctx.shadowColor = bm.color;
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.moveTo(bm.x1, bm.y1);
        ctx.lineTo(bm.x2, bm.y2);
        ctx.stroke();
        ctx.restore();
    });

    // 衝擊波
    shocks.forEach(s => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, s.life) * 0.6;
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
    });

    // 掉落物
    items.forEach(it => {
        const col = ITEMS[it.type].color;
        const bob = Math.sin(time * 4 + (it.bob || 0)) * 3;
        ctx.save();
        ctx.translate(it.x, it.y + bob);
        ctx.rotate(time * 1.2 + (it.bob || 0));
        ctx.shadowColor = col; ctx.shadowBlur = 10;
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.roundRect(-7, -7, 14, 14, 3); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.beginPath(); ctx.roundRect(-4, -5, 5, 4, 1.5); ctx.fill();
        ctx.restore();
    });

    // 子彈
    bullets.forEach(bul => {
        ctx.save();
        ctx.shadowColor = bul.color;
        ctx.shadowBlur = 10;
        ctx.fillStyle = bul.color;
        ctx.beginPath();
        ctx.arc(bul.x, bul.y, bul.size || 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });

    // 敵人
    enemies.forEach(e => drawEnemy(e, time));

    // 機兵
    bots.forEach(bot => drawBot(bot, time));

    // 玩家
    drawPlayer(p, time);

    // 粒子
    particles.forEach(pt => {
        ctx.globalAlpha = Math.max(0, pt.alpha);
        ctx.fillStyle = pt.color;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    // 浮動文字
    floatTexts.forEach(f => {
        ctx.globalAlpha = Math.max(0, f.alpha);
        ctx.fillStyle = f.color;
        ctx.font = `900 ${f.size}px 'Segoe UI', sans-serif`;
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 4;
        ctx.fillText(f.text, f.x, f.y);
        ctx.shadowBlur = 0;
    });
    ctx.globalAlpha = 1;
    ctx.textAlign = 'start';

    // 凍結 / 奇點覆蓋
    if (freezeTimer > 0) {
        ctx.fillStyle = `rgba(125,211,252,${0.10 * (freezeTimer / 300)})`;
        ctx.fillRect(0, 0, W, H);
    }
    if (singularityTimer > 0) {
        const g = ctx.createRadialGradient(W / 2, H / 2, 10, W / 2, H / 2, Math.max(W, H) * 0.55);
        g.addColorStop(0, `rgba(192,132,252,${0.25 * (singularityTimer / 240)})`);
        g.addColorStop(1, 'rgba(192,132,252,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
    }

    ctx.restore();

    update();
    requestAnimationFrame(draw);
}

/* ---------- 建築繪製 ---------- */
function drawBuilding(bld, time) {
    const { x, y, w, h, color, label } = bld;
    ctx.save();

    // 底座陰影
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath(); ctx.roundRect(x + 4, y + 6, w, h, 10); ctx.fill();

    // 主體
    const g = ctx.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, 'rgba(30,41,59,0.98)');
    g.addColorStop(1, 'rgba(8,15,30,0.98)');
    ctx.fillStyle = g;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.shadowColor = color;
    ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;

    // 內部細節依類型
    ctx.save();
    ctx.beginPath(); ctx.roundRect(x + 2, y + 2, w - 4, h - 4, 8); ctx.clip();

    if (bld.kind === 'mine') {
        // 鑽頭
        ctx.fillStyle = color;
        const rot = time * 2;
        ctx.translate(x + w / 2, y + h / 2);
        ctx.rotate(rot);
        ctx.beginPath();
        ctx.moveTo(0, -16); ctx.lineTo(12, 10); ctx.lineTo(-12, 10);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#0f172a';
        ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
    } else if (bld.kind === 'hub') {
        // 總部：窗格 + 旋轉核心
        for (let i = 0; i < 4; i++) {
            for (let j = 0; j < 3; j++) {
                const lit = Math.sin(time * 2 + i * 1.7 + j) > 0;
                ctx.fillStyle = lit ? 'rgba(56,189,248,0.85)' : 'rgba(56,189,248,0.18)';
                ctx.fillRect(x + 14 + i * 28, y + 14 + j * 22, 16, 12);
            }
        }
        ctx.save();
        ctx.translate(x + w / 2, y + h - 22);
        ctx.rotate(time * 1.5);
        ctx.strokeStyle = 'rgba(56,189,248,0.85)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < 3; i++) {
            const a = i * Math.PI * 2 / 3;
            ctx.moveTo(Math.cos(a) * 11, Math.sin(a) * 11);
            ctx.lineTo(Math.cos(a + Math.PI) * 11, Math.sin(a + Math.PI) * 11);
        }
        ctx.stroke();
        ctx.restore();
    } else {
        // 工廠：管道 + 煙囪 + 指示燈
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x + 16, y + h - 12);
        ctx.lineTo(x + 16, y + 24);
        ctx.lineTo(x + w - 16, y + 24);
        ctx.stroke();
        // 煙囪
        ctx.fillStyle = color;
        ctx.fillRect(x + w - 30, y + 10, 10, 24);
        // 指示燈
        for (let i = 0; i < 3; i++) {
            const on = Math.sin(time * 3 + i * 2) > 0;
            ctx.fillStyle = on ? color : 'rgba(100,116,139,0.5)';
            ctx.beginPath(); ctx.arc(x + 26 + i * 18, y + h - 16, 3.5, 0, Math.PI * 2); ctx.fill();
        }
        // 輸送帶
        ctx.strokeStyle = 'rgba(148,163,184,0.35)';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(x + 10, y + h - 8);
        ctx.lineTo(x + w - 10, y + h - 8);
        ctx.stroke();
        const off = (time * 40) % 16;
        ctx.strokeStyle = 'rgba(226,232,240,0.5)';
        ctx.lineWidth = 2;
        for (let i = -1; i < 8; i++) {
            const px = x + 10 + ((i * 16 + off) % (w - 20));
            ctx.beginPath();
            ctx.moveTo(px, y + h - 12);
            ctx.lineTo(px, y + h - 4);
            ctx.stroke();
        }
    }
    ctx.restore();

    // 標籤
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(2,6,23,0.85)';
    const tw = ctx.measureText(label).width + 12;
    ctx.beginPath(); ctx.roundRect(x + w / 2 - tw / 2, y - 20, tw, 16, 8); ctx.fill();
    ctx.fillStyle = color;
    ctx.fillText(label, x + w / 2, y - 8);
    ctx.textAlign = 'start';

    ctx.restore();
}

/* ---------- 塔繪製 ---------- */
function drawTurret(t, time) {
    drawTurretShape(t.x, t.y, t.type, t.lv, t.angle, time, t.flash);
}

function drawTurretShape(x, y, type, lv, angle, time, flash) {
    const def = TURRET_DEFS[type];
    const col = flash > 0 ? '#ffffff' : def.color;

    ctx.save();
    ctx.translate(x, y);

    // 底座光環
    const lg = ctx.createRadialGradient(0, 0, 4, 0, 0, 30);
    lg.addColorStop(0, hexA(def.color, 0.35));
    lg.addColorStop(1, hexA(def.color, 0));
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();

    // 底座
    ctx.fillStyle = '#0f172a';
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(-17, -17, 34, 34, 8); ctx.fill(); ctx.stroke();

    // 等級小點
    ctx.fillStyle = def.color;
    for (let i = 0; i < Math.min(lv, 6); i++) {
        ctx.beginPath();
        ctx.arc(-13 + i * 5.2, 20, 1.8, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.rotate(angle);
    ctx.shadowColor = def.color;
    ctx.shadowBlur = 10;

    switch (type) {
        case 'gatling': {
            ctx.fillStyle = col;
            ctx.beginPath(); ctx.roundRect(-2, -4, 20, 8, 3); ctx.fill();
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath(); ctx.roundRect(14, -5, 8, 3, 1.5); ctx.fill();
            ctx.beginPath(); ctx.roundRect(14, 2, 8, 3, 1.5); ctx.fill();
            ctx.fillStyle = def.color;
            ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
            break;
        }
        case 'laser': {
            ctx.fillStyle = col;
            ctx.beginPath();
            ctx.moveTo(20, 0); ctx.lineTo(4, -8); ctx.lineTo(-4, 0); ctx.lineTo(4, 8);
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#dbeafe';
            ctx.beginPath(); ctx.arc(-2, 0, 6, 0, Math.PI * 2); ctx.fill();
            break;
        }
        case 'mortar': {
            ctx.fillStyle = col;
            ctx.beginPath(); ctx.roundRect(2, -6, 20, 12, 4); ctx.fill();
            ctx.fillStyle = '#0f172a';
            ctx.beginPath(); ctx.arc(21, 0, 4.5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = def.color;
            ctx.beginPath(); ctx.arc(-2, 0, 8, 0, Math.PI * 2); ctx.fill();
            break;
        }
        case 'frost': {
            ctx.rotate(time * 0.8);
            ctx.fillStyle = col;
            for (let i = 0; i < 6; i++) {
                ctx.rotate(Math.PI / 3);
                ctx.beginPath();
                ctx.moveTo(0, 0); ctx.lineTo(6, -14); ctx.lineTo(-6, -14);
                ctx.closePath(); ctx.fill();
            }
            ctx.fillStyle = '#e0f2fe';
            ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
            break;
        }
        case 'venom': {
            ctx.fillStyle = col;
            ctx.beginPath(); ctx.roundRect(-6, -9, 22, 18, 6); ctx.fill();
            ctx.fillStyle = '#ecfccb';
            for (let i = 0; i < 3; i++) {
                const bb = Math.sin(time * 4 + i * 2) * 2;
                ctx.beginPath(); ctx.arc(6 + i * 5, -2 + bb, 2.4, 0, Math.PI * 2); ctx.fill();
            }
            break;
        }
        case 'tesla': {
            ctx.fillStyle = col;
            ctx.beginPath(); ctx.roundRect(-4, -4, 8, 20, 3); ctx.fill();
            ctx.strokeStyle = '#fef08a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < 4; i++) {
                ctx.moveTo(0, -18 + i * 4);
                ctx.lineTo((i % 2 ? 7 : -7), -16 + i * 4);
            }
            ctx.stroke();
            ctx.fillStyle = '#fef9c3';
            ctx.beginPath(); ctx.arc(0, -19, 5, 0, Math.PI * 2); ctx.fill();
            break;
        }
        case 'blackhole': {
            ctx.save();
            ctx.rotate(time * 1.6);
            const grd = ctx.createRadialGradient(0, 0, 2, 0, 0, 20);
            grd.addColorStop(0, '#000000');
            grd.addColorStop(0.55, def.color);
            grd.addColorStop(1, 'rgba(192,132,252,0)');
            ctx.fillStyle = grd;
            ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#f5d0fe';
            ctx.lineWidth = 1.6;
            ctx.beginPath(); ctx.ellipse(0, 0, 19, 7, 0, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.ellipse(0, 0, 19, 7, Math.PI / 2, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
            break;
        }
        case 'missile': {
            ctx.fillStyle = col;
            ctx.beginPath(); ctx.roundRect(-8, -12, 26, 24, 5); ctx.fill();
            ctx.fillStyle = '#0f172a';
            for (let i = 0; i < 2; i++) {
                for (let j = 0; j < 2; j++) {
                    ctx.beginPath();
                    ctx.arc(2 + i * 10, -6 + j * 12, 3.2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            break;
        }
        case 'railgun': {
            ctx.fillStyle = col;
            ctx.beginPath(); ctx.roundRect(-6, -5, 34, 10, 3); ctx.fill();
            ctx.strokeStyle = '#a5f3fc';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(6, -2.5); ctx.lineTo(26, -2.5); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(6, 2.5); ctx.lineTo(26, 2.5); ctx.stroke();
            ctx.fillStyle = '#67e8f9';
            ctx.beginPath(); ctx.arc(-4, 0, 7, 0, Math.PI * 2); ctx.fill();
            break;
        }
    }
    ctx.restore();
    ctx.restore();
}

function hexA(hex, a) {
    const c = hex.replace('#', '');
    const n = parseInt(c.length === 3 ? c.split('').map(x => x + x).join('') : c, 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

/* ---------- 敵人繪製 ---------- */
function drawEnemy(e, time) {
    const def = ENEMY_DEFS[e.type];
    const s = def.size;
    const bob = Math.sin(time * 7 + e.seed) * (def.bob || 0);
    const col = e.hitFlash > 0 ? '#ffffff' : def.color;

    ctx.save();
    ctx.translate(e.x, e.y + bob);
    if (def.alpha) ctx.globalAlpha = def.alpha;

    ctx.shadowColor = def.color;
    ctx.shadowBlur = def.glow || 12;

    switch (def.shape) {
        case 'bug': {
            ctx.strokeStyle = col;
            ctx.lineWidth = 2;
            for (let i = -1; i <= 1; i++) {
                const wig = Math.sin(time * 12 + i * 2 + e.seed) * 3.5;
                ctx.beginPath();
                ctx.moveTo(i * s * 0.45, 0);
                ctx.lineTo(i * s * 0.9, -s * 0.75 + wig);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(i * s * 0.45, 0);
                ctx.lineTo(i * s * 0.9, s * 0.75 - wig);
                ctx.stroke();
            }
            ctx.fillStyle = col;
            ctx.beginPath();
            ctx.ellipse(0, 0, s, s * 0.72, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.beginPath();
            ctx.ellipse(-s * 0.2, -s * 0.22, s * 0.5, s * 0.28, -0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-s * 0.62, -s * 0.16, s * 0.16, 0, Math.PI * 2);
            ctx.arc(-s * 0.62, s * 0.16, s * 0.16, 0, Math.PI * 2);
            ctx.fill();
            break;
        }
        case 'dart': {
            // 尾跡
            const tg = ctx.createLinearGradient(0, 0, s * 3, 0);
            tg.addColorStop(0, hexA(def.color, 0.55));
            tg.addColorStop(1, hexA(def.color, 0));
            ctx.fillStyle = tg;
            ctx.beginPath();
            ctx.moveTo(0, -s * 0.5); ctx.lineTo(s * 3, 0); ctx.lineTo(0, s * 0.5);
            ctx.closePath(); ctx.fill();

            ctx.fillStyle = col;
            ctx.beginPath();
            ctx.moveTo(s * 1.3, 0);
            ctx.lineTo(-s * 0.8, -s * 0.72);
            ctx.lineTo(-s * 0.35, 0);
            ctx.lineTo(-s * 0.8, s * 0.72);
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(s * 0.35, 0, s * 0.2, 0, Math.PI * 2); ctx.fill();
            break;
        }
        case 'hex': {
            ctx.fillStyle = col;
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const a = i * Math.PI / 3 + Math.PI / 6;
                const px = Math.cos(a) * s, py = Math.sin(a) * s;
                i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
            }
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.55)';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#1e293b';
            ctx.beginPath(); ctx.arc(0, 0, s * 0.45, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#f87171';
            ctx.beginPath();
            ctx.arc(0, 0, s * 0.22 + Math.sin(time * 6) * 1.5, 0, Math.PI * 2);
            ctx.fill();
            break;
        }
        case 'diamond': {
            const pulse = 1 + Math.sin(time * 8 + e.seed) * 0.12;
            ctx.save();
            ctx.scale(pulse, pulse);
            ctx.fillStyle = col;
            ctx.beginPath();
            ctx.moveTo(s, 0); ctx.lineTo(0, -s); ctx.lineTo(-s, 0); ctx.lineTo(0, s);
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.45)';
            ctx.beginPath();
            ctx.moveTo(s * 0.55, 0); ctx.lineTo(0, -s * 0.55); ctx.lineTo(-s * 0.55, 0); ctx.lineTo(0, s * 0.55);
            ctx.closePath(); ctx.fill();
            ctx.restore();
            break;
        }
        case 'blob': {
            ctx.fillStyle = col;
            ctx.beginPath();
            for (let i = 0; i <= 12; i++) {
                const a = (i / 12) * Math.PI * 2;
                const rr = s * (0.82 + Math.sin(a * 3 + time * 3 + e.seed) * 0.16);
                const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
                i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
            }
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            ctx.beginPath();
            ctx.arc(-s * 0.25, -s * 0.25, s * 0.22, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(s * 0.3, s * 0.1, s * 0.14, 0, Math.PI * 2);
            ctx.fill();
            break;
        }
        case 'star': {
            ctx.save();
            ctx.rotate(time * 0.9 + e.seed);
            ctx.fillStyle = col;
            ctx.beginPath();
            for (let i = 0; i < 10; i++) {
                const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
                const rr = i % 2 ? s * 0.45 : s;
                const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
                i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
            }
            ctx.closePath(); ctx.fill();
            ctx.restore();
            // 治療光環
            ctx.strokeStyle = hexA(def.color, 0.4 + Math.sin(time * 3) * 0.2);
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, 0, s * 2.2, 0, Math.PI * 2); ctx.stroke();
            break;
        }
        case 'ring': {
            ctx.fillStyle = col;
            ctx.beginPath(); ctx.arc(0, 0, s * 0.7, 0, Math.PI * 2); ctx.fill();
            // 護盾弧
            const shieldRatio = e.maxShield > 0 ? e.shield / e.maxShield : 0;
            if (shieldRatio > 0) {
                ctx.strokeStyle = '#7dd3fc';
                ctx.lineWidth = 3.5;
                ctx.shadowColor = '#7dd3fc';
                ctx.shadowBlur = 14;
                ctx.beginPath();
                ctx.arc(0, 0, s * 1.15, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * shieldRatio);
                ctx.stroke();
            }
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(0, 0, s * 0.24, 0, Math.PI * 2); ctx.fill();
            break;
        }
        case 'ghost': {
            ctx.globalAlpha = 0.62;
            ctx.fillStyle = col;
            ctx.beginPath();
            ctx.arc(0, -s * 0.2, s * 0.85, Math.PI, 0);
            for (let i = 0; i <= 4; i++) {
                const px = s * 0.85 - (i / 4) * s * 1.7;
                const py = s * 0.55 + (i % 2 ? s * 0.3 : 0);
                ctx.lineTo(px, py);
            }
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(-s * 0.28, -s * 0.28, s * 0.18, 0, Math.PI * 2);
            ctx.arc(s * 0.28, -s * 0.28, s * 0.18, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
            break;
        }
        case 'boss': {
            // 外環
            ctx.save();
            ctx.rotate(time * 0.7);
            ctx.strokeStyle = hexA(def.color, 0.65);
            ctx.lineWidth = 4;
            ctx.beginPath();
            for (let i = 0; i < 3; i++) {
                const a = (i / 3) * Math.PI * 2;
                ctx.moveTo(Math.cos(a) * s * 1.5, Math.sin(a) * s * 1.5);
                ctx.arc(0, 0, s * 1.5, a, a + 1.1);
            }
            ctx.stroke();
            ctx.restore();
            // 本體
            ctx.fillStyle = col;
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
                const a = (i / 8) * Math.PI * 2 + time * 0.3;
                const rr = i % 2 ? s * 0.7 : s;
                const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
                i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
            }
            ctx.closePath(); ctx.fill();
            // 核心眼
            ctx.fillStyle = '#fde68a';
            ctx.beginPath();
            ctx.arc(0, 0, s * 0.34, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#7f1d1d';
            ctx.beginPath();
            ctx.arc(-s * 0.05, 0, s * 0.16, 0, Math.PI * 2);
            ctx.fill();
            break;
        }
    }
    ctx.restore();

    // 血條
    const barW = Math.max(22, s * 2.2);
    const topY = e.y + bob - s - (def.shape === 'boss' ? 26 : 12);
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.beginPath(); ctx.roundRect(e.x - barW / 2, topY, barW, 4.5, 2); ctx.fill();
    const hpRatio = Math.max(0, e.hp / e.maxHp);
    const hpColor = hpRatio > 0.5 ? '#22c55e' : hpRatio > 0.22 ? '#f59e0b' : '#ef4444';
    ctx.fillStyle = hpColor;
    ctx.beginPath(); ctx.roundRect(e.x - barW / 2, topY, barW * hpRatio, 4.5, 2); ctx.fill();
    if (e.maxShield > 0 && e.shield > 0) {
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath(); ctx.roundRect(e.x - barW / 2, topY - 5, barW * (e.shield / e.maxShield), 3, 1.5); ctx.fill();
    }
    ctx.restore();
}

/* ---------- 機兵繪製 ---------- */
function drawBot(bot, time) {
    const x = bot.x, y = bot.y;
    ctx.save();
    ctx.translate(x, y);

    // 推進器光
    const gg = ctx.createRadialGradient(0, 12, 1, 0, 12, 16);
    gg.addColorStop(0, 'rgba(56,189,248,0.7)');
    gg.addColorStop(1, 'rgba(56,189,248,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(0, 12, 16, 0, Math.PI * 2); ctx.fill();

    // 旋翼
    const spin = time * 16 + bot.phase;
    ctx.strokeStyle = 'rgba(125,211,252,0.75)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(spin) * 15, Math.sin(spin) * 15);
    ctx.lineTo(-Math.cos(spin) * 15, -Math.sin(spin) * 15);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(Math.cos(spin + Math.PI / 2) * 15, Math.sin(spin + Math.PI / 2) * 15);
    ctx.lineTo(-Math.cos(spin + Math.PI / 2) * 15, -Math.sin(spin + Math.PI / 2) * 15);
    ctx.stroke();

    // 機身
    const bg = ctx.createLinearGradient(-9, -9, 9, 9);
    bg.addColorStop(0, '#7dd3fc');
    bg.addColorStop(1, '#0369a1');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(0, 0, 9.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#e0f2fe';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#f0f9ff';
    ctx.beginPath(); ctx.arc(0, 0, 3.4, 0, Math.PI * 2); ctx.fill();

    ctx.restore();

    drawStack(bot);
}

/* ---------- 玩家繪製 ---------- */
function drawPlayer(obj, time) {
    const x = obj.x, y = obj.y;

    // 攻擊範圍
    ctx.save();
    ctx.strokeStyle = 'rgba(56,189,248,0.14)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 8]);
    ctx.beginPath(); ctx.arc(x, y, obj.atkRange, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // 光暈
    const glow = ctx.createRadialGradient(x, y, 3, x, y, 40);
    glow.addColorStop(0, 'rgba(56,189,248,0.45)');
    glow.addColorStop(1, 'rgba(56,189,248,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(x, y, 40, 0, Math.PI * 2); ctx.fill();

    // 旋轉外環
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(time * 1.1);
    ctx.strokeStyle = 'rgba(56,189,248,0.85)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
        const a = (i / 3) * Math.PI * 2;
        ctx.moveTo(Math.cos(a) * 21, Math.sin(a) * 21);
        ctx.arc(0, 0, 21, a, a + Math.PI / 3.2);
    }
    ctx.stroke();
    ctx.restore();

    // 機身
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2 - Math.PI / 6;
        const px = Math.cos(a) * 15, py = Math.sin(a) * 15;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
    const bodyG = ctx.createLinearGradient(-15, -15, 15, 15);
    bodyG.addColorStop(0, '#bae6fd');
    bodyG.addColorStop(0.5, '#38bdf8');
    bodyG.addColorStop(1, '#0369a1');
    ctx.fillStyle = bodyG;
    ctx.shadowColor = '#38bdf8';
    ctx.shadowBlur = 16;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#e0f2fe';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 炮口
    ctx.rotate(obj.angle || 0);
    ctx.fillStyle = '#0c4a6e';
    ctx.beginPath(); ctx.roundRect(9, -3.5, 14, 7, 3); ctx.fill();
    ctx.fillStyle = '#7dd3fc';
    ctx.beginPath(); ctx.roundRect(20, -2.5, 5, 5, 2); ctx.fill();

    // 核心
    ctx.rotate(-(obj.angle || 0));
    ctx.fillStyle = '#f0f9ff';
    ctx.beginPath(); ctx.arc(0, 0, 5.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0284c7';
    ctx.beginPath(); ctx.arc(0, 0, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    drawStack(obj);
}

/* ---------- 背包堆疊 ---------- */
function drawStack(obj) {
    obj.bag.forEach((it, i) => {
        const col = ITEMS[it.type].color;
        ctx.save();
        ctx.fillStyle = col;
        ctx.globalAlpha = 0.95;
        ctx.beginPath();
        ctx.roundRect(obj.x - 10, obj.y - 30 - i * 8, 20, 6, 2);
        ctx.fill();
        ctx.restore();
    });
}

/* =========================================================
   初始化
   ========================================================= */
buildTurretListUI();
buildAchListUI();
updateInspector();
updateUI();

window.addEventListener('pagehide', saveGame);
window.addEventListener('beforeunload', saveGame);

initializeTycoon().catch(error => {
    console.error('雨神大亨初始化失敗：', error);
    const st = document.getElementById('tycoon-leaderboard-status');
    if (st) st.textContent = '遊戲初始化失敗，請重新整理頁面。';
    requestAnimationFrame(draw);
});
