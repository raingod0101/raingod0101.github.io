<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>雨神大亨 · 征服</title>
<style>
    * { touch-action: none; user-select: none; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #020617; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; color: #e2e8f0; }

    #gameCanvas { position: fixed; inset: 0; display: block; cursor: grab; }
    #gameCanvas:active { cursor: grabbing; }

    /* ---- 頂部資源欄 ---- */
    #resourceBar {
        position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 6px; padding: 6px 10px; z-index: 20;
        background: rgba(15,23,42,0.92); border: 1px solid #38bdf8; border-radius: 14px;
        backdrop-filter: blur(8px); box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        flex-wrap: wrap; justify-content: center; max-width: 96vw;
    }
    .res-item { display: flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .res-item b { font-size: 13px; }
    .r-gold { color: #fbbf24; }
    .r-food { color: #4ade80; }
    .r-wood { color: #d97706; }
    .r-stone { color: #94a3b8; }
    .r-dm { color: #c084fc; }
    .r-land { color: #38bdf8; }

    /* ---- 小地圖 ---- */
    #minimapWrap {
        position: fixed; left: 8px; bottom: 8px; z-index: 20;
        border: 1px solid #38bdf8; border-radius: 10px; overflow: hidden;
        background: rgba(2,6,23,0.85); box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    }
    #minimap { display: block; cursor: pointer; }
    #zoomBtns { position: fixed; left: 8px; bottom: 148px; display: flex; gap: 4px; z-index: 20; }
    #zoomBtns button, .mini-btn {
        width: 30px; height: 30px; border-radius: 8px; border: 1px solid #38bdf8;
        background: rgba(15,23,42,0.92); color: #fff; font-weight: 900; font-size: 15px;
        cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    /* ---- 底部命令欄 ---- */
    #bottomBar {
        position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 5px; z-index: 20;
        background: rgba(15,23,42,0.92); border: 1px solid #334155; border-radius: 14px;
        padding: 5px; backdrop-filter: blur(8px); box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .cmd-btn {
        display: flex; flex-direction: column; align-items: center; gap: 1px;
        padding: 6px 10px; border-radius: 10px; border: 1px solid transparent;
        background: #1e293b; color: #cbd5e1; font-size: 9px; font-weight: 700;
        cursor: pointer; min-width: 54px; transition: all 0.15s;
    }
    .cmd-btn .ico { font-size: 17px; line-height: 1; }
    .cmd-btn:hover, .cmd-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; }

    /* ---- 側邊面板 ---- */
    #sidePanel {
        position: fixed; top: 58px; right: 8px; width: 320px; max-width: 62vw;
        max-height: calc(100vh - 130px); overflow-y: auto; z-index: 19;
        background: rgba(15,23,42,0.96); border: 1px solid #334155; border-radius: 12px;
        padding: 12px; display: none; flex-direction: column; gap: 8px;
        backdrop-filter: blur(10px); box-shadow: 0 8px 30px rgba(0,0,0,0.8);
    }
    #sidePanel.show { display: flex; }
    #sidePanel::-webkit-scrollbar { width: 5px; }
    #sidePanel::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 4px; }
    .panel-title { font-size: 13px; font-weight: 900; color: #38bdf8; display: flex; justify-content: space-between; align-items: center; }
    .panel-title button { background: #1e293b; border: 1px solid #64748b; color: #cbd5e1; border-radius: 6px; padding: 3px 8px; font-size: 10px; cursor: pointer; }

    .card {
        background: rgba(30,41,59,0.55); border: 1px solid #334155; border-radius: 9px;
        padding: 8px 9px; display: flex; flex-direction: column; gap: 5px;
    }
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .card-name { font-size: 12px; font-weight: 800; color: #f1f5f9; }
    .card-desc { font-size: 9.5px; color: #94a3b8; line-height: 1.4; }
    .act-btn {
        border: 1px solid #38bdf8; border-radius: 7px; background: linear-gradient(135deg,#1e293b,#0f172a);
        color: #fff; font-weight: 700; font-size: 10.5px; padding: 6px 9px; cursor: pointer; transition: all 0.15s;
    }
    .act-btn:hover:not(:disabled) { background: linear-gradient(135deg,#0284c7,#0369a1); }
    .act-btn:disabled { opacity: 0.35; border-color: #475569; cursor: not-allowed; }
    .act-btn.green { border-color: #4ade80; }
    .act-btn.green:hover:not(:disabled) { background: linear-gradient(135deg,#166534,#14532d); }
    .act-btn.red { border-color: #f87171; }
    .act-btn.red:hover:not(:disabled) { background: linear-gradient(135deg,#b91c1c,#991b1b); }
    .act-btn.purple { border-color: #c084fc; }
    .act-btn.purple:hover:not(:disabled) { background: linear-gradient(135deg,#7e22ce,#581c87); }
    .act-row { display: flex; gap: 6px; }
    .act-row .act-btn { flex: 1; }

    .tabs { display: grid; grid-template-columns: repeat(4,1fr); gap: 4px; }
    .tab { padding: 6px 2px; border-radius: 7px; background: #1e293b; color: #94a3b8; border: none; font-size: 10px; font-weight: 800; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .tab.active { background: #0284c7; color: #fff; }
    .tab .ico { font-size: 15px; }

    .unit-row {
        display: flex; justify-content: space-between; align-items: center; gap: 6px;
        padding: 6px 8px; background: rgba(8,47,73,0.45); border-radius: 8px; font-size: 11px;
    }
    .unit-row .u-name { display: flex; align-items: center; gap: 5px; font-weight: 800; }
    .qty-ctrl { display: flex; align-items: center; gap: 5px; }
    .qty-ctrl button { width: 24px; height: 24px; border-radius: 6px; border: 1px solid #38bdf8; background: #0f172a; color: #fff; font-weight: 900; font-size: 13px; cursor: pointer; }
    .qty-ctrl .q { min-width: 26px; text-align: center; font-weight: 900; color: #fbbf24; }

    /* ---- 戰鬥結算彈窗 ---- */
    #battleModal {
        position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center;
        background: rgba(2,6,23,0.88); padding: 16px;
    }
    #battleModal.show { display: flex; }
    .battle-card {
        width: min(440px, 94vw); background: #0b1020; border: 2px solid #38bdf8; border-radius: 16px;
        padding: 18px; display: flex; flex-direction: column; gap: 12px;
        box-shadow: 0 0 40px rgba(56,189,248,0.3);
    }
    .battle-title { font-size: 20px; font-weight: 900; text-align: center; }
    .battle-title.win { color: #4ade80; }
    .battle-title.lose { color: #f87171; }
    .battle-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-bottom: 1px dashed #1e293b; }

    /* ---- 提示橫幅 ---- */
    #toast {
        position: fixed; top: 74px; left: 50%; transform: translateX(-50%) translateY(-20px);
        background: rgba(15,23,42,0.96); border: 1px solid #38bdf8; border-radius: 10px;
        padding: 8px 16px; font-size: 12px; font-weight: 700; color: #e0f2fe; z-index: 50;
        opacity: 0; transition: all 0.25s; pointer-events: none; white-space: nowrap; max-width: 90vw; overflow: hidden;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ---- 出征模式提示 ---- */
    #modeHint {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(2,6,23,0.82); border: 1px solid #fbbf24; border-radius: 12px;
        padding: 10px 20px; font-size: 13px; font-weight: 900; color: #fbbf24; z-index: 30;
        display: none; pointer-events: none; text-align: center;
    }
    #modeHint.show { display: block; }

    @media (max-width: 720px) {
        #resourceBar { top: 4px; gap: 4px; padding: 5px 7px; border-radius: 10px; }
        .res-item { font-size: 10px; }
        .res-item b { font-size: 11px; }
        #sidePanel { top: 76px; width: 260px; max-width: 78vw; max-height: calc(100vh - 200px); padding: 9px; }
        #zoomBtns { bottom: 132px; }
        #zoomBtns button, .mini-btn { width: 27px; height: 27px; font-size: 13px; }
        #bottomBar { padding: 4px; gap: 3px; }
        .cmd-btn { padding: 5px 7px; min-width: 46px; font-size: 8px; }
        .cmd-btn .ico { font-size: 15px; }
        #minimapWrap { transform: scale(0.9); transform-origin: left bottom; }
    }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- 資源欄 -->
<div id="resourceBar">
    <span class="res-item r-gold">💰<b id="uiGold">0</b></span>
    <span class="res-item r-food">🌾<b id="uiFood">0</b></span>
    <span class="res-item r-wood">🪵<b id="uiWood">0</b></span>
    <span class="res-item r-stone">🪨<b id="uiStone">0</b></span>
    <span class="res-item r-dm">🌌<b id="uiDm">0</b></span>
    <span class="res-item r-land">🏳️<b id="uiLand">0</b></span>
</div>

<!-- 小地圖 -->
<div id="minimapWrap"><canvas id="minimap" width="180" height="120"></canvas></div>
<div id="zoomBtns">
    <button onclick="zoomBy(1.25)">+</button>
    <button onclick="zoomBy(0.8)">−</button>
    <button onclick="centerOnPlayer()" title="回到基地">🏠</button>
</div>

<!-- 底部命令欄 -->
<div id="bottomBar">
    <button class="cmd-btn" data-cmd="build"><span class="ico">🏗️</span>建造</button>
    <button class="cmd-btn" data-cmd="train"><span class="ico">⚔️</span>兵營</button>
    <button class="cmd-btn" data-cmd="army"><span class="ico">🛡️</span>軍隊</button>
    <button class="cmd-btn" data-cmd="conquest"><span class="ico">🚩</span>遠征</button>
    <button class="cmd-btn" data-cmd="tech"><span class="ico">🧬</span>轉生</button>
</div>

<!-- 側邊面板 -->
<div id="sidePanel">
    <div class="panel-title">
        <span id="panelTitle">面板</span>
        <button onclick="closePanel()">✕</button>
    </div>
    <div id="panelBody"></div>
</div>

<!-- 出征提示 -->
<div id="modeHint">🎯 點擊地圖上的目標領地開始遠征<br><span style="font-size:10px;color:#94a3b8">按 ESC 或再點「遠征」取消</span></div>

<!-- 戰鬥結算 -->
<div id="battleModal">
    <div class="battle-card">
        <div class="battle-title" id="battleTitle">戰鬥</div>
        <div id="battleBody"></div>
        <button class="act-btn" onclick="closeBattle()">關閉</button>
    </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
/* ============================================================
   雨神大亨 · 征服版
   大地圖戰略 + 軍隊 + 領地征服 + 敵方 AI
   ============================================================ */

const cvs = document.getElementById('gameCanvas');
const ctx = cvs.getContext('2d');
const miniCvs = document.getElementById('minimap');
const mctx = miniCvs.getContext('2d');

/* ---------- 世界設定 ---------- */
const WORLD = { w: 3600, h: 2400 };
let DPR = Math.min(window.devicePixelRatio || 1, 2);
let VW = window.innerWidth, VH = window.innerHeight;

/* ---------- 相機 ---------- */
const cam = { x: 0, y: 0, zoom: 0.85 };
let dragState = null; // {startX, startY, camX, camY, moved}

/* ---------- 資源 / 遊戲狀態 ---------- */
let res = { gold: 3000, food: 400, wood: 400, stone: 300, dm: 0 };
let buildings = [];      // 玩家建築
let territories = [];    // 領地（含玩家 / 中立 / 敵方）
let garrison = {};       // 基地駐軍 { unitType: count }
let trainQueue = [];     // 訓練隊列 { type, timeLeft }
let expeditions = [];    // 玩家遠征軍
let enemyArmies = [];    // 敵方來襲軍隊
let particles = [], floats = [], shocks = [];
let gameTime = 0;
let lastFrame = performance.now();
let selectedTerritory = null;
let selectedBuilding = null;
let buildMode = null;    // 建造模式中的建築類型
let attackMode = false;  // 遠征目標選擇模式
let currentPanel = null;

/* ---------- 玩家基地 ---------- */
const playerBase = { x: 700, y: 1200, r: 190 };

/* ============================================================
   單位 / 建築 / 領地定義
   ============================================================ */
const UNITS = {
    militia:  { name: '民兵',   icon: '🗡️', cost: { gold: 100 },                     atk: 9,   hp: 70,   trainTime: 2.5, color: '#a8a29e', desc: '廉價砲灰' },
    archer:   { name: '弓箭手', icon: '🏹', cost: { gold: 160, wood: 60 },           atk: 16,  hp: 55,   trainTime: 3.5, color: '#22c55e', desc: '遠程輸出' },
    knight:   { name: '騎士',   icon: '🐴', cost: { gold: 320, food: 120 },         atk: 34,  hp: 170,  trainTime: 6,   color: '#60a5fa', desc: '高攻高血' },
    mage:     { name: '法師',   icon: '🔮', cost: { gold: 420, stone: 120 },        atk: 62,  hp: 80,   trainTime: 8,   color: '#a855f7', desc: '爆發傷害' },
    catapult: { name: '攻城車', icon: '🏰', cost: { gold: 550, wood: 220, stone: 220 }, atk: 95, hp: 340, trainTime: 11, color: '#f59e0b', desc: '破城利器' },
    dragon:   { name: '巨龍',   icon: '🐉', cost: { gold: 2200, food: 600, dm: 8 }, atk: 320, hp: 1300, trainTime: 22,  color: '#e11d48', desc: '王者之師', unlockLand: 5 }
};

const BUILDINGS = {
    goldMine:   { name: '金礦場', icon: '🏵️', cost: { wood: 120 },  income: { gold: 10 },  desc: '每秒產出金幣', maxLv: 6 },
    farm:       { name: '農場',   icon: '🌾', cost: { wood: 100 },  income: { food: 8 },   desc: '每秒產出糧食', maxLv: 6 },
    lumberMill: { name: '伐木場', icon: '🪓', cost: { gold: 150 },  income: { wood: 7 },   desc: '每秒產出木材', maxLv: 6 },
    quarry:     { name: '採石場', icon: '⛏️', cost: { gold: 150 },  income: { stone: 6 },  desc: '每秒產出石料', maxLv: 6 },
    barracks:   { name: '兵營',   icon: '⚔️', cost: { wood: 200, stone: 100 }, income: {}, desc: '解鎖軍隊訓練', maxLv: 1, unique: true },
    tower:      { name: '箭塔',   icon: '🏹', cost: { wood: 180, stone: 140 }, income: {}, desc: '攻擊範圍內敵軍', maxLv: 5, isTower: true }
};

const TERRITORY_TYPES = {
    village:  { name: '中立村莊', color: '#fbbf24', icon: '🏘️', r: 80,  income: { gold: 6 },              desc: '弱小中立聚落' },
    mine:     { name: '礦脈據點', color: '#facc15', icon: '💎', r: 70,  income: { gold: 4, stone: 4 },    desc: '資源據點' },
    outpost:  { name: '敵方哨站', color: '#f97316', icon: '🗼', r: 90,  income: { gold: 8, food: 4 },     desc: '敵軍前哨' },
    fortress: { name: '敵方要塞', color: '#ef4444', icon: '🏯', r: 120, income: { gold: 20, stone: 8 },   desc: '重兵把守' },
    capital:  { name: '敵方王城', color: '#dc2626', icon: '👑', r: 150, income: { gold: 60, food: 20, stone: 20 }, desc: '敵軍首都' }
};

/* ============================================================
   初始化
   ============================================================ */
function resize() {
    VW = window.innerWidth; VH = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cvs.width = Math.floor(VW * DPR);
    cvs.height = Math.floor(VH * DPR);
    cvs.style.width = VW + 'px';
    cvs.style.height = VH + 'px';
}
window.addEventListener('resize', resize);
resize();

function generateWorld() {
    territories = [];
    // 玩家主基地領地（本身算一個玩家領地）
    territories.push({
        id: 'home', name: '雨神主城', type: 'home', faction: 'player',
        x: playerBase.x, y: playerBase.y, r: playerBase.r,
        income: { gold: 15, food: 8 }, garrison: {}, isHome: true
    });

    // 中立村莊 / 礦脈（圍繞玩家基地周邊）
    const neutralSpots = [
        { x: 1250, y: 780,  type: 'village' },
        { x: 1180, y: 1650, type: 'village' },
        { x: 1500, y: 1150, type: 'mine' },
        { x: 1050, y: 1050, type: 'mine' },
        { x: 1550, y: 620,  type: 'village' },
        { x: 1450, y: 1850, type: 'mine' },
    ];
    neutralSpots.forEach((s, i) => {
        const def = TERRITORY_TYPES[s.type];
        territories.push({
            id: 'neutral_' + i, name: def.name + ' ' + (i + 1), type: s.type, faction: 'neutral',
            x: s.x, y: s.y, r: def.r, income: { ...def.income },
            garrison: { militia: 6 + i * 2, archer: 2 + i },
            reward: { gold: 200 + i * 80 }
        });
    });

    // 敵方哨站 / 要塞（中東部）
    const enemySpots = [
        { x: 2100, y: 700,  type: 'outpost' },
        { x: 2150, y: 1650, type: 'outpost' },
        { x: 2450, y: 1150, type: 'outpost' },
        { x: 2700, y: 550,  type: 'fortress' },
        { x: 2780, y: 1750, type: 'fortress' },
        { x: 2950, y: 1200, type: 'capital' },
    ];
    enemySpots.forEach((s, i) => {
        const def = TERRITORY_TYPES[s.type];
        let gar;
        if (s.type === 'outpost') gar = { militia: 14, archer: 8, knight: 3 };
        else if (s.type === 'fortress') gar = { militia: 30, archer: 18, knight: 10, mage: 4 };
        else gar = { militia: 50, archer: 30, knight: 20, mage: 12, catapult: 6, dragon: 2 };
        territories.push({
            id: 'enemy_' + i, name: def.name + ' ' + (i + 1), type: s.type, faction: 'enemy',
            x: s.x, y: s.y, r: def.r, income: { ...def.income },
            garrison: gar,
            reward: { gold: 400 + i * 200, dm: s.type === 'capital' ? 60 : (s.type === 'fortress' ? 20 : 8) }
        });
    });

    // 玩家初始建築
    buildings = [];
    addBuilding('goldMine', playerBase.x - 100, playerBase.y - 80);
    addBuilding('farm', playerBase.x + 60, playerBase.y - 80);
    addBuilding('lumberMill', playerBase.x - 100, playerBase.y + 80);
    addBuilding('quarry', playerBase.x + 60, playerBase.y + 80);
    addBuilding('barracks', playerBase.x, playerBase.y);

    // 初始駐軍
    garrison = { militia: 8, archer: 3 };
}

function addBuilding(type, x, y) {
    buildings.push({
        id: 'b_' + Math.random().toString(36).slice(2, 9),
        type, x, y, lv: 1, incomeAcc: 0
    });
}

/* ============================================================
   相機 / 座標
   ============================================================ */
function clampCamera() {
    const halfW = VW / (2 * cam.zoom), halfH = VH / (2 * cam.zoom);
    cam.x = Math.max(halfW, Math.min(WORLD.w - halfW, cam.x));
    cam.y = Math.max(halfH, Math.min(WORLD.h - halfH, cam.y));
    if (WORLD.w * cam.zoom < VW) cam.x = WORLD.w / 2;
    if (WORLD.h * cam.zoom < VH) cam.y = WORLD.h / 2;
}
function centerOnPlayer() {
    cam.x = playerBase.x; cam.y = playerBase.y;
    clampCamera();
}
function zoomBy(f) {
    cam.zoom = Math.max(0.45, Math.min(1.8, cam.zoom * f));
    clampCamera();
}
function screenToWorld(sx, sy) {
    return { x: (sx - VW / 2) / cam.zoom + cam.x, y: (sy - VH / 2) / cam.zoom + cam.y };
}
function worldToScreen(wx, wy) {
    return { x: (wx - cam.x) * cam.zoom + VW / 2, y: (wy - cam.y) * cam.zoom + VH / 2 };
}

/* ============================================================
   工具
   ============================================================ */
const rnd = (a, b) => a + Math.random() * (b - a);
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 1800);
}
function addFloat(wx, wy, text, color, size) {
    floats.push({ x: wx, y: wy, text, color: color || '#4ade80', size: size || 14, alpha: 1, vy: -1 });
    if (floats.length > 80) floats.shift();
}
function addParticles(wx, wy, color, count, spd) {
    count = Math.min(count, 30);
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2, v = rnd(0.4, 1) * (spd || 8);
        particles.push({ x: wx, y: wy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, size: rnd(2, 5), color, alpha: 1, decay: rnd(0.02, 0.05) });
    }
    if (particles.length > 300) particles.splice(0, particles.length - 300);
}
function addShock(wx, wy, color, maxR, life) {
    shocks.push({ x: wx, y: wy, r: 8, maxR: maxR || 100, color, life: life || 1 });
}
function canAfford(cost) {
    for (const k in cost) if ((res[k] || 0) < cost[k]) return false;
    return true;
}
function pay(cost) {
    for (const k in cost) res[k] -= cost[k];
}

/* ============================================================
   軍隊計算
   ============================================================ */
function totalHp(units) {
    let hp = 0;
    for (const t in units) hp += (UNITS[t] ? UNITS[t].hp : 0) * units[t];
    return hp;
}
function totalAtk(units) {
    let a = 0;
    for (const t in units) a += (UNITS[t] ? UNITS[t].atk : 0) * units[t];
    return a;
}
function unitCount(units) {
    let c = 0;
    for (const t in units) c += units[t];
    return c;
}

/* 戰鬥模擬：回傳 { win, attLeft, defLeft, attLossPct, defLossPct } */
function simulateBattle(attUnits, defUnits) {
    const attHp0 = totalHp(attUnits), defHp0 = totalHp(defUnits);
    const attAtk = totalAtk(attUnits), defAtk = totalAtk(defUnits);

    let attHp = attHp0, defHp = defHp0;
    if (attAtk <= 0) return { win: false, attLeft: attUnits, defLeft: defUnits, attLossPct: 1, defLossPct: 0 };
    if (defAtk <= 0) return { win: true, attLeft: attUnits, defLeft: {}, attLossPct: 0, defLossPct: 1 };

    let rounds = 0;
    while (attHp > 0 && defHp > 0 && rounds < 200) {
        defHp -= attAtk * 0.9;
        if (defHp <= 0) break;
        attHp -= defAtk * 0.9;
        rounds++;
    }
    const attLossPct = attHp0 > 0 ? Math.max(0, 1 - Math.max(0, attHp) / attHp0) : 1;
    const defLossPct = defHp0 > 0 ? Math.max(0, 1 - Math.max(0, defHp) / defHp0) : 1;
    const win = attHp > 0 && defHp <= 0;

    return {
        win,
        attLeft: scaleUnits(attUnits, 1 - attLossPct),
        defLeft: scaleUnits(defUnits, 1 - defLossPct),
        attLossPct, defLossPct
    };
}
function scaleUnits(units, factor) {
    const out = {};
    for (const t in units) {
        const n = Math.round(units[t] * Math.max(0, factor));
        if (n > 0) out[t] = n;
    }
    return out;
}
function mergeUnits(target, add) {
    for (const t in add) target[t] = (target[t] || 0) + add[t];
}

/* ============================================================
   建築系統
   ============================================================ */
function buildingUpgradeCost(b) {
    const def = BUILDINGS[b.type];
    const baseVal = Object.values(def.cost).reduce((a, v) => a + v, 0);
    const cost = {};
    for (const k in def.cost) cost[k] = Math.floor(def.cost[k] * Math.pow(1.8, b.lv - 1) * 0.8 + baseVal * 0.05);
    return cost;
}
function incomeOf(b) {
    const def = BUILDINGS[b.type];
    const out = {};
    for (const k in def.income) out[k] = def.income[k] * b.lv;
    return out;
}

function tryPlaceBuilding(type, wx, wy) {
    const def = BUILDINGS[type];
    if (def.unique && buildings.some(b => b.type === type)) { toast('此建築只能建造一座'); return; }
    // 必須在玩家領地內
    const inTerritory = territories.some(t =>
        t.faction === 'player' && dist(wx, wy, t.x, t.y) < t.r - 20
    );
    if (!inTerritory) { toast('只能在你的領地內建造'); return; }
    // 避免重疊
    if (buildings.some(b => dist(b.x, b.y, wx, wy) < 50)) { toast('位置太近'); return; }
    if (!canAfford(def.cost)) { toast('資源不足'); return; }
    pay(def.cost);
    addBuilding(type, wx, wy);
    addParticles(wx, wy, '#38bdf8', 16, 10);
    addShock(wx, wy, '#38bdf8', 70, 0.9);
    toast(def.name + ' 建造完成');
    buildMode = null;
    document.getElementById('modeHint').classList.remove('show');
    refreshPanel();
}

/* ============================================================
   訓練系統
   ============================================================ */
function queueUnit(type) {
    const def = UNITS[type];
    if (!buildings.some(b => b.type === 'barracks')) { toast('需要先建造兵營'); return; }
    if (def.unlockLand && getPlayerLandCount() < def.unlockLand) { toast(`需佔領 ${def.unlockLand} 塊領地解鎖`); return; }
    if (!canAfford(def.cost)) { toast('資源不足'); return; }
    pay(def.cost);
    trainQueue.push({ type, timeLeft: def.trainTime });
    toast('開始訓練：' + def.name);
    refreshPanel();
}

function updateTraining(dt) {
    for (let i = trainQueue.length - 1; i >= 0; i--) {
        trainQueue[i].timeLeft -= dt;
        if (trainQueue[i].timeLeft <= 0) {
            const t = trainQueue[i].type;
            garrison[t] = (garrison[t] || 0) + 1;
            addFloat(playerBase.x + rnd(-60, 60), playerBase.y - 60, '+1 ' + UNITS[t].icon, UNITS[t].color, 15);
            trainQueue.splice(i, 1);
            if (currentPanel === 'train') refreshPanel();
        }
    }
}

/* ============================================================
   領地 / 遠征
   ============================================================ */
function getPlayerLandCount() {
    return territories.filter(t => t.faction === 'player').length;
}
function canAttackTerritory(t) {
    return t.faction !== 'player';
}

function sendExpedition(targetTerritory, unitsToSend) {
    if (unitCount(unitsToSend) === 0) { toast('沒有派出任何軍隊'); return; }
    // 扣除駐軍
    for (const t in unitsToSend) {
        garrison[t] = (garrison[t] || 0) - unitsToSend[t];
        if (garrison[t] <= 0) delete garrison[t];
    }
    expeditions.push({
        units: { ...unitsToSend },
        x: playerBase.x, y: playerBase.y,
        targetId: targetTerritory.id,
        state: 'moving',
        speed: 260,
        battleTimer: 0
    });
    addParticles(playerBase.x, playerBase.y, '#38bdf8', 20, 12);
    toast(`⚔️ 遠征軍出發！目標：${targetTerritory.name}`);
    attackMode = false;
    document.getElementById('modeHint').classList.remove('show');
    closePanel();
}

function updateExpeditions(dt) {
    for (let i = expeditions.length - 1; i >= 0; i--) {
        const exp = expeditions[i];
        const target = territories.find(t => t.id === exp.targetId);
        if (!target) { expeditions.splice(i, 1); continue; }

        if (exp.state === 'moving') {
            const dx = target.x - exp.x, dy = target.y - exp.y;
            const d = Math.hypot(dx, dy);
            if (d < target.r + 10) {
                // 抵達，開始戰鬥
                exp.state = 'fighting';
                exp.battleTimer = 1.2;
            } else {
                exp.x += (dx / d) * exp.speed * dt;
                exp.y += (dy / d) * exp.speed * dt;
            }
        } else if (exp.state === 'fighting') {
            exp.battleTimer -= dt;
            if (frameRandomExpEffect()) addParticles(target.x + rnd(-30, 30), target.y + rnd(-30, 30), '#fbbf24', 3, 8);
            if (exp.battleTimer <= 0) {
                // 結算
                const result = simulateBattle(exp.units, target.garrison || {});
                if (result.win) {
                    captureTerritory(target, exp.units, result);
                } else {
                    // 失敗，殘兵返回
                    loseExpedition(exp, result);
                }
                expeditions.splice(i, 1);
            }
        }
    }
}

let _expFx = 0;
function frameRandomExpEffect() { _expFx++; return _expFx % 3 === 0; }

function captureTerritory(target, attackerUnits, result) {
    const survivors = result.attLeft;
    // 佔領
    const oldFaction = target.faction;
    target.faction = 'player';
    target.garrison = { ...survivors };
    target.isHome = false;

    // 獎勵
    if (target.reward) {
        if (target.reward.gold) { res.gold += target.reward.gold; addFloat(target.x, target.y - 40, `+${target.reward.gold}💰`, '#fbbf24', 16); }
        if (target.reward.dm) { res.dm += target.reward.dm; addFloat(target.x, target.y - 60, `+${target.reward.dm}🌌`, '#c084fc', 16); }
    }
    addParticles(target.x, target.y, '#4ade80', 26, 12);
    addShock(target.x, target.y, '#4ade80', target.r * 1.6, 1.3);
    showBattleResult(true, target.name, result, target.reward);
    target.reward = null;
    refreshPanel();
    saveGame();
}

function loseExpedition(exp, result) {
    const survivors = result.attLeft;
    const target = territories.find(t => t.id === exp.targetId);
    // 敵軍也有損失
    if (target && target.garrison) {
        target.garrison = result.defLeft;
    }
    // 殘兵回到基地駐軍
    if (unitCount(survivors) > 0) {
        mergeUnits(garrison, survivors);
    }
    addParticles(exp.x, exp.y, '#ef4444', 18, 10);
    showBattleResult(false, target ? target.name : '敵軍', result, null);
    refreshPanel();
    saveGame();
}

/* ============================================================
   敵方 AI
   ============================================================ */
let enemyAttackTimer = 45; // 秒
function updateEnemyAI(dt) {
    enemyAttackTimer -= dt;
    if (enemyAttackTimer <= 0) {
        enemyAttackTimer = Math.max(20, 45 - getPlayerLandCount() * 2);
        spawnEnemyRaid();
    }
    // 敵軍移動
    for (let i = enemyArmies.length - 1; i >= 0; i--) {
        const arm = enemyArmies[i];
        const dx = playerBase.x - arm.x, dy = playerBase.y - arm.y;
        const d = Math.hypot(dx, dy);
        if (d < playerBase.r * 0.7) {
            // 到達基地，與玩家駐軍戰鬥
            resolveDefenseBattle(arm);
            enemyArmies.splice(i, 1);
        } else {
            arm.x += (dx / d) * arm.speed * dt;
            arm.y += (dy / d) * arm.speed * dt;
            // 經過箭塔時受攻擊
            buildings.filter(b => b.type === 'tower').forEach(tw => {
                const range = 190 + tw.lv * 25;
                if (dist(tw.x, tw.y, arm.x, arm.y) < range) {
                    arm.hpPool = (arm.hpPool || totalHp(arm.units)) - (18 + tw.lv * 14) * dt;
                    if (arm.hpPool <= 0) {
                        addParticles(arm.x, arm.y, '#4ade80', 20, 12);
                        addFloat(arm.x, arm.y - 30, '殲滅敵軍！', '#4ade80', 16);
                        enemyArmies.splice(i, 1);
                    } else {
                        // 減少兵力
                        const ratio = Math.max(0, arm.hpPool / arm.maxHpPool);
                        arm.units = scaleUnits(arm.baseUnits, ratio);
                    }
                }
            });
        }
    }
}

function spawnEnemyRaid() {
    // 從敵方領地選一個作為出發點
    const enemyTerrs = territories.filter(t => t.faction === 'enemy');
    if (enemyTerrs.length === 0) return;
    const from = enemyTerrs[Math.floor(Math.random() * enemyTerrs.length)];
    const scale = 1 + getPlayerLandCount() * 0.25;
    const raid = {
        militia: Math.round(6 * scale),
        archer: Math.round(3 * scale),
        knight: Math.round(1.5 * scale)
    };
    const hp = totalHp(raid);
    enemyArmies.push({
        units: { ...raid }, baseUnits: { ...raid },
        x: from.x, y: from.y, speed: 55,
        hpPool: hp, maxHpPool: hp
    });
    toast(`⚠️ 敵軍從 ${from.name} 出兵偷襲你的主城！`);
}

function resolveDefenseBattle(arm) {
    // 玩家基地防禦：駐軍 + 塔的加成
    const towerBonus = buildings.filter(b => b.type === 'tower').reduce((a, t) => a + t.lv, 0) * 0.06;
    const defUnits = { ...garrison };
    const result = simulateBattle(defUnits, arm.units);

    if (result.win) {
        // 玩家獲勝
        garrison = { ...result.attLeft };
        const gain = Math.round(unitCount(arm.units) * 25 * (1 + getPlayerLandCount() * 0.1));
        res.gold += gain;
        addFloat(playerBase.x, playerBase.y - 60, `⚔️ 擊退敵軍！+${gain}💰`, '#4ade80', 18);
        addParticles(playerBase.x, playerBase.y, '#4ade80', 30, 14);
    } else {
        // 玩家失敗，損失資源
        garrison = { ...result.attLeft };
        const lossGold = Math.min(res.gold, Math.round(res.gold * 0.25 + 200));
        const lossFood = Math.min(res.food, Math.round(res.food * 0.2));
        res.gold -= lossGold;
        res.food -= lossFood;
        addFloat(playerBase.x, playerBase.y - 60, `💥 主城被劫掠！-${lossGold}💰`, '#ef4444', 18);
        addParticles(playerBase.x, playerBase.y, '#ef4444', 30, 14);
        addShock(playerBase.x, playerBase.y, '#ef4444', 220, 1.4);
        // 一座建築可能被毀
        if (buildings.length > 3 && Math.random() < 0.35) {
            const idx = Math.floor(Math.random() * buildings.length);
            const destroyed = buildings.splice(idx, 1)[0];
            toast(`🔥 ${BUILDINGS[destroyed.type].name} 被摧毀了！`);
        }
    }
    refreshPanel();
}

/* ============================================================
   生產 / 資源
   ============================================================ */
function updateEconomy(dt) {
    // 建築產出
    buildings.forEach(b => {
        const inc = incomeOf(b);
        for (const k in inc) res[k] = (res[k] || 0) + inc[k] * dt;
    });
    // 領地產出
    territories.forEach(t => {
        if (t.faction === 'player' && t.income) {
            for (const k in t.income) res[k] = (res[k] || 0) + t.income[k] * dt;
        }
    });
}

/* ============================================================
   主更新
   ============================================================ */
let frameCount = 0;
function update(dt) {
    gameTime += dt;
    frameCount++;

    updateEconomy(dt);
    updateTraining(dt);
    updateExpeditions(dt);
    updateEnemyAI(dt);

    // 特效
    for (let i = floats.length - 1; i >= 0; i--) {
        const f = floats[i];
        f.y += f.vy; f.alpha -= 0.02;
        if (f.alpha <= 0) floats.splice(i, 1);
    }
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.96; p.vy *= 0.96;
        p.alpha -= p.decay;
        if (p.alpha <= 0) particles.splice(i, 1);
    }
    for (let i = shocks.length - 1; i >= 0; i--) {
        const s = shocks[i];
        s.r += (s.maxR - s.r) * 0.12;
        s.life -= 0.04;
        if (s.life <= 0) shocks.splice(i, 1);
    }

    updateUIValues();

    if (frameCount % 300 === 0) saveGame();
}

/* ============================================================
   渲染
   ============================================================ */
function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, VW, VH);

    // 背景
    const bg = ctx.createLinearGradient(0, 0, 0, VH);
    bg.addColorStop(0, '#0a1628');
    bg.addColorStop(1, '#020617');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, VW, VH);

    // 世界變換
    ctx.save();
    ctx.translate(VW / 2, VH / 2);
    ctx.scale(cam.zoom, cam.zoom);
    ctx.translate(-cam.x, -cam.y);

    drawTerrain();
    drawTerritories();
    drawBuildings();
    drawEnemyArmies();
    drawExpeditions();
    drawEffects();
    drawPlayerBaseMarker();

    ctx.restore();

    // 螢幕空間 UI（模式提示）
    if (attackMode) drawAttackModeOverlay();

    drawMinimap();
}

function drawTerrain() {
    // 草地底色
    ctx.fillStyle = '#0f2a1a';
    ctx.fillRect(0, 0, WORLD.w, WORLD.h);

    // 網格
    ctx.strokeStyle = 'rgba(56,189,248,0.05)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = 0; x < WORLD.w; x += 200) { ctx.moveTo(x, 0); ctx.lineTo(x, WORLD.h); }
    for (let y = 0; y < WORLD.h; y += 200) { ctx.moveTo(0, y); ctx.lineTo(WORLD.w, y); }
    ctx.stroke();

    // 裝飾：草地色塊（確定性生成，避免閃爍）
    for (let i = 0; i < 120; i++) {
        const sx = ((i * 907.3) % WORLD.w);
        const sy = ((i * 613.7) % WORLD.h);
        const r = 30 + (i % 7) * 12;
        ctx.fillStyle = i % 2 ? 'rgba(20,60,35,0.35)' : 'rgba(15,45,30,0.3)';
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.fill();
    }
    // 河流裝飾
    ctx.strokeStyle = 'rgba(14,116,144,0.25)';
    ctx.lineWidth = 30;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(100, 400);
    ctx.bezierCurveTo(500, 300, 900, 900, 1300, 500);
    ctx.bezierCurveTo(1700, 150, 2100, 700, 2500, 400);
    ctx.stroke();
}

function drawTerritories() {
    territories.forEach(t => {
        const def = TERRITORY_TYPES[t.type] || { color: '#38bdf8', icon: '🏰' };
        let color = def.color;
        if (t.faction === 'player') color = '#38bdf8';

        // 領地範圍圈
        ctx.save();
        ctx.globalAlpha = 0.13;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.setLineDash([12, 8]);
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();

        // 圖標 + 名稱
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = `${Math.round(t.r * 0.55)}px sans-serif`;
        ctx.fillText(def.icon, t.x, t.y + t.r * 0.2);

        // 名稱牌
        const nameColor = t.faction === 'player' ? '#4ade80' : (t.faction === 'enemy' ? '#f87171' : '#fbbf24');
        ctx.font = 'bold 20px "Segoe UI", sans-serif';
        const nameW = ctx.measureText(t.name).width + 24;
        ctx.fillStyle = 'rgba(2,6,23,0.82)';
        ctx.beginPath();
        ctx.roundRect(t.x - nameW / 2, t.y - t.r - 42, nameW, 30, 8);
        ctx.fill();
        ctx.fillStyle = nameColor;
        ctx.fillText(t.name, t.x, t.y - t.r - 20);

        // 勢力標籤
        ctx.font = 'bold 13px sans-serif';
        const factionText = t.faction === 'player' ? '★ 我方' : (t.faction === 'enemy' ? '☠ 敵軍' : '◆ 中立');
        ctx.fillStyle = nameColor;
        ctx.fillText(factionText, t.x, t.y - t.r - 52);

        // 駐軍信息
        if (t.garrison && unitCount(t.garrison) > 0) {
            ctx.font = 'bold 14px sans-serif';
            ctx.fillStyle = 'rgba(226,232,240,0.8)';
            ctx.fillText('🛡 ' + unitCount(t.garrison), t.x, t.y + t.r + 22);
        }
        ctx.restore();

        // 選中高亮
        if (selectedTerritory === t) {
            ctx.save();
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 4;
            ctx.shadowColor = '#fbbf24';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(t.x, t.y, t.r + 6, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
    });
}

function drawBuildings() {
    buildings.forEach(b => {
        const def = BUILDINGS[b.type];
        const s = 26;
        // 底座
        ctx.fillStyle = 'rgba(2,6,23,0.7)';
        ctx.beginPath(); ctx.roundRect(b.x - s - 4, b.y + s - 8, s * 2 + 8, 16, 6); ctx.fill();
        // 光環
        const g = ctx.createRadialGradient(b.x, b.y, 4, b.x, b.y, s + 10);
        g.addColorStop(0, 'rgba(56,189,248,0.35)');
        g.addColorStop(1, 'rgba(56,189,248,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(b.x, b.y, s + 10, 0, Math.PI * 2); ctx.fill();
        // 主體
        ctx.fillStyle = '#0f172a';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.roundRect(b.x - s, b.y - s, s * 2, s * 2, 10); ctx.fill(); ctx.stroke();
        // 圖標
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `${s}px sans-serif`;
        ctx.fillText(def.icon, b.x, b.y + 2);
        // 等級
        ctx.font = 'bold 13px sans-serif';
        ctx.fillStyle = '#fbbf24';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText('Lv.' + b.lv, b.x, b.y + s + 16);
        ctx.textAlign = 'start';
    });
}

function drawEnemyArmies() {
    enemyArmies.forEach(arm => {
        const n = unitCount(arm.units);
        if (n <= 0) return;
        ctx.save();
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 16;
        ctx.fillStyle = '#ef4444';
        ctx.beginPath(); ctx.arc(arm.x, arm.y, 16, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fca5a5';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('☠', arm.x, arm.y + 1);
        // 血條
        const ratio = Math.max(0, (arm.hpPool || 0) / (arm.maxHpPool || 1));
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(arm.x - 20, arm.y - 30, 40, 5);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(arm.x - 20, arm.y - 30, 40 * ratio, 5);
        ctx.textAlign = 'start';
        ctx.textBaseline = 'alphabetic';
        ctx.restore();
    });
}

function drawExpeditions() {
    expeditions.forEach(exp => {
        ctx.save();
        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = 16;
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath(); ctx.arc(exp.x, exp.y, 15, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fef08a';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#1c1917';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⚔', exp.x, exp.y + 1);
        ctx.textAlign = 'start';
        ctx.textBaseline = 'alphabetic';
        ctx.restore();
    });
}

function drawEffects() {
    particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    shocks.forEach(s => {
        ctx.globalAlpha = Math.max(0, s.life) * 0.6;
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.stroke();
    });
    ctx.globalAlpha = 1;

    floats.forEach(f => {
        ctx.globalAlpha = Math.max(0, f.alpha);
        ctx.fillStyle = f.color;
        ctx.font = `900 ${f.size}px "Segoe UI", sans-serif`;
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.9)';
        ctx.shadowBlur = 5;
        ctx.fillText(f.text, f.x, f.y);
        ctx.shadowBlur = 0;
    });
    ctx.globalAlpha = 1;
    ctx.textAlign = 'start';
}

function drawPlayerBaseMarker() {
    ctx.save();
    ctx.strokeStyle = 'rgba(56,189,248,0.7)';
    ctx.lineWidth = 4;
    ctx.setLineDash([16, 10]);
    ctx.beginPath(); ctx.arc(playerBase.x, playerBase.y, playerBase.r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    // 主城標記
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = '46px sans-serif';
    ctx.fillText('🏰', playerBase.x, playerBase.y + playerBase.r + 50);
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText('雨神主城', playerBase.x, playerBase.y + playerBase.r + 78);
    ctx.restore();
}

function drawAttackModeOverlay() {
    // 高亮可攻擊領地
    territories.forEach(t => {
        if (t.faction === 'player') return;
        const s = worldToScreen(t.x, t.y);
        if (s.x < -100 || s.x > VW + 100 || s.y < -100 || s.y > VH + 100) return;
        ctx.save();
        ctx.globalAlpha = 0.4 + Math.sin(gameTime * 4) * 0.15;
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 4;
        ctx.setLineDash([10, 8]);
        ctx.beginPath();
        ctx.arc(s.x, s.y, t.r * cam.zoom, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    });
}

/* ============================================================
   小地圖
   ============================================================ */
function drawMinimap() {
    const MW = miniCvs.width, MH = miniCvs.height;
    mctx.clearRect(0, 0, MW, MH);
    const sx = MW / WORLD.w, sy = MH / WORLD.h;

    mctx.fillStyle = '#0f2a1a';
    mctx.fillRect(0, 0, MW, MH);

    territories.forEach(t => {
        let color = TERRITORY_TYPES[t.type] ? TERRITORY_TYPES[t.type].color : '#38bdf8';
        if (t.faction === 'player') color = '#38bdf8';
        mctx.fillStyle = color;
        mctx.globalAlpha = 0.7;
        mctx.beginPath();
        mctx.arc(t.x * sx, t.y * sy, Math.max(2.5, t.r * sx), 0, Math.PI * 2);
        mctx.fill();
    });
    mctx.globalAlpha = 1;

    // 建築
    mctx.fillStyle = '#93c5fd';
    buildings.forEach(b => {
        mctx.fillRect(b.x * sx - 1.5, b.y * sy - 1.5, 3, 3);
    });

    // 敵軍
    mctx.fillStyle = '#ef4444';
    enemyArmies.forEach(a => {
        mctx.beginPath(); mctx.arc(a.x * sx, a.y * sy, 2.5, 0, Math.PI * 2); mctx.fill();
    });

    // 相機視窗
    const vw = (VW / cam.zoom) * sx, vh = (VH / cam.zoom) * sy;
    mctx.strokeStyle = '#fff';
    mctx.lineWidth = 1.5;
    mctx.strokeRect(cam.x * sx - vw / 2, cam.y * sy - vh / 2, vw, vh);
}

/* ============================================================
   輸入處理
   ============================================================ */
cvs.addEventListener('pointerdown', e => {
    if (e.button === 2) return;
    dragState = {
        startX: e.clientX, startY: e.clientY,
        camX: cam.x, camY: cam.y,
        moved: false, pointerId: e.pointerId
    };
    cvs.setPointerCapture(e.pointerId);
});

cvs.addEventListener('pointermove', e => {
    if (!dragState) return;
    const dx = e.clientX - dragState.startX;
    const dy = e.clientY - dragState.startY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) dragState.moved = true;
    if (dragState.moved) {
        cam.x = dragState.camX - dx / cam.zoom;
        cam.y = dragState.camY - dy / cam.zoom;
        clampCamera();
    }
});

cvs.addEventListener('pointerup', e => {
    if (!dragState) return;
    const wasMoved = dragState.moved;
    const sx = e.clientX, sy = e.clientY;
    dragState = null;
    if (wasMoved) return;

    // 點擊處理
    handleMapClick(sx, sy);
});

cvs.addEventListener('contextmenu', e => e.preventDefault());

// 滑鼠滾輪縮放
cvs.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY > 0 ? 0.9 : 1.1;
    const before = screenToWorld(e.clientX, e.clientY);
    cam.zoom = Math.max(0.45, Math.min(1.8, cam.zoom * factor));
    const after = screenToWorld(e.clientX, e.clientY);
    cam.x += before.x - after.x;
    cam.y += before.y - after.y;
    clampCamera();
}, { passive: false });

function handleMapClick(sx, sy) {
    const wp = screenToWorld(sx, sy);

    // 建造模式
    if (buildMode) {
        tryPlaceBuilding(buildMode, wp.x, wp.y);
        return;
    }

    // 遠征模式
    if (attackMode) {
        const t = findTerritoryAt(wp.x, wp.y);
        if (t && t.faction !== 'player') {
            openExpeditionPanel(t);
        } else {
            toast('請點擊敵方或中立領地');
        }
        return;
    }

    // 普通選擇：優先領地，其次建築
    const terr = findTerritoryAt(wp.x, wp.y);
    if (terr) {
        selectedTerritory = terr;
        selectedBuilding = null;
        openTerritoryPanel(terr);
        return;
    }
    const bld = findBuildingAt(wp.x, wp.y);
    if (bld) {
        selectedBuilding = bld;
        selectedTerritory = null;
        openBuildingPanel(bld);
        return;
    }
    selectedTerritory = null;
    selectedBuilding = null;
    closePanel();
}

function findTerritoryAt(x, y) {
    let best = null, bestD = Infinity;
    territories.forEach(t => {
        const d = dist(x, y, t.x, t.y);
        if (d < t.r && d < bestD) { bestD = d; best = t; }
    });
    return best;
}
function findBuildingAt(x, y) {
    let best = null, bestD = 40;
    buildings.forEach(b => {
        const d = dist(x, y, b.x, b.y);
        if (d < bestD) { bestD = d; best = b; }
    });
    return best;
}

// 觸控雙指縮放（簡化）
let pinchState = null;
cvs.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
        const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        pinchState = { dist: d, zoom: cam.zoom };
        dragState = null;
    }
}, { passive: true });
cvs.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchState) {
        e.preventDefault();
        const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        cam.zoom = Math.max(0.45, Math.min(1.8, pinchState.zoom * (d / pinchState.dist)));
        clampCamera();
    }
}, { passive: false });
cvs.addEventListener('touchend', () => { if (pinchState) pinchState = null; });

// 鍵盤
window.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        buildMode = null;
        attackMode = false;
        document.getElementById('modeHint').classList.remove('show');
        closePanel();
        refreshPanel();
    }
});

// 小地圖點擊
miniCvs.addEventListener('click', e => {
    const rect = miniCvs.getBoundingClientRect();
    const mx = (e.clientX - rect.left) / rect.width;
    const my = (e.clientY - rect.top) / rect.height;
    cam.x = mx * WORLD.w;
    cam.y = my * WORLD.h;
    clampCamera();
});

function closePanel() {
    document.getElementById('sidePanel').classList.remove('show');
    currentPanel = null;
}
function refreshPanel() {
    if (!currentPanel) return;
    if (currentPanel === 'build') renderBuildPanel();
    else if (currentPanel === 'train') renderTrainPanel();
    else if (currentPanel === 'army') renderArmyPanel();
    else if (currentPanel === 'tech') renderTechPanel();
    else if (currentPanel === 'territory' && selectedTerritory) renderTerritoryPanelContent(selectedTerritory);
    else if (currentPanel === 'building' && selectedBuilding) renderBuildingPanelContent(selectedBuilding);
}

function openPanel(title, cmd) {
    currentPanel = cmd || title;

}

function openExpeditionPanel(target) {

}
function renderTerritoryPanelContent(t) {
    const body = document.getElementById('panelBody');
    const def = TERRITORY_TYPES[t.type] || { color: '#38bdf8', icon: '🏰' };
    let html = '';
    html += `<div class="card">
        <div class="card-top">
            <span class="card-name" style="color:${t.faction === 'player' ? '#4ade80' : (t.faction === 'enemy' ? '#f87171' : '#fbbf24')}">${def.icon} ${t.name}</span>

    // 目標守軍
    if (t.faction !== 'player') {
        html += '<div class="card"><div class="card-name">🛡 守軍</div>';
        const gc = unitCount(t.garrison || {});
        if (gc === 0) html += '<div class="card-desc">無守軍</div>';
        else {
            for (const k in t.garrison) {
                if (t.garrison[k] <= 0) continue;
                html += `<div class="unit-row"><span class="u-name">${UNITS[k].icon} ${UNITS[k].name}</span><span style="color:#f87171">×${t.garrison[k]}</span></div>`;
            }
            html += `<div class="card-desc">守軍戰力：⚔${totalAtk(t.garrison)} · ❤${totalHp(t.garrison)}</div>`;
        }
        html += '</div>';
    }

    // 出征區
    if (t.faction !== 'player') {
        const cnt = unitCount(garrison);
        if (cnt === 0) {
            html += '<div class="card-desc" style="color:#fbbf24">⚠️ 你沒有可出征的駐軍</div>';
        } else {
            html += '<div class="card"><div class="card-name">派出軍隊</div>';
            window._expSelection = {};
            for (const type in garrison) {
                if (garrison[type] <= 0) continue;
                html += `<div class="unit-row">
                    <span class="u-name">${UNITS[type].icon} ${UNITS[type].name}</span>
                    <div class="qty-ctrl">
                        <button onclick="expSel('${type}',-1)">−</button>
                        <span class="q" id="expq_${type}">0</span>
                        <button onclick="expSel('${type}',1)">+</button>
                        <button onclick="expSel('${type}',999)" style="width:auto;padding:0 6px;font-size:10px">全部</button>
                    </div>
                </div>`;
            }
            html += `<div class="act-row" style="margin-top:6px">
                <button class="act-btn green" onclick="confirmExpedition('${t.id}')">🚩 出發遠征</button>
            </div></div>`;
        }
    }
    body.innerHTML = html;
}
function expSel(type, delta) {
    if (!window._expSelection) window._expSelection = {};
    const cur = window._expSelection[type] || 0;
    const max = garrison[type] || 0;
    let next = delta >= 999 ? max : cur + delta;
    next = Math.max(0, Math.min(max, next));
    window._expSelection[type] = next;
    document.getElementById('expq_' + type).textContent = next;
}
function confirmExpedition(territoryId) {
    const t = territories.find(x => x.id === territoryId);
    if (!t) return;
    const sel = window._expSelection || {};
    sendExpedition(t, sel);
    window._expSelection = {};
}

function renderBuildingPanelContent(b) {
    const body = document.getElementById('panelBody');
    const def = BUILDINGS[b.type];
    const upCost = buildingUpgradeCost(b);
    const costStr = Object.entries(upCost).map(([k, v]) => `${resIcon(k)}${v}`).join(' ');
    let html = `<div class="card">
        <div class="card-top">
            <span class="card-name">${def.icon} ${def.name} Lv.${b.lv}</span>
        </div>
        <div class="card-desc">${def.desc}</div>
        <div class="card-desc">產出：${Object.entries(incomeOf(b)).map(([k, v]) => `${resIcon(k)}+${v}/s`).join(' ') || (def.isTower ? '防禦攻擊' : '無')}</div>
    </div>`;
    if (b.lv < def.maxLv) {
        html += `<button class="act-btn green" ${canAfford(upCost) ? '' : 'disabled'} onclick="upgradeBuilding('${b.id}')">
            升級至 Lv.${b.lv + 1}（${costStr}）
        </button>`;
    } else {
        html += '<div class="card-desc" style="color:#4ade80">已達最高等級</div>';
    }
    html += `<button class="act-btn red" onclick="demolishBuilding('${b.id}')">拆除（返還 50%）</button>`;
    body.innerHTML = html;
}
function upgradeBuilding(id) {
    const b = buildings.find(x => x.id === id);
    if (!b) return;
    const cost = buildingUpgradeCost(b);
    if (!canAfford(cost)) { toast('資源不足'); return; }
    pay(cost);
    b.lv++;
    addParticles(b.x, b.y, '#38bdf8', 16, 10);
    toast(BUILDINGS[b.type].name + ' 升級至 Lv.' + b.lv);
    renderBuildingPanelContent(b);
}
function demolishBuilding(id) {
    const idx = buildings.findIndex(x => x.id === id);
    if (idx < 0) return;
    const b = buildings[idx];
    if (b.type === 'barracks' && buildings.filter(x => x.type === 'barracks').length === 1) {
        toast('不能拆除唯一兵營'); return;
    }
    const def = BUILDINGS[b.type];
    for (const k in def.cost) res[k] = (res[k] || 0) + Math.floor(def.cost[k] * 0.5);
    buildings.splice(idx, 1);
    addParticles(b.x, b.y, '#94a3b8', 12, 8);
    closePanel();
    toast('建築已拆除');
}

/* ---------- 轉生 / 天賦面板 ---------- */
function openTechPanel() {
    openPanel('🧬 暗物質天賦', 'tech');
    renderTechPanel();
}
function renderTechPanel() {
    const body = document.getElementById('panelBody');
    const landCount = getPlayerLandCount();
    const rebirthGain = Math.floor((res.gold / 5000) + landCount * 2);
    let html = `<div class="card">
        <div class="card-name">🌌 暗物質轉生</div>
        <div class="card-desc">目前可獲得：<b style="color:#c084fc">${rebirthGain} DM</b></div>
        <div class="card-desc">轉生將清空金錢、建築、軍隊與領地，但保留天賦與暗物質。</div>
        <button class="act-btn purple" ${rebirthGain < 5 ? 'disabled' : ''} onclick="doRebirth()">🌌 轉生（+${rebirthGain} DM）</button>
    </div>
    <div class="card">
        <div class="card-name">🧬 永久天賦</div>
        <div class="card-desc">消耗暗物質強化永久能力，轉生保留。</div>
        <div class="card-desc">目前 DM：<b style="color:#c084fc">${Math.floor(res.dm)}</b></div>
    </div>`;
    body.innerHTML = html;
}
function doRebirth() {
    const landCount = getPlayerLandCount();
    const gain = Math.floor((res.gold / 5000) + landCount * 2);
    if (gain < 5) { toast('至少需要 5 DM 才能轉生'); return; }
    res.dm += gain;
    res.gold = 3000; res.food = 400; res.wood = 400; res.stone = 300;
    buildings = [];
    territories = [];
    garrison = { militia: 8, archer: 3 };
    expeditions = [];
    enemyArmies = [];
    generateWorld();
    addShock(playerBase.x, playerBase.y, '#c084fc', 400, 1.6);
    addFloat(playerBase.x, playerBase.y - 100, `🌌 轉生成功！+${gain} DM`, '#c084fc', 22);
    toast(`轉生成功！獲得 ${gain} 暗物質`);
    centerOnPlayer();
    closePanel();
    saveGame();
}

/* ---------- 戰鬥結算彈窗 ---------- */
function showBattleResult(win, targetName, result, reward) {
    document.getElementById('battleTitle').textContent = win ? '⚔️ 勝利！' : '💀 敗退…';
    document.getElementById('battleTitle').className = 'battle-title ' + (win ? 'win' : 'lose');
    let html = '';
    html += `<div class="battle-row"><span>目標</span><span>${targetName}</span></div>`;
    html += `<div class="battle-row"><span>我方剩餘</span><span style="color:#4ade80">${unitCount(result.attLeft)} 單位</span></div>`;
    if (result.defLeft) html += `<div class="battle-row"><span>敵方剩餘</span><span style="color:#f87171">${unitCount(result.defLeft)} 單位</span></div>`;
    html += `<div class="battle-row"><span>我方損失</span><span>${Math.round(result.attLossPct * 100)}%</span></div>`;
    if (win) {
        html += `<div class="battle-row"><span>佔領領地</span><span style="color:#38bdf8">${targetName}</span></div>`;
        if (reward) {
            if (reward.gold) html += `<div class="battle-row"><span>戰利品</span><span style="color:#fbbf24">+${reward.gold}💰</span></div>`;
            if (reward.dm) html += `<div class="battle-row"><span>暗物質</span><span style="color:#c084fc">+${reward.dm}🌌</span></div>`;
        }
    }
    document.getElementById('battleBody').innerHTML = html;
    document.getElementById('battleModal').classList.add('show');
}
function closeBattle() {
    document.getElementById('battleModal').classList.remove('show');
}

/* ============================================================
   UI 數值更新
   ============================================================ */
function resIcon(k) {
    return { gold: '💰', food: '🌾', wood: '🪵', stone: '🪨', dm: '🌌' }[k] || k;
}
let _uiT = 0;
function updateUIValues() {
    _uiT++;
    if (_uiT % 3 !== 0) return;
    document.getElementById('uiGold').textContent = Math.floor(res.gold).toLocaleString();
    document.getElementById('uiFood').textContent = Math.floor(res.food).toLocaleString();
    document.getElementById('uiWood').textContent = Math.floor(res.wood).toLocaleString();
    document.getElementById('uiStone').textContent = Math.floor(res.stone).toLocaleString();
    document.getElementById('uiDm').textContent = Math.floor(res.dm);
    document.getElementById('uiLand').textContent = getPlayerLandCount() + '/' + territories.length;
}

/* ============================================================
   底部命令欄綁定
   ============================================================ */
document.querySelectorAll('.cmd-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const cmd = btn.dataset.cmd;
        document.querySelectorAll('.cmd-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        buildMode = null;
        attackMode = false;
        document.getElementById('modeHint').classList.remove('show');
        if (cmd === 'build') openBuildPanel();
        else if (cmd === 'train') openTrainPanel();
        else if (cmd === 'army') openArmyPanel();
        else if (cmd === 'conquest') {
            attackMode = true;
            document.getElementById('modeHint').innerHTML = '🚩 點擊地圖上的敵方/中立領地發起遠征<br><span style="font-size:10px;color:#94a3b8">按 ESC 取消</span>';
            document.getElementById('modeHint').classList.add('show');
            closePanel();
        }
        else if (cmd === 'tech') openTechPanel();
    });
});

/* ============================================================
   存檔
   ============================================================ */
const SAVE_KEY = 'raingod_conquest_save_v2';
function saveGame() {
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
            res, buildings, territories, garrison, gameTime
        }));
    } catch (e) {}
}
function loadGame() {
    try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return false;
        const data = JSON.parse(raw);
        if (!data || !data.res) return false;
        res = data.res;
        if (Array.isArray(data.buildings)) buildings = data.buildings;
        if (Array.isArray(data.territories) && data.territories.length > 0) territories = data.territories;
        if (data.garrison) garrison = data.garrison;
        if (typeof data.gameTime === 'number') gameTime = data.gameTime;
        return true;
    } catch (e) { return false; }
}

/* ============================================================
   主迴圈
   ============================================================ */
let running = true;
function loop(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    if (running) {
        update(dt);
        render();
    }
    requestAnimationFrame(loop);
}

/* ============================================================
   啟動
   ============================================================ */
function boot() {
    const loaded = loadGame();
    if (!loaded) {
        generateWorld();
    } else if (territories.length === 0) {
        generateWorld();
    }
    centerOnPlayer();
    updateUIValues();
    toast(loaded ? '🌍 歡迎回來，領主大人' : '🌍 歡迎來到雨神大亨 · 征服！點擊「遠征」開始擴張');
    requestAnimationFrame(loop);
}

// roundRect polyfill
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (typeof r === 'number') r = [r, r, r, r];
        const [tl, tr, br, bl] = r;
        this.beginPath();
        this.moveTo(x + tl, y);
        this.lineTo(x + w - tr, y); this.quadraticCurveTo(x + w, y, x + w, y + tr);
        this.lineTo(x + w, y + h - br); this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
        this.lineTo(x + bl, y + h); this.quadraticCurveTo(x, y + h, x, y + h - bl);
        this.lineTo(x, y + tl); this.quadraticCurveTo(x, y, x + tl, y);
        this.closePath();
        return this;
    };
}

boot();

window.addEventListener('beforeunload', saveGame);
window.addEventListener('pagehide', saveGame);
</script>
