<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雨神大亨 · 帝国征途 | Raingod Empire</title>
    <style>
        * { touch-action: none; user-select: none; box-sizing: border-box; }
        body { margin: 0; background: #020617; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        .top-bar {
            position: absolute !important;
            top: 110px !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
            padding: 8px 20px;
            border-radius: 30px;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            display: flex;
            gap: 16px;
            align-items: center;
            white-space: nowrap;
            z-index: 999 !important;
        }
        .hud-item { font-size: 13px; font-weight: bold; color: #f8fafc; }
        .money { color: #4ade80; font-size: 16px; font-weight: 900; }
        .dark-matter { color: #c084fc; font-size: 13px; }

        .skill-bar {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; pointer-events: auto;
        }
        .skill-btn {
            background: rgba(15, 23, 42, 0.9); border: 1px solid #38bdf8; color: #fff;
            padding: 8px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; transition: all 0.2s;
        }
        .skill-btn:hover:not(:disabled) { background: #0284c7; }
        .skill-btn:disabled { opacity: 0.4; border-color: #475569; cursor: not-allowed; }

        .panel { 
            position: absolute; bottom: 15px; right: 15px; 
            width: 340px; max-height: 82vh; overflow-y: auto;
            background: rgba(15, 23, 42, 0.95); border: 1px solid #334155; border-radius: 12px;
            pointer-events: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px);
        }
        .panel::-webkit-scrollbar { width: 4px; }
        .panel::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 4px; }

        .tabs { display: flex; gap: 4px; margin-bottom: 4px; flex-wrap: wrap; }
        .tab-btn { 
            flex: 1 0 30%; background: #1e293b; color: #94a3b8; border: none; padding: 6px 2px; 
            font-size: 10px; font-weight: bold; border-radius: 6px; cursor: pointer;
        }
        .tab-btn.active { background: #0284c7; color: #fff; }

        .btn { 
            background: linear-gradient(135deg, #1e293b, #0f172a); color: #fff; border: 1px solid #38bdf8; 
            padding: 8px 10px; font-weight: bold; font-size: 11px; border-radius: 8px; cursor: pointer; 
            display: flex; justify-content: space-between; align-items: center; transition: all 0.2s;
        }
        .btn:hover:not(:disabled) { background: linear-gradient(135deg, #0284c7, #0369a1); border-color: #38bdf8; }
        .btn:disabled { opacity: 0.35; border-color: #475569; cursor: not-allowed; }
        .rebirth-btn { background: linear-gradient(135deg, #7e22ce, #581c87); border-color: #c084fc; }

        .quest-box {
            background: rgba(30, 41, 59, 0.6); border: 1px dashed #38bdf8; padding: 6px 8px;
            border-radius: 6px; font-size: 10px; color: #e2e8f0; margin-bottom: 2px;
        }
        
        #tycoon-leaderboard-button { position: absolute; top: 160px; right: 15px; z-index: 20; pointer-events: auto; padding: 9px 14px; border: 1px solid #38bdf8; border-radius: 20px; color: #fff; background: rgba(15,23,42,0.9); font-weight: bold; cursor: pointer; }
        #tycoon-leaderboard { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(2,6,23,0.94); color: #fff; }
        .tycoon-leaderboard-card { width: min(520px, 100%); max-height: 80vh; overflow-y: auto; padding: 20px; border: 1px solid #38bdf8; border-radius: 16px; background: #0b1020; }
        .tycoon-leaderboard-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 4px; border-bottom: 1px solid #26334a; }
        .mobile-shop-toggle, .mobile-panel-close { display: none; }

        /* 世界地图 UI */
        #view-toggle {
            position: absolute; top: 160px; left: 15px; z-index: 30; pointer-events: auto;
            padding: 10px 18px; border: 2px solid #f59e0b; border-radius: 24px;
            background: linear-gradient(135deg, #b45309, #78350f); color: #fff;
            font-weight: 900; font-size: 13px; cursor: pointer; box-shadow: 0 0 20px rgba(245,158,11,0.4);
        }
        #world-ui {
            position: absolute; inset: 0; pointer-events: none; z-index: 20; display: none;
        }
        #world-ui.active { display: block; }
        .world-hud {
            position: absolute; top: 110px; left: 50%; transform: translateX(-50%);
            background: rgba(15,23,42,0.92); border: 1px solid #f59e0b; border-radius: 16px;
            padding: 8px 18px; pointer-events: auto; display: flex; gap: 16px; align-items: center;
            backdrop-filter: blur(8px); font-size: 12px; font-weight: bold; color: #fcd34d;
            white-space: nowrap;
        }
        .world-ctrl {
            position: absolute; bottom: 15px; left: 15px; pointer-events: auto;
            display: flex; flex-direction: column; gap: 6px;
        }
        .world-ctrl button {
            width: 46px; height: 46px; border-radius: 12px; border: 1px solid #38bdf8;
            background: rgba(15,23,42,0.92); color: #fff; font-weight: bold; font-size: 18px;
            cursor: pointer;
        }
        #territory-panel {
            position: absolute; bottom: 15px; right: 15px; width: 300px; max-height: 70vh;
            overflow-y: auto; background: rgba(15,23,42,0.96); border: 1px solid #f59e0b;
            border-radius: 12px; padding: 14px; pointer-events: auto; color: #fff;
            display: none; flex-direction: column; gap: 8px;
        }
        #territory-panel.active { display: flex; }
        #territory-panel h3 { margin: 0; color: #fcd34d; font-size: 15px; }
        .terr-row { display: flex; justify-content: space-between; font-size: 12px; color: #cbd5e1; }
        .terr-bar { height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; }
        .terr-bar > div { height: 100%; background: linear-gradient(90deg, #ef4444, #f59e0b); transition: width 0.3s; }

        @media (max-width: 700px), (max-height: 500px) and (pointer: coarse) {
            .nav-content { gap: 6px; padding: 0 8px !important; }
            .brand { flex: 0 0 auto; white-space: nowrap; }
            .nav-links {
                flex: 1; min-width: 0; justify-content: space-evenly; gap: 0 !important; margin-left: 4px !important;
            }
            .nav-item { padding: 6px 3px !important; font-size: 11px !important; white-space: nowrap; }
            .login-btn { flex: 0 0 auto; padding: 6px 8px !important; white-space: nowrap; }

            .top-bar {
                top: calc(60px + env(safe-area-inset-top)) !important; left: 8px !important;
                width: calc(100% - 16px) !important; transform: none !important;
                display: grid; grid-template-columns: 1fr 1fr; gap: 5px 8px;
                padding: 7px 10px; border-radius: 12px; white-space: normal;
            }
            .hud-item { font-size: 11px; }
            .money { font-size: 14px; }
            .dark-matter { font-size: 11px; }

            #tycoon-leaderboard-button { top: 132px; right: 8px; max-width: 46%; padding: 8px 10px; font-size: 11px; }
            #view-toggle { top: 132px; left: 8px; padding: 8px 12px; font-size: 11px; }

            .skill-bar {
                bottom: max(8px, env(safe-area-inset-bottom));
                left: 8px; right: 8px; transform: none; gap: 5px;
            }
            .skill-btn { flex: 1; min-width: 0; padding: 7px 4px; font-size: 9px; }

            .panel {
                display: none; left: 0; right: 0; bottom: 0; width: 100%; max-height: 52dvh;
                padding: 10px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
                border-radius: 14px 14px 0 0; touch-action: pan-y; -webkit-overflow-scrolling: touch;
            }
            #ui.shop-open .panel { display: flex; }
            #ui.shop-open .skill-bar { display: none; }
            .mobile-panel-close {
                display: block; align-self: flex-end; padding: 7px 12px; border: 1px solid #64748b;
                border-radius: 8px; background: #1e293b; color: #fff; font-weight: bold; touch-action: manipulation;
            }
            .mobile-shop-toggle {
                display: block; position: absolute; right: 10px; bottom: calc(62px + env(safe-area-inset-bottom));
                z-index: 15; padding: 9px 13px; border: 1px solid #38bdf8; border-radius: 20px;
                background: rgba(15, 23, 42, 0.95); color: #fff; font-weight: bold;
                pointer-events: auto; touch-action: manipulation;
            }
            #ui.shop-open .mobile-shop-toggle { display: none; }

            .tab-btn { min-height: 38px; font-size: 10px; }
            .btn { min-height: 40px; font-size: 11px; touch-action: manipulation; }
            #tycoon-leaderboard { padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom)); }
            .tycoon-leaderboard-card { max-height: 85dvh; padding: 14px; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
            .tycoon-leaderboard-row { flex-direction: column; gap: 4px; }

            .world-hud {
                top: calc(60px + env(safe-area-inset-top)) !important; left: 8px !important;
                right: 8px !important; transform: none !important; width: auto !important;
                font-size: 10px; gap: 8px; padding: 7px 10px; white-space: normal;
                flex-wrap: wrap; justify-content: center;
            }
            #territory-panel {
                left: 8px; right: 8px; width: auto;
                top: calc(120px + env(safe-area-inset-top));
                bottom: auto; max-height: 38vh;
            }
            .world-ctrl { bottom: calc(80px + env(safe-area-inset-bottom)); }
            .world-ctrl button { width: 40px; height: 40px; font-size: 16px; }
        }
    </style>
</head>
<body>
    <link rel="stylesheet" href="menu.css">
    <div id="nav_bar"></div>
    <script src="menu.js"></script>
    <canvas id="c"></canvas>
    <div id="ui">
        <div class="top-bar">
            <div class="hud-item">$<span id="m" class="money">0</span></div>
            <div class="hud-item dark-matter">🌌 暗物質: <span id="dm">0</span></div>
            <div class="hud-item" style="color: #ef4444;">⚔️ 第 <span id="waveNum">1</span> 波 (剩餘 <span id="enemyCount">0</span>)</div>
            <div class="hud-item" style="color:#4ade80;">🛡️ 領地 <span id="territoryCount">0</span>/<span id="territoryMax">12</span></div>
        </div>

        <div class="skill-bar">
            <button class="skill-btn" onclick="useSkill(1)">
                <span>⚡ 超頻過載</span><span id="cd1" style="font-size:9px; color:#f59e0b;">就緒</span>
            </button>
            <button class="skill-btn" onclick="useSkill(2)">
                <span>💥 軌道砲轟炸</span><span id="cd2" style="font-size:9px; color:#f59e0b;">就緒</span>
            </button>
            <button class="skill-btn" onclick="useSkill(3)">
                <span>🪖 軍隊衝鋒</span><span id="cd3" style="font-size:9px; color:#f59e0b;">就緒</span>
            </button>
        </div>

        <div class="panel" id="tycoon-panel">
            <button class="mobile-panel-close" type="button" onclick="toggleTycoonShop(false)">收起商店 ▲</button>
            <div class="quest-box">
                🎯 任務：<span id="questText">載入中...</span> (<span id="questProg">0/0</span>)
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('tab-turret')">⚔️ 武器塔</button>
                <button class="tab-btn" onclick="switchTab('tab-prod')">🏭 工廠解鎖</button>
                <button class="tab-btn" onclick="switchTab('tab-upg')">⚙️ 基礎升級</button>
                <button class="tab-btn" onclick="switchTab('tab-army')">🪖 軍隊</button>
                <button class="tab-btn" onclick="switchTab('tab-tech')">🌌 暗天賦</button>
            </div>

            <div id="tab-turret">
                <button class="btn" onclick="buildTurret('gatling')">
                    <span>🔫 機槍塔</span><span style="color:#4ade80" id="costGatling">$1,000</span>
                </button>
                <button class="btn" onclick="buildTurret('laser')">
                    <span>⚡ 雷射塔</span><span style="color:#4ade80" id="costLaser">$5,000</span>
                </button>
                <button class="btn" onclick="buildTurret('mortar')">
                    <span>💥 迫擊砲塔</span><span style="color:#4ade80" id="costMortar">$20,000</span>
                </button>
                <button class="btn" onclick="buildTurret('frost')">
                    <span>❄️ 緩慢冰凍塔</span><span style="color:#4ade80" id="costFrost">$50,000</span>
                </button>
                <button class="btn" onclick="buildTurret('blackhole')">
                    <span>🌌 暗物質黑洞塔</span><span style="color:#c084fc" id="costBlackhole">$200,000</span>
                </button>
                <button class="btn" style="background: linear-gradient(135deg, #b91c1c, #991b1b); border-color: #f87171; margin-top:4px;" onclick="triggerNextWave()">
                    <span>⚠️️ 立即召喚下一波敵人</span>
                </button>
            </div>

            <div id="tab-prod" style="display:none;">
                <button class="btn" onclick="unlockTier(2)">
                    <span>🔓 矽晶/晶片廠</span><span style="color:#4ade80">$2,500</span>
                </button>
                <button class="btn" onclick="unlockTier(3)">
                    <span>🔓 鈾能/電池中心</span><span style="color:#4ade80">$25,000</span>
                </button>
                <button class="btn" onclick="unlockTier(4)">
                    <span>🔓 量子合成廠</span><span style="color:#4ade80">$200,000</span>
                </button>
                <button class="btn" onclick="unlockTier(5)">
                    <span>🔓 反物質研究所</span><span style="color:#4ade80">$2,000,000</span>
                </button>
            </div>

            <div id="tab-upg" style="display:none;">
                <button class="btn" onclick="buyBot()">
                    <span>🤖 雇用運輸機兵</span><span style="color:#4ade80" id="bCost">$500</span>
                </button>
                <button class="btn" onclick="upgrade('miner')">
                    <span>⚙️ 採礦速率 Lv.<span id="minerLv">0</span></span><span style="color:#4ade80" id="mCost">$1,000</span>
                </button>
                <button class="btn" onclick="upgrade('capacity')">
                    <span>🎒 機兵容量 Lv.<span id="capLv">4</span></span><span style="color:#4ade80" id="cCost">$1,500</span>
                </button>
                <button class="btn" onclick="upgrade('playerDamage')">
                    <span>⚔️ 玩家傷害 Lv.<span id="playerDamageLv">0</span>（+25%）</span><span style="color:#4ade80" id="playerDamageCost">$1,000</span>
                </button>
                <button class="btn" onclick="upgrade('turretDamage')">
                    <span>🛡️ 防衛塔傷害 Lv.<span id="turretDamageLv">0</span>（+20%）</span><span style="color:#4ade80" id="turretDamageCost">$1,500</span>
                </button>
            </div>

            <div id="tab-army" style="display:none;">
                <div class="quest-box" style="border-color:#f59e0b; color:#fcd34d;">
                    🪖 切換到世界地圖，用鍵盤/搖桿移動指揮官，點擊領地發起進攻！
                </div>
                <button class="btn" onclick="recruitSoldier()">
                    <span>🪖 招募士兵 (現有 <span id="soldierCount">0</span>)</span><span style="color:#4ade80" id="soldierCost">$800</span>
                </button>
                <button class="btn" onclick="recruitTank()">
                    <span>🚀 生產坦克 (現有 <span id="tankCount">0</span>)</span><span style="color:#4ade80" id="tankCost">$5,000</span>
                </button>
                <button class="btn" onclick="switchView('world')" style="background: linear-gradient(135deg, #b45309, #78350f); border-color: #fbbf24;">
                    <span>🌍 前往世界地圖</span>
                </button>
                <div class="quest-box" style="margin-top:4px;">
                    總戰力：<span id="armyPower" style="color:#fbbf24;">0</span> ｜ 已佔領：<span id="ownedTerritories">無</span>
                </div>
            </div>

            <div id="tab-tech" style="display:none;">
                <button class="btn rebirth-btn" onclick="buyTalent('dmg')">
                    <span>🧬 基因傷害 +20%</span><span style="color:#c084fc" id="tDmgCost">5 DM</span>
                </button>
                <button class="btn rebirth-btn" onclick="buyTalent('speed')">
                    <span>🤖 自動化機兵速度 +15%</span><span style="color:#c084fc" id="tSpdCost">5 DM</span>
                </button>
                <button class="btn rebirth-btn" onclick="buyTalent('army')">
                    <span>🪖 軍隊攻擊力 +30%</span><span style="color:#c084fc" id="tArmyCost">5 DM</span>
                </button>
                <button class="btn rebirth-btn" style="margin-top:8px;" onclick="triggerRebirth()">
                    <span>🌌 暗物質量子轉生</span><span style="color:#c084fc" id="rebirthGain">+0 DM</span>
                </button>
            </div>
        </div>
        <button class="mobile-shop-toggle" type="button" aria-controls="tycoon-panel" aria-expanded="false" onclick="toggleTycoonShop()">🛠️ 建造 / 升級</button>
    </div>

    <button id="view-toggle" onclick="switchView('world')">🌍 世界地圖</button>

    <!-- 世界地圖 UI -->
    <div id="world-ui">
        <div class="world-hud">
            <span>🌍 世界地圖</span>
            <span>🪖 <span id="wSoldiers">0</span> 兵 · <span id="wTanks">0</span> 坦克</span>
            <span>⚔️ <span id="wPower" style="color:#fbbf24;">0</span> 戰力</span>
            <span>🛡️ <span id="wOwned">0</span>/<span id="wTotal">12</span> 領地</span>
            <span style="font-size:10px; color:#94a3b8;">⌨️ WASD / 方向鍵 · 📱 右側搖桿</span>
        </div>
        <div class="world-ctrl">
            <button onclick="zoomWorld(1.2)" title="放大">＋</button>
            <button onclick="zoomWorld(1/1.2)" title="縮小">－</button>
            <button onclick="centerOnCapital()" title="回到基地">🏠</button>
            <button onclick="switchView('base')" title="返回基地" style="border-color:#4ade80;">↩</button>
        </div>
        <div id="territory-panel">
            <h3 id="terrName">選擇領地</h3>
            <div class="terr-row"><span>歸屬</span><span id="terrOwner">中立</span></div>
            <div class="terr-row"><span>守軍</span><span id="terrGarrison">0</span></div>
            <div class="terr-row"><span>每波收益</span><span id="terrIncome" style="color:#4ade80;">$0</span></div>
            <div class="terr-bar"><div id="terrBar" style="width:0%;"></div></div>
            <button class="btn" id="attackBtn" onclick="attackSelected()" style="background: linear-gradient(135deg, #b91c1c, #7f1d1d); border-color: #f87171; margin-top:6px;">
                <span>⚔️ 發起進攻</span><span id="attackCost" style="color:#fbbf24;">需要 0 戰力</span>
            </button>
            <button class="btn" onclick="closeTerritoryPanel()" style="border-color:#64748b;">關閉</button>
        </div>
    </div>

    <button id="tycoon-leaderboard-button" onclick="openTycoonLeaderboard()">🏆 登入後查看排行榜</button>
    <div id="tycoon-leaderboard">
        <div class="tycoon-leaderboard-card">
            <h2 style="color:#38bdf8; margin-top:0;">🏆 雨神大亨排行榜</h2>
            <p id="tycoon-leaderboard-status" style="color:#aaa;">請登入帳號後查看。</p>
            <div id="tycoon-leaderboard-list"></div>
            <div style="display:flex; gap:8px; justify-content:center; margin-top:14px;">
                <button class="btn" onclick="refreshTycoonLeaderboard()">重新整理</button>
                <button class="btn" onclick="closeTycoonLeaderboard()">關閉</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 雨神大亨 · 帝國征途 v3
        // 原有基地玩法完整保留 + 超大地圖 + 鍵盤/搖桿移動 + 領地爭奪
        // ============================================================
        const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
        const SAVE_KEY = 'raingod_tycoon_save_v3';
        const TYCOON_LEADERBOARD_URL = 'https://game-24b43-default-rtdb.firebaseio.com/raingod_tycoon_leaderboard';

        // ---- 原有核心變數 ----
        let money = 2000, darkMatter = 0, frame = 0;
        let bestWave = 0;
        let minerLevel = 0, capacity = 4, techTier = 1;
        let playerDamageLevel = 0, turretDamageLevel = 0;
        let p = { x: 350, y: 350, r: 18, tx: 350, ty: 350, bag: [], atkRange: 220, cooldown: 0 };
        let bots = [], items = [], floatTexts = [], particles = [], bullets = [];
        let turrets = [], enemies = [];
        let shakeTime = 0;
        let talents = { dmgLv: 0, spdLv: 0, armyLv: 0 };
        let wave = 1;
        let waveTimer = 20 * 60;
        let isWaveActive = false;
        let skillCd = [0, 0, 0];
        let isOverclocked = false, overclockTimer = 0;
        let quest = { type: 'kill', target: 20, current: 0, reward: 1500, desc: '擊殺 20 隻異形蟲' };
        let storageReady = false;

        // ---- 世界地圖系統 ----
        let viewMode = 'base';
        const WORLD_W = 4800, WORLD_H = 3600;
        let camera = { x: WORLD_W/2, y: WORLD_H/2, zoom: 0.55 };
        let commander = { x: 800, y: 1650 }; // 基地中心
        let keys = {};

        function saveGame() {

        function loadGame(data) {
            if (!data || typeof data !== 'object' || Array.isArray(data)) return;
            const finiteOr = (value, fallback) => Number.isFinite(Number(value)) ? Number(value) : fallback;
            const objectArray = value => Array.isArray(value) ? value.filter(item => item && typeof item === 'object').slice(0, 1000) : [];
            money = Math.max(0, finiteOr(data.money, money));
            darkMatter = Math.max(0, finiteOr(data.darkMatter, darkMatter));
            minerLevel = Math.max(0, Math.floor(finiteOr(data.minerLevel, minerLevel)));
            capacity = Math.max(1, Math.floor(finiteOr(data.capacity, capacity)));
            techTier = Math.min(5, Math.max(1, Math.floor(finiteOr(data.techTier, techTier))));
            playerDamageLevel = Math.max(0, Math.floor(finiteOr(data.playerDamageLevel, playerDamageLevel)));
            turretDamageLevel = Math.max(0, Math.floor(finiteOr(data.turretDamageLevel, turretDamageLevel)));
            if (data.player && typeof data.player === 'object') Object.assign(p, data.player);
            bots = objectArray(data.bots);
            turrets = objectArray(data.turrets);
            if (data.talents && typeof data.talents === 'object') talents = { ...talents, ...data.talents };
            wave = Math.max(1, Math.floor(finiteOr(data.wave, wave)));
            bestWave = Math.max(0, Math.floor(finiteOr(data.bestWave, bestWave)));
            waveTimer = Math.max(0, Math.floor(finiteOr(data.waveTimer, waveTimer)));
            const wasWaveActive = data.isWaveActive === true;
            isWaveActive = false;
            items = objectArray(data.items);
            enemies = wasWaveActive ? [] : objectArray(data.enemies);
            if (wasWaveActive) waveTimer = 0;
            if (Array.isArray(data.skillCd)) {
                for (let i = 0; i < Math.min(3, data.skillCd.length); i++) skillCd[i] = Math.max(0, finiteOr(data.skillCd[i], 0));
            }
            isOverclocked = data.isOverclocked === true;
            overclockTimer = Math.max(0, Math.floor(finiteOr(data.overclockTimer, overclockTimer)));
            if (data.quest && typeof data.quest === 'object') quest = { ...quest, ...data.quest };
            if (data.army && typeof data.army === 'object') {
                army.soldiers = Math.max(0, Math.floor(finiteOr(data.army.soldiers, 0)));
                army.tanks = Math.max(0, Math.floor(finiteOr(data.army.tanks, 0)));
            }
            if (Array.isArray(data.worldMap)) {
                data.worldMap.forEach(saved => {
                    const t = worldMap.find(w => w.id === saved.id);
                    if (t) {
                        if (saved.owner) t.owner = saved.owner;
                        if (Number.isFinite(Number(saved.garrisonCurrent))) t.garrisonCurrent = Math.max(0, Math.floor(Number(saved.garrisonCurrent)));
                    }
                });
            }
            if (data.commander && typeof data.commander === 'object') {
                commander.x = Math.max(20, Math.min(WORLD_W - 20, finiteOr(data.commander.x, commander.x)));
                commander.y = Math.max(20, Math.min(WORLD_H - 20, finiteOr(data.commander.y, commander.y)));
            }
            if (data.viewMode === 'world') viewMode = 'world';
            updateWorldUIVisibility();
        }

        async function openTycoonLeaderboard() {

        async function refreshTycoonLeaderboard() {
            const status = document.getElementById('tycoon-leaderboard-status');
            const list = document.getElementById('tycoon-leaderboard-list');
            if (!await window.raingodRequireAuth('排行榜')) return;
            const uid = window.raingodCurrentUser.uid;
            status.textContent = '排行榜載入中…';
            try {
                const response = await fetch(`${TYCOON_LEADERBOARD_URL}.json`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                if (window.raingodCurrentUser?.uid !== uid) return;
                const rows = await response.json() || {};
                const entries = Object.entries(rows)
                    .filter(([, row]) => row && Number.isFinite(Number(row.wave)))
                    .sort((a, b) => Number(b[1].wave) - Number(a[1].wave) || Number(b[1].darkMatter || 0) - Number(a[1].darkMatter || 0))
                    .slice(0, 50);
                list.replaceChildren();
                entries.forEach(([entryUid, row], index) => {
                    const item = document.createElement('div');
                    item.className = 'tycoon-leaderboard-row';
                    const name = document.createElement('span');
                    name.textContent = `${index + 1}. ${row.name || '玩家'}${entryUid === uid ? '（你）' : ''}`;
                    const value = document.createElement('strong');
                    value.textContent = `第 ${Math.floor(Number(row.wave))} 波 · ${Math.floor(Number(row.darkMatter) || 0)} 暗物質`;
                    item.append(name, value);
                    list.appendChild(item);
                });
                status.textContent = entries.length ? `已載入 ${entries.length} 位玩家，依最高波數排序。` : '目前還沒有排行榜資料。';
            } catch (error) {
                console.error('載入雨神大亨排行榜失敗：', error);
                status.textContent = '排行榜載入失敗，請稍後重試。';
            }
        }
        async function uploadTycoonLeaderboardScore() {
            const currentUser = window.raingodCurrentUser;
            if (!currentUser) return;
            const uid = currentUser.uid;
            const scoreWave = Math.max(1, bestWave, wave);
            const scoreDarkMatter = Math.floor(darkMatter);
            const entryUrl = `${TYCOON_LEADERBOARD_URL}/${encodeURIComponent(uid)}.json`;
            try {
                const previousResponse = await fetch(entryUrl);
                if (!previousResponse.ok) throw new Error(`HTTP ${previousResponse.status}`);
                const previous = await previousResponse.json();
                if (window.raingodCurrentUser?.uid !== uid) return;
                if (previous && (Number(previous.wave) > scoreWave ||
                    (Number(previous.wave) === scoreWave && Number(previous.darkMatter) >= scoreDarkMatter))) return;
                const response = await fetch(entryUrl, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: currentUser.displayName || (currentUser.email ? currentUser.email.split('@')[0] : '雨神玩家'),
                        wave: scoreWave,
                        darkMatter: scoreDarkMatter,
                        updatedAt: Date.now()
                    })
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
            } catch (error) {
                console.error('上傳雨神大亨排行榜失敗：', error);
            }
        }

        // ---- 建造 / 升級 ----
        function buildTurret(type) {
            const costs = { gatling: 1000, laser: 5000, mortar: 20000, frost: 50000, blackhole: 200000 };
            let cost = costs[type] * Math.pow(1.3, turrets.filter(t=>t.type===type).length);
            if (money >= cost) {
                money -= cost;
                let tx = 260 + Math.random() * 200;
                let ty = 100 + Math.random() * (cvs.height - 220);
                turrets.push({ x: tx, y: ty, type, cd: 0, range: type==='laser'?350:(type==='blackhole'?280:240) });
                spawnFloatText(tx, ty, `防禦塔建造完成！`, '#38bdf8');
            }
        }
        function triggerNextWave() { if (!isWaveActive) { waveTimer = 0; saveGame(); } }

        function spawnWave() {
            isWaveActive = true;
            bestWave = Math.max(bestWave, wave);
            saveGame();
            uploadTycoonLeaderboardScore();
            let count = 8 + wave * 4;
            let isBossWave = (wave % 5 === 0);
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    let type = 'normal';
                    let rand = Math.random();
                    if (rand < 0.25) type = 'runner';
                    else if (rand < 0.45) type = 'tank';
                    else if (rand < 0.6) type = 'bomber';
                    if (isBossWave && i === count - 1) type = 'boss';
                    let hpMap = { normal: 50, runner: 30, tank: 180, bomber: 40, boss: 1800 + wave * 600 };
                    let spdMap = { normal: 1.5, runner: 2.8, tank: 0.8, bomber: 2.0, boss: 0.5 };
                    enemies.push({
                        x: cvs.width + 40,
                        y: 80 + Math.random() * (cvs.height - 160),
                        type,
                        hp: (hpMap[type] + wave * 35),
                        maxHp: (hpMap[type] + wave * 35),
                        speed: spdMap[type],
                        reward: (type === 'boss' ? 3500 : 80) + wave * 30
                    });
                }, i * 400);
            }
        }

        function buyBot() {
            let cost = Math.floor(500 * Math.pow(1.3, bots.length));
            if(money >= cost) { money -= cost; bots.push({ x: 120, y: cvs.height/2, bag: [], speed: 4.5 }); saveGame(); }
        }
        function upgrade(type) {
            if (type === 'miner') {
                let cost = Math.floor(1000 * Math.pow(1.5, minerLevel));
                if (money >= cost) { money -= cost; minerLevel++; saveGame(); }
            } else if (type === 'capacity') {
                let cost = Math.floor(1500 * (capacity / 2));
                if (money >= cost) { money -= cost; capacity += 2; saveGame(); }
            } else if (type === 'playerDamage') {
                let cost = Math.floor(1000 * Math.pow(1.6, playerDamageLevel));
                if (money >= cost) { money -= cost; playerDamageLevel++; saveGame(); }
            } else if (type === 'turretDamage') {
                let cost = Math.floor(1500 * Math.pow(1.6, turretDamageLevel));
                if (money >= cost) { money -= cost; turretDamageLevel++; saveGame(); }
            }
        }
        function buyTalent(type) {
            if (type === 'dmg' && darkMatter >= (talents.dmgLv + 1) * 5) {
                darkMatter -= (talents.dmgLv + 1) * 5; talents.dmgLv++;
            } else if (type === 'speed' && darkMatter >= (talents.spdLv + 1) * 5) {
                darkMatter -= (talents.spdLv + 1) * 5; talents.spdLv++;
            } else if (type === 'army' && darkMatter >= (talents.armyLv + 1) * 5) {
                darkMatter -= (talents.armyLv + 1) * 5; talents.armyLv++;
            }
            saveGame();
        }
        function unlockTier(tier) {
            const costs = { 2: 2500, 3: 25000, 4: 200000, 5: 2000000 };
            if (money >= costs[tier] && techTier === tier - 1) {
                money -= costs[tier]; techTier = tier; saveGame();
            }
        }
        function triggerRebirth() {
            let earnedDM = Math.floor(money / 100000);
            if (earnedDM > 0 || money >= 100000) {
                darkMatter += Math.max(1, earnedDM);

            const cap = worldMap.find(t => t.type === 'capital');
            if (cap) {
                commander.x = cap.x + cap.w/2;
                commander.y = cap.y + cap.h/2;
            }
        }

        function zoomWorld(factor) {
            camera.zoom = Math.max(0.25, Math.min(1.6, camera.zoom * factor));
        }

        // 世界座標 <-> 螢幕座標
        function worldToScreen(wx, wy) {
            return {
                x: (wx - camera.x) * camera.zoom + cvs.width/2,
                y: (wy - camera.y) * camera.zoom + cvs.height/2
            };
        }
        function screenToWorld(sx, sy) {
            return {
                x: (sx - cvs.width/2) / camera.zoom + camera.x,
                y: (sy - cvs.height/2) / camera.zoom + camera.y
            };
        }

        // ---- 摇杆 ----
        function getJoystickCenter() {
            return { x: cvs.width - 100, y: cvs.height - 100 };
        }

        function updateKnob(cx, cy) {
            const dx = cx - joystick.baseX;
            const dy = cy - joystick.baseY;
            const dist = Math.hypot(dx, dy);
            const maxDist = 55;
            const clamped = Math.min(dist, maxDist);
            const angle = Math.atan2(dy, dx);
            joystick.knobX = joystick.baseX + Math.cos(angle) * clamped;
            joystick.knobY = joystick.baseY + Math.sin(angle) * clamped;
            const norm = clamped / maxDist;
            joystick.dx = Math.cos(angle) * norm;
            joystick.dy = Math.sin(angle) * norm;
            if (dist < 5) { joystick.dx = 0; joystick.dy = 0; }
        }

        function handleWorldPointerDown(e) {
            // 触摸设备：检查是否在摇杆区域
            if (e.pointerType === 'touch' && isTouchDevice()) {
                const jc = getJoystickCenter();
                if (Math.hypot(e.clientX - jc.x, e.clientY - jc.y) < 90) {
                    joystick.active = true;
                    joystick.pointerId = e.pointerId;
                    joystick.baseX = jc.x;
                    joystick.baseY = jc.y;
                    updateKnob(e.clientX, e.clientY);
                    return;
                }
            }
            // 否则记录点击起点
            tapStart = { x: e.clientX, y: e.clientY, moved: false };
        }

        function handleWorldPointerMove(e) {
            if (joystick.active && e.pointerId === joystick.pointerId) {
                updateKnob(e.clientX, e.clientY);
                return;
            }
            if (tapStart) {
                if (Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y) > 12) tapStart.moved = true;
            }
        }

        function handleWorldPointerUp(e) {
            if (joystick.active && e.pointerId === joystick.pointerId) {
                joystick.active = false;
                joystick.dx = 0; joystick.dy = 0;
                joystick.pointerId = null;
                return;
            }
            if (tapStart && !tapStart.moved) {
                const w = screenToWorld(e.clientX, e.clientY);
                const hit = worldMap.find(t =>
                    w.x >= t.x && w.x <= t.x + t.w && w.y >= t.y && w.y <= t.y + t.h
                );
                if (hit) {
                    selectedTerritoryId = hit.id;
                    showTerritoryPanel(hit);
                } else {
                    closeTerritoryPanel();
                }
            }
            tapStart = null;
        }

        // ---- 領地面板 ----
        function showTerritoryPanel(t) {
            const panel = document.getElementById('territory-panel');
            panel.classList.add('active');
            document.getElementById('terrName').textContent = `📍 ${t.name}`;
            const ownerText = t.owner === 'player' ? '🟢 已佔領' : (t.owner === 'enemy' ? '🔴 敵軍' : '⚪ 中立');
            document.getElementById('terrOwner').textContent = ownerText;
            document.getElementById('terrGarrison').textContent = t.garrisonCurrent + ' 守軍';
            document.getElementById('terrIncome').textContent = '$' + t.income.toLocaleString() + ' / 波';
            const bar = document.getElementById('terrBar');
            const ratio = t.owner === 'player' ? 100 : Math.min(100, (t.garrisonCurrent / 500) * 100);
            bar.style.width = ratio + '%';
            const attackBtn = document.getElementById('attackBtn');
            const attackCost = document.getElementById('attackCost');
            if (t.owner === 'player') {
                attackBtn.disabled = true;
                attackCost.textContent = '已佔領';
            } else if (t.type === 'capital') {
                attackBtn.disabled = true;
                attackCost.textContent = '無法攻擊';
            } else {
                attackBtn.disabled = false;
                attackCost.textContent = `需要 ${Math.ceil(t.garrisonCurrent * 1.2)} 戰力`;
            }
        }
        function closeTerritoryPanel() {
            document.getElementById('territory-panel').classList.remove('active');
            selectedTerritoryId = null;
        }

        // ---- 攻擊領地 ----
        function attackSelected() {
            if (selectedTerritoryId === null) return;
            const t = worldMap.find(x => x.id === selectedTerritoryId);
            if (!t || t.owner === 'player' || t.type === 'capital') return;
            const power = getArmyPower();
            const required = Math.ceil(t.garrisonCurrent * 1.2);
            if (power < required) {
                alert(`軍隊戰力不足！需要 ${required} 戰力，目前只有 ${power}。\n請先招募更多士兵或坦克。`);
                return;
            }
            const ratio = required / Math.max(1, power);
            const lossSoldiers = Math.floor(army.soldiers * ratio * 0.45);
            const lossTanks = Math.floor(army.tanks * ratio * 0.25);
            army.soldiers = Math.max(0, army.soldiers - lossSoldiers);
            army.tanks = Math.max(0, army.tanks - lossTanks);

            t.owner = 'player';
            t.garrisonCurrent = 0;
            t.conqueredAt = frame;

            triggerShake(15);
            spawnFloatText(cvs.width/2, cvs.height/2, `🎉 成功佔領 ${t.name}！`, '#fbbf24');
            spawnFloatText(cvs.width/2, cvs.height/2 + 30, `損失 ${lossSoldiers} 兵 · ${lossTanks} 坦克`, '#ef4444');

            refreshWorldHUD();
            showTerritoryPanel(t);
            saveGame();
        }

        function refreshWorldHUD() {
            const owned = worldMap.filter(t => t.owner === 'player').length;
            const total = worldMap.length;
            document.getElementById('wSoldiers').textContent = army.soldiers;
            document.getElementById('wTanks').textContent = army.tanks;
            document.getElementById('wPower').textContent = getArmyPower();
            document.getElementById('wOwned').textContent = owned;
            document.getElementById('wTotal').textContent = total;

            document.getElementById('territoryCount').textContent = owned;
            document.getElementById('territoryMax').textContent = total;
            document.getElementById('soldierCount').textContent = army.soldiers;
            document.getElementById('tankCount').textContent = army.tanks;
            document.getElementById('soldierCost').textContent = '$' + Math.floor(800 * Math.pow(1.2, army.soldiers)).toLocaleString();
            document.getElementById('tankCost').textContent = '$' + Math.floor(5000 * Math.pow(1.3, army.tanks)).toLocaleString();
            document.getElementById('armyPower').textContent = getArmyPower();
            const ownedNames = worldMap.filter(t => t.owner === 'player' && t.type !== 'capital').map(t => t.name);
            document.getElementById('ownedTerritories').textContent = ownedNames.length ? ownedNames.join('、') : '無';
        }

        // ============================================================
        // 基地更新
        // ============================================================
        function updateBase() {
            const b = getBuildings();
            p.x += (p.tx - p.x) * 0.18; p.y += (p.ty - p.y) * 0.18;

            if (!isWaveActive) {
                waveTimer--;
                if (waveTimer <= 0) spawnWave();
            } else {
                if (enemies.length === 0) {
                    isWaveActive = false; wave++; waveTimer = 20 * 60;
                    const territoryIncome = worldMap.filter(t => t.owner === 'player' && t.type !== 'capital')
                        .reduce((s, t) => s + t.income, 0);
                    const baseIncome = 1200 * wave;
                    money += baseIncome + territoryIncome;
                    darkMatter += 1;
                    spawnFloatText(cvs.width/2, cvs.height/2, `🎉 第 ${wave-1} 波完成！+$${(baseIncome+territoryIncome).toLocaleString()}`, '#f59e0b');
                    if (territoryIncome > 0) {
                        spawnFloatText(cvs.width/2, cvs.height/2 + 26, `🛡️ 領地貢獻 +$${territoryIncome.toLocaleString()}`, '#4ade80');
                    }
                    saveGame();
                    uploadTycoonLeaderboardScore();
                }
            }

            const spawnInterval = isOverclocked ? 4 : Math.max(6, 35 - minerLevel * 4);
            if(frame % spawnInterval === 0 && items.length < 50) {
                items.push({ x: b.extractor.x + b.extractor.w + 15, y: b.extractor.y + b.extractor.h/2 + (Math.random()-0.5)*30, type: 'RAW' });
            }

            bots.forEach(bot => {
                let speed = (bot.speed * (1 + talents.spdLv * 0.15)) * (isOverclocked ? 1.8 : 1);
                let target = null;
                if (bot.bag.length === 0) {
                    let it = items[0];
                    target = it ? { x: it.x, y: it.y } : { x: b.extractor.x + b.extractor.w + 15, y: b.extractor.y + b.extractor.h/2 };
                } else {
                    let top = bot.bag[bot.bag.length - 1];
                    if (top.type === 'RAW') target = { x: b.smelter.x + b.smelter.w/2, y: b.smelter.y + b.smelter.h/2 };
                    else if (top.type === 'STEEL' && b.chipFab) target = { x: b.chipFab.x + b.chipFab.w/2, y: b.chipFab.y + b.chipFab.h/2 };
                    else if (top.type === 'CHIP' && b.nukeFab) target = { x: b.nukeFab.x + b.nukeFab.w/2, y: b.nukeFab.y + b.nukeFab.h/2 };
                    else if (top.type === 'BATTERY' && b.qFab) target = { x: b.qFab.x + b.qFab.w/2, y: b.qFab.y + b.qFab.h/2 };
                    else if (top.type === 'CORE' && b.antiFab) target = { x: b.antiFab.x + b.antiFab.w/2, y: b.antiFab.y + b.antiFab.h/2 };
                    else target = { x: b.hub.x + b.hub.w/2, y: b.hub.y + b.hub.h/2 };
                }
                let dx = target.x - bot.x, dy = target.y - bot.y, dist = Math.hypot(dx, dy);
                if(dist > 5) { bot.x += (dx / dist) * speed; bot.y += (dy / dist) * speed; }
                interact(bot, b);
            });

            interact(p, b);

            p.cooldown--;
            let totalDmgMult = (1 + darkMatter * 0.1) * (1 + talents.dmgLv * 0.2);
            if (p.cooldown <= 0 && enemies.length > 0) {
                let target = enemies.find(e => Math.hypot(p.x - e.x, p.y - e.y) < p.atkRange);
                if (target) {
                    bullets.push({ x: p.x, y: p.y, tx: target.x, ty: target.y, dmg: 30 * totalDmgMult * (1 + playerDamageLevel * 0.25), speed: 15, color: '#38bdf8' });
                    p.cooldown = isOverclocked ? 4 : 9;
                }
            }

            turrets.forEach(t => {
                t.cd--;
                if (t.cd <= 0 && enemies.length > 0) {
                    let target = enemies.find(e => Math.hypot(t.x - e.x, t.y - e.y) < t.range);
                    if (target) {
                        if (t.type === 'gatling') {
                            bullets.push({ x: t.x, y: t.y, tx: target.x, ty: target.y, dmg: 18 * totalDmgMult * (1 + turretDamageLevel * 0.2), speed: 16, color: '#f59e0b' });
                            t.cd = isOverclocked ? 3 : 8;
                        } else if (t.type === 'laser') {
                            bullets.push({ x: t.x, y: t.y, tx: target.x, ty: target.y, dmg: 60 * totalDmgMult * (1 + turretDamageLevel * 0.2), speed: 22, color: '#3b82f6' });
                            t.cd = 24;
                        } else if (t.type === 'mortar') {
                            bullets.push({ x: t.x, y: t.y, tx: target.x, ty: target.y, dmg: 140 * totalDmgMult * (1 + turretDamageLevel * 0.2), speed: 11, color: '#a855f7', splash: 90 });
                            t.cd = 48;
                        } else if (t.type === 'frost') {
                            target.speed = Math.max(0.4, target.speed * 0.5);
                            spawnParticles(target.x, target.y, '#0284c7', 4);
                            t.cd = 15;
                        } else if (t.type === 'blackhole') {
                            enemies.forEach(e => {
                                if (Math.hypot(t.x - e.x, t.y - e.y) < t.range) {
                                    e.hp -= 8 * totalDmgMult * (1 + turretDamageLevel * 0.2);
                                    e.x += (t.x - e.x) * 0.05;
                                }
                            });
                            spawnParticles(t.x, t.y, '#c084fc', 3);
                            t.cd = 5;
                        }
                    }
                }
            });

            for (let i = bullets.length - 1; i >= 0; i--) {
                let bul = bullets[i];
                let dx = bul.tx - bul.x, dy = bul.ty - bul.y, dist = Math.hypot(dx, dy);
                if (dist < 12) {
                    if (bul.splash) {
                        enemies.forEach(e => {
                            if (Math.hypot(bul.x - e.x, bul.y - e.y) < bul.splash) {
                                e.hp -= bul.dmg; spawnParticles(e.x, e.y, bul.color, 6);
                            }
                        });
                        triggerShake(10);
                    } else {
                        enemies.forEach(e => {
                            if (Math.hypot(bul.x - e.x, bul.y - e.y) < 25) {
                                e.hp -= bul.dmg; spawnParticles(e.x, e.y, bul.color, 3);
                            }
                        });
                    }
                    bullets.splice(i, 1);
                } else {
                    bul.x += (dx / dist) * bul.speed; bul.y += (dy / dist) * bul.speed;
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.x -= e.speed;
                if (e.hp <= 0) {
                    money += e.reward;
                    updateQuests('kill', 1);
                    spawnFloatText(e.x, e.y, `+$${Math.floor(e.reward)}`, '#4ade80');
                    spawnParticles(e.x, e.y, '#22c55e', 8);
                    enemies.splice(i, 1);
                    continue;
                }
                if (e.x < -40) e.x = cvs.width + 40;
            }

            if (shakeTime > 0) shakeTime--;
            for(let i = floatTexts.length-1; i>=0; i--) { floatTexts[i].y -= 1; floatTexts[i].alpha -= 0.02; if(floatTexts[i].alpha<=0) floatTexts.splice(i,1); }
            for(let i = particles.length-1; i>=0; i--) { particles[i].x += particles[i].vx; particles[i].y += particles[i].vy; particles[i].alpha -= 0.04; if(particles[i].alpha<=0) particles.splice(i,1); }
        }

        // ============================================================
        // 世界地圖更新（键盘 + 摇杆）
        // ============================================================
        function updateWorld() {
            // 移动向量
            let mvx = 0, mvy = 0;
            if (keys['w'] || keys['arrowup']) mvy -= 1;
            if (keys['s'] || keys['arrowdown']) mvy += 1;
            if (keys['a'] || keys['arrowleft']) mvx -= 1;
            if (keys['d'] || keys['arrowright']) mvx += 1;
            if (joystick.active) {
                mvx += joystick.dx;
                mvy += joystick.dy;
            }
            const len = Math.hypot(mvx, mvy);
            if (len > 0.05) {
                mvx /= len; mvy /= len;
                const speed = 620; // 世界单位/秒
                const dt = 1 / 60;
                commander.x = Math.max(20, Math.min(WORLD_W - 20, commander.x + mvx * speed * dt));
                commander.y = Math.max(20, Math.min(WORLD_H - 20, commander.y + mvy * speed * dt));
            }

            // 相机平滑跟随
            camera.x += (commander.x - camera.x) * 0.12;
            camera.y += (commander.y - camera.y) * 0.12;

            if (shakeTime > 0) shakeTime--;
            for(let i = floatTexts.length-1; i>=0; i--) { floatTexts[i].y -= 1; floatTexts[i].alpha -= 0.02; if(floatTexts[i].alpha<=0) floatTexts.splice(i,1); }
            for(let i = particles.length-1; i>=0; i--) { particles[i].x += particles[i].vx; particles[i].y += particles[i].vy; particles[i].alpha -= 0.04; if(particles[i].alpha<=0) particles.splice(i,1); }
        }

            document.getElementById('mCost').innerText = `$${Math.floor(1000 * Math.pow(1.5, minerLevel)).toLocaleString()}`;
            document.getElementById('cCost').innerText = `$${Math.floor(1500 * (capacity / 2)).toLocaleString()}`;
            document.getElementById('playerDamageLv').innerText = playerDamageLevel;
            document.getElementById('playerDamageCost').innerText = `$${Math.floor(1000 * Math.pow(1.6, playerDamageLevel)).toLocaleString()}`;
            document.getElementById('turretDamageLv').innerText = turretDamageLevel;
            document.getElementById('turretDamageCost').innerText = `$${Math.floor(1500 * Math.pow(1.6, turretDamageLevel)).toLocaleString()}`;

            document.getElementById('rebirthGain').innerText = `+${Math.floor(money / 100000)} DM`;

            refreshWorldHUD();
        }

        // ============================================================
        // 主更新
        // ============================================================
        function update() {
            frame++;
            for (let i = 0; i < skillCd.length; i++) { if (skillCd[i] > 0) skillCd[i]--; }
            if (overclockTimer > 0) { overclockTimer--; if (overclockTimer === 0) isOverclocked = false; }

            if (viewMode === 'base') {
                updateBase();
            } else {
                updateWorld();
            }
            syncUI();
            if (frame % 180 === 0) saveGame();
        }

        // ============================================================
        // 基地繪製
        // ============================================================
        function drawBase() {
            ctx.save();
            ctx.clearRect(0, 0, cvs.width, cvs.height);
            if (shakeTime > 0) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
            ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, cvs.width, cvs.height);

            ctx.strokeStyle = 'rgba(30, 41, 59, 0.25)'; ctx.lineWidth = 1;
            for (let x = 0; x < cvs.width; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, cvs.height); ctx.stroke(); }
            for (let y = 0; y < cvs.height; y += 50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cvs.width, y); ctx.stroke(); }

            const b = getBuildings();

            Object.values(b).forEach(bld => {
                ctx.shadowColor = bld.color; ctx.shadowBlur = 10;
                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)'; ctx.strokeStyle = bld.color; ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.roundRect(bld.x, bld.y, bld.w, bld.h, 10); ctx.fill(); ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(bld.label, bld.x + bld.w/2, bld.y - 8);
            });

            turrets.forEach(t => {
                let colorMap = { gatling: '#f59e0b', laser: '#3b82f6', mortar: '#a855f7', frost: '#0284c7', blackhole: '#c084fc' };
                ctx.fillStyle = colorMap[t.type];
                ctx.beginPath(); ctx.arc(t.x, t.y, 16, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            });

            bullets.forEach(bul => {
                ctx.fillStyle = bul.color;
                ctx.beginPath(); ctx.arc(bul.x, bul.y, bul.splash ? 7 : 4, 0, Math.PI * 2); ctx.fill();
            });

            enemies.forEach(e => {
                let sizeMap = { normal: 14, runner: 10, tank: 20, bomber: 12, boss: 32 };
                let colorMap = { normal: '#ef4444', runner: '#f59e0b', tank: '#64748b', bomber: '#22c55e', boss: '#e11d48' };
                ctx.shadowColor = colorMap[e.type]; ctx.shadowBlur = e.type === 'boss' ? 15 : 0;
                ctx.fillStyle = colorMap[e.type];
                ctx.beginPath(); ctx.arc(e.x, e.y, sizeMap[e.type], 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
                let barW = sizeMap[e.type] * 2.2;
                ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(e.x - barW/2, e.y - sizeMap[e.type] - 10, barW, 4);
                ctx.fillStyle = '#22c55e'; ctx.fillRect(e.x - barW/2, e.y - sizeMap[e.type] - 10, (e.hp / e.maxHp) * barW, 4);
            });

            items.forEach(it => {
                ctx.fillStyle = ITEMS[it.type].color;
                ctx.beginPath(); ctx.roundRect(it.x - 7, it.y - 7, 14, 14, 3); ctx.fill();
            });

            bots.forEach(bot => {
                ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(bot.x, bot.y, 12, 0, Math.PI * 2); ctx.fill();
                drawStack(bot);
            });

            ctx.strokeStyle = 'rgba(56, 189, 248, 0.15)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.atkRange, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            drawStack(p);

            particles.forEach(pt => { ctx.fillStyle = pt.color; ctx.globalAlpha = Math.max(0, pt.alpha); ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1; });
            floatTexts.forEach(ft => { ctx.fillStyle = ft.color; ctx.globalAlpha = Math.max(0, ft.alpha); ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(ft.text, ft.x, ft.y); ctx.globalAlpha = 1; });

            ctx.restore();
        }

        function drawStack(obj) {
            obj.bag.forEach((it, i) => {
                ctx.fillStyle = ITEMS[it.type].color;
                ctx.beginPath(); ctx.roundRect(obj.x - 10, obj.y - 28 - (i * 8), 20, 6, 2); ctx.fill();
            });
        }

        // ============================================================
        // 世界地圖繪製
        // ============================================================
        function drawWorld() {
            ctx.save();
            ctx.clearRect(0, 0, cvs.width, cvs.height);

            if (shakeTime > 0) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);

            // 星際背景
            const grad = ctx.createRadialGradient(cvs.width/2, cvs.height/2, 100, cvs.width/2, cvs.height/2, Math.max(cvs.width, cvs.height));
            grad.addColorStop(0, '#0b1020');
            grad.addColorStop(1, '#020617');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, cvs.width, cvs.height);

            // 星星
            for (let i = 0; i < 120; i++) {
                const sx = ((i * 137.5 + frame * 0.02) % 1) * cvs.width;
                const sy = ((i * 91.3 + frame * 0.01) % 1) * cvs.height;
                ctx.fillStyle = `rgba(255,255,255,${0.15 + (i % 5) * 0.08})`;
                ctx.fillRect(sx, sy, 1.5, 1.5);
            }

            // 世界邊界
            const tl = worldToScreen(0, 0);
            const br = worldToScreen(WORLD_W, WORLD_H);
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
            ctx.lineWidth = 2;
            ctx.strokeRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);

            // 網格
            const gridSize = 200;
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.06)';
            ctx.lineWidth = 1;
            for (let gx = 0; gx <= WORLD_W; gx += gridSize) {
                const a = worldToScreen(gx, 0), b2 = worldToScreen(gx, WORLD_H);
                ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b2.x, b2.y); ctx.stroke();
            }
            for (let gy = 0; gy <= WORLD_H; gy += gridSize) {
                const a = worldToScreen(0, gy), b2 = worldToScreen(WORLD_W, gy);
                ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b2.x, b2.y); ctx.stroke();
            }

            // 領地
            worldMap.forEach(t => {
                const s = worldToScreen(t.x, t.y);
                const w = t.w * camera.zoom;
                const h = t.h * camera.zoom;
                if (s.x + w < -20 || s.y + h < -20 || s.x > cvs.width + 20 || s.y > cvs.height + 20) return;

                const isSelected = t.id === selectedTerritoryId;
                const ownerColor = t.owner === 'player' ? '#22c55e' :
                                   t.owner === 'enemy' ? '#ef4444' : '#94a3b8';

                ctx.shadowColor = ownerColor;
                ctx.shadowBlur = isSelected ? 25 : 10;
                const bgGrad = ctx.createLinearGradient(s.x, s.y, s.x + w, s.y + h);
                if (t.type === 'capital') {
                    bgGrad.addColorStop(0, 'rgba(56, 189, 248, 0.35)');
                    bgGrad.addColorStop(1, 'rgba(14, 165, 233, 0.15)');
                } else if (t.owner === 'player') {
                    bgGrad.addColorStop(0, 'rgba(34, 197, 94, 0.28)');
                    bgGrad.addColorStop(1, 'rgba(22, 163, 74, 0.1)');
                } else if (t.owner === 'enemy') {
                    bgGrad.addColorStop(0, 'rgba(239, 68, 68, 0.28)');
                    bgGrad.addColorStop(1, 'rgba(185, 28, 28, 0.1)');
                } else {
                    bgGrad.addColorStop(0, 'rgba(148, 163, 184, 0.22)');
                    bgGrad.addColorStop(1, 'rgba(71, 85, 105, 0.08)');
                }
                ctx.fillStyle = bgGrad;
                ctx.beginPath();
                ctx.roundRect(s.x, s.y, w, h, 14 * camera.zoom);
                ctx.fill();

                ctx.strokeStyle = ownerColor;
                ctx.lineWidth = isSelected ? 4 : 2.5;
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#f8fafc';
                ctx.font = `bold ${Math.max(10, 15 * camera.zoom)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText(t.name, s.x + w/2, s.y + h/2 - 12 * camera.zoom);

                ctx.font = `${Math.max(8, 11 * camera.zoom)}px sans-serif`;
                let sub = '';
                if (t.owner === 'player') sub = '🟢 已佔領';
                else if (t.owner === 'enemy') sub = `🔴 敵軍 · ${t.garrisonCurrent} 守軍`;
                else sub = `⚪ 中立 · ${t.garrisonCurrent} 守軍`;
                ctx.fillStyle = ownerColor;
                ctx.fillText(sub, s.x + w/2, s.y + h/2 + 12 * camera.zoom);

                if (t.owner === 'player' && t.income > 0) {
                    ctx.fillStyle = '#4ade80';
                    ctx.font = `${Math.max(8, 10 * camera.zoom)}px sans-serif`;
                    ctx.fillText(`+$${t.income.toLocaleString()}/波`, s.x + w/2, s.y + h/2 + 28 * camera.zoom);
                }

                if (t.type === 'capital') {
                    ctx.fillStyle = '#fbbf24';
                    ctx.font = `bold ${Math.max(10, 13 * camera.zoom)}px sans-serif`;
                    ctx.fillText('🏠', s.x + w/2, s.y + 20 * camera.zoom);
                }
            });

            // 繪製指揮官（玩家）
            const cs = worldToScreen(commander.x, commander.y);
            const pulse = 1 + Math.sin(frame * 0.12) * 0.15;
            // 外光晕
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 30;
            ctx.fillStyle = 'rgba(56, 189, 248, 0.9)';
            ctx.beginPath(); ctx.arc(cs.x, cs.y, 16 * pulse, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
            // 外环
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.arc(cs.x, cs.y, 22, 0, Math.PI * 2); ctx.stroke();
            // 中心
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(cs.x, cs.y, 8, 0, Math.PI * 2); ctx.fill();
            // 名字
            ctx.fillStyle = '#fbbf24';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('🪖 指挥官', cs.x, cs.y - 30);

            // 特效
            particles.forEach(pt => { ctx.fillStyle = pt.color; ctx.globalAlpha = Math.max(0, pt.alpha); ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1; });
            floatTexts.forEach(ft => { ctx.fillStyle = ft.color; ctx.globalAlpha = Math.max(0, ft.alpha); ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(ft.text, ft.x, ft.y); ctx.globalAlpha = 1; });

            // 小地圖
            drawMinimap();

            // 搖桿（僅觸控設備）
            if (isTouchDevice()) drawJoystick();

            ctx.restore();
        }

        function drawMinimap() {
            const mw = 180, mh = 135;
            const mx = cvs.width - mw - 16, my = cvs.height - mh - 16;
            // 如果搖桿在右下角，小地圖移到右上角
            const mmx = isTouchDevice() ? cvs.width - mw - 16 : cvs.width - mw - 16;
            const mmy = isTouchDevice() ? 80 : cvs.height - mh - 16;
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.roundRect(mmx, mmy, mw, mh, 8); ctx.fill(); ctx.stroke();

            const scaleX = mw / WORLD_W, scaleY = mh / WORLD_H;
            worldMap.forEach(t => {
                const ownerColor = t.owner === 'player' ? '#22c55e' :
                                   t.owner === 'enemy' ? '#ef4444' : '#94a3b8';
                ctx.fillStyle = ownerColor;
                ctx.fillRect(mmx + t.x * scaleX, mmy + t.y * scaleY, Math.max(3, t.w * scaleX), Math.max(3, t.h * scaleY));
            });

            // 指挥官位置
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath(); ctx.arc(mmx + commander.x * scaleX, mmy + commander.y * scaleY, 4, 0, Math.PI*2); ctx.fill();

            // 相機視口
            const viewW = cvs.width / camera.zoom;
            const viewH = cvs.height / camera.zoom;
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(
                mmx + (camera.x - viewW/2) * scaleX,
                mmy + (camera.y - viewH/2) * scaleY,
                viewW * scaleX,
                viewH * scaleY
            );
        }

        function drawJoystick() {
            const jc = getJoystickCenter();
            ctx.save();
            ctx.globalAlpha = 0.85;
            // 底座
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(jc.x, jc.y, 60, 0, Math.PI*2); ctx.stroke();
            ctx.fillStyle = 'rgba(15, 23, 42, 0.55)';
            ctx.beginPath(); ctx.arc(jc.x, jc.y, 60, 0, Math.PI*2); ctx.fill();
            // 十字裝飾
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.3)';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(jc.x - 60, jc.y); ctx.lineTo(jc.x + 60, jc.y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(jc.x, jc.y - 60); ctx.lineTo(jc.x, jc.y + 60); ctx.stroke();
            // 摇杆頭
            const kx = joystick.active ? joystick.knobX : jc.x;
            const ky = joystick.active ? joystick.knobY : jc.y;
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = joystick.active ? 15 : 5;
            ctx.fillStyle = joystick.active ? 'rgba(56, 189, 248, 0.95)' : 'rgba(56, 189, 248, 0.5)';
            ctx.beginPath(); ctx.arc(kx, ky, 26, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(kx, ky, 26, 0, Math.PI*2); ctx.stroke();
            ctx.restore();
        }

        // ============================================================
        // 交互 / 轉換
        // ============================================================
        function processConvert(obj, from, to, bld) {
            if (obj.bag.some(i => i.type === from)) {
                let idx = obj.bag.findIndex(i => i.type === from);
                obj.bag[idx] = { type: to };
                spawnParticles(bld.x + bld.w/2, bld.y + bld.h/2, ITEMS[to].color, 6);
            }
        }
        function interact(obj, b) {
            for (let i = items.length - 1; i >= 0; i--) {
                if (Math.hypot(obj.x - items[i].x, obj.y - items[i].y) < 30 && obj.bag.length < capacity) {
                    obj.bag.push(items.splice(i, 1)[0]);
                }
            }
            if (Math.hypot(obj.x - (b.smelter.x + b.smelter.w/2), obj.y - (b.smelter.y + b.smelter.h/2)) < 50) processConvert(obj, 'RAW', 'STEEL', b.smelter);
            if (b.chipFab && Math.hypot(obj.x - (b.chipFab.x + b.chipFab.w/2), obj.y - (b.chipFab.y + b.chipFab.h/2)) < 50) processConvert(obj, 'STEEL', 'CHIP', b.chipFab);
            if (b.nukeFab && Math.hypot(obj.x - (b.nukeFab.x + b.nukeFab.w/2), obj.y - (b.nukeFab.y + b.nukeFab.h/2)) < 50) processConvert(obj, 'CHIP', 'BATTERY', b.nukeFab);
            if (b.qFab && Math.hypot(obj.x - (b.qFab.x + b.qFab.w/2), obj.y - (b.qFab.y + b.qFab.h/2)) < 50) processConvert(obj, 'BATTERY', 'CORE', b.qFab);
            if (b.antiFab && Math.hypot(obj.x - (b.antiFab.x + b.antiFab.w/2), obj.y - (b.antiFab.y + b.antiFab.h/2)) < 50) processConvert(obj, 'CORE', 'ANTIM', b.antiFab);
            if (Math.hypot(obj.x - (b.hub.x + b.hub.w/2), obj.y - (b.hub.y + b.hub.h/2)) < 70) {
                if (obj.bag.length > 0) {
                    let mult = 1 + (darkMatter * 0.1);
                    let total = obj.bag.reduce((sum, item) => sum + (ITEMS[item.type].val * mult), 0);
                    obj.bag = []; money += total;
                    spawnFloatText(b.hub.x, b.hub.y - 20, `+$${Math.floor(total).toLocaleString()}`, '#4ade80');
                }
            }
        }

        // ============================================================
        // 主繪製迴圈
        // ============================================================
        function draw() {
            if (viewMode === 'base') {
                drawBase();
            } else {
                drawWorld();
            }
            update();
            requestAnimationFrame(draw);
        }

        window.addEventListener('pagehide', saveGame);
        window.addEventListener('beforeunload', saveGame);
        initializeTycoon().catch(error => {
            console.error('雨神大亨初始化失敗：', error);
            document.getElementById('tycoon-leaderboard-status').textContent = '遊戲初始化失敗，請重新整理頁面。';
        });
    </script>
</body>
