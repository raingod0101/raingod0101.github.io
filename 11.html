<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2D 籃球單挑 · 線上對戰</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #08080c;
    font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
    color: #eee;
    user-select: none; -webkit-user-select: none;
    touch-action: none; overscroll-behavior: none;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    max-width: 100vw; max-height: 100vh;
    width: auto; height: auto;
    display: block;
    touch-action: none;
  }

  #overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.88);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    font-family: system-ui, sans-serif;
  }
  #overlay.hidden { display: none; }
  .panel {
    background: #181826;
    padding: 38px 46px;
    border-radius: 22px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.06);
    max-width: 90vw;
  }
  .panel.hidden { display: none; }
  .panel h1 {
    margin: 0 0 8px;
    font-size: 40px;
    color: #ffd35c;
    letter-spacing: 2px;
  }
  .panel h2 {
    margin: 0 0 20px;
    font-size: 25px;
    color: #eee;
  }
  .panel p {
    margin: 0 0 22px;
    font-size: 15px;
    color: #9a9aac;
    min-height: 22px;
  }
  .panel button {
    display: block;
    width: 280px;
    margin: 13px auto;
    padding: 15px;
    font-size: 19px;
    font-weight: 600;
    border: none;
    border-radius: 13px;
    background: linear-gradient(135deg, #4a9eff, #2a6edb);
    color: #fff;
    cursor: pointer;
    transition: transform 0.08s, filter 0.15s;
    font-family: inherit;
  }
  .panel button:hover { filter: brightness(1.12); }
  .panel button:active { transform: scale(0.97); }
  #btnOnline { background: linear-gradient(135deg, #ff8a1e, #d96a12); }
  #btnCancel { background: #444452; }
  .panel .subtitle {
    font-size: 12px;
    color: #6a6a7a;
    margin-top: 22px;
    line-height: 1.8;
  }
</style>
</head>
<body>

<div id="overlay">
  <div id="menu" class="panel">
    <h1>2D 籃球單挑</h1>
    <p style="color:#8a8a9c;font-size:14px;margin-bottom:24px;">先得 11 分，或 60 秒結束分高者勝</p>
    <button id="btnSolo">單挑電腦</button>
    <button id="btnOnline">線上配對</button>
    <div class="subtitle">A/D 或 ←/→ 移動　·　空白鍵投籃/封蓋<br>E 或 Shift 抄球</div>
  </div>

  <div id="matching" class="panel hidden">
    <h2>正在配對…</h2>
    <p id="matchStatus">連線中</p>
    <button id="btnCancel">取消配對</button>
  </div>
</div>

<canvas id="game" width="1000" height="700"></canvas>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
'use strict';

// ======================================================
// Firebase
// ======================================================
let db = null;
try {
  if (typeof firebase !== 'undefined') {
    firebase.initializeApp({
      databaseURL: 'https://game-24b43-default-rtdb.firebaseio.com/'
    });
    db = firebase.database();
  }
} catch (e) {
  console.warn('Firebase 初始化失敗：', e);
}

// ======================================================
// 常數
// ======================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 1000, H = 700;

const COURT = { x: 30, y: 40, w: 940, h: 580 };
const GROUND_Y = 620;
const FLOOR_Y = GROUND_Y + 8;
const HOOP_Y = 340;
const GRAVITY = 2600;
const JUMP_V = -1250;

const HOOP_L = { x: 110, y: HOOP_Y, r: 22, side: 'left' };
const HOOP_R = { x: 890, y: HOOP_Y, r: 22, side: 'right' };
const THREE_DIST = 280;

// 遠距離命中率懲罰（二次曲線）
const ACC_NEAR = 130;          // 此距離內不罰
const ACC_FAR = 740;           // 此距離外懲罰最大
const ACC_MAX_PENALTY = 0.62;

// ======================================================
// 遊戲物件
// ======================================================
const player = { x: 380, y: GROUND_Y - 22, r: 22, vy: 0, onGround: true, facing: 1, moving: false };
const cpu    = { x: 560, y: GROUND_Y - 22, r: 22, vy: 0, onGround: true, facing: -1, moving: false,
                 shootCD: 0, stealCD: 0 };

const ball = {
  x: 380, y: GROUND_Y - 40, r: 10,
  vx: 0, vy: 0,
  targetX: 380, targetY: GROUND_Y - 40,
  state: 'held',
  owner: 'player',
  shooter: null,
  startX: 0, startY: 0, endX: 0, endY: 0,
  t: 0, dur: 0.7,
  willScore: false,
  points: 2,
  pickupCD: 0
};

const state = {
  score: { player: 0, cpu: 0 },
  timeLeft: 60,
  phase: 'playing',
  msg: '', msgTimer: 0
};

const input = { left: false, right: false, action: false, steal: false };

let charging = false, power = 0, powerDir = 1;
let prevAction = false;
let stealCD = 0;

const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// ======================================================
// 網路狀態
// ======================================================
const net = {
  mode: 'solo',
  myId: 'p_' + Math.random().toString(36).slice(2, 10),
  roomId: null,
  isHost: false,
  opponentId: null,
  matchRef: null,
  roomRef: null,
  stateRef: null,
  inputRef: null,
  remoteInput: null,
  prevRemoteAction: false,
  cpuCharging: false,
  cpuPower: 0,
  inputTimer: 0,
  stateTimer: 0,
  matchListener: null,
  lastSentAction: false,
  leaving: false
};

// ======================================================
// 工具
// ======================================================
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function showMsg(t) { state.msg = t; state.msgTimer = 1.5; }

// ======================================================
// 球權
// ======================================================
function giveBall(who) {
  ball.state = 'held';
  ball.owner = who;
  ball.shooter = null;
  ball.vx = ball.vy = 0;
  ball.pickupCD = 0;
}

function resetPossession(who) {
  if (who === 'player') {
    player.x = 380; player.facing = 1;
    cpu.x = 560;    cpu.facing = -1;
  } else {
    player.x = 440; player.facing = 1;
    cpu.x = 620;    cpu.facing = -1;
  }
  player.y = GROUND_Y - player.r;
  cpu.y = GROUND_Y - cpu.r;
  player.vy = cpu.vy = 0;
  player.onGround = cpu.onGround = true;
  giveBall(who);
  charging = false;
  power = 0;
  stealCD = 0;
  net.cpuCharging = false;
  net.cpuPower = 0;
}

// ======================================================
// 命中率：距離越遠越低（二次曲線）
// ======================================================
function calcAccuracy(shooterX, hoopX, powerVal, moving, defenderDist) {
  const distX = Math.abs(shooterX - hoopX);

  let base;
  if (powerVal >= 0.6 && powerVal <= 0.85) {
    base = 0.90;                              // 完美蓄力
  } else {
    const off = powerVal < 0.6 ? 0.6 - powerVal : powerVal - 0.85;
    base = 0.72 - off * 0.7;                  // 蓄力偏差扣分
  }

  // 距離懲罰：ACC_NEAR 內為 0，ACC_FAR 外為最大，中間用二次曲線
  const t = clamp((distX - ACC_NEAR) / (ACC_FAR - ACC_NEAR), 0, 1);
  const distPenalty = t * t * ACC_MAX_PENALTY;

  let acc = base - distPenalty;

  if (moving) acc -= 0.08;
  if (defenderDist < 60) acc -= 0.12;

  return clamp(acc, 0.04, 0.96);
}

// ======================================================
// 投籃 / 灌籃
// ======================================================
function attemptShot(who, powerVal) {
  const shooter = who === 'player' ? player : cpu;
  const defender = who === 'player' ? cpu : player;
  const hoop = who === 'player' ? HOOP_R : HOOP_L;

  if (!defender.onGround && Math.abs(defender.x - shooter.x) < 100) {
    if (Math.random() < 0.5) {
      ball.state = 'loose';
      ball.owner = null;
      ball.shooter = null;
      ball.x = shooter.x;
      ball.y = shooter.y - 25;
      ball.vx = (Math.random() - 0.5) * 350;
      ball.vy = -350 - Math.random() * 200;
      ball.pickupCD = 0.35;
      showMsg('封蓋！');
      return;
    }
  }

  const distX = Math.abs(shooter.x - hoop.x);
  const defDist = Math.abs(shooter.x - defender.x);
  const acc = calcAccuracy(shooter.x, hoop.x, powerVal, shooter.moving, defDist);
  const points = distX > THREE_DIST ? 3 : 2;

  ball.state = 'shot';
  ball.owner = null;
  ball.shooter = who;
  ball.startX = shooter.x;
  ball.startY = shooter.y - 15;
  ball.endX = hoop.x;
  ball.endY = hoop.y;
  ball.t = 0;
  ball.dur = 0.5 + distX / 1000;
  ball.willScore = Math.random() < acc;
  ball.points = points;

  if (points === 3) showMsg('三分出手！');
}

function attemptDunk(who) {
  const shooter = who === 'player' ? player : cpu;
  const defender = who === 'player' ? cpu : player;
  const hoop = who === 'player' ? HOOP_R : HOOP_L;

  if (!defender.onGround && Math.abs(defender.x - hoop.x) < 100) {
    if (Math.random() < 0.4) {
      ball.state = 'loose';
      ball.owner = null;
      ball.shooter = null;
      ball.x = shooter.x;
      ball.y = shooter.y - 30;
      ball.vx = (Math.random() - 0.5) * 400;
      ball.vy = -400;
      ball.pickupCD = 0.35;
      showMsg('封蓋！');
      return;
    }
  }

  if (shooter.onGround) {
    shooter.vy = JUMP_V;
    shooter.onGround = false;
  }

  ball.state = 'shot';
  ball.owner = null;
  ball.shooter = who;
  ball.startX = shooter.x;
  ball.startY = shooter.y - 20;
  ball.endX = hoop.x;
  ball.endY = hoop.y;
  ball.t = 0;
  ball.dur = 0.4;
  ball.willScore = true;
  ball.points = 2;
  showMsg('灌籃！');
}

function resolveShot() {
  const scorer = ball.shooter;
  const hoop = scorer === 'player' ? HOOP_R : HOOP_L;

  if (ball.willScore) {
    state.score[scorer] += ball.points;
    showMsg('進球 +' + ball.points);

    if (state.phase === 'sudden' || state.timeLeft <= 0) {
      endGame();
      return;
    }
    resetPossession(scorer === 'player' ? 'cpu' : 'player');
  } else {
    ball.state = 'loose';
    ball.owner = null;
    ball.shooter = null;
    ball.x = hoop.x + (Math.random() - 0.5) * 60;
    ball.y = hoop.y + 30;
    ball.vx = (Math.random() - 0.5) * 350;
    ball.vy = -250 - Math.random() * 150;
    ball.pickupCD = 0.2;
  }
}

// ======================================================
// 本地玩家（單機 / Host）
// ======================================================
function updatePlayer(dt) {
  let dir = 0;
  if (input.left) dir -= 1;
  if (input.right) dir += 1;

  player.x += dir * 380 * dt;
  player.moving = dir !== 0;
  if (dir !== 0) player.facing = dir;

  player.vy += GRAVITY * dt;
  player.y += player.vy * dt;
  const standY = GROUND_Y - player.r;
  if (player.y >= standY) {
    player.y = standY;
    player.vy = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }
  player.x = clamp(player.x, COURT.x + player.r, COURT.x + COURT.w - player.r);
}

function updatePlayerAction(dt) {
  const hasBall = ball.owner === 'player' && ball.state === 'held';

  if (charging && !hasBall) { charging = false; power = 0; }

  if (input.action && !prevAction) {
    if (hasBall) {
      charging = true;
      power = 0;
      powerDir = 1;
    } else if (player.onGround) {
      player.vy = JUMP_V;
      player.onGround = false;
    }
  }

  if (input.action && charging && hasBall) {
    power += powerDir * 1.6 * dt;
    if (power >= 1) { power = 1; powerDir = -1; }
    if (power <= 0) { power = 0; powerDir = 1; }
  }

  if (!input.action && prevAction) {
    if (charging && hasBall) {
      charging = false;
      const distX = Math.abs(player.x - HOOP_R.x);
      if (distX < 110) attemptDunk('player');
      else attemptShot('player', power);
      power = 0;
    }
  }
  prevAction = input.action;

  if (stealCD > 0) stealCD -= dt;
  if (input.steal && stealCD <= 0 && ball.owner === 'cpu' && ball.state === 'held') {
    stealCD = 1.0;
    if (Math.abs(player.x - cpu.x) < 55 && Math.random() < 0.32) {
      giveBall('player');
      showMsg('抄球成功！');
      charging = false;
      power = 0;
    }
  }
}

// ======================================================
// 電腦 AI（單機）
// ======================================================
function updateCPU(dt) {
  if (state.phase === 'ended') return;
  if (cpu.shootCD > 0) cpu.shootCD -= dt;
  if (cpu.stealCD > 0) cpu.stealCD -= dt;

  const hasBall = ball.owner === 'cpu' && ball.state === 'held';
  let moveDir = 0;

  if (hasBall) {
    const hoop = HOOP_L;
    const distX = Math.abs(cpu.x - hoop.x);

    if (distX > 140) {
      moveDir = cpu.x > hoop.x ? -1 : 1;
      if (Math.random() < 0.008) moveDir *= -1;
    }

    if (cpu.shootCD <= 0) {
      const defDist = Math.abs(cpu.x - player.x);
      const openEnough = defDist > 75;

      if (distX < 130 && cpu.onGround && Math.random() < 0.02) {
        attemptDunk('cpu');
        cpu.shootCD = 1.6;
        return;
      }
      if (distX < 500 && (Math.random() < 0.012 || (openEnough && Math.random() < 0.025))) {
        const pw = 0.55 + Math.random() * 0.35;
        attemptShot('cpu', pw);
        cpu.shootCD = 1.6;
        return;
      }
    }
  } else {
    const hoop = HOOP_R;
    const targetX = (player.x + hoop.x) / 2 + (Math.random() - 0.5) * 30;
    if (Math.abs(cpu.x - targetX) > 40) {
      moveDir = cpu.x < targetX ? 1 : -1;
    }

    if (ball.owner === 'player' && (charging || ball.state === 'shot')) {
      if (Math.abs(cpu.x - player.x) < 75 && cpu.onGround && Math.random() < 0.045) {
        cpu.vy = JUMP_V;
        cpu.onGround = false;
      }
    }

    if (ball.owner === 'player' && ball.state === 'held' &&
        Math.abs(cpu.x - player.x) < 48 && cpu.stealCD <= 0) {
      cpu.stealCD = 1.5;
      if (Math.random() < 0.28) {
        giveBall('cpu');
        showMsg('抄球成功！');
        charging = false;
        power = 0;
      }
    }
  }

  cpu.x += moveDir * 300 * dt;
  cpu.moving = moveDir !== 0;
  if (moveDir !== 0) cpu.facing = moveDir;

  cpu.vy += GRAVITY * dt;
  cpu.y += cpu.vy * dt;
  const standY = GROUND_Y - cpu.r;
  if (cpu.y >= standY) {
    cpu.y = standY;
    cpu.vy = 0;
    cpu.onGround = true;
  } else {
    cpu.onGround = false;
  }
  cpu.x = clamp(cpu.x, COURT.x + cpu.r, COURT.x + COURT.w - cpu.r);
}

// ======================================================
// 遠端玩家（Host 端驅動 cpu）
// ======================================================
function updateRemote(dt) {
  const inp = net.remoteInput;
  if (!inp) return;

  let dir = 0;
  if (inp.left) dir -= 1;
  if (inp.right) dir += 1;
  cpu.x += dir * 380 * dt;
  cpu.moving = dir !== 0;
  if (dir !== 0) cpu.facing = dir;

  cpu.vy += GRAVITY * dt;
  cpu.y += cpu.vy * dt;
  const standY = GROUND_Y - cpu.r;
  if (cpu.y >= standY) {
    cpu.y = standY;
    cpu.vy = 0;
    cpu.onGround = true;
  } else {
    cpu.onGround = false;
  }
  cpu.x = clamp(cpu.x, COURT.x + cpu.r, COURT.x + COURT.w - cpu.r);

  const hasBall = ball.owner === 'cpu' && ball.state === 'held';

  if (inp.action && !net.prevRemoteAction) {
    if (hasBall) {
      net.cpuCharging = true;
      net.cpuPower = 0;
    } else if (cpu.onGround) {
      cpu.vy = JUMP_V;
      cpu.onGround = false;
    }
  }

  if (!inp.action && net.prevRemoteAction) {
    if (net.cpuCharging && hasBall) {
      net.cpuCharging = false;
      const p = typeof inp.power === 'number' ? inp.power : 0.5;
      const distX = Math.abs(cpu.x - HOOP_L.x);
      if (distX < 110) attemptDunk('cpu');
      else attemptShot('cpu', p);
      net.cpuPower = 0;
    }
  }
  net.prevRemoteAction = inp.action;

  if (cpu.stealCD > 0) cpu.stealCD -= dt;
  if (inp.steal && cpu.stealCD <= 0 && ball.owner === 'player' && ball.state === 'held') {
    cpu.stealCD = 1.0;
    if (Math.abs(player.x - cpu.x) < 55 && Math.random() < 0.32) {
      giveBall('cpu');
      showMsg('抄球成功！');
      charging = false;
      power = 0;
    }
  }

  if (net.cpuCharging) {
    net.cpuPower = Math.min(1, net.cpuPower + 1.6 * dt);
  }
}

// ======================================================
// 球
// ======================================================
function updateBall(dt) {
  if (ball.state === 'held') {
    const holder = ball.owner === 'player' ? player : cpu;
    ball.x = holder.x + holder.facing * 22;
    ball.y = holder.y + 8;
    ball.vx = ball.vy = 0;
  } else if (ball.state === 'shot') {
    ball.t += dt;
    const p = Math.min(1, ball.t / ball.dur);
    const inv = 1 - p;
    const distX = Math.abs(ball.endX - ball.startX);
    const arcH = 70 + distX * 0.35;
    const midX = (ball.startX + ball.endX) / 2;
    const midY = Math.min(ball.startY, ball.endY) - arcH;

    ball.x = inv * inv * ball.startX + 2 * inv * p * midX + p * p * ball.endX;
    ball.y = inv * inv * ball.startY + 2 * inv * p * midY + p * p * ball.endY;

    if (p >= 1) resolveShot();
  } else if (ball.state === 'loose') {
    ball.vy += GRAVITY * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    const floor = GROUND_Y - ball.r;
    if (ball.y > floor) {
      ball.y = floor;
      ball.vy *= -0.5;
      ball.vx *= 0.82;
      if (Math.abs(ball.vy) < 90) ball.vy = 0;
    }
    if (ball.x < COURT.x + ball.r) { ball.x = COURT.x + ball.r; ball.vx *= -0.6; }
    if (ball.x > COURT.x + COURT.w - ball.r) { ball.x = COURT.x + COURT.w - ball.r; ball.vx *= -0.6; }

    if (ball.pickupCD > 0) ball.pickupCD -= dt;
  }
}

// ======================================================
// 碰撞 / 撿球
// ======================================================
function resolveCollision() {
  const dx = player.x - cpu.x;
  const d = Math.abs(dx);
  const minD = player.r + cpu.r;
  if (d < minD && d > 0.01) {
    const push = (minD - d) / 2 + 0.5;
    const s = dx >= 0 ? 1 : -1;
    player.x += s * push;
    cpu.x -= s * push;
    player.x = clamp(player.x, COURT.x + player.r, COURT.x + COURT.w - player.r);
    cpu.x = clamp(cpu.x, COURT.x + cpu.r, COURT.x + COURT.w - cpu.r);
  }
}

function tryPickup() {
  if (ball.state !== 'loose' || ball.pickupCD > 0) return;
  if (ball.y < GROUND_Y - 70) return;

  const dP = Math.hypot(ball.x - player.x, ball.y - player.y);
  const dC = Math.hypot(ball.x - cpu.x, ball.y - cpu.y);
  const R = 45;

  if (dP < R && dC < R) {
    if (dP <= dC) giveBall('player');
    else giveBall('cpu');
  } else if (dP < R) {
    giveBall('player');
  } else if (dC < R) {
    giveBall('cpu');
  }
}

// ======================================================
// 主更新（單機 / Host）
// ======================================================
function update(dt) {
  if (state.phase === 'ended') return;

  if (state.msgTimer > 0) state.msgTimer -= dt;

  if (state.phase === 'playing') {
    state.timeLeft -= dt;
    if (state.timeLeft <= 0) {
      state.timeLeft = 0;
      if (state.score.player === state.score.cpu) {
        state.phase = 'sudden';
        showMsg('延長賽！先得分者勝');
      } else {
        endGame();
        return;
      }
    }
  }

  updatePlayer(dt);
  updatePlayerAction(dt);

  if (net.mode === 'host') updateRemote(dt);
  else updateCPU(dt);

  updateBall(dt);
  resolveCollision();
  tryPickup();
}

// ======================================================
// Guest 端本地更新
// ======================================================
function updateGuestLocal(dt) {
  if (state.phase === 'ended') return;

  // 本地蓄力（僅 UI 與送出用）
  if (input.action) {
    if (!charging) { charging = true; power = 0; powerDir = 1; }
    power += powerDir * 1.6 * dt;
    if (power >= 1) { power = 1; powerDir = -1; }
    if (power <= 0) { power = 0; powerDir = 1; }
  } else {
    charging = false;
  }

  if (state.msgTimer > 0) state.msgTimer -= dt;

  if (state.phase === 'playing') {
    state.timeLeft -= dt;
    if (state.timeLeft < 0) state.timeLeft = 0;
  }

  // 球平滑追
  ball.x += (ball.targetX - ball.x) * 0.5;
  ball.y += (ball.targetY - ball.y) * 0.5;

  // 送出輸入（12Hz + 動作邊緣立即送）
  const actionChanged = input.action !== net.lastSentAction;
  net.inputTimer += dt;
  if (net.inputTimer >= 0.08 || actionChanged) {
    net.inputTimer = 0;
    net.lastSentAction = input.action;
    if (net.inputRef) {
      net.inputRef.set({
        left: input.left,
        right: input.right,
        action: input.action,
        steal: input.steal,
        power: power
      }).catch(() => {});
    }
  }
}

// ======================================================
// 結束
// ======================================================
function endGame() {
  state.phase = 'ended';
  state.msgTimer = 0;
  charging = false;
  power = 0;
  input.action = false;
  input.steal = false;
  input.left = false;
  input.right = false;

  // Host 寫入最終 state，讓 Guest 同步結束
  if (net.mode === 'host' && net.roomId && db) {
    db.ref('rooms/' + net.roomId + '/state').set(serializeState()).catch(() => {});
  }
}

// ======================================================
// 序列化 / 套用遠端狀態
// ======================================================
function serializeState() {
  return {
    p1: { x: player.x, y: player.y, facing: player.facing, onGround: player.onGround, moving: player.moving },
    p2: { x: cpu.x, y: cpu.y, facing: cpu.facing, onGround: cpu.onGround, moving: cpu.moving },
    ball: {
      x: ball.x, y: ball.y,
      state: ball.state,
      owner: ball.owner,
      shooter: ball.shooter,
      points: ball.points,
      t: ball.t, dur: ball.dur,
      startX: ball.startX, startY: ball.startY,
      endX: ball.endX, endY: ball.endY
    },
    score: { p1: state.score.player, p2: state.score.cpu },
    timeLeft: state.timeLeft,
    phase: state.phase,
    msg: state.msg,
    msgTimer: state.msgTimer,
    ts: Date.now()
  };
}

function applyRemoteState(rs) {
  if (!rs || net.isHost) return;

  if (rs.p2) {
    player.x = rs.p2.x;
    player.y = rs.p2.y;
    player.facing = rs.p2.facing;
    player.onGround = rs.p2.onGround;
    player.moving = rs.p2.moving;
  }
  if (rs.p1) {
    cpu.x = rs.p1.x;
    cpu.y = rs.p1.y;
    cpu.facing = rs.p1.facing;
    cpu.onGround = rs.p1.onGround;
    cpu.moving = rs.p1.moving;
  }

  if (rs.ball) {
    ball.state = rs.ball.state;
    ball.owner = rs.ball.owner === 'player' ? 'cpu'
               : rs.ball.owner === 'cpu' ? 'player' : null;
    ball.shooter = rs.ball.shooter === 'player' ? 'cpu'
                 : rs.ball.shooter === 'cpu' ? 'player' : null;
    ball.points = rs.ball.points;
    ball.t = rs.ball.t;
    ball.dur = rs.ball.dur;
    ball.startX = rs.ball.startX;
    ball.startY = rs.ball.startY;
    ball.endX = rs.ball.endX;
    ball.endY = rs.ball.endY;
    ball.targetX = rs.ball.x;
    ball.targetY = rs.ball.y;
    if (Math.abs(ball.x - ball.targetX) > 250) {
      ball.x = ball.targetX;
      ball.y = ball.targetY;
    }
  }

  if (rs.score) {
    state.score.player = rs.score.p2;
    state.score.cpu = rs.score.p1;
  }
  state.timeLeft = rs.timeLeft;
  state.phase = rs.phase;
  state.msg = rs.msg;
  state.msgTimer = rs.msgTimer;
}

// ======================================================
// 繪製
// ======================================================
function drawCourt() {
  const bg = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  bg.addColorStop(0, '#0b0b14');
  bg.addColorStop(0.7, '#161623');
  bg.addColorStop(1, '#1d1d2b');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, GROUND_Y);

  for (let row = 0; row < 6; row++) {
    const alpha = 0.05 - row * 0.005;
    ctx.fillStyle = `rgba(255,255,255,${Math.max(alpha, 0.01)})`;
    for (let i = 0; i < 32; i++) {
      const x = 14 + i * 31 + (row % 2) * 15;
      const y = 60 + row * 30;
      ctx.fillRect(x, y, 14, 14);
    }
  }

  const adTop = GROUND_Y - 110;
  ctx.fillStyle = 'rgba(255,255,255,0.045)';
  ctx.fillRect(0, adTop, W, 110);
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, adTop);
  ctx.lineTo(W, adTop);
  ctx.stroke();

  const adColors = ['#2b4a7a', '#7a2b3a', '#2b7a5a', '#6a5a22', '#4a2b7a'];
  for (let i = 0; i < 6; i++) {
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = adColors[i % adColors.length];
    ctx.fillRect(40 + i * 155, adTop + 28, 120, 54);
    ctx.globalAlpha = 1;
  }

  const wood = ctx.createLinearGradient(0, FLOOR_Y, 0, H);
  wood.addColorStop(0, '#c8873f');
  wood.addColorStop(0.35, '#b57a35');
  wood.addColorStop(1, '#8a5a25');
  ctx.fillStyle = wood;
  ctx.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);

  ctx.strokeStyle = 'rgba(0,0,0,0.13)';
  ctx.lineWidth = 1;
  for (let y = FLOOR_Y + 12; y < H; y += 14) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  for (let x = 30; x < W; x += 88) {
    ctx.beginPath();
    ctx.moveTo(x, FLOOR_Y + 6);
    ctx.lineTo(x, H);
    ctx.stroke();
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, FLOOR_Y);
  ctx.lineTo(W, FLOOR_Y);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(W / 2, FLOOR_Y + 10);
  ctx.lineTo(W / 2, H - 8);
  ctx.stroke();

  const threeL = HOOP_L.x + THREE_DIST;
  const threeR = HOOP_R.x - THREE_DIST;
  ctx.setLineDash([10, 7]);
  ctx.strokeStyle = 'rgba(255,255,255,0.32)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(threeL, FLOOR_Y + 8);
  ctx.lineTo(threeL, H - 6);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(threeR, FLOOR_Y + 8);
  ctx.lineTo(threeR, H - 6);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  ctx.font = 'bold 30px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('3', threeL + 32, H - 20);
  ctx.fillText('3', threeR - 32, H - 20);
}

function drawHoop(hoop) {
  const isRight = hoop.side === 'right';
  const off = 60;
  const boardX = isRight ? hoop.x + off : hoop.x - off;
  const bw = 12;
  const by = hoop.y - 110;
  const bh = 220;

  ctx.strokeStyle = 'rgba(120,120,140,0.8)';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(boardX, by);
  ctx.lineTo(boardX, 0);
  ctx.stroke();

  ctx.fillStyle = 'rgba(235,235,245,0.9)';
  ctx.fillRect(boardX - bw / 2, by, bw, bh);
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 2;
  ctx.strokeRect(boardX - bw / 2, by, bw, bh);

  ctx.strokeStyle = '#ff5533';
  ctx.lineWidth = 3;
  ctx.strokeRect(boardX - bw / 2, hoop.y - 45, bw, 90);

  const rimSide = isRight ? hoop.x + hoop.r : hoop.x - hoop.r;
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(boardX, hoop.y);
  ctx.lineTo(rimSide, hoop.y);
  ctx.stroke();

  ctx.strokeStyle = '#ff6633';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.arc(hoop.x, hoop.y, hoop.r, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(240,240,240,0.55)';
  ctx.lineWidth = 1.5;
  const nb = hoop.y + 50;
  const nw = hoop.r * 0.45;
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    const x1 = hoop.x + Math.cos(a) * hoop.r;
    const y1 = hoop.y + Math.sin(a) * hoop.r;
    const x2 = hoop.x + (i % 2 === 0 ? -1 : 1) * nw;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, nb);
    ctx.stroke();
  }
}

function drawPlayerEntity(ent, isLocal) {
  const { x, y, r } = ent;

  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(x, GROUND_Y - 3, r * 0.95, r * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();

  const isHolding = (isLocal && ball.owner === 'player' && ball.state === 'held') ||
                    (!isLocal && ball.owner === 'cpu' && ball.state === 'held');
  if (isHolding) {
    ctx.strokeStyle = 'rgba(255,215,80,0.75)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x, y, r + 7, 0, Math.PI * 2);
    ctx.stroke();
  }

  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
  g.addColorStop(0, isLocal ? '#8cc8ff' : '#ff9999');
  g.addColorStop(1, isLocal ? '#4a9eff' : '#ff5a5a');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  ctx.fillStyle = '#fff';
  const ex = x + ent.facing * r * 0.32;
  const ey = y - r * 0.22;
  ctx.beginPath();
  ctx.arc(ex, ey, 3.5, 0, Math.PI * 2);
  ctx.fill();
}

function drawBallEntity() {
  const { x, y, r } = ball;

  const t = clamp((GROUND_Y - y) / 320, 0, 1);
  ctx.globalAlpha = 0.25 * (1 - t * 0.6);
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(x, GROUND_Y - 3, r * 0.9 * (1 - t * 0.3), r * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
  g.addColorStop(0, '#ffc07a');
  g.addColorStop(1, '#dd7414');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#6d3204';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x - r, y); ctx.lineTo(x + r, y);
  ctx.moveTo(x, y - r); ctx.lineTo(x, y + r);
  ctx.stroke();
}

function drawPowerBar() {
  if (!charging) return;
  const bw = 110, bh = 14;
  const bx = player.x - bw / 2;
  const by = player.y - 65;

  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(bx, by, bw, bh);

  ctx.fillStyle = 'rgba(90,255,130,0.45)';
  ctx.fillRect(bx + bw * 0.6, by, bw * 0.25, bh);

  const fillW = bw * power;
  ctx.fillStyle = (power >= 0.6 && power <= 0.85) ? '#6dff9e' : '#ffb43c';
  ctx.fillRect(bx, by, fillW, bh);

  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 2;
  ctx.strokeRect(bx, by, bw, bh);

  ctx.fillStyle = '#fff';
  ctx.fillRect(bx + fillW - 2, by - 4, 4, bh + 8);
}

function drawRemotePowerBar() {
  if (net.mode !== 'host' || !net.cpuCharging) return;
  const bw = 110, bh = 14;
  const bx = cpu.x - bw / 2;
  const by = cpu.y - 65;

  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = '#ffb43c';
  ctx.fillRect(bx, by, bw * net.cpuPower, bh);
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(bx, by, bw, bh);
}

function drawUI() {
  ctx.textAlign = 'left';
  ctx.font = 'bold 34px system-ui, sans-serif';

  if (net.mode === 'guest') {
    ctx.fillStyle = '#ff5a5a';
    ctx.fillText('對手 ' + state.score.cpu, 40, 62);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#4a9eff';
    ctx.fillText(state.score.player + ' 你', W - 40, 62);
  } else {
    ctx.fillStyle = '#4a9eff';
    ctx.fillText('你 ' + state.score.player, 40, 62);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ff5a5a';
    const label = net.mode === 'host' ? '對手' : '電腦';
    ctx.fillText(state.score.cpu + ' ' + label, W - 40, 62);
  }

  ctx.textAlign = 'center';
  ctx.font = 'bold 30px system-ui, sans-serif';
  const t = Math.max(0, Math.ceil(state.timeLeft));
  ctx.fillStyle = t <= 10 ? '#ff4444' : (state.phase === 'sudden' ? '#ffd35c' : '#fff');
  ctx.fillText((state.phase === 'sudden' ? 'OT ' : '') + '0:' + (t < 10 ? '0' + t : t), W / 2, 58);

  if (net.mode === 'host' || net.mode === 'guest') {
    ctx.font = '11px system-ui, sans-serif';
    ctx.fillStyle = net.mode === 'host' ? 'rgba(109,255,158,0.55)' : 'rgba(255,180,60,0.55)';
    ctx.fillText(net.mode === 'host' ? '● 主機' : '● 連線中', W / 2, 82);
  }

  if (state.msgTimer > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, state.msgTimer / 0.4);
    ctx.font = 'bold 42px system-ui, sans-serif';
    ctx.fillStyle = '#ffe27a';
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = 16;
    ctx.textAlign = 'center';
    ctx.fillText(state.msg, W / 2, 200);
    ctx.restore();
  }

  if (state.phase === 'ended') {
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';

    const myScore = state.score.player;
    const oppScore = state.score.cpu;
    const won = myScore > oppScore;
    const tied = myScore === oppScore;

    ctx.font = 'bold 80px system-ui, sans-serif';
    ctx.fillStyle = won ? '#6dff9e' : (tied ? '#ffd35c' : '#ff6b6b');
    ctx.fillText(won ? '你贏了！' : (tied ? '平手' : '你輸了'), W / 2, H / 2 - 40);

    ctx.font = '32px system-ui, sans-serif';
    ctx.fillStyle = '#ddd';
    ctx.fillText(`${myScore} : ${oppScore}`, W / 2, H / 2 + 30);

    ctx.font = '20px system-ui, sans-serif';
    ctx.fillStyle = '#aaa';
    ctx.fillText(isTouch ? '點擊畫面返回主選單' : '按 R 返回主選單', W / 2, H / 2 + 110);
  }
}

function render() {
  ctx.clearRect(0, 0, W, H);
  drawCourt();
  drawHoop(HOOP_L);
  drawHoop(HOOP_R);
  drawPlayerEntity(player, true);
  drawPlayerEntity(cpu, false);
  drawBallEntity();
  drawPowerBar();
  drawRemotePowerBar();
  drawTouchControls();
  drawUI();
}

// ======================================================
// 觸控
// ======================================================
const JOY_R = 65;
const ACTION_BTN = { x: W - 120, y: H - 130, r: 70 };
const STEAL_BTN  = { x: W - 275, y: H - 75, r: 50 };
const touch = {
  joy: { id: null, cx: 0, cy: 0, dx: 0, dy: 0 },
  action: null,
  steal: null
};

function toCanvas(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (clientX - r.left) * (W / r.width),
    y: (clientY - r.top) * (H / r.height)
  };
}
function hitBtn(p, b) { return Math.hypot(p.x - b.x, p.y - b.y) < b.r * 1.15; }

function clearTouch() {
  touch.joy.id = null;
  touch.joy.dx = touch.joy.dy = 0;
  touch.action = null;
  touch.steal = null;
  input.left = input.right = false;
  input.action = false;
  input.steal = false;
  net.lastSentAction = false;
}

canvas.addEventListener('pointerdown', e => {
  if (state.phase === 'ended') {
    if (net.mode === 'host' || net.mode === 'guest') leaveRoomAndReturn();
    else resetGame();
    return;
  }
  e.preventDefault();
  const p = toCanvas(e.clientX, e.clientY);

  if (isTouch) {
    if (touch.action === null && hitBtn(p, ACTION_BTN)) {
      touch.action = e.pointerId; input.action = true; return;
    }
    if (touch.steal === null && hitBtn(p, STEAL_BTN)) {
      touch.steal = e.pointerId; input.steal = true; return;
    }
    if (touch.joy.id === null && p.x < W * 0.55 && p.y > H * 0.4) {
      touch.joy.id = e.pointerId;
      touch.joy.cx = p.x;
      touch.joy.cy = Math.min(p.y, H - 100);
      touch.joy.dx = touch.joy.dy = 0;
      return;
    }
  }
}, { passive: false });

canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== touch.joy.id) return;
  e.preventDefault();
  const p = toCanvas(e.clientX, e.clientY);
  let dx = p.x - touch.joy.cx;
  let dy = p.y - touch.joy.cy;
  const d = Math.hypot(dx, dy);
  const max = JOY_R;
  if (d > max) { dx = dx / d * max; dy = dy / d * max; }
  touch.joy.dx = dx; touch.joy.dy = dy;
  const nx = dx / max;
  if (nx < -0.25) { input.left = true; input.right = false; }
  else if (nx > 0.25) { input.right = true; input.left = false; }
  else { input.left = input.right = false; }
}, { passive: false });

function endPointer(e) {
  if (e.pointerId === touch.joy.id) {
    touch.joy.id = null;
    touch.joy.dx = touch.joy.dy = 0;
    input.left = input.right = false;
  }
  if (e.pointerId === touch.action) { touch.action = null; input.action = false; }
  if (e.pointerId === touch.steal)  { touch.steal = null;  input.steal = false; }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

function drawTouchControls() {
  if (!isTouch) return;

  if (touch.joy.id !== null) {
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(touch.joy.cx, touch.joy.cy, JOY_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.arc(touch.joy.cx + touch.joy.dx, touch.joy.cy + touch.joy.dy, 32, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  } else {
    ctx.save();
    ctx.globalAlpha = 0.1;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 8]);
    ctx.beginPath();
    ctx.arc(160, H - 140, JOY_R, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  drawBtn(ACTION_BTN, '投', touch.action !== null, '#ff8a1e');
  drawBtn(STEAL_BTN, '搶', touch.steal !== null, '#3f8bff');
}

function drawBtn(b, label, active, color) {
  ctx.save();
  ctx.globalAlpha = active ? 0.9 : 0.42;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = active ? 1 : 0.6;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.globalAlpha = 0.95;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.round(b.r * 0.7) + 'px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, b.x, b.y + 1);
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
}

// ======================================================
// 鍵盤
// ======================================================
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'a' || k === 'arrowleft') input.left = true;
  if (k === 'd' || k === 'arrowright') input.right = true;
  if (k === ' ') { input.action = true; e.preventDefault(); }
  if (k === 'e' || k === 'shift') input.steal = true;
  if (k === 'r' && state.phase === 'ended') {
    if (net.mode === 'host' || net.mode === 'guest') leaveRoomAndReturn();
    else resetGame();
  }
});
document.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'a' || k === 'arrowleft') input.left = false;
  if (k === 'd' || k === 'arrowright') input.right = false;
  if (k === ' ') input.action = false;
  if (k === 'e' || k === 'shift') input.steal = false;
});

// 配對 / 房間
// ======================================================
const overlay = document.getElementById('overlay');
const menuPanel = document.getElementById('menu');
const matchingPanel = document.getElementById('matching');
const matchStatusEl = document.getElementById('matchStatus');

document.getElementById('btnSolo').onclick = () => {
  net.mode = 'solo';
  overlay.classList.add('hidden');
  resetGame();
};

document.getElementById('btnOnline').onclick = () => {
  if (!db) {
    alert('無法連線 Firebase，請確認網路與資料庫規則');
    return;
  }
  startMatchmaking();
};

document.getElementById('btnCancel').onclick = () => cancelMatchmaking();

function stopMatchListeners() {
  if (net.matchRef) net.matchRef.child('room').off();
  if (net.matchListener && db) {
    db.ref('matchmaking').off('value', net.matchListener);
    net.matchListener = null;
  }
}

function startMatchmaking() {
  menuPanel.classList.add('hidden');
  matchingPanel.classList.remove('hidden');
  matchStatusEl.textContent = '連線中…';

  net.matchRef = db.ref('matchmaking/' + net.myId);
  net.matchRef.set({ ts: Date.now(), status: 'waiting' })
    .then(() => { matchStatusEl.textContent = '搜尋對手中…'; })
    .catch(err => {
      matchStatusEl.textContent = '連線失敗：' + (err.message || '權限不足？');
    });

  net.matchRef.child('room').on('value', snap => {
    if (snap.exists() && !net.roomId) {
      net.roomId = snap.val();
      net.isHost = false;
      net.mode = 'guest';
      stopMatchListeners();
      onMatched();
    }
  });

  net.matchListener = db.ref('matchmaking').on('value', snap => {
    if (net.roomId) return;
    const all = snap.val() || {};
    const candidates = [];
    for (const [id, v] of Object.entries(all)) {
      if (id === net.myId) continue;
      if (!v || v.status !== 'waiting' || v.room) continue;
      candidates.push([id, v]);
    }
    candidates.sort((a, b) => (a[1].ts || 0) - (b[1].ts || 0));
    if (candidates.length === 0) return;
    const oppId = candidates[0][0];
    // 字典序小者發起，避免雙方同時建房間
    if (net.myId < oppId) createRoom(oppId);
  }, err => {
    matchStatusEl.textContent = '讀取配對池失敗：' + (err.message || '權限不足');
  });
}

function createRoom(oppId) {
  if (net.roomId) return;
  const rid = 'r_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
  net.roomId = rid;
  net.isHost = true;
  net.mode = 'host';
  net.opponentId = oppId;

  stopMatchListeners();
  resetGame();

  db.ref('rooms/' + rid).set({
    host: net.myId,
    guest: oppId,
    createdAt: Date.now(),
    state: serializeState(),
    guestInput: { left: false, right: false, action: false, steal: false, power: 0 }
  }).then(() => {
    db.ref('matchmaking/' + oppId + '/room').set(rid).catch(() => {});
    net.matchRef.update({ status: 'matched', room: rid }).catch(() => {});
    onMatched();
  }).catch(err => {
    console.error('建立房間失敗', err);
    matchStatusEl.textContent = '建立房間失敗';
    setTimeout(cancelMatchmaking, 1500);
  });
}

function onMatched() {
  overlay.classList.add('hidden');
  matchStatusEl.textContent = '';

  if (net.isHost) {
    resetGame();
    net.remoteInput = null;
    net.prevRemoteAction = false;
    net.cpuCharging = false;
    net.cpuPower = 0;

    net.inputRef = db.ref('rooms/' + net.roomId + '/guestInput');
    net.inputRef.on('value', snap => {
      const val = snap.val();
      if (val) net.remoteInput = val;
    });
  } else {
    resetGame();
    net.stateRef = db.ref('rooms/' + net.roomId + '/state');
    net.stateRef.on('value', snap => {
      if (!snap.exists()) {
        showMsg('對手已離開');
        state.phase = 'ended';
        return;
      }
      applyRemoteState(snap.val());
    });

    net.roomRef = db.ref('rooms/' + net.roomId);
    net.roomRef.on('value', snap => {
      if (!snap.exists() && net.roomId) {
        showMsg('對手已離開');
        state.phase = 'ended';
      }
    });
  }
}

function cancelMatchmaking() {
  stopMatchListeners();
  if (db && net.myId) db.ref('matchmaking/' + net.myId).remove().catch(() => {});
  net.roomId = null;
  net.isHost = false;
  net.mode = 'solo';
  matchingPanel.classList.add('hidden');
  menuPanel.classList.remove('hidden');
  matchStatusEl.textContent = '';
}

function leaveRoomAndReturn() {
  if (net.leaving) return;
  net.leaving = true;

  if (net.inputRef) { net.inputRef.off(); net.inputRef = null; }
  if (net.stateRef) { net.stateRef.off(); net.stateRef = null; }
  if (net.roomRef) { net.roomRef.off(); net.roomRef = null; }
  if (net.matchRef) { net.matchRef.off(); net.matchRef = null; }

  const oldRoomId = net.roomId;
  const wasHost = net.isHost;

  if (db) {
    if (oldRoomId && wasHost) db.ref('rooms/' + oldRoomId).remove().catch(() => {});
    db.ref('matchmaking/' + net.myId).remove().catch(() => {});
  }

  net.roomId = null;
  net.isHost = false;
  net.mode = 'solo';
  net.remoteInput = null;
  net.prevRemoteAction = false;
  net.cpuCharging = false;
  net.cpuPower = 0;

  overlay.classList.remove('hidden');
  menuPanel.classList.remove('hidden');
  matchingPanel.classList.add('hidden');

  setTimeout(() => { net.leaving = false; }, 300);
}

// ======================================================
// 主迴圈
// ======================================================
let lastTime = 0;

function loop(ts) {
  if (!lastTime) lastTime = ts;
  let dt = (ts - lastTime) / 1000;
  lastTime = ts;
  dt = Math.min(dt, 0.05);

  if (net.mode === 'guest') {
    updateGuestLocal(dt);
  } else {
    update(dt);
    if (net.mode === 'host' && net.roomId && state.phase !== 'ended' && db) {
      net.stateTimer += dt;
      if (net.stateTimer >= 0.05) {
        net.stateTimer = 0;
        db.ref('rooms/' + net.roomId + '/state').set(serializeState()).catch(() => {});
      }
    }
  }

  render();
  requestAnimationFrame(loop);
}

function resetGame() {
  state.score = { player: 0, cpu: 0 };
  state.timeLeft = 60;
  state.phase = 'playing';
  state.msg = '';
  state.msgTimer = 0;
  charging = false;
  power = 0;
  prevAction = false;
  stealCD = 0;
  cpu.shootCD = 0;
  cpu.stealCD = 0;
  net.cpuCharging = false;
  net.cpuPower = 0;
  net.prevRemoteAction = false;
  net.stateTimer = 0;
  net.inputTimer = 0;
  net.lastSentAction = false;
  clearTouch();
  resetPossession('player');
  lastTime = 0;
  ball.targetX = ball.x;
  ball.targetY = ball.y;
}

resetGame();
requestAnimationFrame(loop);

if (!db) {
  console.warn('Firebase 未載入，線上配對不可用。');
} else {
  console.log('Firebase 已連線。若配對失敗，請把 Realtime Database 規則設為 .read/.write = true');
}
</script>
