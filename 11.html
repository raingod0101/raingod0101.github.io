<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Level Devil · HTML 版</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: #07070d;
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  #wrap { position: relative; width: min(100vw, 960px); }
  canvas {
    display: block; width: 100%; height: auto;
    border-radius: 10px;
    box-shadow: 0 0 60px rgba(80, 60, 160, .25), 0 0 0 1px rgba(255,255,255,.06);
    image-rendering: pixelated;
  }
  #touch {
    position: absolute; inset: auto 0 8px 0;
    display: none; justify-content: space-between;
    padding: 0 16px; pointer-events: none;
  }
  #touch button {
    pointer-events: auto;
    width: 74px; height: 74px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.07);
    color: #fff; font-size: 24px; font-weight: 700;
    backdrop-filter: blur(6px);
    user-select: none;
  }
  #touch button.on { background: rgba(255,255,255,.25); }
  @media (pointer: coarse) { #touch { display: flex; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="touch">
    <button data-k="ArrowLeft">◀</button>
    <button data-k="ArrowRight">▶</button>
    <button data-k="Space">跳</button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ===================== 基础设置 ===================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const GRAV     = 1900;   // 重力
const MOVE     = 300;    // 水平速度
const JUMP_V   = -700;   // 跳跃初速
const MAX_FALL = 1150;   // 最大下落速度

const keys = Object.create(null);

window.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'KeyR') restart();
});
window.addEventListener('keyup',  e => { keys[e.code] = false; });
window.addEventListener('blur',   () => { for (const k in keys) keys[k] = false; });

// 触屏
document.querySelectorAll('#touch button').forEach(btn => {
  const k = btn.dataset.k;
  const on  = e => { e.preventDefault(); keys[k] = true;  btn.classList.add('on'); };
  const off = e => { e.preventDefault(); keys[k] = false; btn.classList.remove('on'); };
  btn.addEventListener('pointerdown', on);
  btn.addEventListener('pointerup', off);
  btn.addEventListener('pointercancel', off);
  btn.addEventListener('pointerleave', off);
});

/* ===================== 关卡数据 ===================== */
const LEVELS = [
  {
    name: '第 1 关 · 信任',
    hint: '← → 移动 · 空格跳跃',
    spawn: { x: 60, y: 420 },
    door:  { x: 856, y: 424, w: 44, h: 56 },
    platforms: [
      { x: 0,   y: 480, w: 400, h: 60 },
      { x: 400, y: 480, w: 170, h: 60, fake: true },   // 踩上去会塌
      { x: 570, y: 480, w: 390, h: 60 },
    ],
  },
  {
    name: '第 2 关 · 尖刺',
    hint: '地面看起来很开心',
    spawn: { x: 60, y: 420 },
    door:  { x: 872, y: 424, w: 44, h: 56 },
    platforms: [{ x: 0, y: 480, w: 960, h: 60 }],
    spikes: [
      { x: 340, y: 480, w: 64, h: 42, trigger: 130, delay: 0.32 },
      { x: 620, y: 480, w: 64, h: 42, trigger: 130, delay: 0.32 },
    ],
  },
  {
    name: '第 3 关 · 反转',
    hint: '紫色区域里……相信你的直觉',
    spawn: { x: 60, y: 420 },
    door:  { x: 872, y: 424, w: 44, h: 56 },
    platforms: [{ x: 0, y: 480, w: 960, h: 60 }],
    zones: [{ x: 260, y: 0, w: 440, h: 540, reverse: true }],
  },
  {
    name: '第 4 关 · 它会跑',
    hint: '追上它',
    spawn: { x: 50, y: 420 },
    door:  { x: 640, y: 424, w: 44, h: 56, flee: true },
    platforms: [
      { x: 0,   y: 480, w: 280, h: 60 },
      { x: 280, y: 480, w: 160, h: 60, fake: true },
      { x: 440, y: 480, w: 520, h: 60 },
    ],
    spikes: [
      { x: 560, y: 480, w: 60, h: 40, trigger: 120, delay: 0.3 },
    ],
  },
];

/* ===================== 状态 ===================== */
const player = {
  x: 0, y: 0, w: 24, h: 28,
  vx: 0, vy: 0,
  onGround: false, coyote: 0, jumpHeld: false,
  dead: false, deadT: 0,
  reversing: false,
};

const state = {
  levelIndex: 0,
  level: null,
  deaths: 0,
  shake: 0,
  hint: '',
  hintT: 0,
  won: false,
  transition: 0,
  particles: [],
};

/* ===================== 工具函数 ===================== */
function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

function burst(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 60 + Math.random() * 240;
    state.particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 140,
      size: 2 + Math.random() * 4,
      life: 0.4 + Math.random() * 0.5,
      maxLife: 0.9,
      color,
    });
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

/* ===================== 关卡加载 ===================== */
function loadLevel(i) {
  const def = LEVELS[i];
  state.level = {
    name: def.name,
    hint: def.hint || '',
    spawn: { ...def.spawn },
    door:  { ...def.door, baseX: def.door.x },
    platforms: (def.platforms || []).map(p => ({ ...p, gone: false, shake: 0, contact: false })),
    spikes:    (def.spikes    || []).map(s => ({ ...s, progress: 0, active: false })),
    zones:     (def.zones     || []).map(z => ({ ...z })),
  };
  state.hint = def.hint || def.name;
  state.hintT = 2.4;
  state.particles.length = 0;
  respawn();
}

function respawn() {
  const L = state.level;
  player.x = L.spawn.x;
  player.y = L.spawn.y;
  player.vx = 0;
  player.vy = 0;
  player.dead = false;
  player.deadT = 0;
  player.onGround = false;
  player.coyote = 0;
  player.jumpHeld = false;
  player.reversing = false;

  for (const p of L.platforms) { p.gone = false; p.shake = 0; p.contact = false; }
  for (const s of L.spikes)    { s.active = false; s.progress = 0; }
  L.door.x = L.door.baseX;
  state.particles.length = 0;
}

function restart() {
  if (state.won) {
    state.won = false;
    state.levelIndex = 0;
    state.deaths = 0;
    loadLevel(0);
  } else {
    loadLevel(state.levelIndex);
  }
}

function killPlayer() {
  if (player.dead || state.won || state.transition > 0) return;
  player.dead = true;
  player.deadT = 0.85;
  state.deaths++;
  state.shake = 10;
  burst(player.x + player.w / 2, player.y + player.h / 2, 20, '#ff4d6d');
}

function winLevel() {
  if (state.transition > 0 || state.won) return;
  state.transition = 0.4;
  burst(state.level.door.x + 22, state.level.door.y + 28, 24, '#4ade80');
}

/* ===================== 更新 ===================== */
function update(dt) {
  const L = state.level;
  if (!L) return;

  state.shake = Math.max(0, state.shake - dt * 30);
  if (state.hintT > 0) state.hintT -= dt;

  // 粒子
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.vy += 1200 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) state.particles.splice(i, 1);
  }

  if (state.won) return;

  // 过关过渡
  if (state.transition > 0) {
    state.transition -= dt;
    if (state.transition <= 0) {
      state.levelIndex++;
      if (state.levelIndex >= LEVELS.length) {
        state.won = true;
      } else {
        loadLevel(state.levelIndex);
      }
    }
    return;
  }

  // 死亡处理
  if (player.dead) {
    player.deadT -= dt;
    player.vy = Math.min(player.vy + GRAV * dt, MAX_FALL);
    player.y += player.vy * dt;
    if (player.deadT <= 0) respawn();
    return;
  }

  /* ---- 土狼时间（用上一帧的 onGround） ---- */
  player.coyote = player.onGround ? 0.1 : Math.max(0, player.coyote - dt);

  /* ---- 反转区域 ---- */
  let rev = false;
  for (const z of L.zones) {
    if (z.reverse && overlap(player, z)) rev = true;
  }
  player.reversing = rev;

  /* ---- 水平输入 ---- */
  let dir = 0;
  if (keys['ArrowLeft']  || keys['KeyA']) dir -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) dir += 1;
  if (rev) dir = -dir;
  player.vx = dir * MOVE;

  /* ---- 跳跃 ---- */
  const jumpKey = !!(keys['Space'] || keys['ArrowUp'] || keys['KeyW']);
  if (jumpKey && !player.jumpHeld && (player.onGround || player.coyote > 0)) {
    player.vy = JUMP_V;
    player.onGround = false;
    player.coyote = 0;
    player.jumpHeld = true;
  }
  if (!jumpKey) {
    player.jumpHeld = false;
    if (player.vy < 0) player.vy += GRAV * 1.7 * dt; // 松键小跳
  }

  /* ---- 水平移动与碰撞 ---- */
  const solids = L.platforms.filter(p => !p.gone);

  player.x += player.vx * dt;
  for (const p of solids) {
    if (overlap(player, p)) {
      if (player.vx > 0)      player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
    }
  }
  if (player.x < 0) player.x = 0;
  if (player.x + player.w > W) player.x = W - player.w;

  /* ---- 垂直移动与碰撞 ---- */
  player.vy = Math.min(player.vy + GRAV * dt, MAX_FALL);
  player.y += player.vy * dt;
  player.onGround = false;

  for (const p of solids) {
    if (overlap(player, p)) {
      if (player.vy > 0) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
        if (p.fake) p.contact = true;
      } else if (player.vy < 0) {
        player.y = p.y + p.h;
        player.vy = 0;
      }
    }
  }

  /* ---- 假地板计时 ---- */
  for (const p of L.platforms) {
    if (!p.fake || p.gone) continue;
    if (p.contact) {
      p.shake += dt;
      if (p.shake > 0.42) {
        p.gone = true;
        burst(p.x + p.w / 2, p.y + 8, 18, '#3a3a5c');
        state.shake = 7;
      }
    } else {
      p.shake = Math.max(0, p.shake - dt * 1.5);
    }
    p.contact = false;
  }

  /* ---- 尖刺 ---- */
  for (const s of L.spikes) {
    if (!s.active) {
      if (player.x + player.w > s.x - (s.trigger || 130)) {
        s.active = true;
      }
    }
    if (s.active && s.progress < 1) {
      s.progress = Math.min(1, s.progress + dt / (s.delay || 0.32));
    }
    if (s.progress > 0.06) {
      const hh = s.h * s.progress;
      if (overlap(player, { x: s.x, y: s.y - hh, w: s.w, h: hh })) {
        killPlayer();
        return;
      }
    }
  }

  /* ---- 会跑的门 ---- */
  const d = L.door;
  if (d.flee && d.x < 890) {
    if (player.x + player.w > d.x - 300) {
      d.x = Math.min(890, d.x + 430 * dt);
    }
  }

  /* ---- 进门的判定 ---- */
  if (overlap(player, d)) {
    winLevel();
    return;
  }

  /* ---- 掉出画面 ---- */
  if (player.y > H + 120) {
    killPlayer();
  }
}

/* ===================== 渲染 ===================== */
function render() {
  const L = state.level;

  ctx.save();

  if (state.shake > 0.5) {
    ctx.translate(
      (Math.random() - 0.5) * state.shake,
      (Math.random() - 0.5) * state.shake
    );
  }

  // 背景
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#151527');
  bg.addColorStop(0.7, '#0d0d17');
  bg.addColorStop(1, '#08080f');
  ctx.fillStyle = bg;
  ctx.fillRect(-40, -40, W + 80, H + 80);

  if (L) {
    // 反转区域
    for (const z of L.zones) {
      ctx.fillStyle = 'rgba(160, 90, 255, 0.10)';
      ctx.fillRect(z.x, z.y, z.w, z.h);
      ctx.strokeStyle = 'rgba(160, 90, 255, 0.35)';
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 8]);
      ctx.strokeRect(z.x + 1, z.y + 1, z.w - 2, z.h - 2);
      ctx.setLineDash([]);
      ctx.lineWidth = 1;
    }

    // 平台（真假的画法完全一样）
    for (const p of L.platforms) {
      if (p.gone) continue;
      let ox = 0, oy = 0;
      if (p.fake && p.shake > 0.01) {
        const k = Math.min(p.shake / 0.42, 1);
        ox = (Math.random() - 0.5) * 5 * k;
        oy = (Math.random() - 0.5) * 3 * k;
      }
      ctx.fillStyle = '#232338';
      ctx.fillRect(p.x + ox, p.y + oy, p.w, p.h);
      ctx.fillStyle = '#3a3a5c';
      ctx.fillRect(p.x + ox, p.y + oy, p.w, 4);
    }

    // 尖刺
    for (const s of L.spikes) {
      if (s.progress <= 0.01) continue;
      const hh = s.h * s.progress;
      const count = Math.max(1, Math.round(s.w / 16));
      const step = s.w / count;
      ctx.fillStyle = '#ff4d6d';
      for (let i = 0; i < count; i++) {
        const x = s.x + i * step;
        ctx.beginPath();
        ctx.moveTo(x, s.y);
        ctx.lineTo(x + step / 2, s.y - hh);
        ctx.lineTo(x + step, s.y);
        ctx.closePath();
        ctx.fill();
      }
      // 底部暗红
      ctx.fillStyle = 'rgba(120, 20, 45, 0.8)';
      ctx.fillRect(s.x, s.y - 3, s.w, 3);
    }

    // 门
    const d = L.door;
    ctx.save();
    ctx.shadowColor = '#4ade80';
    ctx.shadowBlur = 22;
    ctx.fillStyle = '#4ade80';
    ctx.fillRect(d.x, d.y, d.w, d.h);
    ctx.restore();
    ctx.fillStyle = '#0d0d17';
    ctx.fillRect(d.x + 5, d.y + 5, d.w - 10, d.h - 10);
    ctx.fillStyle = '#4ade80';
    ctx.fillRect(d.x + d.w - 14, d.y + d.h / 2 - 3, 6, 6);

    // 玩家
    if (!player.dead) {
      const cx = player.x + player.w / 2;
      const cy = player.y + player.h / 2;
      ctx.save();
      ctx.translate(cx, cy);
      if (player.reversing) {
        ctx.rotate(Math.sin(performance.now() / 80) * 0.09);
      }
      ctx.fillStyle = player.reversing ? '#d8b4ff' : '#f0f0fa';
      roundRect(-player.w / 2, -player.h / 2, player.w, player.h, 5);
      ctx.fill();

      ctx.fillStyle = '#14141f';
      const look = player.vx > 0 ? 2 : player.vx < 0 ? -2 : 0;
      ctx.fillRect(-7 + look, -7, 4, 7);
      ctx.fillRect( 3 + look, -7, 4, 7);
      ctx.restore();
    }

    // 粒子
    for (const p of state.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  /* ---------- HUD（不跟着震） ---------- */
  if (L) {
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = '600 16px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillText(L.name, 20, 32);

    ctx.textAlign = 'right';
    ctx.fillText('死亡 ' + state.deaths, W - 20, 32);

    // 提示
    if (state.hintT > 0 && !state.won) {
      ctx.globalAlpha = Math.min(1, state.hintT * 0.8);
      ctx.textAlign = 'center';
      ctx.font = '700 26px system-ui, sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText(state.hint, W / 2, 100);
      ctx.globalAlpha = 1;
    }
  }

  // 通关画面
  if (state.won) {
    ctx.fillStyle = 'rgba(5,5,10,0.86)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';

    ctx.fillStyle = '#4ade80';
    ctx.font = '800 54px system-ui, sans-serif';
    ctx.fillText('你赢了……吗？', W / 2, H / 2 - 30);

    ctx.fillStyle = '#fff';
    ctx.font = '400 22px system-ui, sans-serif';
    ctx.fillText('总死亡次数：' + state.deaths, W / 2, H / 2 + 40);

    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.font = '400 18px system-ui, sans-serif';
    ctx.fillText('按 R 重新开始', W / 2, H / 2 + 84);
  }
}

/* ===================== 主循环 ===================== */
let last = performance.now();

function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;   // 防止切后台后瞬移
  update(dt);
  render();
  requestAnimationFrame(loop);
}

loadLevel(0);
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
