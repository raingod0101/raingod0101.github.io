<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D 槍戰對決 | Raingod</title>
    <style>
        * { touch-action: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; background: #020205; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        #ui-container {
            position: absolute; top: 75px; left: 15px;
            display: flex; flex-direction: column; gap: 8px;
            z-index: 100; pointer-events: none;
        }

        .ui-badge {
            font-size: 16px; font-weight: bold; color: #fff;
            background: rgba(15, 15, 25, 0.85); padding: 8px 16px; 
            border: 2px solid #a855f7; border-radius: 50px;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3); width: fit-content;
            backdrop-filter: blur(8px);
        }

        #radar-container {
            position: absolute; top: 75px; right: 15px;
            width: 120px; height: 120px; border-radius: 50%;
            background: rgba(10, 10, 20, 0.85); border: 2px solid #06b6d4;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
            z-index: 100; pointer-events: none; backdrop-filter: blur(8px);
            overflow: hidden;
        }

        #radar-canvas { width: 100%; height: 100%; }

        #tracker-info {
            position: absolute; bottom: 140px; width: 100%; text-align: center;
            color: #00f3ff; font-weight: bold; font-size: 16px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.8);
            z-index: 90; pointer-events: none;
        }

        #reconnect-hint {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #ffffff; font-weight: bold; font-size: 20px;
            background: rgba(0, 0, 0, 0.7); padding: 12px 24px; border-radius: 30px;
            border: 1px solid #a855f7; pointer-events: none; display: none; z-index: 150;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        #joy-base {
            position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(168, 85, 247, 0.5);
            border-radius: 50%; z-index: 100; display: none; backdrop-filter: blur(4px);
        }
        #joy-stick {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            background: #a855f7; border-radius: 50%;
            box-shadow: 0 0 15px #a855f7;
        }

        #jump-btn {
            position: absolute; bottom: 35px; right: 25px; width: 90px; height: 90px;
            background: linear-gradient(135deg, #a855f7, #7c3aed); color: #fff; border-radius: 50%;
            display: none; justify-content: center; align-items: center;
            font-size: 18px; font-weight: bold; z-index: 100;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.6);
            border: 2px solid rgba(255,255,255,0.4);
        }

        #fire-btn {
            position: absolute; bottom: 130px; right: 25px; width: 90px; height: 90px;
            background: linear-gradient(135deg, #ff4444, #cc0000); color: #fff; border-radius: 50%;
            display: none; justify-content: center; align-items: center;
            font-size: 16px; font-weight: bold; z-index: 100;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.6);
            border: 2px solid rgba(255,255,255,0.4);
        }

        #scope-btn {
            position: absolute; bottom: 130px; left: 25px; width: 80px; height: 80px;
            background: linear-gradient(135deg, #06b6d4, #0891b2); color: #fff; border-radius: 50%;
            display: none; justify-content: center; align-items: center;
            font-size: 14px; font-weight: bold; z-index: 100;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.6);
            border: 2px solid rgba(255,255,255,0.4);
        }

        #weapon-panel {
            position: absolute; bottom: 240px; right: 15px; width: 120px;
            background: rgba(10, 10, 20, 0.9); border: 2px solid #06b6d4;
            border-radius: 12px; padding: 8px; display: none;
            z-index: 100; backdrop-filter: blur(8px);
        }

        .weapon-slot {
            display: flex; justify-content: space-between; align-items: center;
            color: #fff; padding: 6px 8px; margin: 2px 0; border-radius: 6px;
            font-size: 13px; font-weight: bold; cursor: pointer;
        }
        .weapon-slot.active { background: #7c3aed; box-shadow: 0 0 10px #7c3aed; }
        .weapon-slot .ammo { font-size: 11px; color: #67e8f9; }

        #overlay {
            position: absolute; top: 60px; left: 0; width: 100%; height: calc(100% - 60px); 
            background: rgba(5, 5, 10, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200;
            padding: 20px; box-sizing: border-box; text-align: center; color: #fff;
            overflow-y: auto;
        }

        button.start-btn { 
            padding: 16px 45px; font-size: 22px; font-weight: bold;
            background: #a855f7; color: #fff; border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.7); margin-top: 15px;
        }

        #save-status {
            min-height: 1.5em; margin: 10px 0 0; color: #b9a1d8; font-size: 13px;
        }
        .mode-btn { padding: 12px 20px; margin: 5px; border: 1px solid #06b6d4; border-radius: 24px; color: #fff; background: #111827; font-weight: bold; cursor: pointer; }
        .mode-btn.selected { background: #7c3aed; border-color: #c4b5fd; box-shadow: 0 0 14px #7c3aed; }
        #duel-status { color: #67e8f9; min-height: 1.5em; max-width: 420px; }
        #opponent-hud { position:absolute; top:150px; left:15px; z-index:100; color:#fff; background:rgba(8,15,30,.88); border:1px solid #06b6d4; border-radius:12px; padding:9px 13px; display:none; font-weight:bold; pointer-events:none; }

        #leaderboard-button {
            position: absolute; top: 210px; right: 15px; z-index: 210;
            padding: 9px 14px; border: 1px solid #06b6d4; border-radius: 20px;
            color: #fff; background: rgba(10, 10, 20, 0.9); font-weight: bold;
            cursor: pointer; pointer-events: auto;
        }

        #leaderboard {
            position: absolute; top: 60px; left: 0; width: 100%; height: calc(100% - 60px); z-index: 220; display: none;
            align-items: center; justify-content: center; padding: 20px;
            background: rgba(5, 5, 10, 0.95); color: #fff; box-sizing: border-box;
        }

        .leaderboard-card {
            width: min(520px, 100%); max-height: 80vh; overflow-y: auto;
            padding: 20px; border: 2px solid #06b6d4; border-radius: 18px;
            background: #0b1020; box-sizing: border-box;
        }

        .leaderboard-row {
            display: flex; justify-content: space-between; gap: 12px;
            padding: 10px; border-bottom: 1px solid #26334a;
        }

        .leaderboard-actions { display: flex; gap: 10px; margin-top: 16px; }
        .leaderboard-actions button {
            padding: 10px 16px; border: 0; border-radius: 8px; cursor: pointer;
            color: #fff; background: #334155; font-weight: bold;
        }
        .leaderboard-actions button:first-child { background: #0891b2; }

        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 40px; height: 40px; pointer-events: none; z-index: 50;
            display: none;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: #00f3ff;
            box-shadow: 0 0 6px #00f3ff;
        }
        #crosshair::before { width: 2px; height: 16px; left: 19px; top: 12px; }
        #crosshair::after { width: 16px; height: 2px; left: 12px; top: 19px; }

        #health-bar {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 200px; height: 20px; background: rgba(0,0,0,0.6);
            border: 2px solid #06b6d4; border-radius: 10px; z-index: 100;
            display: none; overflow: hidden;
        }
        #health-fill {
            width: 100%; height: 100%; background: linear-gradient(90deg, #00f3ff, #a855f7);
            transition: width 0.2s;
        }
        #health-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-weight: bold; font-size: 12px; z-index: 101;
        }

        .hit-marker {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #ff4444; font-size: 30px; font-weight: bold; pointer-events: none;
            z-index: 60; display: none; text-shadow: 0 0 10px #ff0000;
        }

        #kill-feed {
            position: absolute; top: 200px; right: 15px; z-index: 100;
            display: flex; flex-direction: column; gap: 4px; pointer-events: none;
            font-size: 12px; color: #fff; text-align: right;
        }
        #kill-feed div { background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 6px; }
    </style>
</head>
<body>
    <link rel="stylesheet" href="menu.css">
    <div id="nav_bar"></div>
    <script src="menu.js"></script>

    <div id="overlay">
        <h1 id="game-title" style="margin-bottom:8px; font-size:30px;">🔫 3D 槍戰對決</h1>
        <p id="game-desc" style="margin-bottom:20px; color: #aaa; max-width: 440px; line-height: 1.6; font-size: 14px;">
            選擇你的武器，與對手展開激烈槍戰！<br>
            <b>多種武器</b>任你切換，擊殺對手獲勝！
        </p>
        <p id="record-info" style="margin:0; color:#c4b5fd; font-size:14px;">個人最佳：尚無紀錄</p>
        <div id="mode-picker" style="margin-top:14px;">
            <button class="mode-btn selected" id="solo-mode-btn" type="button">🎯 訓練模式</button>
            <button class="mode-btn" id="duel-mode-btn" type="button">⚔️ 1 對 1 對決</button>
        </div>
        <p id="duel-status" role="status">訓練模式：練習武器與移動。對決模式：先擊殺對手 5 次獲勝。</p>
        <p id="save-status" role="status">登入後可將成績同步至帳號。</p>
        <button class="start-btn" id="start-btn">開始槍戰</button>
    </div>

    <button id="leaderboard-button" type="button">🏆 登入後查看排行榜</button>
    <div id="leaderboard" role="dialog" aria-modal="true" aria-labelledby="leaderboard-title">
        <section class="leaderboard-card">
            <h2 id="leaderboard-title" style="color:#06b6d4; margin-top:0;">🏆 槍戰排行榜</h2>
            <p id="leaderboard-status" style="color:#aaa;" role="status">請登入帳號後查看。</p>
            <div id="leaderboard-list"></div>
            <div class="leaderboard-actions">
                <button id="leaderboard-refresh" type="button">重新整理</button>
                <button id="leaderboard-close" type="button">關閉</button>
            </div>
        </section>
    </div>

    <div id="opponent-hud">⚔️ 對手：<span id="opponent-name">等待配對…</span><br>對手擊殺：<span id="opponent-score">0</span> / 5</div>
    <div id="ui-container">
        <div class="ui-badge">💀 擊殺: <span id="score">0</span> / <span id="target-count">5</span></div>
        <div class="ui-badge" id="timer">⏱️ 時間: 0.00s</div>
    </div>

    <div id="radar-container">
        <canvas id="radar-canvas" width="120" height="120"></canvas>
    </div>

    <div id="tracker-info">📍 搜尋敵人中...</div>
    <div id="reconnect-hint">🖱️ 點擊畫面重新控制視角</div>
    <div id="crosshair"></div>
    <div class="hit-marker" id="hit-marker">✕</div>
    <div id="kill-feed"></div>
    
    <div id="health-bar">
        <div id="health-fill"></div>
        <div id="health-text">100 / 100</div>
    </div>

    <div id="joy-base"><div id="joy-stick"></div></div>
    <div id="jump-btn">JUMP</div>
    <div id="fire-btn">FIRE</div>
    <div id="scope-btn">SCOPE</div>

    <div id="weapon-panel">
        <div style="color:#06b6d4; font-weight:bold; text-align:center; margin-bottom:4px; font-size:12px;">武器庫</div>
        <div id="weapon-list"></div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ========== 武器定義 ==========
        const WEAPONS = [
            { id: 'pistol', name: '手槍', damage: 25, fireRate: 350, ammo: 12, maxAmmo: 12, reloadTime: 1200, range: 80, spread: 0.01, color: 0x888888, auto: false },
            { id: 'rifle', name: '步槍', damage: 18, fireRate: 120, ammo: 30, maxAmmo: 30, reloadTime: 1800, range: 120, spread: 0.03, color: 0x4a7c59, auto: true },
            { id: 'shotgun', name: '霰彈槍', damage: 12, fireRate: 700, ammo: 6, maxAmmo: 6, reloadTime: 2200, range: 40, spread: 0.12, color: 0x8b4513, auto: false, pellets: 6 },
            { id: 'sniper', name: '狙擊槍', damage: 80, fireRate: 1200, ammo: 5, maxAmmo: 5, reloadTime: 2500, range: 300, spread: 0.001, color: 0x2c3e50, auto: false, scope: true },
            { id: 'smg', name: '衝鋒槍', damage: 12, fireRate: 80, ammo: 40, maxAmmo: 40, reloadTime: 1500, range: 70, spread: 0.05, color: 0x9b59b6, auto: true },
            { id: 'lmg', name: '機槍', damage: 15, fireRate: 100, ammo: 60, maxAmmo: 60, reloadTime: 3500, range: 100, spread: 0.06, color: 0x7f8c8d, auto: true },
            { id: 'rocket', name: '火箭筒', damage: 120, fireRate: 2000, ammo: 2, maxAmmo: 2, reloadTime: 4000, range: 60, spread: 0.02, color: 0xe74c3c, auto: false, explosive: true },
            { id: 'railgun', name: '電磁炮', damage: 150, fireRate: 1500, ammo: 3, maxAmmo: 3, reloadTime: 3000, range: 200, spread: 0.0, color: 0x00f3ff, auto: false, pierce: true }
        ];

        const DEFAULT_PROFILE = { bestKills: 0, completedRuns: 0 };
        const LEADERBOARD_URL = 'https://game-24b43-default-rtdb.firebaseio.com/space_runner_leaderboard';
        const DUEL_ROOT = 'https://game-24b43-default-rtdb.firebaseio.com/space_runner_duel';

        let gameMode = 'solo';
        let duelRoomId = null, duelUid = null, duelName = '玩家', opponentUid = null;
        let duelSeed = 1, opponentScore = 0, opponentMesh = null, opponentLabel = null;
        let duelPollTimer = null, duelQueueId = null, duelStartedAt = 0, lastDuelPublish = 0;
        let mapSeed = 1;
        let scene, camera, renderer, player;
        let score = 0, prevTime = performance.now();
        let moveInput = { x: 0, y: 0 }, velocityY = 0;
        let jumpCount = 0, theta = 0, phi = Math.PI / 2.5;
        let gameRunning = false;
        let gameProfile = { ...DEFAULT_PROFILE };

        const MOVE_SPEED = 22;
        const JUMP_POWER = 17;
        const GRAVITY = 42;
        const MAX_FALL_SPEED = 70;
        let elapsedTime = 0;
        const KILL_TARGET = 5;

        // 玩家狀態
        let playerHealth = 100;
        let isDead = false;
        let respawnTimer = 0;
        let lastFireTime = 0;
        let isReloading = false;
        let reloadTimer = 0;
        let currentWeaponIndex = 0;
        let currentAmmo = WEAPONS[0].ammo;
        let muzzleFlash = null;

        // 第一人稱槍械模型
        let weaponModels = [];
        let currentWeaponModel = null;
        let scoped = false;
        const DEFAULT_FOV = 75;

        // 敵人(訓練模式)
        let enemies = [];
        let enemyBullets = [];
        let playerBullets = [];

        const platforms = [];
        const keys = { w: false, a: false, s: false, d: false, r: false };

        const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

        const radarCanvas = document.getElementById('radar-canvas');
        const radarCtx = radarCanvas.getContext('2d');
        const hintEl = document.getElementById('reconnect-hint');
        const hitMarkerEl = document.getElementById('hit-marker');
        const killFeedEl = document.getElementById('kill-feed');

        // ========== 個人資料 ==========
        function normalizeProfile(value) {
            if (!value || typeof value !== 'object' || Array.isArray(value)) return { ...DEFAULT_PROFILE };
            return {
                bestKills: Number.isFinite(Number(value.bestKills)) ? Number(value.bestKills) : 0,
                completedRuns: Number.isFinite(Number(value.completedRuns)) ? Math.floor(Number(value.completedRuns)) : 0
            };
        }

        function renderProfile() {
            document.getElementById('record-info').textContent = `個人最佳：最多擊殺 ${gameProfile.bestKills} · 完成 ${gameProfile.completedRuns} 場`;
        }

        function setSaveStatus(message, isError = false) {
            const status = document.getElementById('save-status');
            status.textContent = message;
            status.style.color = isError ? '#fca5a5' : '#b9a1d8';
        }

        const profileReady = window.raingodInitGame('space-runner', DEFAULT_PROFILE, data => {
            gameProfile = normalizeProfile(data);
            renderProfile();
        });

        window.raingodFirebaseReady.then(() => {
            window.raingodOnAuthStateChanged(user => {
                const leaderboardButton = document.getElementById('leaderboard-button');
                leaderboardButton.textContent = user ? '🏆 排行榜' : '🏆 登入後查看排行榜';
                if (user) {
                    setSaveStatus('已登入：戰績會儲存並同步至帳號。');
                } else {
                    setSaveStatus('戰績會儲存在此裝置；登入後可同步至帳號並參加排行榜。');
                }
            });
        });

        async function saveCompletedRun(isWin) {
            try {
                await profileReady;
                const nextProfile = normalizeProfile(gameProfile);
                nextProfile.bestKills = Math.max(nextProfile.bestKills, score);
                if (isWin) nextProfile.completedRuns++;
                const accountSaveSucceeded = await window.raingodSave('space-runner', nextProfile);
                gameProfile = nextProfile;
                renderProfile();
                if (firebase.auth().currentUser && accountSaveSucceeded) {
                    setSaveStatus('戰績已儲存並同步至帳號。');
                } else if (firebase.auth().currentUser) {
                    setSaveStatus('戰績已儲存在此裝置，但帳號同步失敗，請稍後重試。', true);
                } else {
                    setSaveStatus('戰績已儲存在此裝置；登入後可同步至帳號。');
                }
            } catch (error) {
                console.error('儲存紀錄失敗：', error);
                setSaveStatus('戰績儲存失敗，請確認瀏覽器儲存空間後重試。', true);
            }
        }

        // ========== 排行榜 ==========
        async function submitLeaderboardTime(time) {
            try {
                await window.raingodFirebaseReady;
                await window.raingodAuthReady;
                const user = firebase.auth().currentUser;
                if (!user || !Number.isFinite(time) || time <= 0) return;
                const uid = user.uid;
                const entryUrl = `${LEADERBOARD_URL}/${encodeURIComponent(uid)}.json`;
                const previousResponse = await fetch(entryUrl);
                if (!previousResponse.ok) throw new Error(`HTTP ${previousResponse.status}`);
                const previous = await previousResponse.json();
                if (window.raingodCurrentUser?.uid !== uid) return;
                if (previous && Number(previous.bestTime) <= time) return;

                const payload = {
                    name: user.displayName || (user.email ? user.email.split('@')[0] : '玩家'),
                    bestTime: Number(time.toFixed(2)),
                    updatedAt: Date.now()
                };
                const response = await fetch(entryUrl, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                setSaveStatus('新紀錄已送入排行榜！');
            } catch (error) {
                console.error('上傳排行榜失敗：', error);
                setSaveStatus('帳號成績已保存，但排行榜更新失敗，請稍後重試。', true);
            }
        }

        async function refreshLeaderboard() {
            const status = document.getElementById('leaderboard-status');
            const list = document.getElementById('leaderboard-list');
            if (!await window.raingodRequireAuth('排行榜')) return;
            const uid = window.raingodCurrentUser.uid;
            status.textContent = '排行榜載入中…';
            list.replaceChildren();
            try {
                const response = await fetch(`${LEADERBOARD_URL}.json`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                if (window.raingodCurrentUser?.uid !== uid) return;
                const rows = await response.json() || {};
                const entries = Object.entries(rows)
                    .filter(([, row]) => row && Number.isFinite(Number(row.bestTime)) && Number(row.bestTime) > 0)
                    .sort((a, b) => Number(a[1].bestTime) - Number(b[1].bestTime))
                    .slice(0, 50);
                entries.forEach(([entryUid, row], index) => {
                    const line = document.createElement('div');
                    line.className = 'leaderboard-row';
                    const name = document.createElement('span');
                    name.textContent = `${index + 1}. ${row.name || '玩家'}${entryUid === uid ? '（你）' : ''}`;
                    const value = document.createElement('strong');
                    value.textContent = `${Number(row.bestTime).toFixed(2)} 秒`;
                    line.append(name, value);
                    list.appendChild(line);
                });
                status.textContent = entries.length
                    ? `已載入 ${entries.length} 位玩家，依最快通關時間排序。`
                    : '目前還沒有通關紀錄，完成遊戲後就能上榜。';
            } catch (error) {
                console.error('載入排行榜失敗：', error);
                status.textContent = '排行榜載入失敗，請稍後重試。';
            }
        }

        document.getElementById('leaderboard-button').addEventListener('click', async () => {
            if (!await window.raingodRequireAuth('排行榜')) return;
            document.getElementById('leaderboard').style.display = 'flex';
            await refreshLeaderboard();
        });
        document.getElementById('leaderboard-refresh').addEventListener('click', refreshLeaderboard);
        document.getElementById('leaderboard-close').addEventListener('click', () => {
            document.getElementById('leaderboard').style.display = 'none';
        });

        // ========== 模式選擇 ==========
        document.getElementById('solo-mode-btn').addEventListener('click', () => {
            if (gameRunning) return;
            gameMode = 'solo';
            document.getElementById('solo-mode-btn').classList.add('selected');
            document.getElementById('duel-mode-btn').classList.remove('selected');
            document.getElementById('duel-status').textContent = '訓練模式：練習武器與移動，擊殺訓練機器人。';
            document.getElementById('start-btn').textContent = '開始槍戰';
            document.getElementById('target-count').textContent = KILL_TARGET;
        });
        document.getElementById('duel-mode-btn').addEventListener('click', () => {
            if (gameRunning) return;
            gameMode = 'duel';
            document.getElementById('duel-mode-btn').classList.add('selected');
            document.getElementById('solo-mode-btn').classList.remove('selected');
            document.getElementById('duel-status').textContent = '對決模式：需要登入帳號，配對成功後先擊殺對手 5 次獲勝。';
            document.getElementById('start-btn').textContent = '尋找對決對手';
            document.getElementById('target-count').textContent = KILL_TARGET;
        });

        // ========== 開始遊戲 ==========
        document.getElementById('start-btn').onclick = async () => {
            if (gameMode === 'duel') {
                const ok = await joinDuelQueue();
                if (!ok) return;
            }
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';
            document.getElementById('health-bar').style.display = 'block';
            if (!isTouch) requestLock();
            if (isTouch) {
                document.getElementById('joy-base').style.display = 'block';
                document.getElementById('jump-btn').style.display = 'flex';
                document.getElementById('fire-btn').style.display = 'flex';
                document.getElementById('scope-btn').style.display = 'flex';
            }
            
            resetGame();
            if (!renderer) {
                init();
                animate();
            }
            gameRunning = true;
            document.getElementById('weapon-panel').style.display = 'block';
            document.getElementById('opponent-hud').style.display = gameMode === 'duel' ? 'block' : 'none';
            updateWeaponPanel();
            setWeaponModel(currentWeaponIndex);
        };

        function requestLock() {
            document.body.requestPointerLock();
        }

        document.addEventListener('pointerlockchange', () => {
            if (!document.pointerLockElement && gameRunning && !isTouch) {
                hintEl.style.display = 'block';
            } else {
                hintEl.style.display = 'none';
            }
        });

        window.addEventListener('click', (e) => {
            if (gameRunning && !isTouch && !document.pointerLockElement) {
                if (e.target.closest('#overlay') || e.target.closest('#leaderboard') || e.target.closest('#leaderboard-button')) return;
                requestLock();
            }
        });

        // ========== 重置遊戲 ==========
        function resetGame() {
            score = 0;
            elapsedTime = 0;
            duelResultShown = false;
            opponentScore = 0;
            playerHealth = 100;
            isDead = false;
            respawnTimer = 0;
            isReloading = false;
            reloadTimer = 0;
            currentWeaponIndex = 0;
            currentAmmo = WEAPONS[0].ammo;
            lastFireTime = 0;
            scoped = false;
            document.getElementById('score').innerText = score;
            document.getElementById('target-count').innerText = KILL_TARGET;
            document.getElementById('opponent-score').textContent = '0';
            document.getElementById('health-fill').style.width = '100%';
            document.getElementById('health-text').textContent = '100 / 100';
            killFeedEl.replaceChildren();
            
            if (gameMode === 'duel') mapSeed = duelSeed >>> 0;
            else mapSeed = (Date.now() >>> 0) || 1;
            
            if (opponentMesh && scene) { scene.remove(opponentMesh); opponentMesh = null; }
            if (opponentLabel && scene) { scene.remove(opponentLabel); opponentLabel = null; }
            
            if (player) {
                player.position.set(0, 5, 0);
                velocityY = 0;
            }
            
            // 清除子彈
            playerBullets.forEach(b => { if (b.mesh && scene) scene.remove(b.mesh); });
            enemyBullets.forEach(b => { if (b.mesh && scene) scene.remove(b.mesh); });
            playerBullets.length = 0;
            enemyBullets.length = 0;
            
            // 清除訓練敵人
            enemies.forEach(e => {
                if (e.mesh && scene) scene.remove(e.mesh);
                if (e.label && scene) scene.remove(e.label);
                if (e.healthBarBg && scene) scene.remove(e.healthBarBg);
                if (e.healthBarFill && scene) scene.remove(e.healthBarFill);
            });
            enemies.length = 0;
            
            platforms.forEach(p => scene && scene.remove(p.mesh));
            platforms.length = 0;

            if (scene) {
                createMap();
                if (gameMode === 'solo') spawnTrainingEnemies();
            }
            // 重置相機 FOV
            if (camera) {
                camera.fov = DEFAULT_FOV;
                camera.updateProjectionMatrix();
            }
        }

        // ========== 初始化 ==========
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020205);
            scene.fog = new THREE.FogExp2(0x020205, 0.0015);
            
            camera = new THREE.PerspectiveCamera(DEFAULT_FOV, window.innerWidth / (window.innerHeight - 60), 0.1, 2000);
            
            player = new THREE.Mesh(
                new THREE.BoxGeometry(1.0, 1.6, 1.0), 
                new THREE.MeshPhongMaterial({ color: 0x00f3ff, emissive: 0x006688 })
            );
            player.position.set(0, 5, 0);
            scene.add(player);

            // 槍口閃光
            muzzleFlash = new THREE.PointLight(0xffaa00, 0, 15);
            scene.add(muzzleFlash);

            scene.add(new THREE.AmbientLight(0x7777aa));
            const light = new THREE.DirectionalLight(0xffffff, 1.2);
            light.position.set(100, 200, 100);
            scene.add(light);

            createStars();
            createMap();
            buildWeaponModels();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight - 60);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.domElement.style.position = 'absolute';
            renderer.domElement.style.top = '60px';
            renderer.domElement.style.left = '0';
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onResize);
            if (!isTouch) {
                window.addEventListener('keydown', (e) => handleKey(e.code, true));
                window.addEventListener('keyup', (e) => handleKey(e.code, false));
                window.addEventListener('mousemove', handleMouseMove);
                window.addEventListener('mousedown', handleMouseDown);
                window.addEventListener('mouseup', handleMouseUp);
                window.addEventListener('contextmenu', e => e.preventDefault());
            } else {
                initTouchControls();
            }
        }

        // ========== 第一人稱槍械模型 ==========
        function buildWeaponModels() {
            // 清空舊模型
            weaponModels.forEach(m => { if (m && camera) camera.remove(m); });
            weaponModels = [];

            const makeGun = (color, len, bodyH, bodyW, isSniper) => {
                const g = new THREE.Group();
                // 槍身
                const body = new THREE.Mesh(
                    new THREE.BoxGeometry(bodyW, bodyH, len),
                    new THREE.MeshPhongMaterial({ color, emissive: 0x111111 })
                );
                body.position.set(0, 0, -len / 2);
                g.add(body);
                // 槍管
                const barrel = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.05, 0.07, len * 0.7, 8),
                    new THREE.MeshPhongMaterial({ color: 0x222222 })
                );
                barrel.rotation.x = Math.PI / 2;
                barrel.position.set(0, 0.04, -len * 0.95);
                g.add(barrel);
                // 握把
                const grip = new THREE.Mesh(
                    new THREE.BoxGeometry(bodyW * 0.8, 0.35, 0.25),
                    new THREE.MeshPhongMaterial({ color: 0x1a1a1a })
                );
                grip.position.set(0, -0.25, -0.2);
                g.add(grip);
                // 狙擊鏡
                if (isSniper) {
                    const scope = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.09, 0.09, 0.5, 12),
                        new THREE.MeshPhongMaterial({ color: 0x111111, emissive: 0x003344 })
                    );
                    scope.rotation.x = Math.PI / 2;
                    scope.position.set(0, 0.18, -len * 0.55);
                    g.add(scope);
                    // 鏡頭光
                    const lens = new THREE.Mesh(
                        new THREE.CircleGeometry(0.07, 12),
                        new THREE.MeshBasicMaterial({ color: 0x00f3ff })
                    );
                    lens.position.set(0, 0.18, -len * 0.55 - 0.26);
                    lens.rotation.y = Math.PI;
                    g.add(lens);
                }
                return g;
            };

            WEAPONS.forEach((w, i) => {
                const len = w.id === 'sniper' ? 2.2 : w.id === 'shotgun' ? 1.6 : w.id === 'rocket' ? 1.8 : 1.3;
                const g = makeGun(w.color, len, 0.16, 0.18, w.id === 'sniper');
                // 掛在相機右下方
                g.position.set(0.32, -0.28, -0.55);
                g.rotation.y = 0.04;
                g.visible = false;
                camera.add(g);
                weaponModels[i] = g;
            });
            if (scene && camera) scene.add(camera);
        }

        function setWeaponModel(index) {
            weaponModels.forEach((m, i) => {
                if (m) m.visible = (i === index) && !scoped;
            });
            currentWeaponModel = weaponModels[index] || null;
            if (currentWeaponModel && scoped) currentWeaponModel.visible = false;
        }

        // ========== 狙擊槍開鏡 ==========
        function setScope(on) {
            if (!WEAPONS[currentWeaponIndex].scope) return;
            scoped = on;
            camera.fov = on ? 30 : DEFAULT_FOV;
            camera.updateProjectionMatrix();
            // 隱藏/顯示槍身
            if (currentWeaponModel) currentWeaponModel.visible = !on;
            // 準星變化
            const ch = document.getElementById('crosshair');
            if (on) {
                ch.style.border = '2px solid #00f3ff';
                ch.style.borderRadius = '50%';
                ch.style.width = '60px';
                ch.style.height = '60px';
                ch.style.background = 'radial-gradient(circle, transparent 45%, rgba(0,243,255,0.15) 46%)';
                ch.style.boxShadow = '0 0 20px rgba(0,243,255,0.5)';
            } else {
                ch.style.border = 'none';
                ch.style.borderRadius = '0';
                ch.style.width = '40px';
                ch.style.height = '40px';
                ch.style.background = 'none';
                ch.style.boxShadow = 'none';
            }
        }

        function createStars() {
            const starGeo = new THREE.BufferGeometry();
            const count = 3000;
            const pos = new Float32Array(count * 3);
            for(let i=0; i<count*3; i++) {
                pos[i] = (Math.random() - 0.5) * 2500;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const starMat = new THREE.PointsMaterial({ color: 0x8888cc, size: 1.8 });
            scene.add(new THREE.Points(starGeo, starMat));
        }

        function seededRandom() {
            mapSeed = (mapSeed * 1664525 + 1013904223) >>> 0;
            return mapSeed / 4294967296;
        }

        // ========== 創建地圖 ==========
        function createMap() {
            const addP = (x, y, z, w, d, type = 'normal') => {
                let color = 0x1f1f3a;
                if (type === 'bounce') color = 0xec4899;
                if (type === 'center') color = 0xa855f7;

                const mesh = new THREE.Mesh(
                    new THREE.BoxGeometry(w, 1.2, d), 
                    new THREE.MeshPhongMaterial({ color })
                );
                mesh.position.set(x, y, z);
                scene.add(mesh);

                const edge = new THREE.LineSegments(
                    new THREE.EdgesGeometry(mesh.geometry), 
                    new THREE.LineBasicMaterial({ color: type==='center'?0xffffff:(type==='bounce'?0xf472b6:0xa855f7) })
                );
                mesh.add(edge);

                const pData = { mesh, x, y: y + 0.6, z, w, d, type };
                platforms.push(pData);
                return pData;
            };

            addP(0, -1, 0, 30, 30, 'center');

            const range = 200; 
            const step = 16; 

            for (let x = -range; x <= range; x += step) {
                for (let z = -range; z <= range; z += step) {
                    const distFromCenter = Math.sqrt(x*x + z*z);
                    if (distFromCenter < 18) continue;

                    const y = Math.sin(x * 0.04) * 12 + Math.cos(z * 0.04) * 12 + (Math.sin(x * 0.08 + z * 0.08) * 6);
                    
                    const isBounce = Math.random() < 0.15;
                    const size = 9 + Math.random() * 4;
                    
                    addP(x, y, z, size, size, isBounce ? 'bounce' : 'normal');
                }
            }
        }

        // ========== 訓練敵人 ==========
        function spawnTrainingEnemies() {
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2 + Math.random() * 0.5;
                const dist = 30 + Math.random() * 40;
                const x = Math.cos(angle) * dist;
                const z = Math.sin(angle) * dist;
                const y = 3 + Math.random() * 8;
                spawnEnemy(x, y, z);
            }
        }

        function spawnEnemy(x, y, z) {
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 1.8, 1.2),
                new THREE.MeshPhongMaterial({ color: 0xff4444, emissive: 0x441111 })
            );
            mesh.position.set(x, y, z);
            scene.add(mesh);

            // 血條
            const healthBarBg = new THREE.Mesh(
                new THREE.PlaneGeometry(1.5, 0.15),
                new THREE.MeshBasicMaterial({ color: 0x333333, depthTest: false })
            );
            healthBarBg.position.set(x, y + 1.4, z);
            healthBarBg.renderOrder = 999;
            scene.add(healthBarBg);

            const healthBarFill = new THREE.Mesh(
                new THREE.PlaneGeometry(1.5, 0.15),
                new THREE.MeshBasicMaterial({ color: 0xff4444, depthTest: false })
            );
            healthBarFill.position.set(x, y + 1.4, z + 0.01);
            healthBarFill.renderOrder = 1000;
            scene.add(healthBarFill);

            const enemy = {
                mesh, healthBarBg, healthBarFill,
                health: 100, maxHealth: 100,
                x, y, z,
                speed: 3 + Math.random() * 2,
                lastShot: 0,
                shootCooldown: 800 + Math.random() * 600,
                alive: true
            };
            enemies.push(enemy);
        }

        // ========== 射擊系統 ==========
        function shoot() {
            if (!gameRunning || isDead || isReloading) return;
            const weapon = WEAPONS[currentWeaponIndex];
            const now = performance.now();
            if (now - lastFireTime < weapon.fireRate) return;
            if (currentAmmo <= 0) {
                startReload();
                return;
            }

            lastFireTime = now;
            currentAmmo--;
            updateWeaponPanel();

            // 槍口閃光
            if (muzzleFlash) {
                muzzleFlash.position.copy(player.position);
                muzzleFlash.position.y += 1.2;
                muzzleFlash.intensity = 5;
                setTimeout(() => { if (muzzleFlash) muzzleFlash.intensity = 0; }, 50);
            }

            // 計算射擊方向
            const direction = new THREE.Vector3(
                Math.sin(theta) * Math.cos(phi - Math.PI/2),
                Math.cos(phi),
                Math.cos(theta) * Math.cos(phi - Math.PI/2)
            ).normalize();

            const origin = player.position.clone();
            origin.y += 0.8;

            // 散佈
            const spread = weapon.spread;
            const pellets = weapon.pellets || 1;

            for (let i = 0; i < pellets; i++) {
                const dir = direction.clone();
                if (spread > 0) {
                    dir.x += (Math.random() - 0.5) * spread * 2;
                    dir.y += (Math.random() - 0.5) * spread * 2;
                    dir.z += (Math.random() - 0.5) * spread * 2;
                    dir.normalize();
                }

                const bullet = {
                    mesh: createBulletMesh(origin, weapon.color),
                    velocity: dir.multiplyScalar(120), // 降低速度讓曳光可見
                    damage: weapon.damage,
                    life: weapon.range / 120,
                    fromPlayer: true,
                    pierce: weapon.pierce || false,
                    explosive: weapon.explosive || false
                };
                // 讓曳光朝向速度方向
                bullet.mesh.lookAt(bullet.mesh.position.clone().add(bullet.velocity));
                scene.add(bullet.mesh);
                playerBullets.push(bullet);
            }

            if (currentAmmo <= 0) {
                startReload();
            }
        }

        // ========== 曳光彈視覺 ==========
        function createBulletMesh(position, color) {
            const group = new THREE.Group();
            // 核心彈頭
            const core = new THREE.Mesh(
                new THREE.SphereGeometry(0.18, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xffff33 })
            );
            group.add(core);
            // 曳光柱（長條）
            const tracer = new THREE.Mesh(
                new THREE.CylinderGeometry(0.09, 0.02, 6, 6),
                new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.85 })
            );
            tracer.rotation.x = Math.PI / 2;
            tracer.position.z = 3; // 朝向 +Z，配合 lookAt
            group.add(tracer);
            // 光源
            const glow = new THREE.PointLight(0xffaa00, 2, 8);
            group.add(glow);
            group.position.copy(position);
            return group;
        }

        function startReload() {
            if (isReloading) return;
            const weapon = WEAPONS[currentWeaponIndex];
            isReloading = true;
            reloadTimer = weapon.reloadTime;
            setTimeout(() => {
                if (!gameRunning) return;
                currentAmmo = weapon.maxAmmo;
                isReloading = false;
                updateWeaponPanel();
            }, weapon.reloadTime);
        }

        // ========== 武器面板 ==========
        function updateWeaponPanel() {
            const list = document.getElementById('weapon-list');
            list.innerHTML = '';
            WEAPONS.forEach((w, i) => {
                const div = document.createElement('div');
                div.className = 'weapon-slot' + (i === currentWeaponIndex ? ' active' : '');
                div.innerHTML = `<span>${w.name}</span><span class="ammo">${i === currentWeaponIndex ? (isReloading ? '...' : currentAmmo) : w.maxAmmo}</span>`;
                div.addEventListener('click', () => {
                    if (isReloading) return;
                    if (scoped) setScope(false);
                    currentWeaponIndex = i;
                    currentAmmo = WEAPONS[i].maxAmmo;
                    updateWeaponPanel();
                    setWeaponModel(i);
                });
                list.appendChild(div);
            });
        }

        // ========== 輸入處理 ==========
        function handleKey(code, isDown) {
            if (code === 'KeyW') keys.w = isDown;
            if (code === 'KeyS') keys.s = isDown;
            if (code === 'KeyA') keys.a = isDown;
            if (code === 'KeyD') keys.d = isDown;
            if (code === 'KeyR' && isDown) startReload();
            if (code === 'Space' && isDown) handleJump();
            if (code === 'Digit1' && isDown) switchWeapon(0);
            if (code === 'Digit2' && isDown) switchWeapon(1);
            if (code === 'Digit3' && isDown) switchWeapon(2);
            if (code === 'Digit4' && isDown) switchWeapon(3);
            if (code === 'Digit5' && isDown) switchWeapon(4);
            if (code === 'Digit6' && isDown) switchWeapon(5);
            if (code === 'Digit7' && isDown) switchWeapon(6);
            if (code === 'Digit8' && isDown) switchWeapon(7);
        }

        function switchWeapon(index) {
            if (isReloading) return;
            if (scoped) setScope(false);
            currentWeaponIndex = index;
            currentAmmo = WEAPONS[index].maxAmmo;
            updateWeaponPanel();
            setWeaponModel(index);
        }

        function handleMouseMove(e) {
            if (document.pointerLockElement === document.body && gameRunning) {
                const sens = scoped ? 0.0012 : 0.002;
                theta -= e.movementX * sens;
                phi = Math.max(0.2, Math.min(Math.PI - 0.4, phi - e.movementY * sens));
            }
        }

        let isMouseDown = false;
        function handleMouseDown(e) {
            if (e.button === 0) {
                isMouseDown = true;
                shoot();
            }
            if (e.button === 2) {
                // 右鍵開鏡
                if (gameRunning && WEAPONS[currentWeaponIndex].scope) {
                    setScope(!scoped);
                }
            }
        }
        function handleMouseUp(e) {
            if (e.button === 0) isMouseDown = false;
        }

        let joyTouchId = null, camTouchId = null, fireTouchId = null;
        let lastCamX = 0, lastCamY = 0;

        function initTouchControls() {
            const stick = document.getElementById('joy-stick');
            const base = document.getElementById('joy-base');

            document.addEventListener('touchstart', (e) => {
                if (!gameRunning) return;
                for (let t of e.changedTouches) {
                    const rect = base.getBoundingClientRect();
                    const dx = t.clientX - (rect.left + 60);
                    const dy = t.clientY - (rect.top + 60);

                    if (Math.sqrt(dx*dx + dy*dy) < 90 && joyTouchId === null) {
                        joyTouchId = t.identifier;
                    } else if (t.clientX > window.innerWidth * 0.35 && camTouchId === null) {
                        camTouchId = t.identifier;
                        lastCamX = t.clientX;
                        lastCamY = t.clientY;
                    }
                }
            });

            document.addEventListener('touchmove', (e) => {
                if (!gameRunning) return;
                e.preventDefault();
                for (let t of e.changedTouches) {
                    if (t.identifier === joyTouchId) {
                        const rect = base.getBoundingClientRect();
                        let dx = t.clientX - (rect.left + 60);
                        let dy = t.clientY - (rect.top + 60);
                        const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 45);
                        const angle = Math.atan2(dy, dx);
                        stick.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
                        moveInput.x = (Math.cos(angle)*dist)/45;
                        moveInput.y = -(Math.sin(angle)*dist)/45;
                    } else if (t.identifier === camTouchId) {
                        const deltaX = t.clientX - lastCamX;
                        const deltaY = t.clientY - lastCamY;
                        const sens = scoped ? 0.003 : 0.005;
                        theta -= deltaX * sens;
                        phi = Math.max(0.2, Math.min(Math.PI - 0.4, phi - deltaY * sens));
                        lastCamX = t.clientX;
                        lastCamY = t.clientY;
                    }
                }
            }, { passive: false });

            const endTouch = (e) => {
                for (let t of e.changedTouches) {
                    if (t.identifier === joyTouchId) {
                        joyTouchId = null;
                        stick.style.transform = `translate(0px, 0px)`;
                        moveInput = { x: 0, y: 0 };
                    }
                    if (t.identifier === camTouchId) camTouchId = null;
                }
            };

            document.addEventListener('touchend', endTouch);
            document.addEventListener('touchcancel', endTouch);

            document.getElementById('jump-btn').addEventListener('touchstart', (e) => {
                e.preventDefault(); handleJump();
            });

            const fireBtn = document.getElementById('fire-btn');
            fireBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (gameMode === 'solo' || gameMode === 'duel') {
                    shoot();
                    if (WEAPONS[currentWeaponIndex].auto) {
                        fireBtn._autoInterval = setInterval(shoot, WEAPONS[currentWeaponIndex].fireRate);
                    }
                }
            });
            fireBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (fireBtn._autoInterval) {
                    clearInterval(fireBtn._autoInterval);
                    fireBtn._autoInterval = null;
                }
            });

            // 開鏡按鈕
            document.getElementById('scope-btn').addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (gameRunning && WEAPONS[currentWeaponIndex].scope) {
                    setScope(!scoped);
                }
            });
        }

        function handleJump() {
            if (!gameRunning || isDead) return;
            if (jumpCount < 2) { 
                velocityY = JUMP_POWER; 
                jumpCount++; 
            }
        }

        function onResize() {
            camera.aspect = window.innerWidth / (window.innerHeight - 60);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight - 60);
        }

        // ========== 遊戲結束 ==========
        function gameOver(isWin, msg) {
            gameRunning = false;
            isDead = true;
            if (document.pointerLockElement) document.exitPointerLock();
            if (gameMode === 'solo') saveCompletedRun(isWin);

            const title = document.getElementById('game-title');
            const desc = document.getElementById('game-desc');
            const overlay = document.getElementById('overlay');

            title.innerText = isWin ? "🏆 勝利！" : "💀 你被擊敗了";
            desc.innerHTML = `${msg}<br>最終擊殺：<b>${score}</b> · 費時：<b>${elapsedTime.toFixed(2)} 秒</b>`;
            document.getElementById('start-btn').innerText = "再戰一場";
            overlay.style.display = 'flex';
            document.getElementById('crosshair').style.display = 'none';
            document.getElementById('health-bar').style.display = 'none';
            document.getElementById('weapon-panel').style.display = 'none';
            document.getElementById('opponent-hud').style.display = 'none';
            if (scoped) setScope(false);
        }

        // ========== 單挑模式 ==========
        function getCurrentAccount() {
            const user = window.raingodCurrentUser || (window.firebase && firebase.auth && firebase.auth().currentUser);
            if (!user) return null;
            return {
                uid: user.uid,
                name: (user.displayName || (user.email ? user.email.split('@')[0] : '') || '玩家').slice(0, 24)
            };
        }

        async function dbRequest(path, method = 'GET', body) {
            const response = await fetch(`${DUEL_ROOT}/${path}.json`, {
                method,
                headers: { 'Content-Type': 'application/json' },
                ...(body === undefined ? {} : { body: JSON.stringify(body) })
            });
            if (!response.ok) throw new Error(`Firebase HTTP ${response.status}`);
            return response.json();
        }

        async function joinDuelQueue() {
            const account = getCurrentAccount();
            if (!account) {
                document.getElementById('duel-status').textContent = '請先登入網站帳號，再開始對決配對。';
                return false;
            }
            duelUid = account.uid;
            duelName = account.name;
            const btn = document.getElementById('start-btn');
            btn.disabled = true;
            btn.textContent = '正在尋找對手…';
            document.getElementById('duel-status').textContent = '正在配對，請稍候；不要關閉頁面。';
            try {
                const queue = await dbRequest('queue');
                const now = Date.now();
                let waiting = Object.entries(queue || {}).find(([id, row]) =>
                    id !== duelQueueId && row && row.status === 'waiting' &&
                    row.uid !== duelUid && now - Number(row.createdAt || 0) < 90000
                );

                if (waiting) {
                    const [queueId, row] = waiting;
                    const roomId = `duel_${queueId}_${Math.random().toString(36).slice(2, 9)}`;
                    const room = {
                        status: 'playing', seed: ((now ^ Math.floor(Math.random() * 0xffffffff)) >>> 0) || 1,
                        createdAt: now, players: {
                            [row.uid]: { uid: row.uid, name: row.name || '玩家', score: 0, x: 0, y: 5, z: 0, done: false },
                            [duelUid]: { uid: duelUid, name: duelName, score: 0, x: 0, y: 5, z: 0, done: false }
                        }, winner: null
                    };
                    await dbRequest(`rooms/${roomId}`, 'PUT', room);
                    await dbRequest(`queue/${queueId}`, 'PATCH', { status: 'matched', roomId, matchedAt: now });
                    const myQueue = await dbRequest('queue', 'POST', { uid: duelUid, name: duelName, status: 'matched', roomId, createdAt: now });
                    duelQueueId = myQueue && myQueue.name;
                    await activateDuel(roomId, room);
                    return true;
                }

                const created = await dbRequest('queue', 'POST', {
                    uid: duelUid, name: duelName, status: 'waiting', createdAt: now
                });
                duelQueueId = created && created.name;
                const started = Date.now();
                while (Date.now() - started < 60000) {
                    await new Promise(resolve => setTimeout(resolve, 1200));
                    const mine = duelQueueId ? await dbRequest(`queue/${duelQueueId}`) : null;
                    if (mine && mine.status === 'matched' && mine.roomId) {
                        const room = await dbRequest(`rooms/${mine.roomId}`);
                        if (room && room.status === 'playing') {
                            await activateDuel(mine.roomId, room);
                            return true;
                        }
                    }
                    const latest = await dbRequest('queue');
                    const candidate = Object.entries(latest || {}).find(([id, row]) =>
                        id !== duelQueueId && row && row.status === 'waiting' &&
                        row.uid !== duelUid && Date.now() - Number(row.createdAt || 0) < 90000
                    );
                    if (candidate) {
                        const [otherId, row] = candidate;
                        const roomId = `duel_${otherId}_${Math.random().toString(36).slice(2, 9)}`;
                        const room = {
                            status: 'playing', seed: ((Date.now() ^ Math.floor(Math.random() * 0xffffffff)) >>> 0) || 1,
                            createdAt: Date.now(), players: {
                                [row.uid]: { uid: row.uid, name: row.name || '玩家', score: 0, x: 0, y: 5, z: 0, done: false },
                                [duelUid]: { uid: duelUid, name: duelName, score: 0, x: 0, y: 5, z: 0, done: false }
                            }, winner: null
                        };
                        await dbRequest(`rooms/${roomId}`, 'PUT', room);
                        await dbRequest(`queue/${otherId}`, 'PATCH', { status: 'matched', roomId, matchedAt: Date.now() });
                        await dbRequest(`queue/${duelQueueId}`, 'PATCH', { status: 'matched', roomId, matchedAt: Date.now() });
                        await activateDuel(roomId, room);
                        return true;
                    }
                    document.getElementById('duel-status').textContent = '等待另一位玩家加入…';
                }
                if (duelQueueId) await dbRequest(`queue/${duelQueueId}`, 'PATCH', { status: 'expired' }).catch(() => {});
                document.getElementById('duel-status').textContent = '60 秒內沒有配對成功，請再試一次。';
            } catch (error) {
                console.error('對決配對失敗：', error);
                document.getElementById('duel-status').textContent = '配對失敗：請確認 Firebase Realtime Database 規則允許讀寫 space_runner_duel。';
            }
            btn.disabled = false;
            btn.textContent = '重新尋找對手';
            return false;
        }

        async function activateDuel(roomId, room) {
            duelRoomId = roomId;
            duelSeed = Number(room.seed) || 1;
            opponentUid = Object.keys(room.players || {}).find(uid => uid !== duelUid) || null;
            const opponent = opponentUid ? room.players[opponentUid] : null;
            document.getElementById('duel-status').textContent = `配對成功！對手：${opponent?.name || '玩家'}。先擊殺對手 5 次獲勝！`;
            document.getElementById('opponent-hud').style.display = 'block';
            document.getElementById('opponent-hud').innerHTML = `⚔️ 對手：<span id="opponent-name">${escapeHtml(opponent?.name || '玩家')}</span><br>對手擊殺：<span id="opponent-score">0</span> / 5`;
            await publishDuelState();
            if (duelPollTimer) clearInterval(duelPollTimer);
            duelPollTimer = setInterval(pollDuelState, 900);
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        async function publishDuelState() {
            if (!duelRoomId || !duelUid || !player) return;
            try {
                await dbRequest(`rooms/${duelRoomId}/players/${duelUid}`, 'PATCH', {
                    uid: duelUid, name: duelName, score, x: player.position.x, y: player.position.y,
                    z: player.position.z, done: score >= KILL_TARGET, updatedAt: Date.now()
                });
                if (score >= KILL_TARGET) {
                    const room = await dbRequest(`rooms/${duelRoomId}`);
                    if (room && !room.winner) await dbRequest(`rooms/${duelRoomId}`, 'PATCH', { winner: duelUid, status: 'finished' });
                }
            } catch (e) { console.warn('同步對決狀態失敗', e); }
        }

        async function pollDuelState() {
            if (!duelRoomId || !gameRunning) return;
            try {
                const room = await dbRequest(`rooms/${duelRoomId}`);
                if (!room) return;
                const other = room.players && room.players[opponentUid];
                if (other) {
                    opponentScore = Number(other.score) || 0;
                    const scoreEl = document.getElementById('opponent-score');
                    if (scoreEl) scoreEl.textContent = opponentScore;
                    if (!opponentMesh && scene) {
                        opponentMesh = new THREE.Mesh(
                            new THREE.BoxGeometry(1.0, 1.6, 1.0),
                            new THREE.MeshPhongMaterial({ color: 0xffd166, emissive: 0x664400 })
                        );
                        scene.add(opponentMesh);
                        const canvas = document.createElement('canvas');
                        canvas.width = 512; canvas.height = 128;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, 512, 128);
                        ctx.font = 'bold 38px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#ffffff';
                        ctx.fillText(String(other.name || '玩家').slice(0, 24), 256, 80);
                        const texture = new THREE.CanvasTexture(canvas);
                        opponentLabel = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
                        opponentLabel.scale.set(7, 1.75, 1);
                        scene.add(opponentLabel);
                    }
                    if (opponentMesh) {
                        opponentMesh.position.set(Number(other.x) || 0, Number(other.y) || 5, Number(other.z) || 0);
                        if (opponentLabel) opponentLabel.position.set(opponentMesh.position.x, opponentMesh.position.y + 1.8, opponentMesh.position.z);
                    }
                }
                if (room.winner && !duelResultShown) {
                    duelResultShown = true;
                    finishDuel(room.winner === duelUid, room.winner === duelUid ? '你先擊殺對手 5 次！' : '對手先擊殺你 5 次。');
                }
            } catch (e) { console.warn('讀取對決狀態失敗', e); }
        }

        let duelResultShown = false;
        async function finishDuel(won, message) {
            if (duelResultShown && gameRunning === false) return;
            duelResultShown = true;
            if (duelPollTimer) { clearInterval(duelPollTimer); duelPollTimer = null; }
            gameRunning = false;
            if (document.pointerLockElement) document.exitPointerLock();
            await publishDuelState().catch(() => {});
            const title = document.getElementById('game-title');
            title.textContent = won ? '🏆 對決勝利！' : '💀 對決失敗';
            document.getElementById('game-desc').innerHTML = `${escapeHtml(message)}<br>你的擊殺：${score} / 5 · 對手：${opponentScore} / 5`;
            document.getElementById('start-btn').textContent = '再玩一次';
            document.getElementById('overlay').style.display = 'flex';
            document.getElementById('start-btn').disabled = false;
            document.getElementById('crosshair').style.display = 'none';
            document.getElementById('health-bar').style.display = 'none';
            document.getElementById('weapon-panel').style.display = 'none';
            document.getElementById('opponent-hud').style.display = 'none';
            if (scoped) setScope(false);
        }

        // ========== 擊中反饋 ==========
        function showHitMarker() {
            hitMarkerEl.style.display = 'block';
            setTimeout(() => { hitMarkerEl.style.display = 'none'; }, 150);
        }

        function addKillFeed(text) {
            const div = document.createElement('div');
            div.textContent = text;
            killFeedEl.prepend(div);
            setTimeout(() => { if (div.parentNode) div.remove(); }, 3000);
        }

        // ========== 子彈更新與碰撞 ==========
        function updateBullets(delta) {
            // 玩家子彈
            for (let i = playerBullets.length - 1; i >= 0; i--) {
                const b = playerBullets[i];
                b.mesh.position.addScaledVector(b.velocity, delta);
                b.life -= delta;

                let hit = false;

                // 訓練敵人
                if (gameMode === 'solo') {
                    for (const enemy of enemies) {
                        if (!enemy.alive) continue;
                        const dist = b.mesh.position.distanceTo(enemy.mesh.position);
                        if (dist < 1.5) {
                            enemy.health -= b.damage;
                            showHitMarker();
                            hit = true;
                            if (enemy.health <= 0) {
                                enemy.alive = false;
                                scene.remove(enemy.mesh);
                                scene.remove(enemy.healthBarBg);
                                scene.remove(enemy.healthBarFill);
                                score++;
                                document.getElementById('score').innerText = score;
                                addKillFeed(`💀 擊殺訓練機器人 (${score}/${KILL_TARGET})`);
                                if (score >= KILL_TARGET) {
                                    gameOver(true, '你消滅了所有訓練機器人！');
                                }
                            }
                            break;
                        }
                    }
                }

                // 對決模式 - 擊中對手
                if (gameMode === 'duel' && opponentMesh && !hit) {
                    const dist = b.mesh.position.distanceTo(opponentMesh.position);
                    if (dist < 1.5) {
                        hit = true;
                        showHitMarker();
                        score++;
                        document.getElementById('score').innerText = score;
                        addKillFeed(`💀 擊中對手！`);
                        publishDuelState();
                        if (score >= KILL_TARGET) {
                            publishDuelState().finally(() => finishDuel(true, '你先擊殺對手 5 次！'));
                        }
                    }
                }

                if (hit || b.life <= 0) {
                    scene.remove(b.mesh);
                    playerBullets.splice(i, 1);
                }
            }

            // 敵方子彈（訓練模式）
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const b = enemyBullets[i];
                b.mesh.position.addScaledVector(b.velocity, delta);
                b.life -= delta;

                const dist = b.mesh.position.distanceTo(player.position);
                if (dist < 1.2 && !isDead) {
                    playerHealth -= b.damage;
                    document.getElementById('health-fill').style.width = Math.max(0, playerHealth) + '%';
                    document.getElementById('health-text').textContent = Math.max(0, Math.floor(playerHealth)) + ' / 100';
                    if (playerHealth <= 0) {
                        isDead = true;
                        respawnTimer = 3000;
                        addKillFeed('💀 你被擊倒了！');
                    }
                    scene.remove(b.mesh);
                    enemyBullets.splice(i, 1);
                } else if (b.life <= 0) {
                    scene.remove(b.mesh);
                    enemyBullets.splice(i, 1);
                }
            }
        }

        // ========== 敵人AI ==========
        function updateEnemies(delta) {
            if (gameMode !== 'solo') return;

            const now = performance.now();
            for (const enemy of enemies) {
                if (!enemy.alive) continue;

                // 朝向玩家移動
                const dir = new THREE.Vector3().subVectors(player.position, enemy.mesh.position);
                dir.y = 0;
                const dist = dir.length();
                if (dist > 5) {
                    dir.normalize();
                    enemy.mesh.position.x += dir.x * enemy.speed * delta;
                    enemy.mesh.position.z += dir.z * enemy.speed * delta;
                }

                // 更新血條位置
                enemy.healthBarBg.position.copy(enemy.mesh.position);
                enemy.healthBarBg.position.y += 1.4;
                enemy.healthBarFill.position.copy(enemy.mesh.position);
                enemy.healthBarFill.position.y += 1.4;
                enemy.healthBarFill.position.z += 0.01;
                enemy.healthBarFill.scale.x = Math.max(0.01, enemy.health / enemy.maxHealth);
                enemy.healthBarFill.position.x = enemy.mesh.position.x - 0.75 * (1 - enemy.health / enemy.maxHealth);

                // 血條面向相機
                enemy.healthBarBg.lookAt(camera.position);
                enemy.healthBarFill.lookAt(camera.position);

                // 射擊
                if (now - enemy.lastShot > enemy.shootCooldown && dist < 50) {
                    enemy.lastShot = now;
                    enemy.shootCooldown = 800 + Math.random() * 800;

                    const shootDir = new THREE.Vector3().subVectors(player.position, enemy.mesh.position).normalize();
                    const bullet = {
                        mesh: createBulletMesh(enemy.mesh.position.clone().add(new THREE.Vector3(0, 1, 0)), 0xff4444),
                        velocity: shootDir.multiplyScalar(120),
                        damage: 8,
                        life: 1.5
                    };
                    bullet.mesh.lookAt(bullet.mesh.position.clone().add(bullet.velocity));
                    scene.add(bullet.mesh);
                    enemyBullets.push(bullet);
                }
            }
        }

        // ========== 重生 ==========
        function handleRespawn(delta) {
            if (!isDead) return;
            respawnTimer -= delta * 1000;
            if (respawnTimer <= 0) {
                isDead = false;
                playerHealth = 100;
                player.position.set(0, 5, 0);
                velocityY = 0;
                document.getElementById('health-fill').style.width = '100%';
                document.getElementById('health-text').textContent = '100 / 100';
                addKillFeed('🔄 重生');
            }
        }

        // ========== 雷達 ==========
        function updateRadar() {
            radarCtx.clearRect(0, 0, 120, 120);
            
            radarCtx.fillStyle = '#ffffff';
            radarCtx.beginPath();
            radarCtx.arc(60, 60, 3, 0, Math.PI * 2);
            radarCtx.fill();

            let nearestDist = Infinity;

            // 訓練模式顯示敵人
            if (gameMode === 'solo') {
                enemies.forEach(e => {
                    if (!e.alive) return;
                    const dx = e.mesh.position.x - player.position.x;
                    const dz = e.mesh.position.z - player.position.z;
                    const dist = Math.sqrt(dx*dx + dz*dz);
                    if (dist < nearestDist) nearestDist = dist;
                    const angle = Math.atan2(dz, dx) - theta + Math.PI/2;
                    const radarDist = Math.min(dist * 0.22, 54);
                    const rx = 60 + Math.cos(angle) * radarDist;
                    const ry = 60 + Math.sin(angle) * radarDist;
                    radarCtx.fillStyle = '#ff4444';
                    radarCtx.beginPath();
                    radarCtx.arc(rx, ry, 3, 0, Math.PI * 2);
                    radarCtx.fill();
                });
            }

            // 對決模式顯示對手
            if (gameMode === 'duel' && opponentMesh) {
                const dx = opponentMesh.position.x - player.position.x;
                const dz = opponentMesh.position.z - player.position.z;
                const dist = Math.sqrt(dx*dx + dz*dz);
                if (dist < nearestDist) nearestDist = dist;
                const angle = Math.atan2(dz, dx) - theta + Math.PI/2;
                const radarDist = Math.min(dist * 0.22, 54);
                const rx = 60 + Math.cos(angle) * radarDist;
                const ry = 60 + Math.sin(angle) * radarDist;
                radarCtx.fillStyle = '#ffd166';
                radarCtx.beginPath();
                radarCtx.arc(rx, ry, 4, 0, Math.PI * 2);
                radarCtx.fill();
            }

            const trackerEl = document.getElementById('tracker-info');
            if (nearestDist !== Infinity) {
                trackerEl.innerText = `📍 最近敵人距離: ${Math.round(nearestDist)} 米`;
            } else {
                trackerEl.innerText = `🎯 搜尋敵人中...`;
            }
        }

        // ========== 主循環 ==========
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            if (gameRunning) {
                elapsedTime += delta;
                document.getElementById('timer').innerText = `⏱️ 時間: ${elapsedTime.toFixed(2)}s`;

                handleRespawn(delta);

                if (!isDead) {
                    // 重力
                    velocityY = Math.max(velocityY - GRAVITY * delta, -MAX_FALL_SPEED);
                    const previousY = player.position.y;
                    player.position.y += velocityY * delta;

                    // 移動
                    const fwd = new THREE.Vector3(Math.sin(theta), 0, Math.cos(theta)).negate();
                    const rit = new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0), fwd).negate();
                    
                    let mx = moveInput.x, my = moveInput.y;
                    if (keys.w) my = 1; if (keys.s) my = -1;
                    if (keys.a) mx = -1; if (keys.d) mx = 1;

                    player.position.addScaledVector(fwd, my * MOVE_SPEED * delta);
                    player.position.addScaledVector(rit, mx * MOVE_SPEED * delta);

                    // 平台碰撞
                    for (let p of platforms) {
                        if (Math.abs(player.position.x - p.x) < p.w / 2 + 0.6 && 
                            Math.abs(player.position.z - p.z) < p.d / 2 + 0.6) {
                            
                            if (velocityY <= 0 && previousY - 0.7 >= p.y - 0.15 &&
                                player.position.y - 0.7 <= p.y && player.position.y - 0.7 > p.y - 3.5) {
                                player.position.y = p.y + 0.7;
                                
                                if (p.type === 'bounce') {
                                    velocityY = 25;
                                    jumpCount = 0;
                                } else {
                                    velocityY = 0;
                                    jumpCount = 0;
                                }
                            }
                        }
                    }

                    // 自動射擊（按住鼠標）
                    if (isMouseDown && WEAPONS[currentWeaponIndex].auto) {
                        shoot();
                    }

                    // 掉落重置
                    if (player.position.y < -100) {
                        player.position.set(0, 5, 0);
                        velocityY = 0;
                    }
                }

                // 更新子彈與敵人
                updateBullets(delta);
                updateEnemies(delta);
                updateRadar();

                // 對決狀態同步
                if (gameMode === 'duel' && performance.now() - lastDuelPublish > 350) {
                    lastDuelPublish = performance.now();
                    publishDuelState();
                }
            }

            // 相機跟隨
            if (player) {
                camera.position.set(
                    player.position.x + 10 * Math.sin(phi) * Math.sin(theta), 
                    player.position.y + 8 * Math.cos(phi), 
                    player.position.z + 10 * Math.sin(phi) * Math.cos(theta)
                );
                camera.lookAt(player.position.x, player.position.y + 1, player.position.z);
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        // 初始化 UI
        renderProfile();
        updateWeaponPanel();
    </script>
</body>
