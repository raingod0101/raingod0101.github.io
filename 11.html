<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>看廣告拿永久獎勵</title>

    <!-- 1. Google AdSense 基礎載入腳本 -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7889068650968296"
         crossorigin="anonymous"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }

        .reward-btn {
            background-color: #008cba;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
            font-weight: bold;
        }

        .reward-btn:hover {
            background-color: #005f7f;
        }

        /* 已經獲得獎勵時的按鈕樣式 */
        .reward-btn:disabled {
            background-color: #4caf50;
            cursor: not-allowed;
            opacity: 0.8;
        }

        .status {
            margin-top: 20px;
            font-size: 16px;
            color: #aaa;
        }

        .ad-container {
            margin-top: 25px;
            padding: 10px;
            background: #333;
            border-radius: 8px;
            min-height: 100px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🏆 永久稱號解鎖</h1>
        <p>點擊下方按鈕並完成觀看廣告，即可永久獲得「👑 高級 VIP」稱號！</p>

        <!-- 觀看廣告按鈕 -->
        <button id="adBtn" class="reward-btn" onclick="startWatchAd()">🎥 觀看廣告領取獎勵</button>

        <!-- 顯示當前狀態 -->
        <div id="statusText" class="status">目前狀態：尚未獲得獎勵</div>

        <!-- 2. 廣告顯示區塊 -->
        <div class="ad-container">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-7889068650968296"
                 data-ad-slot="1234567890"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </div>

    <script>
        // 當網頁載入完成時，檢查之前是否已經拿過永久獎勵
        window.onload = function() {
            checkStatus();
        };

        // 檢查永久獎勵紀錄 (使用 localStorage)
        function checkStatus() {
            const isUnlocked = localStorage.getItem('isVIPUnlocked');

            if (isUnlocked === 'true') {
                const btn = document.getElementById('adBtn');
                const status = document.getElementById('statusText');

                btn.disabled = true;
                btn.innerText = '✅ 已永久獲得 👑 高級 VIP';
                status.innerText = '目前狀態：已擁有永久 VIP 權限！';
                status.style.color = '#4caf50';
            }
        }

        // 點擊看廣告觸發事件
        function startWatchAd() {
            alert("請點擊下方廣告區塊，完成互動後返回網頁即可獲得永久獎勵！");

            let userLeftPage = false;

            // 監聽使用者是否離開網頁（點擊了廣告）
            window.onblur = function() {
                userLeftPage = true;
            };

            // 當使用者看完廣告回到網頁時發放獎勵
            window.onfocus = function() {
                if (userLeftPage) {
                    grantReward();
                    window.onblur = null;
                    window.onfocus = null;
                }
            };
        }

        // 發放永久獎勵
        function grantReward() {
            // 寫入 localStorage 達到永久保存（重開瀏覽器依然有效）
            localStorage.setItem('isVIPUnlocked', 'true');
            
            alert("🎉 恭喜你！成功解鎖永久 VIP 獎勵！");
            
            // 更新畫面狀態
            checkStatus();
        }
    </script>

</body>
</html>
