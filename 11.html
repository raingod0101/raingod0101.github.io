<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>個人檔案 × 好友 × 聊天室 | 雨神</title>
    <link rel="stylesheet" href="menu.css">
    <style>
        :root {
            --me-bg: #007aff;
            --other-bg: #f2f2f7;
            --danger: #ff3b30;
            --text-gray: #8e8e93;
            --success: #34c759;
            --border: #e2e6ed;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #f3f5f8;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow-x: hidden;
        }
        #nav_bar { position: relative; z-index: 10; }

        /* ===== 頁籤導覽 ===== */
        .tab-bar {
            display: flex;
            gap: 4px;
            max-width: 860px;
            margin: 20px auto 0;
            padding: 5px;
            background: #e8ecf2;
            border-radius: 12px;
            width: calc(100% - 32px);
        }
        .tab-btn {
            flex: 1;
            padding: 11px 8px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: #5b6470;
            font: inherit;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            position: relative;
        }
        .tab-btn.active {
            background: #fff;
            color: #1d1d1f;
            box-shadow: 0 1px 4px rgba(25, 40, 60, 0.12);
        }
        .tab-btn .tab-badge {
            display: none;
            min-width: 17px;
            height: 17px;
            padding: 0 4px;
            margin-left: 4px;
            border-radius: 9px;
            background: var(--danger);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            line-height: 17px;
            text-align: center;
            vertical-align: middle;
        }
        .tab-btn .tab-badge.show { display: inline-block; }

        /* ===== 頁面容器 ===== */
        .page-wrap {
            max-width: 860px;
            margin: 18px auto 40px;
            padding: 0 16px;
        }
        .page { display: none; }
        .page.active { display: block; }

        /* ===== 共用卡片 ===== */
        .card {
            margin-bottom: 18px;
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 8px 24px rgba(25, 40, 60, 0.06);
        }
        .card h2 { margin: 0 0 8px; font-size: 1.1rem; }
        .card h3 { margin: 18px 0 8px; font-size: 0.95rem; }
        .profile-help, .profile-status {
            color: #606a78; font-size: 0.88rem; line-height: 1.5;
        }
        .profile-status { min-height: 1.4em; margin: 10px 0 0; }
        .profile-status.error { color: #b42318; }
        .profile-status.ok { color: var(--success); }

        .page-heading {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; margin-bottom: 18px;
        }
        .page-heading h1 { margin: 0; font-size: 1.55rem; }

        /* ===== 頭像 ===== */
        .profile-avatar-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .avatar-wrap { position: relative; width: 104px; height: 104px; flex: 0 0 auto; }
        .profile-avatar {
            width: 104px; height: 104px; border: 2px solid var(--border);
            border-radius: 50%; object-fit: cover; background: #fff;
        }
        .avatar-edit-btn {
            position: absolute; right: -2px; bottom: -2px;
            width: 34px; height: 34px; border-radius: 50%;
            border: 2px solid #fff; background: var(--me-bg); color: #fff;
            font-size: 16px; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
        }
        .avatar-unread-badge {
            position: absolute; top: -2px; right: -2px;
            min-width: 20px; height: 20px; padding: 0 5px;
            border-radius: 10px; background: var(--danger); color: #fff;
            font-size: 11px; font-weight: 700; line-height: 20px;
            text-align: center; border: 2px solid #fff;
            display: none;
        }

        /* ===== 表單 ===== */
        .profile-form { display: grid; gap: 14px; margin-top: 16px; }
        .profile-form label { display: grid; gap: 7px; font-size: 0.9rem; font-weight: 600; }
        .profile-form input {
            width: 100%; padding: 11px 12px; border: 1px solid #cbd2dc;
            border-radius: 8px; font: inherit;
        }
        .profile-form input:focus {
            border-color: #4285f4; outline: 2px solid rgba(66, 133, 244, 0.18);
        }
        .profile-button {
            width: fit-content; padding: 10px 16px; border: 0;
            border-radius: 8px; background: #2878e3; color: #fff;
            font: inherit; font-weight: 600; cursor: pointer;
        }
        .profile-button:disabled { cursor: wait; opacity: 0.65; }
        .profile-button.secondary { background: #687385; }
        .profile-button.danger { background: var(--danger); }

        /* ===== 好友 ===== */
        .search-row { display: flex; gap: 8px; }
        .search-row input {
            flex: 1; padding: 10px 12px; border: 1px solid #cbd2dc;
            border-radius: 8px; font: inherit;
        }
        .friend-list, .request-list, .search-results {
            list-style: none; margin: 0; padding: 0;
            display: flex; flex-direction: column; gap: 8px;
        }
        .friend-item, .request-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px; border-radius: 12px; background: #f7f9fc;
            border: 1px solid transparent;
        }
        .friend-item.active { border-color: var(--me-bg); background: #eaf2ff; }
        .friend-avatar {
            width: 42px; height: 42px; border-radius: 50%;
            object-fit: cover; background: #fff; flex: 0 0 auto;
            border: 1px solid var(--border);
        }
        .friend-name {
            flex: 1; font-weight: 600; font-size: 0.95rem;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .friend-unread {
            min-width: 18px; height: 18px; padding: 0 5px;
            border-radius: 9px; background: var(--danger); color: #fff;
            font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
            display: none;
        }
        .friend-unread.show { display: inline-block; }
        .friend-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .mini-btn {
            padding: 6px 11px; border-radius: 7px; border: 1px solid #ccc;
            background: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
        }
        .mini-btn.primary { background: var(--me-bg); color: #fff; border-color: var(--me-bg); }
        .mini-btn.success { background: var(--success); color: #fff; border-color: var(--success); }
        .mini-btn.danger { background: #fff0f0; color: var(--danger); border-color: #ffc9c9; }

        /* ===== 聊天室 ===== */
        .chat-panel {
            display: flex; flex-direction: column;
            background: #fff; border-radius: 16px; overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 8px 24px rgba(25, 40, 60, 0.06);
            height: calc(100vh - 190px);
            min-height: 460px;
        }
        .chat-layout { display: flex; height: 100%; }
        .chat-sidebar {
            width: 210px; flex-shrink: 0; border-right: 1px solid #eee;
            overflow-y: auto; background: #fafbfd;
        }
        .chat-sidebar-title {
            padding: 12px 14px 6px; font-size: 12px; font-weight: 700;
            color: var(--text-gray); letter-spacing: 0.4px;
        }
        .chat-sidebar .friend-item { border-radius: 0; border: 0; background: transparent; }
        .chat-sidebar .friend-item.active { background: #eaf2ff; }
        .chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .chat-header {
            padding: 13px 16px; border-bottom: 1px solid #eee;
            display: flex; justify-content: space-between; align-items: center;
            background: #fff; flex-shrink: 0;
        }
        .chat-header .title { font-weight: 700; }
        .chat-header .sub { font-size: 12px; color: var(--text-gray); }
        .chat-header-actions { display: flex; gap: 8px; }
        .chat-box {
            flex: 1; overflow-y: auto; padding: 15px;
            display: flex; flex-direction: column; gap: 12px;
            background: #fbfcfe;
        }
        .chat-empty {
            margin: auto; text-align: center; color: var(--text-gray);
            font-size: 0.92rem; padding: 30px;
        }
        .msg-row { display: flex; flex-direction: column; width: 100%; }
        .msg-row.me { align-items: flex-end; }
        .msg-row.other { align-items: flex-start; }
        .msg-info { font-size: 11px; color: var(--text-gray); margin-bottom: 3px; padding: 0 5px; }
        .bubble {
            padding: 10px 13px; border-radius: 16px; font-size: 14px;
            word-break: break-word; max-width: 85%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
            white-space: pre-wrap;
        }
        .me .bubble { background: var(--me-bg); color: #fff; border-bottom-right-radius: 4px; }
        .other .bubble { background: var(--other-bg); color: #111; border-bottom-left-radius: 4px; }
        .chat-input-area {
            padding: 10px 12px; border-top: 1px solid #eee;
            display: flex; gap: 8px; align-items: center; background: #fff;
        }
        .chat-input-area input[type="text"] {
            flex: 1; padding: 11px 14px; border: none; background: #f2f2f7;
            border-radius: 22px; outline: none; font-size: 15px;
        }
        .chat-send-btn {
            border: none; background: var(--me-bg); color: #fff;
            font-weight: 700; padding: 10px 16px; border-radius: 20px;
            cursor: pointer; font-size: 14px; flex-shrink: 0;
        }
        .chat-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .hidden { display: none !important; }

        @media (max-width: 640px) {
            .chat-sidebar { display: none; }
            .chat-panel { height: calc(100vh - 210px); }
            .tab-btn { font-size: 0.82rem; padding: 10px 4px; }
            .page-wrap { padding: 0 10px; }
            .card { padding: 18px; }
        }
    </style>
</head>
<body>
    <div id="nav_bar"></div>

    <p id="login-required" class="profile-help" style="text-align:center;margin:24px;" hidden>請先登入帳號，再管理個人檔案與好友。</p>

    <div id="app-area" hidden>
        <!-- 分頁導覽 -->
        <div class="tab-bar" role="tablist">
            <button class="tab-btn active" data-page="profile" role="tab">個人檔案</button>
            <button class="tab-btn" data-page="friends" role="tab">好友 <span class="tab-badge" id="tab-badge-requests"></span></button>
            <button class="tab-btn" data-page="chat" role="tab">聊天室 <span class="tab-badge" id="tab-badge-unread"></span></button>
        </div>

        <div class="page-wrap">
            <!-- ===== 頁面一：個人檔案 ===== -->
            <section class="page active" id="page-profile">
                <div class="page-heading">
                    <h1>個人檔案</h1>
                    <button id="sign-out" class="profile-button secondary" type="button">登出</button>
                </div>

                <section class="card">
                    <h2>個人頭像</h2>
                    <div class="profile-avatar-row">
                        <div class="avatar-wrap">
                            <img id="profile-avatar" class="profile-avatar" src="https://raingod0101.github.io/catdragon.png" alt="個人頭像">
                            <span id="avatar-unread-badge" class="avatar-unread-badge">0</span>
                            <button id="avatar-edit-btn" class="avatar-edit-btn" type="button" title="更換頭像">✎</button>
                        </div>
                        <div>
                            <p class="profile-help">點擊右下角鉛筆更換頭像，儲存後會同步到帳號資料庫。</p>
                            <input id="avatar-file-input" type="file" accept="image/*" class="hidden">
                        </div>
                    </div>
                    <p id="avatar-status" class="profile-status" role="status"></p>
                </section>

                <section class="card">
                    <h2>顯示名稱</h2>
                    <form id="name-form" class="profile-form">
                        <label>
                            名稱
                            <input id="display-name" type="text" maxlength="40" autocomplete="nickname" required>
                        </label>
                        <button class="profile-button" type="submit">儲存名稱</button>
                    </form>
                    <p id="name-status" class="profile-status" role="status"></p>
                </section>

                <section class="card">
                    <h2>變更密碼</h2>
                    <p class="profile-help">為保護帳號安全，變更密碼時需要驗證目前密碼。</p>
                    <form id="password-form" class="profile-form">
                        <label>
                            目前密碼
                            <input id="current-password" type="password" autocomplete="current-password" required>
                        </label>
                        <label>
                            新密碼（至少 6 個字元）
                            <input id="new-password" type="password" minlength="6" autocomplete="new-password" required>
                        </label>
                        <label>
                            確認新密碼
                            <input id="confirm-password" type="password" minlength="6" autocomplete="new-password" required>
                        </label>
                        <button class="profile-button" type="submit">變更密碼</button>
                    </form>
                    <p id="password-status" class="profile-status" role="status"></p>
                </section>
            </section>

            <!-- ===== 頁面二：好友 ===== -->
            <section class="page" id="page-friends">
                <div class="page-heading">
                    <h1>好友</h1>
                </div>

                <section class="card">
                    <h2>搜尋好友</h2>
                    <p class="profile-help">輸入對方帳號（@ 前面的名稱）送出好友申請。</p>
                    <div class="search-row">
                        <input id="friend-search-input" type="text" placeholder="輸入帳號搜尋" autocomplete="off">
                        <button id="friend-search-btn" class="profile-button" type="button" style="width:auto;padding:10px 16px;">搜尋</button>
                    </div>
                    <ul id="search-results" class="search-results" style="margin-top:12px;"></ul>
                </section>

                <section class="card">
                    <h2>好友申請</h2>
                    <ul id="request-list" class="request-list">
                        <li class="profile-help" id="request-empty">目前沒有待處理的好友申請。</li>
                    </ul>
                </section>

                <section class="card">
                    <h2>好友列表</h2>
                    <ul id="friend-list" class="friend-list">
                        <li class="profile-help" id="friend-empty">尚未加入任何好友。</li>
                    </ul>
                </section>
            </section>

            <!-- ===== 頁面三：聊天室 ===== -->
            <section class="page" id="page-chat">
                <div class="chat-panel">
                    <div class="chat-layout">
                        <aside class="chat-sidebar">
                            <div class="chat-sidebar-title">好友對話</div>
                            <ul id="chat-sidebar-friends" style="list-style:none;margin:0;padding:0;"></ul>
                        </aside>
                        <div class="chat-main">
                            <div class="chat-header">
                                <div>
                                    <div class="title" id="chat-title">聊天室</div>
                                    <div class="sub" id="chat-subtitle">請從好友列表選擇一位好友開始聊天。</div>
                                </div>
                                <div class="chat-header-actions">
                                    <button id="chat-clear-friend" class="mini-btn" type="button" hidden>關閉對話</button>
                                </div>
                            </div>
                            <div class="chat-box" id="chat-box">
                                <div class="chat-empty" id="chat-empty">請從左側好友列表選擇一位好友開始聊天。</div>
                            </div>
                            <div class="chat-input-area">
                                <input type="text" id="msg-input" placeholder="輸入訊息..." disabled>
                                <button class="chat-send-btn" id="chat-send-btn" type="button" disabled>傳送</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="menu.js"></script>
    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove, get, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // 等待 menu.js 完成 Firebase 初始化
        if (window.raingodFirebaseReady) await window.raingodFirebaseReady;
        if (window.raingodAuthReady) await window.raingodAuthReady;

        const firebaseConfig = {
            apiKey: "AIzaSyDHb0o6ahdNnvlL3-QQy_yRO_mg4XMqtJk",
            databaseURL: "https://chat-73802-default-rtdb.firebaseio.com"
        };
        let chatApp = getApps().find(a => a.name === 'rainChat');
        if (!chatApp) chatApp = initializeApp(firebaseConfig, 'rainChat');
        const chatDb = getDatabase(chatApp);

        const compatAuth = () => window.firebase?.auth ? window.firebase.auth() : null;
        const compatDb = () => window.firebase?.database ? window.firebase.database() : null;

        // ===== DOM =====
        const fallbackAvatar = 'https://raingod0101.github.io/catdragon.png';
        const loginRequired = document.getElementById('login-required');
        const appArea = document.getElementById('app-area');

        const avatarImg = document.getElementById('profile-avatar');
        const avatarBadge = document.getElementById('avatar-unread-badge');
        const avatarEditBtn = document.getElementById('avatar-edit-btn');
        const avatarFileInput = document.getElementById('avatar-file-input');
        const nameForm = document.getElementById('name-form');
        const displayNameInput = document.getElementById('display-name');
        const passwordForm = document.getElementById('password-form');
        const signOutButton = document.getElementById('sign-out');
        const friendSearchInput = document.getElementById('friend-search-input');
        const friendSearchBtn = document.getElementById('friend-search-btn');
        const searchResults = document.getElementById('search-results');
        const requestList = document.getElementById('request-list');
        const friendList = document.getElementById('friend-list');
        const chatSidebarFriends = document.getElementById('chat-sidebar-friends');

        const chatTitle = document.getElementById('chat-title');
        const chatSubtitle = document.getElementById('chat-subtitle');
        const chatBox = document.getElementById('chat-box');
        const chatEmpty = document.getElementById('chat-empty');
        const msgInput = document.getElementById('msg-input');
        const chatSendBtn = document.getElementById('chat-send-btn');
        const chatClearFriend = document.getElementById('chat-clear-friend');

        const tabBadgeRequests = document.getElementById('tab-badge-requests');
        const tabBadgeUnread = document.getElementById('tab-badge-unread');

        // ===== 狀態 =====
        let currentUser = null;
        let currentUid = '';
        let currentUsername = '';
        let chatListeners = [];
        let friendUnreadListeners = [];
        let activeFriendUid = '';
        let friendsCache = {};
        let unreadCache = {};
        let requestsCount = 0;

        // ===== 通用 =====
        function setStatus(id, message, type = '') {
            const el = document.getElementById(id);
            if (!el) return;
            el.textContent = message;
            el.classList.remove('error', 'ok');
            if (type) el.classList.add(type);
        }
        function setFormDisabled(form, disabled) {
            form.querySelectorAll('button, input').forEach(el => el.disabled = disabled);
        }
        function errorMessage(error) {
            if (error?.code === 'auth/wrong-password' || error?.code === 'auth/invalid-credential')
                return '目前密碼不正確，請確認後再試。';
            if (error?.code === 'auth/requires-recent-login')
                return '登入時間過久，請重新登入後再變更密碼。';
            if (error?.code === 'auth/email-already-in-use')
                return '該帳號名稱已被使用。';
            return error?.message || '操作失敗，請稍後再試。';
        }
        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
        }
        function chatIdFor(a, b) { return [a, b].sort().join('__'); }

        // ===== 分頁切換 =====
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                const page = document.getElementById('page-' + btn.dataset.page);
                if (page) page.classList.add('active');
                // 切到聊天室時，若有選取好友則滾到底部
                if (btn.dataset.page === 'chat') {
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            });
        });

        // ===== 取得使用者資料 =====
        async function fetchUserProfile(username) {
            const db = compatDb();
            if (!db) return null;
            try {
                const snap = await db.ref(`users/${username}`).once('value');
                return snap.exists() ? snap.val() : null;
            } catch (e) {
                console.warn('讀取使用者資料失敗', e);
                return null;
            }
        }

        // ===== 初始化 =====
        async function initProfile(user) {
            currentUser = user;
            currentUid = user.uid;
            currentUsername = user.email ? user.email.split('@')[0] : '';

            loginRequired.hidden = true;
            appArea.hidden = false;

            avatarImg.src = user.photoURL || fallbackAvatar;
            displayNameInput.value = user.displayName || currentUsername;

            const profile = await fetchUserProfile(currentUsername);
            if (profile?.profile?.avatar && !user.photoURL) {
                avatarImg.src = profile.profile.avatar;
            }

            listenFriendRequests();
            listenFriends();
        }

        // ===== 頭像 =====
        avatarEditBtn.addEventListener('click', () => avatarFileInput.click());
        avatarFileInput.addEventListener('change', async () => {
            const file = avatarFileInput.files?.[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                setStatus('avatar-status', '請選擇圖片檔案。', 'error');
                return;
            }
            if (file.size > 2 * 1024 * 1024) {
                setStatus('avatar-status', '圖片大小需小於 2MB。', 'error');
                return;
            }
            setStatus('avatar-status', '正在上傳頭像…');
            const reader = new FileReader();
            reader.onload = async () => {
                const dataUrl = reader.result;
                try {
                    const db = compatDb();
                    if (!db) throw new Error('Firebase 未就緒');
                    await db.ref(`users/${currentUsername}/profile/avatar`).set(dataUrl);
                    if (currentUser && typeof currentUser.updateProfile === 'function') {
                        await currentUser.updateProfile({ photoURL: dataUrl });
                        await currentUser.reload();
                    }
                    avatarImg.src = dataUrl;
                    setStatus('avatar-status', '頭像已更新並儲存。', 'ok');
                    refreshFriendsUI();
                } catch (e) {
                    console.error(e);
                    setStatus('avatar-status', '頭像儲存失敗：' + errorMessage(e), 'error');
                } finally {
                    avatarFileInput.value = '';
                }
            };
            reader.readAsDataURL(file);
        });

        // ===== 名稱 =====
        nameForm.addEventListener('submit', async e => {
            e.preventDefault();
            const name = displayNameInput.value.trim();
            if (!name) {
                setStatus('name-status', '請輸入顯示名稱。', 'error');
                return;
            }
            setFormDisabled(nameForm, true);
            setStatus('name-status', '正在儲存…');
            try {
                await currentUser.updateProfile({ displayName: name });
                await currentUser.reload();
                const navAvatar = document.getElementById('user-avatar');
                if (navAvatar) navAvatar.title = `個人檔案：${name}`;
                setStatus('name-status', '顯示名稱已更新。', 'ok');
            } catch (err) {
                setStatus('name-status', errorMessage(err), 'error');
            } finally {
                setFormDisabled(nameForm, false);
            }
        });

        // ===== 密碼 =====
        passwordForm.addEventListener('submit', async e => {
            e.preventDefault();
            if (!currentUser?.email) return;
            const cur = document.getElementById('current-password').value;
            const nw = document.getElementById('new-password').value;
            const cf = document.getElementById('confirm-password').value;
            if (nw.length < 6) {
                setStatus('password-status', '新密碼至少需要 6 個字元。', 'error');
                return;
            }
            if (nw !== cf) {
                setStatus('password-status', '兩次輸入的新密碼不一致。', 'error');
                return;
            }
            setFormDisabled(passwordForm, true);
            setStatus('password-status', '正在變更密碼…');
            try {
                const cred = window.firebase.auth.EmailAuthProvider.credential(currentUser.email, cur);
                await currentUser.reauthenticateWithCredential(cred);
                await currentUser.updatePassword(nw);
                passwordForm.reset();
                setStatus('password-status', '密碼已成功變更。', 'ok');
            } catch (err) {
                setStatus('password-status', errorMessage(err), 'error');
            } finally {
                setFormDisabled(passwordForm, false);
            }
        });

        // ===== 登出 =====
        signOutButton.addEventListener('click', async () => {
            signOutButton.disabled = true;
            try {
                await window.firebase.auth().signOut();
                if (typeof window.raingodClearLocalAccountData === 'function') {
                    window.raingodClearLocalAccountData();
                }
                window.location.href = 'index.html';
            } catch (err) {
                signOutButton.disabled = false;
                alert(`登出失敗：${err.message}`);
            }
        });

        // ===== 好友搜尋 =====
        friendSearchBtn.addEventListener('click', async () => {
            const keyword = friendSearchInput.value.trim().toLowerCase();
            searchResults.innerHTML = '';
            if (!keyword) {
                searchResults.innerHTML = '<li class="profile-help">請輸入帳號關鍵字。</li>';
                return;
            }
            if (keyword === currentUsername) {
                searchResults.innerHTML = '<li class="profile-help">不能加入自己為好友。</li>';
                return;
            }
            const profile = await fetchUserProfile(keyword);
            if (!profile) {
                searchResults.innerHTML = '<li class="profile-help">找不到此帳號。</li>';
                return;
            }
            const db = compatDb();
            const friendSnap = await db.ref(`users/${currentUsername}/friends/${profile.uid}`).once('value').catch(() => null);
            const isFriend = friendSnap?.exists();
            const reqSnap = await db.ref(`users/${keyword}/friend_requests/${currentUsername}`).once('value').catch(() => null);
            const requestSent = reqSnap?.exists();

            const name = profile.profile?.displayName || keyword;
            const avatar = profile.profile?.avatar || fallbackAvatar;
            const li = document.createElement('li');
            li.className = 'friend-item';
            li.innerHTML = `
                <img class="friend-avatar" src="${escapeHtml(avatar)}" alt="">
                <div class="friend-name">${escapeHtml(name)} <small style="color:var(--text-gray);font-weight:400;">@${escapeHtml(keyword)}</small></div>
                <div class="friend-actions">
                    ${isFriend ? '<span class="profile-help">已是好友</span>' :
                        requestSent ? '<span class="profile-help">已送出申請</span>' :
                        `<button class="mini-btn primary" data-uid="${escapeHtml(profile.uid)}" data-name="${escapeHtml(name)}" data-username="${escapeHtml(keyword)}">加好友</button>`}
                </div>`;
            searchResults.appendChild(li);

            const addBtn = li.querySelector('button[data-uid]');
            if (addBtn) {
                addBtn.addEventListener('click', async () => {
                    addBtn.disabled = true;
                    addBtn.textContent = '送出中…';
                    try {
                        await sendFriendRequest(keyword, profile.uid, name);
                        addBtn.textContent = '已送出';
                    } catch (e) {
                        console.error(e);
                        addBtn.disabled = false;
                        addBtn.textContent = '加好友';
                        alert('送出好友申請失敗：' + errorMessage(e));
                    }
                });
            }
        });

        async function sendFriendRequest(toUsername, toUid, toName) {
            const db = compatDb();
            if (!db) throw new Error('Firebase 未就緒');
            const myName = currentUser.displayName || currentUsername;
            const myAvatar = currentUser.photoURL || avatarImg.src || fallbackAvatar;
            await db.ref(`users/${toUsername}/friend_requests/${currentUsername}`).set({
                fromUid: currentUid,
                fromName: myName,
                fromUsername: currentUsername,
                fromAvatar: myAvatar,
                ts: window.firebase.database.ServerValue.TIMESTAMP
            });
        }

        // ===== 好友申請監聽 =====
        function listenFriendRequests() {
            const db = compatDb();
            if (!db) return;
            const ref = db.ref(`users/${currentUsername}/friend_requests`);
            ref.on('value', snap => {
                const val = snap.val() || {};
                const entries = Object.entries(val);
                requestList.innerHTML = '';
                requestsCount = entries.length;
                updateTabBadges();
                if (!entries.length) {
                    requestList.innerHTML = '<li class="profile-help" id="request-empty">目前沒有待處理的好友申請。</li>';
                    return;
                }
                entries.forEach(([fromUsername, req]) => {
                    const li = document.createElement('li');
                    li.className = 'request-item';
                    li.innerHTML = `
                        <img class="friend-avatar" src="${escapeHtml(req.fromAvatar || fallbackAvatar)}" alt="">
                        <div class="friend-name">${escapeHtml(req.fromName || fromUsername)}</div>
                        <div class="friend-actions">
                            <button class="mini-btn success" data-accept="${escapeHtml(fromUsername)}" data-uid="${escapeHtml(req.fromUid)}" data-name="${escapeHtml(req.fromName || fromUsername)}" data-avatar="${escapeHtml(req.fromAvatar || fallbackAvatar)}">接受</button>
                            <button class="mini-btn danger" data-reject="${escapeHtml(fromUsername)}">拒絕</button>
                        </div>`;
                    requestList.appendChild(li);
                });
                requestList.querySelectorAll('[data-accept]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        btn.disabled = true;
                        try {
                            await acceptFriendRequest(btn.dataset.accept, btn.dataset.uid, btn.dataset.name, btn.dataset.avatar);
                        } catch (e) {
                            console.error(e);
                            alert('接受好友申請失敗：' + errorMessage(e));
                            btn.disabled = false;
                        }
                    });
                });
                requestList.querySelectorAll('[data-reject]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        btn.disabled = true;
                        try {
                            await rejectFriendRequest(btn.dataset.reject);
                        } catch (e) {
                            console.error(e);
                            alert('拒絕好友申請失敗：' + errorMessage(e));
                            btn.disabled = false;
                        }
                    });
                });
            });
        }

        async function acceptFriendRequest(fromUsername, fromUid, fromName, fromAvatar) {
            const db = compatDb();
            const myName = currentUser.displayName || currentUsername;
            const myAvatar = currentUser.photoURL || avatarImg.src || fallbackAvatar;
            const updates = {};
            updates[`users/${currentUsername}/friends/${fromUid}`] = {
                name: fromName, avatar: fromAvatar, username: fromUsername,
                since: window.firebase.database.ServerValue.TIMESTAMP
            };
            updates[`users/${fromUsername}/friends/${currentUid}`] = {
                name: myName, avatar: myAvatar, username: currentUsername,
                since: window.firebase.database.ServerValue.TIMESTAMP
            };
            updates[`users/${currentUsername}/friend_requests/${fromUsername}`] = null;
            await db.ref().update(updates);
        }

        async function rejectFriendRequest(fromUsername) {
            const db = compatDb();
            await db.ref(`users/${currentUsername}/friend_requests/${fromUsername}`).remove();
        }

        // ===== 好友列表 =====
        function listenFriends() {
            const db = compatDb();
            if (!db) return;
            const ref = db.ref(`users/${currentUsername}/friends`);
            ref.on('value', snap => {
                friendsCache = snap.val() || {};
                refreshFriendsUI();
                listenAllUnread();
            });
        }

        function refreshFriendsUI() {
            // 好友頁列表
            friendList.innerHTML = '';
            const entries = Object.entries(friendsCache);
            if (!entries.length) {
                friendList.innerHTML = '<li class="profile-help" id="friend-empty">尚未加入任何好友。</li>';
            } else {
                entries.forEach(([uid, f]) => {
                    const li = document.createElement('li');
                    li.className = 'friend-item' + (uid === activeFriendUid ? ' active' : '');
                    li.innerHTML = `
                        <img class="friend-avatar" src="${escapeHtml(f.avatar || fallbackAvatar)}" alt="">
                        <div class="friend-name">${escapeHtml(f.name || f.username || '好友')}</div>
                        <span class="friend-unread" data-uid="${escapeHtml(uid)}"></span>
                        <div class="friend-actions">
                            <button class="mini-btn primary" data-chat-uid="${escapeHtml(uid)}" data-chat-name="${escapeHtml(f.name || f.username || '好友')}" data-chat-avatar="${escapeHtml(f.avatar || fallbackAvatar)}">私訊</button>
                        </div>`;
                    friendList.appendChild(li);
                });
                friendList.querySelectorAll('[data-chat-uid]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        openPrivateChat(btn.dataset.chatUid, btn.dataset.chatName, btn.dataset.chatAvatar);
                        // 切到聊天室頁籤
                        switchTab('chat');
                    });
                });
            }

            // 聊天室側邊欄
            chatSidebarFriends.innerHTML = '';
            if (!entries.length) {
                chatSidebarFriends.innerHTML = '<li class="profile-help" style="padding:12px;">尚無好友</li>';
            } else {
                entries.forEach(([uid, f]) => {
                    const li = document.createElement('li');
                    li.className = 'friend-item' + (uid === activeFriendUid ? ' active' : '');
                    li.style.cursor = 'pointer';
                    li.innerHTML = `
                        <img class="friend-avatar" src="${escapeHtml(f.avatar || fallbackAvatar)}" alt="">
                        <div class="friend-name">${escapeHtml(f.name || f.username || '好友')}</div>
                        <span class="friend-unread" data-uid="${escapeHtml(uid)}"></span>`;
                    li.addEventListener('click', () => {
                        openPrivateChat(uid, f.name || f.username || '好友', f.avatar || fallbackAvatar);
                    });
                    chatSidebarFriends.appendChild(li);
                });
            }

            updateUnreadBadges();
        }

        // ===== 未讀 =====
        function listenAllUnread() {
            friendUnreadListeners.forEach(fn => fn());
            friendUnreadListeners = [];
            unreadCache = {};
            const db = compatDb();
            if (!db) return;

            Object.keys(friendsCache).forEach(friendUid => {
                const cid = chatIdFor(currentUid, friendUid);
                const readRef = db.ref(`private_chats/${cid}/read/${currentUid}`);
                const msgsRef = db.ref(`private_chats/${cid}/msgs`);
                const handler = snap => {
                    const msgs = snap.val() || {};
                    readRef.once('value').then(readSnap => {
                        const lastRead = readSnap.val() || 0;
                        let unread = 0;
                        Object.values(msgs).forEach(m => {
                            if (m.from !== currentUid && (m.ts || 0) > lastRead) unread++;
                        });
                        unreadCache[friendUid] = unread;
                        updateUnreadBadges();
                    }).catch(() => {});
                };
                msgsRef.on('value', handler);
                friendUnreadListeners.push(() => msgsRef.off('value', handler));
            });
        }

        function updateUnreadBadges() {
            // 好友列表與側邊欄紅點
            document.querySelectorAll('.friend-unread').forEach(el => {
                const uid = el.dataset.uid;
                const count = unreadCache[uid] || 0;
                el.textContent = count > 99 ? '99+' : String(count);
                el.classList.toggle('show', count > 0);
            });
            // 頭像總未讀
            const total = Object.values(unreadCache).reduce((s, n) => s + n, 0);
            if (total > 0) {
                avatarBadge.textContent = total > 99 ? '99+' : String(total);
                avatarBadge.style.display = 'block';
            } else {
                avatarBadge.style.display = 'none';
            }
            // 頁籤徽章
            tabBadgeUnread.textContent = total > 99 ? '99+' : String(total);
            tabBadgeUnread.classList.toggle('show', total > 0);
            updateTabBadges();
        }

        function updateTabBadges() {
            tabBadgeRequests.textContent = requestsCount > 99 ? '99+' : String(requestsCount);
            tabBadgeRequests.classList.toggle('show', requestsCount > 0);
        }

        // ===== 聊天室 =====
        function switchTab(name) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.page === name));
            document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + name));
        }

        function clearChatListeners() {
            chatListeners.forEach(fn => fn());
            chatListeners = [];
        }

        async function openPrivateChat(friendUid, friendName, friendAvatar) {
            activeFriendUid = friendUid;
            clearChatListeners();
            chatTitle.textContent = friendName;
            chatSubtitle.textContent = '私訊對話';
            chatClearFriend.hidden = false;
            msgInput.disabled = false;
            chatSendBtn.disabled = false;
            chatEmpty.style.display = 'none';
            chatBox.querySelectorAll('.msg-row').forEach(el => el.remove());

            const cid = chatIdFor(currentUid, friendUid);
            const msgsRef = ref(chatDb, `private_chats/${cid}/msgs`);
            const unsub = onValue(msgsRef, snap => {
                const msgs = snap.val() || {};
                const list = Object.entries(msgs).sort((a, b) => (a[1].ts || 0) - (b[1].ts || 0));
                chatBox.querySelectorAll('.msg-row').forEach(el => el.remove());
                if (!list.length) {
                    chatEmpty.style.display = 'block';
                    return;
                }
                chatEmpty.style.display = 'none';
                list.forEach(([id, m]) => {
                    const isMe = m.from === currentUid;
                    const div = document.createElement('div');
                    div.className = `msg-row ${isMe ? 'me' : 'other'}`;
                    div.innerHTML = `
                        <div class="msg-info">${escapeHtml(m.name || (isMe ? currentUsername : friendName))} • ${formatTime(m.ts)}</div>
                        <div class="bubble">${escapeHtml(m.text)}</div>`;
                    chatBox.appendChild(div);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
                markChatRead(cid);
            });
            chatListeners.push(unsub);
            refreshFriendsUI();
            markChatRead(cid);
        }

        async function markChatRead(cid) {
            if (!chatDb || !currentUid) return;
            try {
                await set(ref(chatDb, `private_chats/${cid}/read/${currentUid}`), serverTimestamp());
                if (activeFriendUid) {
                    unreadCache[activeFriendUid] = 0;
                    updateUnreadBadges();
                }
            } catch (e) {
                console.warn('標記已讀失敗', e);
            }
        }

        chatClearFriend.addEventListener('click', () => {
            activeFriendUid = '';
            clearChatListeners();
            chatTitle.textContent = '聊天室';
            chatSubtitle.textContent = '請從好友列表選擇一位好友開始聊天。';
            chatClearFriend.hidden = true;
            msgInput.disabled = true;
            chatSendBtn.disabled = true;
            chatBox.querySelectorAll('.msg-row').forEach(el => el.remove());
            chatEmpty.style.display = 'block';
            refreshFriendsUI();
        });

        async function sendMessage() {
            if (!activeFriendUid || !chatDb) return;
            const text = msgInput.value.trim();
            if (!text) return;
            const cid = chatIdFor(currentUid, activeFriendUid);
            try {
                await push(ref(chatDb, `private_chats/${cid}/msgs`), {
                    from: currentUid,
                    to: activeFriendUid,
                    name: currentUser.displayName || currentUsername,
                    text,
                    ts: serverTimestamp()
                });
                msgInput.value = '';
                msgInput.focus();
            } catch (e) {
                console.error(e);
                alert('訊息傳送失敗：' + (e.message || '未知錯誤'));
            }
        }

        chatSendBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function formatTime(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            const now = new Date();
            const time = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
            if (d.toDateString() === now.toDateString()) return '今天 ' + time;
            const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
            if (d.toDateString() === yesterday.toDateString()) return '昨天 ' + time;
            return `${d.getMonth()+1}/${d.getDate()} ${time}`;
        }

        // ===== 初始化 =====
        (async function init() {
            try {
                if (window.raingodFirebaseReady) await window.raingodFirebaseReady;
                const user = await window.raingodAuthReady;
                if (!user) {
                    loginRequired.hidden = false;
                    appArea.hidden = true;
                    return;
                }
                await initProfile(user);

                window.firebase.auth().onAuthStateChanged(async u => {
                    if (u) {
                        await initProfile(u);
                    } else {
                        currentUser = null; currentUid = ''; currentUsername = '';
                        appArea.hidden = true;
                        loginRequired.hidden = false;
                        clearChatListeners();
                        friendUnreadListeners.forEach(fn => fn());
                        friendUnreadListeners = [];
                        friendsCache = {};
                        unreadCache = {};
                        requestList.innerHTML = ''; friendList.innerHTML = '';
                        chatSidebarFriends.innerHTML = '';
                        searchResults.innerHTML = '';
                        chatBox.querySelectorAll('.msg-row').forEach(el => el.remove());
                        chatEmpty.style.display = 'block';
                        chatClearFriend.hidden = true;
                        msgInput.disabled = true;
                        chatSendBtn.disabled = true;
                        updateUnreadBadges();
                    }
                });
            } catch (e) {
                console.error('初始化失敗', e);
                loginRequired.hidden = false;
                loginRequired.textContent = '載入個人檔案失敗：' + errorMessage(e);
                loginRequired.classList.add('error');
            }
        })();
    </script>
</body>
</html>
