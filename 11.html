<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Level Devil · HTML</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#07070d;overflow:hidden}
  body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center}
  
  /* 修复：整个应用严格限制在屏幕内，不允许溢出 */
  #app{display:flex;flex-direction:column;width:100%;height:100%;max-width:1100px;padding:8px;gap:8px;overflow:hidden}
  #stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;border-radius:10px;box-shadow:0 0 60px rgba(90,70,180,.25),0 0 0 1px rgba(255,255,255,.06);touch-action:none}
  
  /* 修复：底部按钮使用 Grid 布局，确保在任何手机屏幕上都不会超出边缘 */
  #controls{
    display:grid;
    grid-template-columns:1fr 1fr 1.5fr 1fr;
    gap:8px;
    width:100%;
    max-width:600px;
    margin:0 auto;
    padding:0 8px env(safe-area-inset-bottom,8px);
  }
  #controls button{
    width:100%;
    height:56px;
    border-radius:12px;
    border:2px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.06);
    color:#fff;font-size:19px;font-weight:700;
    cursor:pointer;user-select:none;touch-action:none;
    transition:background .08s,border-color .08s,transform .08s;
  }
  #controls button.on{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.4);transform:scale(.96)}
  #controls button[data-k="KeyR"]{font-size:15px;opacity:.75}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="game" width="960" height="540"></canvas></div>
  <div id="controls">
    <button data-k="ArrowLeft">◀</button>
    <button data-k="ArrowRight">▶</button>
    <button data-k="Space">跳</button>
    <button data-k="KeyR">重来</button>
  </div>
</div>

<script>
(() => {
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const stage = document.getElementById('stage');

const GRAV = 1900, MOVE = 300, JUMP_V = -700, MAX_FALL = 1150;

const keys = Object.create(null);

/* ===================== 关卡 ===================== */
const LEVELS = [
  // 1. 假地板：跳过去安全，走过去会掉
  {
    name: '第 1 关 · 第一课',
    hint: '按空格跳过去！',
    realHint: '……走过去试试？',
    spawn: { x: 60, y: 420 },
    platforms: [
      { x: 0, y: 480, w: 320, h: 60 },
      { x: 320, y: 480, w: 240, h: 60, fake: true },
      { x: 560, y: 480, w: 400, h: 60 },
    ],
    spikes: [{ x: 320, y: 540, w: 240, h: 80 }],
    doors: [{ x: 880, y: 424, w: 44, h: 56, real: true }],
  },
  // 2. 假按钮、假门
  {
    name: '第 2 关 · 点击开始',
    hint: '点击中间的按钮开始',
    realHint: '按钮是平台，真门在它上面',
    spawn: { x: 60, y: 420 },
    platforms: [
      { x: 0, y: 480, w: 960, h: 60 },
      { x: 380, y: 340, w: 200, h: 50, button: true },
    ],
    doors: [
      { x: 880, y: 424, w: 44, h: 56, real: false, behavior: 'vanish' },
      { x: 458, y: 284, w: 44, h: 56, real: true },
    ],
  },
  // 3. 周期性尖刺
  {
    name: '第 3 关 · 静止的尖刺',
    hint: '尖刺不会动，放心走',
    realHint: '它们会周期升起……看准节奏',
    spawn: { x: 60, y: 420 },
    platforms: [{ x: 0, y: 480, w: 960, h: 60 }],
    spikes: [
      { x: 320, y: 480, w: 90, h: 70, cycle: 1.6, phase: 0,   periodic: true },
      { x: 520, y: 480, w: 90, h: 70, cycle: 1.6, phase: 0.5, periodic: true },
      { x: 720, y: 480, w: 90, h: 70, cycle: 1.6, phase: 0.25, periodic: true },
    ],
    doors: [{ x: 880, y: 424, w: 44, h: 56, real: true }],
  },
  // 4. 传送陷阱
  {
    name: '第 4 关 · 安全区',
    hint: '紫色区域是安全的',
    realHint: '紫色区域会把你传送到尖刺上',
    spawn: { x: 60, y: 420 },
    platforms: [{ x: 0, y: 480, w: 960, h: 60 }],
    zones: [{ x: 400, y: 0, w: 120, h: 540, teleportTo: { x: 820, y: 90 }, color: '#9b6bff' }],
    spikes: [{ x: 780, y: 480, w: 80, h: 60 }],
    doors: [{ x: 900, y: 424, w: 44, h: 56, real: true }],
  },
  // 5. 传送带
  {
    name: '第 5 关 · 逆流',
    hint: '地面很安静',
    realHint: '地面在把你往后推',
    spawn: { x: 700, y: 420 },
    platforms: [{ x: 0, y: 480, w: 960, h: 60, conveyor: -150 }],
    doors: [{ x: 40, y: 424, w: 44, h: 56, real: true }],
  },
  // 6. 逃跑门 + 短暂消失
  {
    name: '第 6 关 · 捉迷藏',
    hint: '追上去',
    realHint: '它会跑，还会消失',
    spawn: { x: 60, y: 420 },
    platforms: [{ x: 0, y: 480, w: 960, h: 60 }],
    doors: [{ x: 600, y: 424, w: 44, h: 56, real: true, flee: true, fleeMax: 880, speed: 240, vanishNear: true }],
  },
  // 7. 真假门
  {
    name: '第 7 关 · 选择',
    hint: '三个门，只有一个是真的',
    realHint: '真门会呼吸',
    spawn: { x: 60, y: 420 },
    platforms: [{ x: 0, y: 480, w: 960, h: 60 }],
    doors: [
      { x: 300, y: 424, w: 44, h: 56, real: false, behavior: 'spike' },
      { x: 500, y: 424, w: 44, h: 56, real: true, breathe: true },
      { x: 700, y: 424, w: 44, h: 56, real: false, behavior: 'spike' },
    ],
  },
  // 8. 地狱
  {
    name: '第 8 关 · 地狱',
    hint: '祝你好运',
    realHint: '别信任何东西',
    spawn: { x: 40, y: 420 },
    platforms: [
      { x: 0, y: 480, w: 220, h: 60 },
      { x: 220, y: 480, w: 140, h: 60, fake: true },
      { x: 360, y: 480, w: 600, h: 60 },
    ],
    spikes: [{ x: 480, y: 480, w: 80, h: 60, trigger: 100, delay: 0.25 }],
    crashers: [{ x: 720, y: -100, w: 70, h: 110, trigger: 120, delay: 0.15 }],
    zones: [{ x: 560, y: 0, w: 100, h: 540, teleportTo: { x: 40, y: 90 }, color: '#9b6bff' }],
    doors: [{ x: 880, y: 424, w: 44, h: 56, real: true, flee: true, fleeMax: 880, speed: 220 }],
  },
];

/* ===================== 状态 ===================== */
const player = {
  x: 0, y: 0, w: 24, h: 28,
  vx: 0, vy: 0,
  onGround: false, coyote: 0, jumpHeld: false,
  dead: false, deadT: 0, reversing: false,
};

const state = {
  levelIndex: 0,
  level: null,
  time: 0,
  deaths: 0,
  shake: 0,
  hint: '',
  realHint: '',
  hintT: 0,
  phase: 0,
  won: false,
  transition: 0,
  particles: [],
};

/* ===================== 工具 ===================== */
function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

function burst(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 60 + Math.random() * 260;
    state.particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 160,
      size: 2 + Math.random() * 4,
      life: 0.45 + Math.random() * 0.5,
      maxLife: 0.95,
      color,
    });
  }
}

function updateParticles(dt) {
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.vy += 1300 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) state.particles.splice(i, 1);
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

/* ===================== 关卡加载 ===================== */
function loadLevel(i) {
  const def = LEVELS[i];
  state.levelIndex = i;
  state.time = 0;
  state.phase = 0;
  state.hint = def.hint || def.name;
  state.realHint = def.realHint || def.hint || def.name;
  state.hintT = 2.6;
  state.particles.length = 0;
  state.transition = 0;
  state.shake = 0;

  state.level = {
    name: def.name,
    spawn: { ...def.spawn },
    platforms: (def.platforms || []).map(p => ({
      ...p,
      baseX: p.x, baseY: p.y,
      gone: false, shake: 0, contact: false,
      vanishT: 0,
    })),
    spikes: (def.spikes || []).map(s => ({
      ...s, progress: 0, active: false,
    })),
    crashers: (def.crashers || []).map(c => ({
      ...c, y0: c.y, active: false, done: false, t: 0, vy: 0, linger: 0,
    })),
    zones: (def.zones || []).map(z => ({ ...z, cooldown: 0 })),
    doors: (def.doors || []).map(d => ({
      ...d, baseX: d.x, used: false, vanished: false, vanishT: 0, fleeing: false,
    })),
  };

  respawn();
}

function respawn() {
  const L = state.level;
  player.x = L.spawn.x;
  player.y = L.spawn.y;
  player.vx = 0;
  player.vy = 0;
  player.dead = false;
  player.deadT = 0;
  player.onGround = false;
  player.coyote = 0;
  
  // 修复死循环：强制把跳跃状态设为“已按住”，玩家必须松开按键才能再次跳跃
  player.jumpHeld = true; 
  
  player.reversing = false;

  for (const p of L.platforms) {
    p.gone = false;
    p.shake = 0;
    p.contact = false;
    p.vanishT = 0;
    p.x = p.baseX;
    p.y = p.baseY;
  }
  for (const s of L.spikes) { s.progress = 0; s.active = false; }
  for (const c of L.crashers) { c.active = false; c.done = false; c.t = 0; c.vy = 0; c.linger = 0; c.y = c.y0; }
  for (const z of L.zones) z.cooldown = 0;
  for (const d of L.doors) {
    d.x = d.baseX;
    d.vanished = false;
    d.vanishT = 0;
    d.fleeing = false;
  }

  state.particles.length = 0;
  state.time = 0;
}

function restart() {
  if (state.won) {
    state.won = false;
    state.deaths = 0;
    for (const d of LEVELS.flatMap(l => l.doors || [])) d.used = false;
    loadLevel(0);
  } else {
    loadLevel(state.levelIndex);
  }
}

function killPlayer() {
  if (player.dead || state.won || state.transition > 0) return;
  player.dead = true;
  player.deadT = 0.8;
  state.deaths++;
  state.shake = 12;
  burst(player.x + player.w / 2, player.y + player.h / 2, 24, '#ff4d6d');
}

function winLevel() {
  if (state.transition > 0 || state.won) return;
  state.transition = 0.45;
  const d = state.level.doors.find(x => x.real);
  burst(d.x + 22, d.y + 28, 28, '#4ade80');
}

/* ===================== 更新 ===================== */
function update(dt) {
  const L = state.level;
  if (!L) return;

  if (state.hintT > 0) state.hintT -= dt;
  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 45);

  updateParticles(dt);

  if (state.won) return;

  if (state.transition > 0) {
    state.transition -= dt;
    if (state.transition <= 0) {
      const next = state.levelIndex + 1;
      if (next >= LEVELS.length) state.won = true;
      else loadLevel(next);
    }
    return;
  }

  if (player.dead) {
    player.deadT -= dt;
    player.vy = Math.min(player.vy + GRAV * dt, MAX_FALL);
    player.y += player.vy * dt;
    if (player.deadT <= 0) respawn();
    return;
  }

  state.time += dt;

  for (const p of L.platforms) {
    if (p.vanishT > 0) p.vanishT -= dt;
  }

  for (const z of L.zones) {
    if (z.cooldown > 0) z.cooldown -= dt;
    if (z.teleportTo && z.cooldown <= 0 && overlap(player, z)) {
      player.x = z.teleportTo.x;
      player.y = z.teleportTo.y;
      player.vx = 0;
      player.vy = 0;
      z.cooldown = 0.6;
      state.shake = 8;
      burst(player.x + player.w / 2, player.y + player.h / 2, 14, z.color || '#9b6bff');
    }
  }

  let rev = false;
  for (const z of L.zones) {
    if (z.reverse && overlap(player, z)) rev = true;
  }
  player.reversing = rev;

  let dir = 0;
  if (keys['ArrowLeft']  || keys['KeyA']) dir -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) dir += 1;
  if (rev) dir = -dir;
  player.vx = dir * MOVE;

  let conveyor = 0;
  for (const p of L.platforms) {
    if (p.conveyor && !p.gone && p.vanishT <= 0 && player.onGround &&
        player.x + player.w > p.x && player.x < p.x + p.w &&
        Math.abs(player.y + player.h - p.y) < 6) {
      conveyor = p.conveyor;
    }
  }

  const jumpKey = !!(keys['Space'] || keys['ArrowUp'] || keys['KeyW']);
  if (jumpKey && !player.jumpHeld && (player.onGround || player.coyote > 0)) {
    player.vy = JUMP_V;
    player.onGround = false;
    player.coyote = 0;
    player.jumpHeld = true;

    for (const p of L.platforms) {
      if (p.vanishOnJump && !p.gone) {
        p.vanishT = 0.42;
        burst(p.x + p.w / 2, p.y + 10, 12, '#3a3a5c');
      }
    }
  }
  if (!jumpKey) {
    player.jumpHeld = false;
    if (player.vy < 0) player.vy += GRAV * 1.6 * dt;
  }

  player.x += (player.vx + conveyor) * dt;
  for (const p of L.platforms) {
    if (p.gone || p.vanishT > 0) continue;
    if (overlap(player, p)) {
      if (player.vx + conveyor > 0)      player.x = p.x - player.w;
      else if (player.vx + conveyor < 0) player.x = p.x + p.w;
    }
  }
  if (player.x < 0) player.x = 0;
  if (player.x + player.w > W) player.x = W - player.w;

  player.vy = Math.min(player.vy + GRAV * dt, MAX_FALL);
  player.y += player.vy * dt;
  player.onGround = false;

  for (const p of L.platforms) {
    if (p.gone || p.vanishT > 0) continue;
    if (overlap(player, p)) {
      if (player.vy > 0) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
        if (p.fake) p.contact = true;
      } else if (player.vy < 0) {
        player.y = p.y + p.h;
        player.vy = 0;
      }
    }
  }

  for (const p of L.platforms) {
    if (!p.fake || p.gone) continue;
    if (p.contact) {
      p.shake += dt;
      if (p.shake > 0.4) {
        p.gone = true;
        burst(p.x + p.w / 2, p.y + 8, 20, '#3a3a5c');
        state.shake = 8;
      }
    } else {
      p.shake = Math.max(0, p.shake - dt * 1.5);
    }
    p.contact = false;
  }

  player.coyote = player.onGround ? 0.1 : Math.max(0, player.coyote - dt);

  for (const s of L.spikes) {
    if (s.periodic) {
      const ph = ((state.time / s.cycle) + s.phase) % 1;
      let t;
      if (ph < 0.5) t = Math.sin(ph * Math.PI * 2) * 0.5 + 0.5;
      else t = 0;
      s.progress = Math.max(0, Math.min(1, t));
    } else if (s.trigger != null) {
      if (!s.active) {
        if (player.x + player.w > s.x - s.trigger) s.active = true;
      }
      if (s.active && s.progress < 1) s.progress = Math.min(1, s.progress + dt / (s.delay || 0.3));
    } else if (s.jumpTriggered) {
      if (player.vy !== 0 && !player.onGround) s.progress = Math.min(1, s.progress + dt / 0.15);
      else s.progress = Math.max(0, s.progress - dt / 0.3);
    } else {
      s.progress = 1;
    }

    if (s.progress > 0.05) {
      const hh = s.h * s.progress;
      if (overlap(player, { x: s.x, y: s.y - hh, w: s.w, h: hh })) {
        killPlayer();
        return;
      }
    }
  }

  for (const c of L.crashers) {
    if (!c.active) {
      if (player.x + player.w > c.x - c.trigger) c.active = true;
      continue;
    }
    if (c.done) { if (c.linger > 0) c.linger -= dt; continue; }
    c.t += dt;
    if (c.t > c.delay) {
      c.vy += 2600 * dt;
      c.y += c.vy * dt;
      if (c.y + c.h >= 480) {
        c.y = 480 - c.h;
        c.done = true;
        c.linger = 0.35;
        state.shake = 10;
        burst(c.x + c.w / 2, 470, 16, '#8b3a4a');
      }
    }
    if (!c.done && overlap(player, { x: c.x, y: c.y, w: c.w, h: c.h })) {
      killPlayer();
      return;
    }
  }

  for (const d of L.doors) {
    if (d.used) continue;

    if (d.flee && d.real) {
      if (!d.fleeing && player.x + player.w > d.x - 280) d.fleeing = true;
      if (d.fleeing && d.x < d.fleeMax) d.x = Math.min(d.fleeMax, d.x + d.speed * dt);
    }

    if (d.vanishNear && d.real) {
      const near = Math.abs((player.x + player.w / 2) - (d.x + d.w / 2)) < 90;
      if (near && d.vanishT <= 0 && Math.random() < 0.02) {
        d.vanishT = 0.28;
      }
      if (d.vanishT > 0) d.vanishT -= dt;
    }

    if (!d.real && !d.used) {
      if (d.behavior === 'vanish') {
        if (Math.abs((player.x + player.w / 2) - (d.x + d.w / 2)) < 70) {
          d.vanished = true;
        }
      }
      if (d.behavior === 'spike') {
        if (overlap(player, d)) {
          d.used = true;
          killPlayer();
          return;
        }
      }
    }

    if (d.real && !d.vanished && d.vanishT <= 0 && overlap(player, d)) {
      winLevel();
      return;
    }
  }

  if (player.y > H + 150) killPlayer();
}

/* ===================== 渲染 ===================== */
function drawDoor(d) {
  const t = performance.now() / 1000;
  const breathe = d.breathe ? 0.5 + 0.5 * Math.sin(t * 3) : 1;

  if (!d.real) {
    if (d.used) {
      ctx.fillStyle = 'rgba(80,80,100,0.25)';
      ctx.fillRect(d.x, d.y, d.w, d.h);
      return;
    }
    if (d.vanished) return;
  }

  const glow = d.real ? (d.breathe ? 14 + breathe * 16 : 20) : 10;
  const color = d.real ? '#4ade80' : '#8b8bff';

  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = glow;
  ctx.fillStyle = color;
  ctx.fillRect(d.x, d.y, d.w, d.h);
  ctx.restore();

  ctx.fillStyle = '#0d0d17';
  ctx.fillRect(d.x + 5, d.y + 5, d.w - 10, d.h - 10);

  ctx.fillStyle = color;
  ctx.fillRect(d.x + d.w - 14, d.y + d.h / 2 - 3, 6, 6);
}

function render() {
  const L = state.level;

  ctx.save();
  if (state.shake > 0.4) {
    ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
  }

  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#141426');
  bg.addColorStop(0.6, '#0d0d18');
  bg.addColorStop(1, '#07070d');
  ctx.fillStyle = bg;
  ctx.fillRect(-60, -60, W + 120, H + 120);

  ctx.strokeStyle = 'rgba(255,255,255,0.025)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 48) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y <= H; y += 48) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  if (L) {
    for (const z of L.zones) {
      ctx.fillStyle = (z.color || '#9b6bff') + '22';
      ctx.fillRect(z.x, z.y, z.w, z.h);
      ctx.strokeStyle = (z.color || '#9b6bff') + '66';
      ctx.lineWidth = 2;
      ctx.setLineDash([12, 8]);
      ctx.strokeRect(z.x + 1, z.y + 1, z.w - 2, z.h - 2);
      ctx.setLineDash([]);
      ctx.lineWidth = 1;

      if (z.teleportTo) {
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.font = '600 13px system-ui,sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('安全区', z.x + z.w / 2, z.y + 30);
      }
    }

    for (const p of L.platforms) {
      if (p.gone || p.vanishT > 0) continue;
      let ox = 0, oy = 0;
      if (p.fake && p.shake > 0.01) {
        const k = Math.min(p.shake / 0.4, 1);
        ox = (Math.random() - 0.5) * 6 * k;
        oy = (Math.random() - 0.5) * 4 * k;
      }
      ctx.fillStyle = '#232338';
      ctx.fillRect(p.x + ox, p.y + oy, p.w, p.h);
      ctx.fillStyle = '#3d3d63';
      ctx.fillRect(p.x + ox, p.y + oy, p.w, 3);

      if (p.button) {
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.font = '700 20px system-ui,sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('点击开始', p.x + p.w / 2, p.y + 32);
      }

      if (p.conveyor) {
        ctx.fillStyle = 'rgba(255,180,80,0.5)';
        for (let i = 0; i < p.w; i += 28) {
          const off = ((state.time * p.conveyor) % 28 + 28) % 28;
          ctx.fillRect(p.x + i + off, p.y + 10, 14, 4);
        }
      }
    }

    for (const s of L.spikes) {
      if (s.progress <= 0.01) continue;
      const hh = s.h * s.progress;
      const count = Math.max(1, Math.round(s.w / 18));
      const step = s.w / count;
      ctx.fillStyle = '#ff4d6d';
      for (let i = 0; i < count; i++) {
        const x = s.x + i * step;
        ctx.beginPath();
        ctx.moveTo(x, s.y);
        ctx.lineTo(x + step / 2, s.y - hh);
        ctx.lineTo(x + step, s.y);
        ctx.closePath();
        ctx.fill();
      }
    }

    for (const c of L.crashers) {
      if (!c.active) continue;
      if (c.done && c.linger <= 0) continue;
      const alpha = c.done ? Math.max(0, c.linger / 0.35) : 1;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#5a2530';
      ctx.fillRect(c.x, c.y, c.w, c.h);
      ctx.fillStyle = '#8b3a4a';
      ctx.fillRect(c.x, c.y, c.w, 6);
      ctx.globalAlpha = 1;
    }

    for (const d of L.doors) drawDoor(d);

    if (!player.dead) {
      const cx = player.x + player.w / 2;
      const cy = player.y + player.h / 2;
      ctx.save();
      ctx.translate(cx, cy);
      if (player.reversing) ctx.rotate(Math.sin(performance.now() / 90) * 0.08);
      ctx.fillStyle = player.reversing ? '#d8b4ff' : '#f0f0fa';
      roundRect(-player.w / 2, -player.h / 2, player.w, player.h, 5);
      ctx.fill();
      ctx.fillStyle = '#14141f';
      const look = player.vx > 0 ? 2 : player.vx < 0 ? -2 : 0;
      ctx.fillRect(-7 + look, -7, 4, 7);
      ctx.fillRect( 3 + look, -7, 4, 7);
      ctx.restore();
    }

    for (const p of state.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  if (L) {
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = '600 16px ui-monospace,Menlo,Consolas,monospace';
    ctx.fillText(L.name, 20, 32);

    ctx.textAlign = 'right';
    ctx.fillText('死亡 ' + state.deaths, W - 20, 32);

    if (state.hintT > 0 && !state.won) {
      const t = state.hintT;
      const showFake = t > 1.2;
      ctx.globalAlpha = Math.min(1, t * 1.2);
      ctx.textAlign = 'center';
      ctx.font = '700 26px system-ui,sans-serif';
      if (showFake) {
        ctx.fillStyle = '#fff';
        ctx.fillText(state.hint, W / 2, 96);
      } else {
        ctx.fillStyle = '#ff9f6b';
        const txt = state.realHint;
        ctx.fillText(txt, W / 2, 96);
        const m = ctx.measureText(txt);
        ctx.strokeStyle = 'rgba(255,159,107,0.6)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(W / 2 - m.width / 2, 96 - 8);
        ctx.lineTo(W / 2 + m.width / 2, 96 - 8);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }

  if (state.won) {
    ctx.fillStyle = 'rgba(5,5,10,0.88)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#4ade80';
    ctx.font = '800 54px system-ui,sans-serif';
    ctx.fillText('你通关了', W / 2, H / 2 - 40);
    ctx.fillStyle = '#fff';
    ctx.font = '400 22px system-ui,sans-serif';
    ctx.fillText('总死亡次数：' + state.deaths, W / 2, H / 2 + 26);
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.font = '400 18px system-ui,sans-serif';
    ctx.fillText('按 R 或点「重来」再来一遍', W / 2, H / 2 + 76);
  }
}

/* ===================== 输入 ===================== */
window.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'KeyR') restart();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

document.querySelectorAll('#controls button').forEach(b => {
  const k = b.dataset.k;
  const down = e => {
    e.preventDefault();
    if (k === 'KeyR') { restart(); return; }
    keys[k] = true;
    b.classList.add('on');
    try { b.setPointerCapture(e.pointerId); } catch (_) {}
  };
  const up = () => {
    if (k !== 'KeyR') { keys[k] = false; b.classList.remove('on'); }
  };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('lostpointercapture', up);
});

/* ===================== 自适应尺寸 ===================== */
function fitCanvas() {
  const r = stage.getBoundingClientRect();
  if (r.width <= 0 || r.height <= 0) return;
  const s = Math.min(r.width / W, r.height / H);
  canvas.style.width  = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 120));

/* ===================== 主循环 ===================== */
let last = performance.now();

function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

loadLevel(0);
fitCanvas();
requestAnimationFrame(() => {
  fitCanvas();
  last = performance.now();
  requestAnimationFrame(loop);
});

})();
</script>
