<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2D 籃球 1v1 · 手機版</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(circle at 50% 0%, #262633, #0d0d12 70%);
    font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
    color: #ddd;
    user-select: none; -webkit-user-select: none;
    touch-action: none; overscroll-behavior: none;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    width: auto; height: auto;
    max-width: 100vw; max-height: 100vh;
    display: block;
    border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06);
    touch-action: none;
  }
  #tip {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    font-size: 12px; padding: 5px 14px; border-radius: 999px;
    background: rgba(255,255,255,.10); color: #ffd35c;
    display: none; pointer-events: none; white-space: nowrap;
  }
  @media (orientation: portrait) and (pointer: coarse) {
    #tip { display: block; }
  }
</style>
</head>
<body>
<canvas id="c" width="900" height="700"></canvas>
<div id="tip">建議橫屏遊玩 📱↻</div>
<script>
// ================== 常數設定 ==================
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const W = 900, H = 700;

const COURT  = { x: 60, y: 60, w: 780, h: 580 };
const HOOP   = { x: W / 2, y: COURT.y + 55, r: 20 };
const THREE_R = 235;
const WIN_SCORE = 11;

const PERFECT_MIN = 0.62, PERFECT_MAX = 0.85, CHARGE_SPEED = 1.5;

// ================== 遊戲狀態 ==================
const player = { x: 450, y: 520, r: 16, speed: 270, color: '#4a9eff', moving: false };
const cpu    = { x: 450, y: 340, r: 16, speed: 245, color: '#ff5a5a', moving: false };

const ball = {
  x: 450, y: 520, z: 0, r: 9,
  vx: 0, vy: 0, vz: 0,
  state: 'held', owner: 'player',
  sx: 0, sy: 0, tx: 0, ty: 0, t: 0, dur: .55,
  willScore: false, shooter: null, points: 2,
  pickupDelay: 0
};

let score = { player: 0, cpu: 0 };
let state = 'play';
let message = '', messageTimer = 0;

const keys = {};
let charging = false, power = 0, powerDir = 1;
let stealCooldown = 0, stealGrace = 0;
let cpuShootTimer = 0, cpuStealTimer = 0;
let gameTime = 0, lastTime = 0;

// ================== 觸控虛擬按鍵 ==================
const isTouchDevice = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

const BTN_SHOT  = { x: W - 115, y: H - 150, r: 66 };
const BTN_STEAL = { x: W - 258, y: H - 78,  r: 50 };
const JOY_R = 62, JOY_MAX = 70;

const touch = {
  joyId: null, joyCX: 0, joyCY: 0,
  joyX: 0, joyY: 0, joyHX: 0, joyHY: 0,
  shotId: null, stealId: null
};

function toCanvas(e) {
  const r = cvs.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (W / r.width),
    y: (e.clientY - r.top)  * (H / r.height)
  };
}

function hit(p, b) {
  return Math.hypot(p.x - b.x, p.y - b.y) < b.r * 1.15;
}

function updateJoy(p) {
  let dx = p.x - touch.joyCX;
  let dy = p.y - touch.joyCY;
  const d = Math.hypot(dx, dy);
  if (d > JOY_MAX) { dx = dx / d * JOY_MAX; dy = dy / d * JOY_MAX; }
  if (d < 8) { dx = 0; dy = 0; }
  touch.joyHX = dx;
  touch.joyHY = dy;
  touch.joyX = dx / JOY_MAX;
  touch.joyY = dy / JOY_MAX;
}

function clearTouch() {
  touch.joyId = null;
  touch.joyX = touch.joyY = touch.joyHX = touch.joyHY = 0;
  touch.shotId = null;
  touch.stealId = null;
}

cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (state === 'gameover') { resetGame(); return; }

  cvs.setPointerCapture(e.pointerId);
  const p = toCanvas(e);

  // 按鈕優先判定
  if (touch.shotId === null && hit(p, BTN_SHOT))  { touch.shotId  = e.pointerId; return; }
  if (touch.stealId === null && hit(p, BTN_STEAL)) { touch.stealId = e.pointerId; return; }

  // 左下區域 → 生成浮動搖桿
  if (touch.joyId === null && p.x < W * 0.58 && p.y > H * 0.42) {
    touch.joyId = e.pointerId;
    touch.joyCX = p.x;
    touch.joyCY = Math.min(p.y, H - 90);
    updateJoy(p);
  }
}, { passive: false });

cvs.addEventListener('pointermove', e => {
  if (e.pointerId !== touch.joyId) return;
  e.preventDefault();
  updateJoy(toCanvas(e));
}, { passive: false });

function onPointerEnd(e) {
  if (e.pointerId === touch.joyId) {
    touch.joyId = null;
    touch.joyX = touch.joyY = touch.joyHX = touch.joyHY = 0;
  }
  if (e.pointerId === touch.shotId)  touch.shotId  = null;
  if (e.pointerId === touch.stealId) touch.stealId = null;
}
cvs.addEventListener('pointerup', onPointerEnd);
cvs.addEventListener('pointercancel', onPointerEnd);
cvs.addEventListener('contextmenu', e => e.preventDefault());

// ================== 鍵盤（桌機相容） ==================
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === ' ') e.preventDefault();
  if (k === 'r' && state === 'gameover') resetGame();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ================== 工具函式 ==================
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const lerp = (a, b, t) => a + (b - a) * t;

function clampEntity(e) {
  e.x = Math.max(COURT.x + e.r, Math.min(COURT.x + COURT.w - e.r, e.x));
  e.y = Math.max(COURT.y + e.r, Math.min(COURT.y + COURT.h - e.r, e.y));
}

function showMessage(t) { message = t; messageTimer = 1.4; }

function moveTowards(e, tx, ty, dt) {
  const dx = tx - e.x, dy = ty - e.y;
  const d = Math.hypot(dx, dy);
  if (d > 3) {
    const step = Math.min(e.speed * dt, d);
    e.x += (dx / d) * step;
    e.y += (dy / d) * step;
  }
  clampEntity(e);
}

function baseAccuracy(d) {
  if (d < 90)  return 0.90;
  if (d < 170) return 0.72;
  if (d < 260) return 0.50;
  return 0.32;
}

// ================== 球權 / 投籃 ==================
function giveBall(who) {
  ball.state = 'held';
  ball.owner = who;
  ball.z = 0;
  ball.vx = ball.vy = ball.vz = 0;
  ball.pickupDelay = 0;
  stealGrace = 0.6;
  charging = false;
  power = 0;
}

function resetPossession(who) {
  const off = who === 'player' ? player : cpu;
  const def = who === 'player' ? cpu : player;

  off.x = HOOP.x + (Math.random() - 0.5) * 280;
  off.y = COURT.y + COURT.h - 130;
  def.x = HOOP.x + (Math.random() - 0.5) * 180;
  def.y = COURT.y + 200;

  giveBall(who);
  stealGrace = 0.9;
}

function launchShot(who, acc, distToHoop) {
  const s = who === 'player' ? player : cpu;
  ball.state = 'shot';
  ball.owner = null;
  ball.sx = s.x; ball.sy = s.y - 10;
  ball.tx = HOOP.x; ball.ty = HOOP.y;
  ball.t = 0;
  ball.dur = 0.5 + distToHoop / 1200;
  ball.willScore = Math.random() < acc;
  ball.shooter = who;
  ball.points = distToHoop > THREE_R ? 3 : 2;
  ball.z = 0;
}

function playerShoot() {
  const d = dist(player, HOOP);
  let acc = baseAccuracy(d);

  let powerMul;
  if (power >= PERFECT_MIN && power <= PERFECT_MAX) {
    powerMul = 1.2;
  } else {
    const off = power < PERFECT_MIN ? PERFECT_MIN - power : power - PERFECT_MAX;
    powerMul = Math.max(0.2, 1 - off * 2.5);
  }
  acc *= powerMul;

  if (player.moving) acc *= 0.88;
  if (dist(player, cpu) < 70) acc *= 0.6;

  launchShot('player', Math.min(0.98, acc), d);

  if (powerMul >= 1.2) showMessage('完美出手！');
  else if (powerMul < 0.5) showMessage('力道不佳…');
}

function cpuDoShoot() {
  const d = dist(cpu, HOOP);
  let acc = baseAccuracy(d) * 0.85;
  if (dist(player, cpu) < 70) acc *= 0.6;
  launchShot('cpu', acc, d);
}

function resolveShot() {
  if (ball.willScore) {
    score[ball.shooter] += ball.points;
    showMessage((ball.shooter === 'player' ? '你' : '電腦') + ' 投進了！ +' + ball.points);

    if (score.player >= WIN_SCORE || score.cpu >= WIN_SCORE) {
      state = 'gameover';
      clearTouch();
      return;
    }
    resetPossession(ball.shooter === 'player' ? 'cpu' : 'player');
  } else {
    ball.state = 'loose';
    ball.x = HOOP.x + (Math.random() - 0.5) * 100;
    ball.y = HOOP.y + 40 + Math.random() * 90;
    ball.z = 10;
    ball.vx = (Math.random() - 0.5) * 260;
    ball.vy = 60 + Math.random() * 140;
    ball.vz = 120;
    ball.pickupDelay = 0.25;
    ball.owner = null;
  }
}

// ================== 更新 ==================
function updatePlayer(dt) {
  let mx = 0, my = 0;
  if (keys['w'] || keys['arrowup'])    my -= 1;
  if (keys['s'] || keys['arrowdown'])  my += 1;
  if (keys['a'] || keys['arrowleft'])  mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;

  if (touch.joyId !== null) { mx += touch.joyX; my += touch.joyY; }

  const len = Math.hypot(mx, my);
  player.moving = len > 0.35;
  if (len > 0.05) {
    const s = len > 1 ? 1 / len : 1;
    player.x += mx * s * player.speed * dt;
    player.y += my * s * player.speed * dt;
  }
  clampEntity(player);

  const shootHeld = keys[' '] || touch.shotId !== null;

  if (ball.owner === 'player' && ball.state === 'held') {
    if (shootHeld) {
      if (!charging) { charging = true; power = 0; powerDir = 1; }
      power += powerDir * CHARGE_SPEED * dt;
      if (power >= 1) { power = 1; powerDir = -1; }
      if (power <= 0) { power = 0; powerDir = 1; }
    } else if (charging) {
      charging = false;
      playerShoot();
    }
  } else {
    charging = false;
  }

  const stealHeld = keys['shift'] || touch.stealId !== null;
  if (stealHeld && stealCooldown <= 0 &&
      ball.owner === 'cpu' && ball.state === 'held' && stealGrace <= 0) {
    stealCooldown = 0.9;
    if (dist(player, cpu) < 55 && Math.random() < 0.35) {
      giveBall('player');
      showMessage('搶斷成功！');
    }
  }
}

function updateCPU(dt) {
  if (cpuShootTimer > 0) cpuShootTimer -= dt;
  if (cpuStealTimer > 0) cpuStealTimer -= dt;

  let tx = cpu.x, ty = cpu.y;

  if (ball.state === 'held' && ball.owner === 'cpu') {
    const d = dist(cpu, HOOP);
    if (d > 175) {
      tx = HOOP.x + Math.sin(gameTime * 1.3) * 60;
      ty = HOOP.y + 150;
      if (dist(cpu, player) < 100) {
        tx += (cpu.x - player.x) * 0.8;
        ty += (cpu.y - player.y) * 0.3;
      }
    } else {
      if (cpuShootTimer <= 0) {
        cpuShootTimer = 0.6 + Math.random() * 0.8;
        if (dist(cpu, player) > 65 || Math.random() < 0.5) cpuDoShoot();
      }
      tx = cpu.x + Math.cos(gameTime * 2) * 30;
      ty = cpu.y + Math.sin(gameTime * 2) * 30;
    }
  } else if (ball.state === 'held' && ball.owner === 'player') {
    tx = player.x * 0.6 + HOOP.x * 0.4;
    ty = player.y * 0.6 + (HOOP.y + 60) * 0.4;

    if (dist(cpu, player) < 50 && stealGrace <= 0 && cpuStealTimer <= 0) {
      cpuStealTimer = 1.2;
      if (Math.random() < 0.28) {
        giveBall('cpu');
        showMessage('電腦搶斷！');
      }
    }
  } else if (ball.state === 'loose') {
    tx = ball.x; ty = ball.y;
  } else {
    tx = (ball.x + HOOP.x) / 2;
    ty = (ball.y + HOOP.y) / 2;
  }

  moveTowards(cpu, tx, ty, dt);
}

function updateBall(dt) {
  if (ball.state === 'held') {
    const h = ball.owner === 'player' ? player : cpu;
    ball.x = h.x + h.r * 0.9;
    ball.y = h.y - 2;
    ball.z = 0;

  } else if (ball.state === 'shot') {
    ball.t += dt;
    let p = Math.min(1, ball.t / ball.dur);
    ball.x = lerp(ball.sx, ball.tx, p);
    ball.y = lerp(ball.sy, ball.ty, p);
    const arcH = 60 + dist({ x: ball.sx, y: ball.sy }, HOOP) * 0.25;
    ball.z = Math.sin(p * Math.PI) * arcH;
    if (p >= 1) resolveShot();

  } else if (ball.state === 'loose') {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    const fr = Math.pow(0.08, dt);
    ball.vx *= fr;
    ball.vy *= fr;

    ball.z += ball.vz * dt;
    ball.vz -= 800 * dt;
    if (ball.z < 0) {
      ball.z = 0;
      ball.vz *= -0.5;
      if (Math.abs(ball.vz) < 50) ball.vz = 0;
    }

    const m = ball.r;
    if (ball.x < COURT.x + m) { ball.x = COURT.x + m; ball.vx *= -0.6; }
    if (ball.x > COURT.x + COURT.w - m) { ball.x = COURT.x + COURT.w - m; ball.vx *= -0.6; }
    if (ball.y < COURT.y + m) { ball.y = COURT.y + m; ball.vy *= -0.6; }
    if (ball.y > COURT.y + COURT.h - m) { ball.y = COURT.y + COURT.h - m; ball.vy *= -0.6; }
  }
}

function checkPickup() {
  if (ball.state !== 'loose' || ball.pickupDelay > 0) return;
  if (ball.z > 25) return;
  for (const [name, e] of [['player', player], ['cpu', cpu]]) {
    if (dist(ball, e) < e.r + ball.r + 8) { giveBall(name); return; }
  }
}

function resolveCollisions() {
  const dx = player.x - cpu.x, dy = player.y - cpu.y;
  const d = Math.hypot(dx, dy);
  const minD = player.r + cpu.r;
  if (d < minD && d > 0.001) {
    const push = (minD - d) / 2;
    const nx = dx / d, ny = dy / d;
    player.x += nx * push;  player.y += ny * push;
    cpu.x    -= nx * push;  cpu.y    -= ny * push;
    clampEntity(player);
    clampEntity(cpu);
  }
}

function update(dt) {
  if (state !== 'play') return;

  if (stealCooldown > 0) stealCooldown -= dt;
  if (stealGrace > 0)    stealGrace -= dt;
  if (messageTimer > 0)  messageTimer -= dt;
  if (ball.pickupDelay > 0) ball.pickupDelay -= dt;

  updatePlayer(dt);
  updateCPU(dt);
  updateBall(dt);
  resolveCollisions();
  checkPickup();
}

// ================== 繪製 ==================
function drawCourt() {
  const g = ctx.createLinearGradient(0, COURT.y, 0, COURT.y + COURT.h);
  g.addColorStop(0, '#c98a4b');
  g.addColorStop(1, '#a86f37');
  ctx.fillStyle = g;
  ctx.fillRect(COURT.x, COURT.y, COURT.w, COURT.h);

  ctx.strokeStyle = 'rgba(0,0,0,0.05)';
  ctx.lineWidth = 1;
  for (let y = COURT.y; y < COURT.y + COURT.h; y += 26) {
    ctx.beginPath();
    ctx.moveTo(COURT.x, y);
    ctx.lineTo(COURT.x + COURT.w, y);
    ctx.stroke();
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 3;
  ctx.strokeRect(COURT.x, COURT.y, COURT.w, COURT.h);
  ctx.strokeRect(HOOP.x - 130, COURT.y, 260, 190);

  ctx.beginPath();
  ctx.arc(HOOP.x, COURT.y + 190, 60, 0, Math.PI);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(HOOP.x - THREE_R, COURT.y);
  ctx.lineTo(HOOP.x - THREE_R, HOOP.y);
  ctx.arc(HOOP.x, HOOP.y, THREE_R, Math.PI, 0, false);
  ctx.lineTo(HOOP.x + THREE_R, COURT.y);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(240,240,240,0.95)';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(HOOP.x - 85, COURT.y + 10);
  ctx.lineTo(HOOP.x + 85, COURT.y + 10);
  ctx.stroke();

  ctx.strokeStyle = '#ff6b1a';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.arc(HOOP.x, HOOP.y, HOOP.r, 0, Math.PI * 2);
  ctx.stroke();
}

function drawEntity(e, color, isPlayer) {
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.ellipse(e.x, e.y + e.r * 0.65, e.r * 0.95, e.r * 0.42, 0, 0, Math.PI * 2);
  ctx.fill();

  const holding = ball.state === 'held' && ball.owner === (isPlayer ? 'player' : 'cpu');
  if (holding) {
    ctx.strokeStyle = 'rgba(255,215,80,0.85)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r + 6, 0, Math.PI * 2);
    ctx.stroke();
  }

  const grd = ctx.createRadialGradient(
    e.x - e.r * 0.35, e.y - e.r * 0.35, e.r * 0.15,
    e.x, e.y, e.r
  );
  grd.addColorStop(0, isPlayer ? '#8cc4ff' : '#ff9a9a');
  grd.addColorStop(1, color);
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawBall() {
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(ball.x, ball.y + 4, ball.r * 0.9, ball.r * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();

  const by = ball.y - ball.z;
  ctx.save();
  ctx.translate(ball.x, by);

  const g = ctx.createRadialGradient(-3, -3, 1, 0, 0, ball.r);
  g.addColorStop(0, '#ffc07a');
  g.addColorStop(1, '#dd7414');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, ball.r, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#6d3204';
  ctx.lineWidth = 1.3;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-ball.r, 0); ctx.lineTo(ball.r, 0);
  ctx.moveTo(0, -ball.r); ctx.lineTo(0, ball.r);
  ctx.stroke();

  ctx.restore();
}

function drawPowerBar() {
  if (!charging) return;
  const bw = 84, bh = 10;
  const bx = player.x - bw / 2;
  const by = player.y - 46;

  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(bx, by, bw, bh);

  ctx.fillStyle = 'rgba(90,255,130,0.45)';
  ctx.fillRect(bx + bw * PERFECT_MIN, by, bw * (PERFECT_MAX - PERFECT_MIN), bh);

  ctx.fillStyle = '#fff';
  ctx.fillRect(bx + bw * power - 2, by - 3, 4, bh + 6);

  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(bx, by, bw, bh);
}

function drawTouchControls() {
  if (!isTouchDevice) return;

  // ---- 搖桿 ----
  if (touch.joyId !== null) {
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(touch.joyCX, touch.joyCY, JOY_R, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 0.30;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.stroke();

    const hx = touch.joyCX + touch.joyHX;
    const hy = touch.joyCY + touch.joyHY;
    ctx.globalAlpha = 0.65;
    ctx.beginPath();
    ctx.arc(hx, hy, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  } else {
    // 提示圈
    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 8]);
    ctx.beginPath();
    ctx.arc(150, H - 140, JOY_R, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // ---- 投籃鈕 ----
  drawRoundButton(BTN_SHOT, '投', touch.shotId !== null, '#ff8a1e');
  // ---- 搶斷鈕 ----
  drawRoundButton(BTN_STEAL, '搶', touch.stealId !== null, '#3f8bff');
}

function drawRoundButton(b, label, active, color) {
  ctx.save();
  ctx.globalAlpha = active ? 0.9 : 0.42;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalAlpha = active ? 0.95 : 0.55;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.globalAlpha = 0.95;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.round(b.r * 0.7) + 'px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, b.x, b.y + 1);
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
}

function drawUI() {
  ctx.textAlign = 'left';
  ctx.font = 'bold 30px system-ui, sans-serif';
  ctx.fillStyle = '#4a9eff';
  ctx.fillText('你 ' + score.player, 34, 42);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#ff5a5a';
  ctx.fillText(score.cpu + ' 電腦', W - 34, 42);

  ctx.textAlign = 'center';
  ctx.font = '13px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillText('先得 ' + WIN_SCORE + ' 分', W / 2, 40);

  if (messageTimer > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, messageTimer / 0.4);
    ctx.font = 'bold 26px system-ui, sans-serif';
    ctx.fillStyle = '#ffe27a';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 12;
    ctx.fillText(message, W / 2, 330);
    ctx.restore();
  }

  if (state === 'gameover') {
    ctx.fillStyle = 'rgba(0,0,0,0.80)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.font = 'bold 58px system-ui, sans-serif';
    const win = score.player > score.cpu;
    ctx.fillStyle = win ? '#6dff9e' : '#ff6b6b';
    ctx.fillText(win ? '你贏了！' : '電腦贏了', W / 2, 320);

    ctx.font = '22px system-ui, sans-serif';
    ctx.fillStyle = '#ddd';
    ctx.fillText(isTouchDevice ? '點擊畫面重新開始' : '按 R 重新開始', W / 2, 380);
  }
}

function render() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#12121a';
  ctx.fillRect(0, 0, W, H);

  drawCourt();
  drawEntity(player, player.color, true);
  drawEntity(cpu, cpu.color, false);
  drawBall();
  drawPowerBar();
  drawTouchControls();
  drawUI();
}

// ================== 主迴圈 ==================
function loop(ts) {
  if (!lastTime) lastTime = ts;
  let dt = (ts - lastTime) / 1000;
  lastTime = ts;
  dt = Math.min(dt, 0.05);
  gameTime += dt;

  update(dt);
  render();
  requestAnimationFrame(loop);
}

function resetGame() {
  score = { player: 0, cpu: 0 };
  state = 'play';
  messageTimer = 0;
  stealCooldown = 0;
  cpuShootTimer = 0;
  cpuStealTimer = 0;
  charging = false;
  power = 0;
  clearTouch();
  resetPossession('player');
  lastTime = 0;
}

resetGame();
requestAnimationFrame(loop);
</script>
