<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>雨神大戰爭 | Raingod</title>
<style>
:root{
  --p-color:#00d4ff; --e-color:#ff4d4d; --gold:#f1c40f;
  --rarity-r:#95a5a6; --rarity-sr:#3498db; --rarity-ssr:#9b59b6;
  --rarity-uber:#e67e22; --rarity-ur:#e74c3c; --rarity-ex:#00f0ff;
  --attr-red:#ff4757; --attr-float:#70a1ff; --attr-angel:#eccc68;
  --attr-alien:#2ed573; --attr-undead:#a4b0be; --attr-none:#ced6e0;
}
*{box-sizing:border-box;touch-action:manipulation;-webkit-user-select:none;}
body{margin:0;background:#0b0c10;color:#fff;height:100svh;width:100vw;overflow:hidden;font-family:'PingFang TC','微軟正黑體',sans-serif;}

.screen{display:none;width:100%;height:100%;flex-direction:column;align-items:center;background:#111425;padding:12px;}
.active{display:flex;}
.title{font-size:clamp(20px,5vw,26px);font-weight:900;color:var(--p-color);margin-bottom:6px;text-shadow:0 0 10px rgba(0,212,255,.5);}
.top-res{width:100%;display:flex;justify-content:space-around;background:rgba(0,0,0,.6);padding:8px;border-radius:10px;margin-bottom:8px;font-size:13px;font-weight:bold;border:1px solid #333;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;overflow-y:auto;flex-grow:1;padding:4px;}
@media(min-width:600px){.grid{grid-template-columns:repeat(5,1fr);}}

.card{background:#1a233a;border:2px solid #0f3460;border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;transition:.15s;position:relative;font-size:11px;contain:layout style paint;}
.card:active{transform:scale(.95);}
.card.locked{opacity:.3;filter:grayscale(1);}
.card.selected{border-color:#2ecc71!important;box-shadow:0 0 10px #2ecc71;}
.card .card-art{display:flex;justify-content:center;align-items:flex-end;height:44px;}

.rarity-R{border-color:var(--rarity-r);}
.rarity-SR{border-color:var(--rarity-sr);}
.rarity-SSR{border-color:var(--rarity-ssr);}
.rarity-UBER{border-color:var(--rarity-uber);box-shadow:0 0 6px var(--rarity-uber);}
.rarity-UR{border-color:var(--rarity-ur);box-shadow:0 0 8px var(--rarity-ur);}
.rarity-EX{border-color:var(--rarity-ex);box-shadow:0 0 12px var(--rarity-ex);}

.tag{display:inline-block;padding:1px 4px;border-radius:3px;font-size:9px;font-weight:bold;color:#000;margin-top:2px;}
.tag-紅{background:var(--attr-red);color:#fff;}
.tag-飛{background:var(--attr-float);color:#fff;}
.tag-聖{background:var(--attr-angel);}
.tag-星{background:var(--attr-alien);}
.tag-屍{background:var(--attr-undead);color:#fff;}
.tag-無{background:var(--attr-none);}

#game-screen{padding:0;position:relative;}
#stage{position:relative;width:100%;flex-grow:1;background:linear-gradient(to bottom,#09131d,#162a38,#1d3c4d);overflow:hidden;}
.ground{position:absolute;bottom:0;width:100%;height:50px;background:linear-gradient(#1c1c22,#0e0e12);border-top:4px solid #333;}
.base{position:absolute;bottom:50px;width:70px;height:110px;border-radius:8px 8px 0 0;z-index:5;}
#p-base{left:0;background:linear-gradient(180deg,#123a66,#0a1e36);border-right:4px solid var(--p-color);}
#e-base{right:0;background:linear-gradient(180deg,#5a1220,#2a060c);border-left:4px solid var(--e-color);}
.base-hp{position:absolute;top:-22px;width:130%;left:-15%;text-align:center;font-size:11px;font-weight:bold;background:rgba(0,0,0,.8);padding:2px;border-radius:4px;border:1px solid #444;}

#battle-top-bar{position:absolute;top:8px;width:95%;left:2.5%;display:flex;justify-content:space-between;z-index:100;font-weight:bold;font-size:13px;text-shadow:0 1px 3px #000;}

#ui-panel{height:125px;width:100%;background:#0b172a;display:flex;gap:6px;padding:8px;overflow-x:auto;border-top:2px solid #1e293b;padding-bottom:env(safe-area-inset-bottom);}
.spawn-btn{min-width:72px;height:100%;background:#162032;border:1.5px solid #475569;border-radius:8px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-around;flex-shrink:0;font-size:10px;padding:2px;position:relative;cursor:pointer;}
.spawn-btn:disabled{opacity:.35;filter:grayscale(1);}
.cd-mask{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;border-radius:6px;}

.unit{position:absolute;bottom:calc(50px + var(--lane-y,0px));text-align:center;z-index:10;pointer-events:none;will-change:left;--dir:1;}
.unit[data-side="enemy"]{--dir:-1;}
.unit-body{display:inline-block;width:100%;transform-origin:center bottom;will-change:transform;filter:drop-shadow(0 3px 5px rgba(0,0,0,.55));}
.unit-body svg{display:block;width:100%;height:auto;overflow:visible;}
.hp-bar{width:100%;height:4px;background:#000;margin-bottom:2px;border-radius:2px;overflow:hidden;border:.5px solid #555;}
.hp-inner{height:100%;background:linear-gradient(90deg,#2ecc71,#7bed9f);width:100%;transition:width .1s;}

.unit[data-attr="紅"] .unit-body{filter:drop-shadow(0 3px 5px rgba(0,0,0,.55)) drop-shadow(0 0 5px rgba(255,71,87,.55));}
.unit[data-attr="飛"] .unit-body{filter:drop-shadow(0 3px 5px rgba(0,0,0,.55)) drop-shadow(0 0 5px rgba(112,161,255,.55));}
.unit[data-attr="聖"] .unit-body{filter:drop-shadow(0 3px 5px rgba(0,0,0,.55)) drop-shadow(0 0 5px rgba(236,204,104,.55));}
.unit[data-attr="星"] .unit-body{filter:drop-shadow(0 3px 5px rgba(0,0,0,.55)) drop-shadow(0 0 5px rgba(46,213,115,.55));}
.unit[data-attr="屍"] .unit-body{filter:drop-shadow(0 3px 5px rgba(0,0,0,.55)) drop-shadow(0 0 5px rgba(164,176,190,.55));}
.unit[data-attr="無"] .unit-body{filter:drop-shadow(0 3px 5px rgba(0,0,0,.55)) drop-shadow(0 0 5px rgba(206,214,224,.45));}

@keyframes idlePounce{0%,100%{transform:translateY(0) scale(1,1);}50%{transform:translateY(-2px) scale(1.03,.97);}}
@keyframes walkPounce{0%,100%{transform:translateY(0) scale(1.06,.94);}30%{transform:translateY(-8px) scale(.94,1.08);}60%{transform:translateY(0) scale(1.08,.92);}80%{transform:translateY(-4px) scale(.98,1.02);}}
@keyframes atkPounce{0%{transform:translate(0,0) scale(1,1) rotate(0);}25%{transform:translate(calc(var(--dir)*-8px),0) scale(.82,1.2) rotate(calc(var(--dir)*-10deg));}55%{transform:translate(calc(var(--dir)*20px),-16px) scale(1.22,.85) rotate(calc(var(--dir)*14deg));}100%{transform:translate(0,0) scale(1,1) rotate(0);}}

@keyframes idleChomp{0%,100%{transform:translateY(0) rotate(0) scaleX(1);}40%{transform:translateY(-1px) rotate(-2deg) scaleX(1.04);}70%{transform:translateY(0) rotate(2deg) scaleX(.98);}}
@keyframes walkChomp{0%,100%{transform:translateY(0) rotate(-3deg) scale(1,1);}25%{transform:translateY(-5px) rotate(0) scale(.96,1.05);}50%{transform:translateY(0) rotate(3deg) scale(1.04,.96);}75%{transform:translateY(-5px) rotate(0) scale(.96,1.05);}}
@keyframes atkChomp{0%{transform:translate(0,0) rotate(0) scale(1,1);}20%{transform:translate(calc(var(--dir)*-10px),0) rotate(calc(var(--dir)*-6deg)) scale(.9,1.1);}45%{transform:translate(calc(var(--dir)*18px),-6px) rotate(calc(var(--dir)*10deg)) scale(1.15,.9);}62%{transform:translate(calc(var(--dir)*10px),0) rotate(calc(var(--dir)*-4deg)) scale(.94,1.06);}100%{transform:translate(0,0) rotate(0) scale(1,1);}}

@keyframes idleFlap{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-5px) rotate(2deg);}}
@keyframes walkFlap{0%,100%{transform:translateY(-2px) rotate(-6deg) scale(1,.95);}25%{transform:translateY(-9px) rotate(0) scale(.95,1.06);}50%{transform:translateY(-3px) rotate(6deg) scale(1.05,.94);}75%{transform:translateY(-9px) rotate(0) scale(.95,1.06);}}
@keyframes atkFlap{0%{transform:translate(0,0) scale(1,1) rotate(0);}30%{transform:translate(calc(var(--dir)*-6px),4px) scale(.88,1.14) rotate(calc(var(--dir)*-8deg));}60%{transform:translate(calc(var(--dir)*16px),-22px) scale(1.18,.86) rotate(calc(var(--dir)*16deg));}100%{transform:translate(0,0) scale(1,1) rotate(0);}}

@keyframes idleStomp{0%,100%{transform:translateY(0) scale(1,1);}50%{transform:translateY(-1px) scale(1.05,.95);}}
@keyframes walkStomp{0%,100%{transform:translateY(0) scale(1.08,.92) rotate(-2deg);}50%{transform:translateY(-7px) scale(.94,1.08) rotate(2deg);}}
@keyframes atkStomp{0%{transform:translate(0,0) scale(1,1);}35%{transform:translate(0,-22px) scale(.86,1.16);}55%{transform:translate(calc(var(--dir)*12px),0) scale(1.35,.7);}75%{transform:translate(0,-4px) scale(.96,1.04);}100%{transform:translate(0,0) scale(1,1);}}

@keyframes idleFloat{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-6px) rotate(3deg);}}
@keyframes walkFloat{0%,100%{transform:translateY(-3px) rotate(-5deg) scale(1,1);}33%{transform:translateY(-9px) rotate(0) scale(1.05,.95);}66%{transform:translateY(-3px) rotate(5deg) scale(.95,1.05);}}
@keyframes atkFloat{0%{transform:translate(0,0) scale(1) rotate(0);}35%{transform:translate(0,6px) scale(.8,.8) rotate(0);}60%{transform:translate(calc(var(--dir)*10px),-10px) scale(1.35) rotate(calc(var(--dir)*20deg));}100%{transform:translate(0,0) scale(1) rotate(0);}}

@keyframes idleMarch{0%,100%{transform:translateY(0) rotate(0);}25%{transform:translateY(-1px) rotate(-1deg);}75%{transform:translateY(-1px) rotate(1deg);}}
@keyframes walkMarch{0%,100%{transform:translateY(0) rotate(-4deg);}25%{transform:translateY(-4px) rotate(0);}50%{transform:translateY(0) rotate(4deg);}75%{transform:translateY(-4px) rotate(0);}}
@keyframes atkMarch{0%{transform:translate(0,0) rotate(0);}25%{transform:translate(calc(var(--dir)*-10px),0) rotate(calc(var(--dir)*-8deg));}50%{transform:translate(calc(var(--dir)*20px),0) rotate(calc(var(--dir)*8deg));}100%{transform:translate(0,0) rotate(0);}}

@keyframes idleCrawl{0%,100%{transform:translate(0,0) rotate(-5deg) scale(1,1);}50%{transform:translate(calc(var(--dir)*2px),-2px) rotate(5deg) scale(1,.97);}}
@keyframes walkCrawl{0%,100%{transform:translate(0,0) rotate(-8deg) scale(1,.95);}50%{transform:translate(calc(var(--dir)*3px),-5px) rotate(8deg) scale(.95,1.05);}}
@keyframes atkCrawl{0%{transform:translate(0,0) rotate(-8deg) scale(1);}35%{transform:translate(calc(var(--dir)*-6px),2px) rotate(-20deg) scale(.9,1.1);}60%{transform:translate(calc(var(--dir)*14px),-8px) rotate(14deg) scale(1.2,.85);}100%{transform:translate(0,0) rotate(-8deg) scale(1);}}

@keyframes idleSlither{0%,100%{transform:translateX(0) skewX(0) scaleY(1);}25%{transform:translateX(calc(var(--dir)*2px)) skewX(4deg) scaleY(.98);}75%{transform:translateX(calc(var(--dir)*-2px)) skewX(-4deg) scaleY(1.02);}}
@keyframes walkSlither{0%,100%{transform:translateX(0) skewX(-8deg) scaleY(1);}50%{transform:translateX(calc(var(--dir)*4px)) skewX(8deg) scaleY(.94);}}
@keyframes atkSlither{0%{transform:translate(0,0) skewX(0) scale(1);}30%{transform:translate(calc(var(--dir)*-8px),0) skewX(-14deg) scaleY(1.2);}55%{transform:translate(calc(var(--dir)*20px),-8px) skewX(18deg) scaleY(.85) scaleX(1.2);}100%{transform:translate(0,0) skewX(0) scale(1);}}

@keyframes idleCharge{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-2px) rotate(calc(var(--dir)*2deg));}}
@keyframes walkCharge{0%,100%{transform:translateY(0) rotate(calc(var(--dir)*6deg)) scale(1.02,.98);}50%{transform:translateY(-6px) rotate(calc(var(--dir)*10deg)) scale(.96,1.04);}}
@keyframes atkCharge{0%{transform:translate(0,0) rotate(0) scale(1);}20%{transform:translate(calc(var(--dir)*-12px),0) rotate(calc(var(--dir)*-8deg)) scale(.9,1.1);}50%{transform:translate(calc(var(--dir)*26px),-10px) rotate(calc(var(--dir)*14deg)) scale(1.25,.85);}100%{transform:translate(0,0) rotate(0) scale(1);}}

.unit[data-motion="pounce"] .unit-body{animation:idlePounce 1.8s ease-in-out infinite;}
.unit[data-motion="chomp"]  .unit-body{animation:idleChomp 1.6s ease-in-out infinite;}
.unit[data-motion="flap"]   .unit-body{animation:idleFlap 1.5s ease-in-out infinite;}
.unit[data-motion="stomp"]  .unit-body{animation:idleStomp 2.2s ease-in-out infinite;}
.unit[data-motion="float"]  .unit-body{animation:idleFloat 2.4s ease-in-out infinite;}
.unit[data-motion="march"]  .unit-body{animation:idleMarch 1.9s ease-in-out infinite;}
.unit[data-motion="crawl"]  .unit-body{animation:idleCrawl 1.7s ease-in-out infinite;}
.unit[data-motion="slither"] .unit-body{animation:idleSlither 2s ease-in-out infinite;}
.unit[data-motion="charge"] .unit-body{animation:idleCharge 1.6s ease-in-out infinite;}

.unit.moving[data-motion="pounce"] .unit-body{animation:walkPounce .42s ease-in-out infinite;}
.unit.moving[data-motion="chomp"]  .unit-body{animation:walkChomp .36s ease-in-out infinite;}
.unit.moving[data-motion="flap"]   .unit-body{animation:walkFlap .34s ease-in-out infinite;}
.unit.moving[data-motion="stomp"]  .unit-body{animation:walkStomp .58s ease-in-out infinite;}
.unit.moving[data-motion="float"]  .unit-body{animation:walkFloat .7s ease-in-out infinite;}
.unit.moving[data-motion="march"]  .unit-body{animation:walkMarch .44s ease-in-out infinite;}
.unit.moving[data-motion="crawl"]  .unit-body{animation:walkCrawl .52s ease-in-out infinite;}
.unit.moving[data-motion="slither"] .unit-body{animation:walkSlither .48s ease-in-out infinite;}
.unit.moving[data-motion="charge"] .unit-body{animation:walkCharge .32s ease-in-out infinite;}

.unit.attacking[data-motion="pounce"] .unit-body{animation:atkPounce .38s ease-out;}
.unit.attacking[data-motion="chomp"]  .unit-body{animation:atkChomp .38s ease-out;}
.unit.attacking[data-motion="flap"]   .unit-body{animation:atkFlap .4s ease-out;}
.unit.attacking[data-motion="stomp"]  .unit-body{animation:atkStomp .46s ease-out;}
.unit.attacking[data-motion="float"]  .unit-body{animation:atkFloat .42s ease-out;}
.unit.attacking[data-motion="march"]  .unit-body{animation:atkMarch .34s ease-out;}
.unit.attacking[data-motion="crawl"]  .unit-body{animation:atkCrawl .4s ease-out;}
.unit.attacking[data-motion="slither"] .unit-body{animation:atkSlither .4s ease-out;}
.unit.attacking[data-motion="charge"] .unit-body{animation:atkCharge .36s ease-out;}

@keyframes spawnPop{0%{transform:scale(.2) translateY(14px);opacity:0;}65%{transform:scale(1.18) translateY(-6px);opacity:1;}100%{transform:scale(1) translateY(0);opacity:1;}}
.unit.spawning .unit-body{animation:spawnPop .3s ease-out;}

.battle-projectile{position:absolute;z-index:40;pointer-events:none;will-change:left,top,transform;}
.battle-projectile.fly{transition:left .34s linear,top .34s ease-in-out,transform .34s linear;}

.fx-fire{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff 0%,#ffd166 24%,#ff6b00 62%,#c1121f 100%);box-shadow:0 0 12px #ff6b00,0 0 26px rgba(255,80,0,.7);}
.fx-lightning{width:16px;height:30px;background:linear-gradient(180deg,#fffde7,#ffd54f 45%,#ffb300);clip-path:polygon(52% 0%,80% 42%,58% 42%,76% 100%,24% 54%,46% 54%,28% 0%);filter:drop-shadow(0 0 8px #ffe066);}
.fx-holy{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#fff9c4 42%,#ffe082 68%,rgba(255,224,130,0) 100%);box-shadow:0 0 22px #fffde7;animation:fxPulse .5s ease-in-out infinite alternate;}
.fx-water{width:24px;height:28px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(circle at 34% 28%,#e1f5fe,#4fc3f7 55%,#0277bd);box-shadow:0 0 14px #4fc3f7;}
.fx-dark{width:28px;height:28px;border-radius:50%;background:conic-gradient(#6a1b9a,#b39ddb,#4a148c,#b39ddb,#6a1b9a);box-shadow:0 0 16px #9c27b0;animation:fxSpin .45s linear infinite;}
.fx-wave{width:30px;height:26px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(circle at 38% 28%,#e0f7fa,#29b6f6 55%,#01579b);box-shadow:0 0 18px #29b6f6;}

@keyframes fxSpin{to{transform:rotate(360deg);}}
@keyframes fxPulse{from{transform:scale(.85);}to{transform:scale(1.15);}}

.battle-hit{position:absolute;z-index:45;pointer-events:none;border-radius:50%;border:3px solid currentColor;animation:hitRing .45s ease-out forwards;}
@keyframes hitRing{0%{opacity:1;transform:translate(-50%,-50%) scale(.2);}60%{opacity:1;transform:translate(-50%,-50%) scale(1.1);}100%{opacity:0;transform:translate(-50%,-50%) scale(1.9);}}

.battle-shockwave{position:absolute;width:36px;height:20px;border:3px solid #ffe66d;border-radius:50%;z-index:35;pointer-events:none;animation:shockwave .38s ease-out forwards;}
@keyframes shockwave{from{opacity:1;transform:translate(-50%,-50%) scale(.4);}to{opacity:0;transform:translate(-50%,-50%) scale(2.6);}}

.skill-pop{position:absolute;transform:translateX(-50%);font-size:12px;font-weight:900;color:#fff;text-shadow:0 0 8px currentColor,0 1px 3px #000;pointer-events:none;z-index:60;white-space:nowrap;animation:skillPop .9s ease-out forwards;}
@keyframes skillPop{0%{opacity:0;transform:translate(-50%,10px) scale(.7);}25%{opacity:1;transform:translate(-50%,-4px) scale(1.1);}100%{opacity:0;transform:translate(-50%,-36px) scale(1);}}

#gacha-anim{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.94);z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:center;}
#gacha-icon{font-size:70px;display:flex;align-items:center;justify-content:center;min-height:110px;}
#ui-panel::-webkit-scrollbar{display:none;}

.nav-btn{width:110px;margin-top:8px;background:#334155;color:#fff;border:none;padding:8px;border-radius:6px;cursor:pointer;font-weight:bold;}
.tab-btn{background:#1e293b;color:#aaa;border:none;padding:6px 12px;border-radius:6px 6px 0 0;cursor:pointer;margin-right:4px;font-size:12px;}
.tab-btn.active{background:#0f3460;color:#fff;font-weight:bold;border-top:2px solid var(--p-color);}
#wars-leaderboard{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.88);}
.wars-leaderboard-card{width:min(480px,100%);max-height:80vh;overflow-y:auto;padding:18px;border:1px solid var(--p-color);border-radius:12px;background:#111425;}
.wars-leaderboard-row{display:flex;justify-content:space-between;gap:12px;padding:9px 4px;border-bottom:1px solid #26334a;}
</style>
</head>
<body>
<link rel="stylesheet" href="menu.css">
<div id="nav_bar"></div>
<script src="menu.js"></script>

<div id="gacha-anim">
  <div id="gacha-icon"></div>
  <div id="gacha-result-text" style="font-size:18px;color:#fff;margin-top:15px;text-align:center;padding:0 20px;white-space:pre-line;"></div>
</div>

<div id="main-screen" class="screen active">
  <div class="title">雨神大戰爭 | Raingod</div>
  <button class="nav-btn" style="margin:0 0 8px;" id="wars-leaderboard-button" onclick="openWarsLeaderboard()">🏆 登入後查看排行榜</button>
  <div class="top-res">
    <span>💎 XP: <b id="res-xp">0</b></span>
    <span>📖 解鎖: <b id="res-count">0/500</b></span>
    <span>🚩 遠征: <b id="res-stage">0/100</b></span>
  </div>
  <div class="grid">
    <div class="card" onclick="showScreen('map-screen')"><div style="font-size:28px">🗺️</div><b>世界遠征</b></div>
    <div class="card" onclick="showScreen('deck-screen');renderDeck();"><div style="font-size:28px">⚔️</div><b>隊伍編隊</b></div>
    <div class="card" onclick="showScreen('upgrade-screen');renderUpgrade();"><div style="font-size:28px">⛩️</div><b>神靈進化</b></div>
    <div class="card" onclick="showScreen('gacha-screen')"><div style="font-size:28px">🔮</div><b>祈願祭壇</b></div>
    <div class="card" onclick="showScreen('book-screen');renderBook('gods');"><div style="font-size:28px">📖</div><b>萬神百科</b></div>
  </div>
</div>

<div id="gacha-screen" class="screen">
  <div class="title">神聖祈願祭壇</div>
  <div style="color:#aaa;font-size:12px;margin-bottom:10px;">概率包含 EX, UR, UBER, SSR, SR, R 等 500 位強大神靈形態！</div>
  <div style="font-size:65px;margin:15px;">🔮</div>
  <button class="card" style="width:220px;background:var(--gold);color:#000;font-weight:bold;font-size:15px;padding:12px;" onclick="drawGacha()">祈願召喚 (3000 XP)</button>
  <button class="nav-btn" onclick="showScreen('main-screen')">返回主選單</button>
</div>

<div id="deck-screen" class="screen">

<script src="raingod-art.js"></script>

<script>
/* ============================================================
   從美術檔取出所需的資料與函式
   ============================================================ */
const ART = window.RainGodArt;
if (!ART) {
  document.body.innerHTML = '<h2 style="color:#f66;text-align:center;padding:40px;">找不到 raingod-art.js，請確認檔案在同一目錄。</h2>';
  throw new Error('RainGodArt missing');
}
const {
  CHARS, ENEMIES, THEME_ART, ENEMY_ART,
  buildCharSVG, FX_DEF, makeProjectile, getAttackType,
  RARITY_CD
} = ART;

/* ============================================================
   常數 / 存檔
   ============================================================ */
const SAVE_KEY = 'RainGod100_Save_v2';
const SAVE_KEY_GENERIC = 'raingod_save_raingod-wars';
const GAME_ID = 'raingod-wars';
const WARS_LEADERBOARD_URL = 'https://game-24b43-default-rtdb.firebaseio.com/raingod_wars_leaderboard';

const CHAPTERS = [
  { id:1,  name:"序章：雨神降臨",   startIdx:0,  endIdx:9  },
  { id:2,  name:"第一章：元素風暴", startIdx:10, endIdx:19 },
  { id:3,  name:"第二章：深淵魔域", startIdx:20, endIdx:29 },
  { id:4,  name:"第三章：虛空星穹", startIdx:30, endIdx:39 },
  { id:5,  name:"第四章：聖光審判", startIdx:40, endIdx:49 },
  { id:6,  name:"第五章：不死冥界", startIdx:50, endIdx:59 },
  { id:7,  name:"第六章：機械革命", startIdx:60, endIdx:69 },
  { id:8,  name:"第七章：混沌荒原", startIdx:70, endIdx:79 },
  { id:9,  name:"第八章：神域禁地", startIdx:80, endIdx:89 },
  { id:10, name:"終章：諸神黃昏",   startIdx:90, endIdx:99 }
];

const STAGES = Array.from({length:100}, (_, i) => {
  const chapterIdx = Math.floor(i / 10);
  const chapterName = CHAPTERS[chapterIdx].name;
  const stageInChapter = (i % 10) + 1;
  const poolStart = Math.max(1, Math.min(115, Math.floor(i * 1.2) + 1));
  return {
    name: `${chapterName} - 第 ${stageInChapter} 關`,
    chapterId: chapterIdx + 1,
    eHP: Math.floor(2000 * Math.pow(1.25, i)),
    ePool: [`enemy_${poolStart}`, `enemy_${Math.min(120, poolStart+1)}`, `enemy_${Math.min(120, poolStart+3)}`],
    diff: i + 1,
    reward: 500 * (i + 1)
  };
});

let currentChapterTab = 1;

let user = {
  xp: 1000,
  owned: ['god_1','god_2','god_3','god_4','god_5'],
  deck:  ['god_1','god_2','god_3','god_4','god_5'],
  encounteredEnemies: ['enemy_1','enemy_2'],
  lvs: {},
  cleared: 0
};
Object.keys(CHARS).forEach(k => user.lvs[k] = 1);

function save(){
  const payload = JSON.stringify(user);
  localStorage.setItem(SAVE_KEY, payload);
  try { localStorage.setItem(SAVE_KEY_GENERIC, payload); } catch(e){}
  try {
    if (typeof window.raingodSave === 'function') window.raingodSave(GAME_ID, user).catch(()=>{});
  } catch(e){}
  document.getElementById('res-xp').innerText = Math.floor(user.xp);
  document.getElementById('res-count').innerText = `${user.owned.length}/${Object.keys(CHARS).length}`;
  document.getElementById('res-stage').innerText = `${user.cleared}/${STAGES.length}`;
  document.getElementById('book-god-total').innerText = Object.keys(CHARS).length;
  document.getElementById('book-enemy-total').innerText = Object.keys(ENEMIES).length;
}

function loadGame(savedData){
  const data = savedData === undefined
    ? (localStorage.getItem(SAVE_KEY_GENERIC) || localStorage.getItem(SAVE_KEY))
    : savedData;
  if (data){
    try {
      const d = typeof data === 'string' ? JSON.parse(data) : data;
      if (!d || typeof d !== 'object' || Array.isArray(d)) throw new Error('存檔格式無效');
      user = { ...user, ...d };
      user.lvs = { ...user.lvs, ...(d.lvs || {}) };
    } catch(error){
      console.error('載入雨神大戰爭存檔失敗：', error);
    }
  }
  save();
}

/* ============================================================
   排行榜
   ============================================================ */
async function openWarsLeaderboard(){
  if (!await window.raingodRequireAuth('排行榜')) return;
  document.getElementById('wars-leaderboard').style.display = 'flex';
  await refreshWarsLeaderboard();
}
function closeWarsLeaderboard(){
  document.getElementById('wars-leaderboard').style.display = 'none';
}

async function refreshWarsLeaderboard(){
  const status = document.getElementById('wars-leaderboard-status');
  const list = document.getElementById('wars-leaderboard-list');
  if (!await window.raingodRequireAuth('排行榜')) return;
  const uid = window.raingodCurrentUser.uid;
  status.textContent = '排行榜載入中…';
  try {
    const response = await fetch(`${WARS_LEADERBOARD_URL}.json`);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    if (window.raingodCurrentUser?.uid !== uid) return;
    const rows = await response.json() || {};
    const entries = Object.entries(rows)
      .filter(([, row]) => row && Number.isFinite(Number(row.cleared)))
      .sort((a,b) => Number(b[1].cleared) - Number(a[1].cleared) || Number(b[1].xp||0) - Number(a[1].xp||0))
      .slice(0, 50);
    list.replaceChildren();
    entries.forEach(([entryUid, row], index) => {
      const item = document.createElement('div');
      item.className = 'wars-leaderboard-row';
      const name = document.createElement('span');
      name.textContent = `${index+1}. ${row.name || '玩家'}${entryUid === uid ? '（你）' : ''}`;
      const value = document.createElement('strong');
      value.textContent = `${Number(row.cleared)} 關 · ${Math.floor(Number(row.xp)||0).toLocaleString()} XP`;
      item.append(name, value);
      list.appendChild(item);
    });
    status.textContent = entries.length ? `已載入 ${entries.length} 位玩家，依通關遠征數排序。` : '目前還沒有排行榜資料。';
  } catch(error){
    console.error('載入雨神大戰爭排行榜失敗：', error);
    status.textContent = '排行榜載入失敗，請稍後重試。';
  }
}

async function uploadWarsLeaderboardScore(){
  const currentUser = window.raingodCurrentUser;
  if (!currentUser || user.cleared <= 0) return;
  const uid = currentUser.uid;
  const entryUrl = `${WARS_LEADERBOARD_URL}/${encodeURIComponent(uid)}.json`;
  try {
    const previousResponse = await fetch(entryUrl);
    if (!previousResponse.ok) throw new Error(`HTTP ${previousResponse.status}`);
    const previous = await previousResponse.json();
    if (window.raingodCurrentUser?.uid !== uid) return;
    if (previous && (Number(previous.cleared) > user.cleared ||
       (Number(previous.cleared) === user.cleared && Number(previous.xp) >= user.xp))) return;
    await fetch(entryUrl, {
      method: 'PUT',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({
        name: currentUser.email ? currentUser.email.split('@')[0] : '雨神玩家',
        cleared: Math.floor(user.cleared),
        xp: Math.floor(user.xp),
        updatedAt: Date.now()
      })
    });
  } catch(error){
    console.error('上傳雨神大戰爭排行榜失敗：', error);
  }
}

async function initializeWars(){
  if (typeof window.raingodInitGame === 'function'){
    const accountData = await window.raingodInitGame(GAME_ID, null, () => {});
    if (accountData && typeof accountData === 'object') loadGame(accountData);
  }
  await window.raingodFirebaseReady;
  await window.raingodAuthReady;
  await window.raingodBindStorage(GAME_ID, [SAVE_KEY_GENERIC], { [SAVE_KEY_GENERIC]: null }, data => {
    if (data && data[SAVE_KEY_GENERIC]) loadGame(data[SAVE_KEY_GENERIC]);
    if (window.raingodCurrentUser) uploadWarsLeaderboardScore();
  });
  window.raingodOnAuthStateChanged(currentUser => {
    const button = document.getElementById('wars-leaderboard-button');
    if (button) button.textContent = currentUser ? '🏆 排行榜' : '🏆 登入後查看排行榜';
    if (currentUser) uploadWarsLeaderboardScore();
    else {
      closeWarsLeaderboard();
      const list = document.getElementById('wars-leaderboard-list');
      const status = document.getElementById('wars-leaderboard-status');
      if (list) list.replaceChildren();
      if (status) status.textContent = '請登入帳號後查看。';
    }
  });
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'map-screen') renderMap();
}

function getFormIdx(lv){ return lv >= 10 ? 2 : (lv >= 5 ? 1 : 0); }

function renderDeck(){
  const list = document.getElementById('deck-list');
  list.innerHTML = '';
  user.owned.forEach(id => {
    const c = CHARS[id];
    const inDeck = user.deck.includes(id);
    const lv = user.lvs[id] || 1;
    const fIdx = getFormIdx(lv);
    const art = THEME_ART[c.themeIdx];
    const item = document.createElement('div');
    item.className = `card rarity-${c.rarity} ${inDeck ? 'selected' : ''}`;
    item.innerHTML = `
      <div class="card-art">${buildCharSVG(art, fIdx, 40, 'player')}</div>
      <b>${c.formNames[fIdx]}</b><br>
      <span class="tag tag-${c.targetAttr}">對${c.targetAttr}強效</span><br>
      <small style="color:#8ecdf7;font-size:9px;">【${c.skill}】</small><br>
      <small style="color:#f9d77e;font-size:9px;">CD ${c.cd}s</small><br>
      <small style="color:${inDeck?'#2ecc71':'#aaa'}">${inDeck?'[出戰中]':'[未裝備]'}</small>`;
    item.onclick = () => toggleDeck(id);
    list.appendChild(item);
  });
}

function toggleDeck(id){
  if (user.deck.includes(id)){
    if (user.deck.length <= 1) return alert('隊伍至少要有 1 隻神靈！');
    user.deck = user.deck.filter(x => x !== id);
  } else {
    if (user.deck.length >= 10) return alert('出戰隊伍最多 10 隻！');
    user.deck.push(id);
  }
  renderDeck();
  save();
}

function renderUpgrade(){
  const list = document.getElementById('upgrade-list');
  list.innerHTML = '';
  user.owned.forEach(id => {
    const c = CHARS[id];
    const lv = user.lvs[id] || 1;
    const fIdx = getFormIdx(lv);
    const cost = lv * 150;
    const art = THEME_ART[c.themeIdx];
    const item = document.createElement('div');
    item.className = `card rarity-${c.rarity}`;
    item.innerHTML = `
      <div class="card-art">${buildCharSVG(art, fIdx, 40, 'player')}</div>
      <b>${c.formNames[fIdx]}</b><br>
      <small style="color:#8ecdf7;font-size:9px;">【${c.skill}】</small><br>
      <small style="color:var(--gold);">Lv.${lv}</small><br>
      <button onclick="event.stopPropagation();upLevel('${id}')" style="font-size:10px;margin-top:4px;background:var(--gold);border:none;border-radius:4px;padding:3px 8px;font-weight:bold;cursor:pointer;">升級(${cost}XP)</button>`;
    list.appendChild(item);
  });
}

function upLevel(id){
  const cost = (user.lvs[id] || 1) * 150;
  if (user.xp >= cost){
    user.xp -= cost;
    user.lvs[id] = (user.lvs[id] || 1) + 1;
    renderUpgrade();
    save();
  } else alert('XP 不足！');
}

function renderBook(type){
  document.getElementById('tab-gods').classList.toggle('active', type === 'gods');
  document.getElementById('tab-enemies').classList.toggle('active', type === 'enemies');

  document.getElementById('book-god-count').innerText = user.owned.length;

  list.innerHTML = '';

  if (type === 'gods'){
    Object.keys(CHARS).forEach(id => {

      const fIdx = getFormIdx(lv);
      const art = THEME_ART[c.themeIdx];

      item.className = `card ${has ? 'rarity-' + c.rarity : 'locked'}`;
      item.innerHTML = `
        <div class="card-art">${has ? buildCharSVG(art, fIdx, 40, 'player') : '<div style="font-size:30px;opacity:.4">❓</div>'}</div>
        <b>${has ? c.formNames[fIdx] : '???'}</b><br>
        ${has ? `<span class="tag tag-${c.targetAttr}">克制:${c.targetAttr}</span><br>
                 <small style="color:#8ecdf7;font-size:9px;">【${c.skill}】</small><br>

        ${has ? `<span class="tag tag-${e.attr}">${e.attr}屬性</span><br><small>HP:${e.hp} ATK:${e.atk}</small>` : '<small>未遭遇</small>'}`;

function renderMap(){
  const mapScreen = document.getElementById('map-screen');
  let navBar = document.getElementById('chapter-nav-bar');

  if (!navBar){
    navBar = document.createElement('div');
    navBar.id = 'chapter-nav-bar';
    navBar.style.cssText = 'display:flex;gap:8px;width:100%;min-width:0;overflow-x:auto;padding:10px 0;margin-bottom:10px;';
    const list = document.getElementById('map-list');
    mapScreen.insertBefore(navBar, list);
  }

  navBar.innerHTML = '';
  CHAPTERS.forEach(ch => {
    const btn = document.createElement('button');
    btn.style.cssText = `padding:6px 12px;font-weight:bold;border-radius:6px;border:1px solid var(--p-color);cursor:pointer;white-space:nowrap;background:${currentChapterTab===ch.id?'var(--p-color)':'transparent'};color:${currentChapterTab===ch.id?'#fff':'var(--p-color)'};`;
    btn.innerText = ch.name;
    btn.onclick = () => { currentChapterTab = ch.id; renderMap(); };
    navBar.appendChild(btn);
  });

  const list = document.getElementById('map-list');
  list.innerHTML = '';
  const chInfo = CHAPTERS.find(c => c.id === currentChapterTab);

  for (let idx = chInfo.startIdx; idx <= chInfo.endIdx; idx++){
    const s = STAGES[idx];
    const locked = idx > user.cleared;
    const item = document.createElement('div');
    item.className = `card ${locked ? 'locked' : ''}`;
    item.innerHTML = `
      <b style="color:var(--p-color);font-size:11px;">${s.name}</b><br>
      <small>主堡HP:${Math.floor(s.eHP).toLocaleString()}</small><br>
      <small style="color:var(--gold);">通關 +${s.reward}XP</small>`;
    if (!locked) item.onclick = () => startBattle(idx);
    list.appendChild(item);
  }
}

function drawGacha(){
  if (user.xp < 3000) return alert('XP 不足！(需要 3000 XP)');
  user.xp -= 3000;
  save();

  const anim = document.getElementById('gacha-anim');
  const icon = document.getElementById('gacha-icon');
  const txt = document.getElementById('gacha-result-text');

  anim.style.display = 'flex';
  icon.innerHTML = '<div style="font-size:70px;">🔮</div>';
  txt.innerText = '祈願召喚中...';

  setTimeout(() => {
    const keys = Object.keys(CHARS);
    const res = keys[Math.floor(Math.random() * keys.length)];
    const isNew = !user.owned.includes(res);

    if (isNew){
      user.owned.push(res);
      if (user.deck.length < 10) user.deck.push(res);
    } else {
      user.xp += 150;
    }

    const c = CHARS[res];
    const art = THEME_ART[c.themeIdx];
    icon.innerHTML = buildCharSVG(art, 0, 100, 'player');
    txt.innerText = isNew
      ? `🎉 獲得新神靈！\n${c.name} (${c.rarity})\n技能：【${c.skill}】CD ${c.cd}s\n屬性克制: [${c.targetAttr}]`
      : `重複獲得 ${c.name}！\n自動轉化為 150 XP`;

    setTimeout(() => { anim.style.display = 'none'; save(); }, 1800);
  }, 800);
}

/* ============================================================
   戰鬥引擎
   ============================================================ */
let battle = {
  active:false, units:[], money:0, maxMoney:500, walletLv:1,
  pHP:2000, pMaxHP:2000, eHP:0, eMaxHP:0,
  currentStage:null, width:0, usable:200, speedBase:60, rangeK:1,
  cooldowns:{}, cannonCharge:0, lastTs:0, stageEl:null
};

const TRAVERSE_TIME = 6.5;
const BASE_MARGIN = 85;

function computeBattleMetrics(){
  const stageEl = document.getElementById('stage');
  const w = stageEl.clientWidth;
  const usable = Math.max(140, w - BASE_MARGIN * 2);
  battle.width = w;
  battle.usable = usable;
  battle.speedBase = Math.min(190, Math.max(38, usable / TRAVERSE_TIME));
  battle.rangeK = Math.min(1.15, Math.max(0.42, usable / 900));
  battle.stageEl = stageEl;
}

function unitPixelSize(sizeK, formIdx, screenK){
  return 44 * sizeK * (1 + formIdx * 0.07) * screenK;
}

function screenK(){
  const w = document.getElementById('stage').clientWidth || 400;
  return Math.min(1.30, Math.max(0.62, w / 780));
}

function startBattle(idx){
  showScreen('game-screen');
  const s = STAGES[idx];
  computeBattleMetrics();

  battle.active = true;
  battle.units = [];
  battle.money = 100;
  battle.maxMoney = 500;
  battle.walletLv = 1;
  battle.pHP = 2000; battle.pMaxHP = 2000;
  battle.eHP = s.eHP; battle.eMaxHP = s.eHP;
  battle.currentStage = idx;
  battle.cooldowns = {};
  battle.cannonCharge = 0;
  battle.lastTs = 0;

  renderBattleUI();
  requestAnimationFrame(battleLoop);
}

function renderBattleUI(){
  const panel = document.getElementById('ui-panel');
  panel.innerHTML = '';

  const walletBtn = document.createElement('button');
  walletBtn.className = 'spawn-btn';
  walletBtn.id = 'wallet-btn';
  walletBtn.onclick = upgradeWallet;
  panel.appendChild(walletBtn);

  const cannonBtn = document.createElement('button');
  cannonBtn.className = 'spawn-btn';
  cannonBtn.id = 'cannon-btn';
  cannonBtn.innerHTML = `<span style="font-size:22px;">⚡</span><small>雨神砲</small>`;
  cannonBtn.onclick = fireCannon;
  panel.appendChild(cannonBtn);

  user.deck.forEach(id => {
    const c = CHARS[id];
    const lv = user.lvs[id] || 1;
    const fIdx = getFormIdx(lv);
    const art = THEME_ART[c.themeIdx];
    const btn = document.createElement('button');
    btn.className = 'spawn-btn';
    btn.id = `btn-${id}`;
    btn.innerHTML = `
      ${buildCharSVG(art, fIdx, 34, 'player')}
      <span class="tag tag-${c.targetAttr}" style="font-size:8px;">${c.targetAttr}</span>
      <b>$${c.cost}</b>`;
    btn.onclick = () => spawn(id, 'player');
    panel.appendChild(btn);
  });
}

function upgradeWallet(){
  const cost = battle.walletLv * 120;
  if (battle.money >= cost && battle.walletLv < 8){
    battle.money -= cost;
    battle.walletLv++;
    battle.maxMoney += 300;
  }
}

function fireCannon(){
  if (battle.cannonCharge >= 100){
    battle.cannonCharge = 0;
    battle.units.forEach(u => { if (u.side === 'enemy') u.hp -= 500; });
    battle.eHP -= 800;
    const stageEl = battle.stageEl;
    for (let i = 0; i < 5; i++){
      setTimeout(() => {
        const burst = document.createElement('div');
        burst.className = 'battle-hit';
        burst.style.color = '#00d4ff';
        burst.style.width = burst.style.height = '60px';
        burst.style.left = (Math.random() * battle.width) + 'px';
        burst.style.top = (stageEl.clientHeight - 80 - Math.random() * 90) + 'px';
        stageEl.appendChild(burst);
        setTimeout(() => burst.remove(), 460);
      }, i * 70);
    }
  }
}

function showSkillName(unit){
  const now = performance.now();
  if (now - (unit._lastSkill || 0) < 2600) return;
  unit._lastSkill = now;
  const stageEl = battle.stageEl;
  const el = document.createElement('div');
  el.className = 'skill-pop';
  el.textContent = unit.skill;
  el.style.color = unit.skillColor || '#9ad7ff';
  el.style.left = unit.x + 'px';
  el.style.top = (stageEl.clientHeight - 50 - (unit.laneY || 0) - 58) + 'px';
  stageEl.appendChild(el);
  setTimeout(() => el.remove(), 920);
}

function playUnitAttack(unit, target){
  const stageEl = battle.stageEl;
  const h = stageEl.clientHeight;

  unit.el.classList.remove('attacking');
  void unit.el.offsetWidth;
  unit.el.classList.add('attacking');
  clearTimeout(unit._atkTimer);
  unit._atkTimer = setTimeout(() => { if (unit.el) unit.el.classList.remove('attacking'); }, 440);

  if (unit.side === 'player') showSkillName(unit);

  const fromX = unit.x + (unit.side === 'player' ? unit.size * 0.28 : -unit.size * 0.28);
  const fromY = h - 50 - (unit.laneY || 0) - unit.size * 0.45;

  if (unit.attackType === 'melee'){
    const hitX = target ? target.x : fromX + (unit.side === 'player' ? 30 : -30);
    const hitY = h - 50 - (target ? (target.laneY || 0) : (unit.laneY || 0)) - 10;
    const wave = document.createElement('div');
    wave.className = 'battle-shockwave';
    wave.style.left = hitX + 'px';
    wave.style.top = hitY + 'px';
    stageEl.appendChild(wave);
    setTimeout(() => wave.remove(), 460);
    return;
  }

  const proj = makeProjectile(unit.attackType);
  proj.style.left = fromX + 'px';
  proj.style.top = fromY + 'px';
  stageEl.appendChild(proj);

  const hitX = target ? target.x : (unit.side === 'player' ? battle.width - 70 : 70);
  const hitY = target
    ? h - 50 - (target.laneY || 0) - target.size * 0.45
    : fromY;

  requestAnimationFrame(() => {
    proj.classList.add('fly');
    proj.style.left = hitX + 'px';
    proj.style.top = hitY + 'px';
    if (unit.attackType === 'lightning') proj.style.transform = 'translate(-50%,-50%) scale(1.6) rotate(18deg)';
  });

  setTimeout(() => {
    proj.remove();
    const hit = document.createElement('div');
    hit.className = 'battle-hit';
    hit.style.width = hit.style.height = '34px';
    hit.style.color = { fire:'#ff7a3d', lightning:'#ffe066', holy:'#fff9c4',
                        water:'#4fc3f7', dark:'#b39ddb', wave:'#55c8ff' }[unit.attackType] || '#fff';
    hit.style.left = hitX + 'px';
    hit.style.top = hitY + 'px';
    stageEl.appendChild(hit);
    setTimeout(() => hit.remove(), 470);
  }, 340);
}

function createUnitEntity(cfg){
  const stageEl = battle.stageEl;
  const sk = screenK();
  const size = unitPixelSize(cfg.sizeK, cfg.formIdx, sk);

  const el = document.createElement('div');
  el.className = 'unit spawning';
  el.dataset.motion = cfg.motion || 'march';
  el.dataset.side = cfg.side;
  if (cfg.attr) el.dataset.attr = cfg.attr;
  el.style.left = cfg.x + 'px';
  el.style.width = size + 'px';
  el.style.setProperty('--lane-y', (cfg.laneY || 0) + 'px');
  el.innerHTML = `<div class="hp-bar"><div class="hp-inner"></div></div>
                  <div class="unit-body">${cfg.svg}</div>`;
  stageEl.appendChild(el);
  setTimeout(() => el.classList.remove('spawning'), 320);

  battle.units.push({
    ...cfg, el, size,
    atkTimer: 0,
    hp: cfg.hp, max: cfg.hp
  });
}

function spawn(id, side){
  if (side === 'player'){
    const c = CHARS[id];
    if (battle.money < c.cost || (battle.cooldowns[id] || 0) > 0) return;
    battle.money -= c.cost;
    battle.cooldowns[id] = c.cd;

    const lv = user.lvs[id] || 1;
    const fIdx = getFormIdx(lv);
    const mult = 1 + (lv - 1) * 0.15;
    const art = THEME_ART[c.themeIdx];
    const allies = battle.units.filter(u => u.side === 'player');

    createUnitEntity({
      side:'player',
      svg: buildCharSVG(art, fIdx, 44 * c.sizeK, 'player'),
      sizeK: c.sizeK, formIdx: fIdx,
      motion: c.motion,
      attr: c.targetAttr,
      skill: c.skill,
      skillColor: '#8ef0ff',
      targetAttr: c.targetAttr,
      isArea: c.isArea,
      x: BASE_MARGIN + (allies.length % 5) * 16 + Math.random() * 6,
      laneY: Math.random() * 12 - 6,
      attackType: getAttackType(c.targetAttr, c.isArea),
      hp: c.hp * mult,
      atk: c.atk * mult,
      spd: c.spd,
      range: c.range
    });
  } else {
    const stg = STAGES[battle.currentStage];
    const enemyId = stg.ePool[Math.floor(Math.random() * stg.ePool.length)];
    const e = ENEMIES[enemyId];
    const art = ENEMY_ART[e.artIdx];

    if (!user.encounteredEnemies.includes(enemyId)){
      user.encounteredEnemies.push(enemyId);
      save();
    }

    const enemies = battle.units.filter(u => u.side === 'enemy');

    createUnitEntity({
      side:'enemy',
      svg: buildCharSVG(art, 0, 44 * e.sizeK, 'enemy'),
      sizeK: e.sizeK, formIdx: 0,
      motion: e.motion,
      attr: e.attr,
      skill: '',
      x: battle.width - BASE_MARGIN - (enemies.length % 5) * 16 - Math.random() * 6,
      laneY: Math.random() * 12 - 6,
      attackType: getAttackType(e.attr, false),
      hp: e.hp, atk: e.atk,
      spd: e.spd,
      range: e.range,
      reward: e.reward
    });
  }
}

function battleLoop(ts){
  if (!battle.active) return;

  if (!battle.lastTs) battle.lastTs = ts;
  let dt = (ts - battle.lastTs) / 1000;
  battle.lastTs = ts;
  if (!isFinite(dt) || dt <= 0) dt = 1/60;
  dt = Math.min(dt, 0.06);

  const w = battle.width;
  const h = battle.stageEl.clientHeight;

  battle.money = Math.min(battle.maxMoney, battle.money + (16 + battle.walletLv * 5.5) * dt);
  if (battle.cannonCharge < 100) battle.cannonCharge += 7.5 * dt;

  Object.keys(battle.cooldowns).forEach(k => {
    if (battle.cooldowns[k] > 0) battle.cooldowns[k] = Math.max(0, battle.cooldowns[k] - dt);
  });

  const spawnRate = Math.min(1.9, 0.55 + battle.currentStage * 0.006);
  if (Math.random() < spawnRate * dt * 1.15) spawn(null, 'enemy');

  battle.units.forEach(u => {
    const isP = u.side === 'player';

    const targets = battle.units.filter(en =>
      en.side !== u.side &&
      (isP ? (en.x - u.x <= u.range && en.x >= u.x - 8)
           : (u.x - en.x <= u.range && u.x >= en.x - 8))
    );

    const baseDist = isP ? (w - BASE_MARGIN - u.x) : (u.x - BASE_MARGIN);
    const inRangeOfBase = baseDist <= u.range;

    if (targets.length > 0 || inRangeOfBase){
      u.el.classList.remove('moving');
      u.atkTimer += dt;

      if (u.atkTimer >= 0.52){
        u.atkTimer = 0;

        if (targets.length > 0){
          const hitTargets = u.isArea ? targets : [targets[0]];
          playUnitAttack(u, hitTargets[0]);
          hitTargets.forEach(target => {
            let dmg = u.atk;
            if (isP && u.targetAttr === target.attr) dmg *= 1.8;
            if (!isP && u.attr && target.targetAttr === u.attr) dmg *= 1.2;
            target.hp -= dmg;
          });
        } else {
          playUnitAttack(u, null);
          if (isP) battle.eHP -= u.atk;
          else battle.pHP -= u.atk;
        }
      }
    } else {
      u.el.classList.add('moving');
      const step = battle.speedBase * (0.72 + u.spd * 0.36) * dt;
      u.x += isP ? step : -step;
      u.el.style.left = u.x + 'px';
    }

    const hpPct = Math.max(0, u.hp / u.max * 100);
    const bar = u.el.querySelector('.hp-inner');
    if (bar) bar.style.width = hpPct + '%';
  });

  battle.units = battle.units.filter(u => {
    if (u.hp <= 0){
      u.el.remove();
      if (u.side === 'enemy') battle.money = Math.min(battle.maxMoney, battle.money + (u.reward || 30));
      return false;
    }
    return true;
  });

  document.getElementById('battle-money').innerText = `$${Math.floor(battle.money)}`;
  document.getElementById('battle-max-money').innerText = `$${battle.maxMoney}`;
  document.getElementById('p-hp').innerText = `${Math.max(0, Math.floor(battle.pHP))}/${battle.pMaxHP}`;
  document.getElementById('e-hp').innerText = `${Math.max(0, Math.floor(battle.eHP))}/${Math.floor(battle.eMaxHP)}`;

  const wBtn = document.getElementById('wallet-btn');
  if (wBtn){
    wBtn.innerHTML = `<span style="font-size:22px;">💰</span><small>錢包Lv.${battle.walletLv}</small>`;
    wBtn.disabled = battle.walletLv >= 8 || battle.money < battle.walletLv * 120;
  }

  const cBtn = document.getElementById('cannon-btn');
  const cStatus = document.getElementById('cannon-status');
  if (cBtn && cStatus){
    cStatus.innerText = battle.cannonCharge >= 100 ? '可發射！' : `${Math.floor(battle.cannonCharge)}%`;
    cBtn.disabled = battle.cannonCharge < 100;
  }

  user.deck.forEach(id => {
    const btn = document.getElementById(`btn-${id}`);
    if (!btn) return;
    const cdLeft = Math.max(0, Math.ceil(battle.cooldowns[id] || 0));
    btn.disabled = (battle.money < CHARS[id].cost) || (cdLeft > 0);

    let cdMask = btn.querySelector('.cd-mask');
    if (cdLeft > 0){
      if (!cdMask){
        cdMask = document.createElement('div');
        cdMask.className = 'cd-mask';
        btn.appendChild(cdMask);
      }
      cdMask.innerText = cdLeft;
    } else if (cdMask) cdMask.remove();
  });

  if (battle.pHP <= 0 || battle.eHP <= 0){
    battle.active = false;
    document.querySelectorAll('.unit').forEach(u => u.remove());
    document.querySelectorAll('.battle-projectile,.battle-hit,.battle-shockwave,.skill-pop')
      .forEach(u => u.remove());

    if (battle.eHP <= 0){
      const reward = STAGES[battle.currentStage].reward;
      user.xp += reward;
      user.cleared = Math.max(user.cleared, battle.currentStage + 1);
      alert(`🚩 遠征勝利！獲得 ${reward} XP！`);
      uploadWarsLeaderboardScore();
    } else {
      alert('💥 主堡被摧毀，遠征失敗...');
    }
    save();
    showScreen('main-screen');
    return;
  }

  requestAnimationFrame(battleLoop);
}

/* ============================================================
   啟動
   ============================================================ */
initializeWars().catch(error => {
  console.error('雨神大戰爭初始化失敗：', error);
  const status = document.getElementById('wars-leaderboard-status');
  if (status) status.textContent = '遊戲初始化失敗，請重新整理頁面。';
});
</script>
