<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>雨神大戰爭 | Raingod</title>
    <style>
        :root { 
            --p-color: #00d4ff; --e-color: #ff4d4d; --gold: #f1c40f; 
            --rarity-r: #95a5a6; --rarity-sr: #3498db; --rarity-ssr: #9b59b6; 
            --rarity-uber: #e67e22; --rarity-ur: #e74c3c; --rarity-ex: #00f0ff;
            --attr-red: #ff4757; --attr-float: #70a1ff; --attr-angel: #eccc68;
            --attr-alien: #2ed573; --attr-undead: #a4b0be; --attr-none: #ced6e0;
        }
        * { box-sizing: border-box; touch-action: manipulation; -webkit-user-select: none; }
        
        body { 
            margin: 0; background: #0b0c10; color: white; 
            height: 100svh; width: 100vw; 
            overflow: hidden; font-family: 'PingFang TC', '微軟正黑體', sans-serif; 
        }

        .screen { 
            display: none; width: 100%; height: 100%; 
            flex-direction: column; align-items: center; 
            background: #111425; padding: 12px; 
        }
        .active { display: flex; }
        .title { font-size: clamp(20px, 5vw, 26px); font-weight: 900; color: var(--p-color); margin-bottom: 6px; text-shadow: 0 0 10px rgba(0,212,255,0.5); }
        
        .top-res { width: 100%; display: flex; justify-content: space-around; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 10px; margin-bottom: 8px; font-size: 13px; font-weight: bold; border: 1px solid #333; }
        
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; overflow-y: auto; flex-grow: 1; padding: 4px; }
        @media (min-width: 600px) { .grid { grid-template-columns: repeat(5, 1fr); } }

        .card { background: #1a233a; border: 2px solid #0f3460; border-radius: 10px; padding: 8px 4px; text-align: center; cursor: pointer; transition: 0.15s; position: relative; font-size: 11px; }
        .card:active { transform: scale(0.95); }
        .card.locked { opacity: 0.3; filter: grayscale(1); }
        .card.selected { border-color: #2ecc71 !important; box-shadow: 0 0 10px #2ecc71; }

        .rarity-R { border-color: var(--rarity-r); }
        .rarity-SR { border-color: var(--rarity-sr); }
        .rarity-SSR { border-color: var(--rarity-ssr); }
        .rarity-UBER { border-color: var(--rarity-uber); box-shadow: 0 0 6px var(--rarity-uber); }
        .rarity-UR { border-color: var(--rarity-ur); box-shadow: 0 0 8px var(--rarity-ur); }
        .rarity-EX { border-color: var(--rarity-ex); box-shadow: 0 0 12px var(--rarity-ex); }

        .tag { display: inline-block; padding: 1px 4px; border-radius: 3px; font-size: 9px; font-weight: bold; color: #000; margin-top: 2px; }
        .tag-紅 { background: var(--attr-red); color: white; }
        .tag-飛 { background: var(--attr-float); color: white; }
        .tag-聖 { background: var(--attr-angel); }
        .tag-星 { background: var(--attr-alien); }
        .tag-屍 { background: var(--attr-undead); color: white; }
        .tag-無 { background: var(--attr-none); }

        #game-screen { padding: 0; position: relative; }
        #stage { 
            position: relative; width: 100%; flex-grow: 1; 
            background: linear-gradient(to bottom, #09131d, #162a38, #1d3c4d); 
            overflow: hidden; 
        }
        .ground { position: absolute; bottom: 0; width: 100%; height: 50px; background: #111; border-top: 4px solid #333; }
        .base { position: absolute; bottom: 50px; width: 70px; height: 110px; border-radius: 8px 8px 0 0; z-index: 5; }
        #p-base { left: 0; background: #103156; border-right: 4px solid var(--p-color); }
        #e-base { right: 0; background: #4a0e17; border-left: 4px solid var(--e-color); }
        .base-hp { position: absolute; top: -22px; width: 130%; left: -15%; text-align: center; font-size: 11px; font-weight: bold; background: rgba(0,0,0,0.8); padding: 2px; border-radius: 4px; border: 1px solid #444; }

        #battle-top-bar {
            position: absolute; top: 8px; width: 95%; left: 2.5%; display: flex; justify-content: space-between; z-index: 100; font-weight: bold; font-size: 13px;
        }

        #ui-panel { 
            height: 125px; width: 100%; 
            background: #0b172a; display: flex; 
            gap: 6px; padding: 8px; overflow-x: auto;
            border-top: 2px solid #1e293b;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .spawn-btn { 
            min-width: 72px; height: 100%; 
            background: #162032; border: 1.5px solid #475569; 
            border-radius: 8px; color: white; 
            display: flex; flex-direction: column; align-items: center; justify-content: space-around;
            flex-shrink: 0; font-size: 10px; padding: 2px; position: relative;
        }
        .spawn-btn:disabled { opacity: 0.35; filter: grayscale(1); }
        .cd-mask { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; border-radius: 6px; }

        .unit { position: absolute; bottom: 50px; width: 45px; text-align: center; z-index: 10; pointer-events: none; transition: transform 0.1s; }
        .unit-body { font-size: 28px; line-height: 1; }
        .hp-bar { width: 100%; height: 4px; background: #000; margin-bottom: 2px; border-radius: 2px; overflow: hidden; border: 0.5px solid #555; }
        .hp-inner { height: 100%; background: #2ecc71; width: 100%; transition: width 0.1s; }
        
        #gacha-anim { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; font-size: 70px; }
        #ui-panel::-webkit-scrollbar { display: none; }
        
        .nav-btn { width: 110px; margin-top: 8px; background: #334155; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .tab-btn { background: #1e293b; color: #aaa; border: none; padding: 6px 12px; border-radius: 6px 6px 0 0; cursor: pointer; margin-right: 4px; font-size: 12px; }
        .tab-btn.active { background: #0f3460; color: white; font-weight: bold; border-top: 2px solid var(--p-color); }
        #wars-leaderboard { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(0,0,0,0.88); }
        .wars-leaderboard-card { width: min(480px, 100%); max-height: 80vh; overflow-y: auto; padding: 18px; border: 1px solid var(--p-color); border-radius: 12px; background: #111425; }
        .wars-leaderboard-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 4px; border-bottom: 1px solid #26334a; }
    </style>
</head>
<body>
    <link rel="stylesheet" href="menu.css">

<div id="nav_bar"></div>

<script src="menu.js"></script>
<div id="gacha-anim">
    <div id="gacha-icon">🔮</div>
    <div id="gacha-result-text" style="font-size:18px; color:#fff; margin-top:15px; text-align:center; padding:0 20px; white-space:pre-line;"></div>
</div>

<!-- 主選單 -->
<div id="main-screen" class="screen active">
    <div class="title">雨神大戰爭 | Raingod</div>
    <button class="nav-btn" style="margin:0 0 8px;" id="wars-leaderboard-button" onclick="openWarsLeaderboard()">🏆 登入後查看排行榜</button>
    <div class="top-res">
        <span>💎 XP: <b id="res-xp">0</b></span>
        <span>📖 解鎖: <b id="res-count">0/500</b></span>
        <span>🚩 遠征: <b id="res-stage">0/100</b></span>
    </div>
    <div class="grid">
        <div class="card" onclick="showScreen('map-screen')"><div style="font-size:28px">🗺️</div><b>世界遠征</b></div>
        <div class="card" onclick="showScreen('deck-screen'); renderDeck();"><div style="font-size:28px">⚔️</div><b>隊伍編隊</b></div>
        <div class="card" onclick="showScreen('upgrade-screen'); renderUpgrade();"><div style="font-size:28px">⛩️</div><b>神靈進化</b></div>
        <div class="card" onclick="showScreen('gacha-screen')"><div style="font-size:28px">🔮</div><b>祈願祭壇</b></div>
        <div class="card" onclick="showScreen('book-screen'); renderBook('gods');"><div style="font-size:28px">📖</div><b>萬神百科</b></div>
    </div>
</div>

<!-- 祭壇抽卡 -->
<div id="gacha-screen" class="screen">
    <div class="title">神聖祈願祭壇</div>
    <div style="color:#aaa; font-size:12px; margin-bottom:10px;">概率包含 EX, UR, UBER, SSR, SR, R 等 500 位強大神靈形態！</div>
    <div style="font-size: 65px; margin: 15px;">🔮</div>
    <button class="card" style="width: 220px; background: var(--gold); color: black; font-weight:bold; font-size:15px; padding:12px;" onclick="drawGacha()">祈願召喚 (3000 XP)</button>
    <button class="nav-btn" onclick="showScreen('main-screen')">返回主選單</button>
</div>

<!-- 隊伍編隊 -->
<div id="deck-screen" class="screen">
    <div class="title">隊伍編隊 (上限 10 隻)</div>
    <div style="font-size:11px; color:#00d4ff; margin-bottom:5px;">點擊選擇或取消裝備，搭配屬性剋制出戰</div>
    <div id="deck-list" class="grid"></div>
    <button class="nav-btn" onclick="showScreen('main-screen')">返回主選單</button>
</div>

<!-- 角色升級 -->
<div id="upgrade-screen" class="screen">
    <div class="title">神靈強化與型態突破</div>
    <div id="upgrade-list" class="grid"></div>
    <button class="nav-btn" onclick="showScreen('main-screen')">返回主選單</button>
</div>

<!-- 雙圖鑑系統 -->
<div id="book-screen" class="screen">
    <div style="display:flex; width:100%; justify-content:center; margin-bottom:6px;">
        <button id="tab-gods" class="tab-btn active" onclick="renderBook('gods')">神靈圖鑑 (<span id="book-god-count">0</span>/<span id="book-god-total">500</span>)</button>
        <button id="tab-enemies" class="tab-btn" onclick="renderBook('enemies')">怪獸敵圖鑑 (<span id="book-enemy-count">0</span>/<span id="book-enemy-total">120</span>)</button>
    </div>
    <div id="book-list" class="grid"></div>
    <button class="nav-btn" onclick="showScreen('main-screen')">返回主選單</button>
</div>

<!-- 地圖選擇 -->
<div id="map-screen" class="screen">
    <div class="title">世界遠征地圖</div>
    <div id="map-list" class="grid"></div>
    <button class="nav-btn" onclick="showScreen('main-screen')">返回主選單</button>
</div>

<!-- 戰鬥畫面 -->
<div id="game-screen" class="screen">
    <div id="stage">
        <div id="battle-top-bar">
            <span style="color:#00d4ff;">雨神砲: <b id="cannon-status">準備中</b></span>
            <span style="color:var(--gold);">金幣: <b id="battle-money">$0</b>/<b id="battle-max-money">$500</b></span>
        </div>
        <div class="ground"></div>
        <div id="p-base" class="base"><div class="base-hp" id="p-hp">1500/1500</div></div>
        <div id="e-base" class="base"><div class="base-hp" id="e-hp">1500/1500</div></div>
    </div>
    <div id="ui-panel"></div>
</div>

<div id="wars-leaderboard">
    <div class="wars-leaderboard-card">
        <h2 style="color:var(--p-color); margin-top:0;">🏆 雨神大戰爭排行榜</h2>
        <p id="wars-leaderboard-status" style="color:#aaa;">請登入帳號後查看。</p>
        <div id="wars-leaderboard-list"></div>
        <div style="display:flex; gap:8px; justify-content:center; margin-top:14px;">
            <button class="nav-btn" onclick="refreshWarsLeaderboard()">重新整理</button>
            <button class="nav-btn" onclick="closeWarsLeaderboard()">關閉</button>
        </div>
    </div>
</div>

<script>
    const SAVE_KEY = 'RainGod100_Save_v2';
    const WARS_LEADERBOARD_URL = 'https://game-24b43-default-rtdb.firebaseio.com/raingod_wars_leaderboard';
    
    // 屬性系統：紅(Red)、飛(Float)、聖(Angel)、星(Alien)、屍(Undead)、無(None)
    const ATTRS = ['紅', '飛', '聖', '星', '屍', '無'];

    // 擴充至 30 個手工設計主題名稱庫
    const THEMES = [
        { name: '雨神貓', icons: ['🐱', '😼', '🙀'], attr: '無' },
        { name: '水滴精靈', icons: ['💧', '💦', '🌊'], attr: '星' },
        { name: '雷霆幼獸', icons: ['⚡', '🌩️', '⛈️'], attr: '飛' },
        { name: '熾焰烈犬', icons: ['🐕', '🐩', '🐺'], attr: '紅' },
        { name: '聖光幼天使', icons: ['👼', '🧚', '👑'], attr: '聖' },
        { name: '虛空幼龍', icons: ['🐲', '🐉', '🦖'], attr: '星' },
        { name: '骷髏戰士', icons: ['💀', '☠️', '🧟'], attr: '屍' },
        { name: '機械企鵝', icons: ['🐧', '🤖', '🛸'], attr: '無' },
        { name: '石像鬼', icons: ['🗿', '👹', '👺'], attr: '飛' },
        { name: '深海巨章', icons: ['🐙', '🦑', '🦈'], attr: '紅' },
        { name: '雪域冰熊', icons: ['🐻', '🧊', '❄️'], attr: '無' },
        { name: '夢幻獨角獸', icons: ['🦄', '✨', '🌟'], attr: '聖' },
        { name: '暗影獵手', icons: ['🥷', '🗡️', '👤'], attr: '屍' },
        { name: '鳳凰幼雛', icons: ['🐤', '🐦', '🔥'], attr: '紅' },
        { name: '幻象狐仙', icons: ['🦊', '🔮', '🎭'], attr: '星' },
        { name: '泰坦巨人', icons: ['🗿', '⛰️', '🌋'], attr: '無' },
        { name: '暴風神鷹', icons: ['🦅', '🌪️', '⚡'], attr: '飛' },
        { name: '極光仙子', icons: ['🧚‍♀️', '❇️', '🌌'], attr: '聖' },
        { name: '冥界噬魂者', icons: ['👻', '🖤', '☠️'], attr: '屍' },
        { name: '機械巨魔', icons: ['🤖', '⚙️', '💥'], attr: '星' },
        { name: '熔岩怪獸', icons: ['🌋', '💥', '🔥'], attr: '紅' },
        { name: '海芒水母', icons: ['🪼', '✨', '🌊'], attr: '星' },
        { name: '狂暴野豬', icons: ['🐗', '💢', '💨'], attr: '無' },
        { name: '毒藤巨獸', icons: ['🪴', '🐍', '🌲'], attr: '飛' },
        { name: '天界守護神', icons: ['🛡️', '⚔️', '✨'], attr: '聖' },
        { name: '死靈術士', icons: ['🧙‍♂️', '📜', '💀'], attr: '屍' },
        { name: '賽博機器人', icons: ['🤖', '💻', '⚡'], attr: '星' },
        { name: '深淵巨鯨', icons: ['🐳', '🌊', '🌀'], attr: '紅' },
        { name: '風暴神龍', icons: ['🐲', '🌪️', '🌩️'], attr: '飛' },
        { name: '終極雨神尊', icons: ['🌧️', '👑', '⚡'], attr: '無' }
    ];

    const PREFIX_EVO1 = ['強化型', '進階·', '狂暴的', '覺醒·', '極致·', '真力·', '超能·', '霸者·', '滅世·', '天啟·'];
    const PREFIX_EVO2 = ['神超絕·', '超光速·', '萬劫天尊·', '宇宙主宰·', '終極降臨·', '創世神光·', '毀滅之眼·', '無上尊者·', '星穹之主·', '混沌原初·'];

    const RARITIES = ['R', 'SR', 'SSR', 'UBER', 'UR', 'EX'];

    const CHARS = {};
    const ENEMIES = {};

    // 生成 500 位神靈
    function generateGods() {
        for (let i = 1; i <= 500; i++) {
            const id = `god_${i}`;
            const theme = THEMES[(i - 1) % THEMES.length];
            const cycle = Math.floor((i - 1) / THEMES.length);
            
            const rIdx = i % 12 === 0 ? 5 : (i % 8 === 0 ? 4 : (i % 5 === 0 ? 3 : (i % 3 === 0 ? 2 : (i % 2 === 0 ? 1 : 0))));
            const rarity = RARITIES[rIdx];

            const nameBase = cycle === 0 ? theme.name : `${theme.name} ${i}代`;
            const form1 = nameBase;
            const form2 = `${PREFIX_EVO1[i % PREFIX_EVO1.length]}${nameBase}`;
            const form3 = `${PREFIX_EVO2[i % PREFIX_EVO2.length]}${nameBase}`;

            const isArea = rIdx >= 2 || i % 2 === 0;
            const targetAttr = theme.attr;

            const baseHp = 180 + (rIdx * 280) + (i * 12);
            const baseAtk = 35 + (rIdx * 75) + (i * 4);
            const cost = 60 + (rIdx * 150) + Math.floor(i * 2.5);

            CHARS[id] = {
                id,
                name: form1,
                rarity: rarity,
                forms: theme.icons,
                formNames: [form1, form2, form3],
                targetAttr: targetAttr,
                isArea: isArea,
                hp: Math.floor(baseHp),
                atk: Math.floor(baseAtk),
                cost: Math.min(3000, Math.floor(cost)),
                cd: Math.floor(18 + rIdx * 12),
                range: 50 + ((i * 7) % 150),
                spd: parseFloat((1.0 + (i % 4) * 0.3).toFixed(1))
            };
        }
    }

    // 生成 120 種怪獸敵人
    function generateEnemies() {
        const enemyTypes = [
            { name: '小紅惡魔', icon: '👺', attr: '紅' },
            { name: '幽靈水母', icon: '👻', attr: '飛' },
            { name: '邪教天使', icon: '👼', attr: '聖' },
            { name: '外星毒蛛', icon: '👾', attr: '星' },
            { name: '腐爛喪屍', icon: '🧟', attr: '屍' },
            { name: '無名野犬', icon: '🐕', attr: '無' },
            { name: '赤焰野豬', icon: '🐗', attr: '紅' },
            { name: '蝙蝠魔王', icon: '🦇', attr: '飛' },
            { name: '機械守衛', icon: '🤖', attr: '星' },
            { name: '骷髏戰將', icon: '💀', attr: '屍' },
            { name: '狂暴巨蜥', icon: '🦎', attr: '紅' },
            { name: '極地白狼', icon: '🐺', attr: '無' },
            { name: '虛空魔眼', icon: '👁️', attr: '星' },
            { name: '天界執刑者', icon: '⚔️', attr: '聖' },
            { name: '巫毒偶人', icon: '🎎', attr: '屍' },
            { name: '烈焰巨龍', icon: '🐲', attr: '紅' },
            { name: '雷霆夜鶯', icon: '🐦', attr: '飛' },
            { name: '星際異形', icon: '👽', attr: '星' },
            { name: '墮落大天使', icon: '🦇', attr: '聖' },
            { name: '不朽屍王', icon: '👑', attr: '屍' },
            { name: '深淵巨魔', icon: '👹', attr: '紅' },
            { name: '極光巨鳥', icon: '🦅', attr: '飛' },
            { name: '機械霸王龍', icon: '🦖', attr: '星' },
            { name: '亡靈騎士', icon: '🏇', attr: '屍' },
            { name: '聖殿巨神', icon: '🗿', attr: '聖' }
        ];

        for (let i = 1; i <= 120; i++) {
            const id = `enemy_${i}`;
            const base = enemyTypes[(i - 1) % enemyTypes.length];
            const mult = 1 + (i * 0.3);

            ENEMIES[id] = {
                id,
                name: `${base.name} Lv.${i}`,
                icon: base.icon,
                attr: base.attr,
                hp: Math.floor(220 * mult),
                atk: Math.floor(30 * mult),
                spd: parseFloat((0.8 + (i % 3) * 0.2).toFixed(1)),
                range: 45 + (i % 3) * 15,
                reward: 40 + i * 15
            };
        }
    }

    generateGods();
    generateEnemies();

    // 10 大篇章設計（共 100 個特色關卡）
    const CHAPTERS = [
        { id: 1, name: "序章：雨神降臨", startIdx: 0, endIdx: 9 },
        { id: 2, name: "第一章：元素風暴", startIdx: 10, endIdx: 19 },
        { id: 3, name: "第二章：深淵魔域", startIdx: 20, endIdx: 29 },
        { id: 4, name: "第三章：虛空星穹", startIdx: 30, endIdx: 39 },
        { id: 5, name: "第四章：聖光審判", startIdx: 40, endIdx: 49 },
        { id: 6, name: "第五章：不死冥界", startIdx: 50, endIdx: 59 },
        { id: 7, name: "第六章：機械革命", startIdx: 60, endIdx: 69 },
        { id: 8, name: "第七章：混沌荒原", startIdx: 70, endIdx: 79 },
        { id: 9, name: "第八章：神域禁地", startIdx: 80, endIdx: 89 },
        { id: 10, name: "終章：諸神黃昏", startIdx: 90, endIdx: 99 }
    ];

    const STAGES = Array.from({ length: 100 }, (_, i) => {
        const chapterIdx = Math.floor(i / 10);
        const chapterName = CHAPTERS[chapterIdx].name;
        const stageInChapter = (i % 10) + 1;
        
        const poolStart = Math.max(1, Math.min(115, Math.floor(i * 1.2) + 1));
        const ePool = [
            `enemy_${poolStart}`,
            `enemy_${Math.min(120, poolStart + 1)}`,
            `enemy_${Math.min(120, poolStart + 3)}`
        ];

        return {
            name: `${chapterName} - 第 ${stageInChapter} 關`,
            chapterId: chapterIdx + 1,
            eHP: Math.floor(2000 * Math.pow(1.25, i)),
            ePool: ePool,
            diff: i + 1,
            reward: 500 * (i + 1)
        };
    });

    let currentChapterTab = 1;

    let user = {
        xp: 1000,
        owned: ['god_1', 'god_2', 'god_3', 'god_4', 'god_5'],
        deck: ['god_1', 'god_2', 'god_3', 'god_4', 'god_5'],
        encounteredEnemies: ['enemy_1', 'enemy_2'],
        lvs: {},
        cleared: 0
    };

    Object.keys(CHARS).forEach(k => user.lvs[k] = 1);

    function save() {
        localStorage.setItem(SAVE_KEY, JSON.stringify(user));
        document.getElementById('res-xp').innerText = Math.floor(user.xp);
        document.getElementById('res-count').innerText = `${user.owned.length}/${Object.keys(CHARS).length}`;
        document.getElementById('res-stage').innerText = `${user.cleared}/${STAGES.length}`;
        document.getElementById('book-god-total').innerText = Object.keys(CHARS).length;
        document.getElementById('book-enemy-total').innerText = Object.keys(ENEMIES).length;
    }

    function loadGame(savedData) {
        const data = savedData === undefined ? localStorage.getItem(SAVE_KEY) : savedData;
        if (data) {
            try {
                const d = typeof data === 'string' ? JSON.parse(data) : data;
                if (!d || typeof d !== 'object' || Array.isArray(d)) throw new Error('存檔格式無效');
                user = { ...user, ...d };
                user.lvs = { ...user.lvs, ...(d.lvs || {}) };
            } catch (error) {
                console.error('載入雨神大戰爭存檔失敗：', error);
            }
        }
        save();
    }

    async function openWarsLeaderboard() {
        if (!await window.raingodRequireAuth('排行榜')) return;
        document.getElementById('wars-leaderboard').style.display = 'flex';
        await refreshWarsLeaderboard();
    }

    function closeWarsLeaderboard() {
        document.getElementById('wars-leaderboard').style.display = 'none';
    }

    async function refreshWarsLeaderboard() {
        const status = document.getElementById('wars-leaderboard-status');
        const list = document.getElementById('wars-leaderboard-list');
        if (!await window.raingodRequireAuth('排行榜')) return;
        const uid = window.raingodCurrentUser.uid;
        status.textContent = '排行榜載入中…';
        try {
            const response = await fetch(`${WARS_LEADERBOARD_URL}.json`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            if (window.raingodCurrentUser?.uid !== uid) return;
            const rows = await response.json() || {};
            const entries = Object.entries(rows)
                .filter(([, row]) => row && Number.isFinite(Number(row.cleared)))
                .sort((a, b) => Number(b[1].cleared) - Number(a[1].cleared) || Number(b[1].xp || 0) - Number(a[1].xp || 0))
                .slice(0, 50);
            list.replaceChildren();
            entries.forEach(([entryUid, row], index) => {
                const item = document.createElement('div');
                item.className = 'wars-leaderboard-row';
                const name = document.createElement('span');
                name.textContent = `${index + 1}. ${row.name || '玩家'}${entryUid === uid ? '（你）' : ''}`;
                const value = document.createElement('strong');
                value.textContent = `${Number(row.cleared)} 關 · ${Math.floor(Number(row.xp) || 0).toLocaleString()} XP`;
                item.append(name, value);
                list.appendChild(item);
            });
            status.textContent = entries.length ? `已載入 ${entries.length} 位玩家，依通關遠征數排序。` : '目前還沒有排行榜資料。';
        } catch (error) {
            console.error('載入雨神大戰爭排行榜失敗：', error);
            status.textContent = '排行榜載入失敗，請稍後重試。';
        }
    }

    async function uploadWarsLeaderboardScore() {
        const currentUser = window.raingodCurrentUser;
        if (!currentUser || user.cleared <= 0) return;
        const uid = currentUser.uid;
        const entryUrl = `${WARS_LEADERBOARD_URL}/${encodeURIComponent(uid)}.json`;
        try {
            const previousResponse = await fetch(entryUrl);
            if (!previousResponse.ok) throw new Error(`HTTP ${previousResponse.status}`);
            const previous = await previousResponse.json();
            if (window.raingodCurrentUser?.uid !== uid) return;
            if (previous && (Number(previous.cleared) > user.cleared ||
                (Number(previous.cleared) === user.cleared && Number(previous.xp) >= user.xp))) return;
            const response = await fetch(entryUrl, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: currentUser.email ? currentUser.email.split('@')[0] : '雨神玩家',
                    cleared: Math.floor(user.cleared),
                    xp: Math.floor(user.xp),
                    updatedAt: Date.now()
                })
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
        } catch (error) {
            console.error('上傳雨神大戰爭排行榜失敗：', error);
        }
    }

    async function initializeWars() {
        await window.raingodFirebaseReady;
        await window.raingodAuthReady;
        await window.raingodBindStorage('raingod-wars', [SAVE_KEY], { [SAVE_KEY]: null }, data => {
            loadGame(data[SAVE_KEY]);
            if (window.raingodCurrentUser) uploadWarsLeaderboardScore();
        });
        window.raingodOnAuthStateChanged(currentUser => {
            const button = document.getElementById('wars-leaderboard-button');
            if (button) button.textContent = currentUser ? '🏆 排行榜' : '🏆 登入後查看排行榜';
            if (currentUser) uploadWarsLeaderboardScore();
            else {
                closeWarsLeaderboard();
                const list = document.getElementById('wars-leaderboard-list');
                const status = document.getElementById('wars-leaderboard-status');
                if (list) list.replaceChildren();
                if (status) status.textContent = '請登入帳號後查看。';
            }
        });
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'map-screen') renderMap();
    }

    function getFormIdx(lv) { return lv >= 10 ? 2 : (lv >= 5 ? 1 : 0); }

    // --- 隊伍編隊 ---
    function renderDeck() {
        const list = document.getElementById('deck-list');
        list.innerHTML = '';
        user.owned.forEach(id => {
            const c = CHARS[id];
            const inDeck = user.deck.includes(id);
            const lv = user.lvs[id] || 1;
            const fIdx = getFormIdx(lv);
            const item = document.createElement('div');
            item.className = `card rarity-${c.rarity} ${inDeck ? 'selected' : ''}`;
            item.innerHTML = `
                <div style="font-size:26px;">${c.forms[fIdx]}</div>
                <b>${c.formNames[fIdx]}</b><br>
                <span class="tag tag-${c.targetAttr}">對${c.targetAttr}強效</span><br>
                <small style="color:${inDeck?'#2ecc71':'#aaa'}">${inDeck?'[出戰中]':'[未裝備]'}</small>
            `;
            item.onclick = () => toggleDeck(id);
            list.appendChild(item);
        });
    }

    function toggleDeck(id) {
        if (user.deck.includes(id)) {
            if (user.deck.length <= 1) return alert("隊伍至少要有 1 隻神靈！");
            user.deck = user.deck.filter(x => x !== id);
        } else {
            if (user.deck.length >= 10) return alert("出戰隊伍最多 10 隻！");
            user.deck.push(id);
        }
        renderDeck();
        save();
    }

    // --- 升級介面 ---
    function renderUpgrade() {
        const list = document.getElementById('upgrade-list');
        list.innerHTML = '';
        user.owned.forEach(id => {
            const c = CHARS[id];
            const lv = user.lvs[id] || 1;
            const fIdx = getFormIdx(lv);
            const cost = lv * 150;
            const item = document.createElement('div');
            item.className = `card rarity-${c.rarity}`;
            item.innerHTML = `
                <div style="font-size:28px;">${c.forms[fIdx]}</div>
                <b>${c.formNames[fIdx]}</b><br>
                <small style="color:var(--gold);">Lv.${lv}</small><br>
                <button onclick="upLevel('${id}')" style="font-size:10px; margin-top:4px; background:var(--gold); border:none; border-radius:4px; padding:3px 8px; font-weight:bold; cursor:pointer;">升級(${cost}XP)</button>
            `;
            list.appendChild(item);
        });
    }

    function upLevel(id) {
        const cost = (user.lvs[id] || 1) * 150;
        if (user.xp >= cost) {
            user.xp -= cost;
            user.lvs[id] = (user.lvs[id] || 1) + 1;
            renderUpgrade();
            save();
        } else { alert("XP 不足！"); }
    }

    // --- 雙圖鑑頁籤 ---
    function renderBook(type) {
        document.getElementById('tab-gods').classList.toggle('active', type === 'gods');
        document.getElementById('tab-enemies').classList.toggle('active', type === 'enemies');
        
        document.getElementById('book-god-count').innerText = user.owned.length;
        document.getElementById('book-enemy-count').innerText = user.encounteredEnemies.length;

        document.getElementById('book-enemy-total').innerText = Object.keys(ENEMIES).length;

        list.innerHTML = '';

            Object.keys(CHARS).forEach(id => {
                const has = user.owned.includes(id);

                const lv = user.lvs[id] || 1;
                const fIdx = getFormIdx(lv);

                item.className = `card ${has ? 'rarity-' + c.rarity : 'locked'}`;

                    <div style="font-size:26px;">${has ? c.forms[fIdx] : '❓'}</div>

                `;

                    <div style="font-size:26px;">${has ? e.icon : '❓'}</div>

                    ${has ? `<span class="tag tag-${e.attr}">${e.attr}屬性</span><br><small>HP:${e.hp} ATK:${e.atk}</small>` : '<small>未遭遇</small>'}
                `;
                list.appendChild(item);
            });

    }

    // --- 地圖與篇章分頁 ---
    function renderMap() {
        const mapScreen = document.getElementById('map-screen');
        let navBar = document.getElementById('chapter-nav-bar');
        
        if (!navBar) {
            navBar = document.createElement('div');
            navBar.id = 'chapter-nav-bar';
            navBar.style.cssText = 'display:flex; gap:8px; width:100%; min-width:0; overflow-x:auto; padding:10px 0; margin-bottom:10px; scrollbar-width:thin;';
            const list = document.getElementById('map-list');
            mapScreen.insertBefore(navBar, list);
        }

        navBar.innerHTML = '';
        CHAPTERS.forEach(ch => {
            const btn = document.createElement('button');
            btn.className = 'chapter-btn';
            btn.style.cssText = `padding: 6px 12px; font-weight: bold; border-radius: 6px; border: 1px solid var(--p-color); cursor: pointer; white-space: nowrap; background: ${currentChapterTab === ch.id ? 'var(--p-color)' : 'transparent'}; color: ${currentChapterTab === ch.id ? '#fff' : 'var(--p-color)'};`;
            btn.innerText = ch.name;

                renderMap();
            };

            const item = document.createElement('div');

            item.innerHTML = `
                <b style="color:var(--p-color);">${s.name}</b><br>

                <small style="color:var(--gold);">通關 +${s.reward}XP</small>
            `;
            if (!locked) item.onclick = () => startBattle(idx);

        }

    // --- 抽卡 ---
    function drawGacha() {
        if (user.xp < 3000) return alert("XP 不足！(需要 3000 XP)");
        user.xp -= 3000;
        save();
        
        const anim = document.getElementById('gacha-anim');
        const icon = document.getElementById('gacha-icon');
        const txt = document.getElementById('gacha-result-text');
        
        anim.style.display = 'flex';
        icon.innerText = '🔮';
        txt.innerText = '祈願召喚中...';

        setTimeout(() => {
            const keys = Object.keys(CHARS);
            const res = keys[Math.floor(Math.random() * keys.length)];
            const isNew = !user.owned.includes(res);
            
            if (isNew) {
                user.owned.push(res);
                if (user.deck.length < 10) user.deck.push(res);
            } else {
                user.xp += 150;
            }

            const c = CHARS[res];
            icon.innerText = c.forms[0];
            txt.innerText = isNew 
                ? `🎉 獲得新神靈！\n${c.name} (${c.rarity})\n屬性克制: [${c.targetAttr}]`
                : `重複獲得 ${c.name}！\n自動轉化為 150 XP`;

            setTimeout(() => { anim.style.display = 'none'; save(); }, 1600);
        }, 800);
    }

    // --- 戰鬥引擎 ---
    let battle = { active: false, units: [], money: 0, maxMoney: 500, walletLv: 1, pHP: 1500, pMaxHP: 1500, eHP: 0, eMaxHP: 0, currentStage: null, width: 0, cooldowns: {}, cannonCharge: 0 };

    function startBattle(idx) {
        showScreen('game-screen');
        const s = STAGES[idx];
        const stageWidth = document.getElementById('stage').offsetWidth;
        
        battle = { 
            active: true, units: [], money: 100, maxMoney: 500, walletLv: 1,
            pHP: 2000, pMaxHP: 2000, eHP: s.eHP, eMaxHP: s.eHP, 
            currentStage: idx, width: stageWidth, cooldowns: {}, cannonCharge: 0 
        };
        
        renderBattleUI();
        requestAnimationFrame(battleLoop);
    }

    function renderBattleUI() {
        const panel = document.getElementById('ui-panel');
        panel.innerHTML = '';
        
        const walletBtn = document.createElement('button');
        walletBtn.className = 'spawn-btn';
        walletBtn.id = 'wallet-btn';
        walletBtn.onclick = upgradeWallet;
        panel.appendChild(walletBtn);

        const cannonBtn = document.createElement('button');
        cannonBtn.className = 'spawn-btn';
        cannonBtn.id = 'cannon-btn';
        cannonBtn.innerHTML = `<span>⚡</span><small>雨神砲</small>`;
        cannonBtn.onclick = fireCannon;
        panel.appendChild(cannonBtn);

        user.deck.forEach(id => {
            const c = CHARS[id];
            const lv = user.lvs[id] || 1;
            const fIdx = getFormIdx(lv);
            const btn = document.createElement('button');
            btn.className = 'spawn-btn';
            btn.id = `btn-${id}`;
            btn.innerHTML = `
                <span style="font-size:20px;">${c.forms[fIdx]}</span>
                <span class="tag tag-${c.targetAttr}" style="font-size:8px;">${c.targetAttr}</span>
                <b>$${c.cost}</b>
            `;
            btn.onclick = () => spawn(id, 'player');
            panel.appendChild(btn);
        });
    }

    function upgradeWallet() {
        const cost = battle.walletLv * 120;
        if (battle.money >= cost && battle.walletLv < 8) {
            battle.money -= cost;
            battle.walletLv++;
            battle.maxMoney += 300;
        }
    }

    function fireCannon() {
        if (battle.cannonCharge >= 100) {
            battle.cannonCharge = 0;
            battle.units.forEach(u => { if (u.side === 'enemy') u.hp -= 500; });
            battle.eHP -= 800;
        }
    }

    function spawn(id, side) {
        if (side === 'player') {
            const c = CHARS[id];
            if (battle.money < c.cost || (battle.cooldowns[id] || 0) > 0) return;
            battle.money -= c.cost;
            battle.cooldowns[id] = c.cd;
            
            const lv = user.lvs[id] || 1;
            const fIdx = getFormIdx(lv);
            const mult = 1 + (lv - 1) * 0.15;

            createUnitEntity({
                side: 'player', icon: c.forms[fIdx],
                targetAttr: c.targetAttr, isArea: c.isArea,
                x: 70, hp: c.hp * mult, max: c.hp * mult,
                atk: c.atk * mult, spd: c.spd, range: c.range
            });
        } else {
            const stg = STAGES[battle.currentStage];
            const enemyId = stg.ePool[Math.floor(Math.random() * stg.ePool.length)];
            const e = ENEMIES[enemyId];

            if (!user.encounteredEnemies.includes(enemyId)) {
                user.encounteredEnemies.push(enemyId);
                save();
            }

            createUnitEntity({
                side: 'enemy', icon: e.icon, attr: e.attr,
                x: battle.width - 90,
                hp: e.hp, max: e.hp,
                atk: e.atk, spd: e.spd, range: e.range, reward: e.reward
            });
        }
    }

    function createUnitEntity(cfg) {
        const el = document.createElement('div');
        el.className = 'unit';
        el.innerHTML = `<div class="hp-bar"><div class="hp-inner"></div></div><div class="unit-body">${cfg.icon}</div>`;
        document.getElementById('stage').appendChild(el);
        battle.units.push({ ...cfg, el, atkTimer: 0 });
    }

    function battleLoop() {
        if (!battle.active) return;

        // 錢包與雨神砲累積
        battle.money = Math.min(battle.maxMoney, battle.money + 0.25 + (battle.walletLv * 0.12));
        if (battle.cannonCharge < 100) battle.cannonCharge += 0.12;

        // 冷卻時間計算
        Object.keys(battle.cooldowns).forEach(k => {
            if (battle.cooldowns[k] > 0) battle.cooldowns[k] -= 0.1;
        });

        // 敵人生成邏輯
        if (Math.random() < (0.015 + battle.currentStage * 0.0008)) spawn(null, 'enemy');

        // 單位移動與戰鬥邏輯
        battle.units.forEach(u => {
            const isP = u.side === 'player';
            
            // 搜尋攻擊範圍內的目標
            let targets = battle.units.filter(en => 
                en.side !== u.side && 
                (isP ? (en.x - u.x <= u.range && en.x >= u.x) : (u.x - en.x <= u.range && u.x >= en.x))
            );

            const baseDist = isP ? (battle.width - 70 - u.x) : (u.x - 70);

            if (targets.length > 0 || baseDist <= u.range) {
                u.atkTimer++;
                if (u.atkTimer > 30) {
                    u.atkTimer = 0;
                    
                    // 執行攻擊
                    if (targets.length > 0) {
                        const hitTargets = u.isArea ? targets : [targets[0]];
                        hitTargets.forEach(target => {
                            let damage = u.atk;
                            // 屬性克制加成：玩家對特攻屬性傷害 x1.8
                            if (isP && u.targetAttr === target.attr) damage *= 1.8;
                            target.hp -= damage;
                        });
                    } else {
                        // 攻擊敵方城堡
                        if (isP) battle.eHP -= u.atk; 
                        else battle.pHP -= u.atk;
                    }
                }
            } else {
                // 前進
                u.x += isP ? u.spd : -u.spd;
                u.el.style.left = u.x + 'px';
            }

            // 更新血條 UI
            u.el.querySelector('.hp-inner').style.width = Math.max(0, (u.hp / u.max * 100)) + '%';
        });

        // 清除陣亡單位
        battle.units = battle.units.filter(u => { 
            if(u.hp <= 0) { 
                u.el.remove(); 
                if (u.side === 'enemy') battle.money = Math.min(battle.maxMoney, battle.money + (u.reward || 30));
                return false; 
            } 
            return true; 
        });

        // 戰鬥資訊 UI 刷新
        document.getElementById('battle-money').innerText = `$${Math.floor(battle.money)}`;
        document.getElementById('battle-max-money').innerText = `$${battle.maxMoney}`;
        document.getElementById('p-hp').innerText = `${Math.max(0, Math.floor(battle.pHP))}/${battle.pMaxHP}`;
        document.getElementById('e-hp').innerText = `${Math.max(0, Math.floor(battle.eHP))}/${Math.floor(battle.eMaxHP)}`;

        const wBtn = document.getElementById('wallet-btn');
        if (wBtn) {
            wBtn.innerHTML = `<span>💰</span><small>錢包Lv.${battle.walletLv}</small>`;
            wBtn.disabled = battle.walletLv >= 8 || battle.money < (battle.walletLv * 120);
        }

        const cBtn = document.getElementById('cannon-btn');
        const cStatus = document.getElementById('cannon-status');
        if (cBtn && cStatus) {
            cStatus.innerText = battle.cannonCharge >= 100 ? '可發射！' : `${Math.floor(battle.cannonCharge)}%`;
            cBtn.disabled = battle.cannonCharge < 100;
        }

        // 冷卻與按鈕狀態更新
        user.deck.forEach(id => {
            const btn = document.getElementById(`btn-${id}`);
            if (btn) {
                const cdLeft = Math.max(0, Math.ceil(battle.cooldowns[id] || 0));
                btn.disabled = (battle.money < CHARS[id].cost) || (cdLeft > 0);
                
                let cdMask = btn.querySelector('.cd-mask');
                if (cdLeft > 0) {
                    if (!cdMask) {
                        cdMask = document.createElement('div');
                        cdMask.className = 'cd-mask';
                        btn.appendChild(cdMask);
                    }
                    cdMask.innerText = cdLeft;
                } else if (cdMask) {
                    cdMask.remove();
                }
            }
        });

        // 勝負判定
        if (battle.pHP <= 0 || battle.eHP <= 0) {
            battle.active = false;
            document.querySelectorAll('.unit').forEach(u => u.remove());
            
            if (battle.eHP <= 0) {
                const reward = STAGES[battle.currentStage].reward;
                user.xp += reward;
                user.cleared = Math.max(user.cleared, battle.currentStage + 1);
                alert(`🚩 遠征勝利！獲得 ${reward} XP！`);
                uploadWarsLeaderboardScore();
            } else {
                alert("💥 主堡被摧毀，遠征失敗...");
            }
            save();
            showScreen('main-screen');
            return;
        }

        requestAnimationFrame(battleLoop);
    }

    initializeWars().catch(error => {
        console.error('雨神大戰爭初始化失敗：', error);
        const status = document.getElementById('wars-leaderboard-status');
        if (status) status.textContent = '遊戲初始化失敗，請重新整理頁面。';
    });
</script>
</body>
</html>
