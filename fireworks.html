<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>煙火 | Raingod</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body { margin: 0; background: #020205; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; }
        canvas { display: block; cursor: crosshair; }

        /* HUD 數據列 */
        #hud {
            position: absolute; top: 15px; left: 15px; color: #fff;
            background: rgba(10, 10, 20, 0.85); backdrop-filter: blur(12px);
            padding: 12px 24px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); pointer-events: none;
            display: flex; gap: 20px; align-items: center; z-index: 10;
        }
        .hud-item { display: flex; flex-direction: column; }
        .hud-label { font-size: 10px; color: #8e8ea0; text-transform: uppercase; letter-spacing: 1px; }
        .hud-value { font-size: 20px; font-weight: 800; color: #fff; }
        #money { color: #ffd700; text-shadow: 0 0 12px rgba(255,215,0,0.5); }

        /* COMBO / 救濟金提示 */
        #combo-popup {
            position: absolute; top: 85px; left: 20px; color: #00f0ff;
            font-size: 22px; font-weight: 900; pointer-events: none; opacity: 0;
            transition: opacity 0.2s, transform 0.2s; transform: scale(0.8);
            text-shadow: 0 0 15px rgba(0,240,255,0.9); z-index: 10;
        }

        /* 商店面板 */
        #shop-panel {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(8, 8, 16, 0.92); backdrop-filter: blur(16px);
            padding: 12px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.15);
            display: flex; gap: 10px; max-width: 98vw; overflow-x: auto;
            box-shadow: 0 12px 40px rgba(0,0,0,0.9); z-index: 10;
            scrollbar-width: thin; scrollbar-color: rgba(0,240,255,0.4) transparent;
        }
        #shop-panel::-webkit-scrollbar { height: 6px; }
        #shop-panel::-webkit-scrollbar-thumb { background: rgba(0,240,255,0.4); border-radius: 3px; }

        .firework-card {
            background: rgba(255,255,255,0.03); border: 2px solid rgba(255,255,255,0.08);
            border-radius: 12px; padding: 10px; min-width: 125px; text-align: center;
            cursor: pointer; transition: all 0.2s ease; position: relative; color: #fff;
            display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0;
        }
        .firework-card:hover { transform: translateY(-4px); background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.3); }
        .firework-card.active { border-color: #00f0ff; box-shadow: 0 0 20px rgba(0, 240, 255, 0.4); background: rgba(0, 240, 255, 0.1); }
        .firework-card.locked { opacity: 0.45; filter: grayscale(0.9); }
        
        .fw-name { font-weight: 800; font-size: 13px; margin-bottom: 2px; white-space: nowrap; color: #fff; }
        .fw-cost { font-size: 11px; color: #ffd700; margin-bottom: 6px; }
        .fw-action {
            font-size: 11px; padding: 5px; border-radius: 6px; background: #2563eb; color: white;
            border: none; cursor: pointer; width: 100%; transition: 0.2s; font-weight: 700;
        }
        .fw-action:disabled { background: #334155; cursor: not-allowed; opacity: 0.6; }

        /* 特殊升級按鈕群 */
        .upgrade-btn {
            border: none; border-radius: 12px; padding: 8px 14px; color: white;
            font-weight: bold; cursor: pointer; display: flex; flex-direction: column;
            justify-content: center; align-items: center; min-width: 125px; transition: 0.2s;
            flex-shrink: 0;
        }
        .auto-upgrade { background: linear-gradient(135deg, #059669, #10b981); }
        .auto-upgrade:hover { transform: translateY(-3px); box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); }
        
        .frenzy-btn { background: linear-gradient(135deg, #d97706, #f59e0b); }
        .frenzy-btn:hover { transform: translateY(-3px); box-shadow: 0 0 15px rgba(245, 158, 11, 0.5); }

        .upgrade-btn:disabled { background: #334155 !important; opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-item">
            <span class="hud-label">資金 (MONEY)</span>
            <span class="hud-value" id="money">\$100</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">目前選擇</span>
            <span class="hud-value" id="current-selected" style="color: #00f0ff; font-size: 15px;">仙女棒</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">螢幕粒子數</span>
            <span class="hud-value" id="count">0</span>
        </div>
    </div>

    <div id="combo-popup">COMBO x2.5!</div>

    <div id="shop-panel">
        <button class="upgrade-btn auto-upgrade" id="btn-auto-launch" onclick="upgradeAutoLauncher()">
            <span style="font-size: 12px;">自動發射陣列</span>
            <span id="auto-cost" style="font-size: 10px; color: #e2e8f0; margin-top: 2px;">\$150 (Lv.0)</span>
        </button>
        <button class="upgrade-btn frenzy-btn" id="btn-frenzy" onclick="upgradeFrenzy()">
            <span style="font-size: 12px;">多重併發解鎖</span>
            <span id="frenzy-cost" style="font-size: 10px; color: #e2e8f0; margin-top: 2px;">\$500 (1發/次)</span>
        </button>
    </div>

    <canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { alpha: false });
let w, h, entities = [], rockets = [];

let gameState = {
    money: 100,
    selectedFirework: 0,
    autoLaunchLevel: 0,
    autoLaunchTimer: 0,
    frenzyLevel: 1
};

// 煙火清單（仙女棒成本調整為 0 免費保底）
const FIREWORKS = [
    { id: 0,  name: "仙女棒",     cost: 0,        unlockCost: 0,          unlocked: true,  color: "#ffaa00", count: 35,  force: 6,  baseReturn: 5,      type: "normal" },
    { id: 1,  name: "雙倍爆裂",   cost: 35,       unlockCost: 150,        unlocked: false, color: "#00f0ff", count: 50,  force: 8,  baseReturn: 22,     type: "split" },
    { id: 2,  name: "牡丹禮花",   cost: 100,      unlockCost: 600,        unlocked: false, color: "#ff007f", count: 90,  force: 11, baseReturn: 65,     type: "peony" },
    { id: 3,  name: "土星環帶",   cost: 250,      unlockCost: 1500,       unlocked: false, color: "#00ff88", count: 120, force: 10, baseReturn: 160,    type: "ring" },
    { id: 4,  name: "心形密語",   cost: 600,      unlockCost: 3500,       unlocked: false, color: "#ff3366", count: 130, force: 9,  baseReturn: 400,    type: "heart" },
    { id: 5,  name: "金色柳樹",   cost: 1500,     unlockCost: 8000,       unlocked: false, color: "#ffeeaa", count: 160, force: 13, baseReturn: 1000,   type: "willow" },
    { id: 6,  name: "七彩連鎖",   cost: 3500,     unlockCost: 20000,      unlocked: false, color: "rainbow", count: 200, force: 15, baseReturn: 2300,   type: "chain" },
    { id: 7,  name: "螺旋風暴",   cost: 8000,     unlockCost: 50000,      unlocked: false, color: "#ff9900", count: 220, force: 14, baseReturn: 5300,   type: "spiral" },
    { id: 8,  name: "翡翠矩陣",   cost: 20000,    unlockCost: 120000,     unlocked: false, color: "#00ffaa", count: 250, force: 17, baseReturn: 13500,  type: "matrix" },
    { id: 9,  name: "十字星芒",   cost: 45000,    unlockCost: 280000,     unlocked: false, color: "#ffff00", count: 280, force: 16, baseReturn: 31000,  type: "cross" },
    { id: 10, name: "藍色流星雨", cost: 100000,   unlockCost: 650000,     unlocked: false, color: "#3388ff", count: 320, force: 18, baseReturn: 70000,  type: "meteor" },
    { id: 11, name: "紫金盛宴",   cost: 250000,   unlockCost: 1500000,    unlocked: false, color: "#cc44ff", count: 380, force: 20, baseReturn: 175000, type: "peony" },
    { id: 12, name: "量子方塊",   cost: 600000,   unlockCost: 3800000,    unlocked: false, color: "#00ffff", count: 300, force: 15, baseReturn: 420000, type: "cube" },
    { id: 13, name: "超新星爆發", cost: 1500000,  unlockCost: 9000000,    unlocked: false, color: "#ffffff", count: 500, force: 24, baseReturn: 1100000,type: "supernova" },
    { id: 14, name: "黑洞引力",   cost: 4000000,  unlockCost: 22000000,   unlocked: false, color: "#aa00ff", count: 450, force: 22, baseReturn: 3000000,type: "blackhole" },
    { id: 15, name: "核爆夜空",   cost: 10000000, unlockCost: 55000000,   unlocked: false, color: "#ff2200", count: 700, force: 28, baseReturn: 7500000,type: "nuke" },
    { id: 16, name: "極光狂想曲", cost: 25000000, unlockCost: 140000000,  unlocked: false, color: "aurora",  count: 850, force: 26, baseReturn: 19000000,type: "aurora" },
    { id: 17, name: "銀河星系",   cost: 65000000, unlockCost: 380000000,  unlocked: false, color: "galaxy",  count: 1000,force: 30, baseReturn: 50000000,type: "galaxy" },
    { id: 18, name: "創世之光",   cost: 180000000,unlockCost: 1000000000, unlocked: false, color: "#ffffff", count: 1400,force: 34, baseReturn: 140000000,type: "supernova" },
    { id: 19, name: "終極宇宙盛宴",cost:500000000,unlockCost: 3000000000, unlocked: false, color: "rainbow",count: 2000,force: 40, baseReturn: 400000000,type: "nuke" }
];

const resize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };
window.onresize = resize;
resize();

// Rocket
class Rocket {
    constructor(startX, startY, targetX, targetY, fwConfig) {
        this.x = startX; this.y = startY;
        this.targetY = targetY; this.targetX = targetX;
        this.fw = fwConfig;
        
        const angle = Math.atan2(targetY - startY, targetX - startX);
        const dist = Math.hypot(targetX - startX, targetY - startY);
        const speed = Math.min(dist / 20, 22);
        
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.dead = false;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        if (Math.random() < 0.6) {
            entities.push(new Fragment(this.x, this.y, (Math.random()-0.5)*1.5, (Math.random()-0.5)*1.5 + 1, "#ffaa00", 2, 0.04, false, 0, 0.05, 1));
        }
        if (this.vy < 0 && this.y <= this.targetY) {
            this.explode();
            this.dead = true;
        }
    }
    explode() {
        const heightBonus = this.y < h * 0.4 ? 1.3 : (this.y < h * 0.7 ? 1.1 : 0.9);
        createExplosion(this.x, this.y, this.fw, heightBonus);
    }
    draw() {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(this.x - 1.5, this.y - 1.5, 3, 9);
    }
}

// Fragment
class Fragment {
    constructor(x, y, vx, vy, color, size, lifeDecay = 0.015, split = false, earnings = 0, gravity = 0.05, comboMult = 1) {
        this.x = x; this.y = y;
        this.vx = vx; this.vy = vy;
        this.color = color;
        this.size = size;
        this.life = 1.0;
        this.lifeDecay = lifeDecay;
        this.split = split;
        this.earnings = earnings;
        this.gravity = gravity;
        this.comboMult = comboMult;
        this.checkedCombo = false;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        this.vy += this.gravity;
        this.vx *= 0.98; this.vy *= 0.98;
        this.life -= this.lifeDecay;

        if(this.x < 0 || this.x > w) this.vx *= -0.7;
        if(this.y < 0 || this.y > h) this.vy *= -0.7;

        if (!this.checkedCombo && this.life > 0.8) {
            this.checkedCombo = true;
            let nearby = 0;
            for (let i = 0; i < entities.length; i += 8) {
                let other = entities[i];
                if (other !== this && Math.abs(other.x - this.x) < 45 && Math.abs(other.y - this.y) < 45) {
                    nearby++;
                }
            }
            if (nearby > 15) this.comboMult *= 2.5;
            else if (nearby > 6) this.comboMult *= 1.5;

            if (this.comboMult > 2.0) showMsg(`COMBO x${this.comboMult.toFixed(1)}!`);
        }

        if (this.life <= 0 && this.earnings > 0) {
            addMoney(this.earnings * this.comboMult);
            this.earnings = 0;
        }
    }
}

function createExplosion(x, y, fw, heightBonus) {
    const isRainbow = fw.color === "rainbow";
    const isAurora = fw.color === "aurora";
    const isGalaxy = fw.color === "galaxy";
    const earnPerParticle = (fw.baseReturn * heightBonus) / fw.count;

    for(let i = 0; i < fw.count; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = (Math.random() * 0.8 + 0.2) * fw.force;
        let color = fw.color;

        if (isRainbow) color = `hsl(${Math.random() * 360}, 100%, 65%)`;
        else if (isAurora) color = `hsl(${120 + Math.random() * 100}, 100%, 60%)`;
        else if (isGalaxy) color = `hsl(${240 + Math.random() * 80}, 100%, 70%)`;

        let decay = 0.01 + Math.random() * 0.015;
        let gravity = 0.04;
        let size = Math.random() * 2 + 2;

        if (fw.type === "ring") {
            angle = (i / fw.count) * Math.PI * 2;
            speed = fw.force * (0.9 + Math.random() * 0.2);
        } else if (fw.type === "heart") {
            const t = (i / fw.count) * Math.PI * 2;
            const hx = 16 * Math.pow(Math.sin(t), 3);
            const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            angle = Math.atan2(hy, hx);
            speed = Math.hypot(hx, hy) * (fw.force / 16);
        } else if (fw.type === "cross") {
            angle = Math.floor(Math.random() * 4) * (Math.PI / 2) + (Math.random() - 0.5) * 0.1;
        } else if (fw.type === "cube") {
            const side = Math.floor(Math.random() * 4);
            angle = side * (Math.PI / 2) + (Math.random() * 0.4);
            speed = (0.5 + Math.random() * 0.5) * fw.force;
        } else if (fw.type === "spiral") {
            angle = i * 0.2;
            speed = (i / fw.count) * fw.force;
        } else if (fw.type === "blackhole") {
            gravity = -0.02;
            decay = 0.005;
        } else if (fw.type === "willow") {
            decay = 0.006; gravity = 0.02; size = 1.8;
        } else if (fw.type === "supernova" || fw.type === "nuke") {
            size = Math.random() * 4 + 3; decay = 0.006;
        }

        entities.push(new Fragment(
            x, y, 
            Math.cos(angle) * speed, 
            Math.sin(angle) * speed, 
            color, size, decay,
            fw.type === "split" || fw.type === "chain",
            earnPerParticle, gravity, 1
        ));
    }
}

function showMsg(text) {
    const popup = document.getElementById('combo-popup');
    popup.innerText = text;
    popup.style.opacity = '1';
    popup.style.transform = 'scale(1.1)';
    clearTimeout(window.comboTimer);
    window.comboTimer = setTimeout(() => {
        popup.style.opacity = '0';
        popup.style.transform = 'scale(0.8)';
    }, 900);
}

canvas.addEventListener('mousedown', (e) => {
    if (e.clientY > window.innerHeight - 90) return;

    const fw = FIREWORKS[gameState.selectedFirework];
    const totalCost = fw.cost * gameState.frenzyLevel;

    if (gameState.money >= totalCost) {
        addMoney(-totalCost);
        for(let i = 0; i < gameState.frenzyLevel; i++) {
            const offsetX = (Math.random() - 0.5) * 120;
            const offsetY = (Math.random() - 0.5) * 80;
            rockets.push(new Rocket(w / 2, h, e.clientX + offsetX, e.clientY + offsetY, fw));
        }
    }
});

function addMoney(amount) {
    gameState.money += amount;

    // 【破產救援機制】錢少於 \$10 且畫面空了，自動補助 \$20 救援金！
    if (gameState.money < 10 && entities.length === 0 && rockets.length === 0) {
        gameState.money += 20;
        showMsg("獲得破產救濟金 \$20！");
    }

    document.getElementById('money').innerText = `$${Math.floor(gameState.money).toLocaleString()}`;
    updateShopUI();
}

function upgradeAutoLauncher() {
    const cost = Math.floor(150 * Math.pow(1.8, gameState.autoLaunchLevel));
    if (gameState.money >= cost) {
        addMoney(-cost);
        gameState.autoLaunchLevel++;
        document.getElementById('auto-cost').innerText = `$${Math.floor(150 * Math.pow(1.8, gameState.autoLaunchLevel)).toLocaleString()} (Lv.${gameState.autoLaunchLevel})`;
    }
}

function upgradeFrenzy() {
    const cost = Math.floor(500 * Math.pow(2.5, gameState.frenzyLevel));
    if (gameState.money >= cost) {
        addMoney(-cost);
        gameState.frenzyLevel++;
        document.getElementById('frenzy-cost').innerText = `$${Math.floor(500 * Math.pow(2.5, gameState.frenzyLevel)).toLocaleString()} (${gameState.frenzyLevel}發/次)`;
    }
}

function selectOrUnlockFW(id) {
    const fw = FIREWORKS[id];
    if (!fw.unlocked) {
        if (gameState.money >= fw.unlockCost) {
            addMoney(-fw.unlockCost);
            fw.unlocked = true;
            gameState.selectedFirework = id;
            renderShop();
        }
    } else {
        gameState.selectedFirework = id;
        document.getElementById('current-selected').innerText = fw.name;
        renderShop();
    }
}

function renderShop() {
    const panel = document.getElementById('shop-panel');
    const existingCards = panel.querySelectorAll('.firework-card');
    existingCards.forEach(c => c.remove());

    FIREWORKS.forEach((fw) => {
        const card = document.createElement('div');
        card.className = `firework-card ${fw.unlocked ? '' : 'locked'} ${gameState.selectedFirework === fw.id ? 'active' : ''}`;
        
        let actionBtnText = fw.unlocked ? (gameState.selectedFirework === fw.id ? '裝備中' : '選擇') : `解鎖 $${fw.unlockCost.toLocaleString()}`;
        
        card.innerHTML = `
            <div class="fw-name">${fw.name}</div>
            <div class="fw-cost">${fw.cost === 0 ? '免費' : '單發 $' + fw.cost.toLocaleString()}</div>
            <button class="fw-action" ${fw.unlocked && gameState.selectedFirework === fw.id ? 'disabled' : ''}>${actionBtnText}</button>
        `;
        
        card.onclick = () => selectOrUnlockFW(fw.id);
        panel.insertBefore(card, document.getElementById('btn-auto-launch'));
    });
}

function updateShopUI() {
    const btnAuto = document.getElementById('btn-auto-launch');
    const autoCost = Math.floor(150 * Math.pow(1.8, gameState.autoLaunchLevel));
    btnAuto.disabled = gameState.money < autoCost;

    const btnFrenzy = document.getElementById('btn-frenzy');
    const frenzyCost = Math.floor(500 * Math.pow(2.5, gameState.frenzyLevel));
    btnFrenzy.disabled = gameState.money < frenzyCost;

    const cards = document.querySelectorAll('.firework-card');
    cards.forEach((card, index) => {
        const fw = FIREWORKS[index];
        const btn = card.querySelector('.fw-action');
        if (!fw.unlocked) {
            btn.disabled = gameState.money < fw.unlockCost;
        }
    });
}

function loop() {
    ctx.fillStyle = 'rgba(2, 2, 5, 0.2)';
    ctx.fillRect(0, 0, w, h);

    if (gameState.autoLaunchLevel > 0) {
        gameState.autoLaunchTimer++;
        const interval = Math.max(5, 60 - gameState.autoLaunchLevel * 6);
        if (gameState.autoLaunchTimer >= interval) {
            gameState.autoLaunchTimer = 0;
            const unlockedFWs = FIREWORKS.filter(f => f.unlocked);
            const randomFW = unlockedFWs[Math.floor(Math.random() * unlockedFWs.length)];
            const rx = Math.random() * (w * 0.85) + w * 0.075;
            const ry = Math.random() * (h * 0.55) + h * 0.1;
            rockets.push(new Rocket(w / 2, h, rx, ry, randomFW));
        }
    }

    for(let i = rockets.length - 1; i >= 0; i--) {
        rockets[i].update();
        rockets[i].draw();
        if(rockets[i].dead) rockets.splice(i, 1);
    }

    const nextEntities = [];
    ctx.globalCompositeOperation = 'lighter';

    for(let i = 0; i < entities.length; i++) {
        const p = entities[i];
        p.update();

        if(p.split && p.life < 0.45 && Math.random() > 0.96) {
            const smallFW = { count: 3, force: 4, color: p.color, baseReturn: p.earnings * 3, type: 'normal' };
            createExplosion(p.x, p.y, smallFW, 1.0);
            p.split = false;
        }

        if(p.life > 0) {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillRect(p.x, p.y, p.size, p.size);
            nextEntities.push(p);
        }
    }

    ctx.globalAlpha = 1.0;
    ctx.globalCompositeOperation = 'source-over';
    entities = nextEntities;

    document.getElementById('count').innerText = (entities.length + rockets.length).toLocaleString();

    requestAnimationFrame(loop);
}

renderShop();
updateShopUI();
loop();
</script>
</body>
</html>
