<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🥚 Steal An Egg · 手機觸控版</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
  body{
    background:radial-gradient(ellipse at 30% 20%, #151f35, #05080f);
    min-height:100vh;display:flex;justify-content:center;align-items:center;
    font-family:'Segoe UI',system-ui,sans-serif;padding:8px;
    touch-action:none;
  }
  .game{
    background:linear-gradient(180deg,#0e1524,#070b13);
    border-radius:20px;padding:10px;
    box-shadow:0 30px 60px rgba(0,0,0,.9),0 0 0 1px #253349 inset,0 0 0 3px #060a10;
    max-width:1100px;width:100%;
  }
  canvas{
    display:block;width:100%;height:auto;border-radius:12px;
    box-shadow:0 0 0 2px #0a111c,0 16px 40px rgba(0,0,0,.8);
    cursor:crosshair;background:#0a1018;
    touch-action:none;
  }
  .hud{
    display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;
    align-items:center;padding:8px 4px 4px;
  }
  .stats{display:flex;flex-wrap:wrap;gap:4px}
  .stat{
    display:flex;align-items:center;gap:4px;
    background:linear-gradient(180deg,#182338,#0d1523);
    border:1px solid #2c3f5c;border-radius:8px;
    padding:5px 10px;color:#dbe7ff;font-weight:700;font-size:.7rem;
    box-shadow:0 3px 0 #05090f,inset 0 1px 0 #3a5275;
  }
  .stat b{color:#fff;font-size:.85rem;letter-spacing:.2px}
  .stat.speed{background:linear-gradient(180deg,#1a3a2a,#0d1f14);border-color:#3a7a5a}
  .stat.speed b{color:#7affb0}
  .stat.pet{background:linear-gradient(180deg,#2a1a3a,#150d1f);border-color:#5a3a7a}
  .stat.pet b{color:#c9a0ff}
  .btns{display:flex;flex-wrap:wrap;gap:4px}
  button{
    background:linear-gradient(180deg,#2b4a72,#16273d);
    border:1px solid #43689a;border-radius:8px;
    padding:6px 12px;color:#eaf3ff;font-weight:800;font-size:.7rem;
    cursor:pointer;letter-spacing:.3px;
    box-shadow:0 4px 0 #081019,inset 0 1px 0 #5a82b8;
    transition:transform .06s,box-shadow .06s;
    touch-action:manipulation;
  }
  button:hover{filter:brightness(1.15)}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #081019}
  button:disabled{opacity:.35;transform:translateY(2px);box-shadow:0 2px 0 #081019;cursor:not-allowed;filter:grayscale(.6)}
  button.sell{
    background:linear-gradient(180deg,#8a2a2a,#4a1010);
    border-color:#aa4444;
  }
  button.sell:active{box-shadow:0 1px 0 #081019}
  button.save{
    background:linear-gradient(180deg,#2a6a3a,#143a1a);
    border-color:#3a9a5a;
  }
  .biome-tag{
    display:flex;align-items:center;gap:6px;font-weight:800;font-size:.75rem;
    background:linear-gradient(180deg,#1c2e46,#0e1725);
    border:1px solid #3a5a80;border-radius:8px;padding:5px 12px;color:#cfe2ff;
  }
  .hint{display:flex;align-items:center;gap:5px;font-size:.65rem;color:#7fa0c8;font-weight:700;letter-spacing:.3px}
  .key-hint{
    display:inline-block;background:#1a2a3a;border:1px solid #3a5a7a;
    border-radius:4px;padding:1px 4px;font-size:.6rem;color:#aaddff;margin:0 1px;
  }
  .train-indicator{
    display:flex;align-items:center;gap:5px;font-size:.65rem;
    color:#ffd966;font-weight:800;
  }
  /* 手機虛擬搖桿 */
  .joystick-zone{
    position:fixed;bottom:20px;left:20px;
    width:120px;height:120px;
    border-radius:50%;
    background:rgba(30,50,80,0.4);
    border:2px solid rgba(100,150,200,0.5);
    display:none;z-index:30;
    touch-action:none;
  }
  .joystick-zone.active{display:block}
  .joystick-knob{
    position:absolute;top:50%;left:50%;
    width:50px;height:50px;
    border-radius:50%;
    background:radial-gradient(circle,#7ad0ff,#1a4a8a);
    border:2px solid #aaddff;
    box-shadow:0 0 20px rgba(100,180,255,0.6);
    transform:translate(-50%,-50%);
    transition:transform 0.05s;
  }
  /* 選取寵物面板 */
  .pet-panel{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:linear-gradient(180deg,#1a2438,#0d1523);
    border:2px solid #5a3a7a;border-radius:16px;
    padding:12px 20px;z-index:50;
    display:none;align-items:center;gap:16px;
    box-shadow:0 10px 40px rgba(0,0,0,0.8),0 0 0 1px #2a3a5a;
    max-width:90%;flex-wrap:wrap;justify-content:center;
  }
  .pet-panel.open{display:flex}
  .pet-panel canvas{width:50px;height:50px}
  .pet-panel .info{display:flex;flex-direction:column;gap:2px}
  .pet-panel .pname{font-size:1rem;font-weight:800;color:#ffd966}
  .pet-panel .pinc{font-size:.8rem;color:#9fd89f;font-weight:700}
  .pet-panel .prar{font-size:.7rem;font-weight:800}
  .pet-panel .sell-btn{
    background:linear-gradient(180deg,#8a2a2a,#4a1010);
    border-color:#aa4444;font-size:.8rem;padding:8px 16px;
  }
  .pet-panel .close-btn{
    background:#2a2a3a;border-color:#4a4a5a;font-size:.7rem;padding:6px 12px;
  }
  /* 圖鑑面板 */
  .index-panel{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(5,10,20,0.96);
    backdrop-filter:blur(12px);
    z-index:100;display:none;flex-direction:column;
    padding:24px;overflow-y:auto;
  }
  .index-panel.open{display:flex}
  .index-header{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:20px;flex-wrap:wrap;gap:12px;
  }
  .index-header h2{
    color:#ffd966;font-size:1.4rem;font-weight:900;
    text-shadow:0 0 20px rgba(255,200,50,0.5);
  }
  .index-header button{
    background:linear-gradient(180deg,#8a2a2a,#4a1010);
    border-color:#aa4444;
  }
  .index-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
    gap:10px;
  }
  .index-card{
    background:linear-gradient(180deg,#1a2438,#0d1523);
    border:2px solid #2c3f5c;border-radius:12px;
    padding:8px;display:flex;flex-direction:column;
    align-items:center;gap:4px;position:relative;
    transition:all 0.2s;
  }
  .index-card.unlocked{
    border-color:#ffd966;
    box-shadow:0 0 20px rgba(255,200,50,0.2);
  }
  .index-card.locked{
    opacity:0.35;filter:grayscale(1);
  }
  .index-card canvas{
    width:50px;height:50px;
  }
  .index-card .name{
    font-size:0.65rem;font-weight:800;color:#dbe7ff;text-align:center;
    line-height:1.2;min-height:1.6em;
  }
  .index-card .biome-label{
    font-size:0.55rem;color:#7fa0c8;font-weight:700;
  }
  .index-card .rarity-label{
    font-size:0.55rem;font-weight:800;padding:2px 6px;
    border-radius:8px;background:#0a1018;
  }
  .index-card .reward-btn{
    font-size:0.6rem;padding:3px 8px;
    background:linear-gradient(180deg,#2a6a3a,#143a1a);
    border-color:#3a9a5a;border-radius:6px;
  }
  .index-card .reward-btn.claimed{
    opacity:0.4;cursor:default;filter:grayscale(1);
  }
  .index-tabs{
    display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;
  }
  .index-tab{
    padding:6px 12px;border-radius:8px;
    background:#0d1523;border:1px solid #2c3f5c;
    color:#7fa0c8;font-weight:800;font-size:0.7rem;
    cursor:pointer;transition:all 0.15s;
  }
  .index-tab.active{
    background:linear-gradient(180deg,#2b4a72,#16273d);
    color:#eaf3ff;border-color:#5a82b8;
  }
  /* 擊飛警告 */
  .knockback-flash{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(255,0,0,0.3);
    pointer-events:none;z-index:150;
    animation:flash 0.4s ease-out;
  }
  @keyframes flash{
    0%{opacity:0.8}
    100%{opacity:0}
  }
  /* 手機適配 */
  @media (max-width:768px){
    .game{padding:6px;border-radius:12px}
    .stat{padding:4px 8px;font-size:.6rem}
    .stat b{font-size:.75rem}
    button{padding:5px 10px;font-size:.6rem}
    .hint{display:none}
    .biome-tag{font-size:.65rem;padding:4px 10px}
  }
</style>
</head>
<body>
<div class="game">
  <canvas id="c" width="1080" height="680"></canvas>
  <div class="hud">
    <div class="stats">
      <div class="stat speed">⚡ <b id="uiSpeed">10</b></div>
      <div class="stat">💰 <b id="uiCash">0</b></div>
      <div class="stat">🥚 <b id="uiEgg">0</b></div>
      <div class="stat pet">📖 <b id="uiIndex">0/64</b></div>
    </div>
    <div class="btns">
      <button id="btnUp">⬆️ 跑步機 <span id="lvTxt">1</span> <span id="costTxt" style="color:#ffaa00">$40</span></button>
      <button id="btnIndex">📖 圖鑑</button>
      <button id="btnEquip">✨ 一鍵最佳</button>
      <button id="btnSellSelected" class="sell" disabled>💸 出售選中</button>
      <button id="btnSave" class="save">💾 存檔</button>
    </div>
  </div>
  <div class="hud" style="padding-top:4px">
    <div class="biome-tag"><span id="uiBiomeIcon">🌲</span> <span id="uiBiome">森林</span></div>
    <div class="train-indicator" id="trainStatus">🚶 未在訓練</div>
    <div class="hint">🎮 <span class="key-hint">WASD</span> 移動 &nbsp;|&nbsp; 手機拖曳畫面移動 &nbsp;|&nbsp; 點擊寵物選取</div>
  </div>
</div>

<!-- 手機虛擬搖桿 -->
<div class="joystick-zone" id="joystickZone">
  <div class="joystick-knob" id="joystickKnob"></div>
</div>

<!-- 選中寵物面板 -->
<div class="pet-panel" id="petPanel">
  <canvas id="petPanelCanvas" width="50" height="50"></canvas>
  <div class="info">
    <div class="pname" id="ppName">-</div>
    <div class="pinc" id="ppInc">-</div>
    <div class="prar" id="ppRar">-</div>
  </div>
  <button class="sell-btn" id="btnSellPanel">💸 出售</button>
  <button class="close-btn" id="btnClosePanel">✕</button>
</div>

<!-- 圖鑑面板 -->
<div class="index-panel" id="indexPanel">
  <div class="index-header">
    <h2>📖 寵物圖鑑</h2>
    <div class="index-tabs" id="indexTabs"></div>
    <button id="btnCloseIndex">✕ 關閉</button>
  </div>
  <div class="index-grid" id="indexGrid"></div>
</div>

<script>
(function(){
  const c=document.getElementById('c');
  const ctx=c.getContext('2d');
  const W=1080,H=680;

  // ========== 世界設定 ==========
  const WORLD={
    safeY:2500,
    biomes:[
      {name:'森林',icon:'🌲',yMin:2000,yMax:2500,reqDisplay:0,color:'#16301c',accent:'#2e5a34',guardian:'雞',nestsY:2200,nestXs:[300,700],petNames:['雞','狗','鳥','穴鴞','浣熊','狐狸','熊','Brr Brr Patapim']},
      {name:'火山',icon:'🌋',yMin:1500,yMax:2000,reqDisplay:700,color:'#3a1616',accent:'#5a2020',guardian:'地獄犬',nestsY:1700,nestXs:[200,500,800],petNames:['熔岩壁虎','熔岩蛙','烈焰牛','熔岩鬣蜥','Chillin Chilli','地獄犬','鳳凰','熔岩龍']},
      {name:'深淵',icon:'🌊',yMin:1000,yMax:1500,reqDisplay:2500,color:'#0c1a30',accent:'#163a5a',guardian:'白鯨',nestsY:1200,nestXs:[300,700],petNames:['鸚鵡魚','劍魚','鯊魚','虎鯨','鯨鯊','白鯨','海妖','El Maja']},
      {name:'史前',icon:'🦕',yMin:500,yMax:1000,reqDisplay:17000,color:'#2a2818',accent:'#4a4520',guardian:'暴龍',nestsY:700,nestXs:[250,750],petNames:['渡渡鳥','翼龍','甲龍','三角龍','雷龍','暴龍','Tralaledon','滄龍']},
      {name:'宇宙',icon:'🌌',yMin:0,yMax:500,reqDisplay:700000,color:'#160e28',accent:'#2a1a4a',guardian:'骷髏王',nestsY:200,nestXs:[500],petNames:['蜈蚣','宇宙壁虎','宇宙猩猩','La Vacca','骷髏王','宇宙龍','永恆月龍','獨角獸']},
      {name:'櫻花',icon:'🌸',yMin:-600,yMax:0,reqDisplay:1500000,color:'#2a1a2a',accent:'#6a3a5a',guardian:'櫻花精靈',nestsY:-300,nestXs:[250,750],petNames:['花瓣精靈','櫻桃鼠','粉蝶','花妖','櫻花鹿','櫻龍','月兔','櫻花女神']},
      {name:'泰坦',icon:'🏛️',yMin:-1200,yMax:-600,reqDisplay:2500000,color:'#1a1a2a',accent:'#4a4a6a',guardian:'泰坦巨神',nestsY:-900,nestXs:[300,700],petNames:['泰坦幼獸','青銅巨像','守護石像','雷電巨人','大地泰坦','天空泰坦','時空泰坦','泰坦之王']},
      {name:'虛空',icon:'🕳️',yMin:-2000,yMax:-1200,reqDisplay:100000000000,color:'#05050a',accent:'#2a2a4a',guardian:'虛空吞噬者',nestsY:-1600,nestXs:[500],petNames:['虛空碎片','暗影獸','虛空之眼','混沌行者','深淵領主','虛空巨獸','終焉之龍','創世神']},
    ],
    rarities:[
      {n:'Common',c:'#9aa7b8'},{n:'Uncommon',c:'#5ec8ff'},{n:'Rare',c:'#4a7dff'},
      {n:'Epic',c:'#b56cff'},{n:'Legendary',c:'#ffb03a'},{n:'Mythic',c:'#ff4a6a'},
      {n:'Cosmic',c:'#ff6ee0'},{n:'Secret',c:'#f5f5f5'},{n:'Divine',c:'#ffe066'}
    ],
    petRarity:[
      [0,0,1,2,2,3,3,4],
      [2,3,4,4,5,7,8,8],
      [2,3,4,5,6,6,7,8],
      [2,4,5,6,6,7,8,8],
      [2,5,6,6,7,8,8,8],
      [2,4,5,6,6,7,8,8],
      [2,5,6,7,7,8,8,8],
      [6,7,7,8,8,8,8,8],
    ],
    petIncome:[
      [1,2,8,35,45,180,240,1800],
      [180,850,9500,11000,55000,8000000,85000000,100000000],
      [220,1100,15000,80000,700000,850000,15000000,130000000],
      [280,22000,120000,1200000,1500000,180000000,32000000,180000000],
      [300,28000,180000,2200000,45000000,60000000,250000000,1000000000],
      [350,35000,250000,3500000,60000000,80000000,350000000,1500000000],
      [400,50000,400000,5000000,80000000,120000000,500000000,2000000000],
      [500,80000,800000,8000000,150000000,200000000,800000000,5000000000],
    ],
  };

  // ========== 速度對照表（精確按照你的數據） ==========
  // 顯示速度 -> 真實速度（像素/秒的縮放）
  // 10 -> 10, 1K -> 40, 1M -> 90, 100M -> 140, 1B -> 180, 100B -> 240, 1T -> 300
  const SPEED_TABLE=[
    {display:10, real:10},
    {display:1000, real:40},
    {display:1000000, real:90},
    {display:100000000, real:140},
    {display:1000000000, real:180},
    {display:100000000000, real:240},
    {display:1000000000000, real:300},
  ];

  function displayToReal(display){
    if(display<=10) return 10;
    // 分段線性插值
    for(let i=0;i<SPEED_TABLE.length-1;i++){
      const a=SPEED_TABLE[i], b=SPEED_TABLE[i+1];
      if(display>=a.display && display<=b.display){
        const t=(display-a.display)/(b.display-a.display);
        return a.real + (b.real-a.real)*t;
      }
    }
    // 超過 1T 後軟上限
    return 300;
  }

  function treadmillCost(lv){
    return Math.floor(40 * Math.pow(1.8, lv-1));
  }

  // ========== 圖鑑 ==========
  const IndexData={
    discovered:new Set(),
    claimed:new Set(),
    total: WORLD.biomes.length * 8,
  };

  // ========== 存檔 ==========
  const SAVE_KEY='steal_an_egg_save_v2';

  function saveGame(){
    const data={
      version:2,
      player:{
        displaySpeed:S.player.displaySpeed,
        tsLv:S.player.tsLv,
        x:S.player.x,
        y:S.player.y,
      },
      cash:S.cash,
      pets:S.pets.map(p=>({
        name:p.name,inc:p.inc,rar:p.rar,biomeIdx:p.biomeIdx,petIdx:p.petIdx,slot:p.slot,
      })),
      biomeIdx:S.biomeIdx,
      discovered:[...IndexData.discovered],
      claimed:[...IndexData.claimed],
      cps:S.cps,
      timestamp:Date.now(),
    };
    try{
      localStorage.setItem(SAVE_KEY,JSON.stringify(data));
      showToast('💾 存檔成功！','#2a6a3a','#3a9a5a');
    }catch(e){
      showToast('❌ 存檔失敗','#8a2a2a','#aa4444');
    }
  }

  function loadGame(){
    try{
      const raw=localStorage.getItem(SAVE_KEY);
      if(!raw)return false;
      const data=JSON.parse(raw);
      if(!data||data.version!==2)return false;

      S.player.displaySpeed=data.player.displaySpeed||10;
      S.player.tsLv=data.player.tsLv||1;
      S.player.x=data.player.x||540;
      S.player.y=data.player.y||2900;
      S.cash=data.cash||0;
      S.biomeIdx=data.biomeIdx||0;
      S.cps=data.cps||0;

      S.pets=[];
      if(data.pets&&Array.isArray(data.pets)){
        for(const p of data.pets){
          S.pets.push({
            id:Math.random().toString(36).slice(2),
            name:p.name,inc:p.inc,rar:p.rar,biomeIdx:p.biomeIdx,petIdx:p.petIdx,
            x:S.farmPods[p.slot]?S.farmPods[p.slot].x:130,
            y:S.farmPods[p.slot]?S.farmPods[p.slot].y:2780,
            vx:rnd(-8,8),vy:rnd(-8,8),selected:false,
            slot:p.slot,
          });
        }
      }

      IndexData.discovered.clear();
      IndexData.claimed.clear();
      if(data.discovered)data.discovered.forEach(k=>IndexData.discovered.add(k));
      if(data.claimed)data.claimed.forEach(k=>IndexData.claimed.add(k));

      S.cps=S.pets.reduce((s,pt)=>s+pt.inc,0)*0.05;

      showToast('📂 讀取存檔成功！','#2a4a72','#5a82b8');
      return true;
    }catch(e){
      console.error('讀取失敗',e);
      return false;
    }
  }

  function showToast(msg,bg1,bg2){
    const toast=document.createElement('div');
    toast.style.cssText=`position:fixed;top:20px;left:50%;transform:translateX(-50%);
      background:linear-gradient(180deg,${bg1},${bg2});
      border:2px solid #ffd966;border-radius:12px;padding:10px 24px;
      color:#ffd966;font-weight:800;font-size:1rem;z-index:200;
      box-shadow:0 0 30px rgba(255,200,50,0.5);pointer-events:none;`;
    toast.textContent=msg;
    document.body.appendChild(toast);
    setTimeout(()=>{toast.style.opacity='0';toast.style.transition='opacity 0.5s';setTimeout(()=>toast.remove(),500)},1500);
  }

  // ========== 狀態 ==========
  const S={
    player:{
      x:540,y:2900,r:15,
      displaySpeed:10,
      trailMul:1,
      carry:null,stun:0,tsLv:1,
      knockbackTimer:0,vx:0,vy:0,
      training:false,
      trainTickTimer:0,
    },
    cash:0,eggs:[],guards:[],pets:[],
    biomeIdx:0,eggTimer:0,lastT:0,cps:0,
    selectedPet:null,
    camera:{x:540,y:2650},zoom:1.0,time:0,
    treadmill:{x:540,y:2850},
    farmPods:[
      {x:130,y:2780},{x:130,y:2900},{x:130,y:3020},
      {x:950,y:2780},{x:950,y:2900},{x:950,y:3020},
    ],
    fuseMachine:{x:990,y:3080},
    safeLineY:2500,
    totalTrainSteps:0,
    indexOpen:false,
    indexTab:0,
    panelOpen:false,
    // 手機輸入
    touchActive:false,
    touchStartX:0,
    touchStartY:0,
    touchDX:0,
    touchDY:0,
    joystickActive:false,
    joystickDX:0,
    joystickDY:0,

  // ========== 初始化 ==========
  function reset(){
    S.player={
      x:540,y:2900,r:15,
      displaySpeed:10,
      trailMul:1,carry:null,stun:0,tsLv:1,
      knockbackTimer:0,vx:0,vy:0,
      training:false,trainTickTimer:0,
    };
    S.cash=0;S.eggs=[];S.guards=[];S.pets=[];S.biomeIdx=0;S.eggTimer=0;S.cps=0;
    S.selectedPet=null;S.camera={x:540,y:2650};S.zoom=1.0;
    S.totalTrainSteps=0;
    IndexData.discovered.clear();
    IndexData.claimed.clear();
    for(let bi=0;bi<WORLD.biomes.length;bi++){
      spawnEggsForBiome(bi);
      spawnGuardsForBiome(bi);
    }
    buildIndexUI();
    updateUI();
  }

  function spawnEggsForBiome(bi){
    const b=WORLD.biomes[bi];
    for(const nx of b.nestXs){
      for(let i=0;i<3;i++){
        const sr=Math.random();
        let size='normal',mul=1,r=12;
        if(sr>0.9){size='giant';mul=4;r=20}
        else if(sr>0.65){size='huge';mul=2.2;r=16}
        const petIdx=Math.floor(Math.random()*8);
        S.eggs.push({
          x:nx+rnd(-50,50),y:b.nestsY+rnd(-35,35),
          r,size,mul,petIdx,biomeIdx:bi,collected:false,float:Math.random()*10,
        });
      }
    }
  }

  function spawnGuardsForBiome(bi){
    const b=WORLD.biomes[bi];
    const gx=b.nestXs[Math.floor(b.nestXs.length/2)];
    S.guards.push({
      x:gx,y:b.nestsY-60,r:18,
      spd:0.5+bi*0.08,
      alert:false,stun:0,hx:gx,hy:b.nestsY-60,
      biomeIdx:bi,name:b.guardian,
    });
  }

  // ========== 圖鑑 UI ==========
  function buildIndexUI(){
    const tabs=document.getElementById('indexTabs');
    tabs.innerHTML='';
    WORLD.biomes.forEach((b,i)=>{
      const tab=document.createElement('div');
      tab.className='index-tab'+(i===S.indexTab?' active':'');
      tab.textContent=b.icon+' '+b.name;
      tab.onclick=()=>{S.indexTab=i;buildIndexUI()};
      tabs.appendChild(tab);
    });

    const grid=document.getElementById('indexGrid');
    grid.innerHTML='';
    const bi=S.indexTab;
    const b=WORLD.biomes[bi];
    for(let pi=0;pi<8;pi++){
      const key=bi+'_'+pi;
      const unlocked=IndexData.discovered.has(key);
      const claimed=IndexData.claimed.has(key);
      const rar=WORLD.petRarity[bi][pi];
      const rc=WORLD.rarities[rar].c;

      const card=document.createElement('div');
      card.className='index-card '+(unlocked?'unlocked':'locked');

      const cv=document.createElement('canvas');
      cv.width=50;cv.height=50;
      const cx=cv.getContext('2d');
      if(unlocked){
        const palette=BIOME_PALETTES[bi];
        const shape=PET_SHAPES[bi][pi];
        cx.translate(25,25);
        drawPetShape(cx,shape,palette,22,performance.now()/1000,rc);
      }else{
        cx.fillStyle='#2a3a4a';
        cx.font='24px "Segoe UI"';
        cx.textAlign='center';cx.textBaseline='middle';
        cx.fillText('?',25,25);
      }
      card.appendChild(cv);

      const name=document.createElement('div');
      name.className='name';
      name.textContent=unlocked?b.petNames[pi]:'???';
      card.appendChild(name);

      const bl=document.createElement('div');
      bl.className='biome-label';
      bl.textContent=b.icon+' '+b.name;
      card.appendChild(bl);

      const rl=document.createElement('div');
      rl.className='rarity-label';
      rl.style.color=rc;
      rl.style.background=hexA(rc,0.15);
      rl.textContent=unlocked?WORLD.rarities[rar].n:'未知';
      card.appendChild(rl);

      if(unlocked&&!claimed){
        const rb=document.createElement('button');
        rb.className='reward-btn';
        rb.textContent='🎁 領取';
        rb.onclick=(e)=>{
          e.stopPropagation();
          IndexData.claimed.add(key);
          const reward=WORLD.petIncome[bi][pi]*20;
          S.cash+=reward;
          buildIndexUI();
          updateUI();
        };
        card.appendChild(rb);
      }else if(claimed){
        const rb=document.createElement('button');
        rb.className='reward-btn claimed';
        rb.textContent='✓ 已領';
        rb.disabled=true;
        card.appendChild(rb);
      }

      grid.appendChild(card);
    }

    const total=WORLD.biomes.length*8;
    document.getElementById('uiIndex').textContent=IndexData.discovered.size+'/'+total;
  }

      toast.textContent=`📖 新發現！${WORLD.biomes[bi].petNames[pi]}`;

  // ========== 擊飛效果 ==========

  // ========== 更新 ==========
  function update(dt){
    const p=S.player;
    S.time+=dt;

    if(p.knockbackTimer>0){
      p.knockbackTimer-=dt;
      p.x+=p.vx*dt;
      p.y+=p.vy*dt;
      p.vx*=0.88;p.vy*=0.88;
      p.x=clamp(p.x,20,W-20);
      p.y=clamp(p.y,-1900,3180);
      p.stun=Math.max(0,p.stun-dt);
      updateUI();
      return;
    }

    if(p.stun>0){
      p.stun=Math.max(0,p.stun-dt);
      updateUI();
      return;
    }

    const onTreadmill=dist(p.x,p.y,S.treadmill.x,S.treadmill.y)<60;
    p.training=onTreadmill;

    if(onTreadmill){
      p.trainTickTimer+=dt;
      while(p.trainTickTimer>=0.25){
        p.trainTickTimer-=0.25;
        const gain=0.8+p.tsLv*0.7+Math.sqrt(p.displaySpeed)*0.08;
        p.displaySpeed+=gain;
        S.totalTrainSteps+=gain;
      }
    }

    // ★ 移動輸入（鍵盤 + 搖桿 + 觸控）
    let dx=0,dy=0;
    if(keys['w']||keys['arrowup'])dy-=1;
    if(keys['s']||keys['arrowdown'])dy+=1;
    if(keys['a']||keys['arrowleft'])dx-=1;
    if(keys['d']||keys['arrowright'])dx+=1;

    // 虛擬搖桿輸入
    if(S.joystickActive){
      dx+=S.joystickDX;
      dy+=S.joystickDY;
    }

    // 觸控拖曳輸入
    if(S.touchActive && !S.isMobile){
      dx+=S.touchDX;
      dy+=S.touchDY;
    }

    if(dx!==0||dy!==0){
      const len=Math.hypot(dx,dy);
      dx/=len;dy/=len;
      const realSpeed=displayToReal(p.displaySpeed);
      // 真實速度直接作為像素/秒，乘以縮放係數
      let moveSpeed=realSpeed*2.5*p.trailMul;
      if(p.carry){
        const w=p.carry.size==='giant'?0.35:(p.carry.size==='huge'?0.55:0.75);
        moveSpeed*=w;
      }
      p.x+=dx*moveSpeed*dt;
      p.y+=dy*moveSpeed*dt;
      p.x=clamp(p.x,20,W-20);
      p.y=clamp(p.y,-1900,3180);
    }

    // ★ 速度不足進入高階區域 → 被該區域守衛高速擊飛
    const currentBiome=findBiomeAtY(p.y);
    if(currentBiome>0 && !canEnterBiome(currentBiome)){
      let guard=null;
      for(const g of S.guards){
        if(g.biomeIdx===currentBiome){guard=g;break}
      }
      const dirY=Math.sign(2500-p.y)||1;
      triggerKnockback(rnd(-200,200), dirY*800);
      if(guard){guard.stun=1.5;guard.alert=false}
      updateUI();
      return;
    }

    // 守衛 AI
    for(const g of S.guards){
      if(g.stun>0){g.stun-=dt;continue}
      const b=WORLD.biomes[g.biomeIdx];
      const d=dist(p.x,p.y,g.x,g.y);
      const playerInBiome=p.y>b.yMin-100&&p.y<b.yMax+100;

      let tx=g.hx,ty=g.hy;
      if(p.carry&&playerInBiome&&d<350){g.alert=true;tx=p.x;ty=p.y}
      else if(g.alert&&d>500)g.alert=false;

      if(g.alert){
        const gx=p.x-g.x,gy=p.y-g.y,len=Math.hypot(gx,gy)||1;
        // ★ 速度不足時守衛更快（3倍）
        const speedBoost=canEnterBiome(g.biomeIdx)?1:3;
        g.x+=(gx/len)*g.spd*2.0*speedBoost;
        g.y+=(gy/len)*g.spd*2.0*speedBoost;
      }else{
        if(dist(g.x,g.y,g.hx,g.hy)>40){
          const gx=g.hx-g.x,gy=g.hy-g.y,len=Math.hypot(gx,gy)||1;
          g.x+=(gx/len)*g.spd*0.5;
          g.y+=(gy/len)*g.spd*0.5;
        }else{
          g.hx=b.nestXs[Math.floor(Math.random()*b.nestXs.length)]+rnd(-60,60);
          g.hy=b.nestsY-60+rnd(-30,30);
        }
      }
      g.x=clamp(g.x,30,W-30);
      g.y=clamp(g.y,b.yMin+20,b.yMax-20);
    }

    // 撿蛋（速度不足則被守衛高速擊飛）
    if(!p.carry){
      for(const e of S.eggs){
        if(e.collected)continue;
        if(dist(p.x,p.y,e.x,e.y)<p.r+e.r+4){
          if(!canEnterBiome(e.biomeIdx)){
            let guard=null;
            for(const g of S.guards){
              if(g.biomeIdx===e.biomeIdx){guard=g;break}
            }
            triggerKnockback(rnd(-200,200), 700);
            if(guard){guard.stun=1.5;guard.alert=false}
            updateUI();
            break;
          }
          e.collected=true;
          p.carry={...e};
          for(const g of S.guards){
            if(g.biomeIdx===e.biomeIdx)g.alert=true;
          }
          updateUI();break;
        }
      }
    }

    // 回基地
    if(p.carry&&p.y>S.safeLineY){
      const egg=p.carry;
      const b=WORLD.biomes[egg.biomeIdx];
      const inc=WORLD.petIncome[egg.biomeIdx][egg.petIdx]*egg.mul;
      const rar=WORLD.petRarity[egg.biomeIdx][egg.petIdx];
      const usedSlots=new Set(S.pets.map(pt=>pt.slot).filter(s=>s!==undefined));
      let slot=-1;
      for(let i=0;i<S.farmPods.length;i++){
        if(!usedSlots.has(i)){slot=i;break}
      }
      if(slot===-1)slot=Math.floor(Math.random()*S.farmPods.length);

      S.pets.push({
        id:Math.random().toString(36).slice(2),
        name:b.petNames[egg.petIdx],
        inc,rar,biomeIdx:egg.biomeIdx,petIdx:egg.petIdx,
        x:S.farmPods[slot].x,y:S.farmPods[slot].y,
        vx:rnd(-8,8),vy:rnd(-8,8),
        selected:false,slot,
      });
      discoverPet(egg.biomeIdx,egg.petIdx);
      p.carry=null;
      for(const g of S.guards)g.alert=false;
      S.cps=S.pets.reduce((s,pt)=>s+pt.inc,0)*0.05;
      updateUI();
      saveGame();
    }

    // 守衛抓人
    for(const g of S.guards){
      if(g.stun>0)continue;
      if(dist(p.x,p.y,g.x,g.y)<p.r+g.r+6&&p.stun<=0&&p.knockbackTimer<=0){
        if(p.carry){
          const drop=p.carry;
          S.eggs.push({...drop,x:p.x+rnd(-15,15),y:p.y+rnd(-15,15),collected:false});
          p.carry=null;
        }
        const kbx=p.x-g.x,kby=p.y-g.y;
        const kblen=Math.hypot(kbx,kby)||1;
        const knockForce=350+displayToReal(p.displaySpeed)*5;
        triggerKnockback((kbx/kblen)*knockForce,(kby/kblen)*knockForce);
        g.stun=1.2;
        g.alert=false;
        updateUI();
        break;
      }
    }

    S.eggTimer+=dt;
    if(S.eggTimer>20){
      S.eggTimer=0;
      S.eggs=S.eggs.filter(e=>!e.collected);
      if(S.eggs.length<25){
        for(let bi=0;bi<WORLD.biomes.length;bi++)spawnEggsForBiome(bi);
      }
    }

    S.cash+=S.cps*dt;

    for(let i=1;i<WORLD.biomes.length;i++){
      if(S.biomeIdx<i&&p.displaySpeed>=WORLD.biomes[i].reqDisplay){
        S.biomeIdx=i;
        updateUI();
        break;
      }
    }

    for(const pt of S.pets){
      pt.x+=pt.vx*dt*3;
      pt.y+=pt.vy*dt*3;
      const pod=S.farmPods[pt.slot];
      if(pod&&dist(pt.x,pt.y,pod.x,pod.y)>45){
        pt.vx=(pod.x-pt.x)*0.02;
        pt.vy=(pod.y-pt.y)*0.02;
      }
      pt.x=clamp(pt.x,80,W-80);
      pt.y=clamp(pt.y,2700,3150);
    }

    S.camera.x+=(p.x-S.camera.x)*0.08;
    S.camera.y+=(p.y-200-S.camera.y)*0.08;

    updateUI();
  }

  function findBiomeAtY(y){
    for(let i=0;i<WORLD.biomes.length;i++){
      const b=WORLD.biomes[i];
      if(y>=b.yMin&&y<=b.yMax)return i;
    }
    if(y<0)return WORLD.biomes.length-1;
    return 0;
  }

  function canEnterBiome(biomeIdx){
    return S.player.displaySpeed>=WORLD.biomes[biomeIdx].reqDisplay;
  }

  // ========== 繪製 ==========
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#0a1018';
    ctx.fillRect(0,0,W,H);

    for(let bi=WORLD.biomes.length-1;bi>=0;bi--){
      const b=WORLD.biomes[bi];
      const p1=worldToScreen(0,b.yMax);
      const p2=worldToScreen(W,b.yMin);
      const y1=p1.y,y2=p2.y;
      if(y2>H||y1<0)continue;

      const grad=ctx.createLinearGradient(0,y2,0,y1);
      grad.addColorStop(0,shade(b.color,12));
      grad.addColorStop(0.5,b.color);
      grad.addColorStop(1,shade(b.color,-12));
      ctx.fillStyle=grad;
      ctx.fillRect(0,y2,W,y1-y2);

      ctx.font='800 14px "Segoe UI"';
      ctx.fillStyle=hexA(b.accent,0.8);
      ctx.textAlign='left';
      const reqStr=b.reqDisplay>0?'⚡'+fmtSpeed(b.reqDisplay):'新手區';
      ctx.fillText(`${b.icon} ${b.name}  ${reqStr}`,20,y2+24);
    }

    const safeY=worldToScreen(0,S.safeLineY).y;
    if(safeY>-20&&safeY<H+20){
      ctx.save();
      ctx.setLineDash([12,8]);
      ctx.strokeStyle='#ff5a5a';
      ctx.lineWidth=3;
      ctx.shadowBlur=14;
      ctx.shadowColor='#ff0000';
      ctx.beginPath();
      ctx.moveTo(0,safeY);
      ctx.lineTo(W,safeY);
      ctx.stroke();
      ctx.restore();
      ctx.font='700 12px "Segoe UI"';
      ctx.fillStyle='#ff8888';
      ctx.textAlign='center';
      ctx.fillText('⚠️ 安全線 (回到下方基地)',W/2,safeY-8);
    }

    for(const e of S.eggs)if(!e.collected)drawEgg(e);
    for(const g of S.guards)drawGuard(g);
    drawBase();
    drawPlayer();
    for(const pt of S.pets)drawFarmPet(pt);
    drawHUD();
  }

  function drawBase(){
    const p=worldToScreen(0,2700);
    const p2=worldToScreen(0,3200);
    if(p2.y<0||p.y>H)return;

    ctx.fillStyle='#1c3a24aa';
    ctx.fillRect(0,p.y,W,p2.y-p.y);
    ctx.strokeStyle='#4a7a4a';
    ctx.lineWidth=2;
    ctx.strokeRect(4,p.y,W-8,p2.y-p.y-4);

    const tm=worldToScreen(S.treadmill.x,S.treadmill.y);
    ctx.save();
    if(S.player.training){
      const gl=ctx.createRadialGradient(tm.x,tm.y,20,tm.x,tm.y,90);
      gl.addColorStop(0,'rgba(94,200,255,0.5)');
      gl.addColorStop(1,'rgba(94,200,255,0)');
      ctx.fillStyle=gl;
      ctx.beginPath();
      ctx.arc(tm.x,tm.y,90,0,7);
      ctx.fill();
    }
    ctx.shadowBlur=20;
    ctx.shadowColor='#5ec8ff88';
    ctx.fillStyle=S.player.training?'#3a5a8a':'#2a4a6a';
    ctx.beginPath();
    ctx.roundRect(tm.x-65,tm.y-35,130,70,14);
    ctx.fill();
    ctx.strokeStyle=S.player.training?'#7addff':'#5ec8ff';
    ctx.lineWidth=S.player.training?3:2;
    ctx.stroke();
    ctx.font='800 13px "Segoe UI"';
    ctx.fillStyle=S.player.training?'#cceeff':'#aaddff';
    ctx.textAlign='center';
    ctx.fillText('🏃 跑步機',tm.x,tm.y-8);
    ctx.font='700 10px "Segoe UI"';
    ctx.fillStyle='#8ab8dd';
    ctx.fillText(S.player.training?'訓練中...':'站在上面自動訓練',tm.x,tm.y+14);
    ctx.restore();

    for(const pod of S.farmPods){
      const sp=worldToScreen(pod.x,pod.y);
      if(sp.y<0||sp.y>H)continue;
      ctx.save();
      ctx.fillStyle='#2a4a2a88';
      ctx.strokeStyle='#4a7a4a88';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(sp.x,sp.y,22,0,7);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    const fm=worldToScreen(S.fuseMachine.x,S.fuseMachine.y);
    ctx.save();
    ctx.fillStyle='#3a2a4a';
    ctx.strokeStyle='#b56cff';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.roundRect(fm.x-35,fm.y-20,70,40,8);
    ctx.fill();
    ctx.stroke();
    ctx.font='700 11px "Segoe UI"';
    ctx.fillStyle='#c9a0ff';
    ctx.textAlign='center';
    ctx.fillText('🔮 合成機',fm.x,fm.y+4);
    ctx.restore();
  }

  function drawEgg(e){
    const sp=worldToScreen(e.x,e.y);
    if(sp.y<-50||sp.y>H+50)return;
    const rar=WORLD.petRarity[e.biomeIdx][e.petIdx];
    const rc=WORLD.rarities[rar].c;
    const bob=Math.sin(S.time*2+e.float)*3;
    const sc=S.zoom;

    ctx.save();
    ctx.translate(sp.x,sp.y+bob*sc);
    ctx.scale(sc,sc);

    if(rar>=3||e.size!=='normal'){
      const glow=ctx.createRadialGradient(0,0,e.r*0.5,0,0,e.r*2.4);
      glow.addColorStop(0,hexA(rc,0.5));
      glow.addColorStop(1,hexA(rc,0));
      ctx.fillStyle=glow;
      ctx.beginPath();
      ctx.arc(0,0,e.r*2.4,0,7);
      ctx.fill();
    }

    ctx.shadowBlur=10;
    ctx.shadowColor='#00000088';
    const grad=ctx.createRadialGradient(-e.r*0.3,-e.r*0.4,e.r*0.15,0,0,e.r*1.3);
    if(e.size==='giant'){grad.addColorStop(0,'#aaddff');grad.addColorStop(1,'#1a4a7a')}
    else if(e.size==='huge'){grad.addColorStop(0,'#cce0ff');grad.addColorStop(1,'#3a6a9a')}
    else{grad.addColorStop(0,'#f0f0f0');grad.addColorStop(1,'#7a7a7a')}
    ctx.beginPath();
    ctx.ellipse(0,0,e.r,e.r*1.3,0,0,7);
    ctx.fillStyle=grad;
    ctx.fill();

    ctx.shadowBlur=0;
    ctx.globalAlpha=0.5;
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.ellipse(-e.r*0.35,-e.r*0.45,e.r*0.25,e.r*0.35,-0.4,0,7);
    ctx.fill();
    ctx.globalAlpha=1;

    if(rar>=4){
      ctx.font='bold 14px "Segoe UI"';
      ctx.fillStyle=rc;
      ctx.shadowBlur=12;
      ctx.shadowColor=rc;
      ctx.textAlign='center';
      ctx.fillText('★',0,-e.r*1.6);
    }
    ctx.restore();
  }

  function drawGuard(g){
    const sp=worldToScreen(g.x,g.y);
    if(sp.y<-60||sp.y>H+60)return;
    const sc=S.zoom;
    const b=WORLD.biomes[g.biomeIdx];

    ctx.save();
    ctx.translate(sp.x,sp.y);
    ctx.scale(sc,sc);

    if(g.alert){
      const gl=ctx.createRadialGradient(0,0,g.r*0.5,0,0,g.r*2.6);
      gl.addColorStop(0,'rgba(255,80,80,0.5)');
      gl.addColorStop(1,'rgba(255,80,80,0)');
      ctx.fillStyle=gl;
      ctx.beginPath();
      ctx.arc(0,0,g.r*2.6,0,7);
      ctx.fill();
    }

    ctx.shadowBlur=14;
    ctx.shadowColor='#000a';
    const grad=ctx.createRadialGradient(-g.r*0.3,-g.r*0.3,g.r*0.2,0,0,g.r*1.2);
    if(g.alert){grad.addColorStop(0,'#ff7070');grad.addColorStop(1,'#5a1010')}
    else{grad.addColorStop(0,b.accent);grad.addColorStop(1,'#1a0a0a')}
    ctx.beginPath();
    ctx.arc(0,0,g.r,0,7);
    ctx.fillStyle=grad;
    ctx.fill();
    ctx.strokeStyle=g.alert?'#ffcc00':'#aa4444';
    ctx.lineWidth=g.alert?4:2;
    ctx.stroke();

    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(-6,-3,4.5,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(6,-3,4.5,0,7);ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(-6,-3,2.2,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(6,-3,2.2,0,7);ctx.fill();

    if(g.alert){
      ctx.font='900 22px "Segoe UI"';
      ctx.fillStyle='#ffaa00';
      ctx.shadowBlur=14;
      ctx.shadowColor='#ff8800';
      ctx.textAlign='center';
      ctx.fillText('!',0,-g.r-8);
    }
    ctx.restore();
  }

  function drawPlayer(){
    const p=S.player;
    const sp=worldToScreen(p.x,p.y);
    const sc=S.zoom;

    ctx.save();
    ctx.translate(sp.x,sp.y);
    ctx.scale(sc,sc);

    if(p.stun>0)ctx.globalAlpha=0.5+Math.sin(S.time*20)*0.25;

    const gl=ctx.createRadialGradient(0,0,p.r*0.6,0,0,p.r*2);
    gl.addColorStop(0,'rgba(100,180,255,0.5)');
    gl.addColorStop(1,'rgba(100,180,255,0)');
    ctx.fillStyle=gl;
    ctx.beginPath();
    ctx.arc(0,0,p.r*2,0,7);
    ctx.fill();

    ctx.shadowBlur=16;
    ctx.shadowColor='#000c';
    const grad=ctx.createRadialGradient(-p.r*0.3,-p.r*0.3,p.r*0.2,0,0,p.r*1.2);
    grad.addColorStop(0,'#7ad0ff');
    grad.addColorStop(1,'#1a4a8a');
    ctx.beginPath();
    ctx.arc(0,0,p.r,0,7);
    ctx.fillStyle=grad;
    ctx.fill();
    ctx.strokeStyle='#aaddff';
    ctx.lineWidth=3;
    ctx.stroke();

    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(-5,-3,4.5,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(5,-3,4.5,0,7);ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(-5,-3,2,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(5,-3,2,0,7);ctx.fill();

    if(p.carry){
      ctx.shadowBlur=18;
      ctx.shadowColor='#ffaa00';
      const cg=ctx.createRadialGradient(-3,-24,3,0,-18,15);
      cg.addColorStop(0,'#ffe68f');
      cg.addColorStop(1,'#b8860b');
      ctx.beginPath();
      ctx.ellipse(0,-20,12,16,0,0,7);
      ctx.fillStyle=cg;
      ctx.fill();
      ctx.shadowBlur=0;
      ctx.font='12px "Segoe UI"';
      ctx.fillStyle='#fff';
      ctx.fillText('★',-4,-24);
    }
    ctx.restore();
  }

  function drawFarmPet(pt){
    const sp=worldToScreen(pt.x,pt.y);
    if(sp.y<-30||sp.y>H+30)return;
    const sc=S.zoom;
    const rc=WORLD.rarities[pt.rar].c;

    ctx.save();
    ctx.translate(sp.x,sp.y);
    ctx.scale(sc,sc);

    if(pt.selected){
      const gl=ctx.createRadialGradient(0,0,8,0,0,40);
      gl.addColorStop(0,hexA(rc,0.7));
      gl.addColorStop(1,hexA(rc,0));
      ctx.fillStyle=gl;
      ctx.beginPath();
      ctx.arc(0,0,40,0,7);
      ctx.fill();
    }

    const palette=BIOME_PALETTES[pt.biomeIdx];
    const shape=PET_SHAPES[pt.biomeIdx][pt.petIdx];
    drawPetShape(ctx,shape,palette,20,S.time,rc);

    if(pt.rar>=5){
      ctx.strokeStyle=rc;
      ctx.lineWidth=1.5;
      ctx.shadowBlur=10;
      ctx.shadowColor=rc;
      ctx.beginPath();
      ctx.arc(0,0,24,0,7);
      ctx.stroke();
      ctx.shadowBlur=0;
    }

    ctx.restore();

    if(sc>0.7){
      ctx.font='600 10px "Segoe UI"';
      ctx.textAlign='center';
      ctx.fillStyle='#cfe2ff';
      ctx.shadowBlur=4;
      ctx.shadowColor='#000';
      ctx.fillText(pt.name.slice(0,8),sp.x,sp.y+30*sc);
      ctx.font='700 9px "Segoe UI"';
      ctx.fillStyle='#9fd89f';
      ctx.fillText('$'+fmt(pt.inc)+'/s',sp.x,sp.y+42*sc);
      ctx.shadowBlur=0;
    }
  }

  function drawHUD(){
    ctx.font='700 11px "Segoe UI"';
    ctx.fillStyle='#5a7a9a';
    ctx.textAlign='left';
    ctx.fillText(`📍 Y:${Math.floor(S.player.y)}  ${S.player.carry?'🥚攜帶中':''}`,16,H-16);
    ctx.textAlign='right';
    ctx.fillText(`🔍 ${(S.zoom*100).toFixed(0)}%`,W-16,H-16);

    if(S.player.knockbackTimer>0){
      ctx.textAlign='center';
      ctx.font='900 28px "Segoe UI"';
      ctx.fillStyle='#ff6a6a';
      ctx.shadowBlur=20;
      ctx.shadowColor='#ff0000';
      ctx.fillText('💥 被擊飛!',W/2,H/2-100);
      ctx.shadowBlur=0;
    }

    if(S.player.training){
      ctx.textAlign='center';
      ctx.font='900 24px "Segoe UI"';
      ctx.fillStyle='#7affb0';
      ctx.shadowBlur=18;
      ctx.shadowColor='#00ff88';
      ctx.fillText('⚡ 訓練中...',W/2,60);
      ctx.shadowBlur=0;
    }
  }

  // ========== 手機觸控/搖桿 ==========
  function initTouchControls(){
    // 檢測是否為手機
    S.isMobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||
                ('ontouchstart' in window && window.innerWidth<1024);

    if(S.isMobile){
      const joystick=document.getElementById('joystickZone');
      const knob=document.getElementById('joystickKnob');

      let joystickCenter={x:0,y:0};
      let joystickActive=false;

      const startJoystick=(e)=>{
        e.preventDefault();
        const touch=e.touches?e.touches[0]:e;
        const rect=joystick.getBoundingClientRect();
        joystickCenter={x:rect.left+rect.width/2,y:rect.top+rect.height/2};
        joystickActive=true;
        S.joystickActive=true;
        updateJoystick(touch.clientX,touch.clientY);
      };

      const updateJoystick=(cx,cy)=>{
        if(!joystickActive)return;
        const dx=cx-joystickCenter.x;
        const dy=cy-joystickCenter.y;
        const len=Math.hypot(dx,dy);
        const maxDist=40;
        const clampedLen=Math.min(len,maxDist);
        const nx=len>0?dx/len:0;
        const ny=len>0?dy/len:0;
        const moveX=nx*clampedLen;
        const moveY=ny*clampedLen;
        knob.style.transform=`translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px))`;
        S.joystickDX=nx*(clampedLen/maxDist);
        S.joystickDY=ny*(clampedLen/maxDist);
      };

      const endJoystick=()=>{
        joystickActive=false;
        S.joystickActive=false;
        S.joystickDX=0;
        S.joystickDY=0;
        knob.style.transform='translate(-50%,-50%)';
      };

      joystick.addEventListener('touchstart',startJoystick,{passive:false});
      joystick.addEventListener('touchmove',(e)=>{
        e.preventDefault();
        if(!joystickActive)return;
        updateJoystick(e.touches[0].clientX,e.touches[0].clientY);
      },{passive:false});
      joystick.addEventListener('touchend',endJoystick);
      joystick.addEventListener('touchcancel',endJoystick);

      // 顯示搖桿
      joystick.classList.add('active');

      // 畫布上的觸控點擊用於選取寵物/點擊按鈕
      c.addEventListener('touchstart',(e)=>{
        const touch=e.touches[0];
        const rect=c.getBoundingClientRect();
        const sx=(touch.clientX-rect.left)*(W/rect.width);
        const sy=(touch.clientY-rect.top)*(H/rect.height);
        const w=screenToWorld(sx,sy);

        for(const pt of S.pets){
          if(dist(w.x,w.y,pt.x,pt.y)<40){
            openPetPanel(pt);
            e.preventDefault();
            return;
          }
        }

        if(S.panelOpen){
          closePetPanel();
          e.preventDefault();
        }
      },{passive:false});
    } else {
      // 桌面：拖曳畫布移動
      let dragging=false;
      let lastX=0,lastY=0;

      c.addEventListener('mousedown',(e)=>{
        const rect=c.getBoundingClientRect();
        const sx=(e.clientX-rect.left)*(W/rect.width);
        const sy=(e.clientY-rect.top)*(H/rect.height);
        const w=screenToWorld(sx,sy);

        for(const pt of S.pets){
          if(dist(w.x,w.y,pt.x,pt.y)<30){
            openPetPanel(pt);
            return;
          }
        }

        if(S.panelOpen){
          closePetPanel();
          return;
        }

        dragging=true;
        lastX=e.clientX;
        lastY=e.clientY;
      });

      c.addEventListener('mousemove',(e)=>{
        if(!dragging)return;
        const rect=c.getBoundingClientRect();
        const scaleX=W/rect.width;
        const scaleY=H/rect.height;
        const dx=(e.clientX-lastX)*scaleX;
        const dy=(e.clientY-lastY)*scaleY;
        // 拖曳移動相機（不是玩家）
        S.camera.x-=dx/S.zoom;
        S.camera.y-=dy/S.zoom;
        lastX=e.clientX;
        lastY=e.clientY;
      });

      c.addEventListener('mouseup',()=>{dragging=false});
      c.addEventListener('mouseleave',()=>{dragging=false});
    }
  }

  // ========== 鍵盤 ==========
  window.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    keys[k]=true;
    if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){
      e.preventDefault();
    }
    if(k==='escape'){
      if(S.panelOpen)closePetPanel();
      if(S.indexOpen){S.indexOpen=false;document.getElementById('indexPanel').classList.remove('open')}
    }
  });
  window.addEventListener('keyup',e=>{
    keys[e.key.toLowerCase()]=false;
  });

  c.addEventListener('wheel',e=>{
    e.preventDefault();
    S.zoom=clamp(S.zoom*(e.deltaY>0?0.92:1.08),0.4,2.5);
  },{passive:false});

  // ========== UI ==========
  function updateUI(){
    const p=S.player;
    document.getElementById('uiSpeed').textContent=fmtSpeed(p.displaySpeed);
    document.getElementById('uiCash').textContent=fmt(S.cash);
    document.getElementById('uiEgg').textContent=p.carry?'1':'0';
    document.getElementById('lvTxt').textContent=p.tsLv;
    document.getElementById('costTxt').textContent='$'+fmt(treadmillCost(p.tsLv));

    const b=WORLD.biomes[S.biomeIdx];
    document.getElementById('uiBiome').textContent=b.name;
    document.getElementById('uiBiomeIcon').textContent=b.icon;

    document.getElementById('trainStatus').textContent=p.training?'⚡ 訓練中！速度快速累積':'🚶 未在訓練（站上跑步機）';

    const total=WORLD.biomes.length*8;
    document.getElementById('uiIndex').textContent=IndexData.discovered.size+'/'+total;

    document.getElementById('btnUp').disabled=S.cash<treadmillCost(p.tsLv);
    document.getElementById('btnSellSelected').disabled=!S.selectedPet;
  }

  document.getElementById('btnUp').addEventListener('click',()=>{
    const p=S.player;
    const cost=treadmillCost(p.tsLv);
    if(S.cash>=cost){S.cash-=cost;p.tsLv++;updateUI();saveGame()}
  });

  document.getElementById('btnIndex').addEventListener('click',()=>{
    S.indexOpen=true;
    document.getElementById('indexPanel').classList.add('open');
    buildIndexUI();
  });

  document.getElementById('btnCloseIndex').addEventListener('click',()=>{
    S.indexOpen=false;
    document.getElementById('indexPanel').classList.remove('open');
  });

  document.getElementById('btnEquip').addEventListener('click',()=>{
    if(S.pets.length===0)return;
    S.cps=S.pets.reduce((s,pt)=>s+pt.inc,0)*0.05;
    updateUI();
  });

  document.getElementById('btnSellSelected').addEventListener('click',()=>{
    sellSelectedPet();
  });

  document.getElementById('btnSellPanel').addEventListener('click',()=>{
    sellSelectedPet();
  });

  document.getElementById('btnClosePanel').addEventListener('click',()=>{
    closePetPanel();
  });

  document.getElementById('btnSave').addEventListener('click',()=>{
    saveGame();
  });

  // ========== 主循環 ==========
  function loop(now){
    const dt=Math.min(0.05,(now-(S.lastT||now))/1000);
    S.lastT=now;
    if(dt>0)update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // 啟動
  reset();
  const loaded=loadGame();
  if(loaded){
    S.cps=S.pets.reduce((s,pt)=>s+pt.inc,0)*0.05;
    S.camera.x=S.player.x;
    S.camera.y=S.player.y-200;
    buildIndexUI();
    updateUI();
  } else {
    setTimeout(saveGame,1000);
  }
  initTouchControls();
  requestAnimationFrame(loop);
  setInterval(updateUI,150);

  setInterval(()=>{
    if(S.indexOpen)buildIndexUI();
  },200);

  setInterval(saveGame,10000);

  window.addEventListener('beforeunload',saveGame);
})();
</script>
