
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>綠色小怪獸冒險 | Raingod</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    user-select: none;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(#64c6ff, #d8f6ff 78%);
}

#title {
    position: absolute;
    z-index: 20;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: #174a70;
    font-size: 24px;
    font-weight: 900;
    white-space: nowrap;
    text-shadow: 0 2px white;
}

#help {
    position: absolute;
    z-index: 20;
    top: 55px;
    left: 50%;
    transform: translateX(-50%);
    color: #174a70;
    font-size: 13px;
    white-space: nowrap;
}

#info {
    position: absolute;
    z-index: 20;
    top: 84px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 15px;
    border-radius: 20px;
    background: #ffffffdf;
    color: #174a70;
    font-weight: bold;
    white-space: nowrap;
}

#restart {
    position: absolute;
    z-index: 30;
    top: 15px;
    right: 15px;
    border: 0;
    border-radius: 12px;
    padding: 11px 15px;
    color: white;
    background: #1675c1;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.cloud {
    position: absolute;
    width: 110px;
    height: 35px;
    border-radius: 40px;
    background: white;
    opacity: .9;
    animation: cloudMove 24s linear infinite;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    bottom: 0;
    border-radius: 50%;
    background: white;
}

.cloud::before {
    width: 45px;
    height: 45px;
    left: 15px;
}

.cloud::after {
    width: 55px;
    height: 55px;
    right: 15px;
}

@keyframes cloudMove {
    from { translate: -150px 0; }
    to { translate: calc(100vw + 180px) 0; }
}

#farGrass {
    position: absolute;
    bottom: 60px;
    width: 100%;
    height: 100px;
    background: #91dc79;
    border-radius: 50% 50% 0 0 / 25% 25% 0 0;
}

#ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 85px;
    background: linear-gradient(#61c94c, #36a83d);
    border-top: 7px solid #318e38;
}

#ground::after {
    content: "";
    position: absolute;
    top: 13px;
    width: 100%;
    height: 8px;
    background: repeating-linear-gradient(
        90deg, transparent 0 25px, #a1e77e 25px 40px
    );
}

/* 飛行雲朵 */
#rideCloud {
    position: absolute;
    display: none;
    width: 210px;
    height: 145px;
    z-index: 4;
    pointer-events: none;
    overflow: visible;
    filter: drop-shadow(0 7px 3px #31516b30);
    will-change: left, bottom;
}

#rideCloud svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
}

/* 雲朵浮動 */
#rideCloud.flying {
    display: block;
    animation: cloudBob .65s ease-in-out infinite alternate;
}

@keyframes cloudBob {
    from { margin-top: -2px; }
    to { margin-top: 4px; }
}

/* 雲朵飛行時的眼睛發光 */
#rideCloud.flying .evilEyes {
    animation: eyeGlow 1.2s ease-in-out infinite alternate;
}

@keyframes eyeGlow {
    from { filter: drop-shadow(0 0 0 transparent); }
    to { filter: drop-shadow(0 0 4px #ff2638); }
}

/* 怪獸 */
#monster {
    position: absolute;
    width: 260px;
    height: 195px;
    left: 50px;
    bottom: 65px;
    z-index: 5;
    transform-origin: 50% 100%;
    will-change: left, bottom;
}

#monster svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

.monster {
    fill: #24ed32;
    stroke: #000;
    stroke-width: 1.1;
    stroke-linejoin: round;
    stroke-linecap: round;
}

/* 腳部 */
.leg {
    transform-box: view-box;
}

#leg1 { transform-origin: 126px 245px; }
#leg2 { transform-origin: 155px 253px; }
#leg3 { transform-origin: 191px 251px; }
#leg4 { transform-origin: 220px 244px; }

.walking #leg1,
.walking #leg3 {
    animation: stepA .28s ease-in-out infinite alternate;
}

.walking #leg2,
.walking #leg4 {
    animation: stepB .28s ease-in-out infinite alternate;
}

@keyframes stepA {
    from { transform: rotate(-20deg) translateY(0); }
    to { transform: rotate(20deg) translateY(-4px); }
}

@keyframes stepB {
    from { transform: rotate(20deg) translateY(-4px); }
    to { transform: rotate(-20deg) translateY(0); }
}

/* 身體 */
#bodyGroup {
    transform-box: view-box;
    transform-origin: 190px 220px;
}

.walking #bodyGroup {
    animation: bodyRun .28s ease-in-out infinite alternate;
}

@keyframes bodyRun {
    from { transform: translateY(1px) rotate(-1deg); }
    to { transform: translateY(-4px) rotate(1deg); }
}

/* 尾巴 */
#tail {
    transform-box: view-box;
    transform-origin: 120px 185px;
}

.walking #tail {
    animation: tailRun .28s ease-in-out infinite alternate;
}

#monster:not(.walking):not(.riding):not(.airborne) #tail {
    animation: tailIdle 1.5s ease-in-out infinite alternate;
}

@keyframes tailRun {
    from { transform: rotate(-12deg); }
    to { transform: rotate(12deg); }
}

@keyframes tailIdle {
    from { transform: rotate(-4deg); }
    to { transform: rotate(5deg); }
}

/* 待機呼吸 */
#monster:not(.walking):not(.riding):not(.airborne) #bodyGroup {
    animation: breathe 1.4s ease-in-out infinite;
}

@keyframes breathe {
    0%, 100% { transform: translateY(0) scaleY(1); }
    50% { transform: translateY(-2px) scaleY(1.015); }
}

/* 空中收腳 */
.airborne #leg1,
.airborne #leg3 {
    transform: rotate(-12deg) translateY(-5px);
}

.airborne #leg2,
.airborne #leg4 {
    transform: rotate(12deg) translateY(-5px);
}

/* 坐在雲上 */
#monster.riding #bodyGroup {
    animation: ridingBody .6s ease-in-out infinite alternate;
}

#monster.riding #tail {
    animation: ridingTail .8s ease-in-out infinite alternate;
}

#monster.riding #leg1,
#monster.riding #leg2,
#monster.riding #leg3,
#monster.riding #leg4 {
    animation: ridingLeg .6s ease-in-out infinite alternate;
}

@keyframes ridingBody {
    from { transform: translateY(0) rotate(-1deg); }
    to { transform: translateY(-3px) rotate(1deg); }
}

@keyframes ridingTail {
    from { transform: rotate(-8deg); }
    to { transform: rotate(9deg); }
}

@keyframes ridingLeg {
    from { transform: rotate(-5deg); }
    to { transform: rotate(7deg); }
}

/* 落地緩衝 */
#monster.landing {
    animation: land .16s ease-out;
}

@keyframes land {
    0% { scale: 1 1; }
    45% { scale: 1.04 .91; }
    100% { scale: 1 1; }
}

/* 手機按鈕 */
#mobileControls {
    position: absolute;
    z-index: 30;
    bottom: 100px;
    left: 0;
    width: 100%;
    padding: 0 20px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
}

.controlGroup {
    display: flex;
    gap: 10px;
    pointer-events: auto;
}

.control {
    width: 56px;
    height: 56px;
    border: 2px solid white;
    border-radius: 16px;
    background: #1768aacc;
    color: white;
    font-size: 24px;
    font-weight: bold;
    touch-action: none;
}

#flyBtn {
    width: auto;
    padding: 0 15px;
    font-size: 15px;
    background: #7550b9;
}

@media (min-width: 800px) {
    #mobileControls { opacity: .45; }
    #mobileControls:hover { opacity: 1; }
}

@media (max-width: 600px) {
    #title { top: 12px; font-size: 18px; }
    #help { top: 42px; font-size: 11px; }
    #info { top: 69px; font-size: 11px; }
    #restart { top: 10px; right: 8px; padding: 8px; font-size: 11px; }
    #monster { width: 210px; height: 157.5px; }
    #rideCloud { width: 175px; height: 121px; }
    #mobileControls { bottom: 90px; padding: 0 10px; }
    .controlGroup { gap: 6px; }
    .control { width: 47px; height: 47px; font-size: 21px; }
    #flyBtn { padding: 0 9px; font-size: 12px; }
}
</style>
</head>

<body>
<div id="game">

    <div id="title">🟢 綠色小怪獸冒險</div>

    <div id="help">
        ← → 移動　｜　↑ ↓ 飛行　｜　空白鍵跳躍　｜　F 騎雲
    </div>

    <div id="info">
        狀態：<span id="status">待機中</span>
    </div>

    <button id="restart">重新開始 ↻</button>

    <div class="cloud" style="top:22%;left:10%"></div>
    <div class="cloud" style="top:35%;left:60%;animation-delay:-9s"></div>
    <div class="cloud" style="top:15%;left:80%;animation-delay:-4s"></div>

    <div id="farGrass"></div>
    <div id="ground"></div>

    <!-- 邪惡雲朵坐騎 -->
    <div id="rideCloud">
        <svg viewBox="0 0 440 300"
             xmlns="http://www.w3.org/2000/svg">

            <!-- 灰色雲朵主體 -->
            <path
                d="M 67,221
                   C 32,219 17,191 23,158
                   C 27,130 42,112 65,105
                   C 52,73 76,43 108,40
                   C 122,9 160,0 190,13
                   C 211,22 224,33 234,49
                   C 245,35 263,36 275,49
                   C 307,44 337,63 341,91
                   C 365,99 378,124 369,146
                   C 393,166 389,197 369,214
                   C 365,241 338,254 309,246
                   C 293,274 263,280 236,262
                   C 211,287 174,288 150,268
                   C 127,281 97,269 89,248
                   C 77,243 70,234 67,221 Z"
                fill="#66666f"/>

            <!-- 左眼：紅色邪惡眼睛 -->
            <path class="evilEyes"
                d="M 126,96
                   Q 110,139 122,164
                   Q 139,184 187,170 Z"
                fill="#e00017"
                stroke="#080808"
                stroke-width="5"
                stroke-linejoin="round"/>

            <!-- 右眼 -->
            <path class="evilEyes"
                d="M 314,96
                   Q 330,139 318,164
                   Q 301,184 253,170 Z"
                fill="#e00017"
                stroke="#080808"
                stroke-width="5"
                stroke-linejoin="round"/>
        </svg>
    </div>

    <!-- 綠色小怪獸 -->
    <div id="monster">
        <svg viewBox="0 0 400 300"
             xmlns="http://www.w3.org/2000/svg">

            <path id="tail" class="monster"
                d="M 105,219
                   Q 99,207 101,186
                   L 104,136
                   Q 104,122 118,106
                   L 157,71
                   L 186,48
                   Q 194,41 202,47
                   Q 210,52 201,61
                   L 164,94
                   Q 145,110 136,124
                   Q 130,135 130,149
                   L 129,190 Z"/>

            <g id="legs">
                <path id="leg1" class="monster"
                    d="M 115,238
                       C 108,247 106,259 110,268
                       C 115,278 126,279 132,266
                       L 139,245 Z"/>

                <path id="leg2" class="monster"
                    d="M 145,250
                       C 139,262 141,276 150,283
                       C 158,288 167,280 169,265
                       L 168,248 Z"/>

                <path id="leg3" class="monster"
                    d="M 180,251
                       C 174,264 179,278 188,283
                       C 198,287 204,275 203,259
                       L 199,246 Z"/>

                <path id="leg4" class="monster"
                    d="M 211,243
                       C 205,255 205,268 213,277
                       C 222,284 233,274 234,259
                       L 230,238 Z"/>
            </g>

            <g id="bodyGroup">
                <ellipse class="monster"
                    cx="170" cy="221"
                    rx="67" ry="44"
                    transform="rotate(-5 170 221)"/>
            </g>

            <g id="headGroup">
                <path class="monster"
                    d="M 207,137 L 214,91 L 233,125 Z"/>

                <path class="monster"
                    d="M 250,124 L 278,92 L 282,140 Z"/>

                <circle class="monster"
                    cx="241.5" cy="177" r="55"/>

                <circle id="eye"
                    cx="251.5" cy="168.5"
                    r="6" fill="#000"/>

                <path
                    d="M 247,194
                       L 257,201
                       L 264,195
                       L 273,201
                       L 280,195
                       L 286,199"
                    fill="none"
                    stroke="#000"
                    stroke-width="1.1"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>
            </g>
        </svg>
    </div>

    <div id="mobileControls">
        <div class="controlGroup">
            <button class="control" id="leftBtn">←</button>
            <button class="control" id="rightBtn">→</button>
        </div>

        <div class="controlGroup">
            <button class="control" id="upBtn">↑</button>
            <button class="control" id="downBtn">↓</button>
            <button class="control" id="flyBtn">☁ 飛行</button>
        </div>
    </div>
</div>

<script>
const game = document.getElementById("game");
const monster = document.getElementById("monster");
const cloud = document.getElementById("rideCloud");
const statusText = document.getElementById("status");

const keys = {
    left: false,
    right: false,
    up: false,
    down: false
};

const player = {
    x: 50,
    y: 0,
    vy: 0,
    speed: 300,
    jumpPower: 650,
    gravity: 1700,
    onGround: true,
    facing: 1,
    flying: false
};

const groundHeight = 65;
let lastTime = performance.now();
let landingTimer = null;

/*
  雲朵模式下，玩家的 y 代表
  怪獸底部距離地面的高度。
*/
function startFlying() {
    if (player.flying) return;

    player.flying = true;
    player.vy = 0;
    player.onGround = false;

    // 從地面升起一段高度
    player.y = Math.max(player.y, 155);

    monster.classList.remove("walking", "airborne", "landing");
    monster.classList.add("riding");

    cloud.classList.add("flying");
    cloud.style.display = "block";

    statusText.textContent = "邪惡雲朵載著你飛行！";
}

function stopFlying() {
    if (!player.flying) return;

    player.flying = false;
    player.vy = 0;

    cloud.classList.remove("flying");
    cloud.style.display = "none";

    monster.classList.remove("riding");

    // 平穩下降回地面
    player.y = Math.max(0, player.y);
    player.vy = -80;
    player.onGround = false;

    statusText.textContent = "準備降落";
}

function toggleFlying() {
    if (player.flying) {
        stopFlying();
    } else {
        startFlying();
    }
}

function jump() {
    if (player.flying) {
        // 飛行時空白鍵加速上升
        player.y += 35;
        player.y = Math.min(player.y, game.clientHeight - 300);
        return;
    }

    if (!player.onGround) return;

    player.vy = player.jumpPower;
    player.onGround = false;

    monster.classList.remove("walking", "riding");
    monster.classList.add("airborne");

    statusText.textContent = "跳躍中！";
}

function setKey(code, down) {
    if (code === "ArrowLeft" || code === "KeyA") {
        keys.left = down;
    }

    if (code === "ArrowRight" || code === "KeyD") {
        keys.right = down;
    }

    if (code === "ArrowUp" || code === "KeyW") {
        keys.up = down;
    }

    if (code === "ArrowDown" || code === "KeyS") {
        keys.down = down;
    }
}

document.addEventListener("keydown", event => {
    if ([
        "ArrowLeft", "ArrowRight", "ArrowUp",
        "ArrowDown", "Space"
    ].includes(event.code)) {
        event.preventDefault();
    }

    setKey(event.code, true);

    if (event.code === "KeyF" && !event.repeat) {
        toggleFlying();
    }

    if (
        ["Space", "ArrowUp", "KeyW"].includes(event.code)
        && !event.repeat
    ) {
        jump();
    }
});

document.addEventListener("keyup", event => {
    setKey(event.code, false);
});

window.addEventListener("blur", () => {
    Object.keys(keys).forEach(key => keys[key] = false);
});

function bindHoldButton(button, keyName) {
    button.addEventListener("pointerdown", event => {
        event.preventDefault();
        keys[keyName] = true;

        try {
            button.setPointerCapture(event.pointerId);
        } catch (_) {}
    });

    function release() {
        keys[keyName] = false;
    }

    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("lostpointercapture", release);
}

bindHoldButton(document.getElementById("leftBtn"), "left");
bindHoldButton(document.getElementById("rightBtn"), "right");
bindHoldButton(document.getElementById("upBtn"), "up");
bindHoldButton(document.getElementById("downBtn"), "down");

document.getElementById("flyBtn").addEventListener(
    "pointerdown",
    event => {
        event.preventDefault();
        toggleFlying();
    }
);

function update(dt) {
    const gameWidth = game.clientWidth;
    const gameHeight = game.clientHeight;

    const monsterWidth = monster.offsetWidth;
    const maxX = Math.max(0, gameWidth - monsterWidth);

    let direction = 0;

    if (keys.left) direction--;
    if (keys.right) direction++;

    // 左右移動
    if (direction !== 0) {
        player.x += direction * player.speed * dt;
        player.facing = direction;
    }

    player.x = Math.max(0, Math.min(maxX, player.x));

    if (player.flying) {
        // 飛行時上下移動
        if (keys.up) {
            player.y += player.speed * dt;
        }

        if (keys.down) {
            player.y -= player.speed * dt;
        }

        // 限制飛行高度，避免飛出畫面
        const maxHeight = Math.max(
            100,
            gameHeight - groundHeight - monster.offsetHeight - 20
        );

        player.y = Math.max(0, Math.min(maxHeight, player.y));

        // 飛行中的小怪獸
        monster.classList.add("riding");
        monster.classList.remove("walking", "airborne");

        // 雲朵位於怪獸腳下
        cloud.style.left =
            (player.x + monsterWidth / 2 - cloud.offsetWidth / 2)
            + "px";

        cloud.style.bottom =
            (groundHeight + player.y - cloud.offsetHeight + 7)
            + "px";

        cloud.style.display = "block";

        if (direction !== 0 || keys.up || keys.down) {
            statusText.textContent = "騎著邪惡雲朵飛行中 ☁";
        } else {
            statusText.textContent = "乘坐雲朵中 ☁";
        }
    } else {
        // 正常跳躍與重力
        if (!player.onGround) {
            const previousY = player.y;

            player.vy -= player.gravity * dt;
            player.y += player.vy * dt;

            if (player.y <= 0 && previousY >= 0) {
                player.y = 0;
                player.vy = 0;
                player.onGround = true;

                monster.classList.remove("airborne");
                monster.classList.remove("landing");

                void monster.offsetWidth;
                monster.classList.add("landing");

                clearTimeout(landingTimer);
                landingTimer = setTimeout(() => {
                    monster.classList.remove("landing");
                }, 180);
            }
        }

        cloud.style.display = "none";

        if (player.onGround && direction !== 0) {
            monster.classList.add("walking");
            statusText.textContent = "走路中";
        } else if (!player.onGround) {
            monster.classList.remove("walking");
            statusText.textContent =
                player.vy > 0 ? "跳躍中！" : "落下中";
        } else {
            monster.classList.remove("walking");
            statusText.textContent = "待機中";
        }
    }

    // 更新怪獸位置
    monster.style.left = player.x + "px";
    monster.style.bottom = (groundHeight + player.y) + "px";

    // 左右翻轉
    monster.style.transform =
        player.facing < 0 ? "scaleX(-1)" : "scaleX(1)";
}

function gameLoop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.033);
    lastTime = now;

    update(dt);
    requestAnimationFrame(gameLoop);
}

function restartGame() {
    player.x = 50;
    player.y = 0;
    player.vy = 0;
    player.onGround = true;
    player.facing = 1;
    player.flying = false;

    Object.keys(keys).forEach(key => keys[key] = false);

    clearTimeout(landingTimer);

    monster.classList.remove(
        "walking", "airborne", "riding", "landing"
    );

    monster.style.left = player.x + "px";
    monster.style.bottom = groundHeight + "px";
    monster.style.transform = "scaleX(1)";

    cloud.classList.remove("flying");
    cloud.style.display = "none";

    statusText.textContent = "待機中";
}

document.getElementById("restart").addEventListener(
    "click",
    restartGame
);

window.addEventListener("resize", () => {
    player.x = Math.max(
        0,
        Math.min(player.x, game.clientWidth - monster.offsetWidth)
    );
});

restartGame();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
