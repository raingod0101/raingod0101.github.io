<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🥚 Steal An Egg · 縱向地圖版</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
    body {
      background: radial-gradient(ellipse at 30% 20%, #151f35, #05080f);
      min-height:100vh; display:flex; justify-content:center; align-items:center;
      font-family:'Segoe UI', system-ui, sans-serif; padding:16px;
    }
    .game {
      background: linear-gradient(180deg, #0e1524, #070b13);
      border-radius:24px; padding:14px;
      box-shadow:0 30px 60px rgba(0,0,0,.9), 0 0 0 1px #253349 inset, 0 0 0 3px #060a10;
      max-width:1000px; width:100%;
    }
    canvas {
      display:block; width:100%; height:auto; border-radius:16px;
      box-shadow:0 0 0 2px #0a111c, 0 16px 40px rgba(0,0,0,.8);
      cursor:pointer; background:#0a1018;
    }
    .hud {
      display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between;
      align-items:center; padding:12px 4px 4px;
    }
    .stats { display:flex; flex-wrap:wrap; gap:8px; }
    .stat {
      display:flex; align-items:center; gap:6px;
      background: linear-gradient(180deg,#182338,#0d1523);
      border:1px solid #2c3f5c; border-radius:12px;
      padding:7px 14px; color:#dbe7ff; font-weight:700; font-size:.9rem;
      box-shadow:0 3px 0 #05090f, inset 0 1px 0 #3a5275;
    }
    .stat b { color:#fff; font-size:1rem; letter-spacing:.3px; }
    .btns { display:flex; flex-wrap:wrap; gap:8px; }
    button {
      background: linear-gradient(180deg,#2b4a72,#16273d);
      border:1px solid #43689a; border-radius:12px;
      padding:9px 18px; color:#eaf3ff; font-weight:800; font-size:.82rem;
      cursor:pointer; letter-spacing:.4px;
      box-shadow:0 4px 0 #081019, inset 0 1px 0 #5a82b8;
      transition:transform .06s, box-shadow .06s;
    }
    button:hover { filter:brightness(1.15); }
    button:active { transform:translateY(3px); box-shadow:0 1px 0 #081019, inset 0 1px 0 #5a82b8; }
    button:disabled { opacity:.35; transform:translateY(2px); box-shadow:0 2px 0 #081019; cursor:not-allowed; filter:grayscale(.6); }
    .biome-tag {
      display:flex; align-items:center; gap:8px; font-weight:800; font-size:.9rem;
      background: linear-gradient(180deg,#1c2e46,#0e1725);
      border:1px solid #3a5a80; border-radius:12px; padding:7px 16px; color:#cfe2ff;
    }
    .hint { display:flex; align-items:center; gap:6px; font-size:.78rem; color:#7fa0c8; font-weight:700; letter-spacing:.5px; }
  </style>
</head>
<body>
<div class="game">
  <canvas id="c" width="1000" height="640"></canvas>
  <div class="hud">
    <div class="stats">
      <div class="stat">⚡ <b id="uiSpeed">10</b></div>
      <div class="stat">💰 <b id="uiCash">0</b></div>
      <div class="stat">🥚 <b id="uiEgg">0</b></div>
      <div class="stat">🐾 <b id="uiPet">0</b></div>
      <div class="stat">📈 <b id="uiCps">0</b>/s</div>
    </div>
    <div class="btns">
      <button id="btnTrain">🏃 訓練</button>
      <button id="btnUp">⬆️ 跑步機 <span id="lvTxt">1</span></button>
      <button id="btnEquip">✨ 一鍵最佳</button>
      <button id="btnSell">💸 賣出最低</button>
    </div>
  </div>
  <div class="hud" style="padding-top:6px">
    <div class="biome-tag"><span id="uiBiomeIcon">🌲</span> <span id="uiBiome">森林</span></div>
    <div class="hint">📜 點擊上方生物群系傳送 / 滾輪縮放視角</div>
  </div>
</div>
<script>
(function(){
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  const W = 1000, H = 640;

  // ========== 世界設定 (縱向地圖) ==========
  const WORLD = {
    // 世界座標系：基地在下方 (Y 大)，宇宙在上方 (Y 小)
    baseY: 3200,       // 世界底部 (玩家基地)
    safeY: 2500,       // 安全線 (Y < 2500 危險)
    // 生物群系分界 (Y 範圍)
    biomes: [
      { name:'森林', icon:'🌲', yMin:2000, yMax:2500, req:0,      color:'#16301c', accent:'#2e5a34', guardian:'雞',   nestsY:2200, nestXs:[300,700], petNames:['雞','狗','鳥','穴鴞','浣熊','狐狸','熊','Brr Brr Patapim'] },
      { name:'火山', icon:'🌋', yMin:1500, yMax:2000, req:700,    color:'#3a1616', accent:'#5a2020', guardian:'地獄犬', nestsY:1700, nestXs:[200,500,800], petNames:['熔岩壁虎','熔岩蛙','烈焰牛','熔岩鬣蜥','Chillin Chilli','地獄犬','鳳凰','熔岩龍'] },
      { name:'深淵', icon:'🌊', yMin:1000, yMax:1500, req:2500,   color:'#0c1a30', accent:'#163a5a', guardian:'白鯨',   nestsY:1200, nestXs:[300,700], petNames:['鸚鵡魚','劍魚','鯊魚','虎鯨','鯨鯊','白鯨','海妖','El Maja'] },
      { name:'史前', icon:'🦕', yMin:500,  yMax:1000, req:17000,  color:'#2a2818', accent:'#4a4520', guardian:'暴龍',   nestsY:700,  nestXs:[250,750], petNames:['渡渡鳥','翼龍','甲龍','三角龍','雷龍','暴龍','Tralaledon','滄龍'] },
      { name:'宇宙', icon:'🌌', yMin:0,    yMax:500,  req:700000, color:'#160e28', accent:'#2a1a4a', guardian:'骷髏王', nestsY:200,  nestXs:[500], petNames:['蜈蚣','宇宙壁虎','宇宙猩猩','La Vacca','骷髏王','宇宙龍','永恆月龍','獨角獸'] },
    ],
    // 稀有度
    rarities: [
      {n:'Common',c:'#9aa7b8'}, {n:'Uncommon',c:'#5ec8ff'}, {n:'Rare',c:'#4a7dff'},
      {n:'Epic',c:'#b56cff'}, {n:'Legendary',c:'#ffb03a'}, {n:'Mythic',c:'#ff4a6a'},
      {n:'Cosmic',c:'#ff6ee0'}, {n:'Secret',c:'#f5f5f5'}, {n:'Divine',c:'#ffe066'}
    ],
    // 每群系寵物稀有度 (8隻)
    petRarity: [
      [0,0,1,2,2,3,3,4], //森林
      [2,3,4,4,5,7,8,8], //火山
      [2,3,4,5,6,6,7,8], //深淵
      [2,4,5,6,6,7,8,8], //史前
      [2,5,6,6,7,8,8,8], //宇宙
    ],
    // 每群系寵物基礎產值
    petIncome: [
      [1,2,8,35,45,180,240,1800],
      [180,850,9500,11000,55000,8000000,85000000,100000000],
      [220,1100,15000,80000,700000,850000,15000000,130000000],
      [280,22000,120000,1200000,1500000,180000000,32000000,180000000],
      [300,28000,180000,2200000,45000000,60000000,250000000,1000000000],
    ],
    // 速度門檻 (實際顯示用，已縮小)
    speedReq: [0, 700, 2500, 17000, 700000],
  };

  // ========== 遊戲狀態 ==========
  const S = {
    player: { x:500, y:2900, r:16, speed:10, trailMul:1, carry:null, stun:0, tsLv:1 },
    cash: 0,
    eggs: [],      // { x, y, r, size, mul, petIdx, biomeIdx, collected, float }
    guards: [],    // { x, y, r, spd, alert, stun, hx, hy, biomeIdx, name }
    pets: [],      // { id, name, inc, rar, biomeIdx, x, y, vx, vy, selected, slot }
    biomeIdx: 0,   // 當前解鎖的最高生物群系
    eggTimer: 0,
    lastT: 0,
    cps: 0,
    selectedPet: null,
    camera: { x: 500, y: 2700 }, // 相機中心 (世界座標)
    zoom: 1.0,
    // 跑步機位置 (世界座標)
    treadmill: { x: 500, y: 2850 },
    // 農場寵物欄位 (世界座標)
    farmPods: [
      {x:130, y:2780}, {x:130, y:2900}, {x:130, y:3020},
      {x:870, y:2780}, {x:870, y:2900}, {x:870, y:3020},
    ],
    // 合成機位置
    fuseMachine: { x: 930, y: 3080 },
    safeLineY: 2500,
  };

  // ========== 工具函數 ==========
  const rnd = (a,b) => Math.random()*(b-a)+a;
  const dist = (x1,y1,x2,y2) => Math.hypot(x2-x1, y2-y1);
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

  function worldToScreen(wx, wy) {
    const z = S.zoom;
    return {
      x: (wx - S.camera.x) * z + W/2,
      y: (wy - S.camera.y) * z + H/2,
    };
  }
  function screenToWorld(sx, sy) {
    const z = S.zoom;
    return {
      x: (sx - W/2) / z + S.camera.x,
      y: (sy - H/2) / z + S.camera.y,
    };
  }

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = clamp((n>>16) + amt, 0, 255);
    let g = clamp(((n>>8)&0xff) + amt, 0, 255);
    let b = clamp((n&0xff) + amt, 0, 255);
    return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
  }
  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;
  }
  function fmt(n) {
    if (n >= 1e9) return (n/1e9).toFixed(1)+'B';
    if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
    if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
    return Math.floor(n).toString();
  }

  // ========== 初始化 ==========
  function reset() {
    S.player = { x:500, y:2900, r:16, speed:10, trailMul:1, carry:null, stun:0, tsLv:1 };
    S.cash = 0;
    S.eggs = [];
    S.guards = [];
    S.pets = [];
    S.biomeIdx = 0;
    S.eggTimer = 0;
    S.cps = 0;
    S.selectedPet = null;
    S.camera = { x:500, y:2650 };
    S.zoom = 1.0;

    // 生成每個群系的蛋和守衛
    for (let bi = 0; bi < WORLD.biomes.length; bi++) {
      spawnEggsForBiome(bi);
      spawnGuardsForBiome(bi);
    }
    updateUI();
  }

  function spawnEggsForBiome(bi) {
    const b = WORLD.biomes[bi];
    for (const nx of b.nestXs) {
      for (let i = 0; i < 3; i++) {
        const sizeRoll = Math.random();
        let size = 'normal', mul = 1, r = 12;
        if (sizeRoll > 0.9) { size='giant'; mul=4; r=20; }
        else if (sizeRoll > 0.65) { size='huge'; mul=2.2; r=16; }
        const petIdx = Math.floor(Math.random()*8);
        S.eggs.push({
          x: nx + rnd(-50, 50),
          y: b.nestsY + rnd(-35, 35),
          r, size, mul, petIdx, biomeIdx: bi,
          collected: false, float: Math.random()*10,
        });
      }
    }
  }

  function spawnGuardsForBiome(bi) {
    const b = WORLD.biomes[bi];
    const gx = b.nestXs[Math.floor(b.nestXs.length/2)];
    S.guards.push({
      x: gx, y: b.nestsY - 60,
      r: 18, spd: 1.2 + bi*0.15,
      alert: false, stun: 0,
      hx: gx, hy: b.nestsY - 60,
      biomeIdx: bi, name: b.guardian,
    });
  }

  // ========== 更新 ==========
  function update(dt) {
    const p = S.player;

    // 眩暈
    if (p.stun > 0) {
      p.stun = Math.max(0, p.stun - dt);
      updateUI();
      return;
    }

    // 守衛 AI (只更新玩家附近的)
    for (const g of S.guards) {
      if (g.stun > 0) { g.stun -= dt; continue; }
      const b = WORLD.biomes[g.biomeIdx];
      const d = dist(p.x, p.y, g.x, g.y);
      
      // 玩家在該區域附近且攜帶蛋才追擊
      const playerInBiome = p.y > b.yMin - 100 && p.y < b.yMax + 100;
      let tx = g.hx, ty = g.hy;
      if (p.carry && playerInBiome && d < 350) {
        g.alert = true; tx = p.x; ty = p.y;
      } else if (g.alert && d > 500) {
        g.alert = false;
      }

      if (g.alert) {
        const dx = p.x - g.x, dy = p.y - g.y;
        const len = Math.hypot(dx, dy) || 1;
        g.x += (dx/len) * g.spd * 1.8;
        g.y += (dy/len) * g.spd * 1.8;
      } else {
        // 在巡邏範圍內左右移動
        if (dist(g.x, g.y, g.hx, g.hy) > 40) {
          const dx = g.hx - g.x, dy = g.hy - g.y;
          const len = Math.hypot(dx, dy) || 1;
          g.x += (dx/len) * g.spd * 0.5;
          g.y += (dy/len) * g.spd * 0.5;
        } else {
          g.hx = b.nestXs[Math.floor(Math.random()*b.nestXs.length)] + rnd(-60, 60);
          g.hy = b.nestsY - 60 + rnd(-30, 30);
        }
      }
      // 保持在該區域內
      g.x = clamp(g.x, 30, W-30);
      g.y = clamp(g.y, b.yMin+20, b.yMax-20);
    }

    // 撿蛋
    if (!p.carry) {
      for (const e of S.eggs) {
        if (e.collected) continue;
        if (dist(p.x, p.y, e.x, e.y) < p.r + e.r + 4) {
          e.collected = true;
          p.carry = { ...e };
          // 驚醒該區域守衛
          for (const g of S.guards) {
            if (g.biomeIdx === e.biomeIdx) g.alert = true;
          }
          updateUI();
          break;
        }
      }
    }

    // 回基地 (Y > 2500 安全線)
    if (p.carry && p.y > S.safeLineY) {
      const egg = p.carry;
      const b = WORLD.biomes[egg.biomeIdx];
      const inc = WORLD.petIncome[egg.biomeIdx][egg.petIdx] * egg.mul;
      const rar = WORLD.petRarity[egg.biomeIdx][egg.petIdx];
      // 找空的農場欄位
      const usedSlots = new Set(S.pets.map(pt => pt.slot).filter(s => s !== undefined));
      let slot = -1;
      for (let i = 0; i < S.farmPods.length; i++) {
        if (!usedSlots.has(i)) { slot = i; break; }
      }
      if (slot === -1) slot = Math.floor(Math.random()*S.farmPods.length); // 滿了就隨機
      
      S.pets.push({
        id: Math.random().toString(36).slice(2),
        name: b.petNames[egg.petIdx],
        inc, rar, biomeIdx: egg.biomeIdx,
        x: S.farmPods[slot].x, y: S.farmPods[slot].y,
        vx: rnd(-8,8), vy: rnd(-8,8),
        selected: false, slot,
      });
      p.carry = null;
      // 守衛停止追擊
      for (const g of S.guards) g.alert = false;
      S.cps = S.pets.reduce((s, pt) => s + pt.inc, 0) * 0.05;
      updateUI();
    }

    // 守衛抓人
    for (const g of S.guards) {
      if (g.stun > 0) continue;
      if (dist(p.x, p.y, g.x, g.y) < p.r + g.r + 6 && p.stun <= 0) {
        if (p.carry) {
          // 蛋掉落
          const drop = p.carry;
          S.eggs.push({
            ...drop, x: p.x + rnd(-15,15), y: p.y + rnd(-15,15),
            collected: false,
          });
          p.carry = null;
        }
        p.stun = 1.6;
        g.stun = 1.0;
        g.alert = false;
        updateUI();
        break;
      }
    }

    // 蛋重生
    S.eggTimer += dt;
    if (S.eggTimer > 20) {
      S.eggTimer = 0;
      S.eggs = S.eggs.filter(e => !e.collected);
      if (S.eggs.length < 20) {
        for (let bi = 0; bi < WORLD.biomes.length; bi++) {
          spawnEggsForBiome(bi);
        }
      }
    }

    // 被動收入
    S.cash += S.cps * dt;

    // 自動解鎖生物群系
    const speed = p.speed * p.trailMul;
    for (let i = 1; i < WORLD.biomes.length; i++) {
      if (S.biomeIdx < i && speed >= WORLD.speedReq[i]) {
        S.biomeIdx = i;
        updateUI();
        break;
      }
    }

    // 農場寵物悠遊
    for (const pt of S.pets) {
      pt.x += pt.vx * dt * 3;
      pt.y += pt.vy * dt * 3;
      // 限制在農場區域
      const pod = S.farmPods[pt.slot];
      if (pod) {
        if (dist(pt.x, pt.y, pod.x, pod.y) > 45) {
          pt.vx = (pod.x - pt.x) * 0.02;
          pt.vy = (pod.y - pt.y) * 0.02;
        }
      }
      pt.x = clamp(pt.x, 80, W-80);
      pt.y = clamp(pt.y, 2700, 3150);
    }

    // 相機跟隨
    S.camera.x += (p.x - S.camera.x) * 0.08;
    S.camera.y += (p.y - 200 - S.camera.y) * 0.08;

    updateUI();
  }

  // ========== 繪製 ==========
  function draw() {
    const z = S.zoom;
    ctx.clearRect(0, 0, W, H);

    // 背景
    ctx.fillStyle = '#0a1018';
    ctx.fillRect(0, 0, W, H);

    // 繪製每個生物群系 (從上到下)
    for (let bi = WORLD.biomes.length-1; bi >= 0; bi--) {
      const b = WORLD.biomes[bi];
      const p1 = worldToScreen(0, b.yMax);
      const p2 = worldToScreen(W, b.yMin);
      const y1 = p1.y, y2 = p2.y;
      if (y2 > H || y1 < 0) continue;

      // 區域背景
      const grad = ctx.createLinearGradient(0, y2, 0, y1);
      grad.addColorStop(0, shade(b.color, 12));
      grad.addColorStop(0.5, b.color);
      grad.addColorStop(1, shade(b.color, -12));
      ctx.fillStyle = grad;
      ctx.fillRect(0, y2, W, y1 - y2);

      // 區域名稱
      ctx.font = '800 14px "Segoe UI"';
      ctx.fillStyle = hexA(b.accent, 0.8);
      ctx.textAlign = 'left';
      ctx.fillText(`${b.icon} ${b.name}  ${b.req > 0 ? '⚡' + fmt(b.req) : ''}`, 20, y2 + 24);
    }

    // 安全線
    const safeY = worldToScreen(0, S.safeLineY).y;
    if (safeY > -20 && safeY < H+20) {
      ctx.save();
      ctx.setLineDash([12, 8]);
      ctx.strokeStyle = '#ff5a5a';
      ctx.lineWidth = 3;
      ctx.shadowBlur = 14;
      ctx.shadowColor = '#ff0000';
      ctx.beginPath();
      ctx.moveTo(0, safeY);
      ctx.lineTo(W, safeY);
      ctx.stroke();
      ctx.restore();

      ctx.font = '700 12px "Segoe UI"';
      ctx.fillStyle = '#ff8888';
      ctx.textAlign = 'center';
      ctx.fillText('⚠️ 安全線 (回到下方基地)', W/2, safeY - 8);
    }

    // 蛋
    for (const e of S.eggs) {
      if (!e.collected) drawEgg(e);
    }

    // 守衛
    for (const g of S.guards) drawGuard(g);

    // 基地 (Y > 2700 區域)
    drawBase();

    // 玩家
    drawPlayer();

    // 農場寵物
    for (const pt of S.pets) drawFarmPet(pt);

    // 繪製 HUD 固定資訊
    drawHUD();
  }

  function drawBase() {
    const p = worldToScreen(0, 2700);
    const p2 = worldToScreen(0, 3200);
    if (p2.y < 0 || p.y > H) return;

    // 基地背景
    ctx.fillStyle = '#1c3a24aa';
    ctx.fillRect(0, p.y, W, p2.y - p.y);

    // 基地邊框
    ctx.strokeStyle = '#4a7a4a';
    ctx.lineWidth = 2;
    ctx.strokeRect(4, p.y, W-8, p2.y - p.y - 4);

    // 跑步機
    const tm = worldToScreen(S.treadmill.x, S.treadmill.y);
    ctx.save();
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#5ec8ff66';
    ctx.fillStyle = '#2a4a6a';
    ctx.beginPath();
    ctx.roundRect(tm.x-50, tm.y-25, 100, 50, 10);
    ctx.fill();
    ctx.strokeStyle = '#5ec8ff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.font = '700 12px "Segoe UI"';
    ctx.fillStyle = '#aaddff';
    ctx.textAlign = 'center';
    ctx.fillText('🏃 跑步機', tm.x, tm.y+5);
    ctx.restore();

    // 農場寵物底座
    for (const pod of S.farmPods) {
      const sp = worldToScreen(pod.x, pod.y);
      if (sp.y < 0 || sp.y > H) continue;
      ctx.save();
      ctx.fillStyle = '#2a4a2a88';
      ctx.strokeStyle = '#4a7a4a88';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, 22, 0, 7);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // 合成機
    const fm = worldToScreen(S.fuseMachine.x, S.fuseMachine.y);
    ctx.save();
    ctx.fillStyle = '#3a2a4a';
    ctx.strokeStyle = '#b56cff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(fm.x-35, fm.y-20, 70, 40, 8);
    ctx.fill();
    ctx.stroke();
    ctx.font = '700 11px "Segoe UI"';
    ctx.fillStyle = '#c9a0ff';
    ctx.textAlign = 'center';
    ctx.fillText('🔮 合成機', fm.x, fm.y+4);
    ctx.restore();
  }

  function drawEgg(e) {
    const sp = worldToScreen(e.x, e.y);
    if (sp.y < -50 || sp.y > H+50) return;
    const b = WORLD.biomes[e.biomeIdx];
    const rar = WORLD.petRarity[e.biomeIdx][e.petIdx];
    const rc = WORLD.rarities[rar].c;
    const bob = Math.sin(S.time*2 + e.float) * 3;
    const sc = S.zoom;

    ctx.save();
    ctx.translate(sp.x, sp.y + bob*sc);
    ctx.scale(sc, sc);

    // 光暈
    if (rar >= 3 || e.size !== 'normal') {
      const glow = ctx.createRadialGradient(0,0,e.r*0.5, 0,0,e.r*2.4);
      glow.addColorStop(0, hexA(rc, 0.5));
      glow.addColorStop(1, hexA(rc, 0));
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, e.r*2.4, 0, 7);
      ctx.fill();
    }

    // 蛋體
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#00000088';
    const grad = ctx.createRadialGradient(-e.r*0.3, -e.r*0.4, e.r*0.15, 0, 0, e.r*1.3);
    if (e.size === 'giant') { grad.addColorStop(0,'#aaddff'); grad.addColorStop(1,'#1a4a7a'); }
    else if (e.size === 'huge') { grad.addColorStop(0,'#cce0ff'); grad.addColorStop(1,'#3a6a9a'); }
    else { grad.addColorStop(0,'#f0f0f0'); grad.addColorStop(1,'#7a7a7a'); }
    ctx.beginPath();
    ctx.ellipse(0, 0, e.r, e.r*1.3, 0, 0, 7);
    ctx.fillStyle = grad;
    ctx.fill();

    // 高光
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(-e.r*0.35, -e.r*0.45, e.r*0.25, e.r*0.35, -0.4, 0, 7);
    ctx.fill();
    ctx.globalAlpha = 1;

    // 稀有度星
    if (rar >= 4) {
      ctx.font = 'bold 14px "Segoe UI"';
      ctx.fillStyle = rc;
      ctx.shadowBlur = 12;
      ctx.shadowColor = rc;
      ctx.textAlign = 'center';
      ctx.fillText('★', 0, -e.r*1.6);
    }
    ctx.restore();
  }

  function drawGuard(g) {
    const sp = worldToScreen(g.x, g.y);
    if (sp.y < -60 || sp.y > H+60) return;
    const sc = S.zoom;
    const b = WORLD.biomes[g.biomeIdx];

    ctx.save();
    ctx.translate(sp.x, sp.y);
    ctx.scale(sc, sc);

    // 光暈
    if (g.alert) {
      const gl = ctx.createRadialGradient(0,0,g.r*0.5, 0,0,g.r*2.6);
      gl.addColorStop(0, 'rgba(255,80,80,0.5)');
      gl.addColorStop(1, 'rgba(255,80,80,0)');
      ctx.fillStyle = gl;
      ctx.beginPath();
      ctx.arc(0,0,g.r*2.6,0,7);
      ctx.fill();
    }

    // 身體
    ctx.shadowBlur = 14;
    ctx.shadowColor = '#000a';
    const grad = ctx.createRadialGradient(-g.r*0.3,-g.r*0.3,g.r*0.2, 0,0,g.r*1.2);
    if (g.alert) { grad.addColorStop(0,'#ff7070'); grad.addColorStop(1,'#5a1010'); }
    else { grad.addColorStop(0, b.accent); grad.addColorStop(1,'#1a0a0a'); }
    ctx.beginPath();
    ctx.arc(0,0,g.r,0,7);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = g.alert ? '#ffcc00' : '#aa4444';
    ctx.lineWidth = g.alert ? 4 : 2;
    ctx.stroke();

    // 眼睛
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-6,-3,4.5,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-3,4.5,0,7); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(-6,-3,2.2,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-3,2.2,0,7); ctx.fill();

    // 驚嘆號
    if (g.alert) {
      ctx.font = '900 22px "Segoe UI"';
      ctx.fillStyle = '#ffaa00';
      ctx.shadowBlur = 14;
      ctx.shadowColor = '#ff8800';
      ctx.textAlign = 'center';
      ctx.fillText('!', 0, -g.r-8);
    }
    ctx.restore();
  }

  function drawPlayer() {
    const p = S.player;
    const sp = worldToScreen(p.x, p.y);
    const sc = S.zoom;

    ctx.save();
    ctx.translate(sp.x, sp.y);
    ctx.scale(sc, sc);
    if (p.stun > 0) ctx.globalAlpha = 0.5 + Math.sin(S.time*20)*0.25;

    // 光環
    const gl = ctx.createRadialGradient(0,0,p.r*0.6, 0,0,p.r*2);
    gl.addColorStop(0,'rgba(100,180,255,0.5)');
    gl.addColorStop(1,'rgba(100,180,255,0)');
    ctx.fillStyle = gl;
    ctx.beginPath();
    ctx.arc(0,0,p.r*2,0,7);
    ctx.fill();

    // 身體
    ctx.shadowBlur = 16;
    ctx.shadowColor = '#000c';
    const grad = ctx.createRadialGradient(-p.r*0.3,-p.r*0.3,p.r*0.2, 0,0,p.r*1.2);
    grad.addColorStop(0,'#7ad0ff');
    grad.addColorStop(1,'#1a4a8a');
    ctx.beginPath();
    ctx.arc(0,0,p.r,0,7);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = '#aaddff';
    ctx.lineWidth = 3;
    ctx.stroke();

    // 眼睛
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-5,-3,4.5,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-3,4.5,0,7); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(-5,-3,2,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-3,2,0,7); ctx.fill();

    // 攜帶的蛋
    if (p.carry) {
      ctx.shadowBlur = 18;
      ctx.shadowColor = '#ffaa00';
      const cg = ctx.createRadialGradient(-3,-24,3, 0,-18,15);
      cg.addColorStop(0,'#ffe68f');
      cg.addColorStop(1,'#b8860b');
      ctx.beginPath();
      ctx.ellipse(0,-20,12,16,0,0,7);
      ctx.fillStyle = cg;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.font = '12px "Segoe UI"';
      ctx.fillStyle = '#fff';
      ctx.fillText('★', -4, -24);
    }
    ctx.restore();
  }

  function drawFarmPet(pt) {
    const sp = worldToScreen(pt.x, pt.y);
    if (sp.y < -30 || sp.y > H+30) return;
    const sc = S.zoom;
    const rc = WORLD.rarities[pt.rar].c;
    const bob = Math.sin(S.time*3 + pt.inc) * 2;

    ctx.save();
    ctx.translate(sp.x, sp.y + bob*sc);
    ctx.scale(sc, sc);

    // 選中光環
    if (pt.selected) {
      const gl = ctx.createRadialGradient(0,0,8, 0,0,40);
      gl.addColorStop(0, hexA(rc, 0.7));
      gl.addColorStop(1, hexA(rc, 0));
      ctx.fillStyle = gl;
      ctx.beginPath();
      ctx.arc(0,0,40,0,7);
      ctx.fill();
    }

    // 身體
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#000a';
    const grad = ctx.createRadialGradient(-5,-6,4, 0,0,18);
    grad.addColorStop(0, hexA(rc, 0.9));
    grad.addColorStop(1, shade(rc,-40));
    ctx.beginPath();
    ctx.ellipse(0,0,14,16,0,0,7);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = rc;
    ctx.lineWidth = 2;
    ctx.stroke();

    // 眼睛
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-4,-3,3.5,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(4,-3,3.5,0,7); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(-4,-3,1.6,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(4,-3,1.6,0,7); ctx.fill();

    // 稀有度冠
    if (pt.rar >= 5) {
      ctx.font = '10px "Segoe UI"';
      ctx.fillStyle = rc;
      ctx.textAlign = 'center';
      ctx.shadowBlur = 8;
      ctx.shadowColor = rc;
      ctx.fillText('👑', 0, -20);
      ctx.shadowBlur = 0;
    }
    ctx.restore();

    // 名字與產值
    if (sc > 0.7) {
      ctx.font = '600 10px "Segoe UI"';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#cfe2ff';
      ctx.shadowBlur = 4;
      ctx.shadowColor = '#000';
      ctx.fillText(pt.name.slice(0,8), sp.x, sp.y + 28*sc);
      ctx.font = '700 9px "Segoe UI"';
      ctx.fillStyle = '#9fd89f';
      ctx.fillText('$'+fmt(pt.inc)+'/s', sp.x, sp.y + 40*sc);
      ctx.shadowBlur = 0;
    }
  }

  function drawHUD() {
    // 相機位置指示 (左上)
    ctx.font = '700 11px "Segoe UI"';
    ctx.fillStyle = '#5a7a9a';
    ctx.textAlign = 'left';
    ctx.fillText(`📍 Y:${Math.floor(S.player.y)}  ${S.player.carry ? '🥚攜帶中' : ''}`, 16, H-16);

    // 縮放指示
    ctx.textAlign = 'right';
    ctx.fillText(`🔍 ${(S.zoom*100).toFixed(0)}%`, W-16, H-16);
  }

  // ========== 輸入 ==========
  // 滑鼠拖動移動玩家
  let isDragging = false;
  let dragStart = { x:0, y:0 };

  c.addEventListener('mousedown', e => {
    const rect = c.getBoundingClientRect();
    const sx = (e.clientX - rect.left) * (W / rect.width);
    const sy = (e.clientY - rect.top) * (H / rect.height);
    const w = screenToWorld(sx, sy);

    // 檢查是否點擊農場寵物
    for (const pt of S.pets) {
      if (dist(w.x, w.y, pt.x, pt.y) < 30) {
        S.selectedPet = pt;
        for (const p2 of S.pets) p2.selected = false;
        pt.selected = true;
        updateUI();
        return;
      }
    }

    // 檢查是否點擊跑步機
    if (dist(w.x, w.y, S.treadmill.x, S.treadmill.y) < 70) {
      // 訓練
      const p = S.player;
      p.speed += 3 + p.tsLv * 1.2;
      updateUI();
      return;
    }

    // 否則開始拖動
    isDragging = true;
    dragStart = { x: sx, y: sy, wx: w.x, wy: w.y };
  });

  c.addEventListener('mousemove', e => {
    const rect = c.getBoundingClientRect();
    const sx = (e.clientX - rect.left) * (W / rect.width);
    const sy = (e.clientY - rect.top) * (H / rect.height);

    if (isDragging) {
      // 拖動玩家 (世界座標)
      const w = screenToWorld(sx, sy);
      const p = S.player;
      if (p.stun <= 0) {
        p.x = clamp(w.x, 20, W-20);
        p.y = clamp(w.y, 20, 3180);
      }
    }
  });

  c.addEventListener('mouseup', () => { isDragging = false; });
  c.addEventListener('mouseleave', () => { isDragging = false; });

  // 滾輪縮放
  c.addEventListener('wheel', e => {
    e.preventDefault();
    S.zoom = clamp(S.zoom * (e.deltaY > 0 ? 0.92 : 1.08), 0.5, 2.5);
  }, { passive: false });

  // 點擊農場寵物取消選中
  c.addEventListener('click', e => {
    // 已由 mousedown 處理
  });

  // ========== UI 更新 ==========
  function updateUI() {
    const p = S.player;
    document.getElementById('uiSpeed').textContent = Math.floor(p.speed * p.trailMul).toLocaleString();
    document.getElementById('uiCash').textContent = fmt(S.cash);
    document.getElementById('uiEgg').textContent = p.carry ? '1' : '0';
    document.getElementById('uiPet').textContent = S.pets.length;
    document.getElementById('uiCps').textContent = fmt(S.cps);
    document.getElementById('lvTxt').textContent = p.tsLv;

    const b = WORLD.biomes[S.biomeIdx];
    document.getElementById('uiBiome').textContent = b.name;
    document.getElementById('uiBiomeIcon').textContent = b.icon;

    const btnUp = document.getElementById('btnUp');
    btnUp.disabled = S.cash < 40 * p.tsLv;
  }

  // ========== 按鈕 ==========
  document.getElementById('btnTrain').addEventListener('click', () => {
    const p = S.player;
    if (p.stun > 0) return;
    p.speed += 3 + p.tsLv * 1.2;
    updateUI();
  });

  document.getElementById('btnUp').addEventListener('click', () => {
    const p = S.player;
    const cost = 40 * p.tsLv;
    if (S.cash >= cost) {
      S.cash -= cost;
      p.tsLv++;
      p.speed += 8;
      updateUI();
    }
  });

  document.getElementById('btnEquip').addEventListener('click', () => {
    if (S.pets.length === 0) return;
    S.cps = S.pets.reduce((s, pt) => s + pt.inc, 0) * 0.05;
    updateUI();
  });

  document.getElementById('btnSell').addEventListener('click', () => {
    if (S.pets.length === 0) return;
    // 賣出產值最低的寵物
    S.pets.sort((a,b) => a.inc - b.inc);
    const sold = S.pets.shift();
    S.cash += sold.inc * 10;
    S.cps = S.pets.reduce((s, pt) => s + pt.inc, 0) * 0.05;
    updateUI();
  });

  // ========== 主循環 ==========
  function loop(now) {
    const dt = Math.min(0.05, (now - (S.lastT || now)) / 1000);
    S.lastT = now;
    S.time = (S.time || 0) + dt;
    if (dt > 0) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // 啟動
  reset();
  requestAnimationFrame(loop);
  setInterval(updateUI, 150);
})();
</script>
</body>
</html>
