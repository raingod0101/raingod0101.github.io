<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🥚 Steal An Egg</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#05080f;
    font-family:'Segoe UI',system-ui,sans-serif;
    touch-action:none;
    position:fixed;
  }
  #gameContainer{
    position:relative;
    width:100vw;
    height:100vh;
    background:#0a1018;
    overflow:hidden;
  }
  canvas{
    display:block;
    width:100%;
    height:100%;
    background:#0a1018;
    touch-action:none;
  }
  /* HUD 浮動在畫布上方 */
  #hud{
    position:absolute;
    top:0;left:0;right:0;
    padding:6px 8px;
    display:flex;
    flex-direction:column;
    gap:4px;
    pointer-events:none;
    z-index:10;
  }
  #hud .row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:4px;
    pointer-events:none;
  }
  .stats{
    display:flex;
    flex-wrap:wrap;
    gap:3px;
    pointer-events:auto;
  }
  .stat{
    display:flex;align-items:center;gap:2px;
    background:rgba(10,20,35,0.85);
    border:1px solid #2c3f5c;border-radius:5px;
    padding:2px 7px;color:#dbe7ff;font-weight:700;font-size:.6rem;
    backdrop-filter:blur(4px);
  }
  .stat b{color:#fff;font-size:.7rem}
  .stat.speed b{color:#7affb0}
  .stat.pet b{color:#c9a0ff}
  .btns{display:flex;flex-wrap:wrap;gap:3px;pointer-events:auto}
  button{
    background:rgba(30,55,85,0.9);
    border:1px solid #43689a;border-radius:5px;
    padding:3px 8px;color:#eaf3ff;font-weight:800;font-size:.55rem;
    cursor:pointer;
    touch-action:manipulation;
  }
  button:active{opacity:0.7}
  button:disabled{opacity:0.4;cursor:not-allowed}
  button.sell{background:rgba(100,30,30,0.9);border-color:#aa4444}
  button.save{background:rgba(30,90,50,0.9);border-color:#3a9a5a}
  .biome-tag{
    display:flex;align-items:center;gap:3px;font-weight:800;font-size:.55rem;
    background:rgba(20,35,55,0.85);
    border:1px solid #3a5a80;border-radius:5px;padding:2px 8px;color:#cfe2ff;
    backdrop-filter:blur(4px);
  }
  .train-indicator{
    font-size:.55rem;color:#ffd966;font-weight:800;
    background:rgba(20,35,55,0.85);
    border:1px solid #5a4a20;border-radius:5px;padding:2px 8px;
  }
  /* 虛擬搖桿 */
  #joystickZone{
    position:fixed;
    bottom:24px;left:24px;
    width:90px;height:90px;
    border-radius:50%;
    background:rgba(30,50,80,0.3);
    border:2px solid rgba(100,150,200,0.4);
    display:none;
    z-index:20;
    touch-action:none;
  }
  #joystickZone.active{display:block}
  #joystickKnob{
    position:absolute;
    top:50%;left:50%;
    width:36px;height:36px;
    border-radius:50%;
    background:radial-gradient(circle,#7ad0ff,#1a4a8a);
    border:2px solid #aaddff;
    box-shadow:0 0 12px rgba(100,180,255,0.5);
    transform:translate(-50%,-50%);
    pointer-events:none;
  }
  /* 選中寵物面板 */
  #petPanel{
    position:fixed;
    bottom:16px;left:50%;transform:translateX(-50%);
    background:linear-gradient(180deg,#1a2438,#0d1523);
    border:2px solid #5a3a7a;border-radius:10px;
    padding:8px 14px;
    z-index:50;
    display:none;
    align-items:center;
    gap:10px;
    box-shadow:0 8px 25px rgba(0,0,0,0.8);
    max-width:95%;
    flex-wrap:wrap;
    justify-content:center;
  }
  #petPanel.open{display:flex}
  #petPanel canvas{width:36px;height:36px}
  #petPanel .info{display:flex;flex-direction:column;gap:1px}
  #petPanel .pname{font-size:.85rem;font-weight:800;color:#ffd966}
  #petPanel .pinc{font-size:.65rem;color:#9fd89f;font-weight:700}
  #petPanel .prar{font-size:.55rem;font-weight:800}
  /* 圖鑑面板 */
  #indexPanel{
    position:fixed;
    top:0;left:0;right:0;bottom:0;
    background:rgba(5,10,20,0.96);
    backdrop-filter:blur(10px);
    z-index:100;
    display:none;
    flex-direction:column;
    padding:12px;
    overflow-y:auto;
  }
  #indexPanel.open{display:flex}
  .index-header{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:10px;flex-wrap:wrap;gap:6px;
  }
  .index-header h2{color:#ffd966;font-size:1.1rem;font-weight:900}
  .index-header button{background:rgba(100,30,30,0.9);border-color:#aa4444}
  .index-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
    gap:6px;
  }
  .index-card{
    background:linear-gradient(180deg,#1a2438,#0d1523);
    border:2px solid #2c3f5c;border-radius:8px;
    padding:5px;display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .index-card.unlocked{border-color:#ffd966}
  .index-card.locked{opacity:0.35;filter:grayscale(1)}
  .index-card canvas{width:36px;height:36px}
  .index-card .name{font-size:.5rem;font-weight:800;color:#dbe7ff;text-align:center;line-height:1.1;min-height:1.2em}
  .index-card .biome-label{font-size:.45rem;color:#7fa0c8;font-weight:700}
  .index-card .rarity-label{font-size:.45rem;font-weight:800;padding:1px 5px;border-radius:4px;background:#0a1018}
  .index-card .reward-btn{font-size:.5rem;padding:2px 6px;background:rgba(30,90,50,0.9);border-color:#3a9a5a;border-radius:3px}
  .index-card .reward-btn.claimed{opacity:0.4;cursor:default;filter:grayscale(1)}
  .index-tabs{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:10px}
  .index-tab{
    padding:3px 8px;border-radius:4px;
    background:#0d1523;border:1px solid #2c3f5c;
    color:#7fa0c8;font-weight:800;font-size:.55rem;
    cursor:pointer;
  }
  .index-tab.active{background:linear-gradient(180deg,#2b4a72,#16273d);color:#eaf3ff;border-color:#5a82b8}
  /* 擊飛閃爍 */
  .knockback-flash{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(255,0,0,0.3);
    pointer-events:none;z-index:150;
    animation:flash 0.4s ease-out;
  }
  @keyframes flash{0%{opacity:0.8}100%{opacity:0}}
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="row">
      <div class="stats">
        <div class="stat speed">⚡ <b id="uiSpeed">10</b></div>
        <div class="stat">💰 <b id="uiCash">0</b></div>
        <div class="stat">🥚 <b id="uiEgg">0</b></div>
        <div class="stat pet">📖 <b id="uiIndex">0/64</b></div>
      </div>
      <div class="btns">
        <button id="btnUp">⬆️ <span id="lvTxt">1</span> <span id="costTxt">$40</span></button>
        <button id="btnIndex">📖</button>
        <button id="btnEquip">✨</button>
        <button id="btnSellSelected" class="sell" disabled>💸</button>
        <button id="btnSave" class="save">💾</button>
      </div>
    </div>
    <div class="row">
      <div class="biome-tag"><span id="uiBiomeIcon">🌲</span> <span id="uiBiome">森林</span></div>
      <div class="train-indicator" id="trainStatus">🚶 未訓練</div>
    </div>
  </div>
</div>

<div id="joystickZone"><div id="joystickKnob"></div></div>

<div id="petPanel">
  <canvas id="petPanelCanvas" width="36" height="36"></canvas>
  <div class="info">
    <div class="pname" id="ppName">-</div>
    <div class="pinc" id="ppInc">-</div>
    <div class="prar" id="ppRar">-</div>
  </div>
  <button id="btnSellPanel">💸</button>
  <button id="btnClosePanel">✕</button>
</div>

<div id="indexPanel">
  <div class="index-header">
    <h2>📖 圖鑑</h2>
    <div class="index-tabs" id="indexTabs"></div>
    <button id="btnCloseIndex">✕</button>
  </div>
  <div class="index-grid" id="indexGrid"></div>
</div>

<script>
(function(){
  'use strict';
  
  // ========== 全域錯誤處理（防止黑屏） ==========
  window.onerror = function(msg, url, line){
    console.error('遊戲錯誤:', msg, '行:', line);
    showToast('⚠️ 錯誤已修復，請繼續遊玩', '#8a2a2a', '#4a1010');
    return true;
  };
  
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  let W = 0, H = 0;
  
  function resizeCanvas(){
    const container = document.getElementById('gameContainer');
    const dpr = window.devicePixelRatio || 1;
    W = container.clientWidth;
    H = container.clientHeight;
    c.width = W * dpr;
    c.height = H * dpr;
    c.style.width = W + 'px';
    c.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  
  // ========== 世界設定（保持不變） ==========
  const WORLD = {
    biomes: [
      {name:'森林',icon:'🌲',yMin:2000,yMax:2500,reqDisplay:0,color:'#16301c',accent:'#2e5a34',petNames:['雞','狗','鳥','穴鴞','浣熊','狐狸','熊','Brr Brr Patapim']},
      {name:'火山',icon:'🌋',yMin:1500,yMax:2000,reqDisplay:700,color:'#3a1616',accent:'#5a2020',petNames:['熔岩壁虎','熔岩蛙','烈焰牛','熔岩鬣蜥','Chillin Chilli','地獄犬','鳳凰','熔岩龍']},
      {name:'深淵',icon:'🌊',yMin:1000,yMax:1500,reqDisplay:2500,color:'#0c1a30',accent:'#163a5a',petNames:['鸚鵡魚','劍魚','鯊魚','虎鯨','鯨鯊','白鯨','海妖','El Maja']},
      {name:'史前',icon:'🦕',yMin:500,yMax:1000,reqDisplay:17000,color:'#2a2818',accent:'#4a4520',petNames:['渡渡鳥','翼龍','甲龍','三角龍','雷龍','暴龍','Tralaledon','滄龍']},
      {name:'宇宙',icon:'🌌',yMin:0,yMax:500,reqDisplay:700000,color:'#160e28',accent:'#2a1a4a',petNames:['蜈蚣','宇宙壁虎','宇宙猩猩','La Vacca','骷髏王','宇宙龍','永恆月龍','獨角獸']},
      {name:'櫻花',icon:'🌸',yMin:-600,yMax:0,reqDisplay:1500000,color:'#2a1a2a',accent:'#6a3a5a',petNames:['花瓣精靈','櫻桃鼠','粉蝶','花妖','櫻花鹿','櫻龍','月兔','櫻花女神']},
      {name:'泰坦',icon:'🏛️',yMin:-1200,yMax:-600,reqDisplay:2500000,color:'#1a1a2a',accent:'#4a4a6a',petNames:['泰坦幼獸','青銅巨像','守護石像','雷電巨人','大地泰坦','天空泰坦','時空泰坦','泰坦之王']},
      {name:'虛空',icon:'🕳️',yMin:-2000,yMax:-1200,reqDisplay:100000000000,color:'#05050a',accent:'#2a2a4a',petNames:['虛空碎片','暗影獸','虛空之眼','混沌行者','深淵領主','虛空巨獸','終焉之龍','創世神']},
    ],
    rarities: [
      {n:'Common',c:'#9aa7b8'},{n:'Uncommon',c:'#5ec8ff'},{n:'Rare',c:'#4a7dff'},
      {n:'Epic',c:'#b56cff'},{n:'Legendary',c:'#ffb03a'},{n:'Mythic',c:'#ff4a6a'},
      {n:'Cosmic',c:'#ff6ee0'},{n:'Secret',c:'#f5f5f5'},{n:'Divine',c:'#ffe066'}
    ],
    petRarity: [
      [0,0,1,2,2,3,3,4],[2,3,4,4,5,7,8,8],[2,3,4,5,6,6,7,8],[2,4,5,6,6,7,8,8],
      [2,5,6,6,7,8,8,8],[2,4,5,6,6,7,8,8],[2,5,6,7,7,8,8,8],[6,7,7,8,8,8,8,8],
    ],
    petIncome: [
      [1,2,8,35,45,180,240,1800],[180,850,9500,11000,55000,8000000,85000000,100000000],
      [220,1100,15000,80000,700000,850000,15000000,130000000],[280,22000,120000,1200000,1500000,180000000,32000000,180000000],
      [300,28000,180000,2200000,45000000,60000000,250000000,1000000000],[350,35000,250000,3500000,60000000,80000000,350000000,1500000000],
      [400,50000,400000,5000000,80000000,120000000,500000000,2000000000],[500,80000,800000,8000000,150000000,200000000,800000000,5000000000],
    ],
  };
  
  // 速度對照表
  const SPEED_TABLE = [
    {display:10, real:10},{display:1000, real:40},{display:1000000, real:90},
    {display:100000000, real:140},{display:1000000000, real:180},
    {display:100000000000, real:240},{display:1000000000000, real:300},
  ];
  
  function displayToReal(display){
    if(display <= 10) return 10;
    for(let i=0;i<SPEED_TABLE.length-1;i++){
      const a = SPEED_TABLE[i], b = SPEED_TABLE[i+1];
      if(display >= a.display && display <= b.display){
        const t = (display - a.display) / (b.display - a.display);
        return a.real + (b.real - a.real) * t;
      }
    }
    return 300;
  }
  
  function treadmillCost(lv){ return Math.floor(40 * Math.pow(1.8, lv-1)); }
  
  // ========== 寵物造型數據 ==========
  const BIOME_PALETTES = [
    {body:'#6aaa4a',belly:'#aadd77',accent:'#ffaa00'},{body:'#cc4422',belly:'#ff8844',accent:'#ff2200'},
    {body:'#2266aa',belly:'#44aaff',accent:'#00ccff'},{body:'#887744',belly:'#bbaa66',accent:'#ff8800'},
    {body:'#7744cc',belly:'#aa88ff',accent:'#cc00ff'},{body:'#dd66aa',belly:'#ffaacc',accent:'#ff88cc'},
    {body:'#aaaaaa',belly:'#dddddd',accent:'#ffdd44'},{body:'#442266',belly:'#8866aa',accent:'#aa00ff'},
  ];
  
  const PET_SHAPES = [
    ['chicken','dog','bird','owl','raccoon','fox','bear','crystal'],
    ['lizard','frog','cow','iguana','chili','hound','phoenix','dragon'],
    ['parrotfish','swordfish','shark','orca','whaleshark','beluga','kraken','mermaid'],
    ['dodo','pterodactyl','ankylo','triceratops','brontosaurus','trex','crystal','mosasaur'],
    ['centipede','gecko','gorilla','crystal','skeleton','cosmicdragon','moondragon','unicorn'],
    ['petal','mouse','butterfly','flower','deer','sakuradragon','rabbit','goddess'],
    ['titanbaby','colossus','statue','thunder','earth','sky','time','king'],
    ['shard','shadow','eye','chaos','abyss','voidbeast','enddragon','creator'],
  ];
  
  // ========== 圖鑑 ==========
  const IndexData = {
    discovered: new Set(),
    claimed: new Set(),
    total: WORLD.biomes.length * 8,
  };
  
  // ========== 存檔（修復版） ==========
  const SAVE_KEY = 'steal_an_egg_save_v4';
  
  function saveGame(){
    try {
      const data = {
        version: 4,
        player: {
          displaySpeed: S.player.displaySpeed,
          tsLv: S.player.tsLv,
          x: S.player.x,
          y: S.player.y,
        },
        cash: S.cash,
        pets: S.pets.map(p => ({
          name: p.name, inc: p.inc, rar: p.rar, biomeIdx: p.biomeIdx, petIdx: p.petIdx, slot: p.slot,
        })),
        biomeIdx: S.biomeIdx,
        discovered: [...IndexData.discovered],
        claimed: [...IndexData.claimed],
        cps: S.cps,
        timestamp: Date.now(),
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
      showToast('💾 存檔成功！', '#2a6a3a', '#3a9a5a');
    } catch(e) {
      console.error('存檔失敗', e);
      showToast('❌ 存檔失敗', '#8a2a2a', '#aa4444');
    }
  }
  
  function loadGame(){
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if(!raw) return false;
      const data = JSON.parse(raw);
      if(!data || data.version !== 4) return false;
      
      S.player.displaySpeed = data.player.displaySpeed || 10;
      S.player.tsLv = data.player.tsLv || 1;
      S.player.x = data.player.x || 540;
      S.player.y = data.player.y || 2900;
      S.cash = data.cash || 0;
      S.biomeIdx = data.biomeIdx || 0;
      S.cps = data.cps || 0;
      
      S.pets = [];
      if(data.pets && Array.isArray(data.pets)){
        for(const p of data.pets){
          S.pets.push({
            id: Math.random().toString(36).slice(2),
            name: p.name, inc: p.inc, rar: p.rar, biomeIdx: p.biomeIdx, petIdx: p.petIdx,
            x: S.farmPods[p.slot] ? S.farmPods[p.slot].x : 130,
            y: S.farmPods[p.slot] ? S.farmPods[p.slot].y : 2780,
            vx: rnd(-8,8), vy: rnd(-8,8), selected: false, slot: p.slot,
          });
        }
      }
      
      IndexData.discovered.clear();
      IndexData.claimed.clear();
      if(data.discovered) data.discovered.forEach(k => IndexData.discovered.add(k));
      if(data.claimed) data.claimed.forEach(k => IndexData.claimed.add(k));
      
      S.cps = S.pets.reduce((s,pt) => s + pt.inc, 0) * 0.05;
      
      showToast('📂 讀取存檔成功！', '#2a4a72', '#5a82b8');
      return true;
    } catch(e) {
      console.error('讀取失敗', e);
      return false;
    }
  }
  
  function showToast(msg, bg1, bg2){
    const toast = document.createElement('div');
    toast.style.cssText = `position:fixed;top:50px;left:50%;transform:translateX(-50%);
      background:linear-gradient(180deg,${bg1},${bg2});
      border:2px solid #ffd966;border-radius:8px;padding:6px 16px;
      color:#ffd966;font-weight:800;font-size:.8rem;z-index:200;
      pointer-events:none;`;
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transition = 'opacity 0.5s';
      setTimeout(() => toast.remove(), 500);
    }, 1500);
  }
  
  // ========== 狀態 ==========
  const S = {
    player: {
      x: 540, y: 2900, r: 15,
      displaySpeed: 10,
      trailMul: 1,
      carry: null, stun: 0, tsLv: 1,
      knockbackTimer: 0, vx: 0, vy: 0,
      training: false,
      trainTickTimer: 0,
    },
    cash: 0, eggs: [], guards: [], pets: [],
    biomeIdx: 0, eggTimer: 0, lastT: 0, cps: 0,
    selectedPet: null,
    camera: {x: 540, y: 2650}, zoom: 1.0, time: 0,
    treadmill: {x: 540, y: 2850},
    farmPods: [
      {x: 130, y: 2780}, {x: 130, y: 2900}, {x: 130, y: 3020},
      {x: 950, y: 2780}, {x: 950, y: 2900}, {x: 950, y: 3020},
    ],
    safeLineY: 2500,
    indexOpen: false, indexTab: 0, panelOpen: false,
    joystickActive: false, joystickDX: 0, joystickDY: 0,
    isMobile: false,
    lastSafeTime: 0,
  };
  
  const keys = {};
  const rnd = (a,b) => Math.random()*(b-a)+a;
  const dist = (x1,y1,x2,y2) => Math.hypot(x2-x1, y2-y1);
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  
  function worldToScreen(wx, wy){
    const z = S.zoom;
    return { x: (wx - S.camera.x)*z + W/2, y: (wy - S.camera.y)*z + H/2 };
  }
  function screenToWorld(sx, sy){
    const z = S.zoom;
    return { x: (sx - W/2)/z + S.camera.x, y: (sy - H/2)/z + S.camera.y };
  }
  
  function shade(hex, amt){
    const n = parseInt(hex.slice(1), 16);
    let r = clamp((n>>16) + amt, 0, 255);
    let g = clamp(((n>>8)&0xff) + amt, 0, 255);
    let b = clamp((n&0xff) + amt, 0, 255);
    return '#' + ((r<<16)|(g<<8)|b).toString(16).padStart(6, '0');
  }
  function hexA(hex, a){
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;
  }
  function fmt(n){
    if(n >= 1e12) return (n/1e12).toFixed(2)+'T';
    if(n >= 1e9) return (n/1e9).toFixed(2)+'B';
    if(n >= 1e6) return (n/1e6).toFixed(2)+'M';
    if(n >= 1e3) return (n/1e3).toFixed(2)+'K';
    return Math.floor(n).toString();
  }
  function fmtSpeed(n){
    if(n >= 1e12) return (n/1e12).toFixed(2)+'T';
    if(n >= 1e9) return (n/1e9).toFixed(2)+'B';
    if(n >= 1e6) return (n/1e6).toFixed(2)+'M';
    if(n >= 1e3) return (n/1e3).toFixed(2)+'K';
    return Math.floor(n).toString();
  }
  
  // ========== 精緻繪製函數 ==========
  
  // 玩家造型
  function drawPlayerShape(size, time, stunned){
    const s = size;
    const bob = Math.sin(time*3)*2;
    
    ctx.save();
    ctx.translate(0, bob);
    
    const gl = ctx.createRadialGradient(0,0,s*0.5, 0,0,s*1.8);
    gl.addColorStop(0, 'rgba(100,180,255,0.5)');
    gl.addColorStop(1, 'rgba(100,180,255,0)');
    ctx.fillStyle = gl;
    ctx.beginPath();
    ctx.arc(0,0,s*1.8,0,7);
    ctx.fill();
    
    if(stunned) ctx.globalAlpha = 0.5 + Math.sin(time*20)*0.25;
    
    const bodyGrad = ctx.createRadialGradient(-s*0.3,-s*0.3,s*0.2, 0,0,s*1.2);
    bodyGrad.addColorStop(0, '#7ad0ff');
    bodyGrad.addColorStop(1, '#1a4a8a');
    ctx.shadowBlur = 14;
    ctx.shadowColor = '#000c';
    ctx.beginPath();
    ctx.arc(0,0,s,0,7);
    ctx.fillStyle = bodyGrad;
    ctx.fill();
    ctx.strokeStyle = '#aaddff';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#3a7ac8';
    ctx.beginPath();
    ctx.arc(0,-s*0.4,s*0.7,Math.PI,0);
    ctx.fill();
    ctx.fillStyle = '#2a5a9a';
    ctx.beginPath();
    ctx.arc(0,-s*0.4,s*0.5,Math.PI,0);
    ctx.fill();
    
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(-s*0.3,-s*0.1,s*0.18,s*0.22,0,0,7);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(s*0.3,-s*0.1,s*0.18,s*0.22,0,0,7);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-s*0.3,-s*0.1,s*0.08,0,7);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(s*0.3,-s*0.1,s*0.08,0,7);
    ctx.fill();
    
    ctx.strokeStyle = '#aaddff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0,s*0.1,s*0.25,0.2,Math.PI-0.2);
    ctx.stroke();
    
    ctx.strokeStyle = '#7ad0ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0,-s*1.1);
    ctx.lineTo(0,-s*1.5);
    ctx.stroke();
    ctx.fillStyle = '#ffaa00';
    ctx.beginPath();
    ctx.arc(0,-s*1.5,s*0.15,0,7);
    ctx.fill();
    
    ctx.restore();
  }

      ctx.arc(0,0,s*2.2,0,7);

    ctx.lineTo(s*0.7,-s*0.3);

    ctx.beginPath();
    ctx.arc(-s*0.3,-s*0.1,s*0.2,0,7);

    ctx.beginPath();
    ctx.arc(s*0.3,-s*0.1,s*0.2,0,7);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-s*0.3,-s*0.1,s*0.1,0,7);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(s*0.3,-s*0.1,s*0.1,0,7);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-s*0.3,s*0.3);
    ctx.lineTo(-s*0.15,s*0.55);
    ctx.lineTo(0,s*0.3);

  // 蛋造型
  function drawEggShape(size, rarityColor, sizeType, bob){
    const s = size;
    ctx.save();
    ctx.translate(0, bob);
    
    if(sizeType !== 'normal'){
      const glow = ctx.createRadialGradient(0,0,s*0.5, 0,0,s*2.2);
      glow.addColorStop(0, hexA(rarityColor, 0.5));
      glow.addColorStop(1, hexA(rarityColor, 0));
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0,0,s*2.2,0,7);
      ctx.fill();
    }
    
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#00000088';
    const grad = ctx.createRadialGradient(-s*0.3,-s*0.4,s*0.15, 0,0,s*1.3);
    if(sizeType === 'giant') { grad.addColorStop(0,'#aaddff'); grad.addColorStop(1,'#1a4a7a'); }
    else if(sizeType === 'huge') { grad.addColorStop(0,'#cce0ff'); grad.addColorStop(1,'#3a6a9a'); }
    else { grad.addColorStop(0,'#f0f0f0'); grad.addColorStop(1,'#7a7a7a'); }
    ctx.beginPath();
    ctx.ellipse(0,0,s,s*1.3,0,0,7);
    ctx.fillStyle = grad;
    ctx.fill();
    
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(-s*0.35,-s*0.45,s*0.25,s*0.35,-0.4,0,7);
    ctx.fill();
    ctx.globalAlpha = 1;
    
    ctx.fillStyle = hexA(rarityColor, 0.6);
    for(let i=0;i<4;i++){
      ctx.beginPath();
      ctx.arc(-s*0.2+i*s*0.25, s*0.2*Math.sin(i*2), s*0.08, 0, 7);
      ctx.fill();
    }
    
    ctx.restore();
  }
  
  // ========== 寵物繪製（簡化版，保留主要特徵） ==========
  function drawPetShape(shape, palette, size, time, rarityColor){
    const s = size;
    const body = palette.body;
    const belly = palette.belly;
    const accent = palette.accent;
    const bob = Math.sin(time*3)*1.5;
    
    ctx.save();
    ctx.translate(0, bob);
    
    // 通用身體
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.ellipse(0,0,s*0.6,s*0.7,0,0,7);
    ctx.fill();
    
    // 根據形狀添加特徵
    if(shape.includes('chicken') || shape.includes('bird')){
      // 雞冠/鳥冠
      ctx.fillStyle = '#ff3333';
      ctx.beginPath();
      ctx.arc(-s*0.1,-s*0.8,s*0.12,0,7);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(s*0.1,-s*0.8,s*0.12,0,7);
      ctx.fill();
      // 喙
      ctx.fillStyle = '#ffaa00';
      ctx.beginPath();
      ctx.moveTo(-s*0.15,-s*0.4);
      ctx.lineTo(s*0.15,-s*0.4);
      ctx.lineTo(0,-s*0.2);
      ctx.closePath();
      ctx.fill();
    } else if(shape.includes('dog') || shape.includes('fox') || shape.includes('bear')){
      // 耳朵
      ctx.fillStyle = shade(body,-20);
      ctx.beginPath();
      ctx.ellipse(-s*0.35,-s*0.6,s*0.15,s*0.22,0.3,0,7);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(s*0.35,-s*0.6,s*0.15,s*0.22,-0.3,0,7);
      ctx.fill();
      // 口鼻
      ctx.fillStyle = belly;
      ctx.beginPath();
      ctx.ellipse(0,-s*0.2,s*0.18,s*0.12,0,0,7);
      ctx.fill();
    } else if(shape.includes('dragon') || shape.includes('phoenix')){
      // 翅膀
      ctx.fillStyle = accent;
      ctx.beginPath();
      ctx.moveTo(-s*0.3,0);
      ctx.lineTo(-s*0.8,-s*0.4);
      ctx.lineTo(-s*0.3,-s*0.1);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(s*0.3,0);
      ctx.lineTo(s*0.8,-s*0.4);
      ctx.lineTo(s*0.3,-s*0.1);
      ctx.closePath();
      ctx.fill();
    } else if(shape.includes('shark') || shape.includes('orca') || shape.includes('fish')){
      // 魚鰭
      ctx.fillStyle = shade(body,-15);
      ctx.beginPath();
      ctx.moveTo(-s*0.1,-s*0.2);
      ctx.lineTo(s*0.1,-s*0.6);
      ctx.lineTo(s*0.3,-s*0.2);
      ctx.closePath();
      ctx.fill();
      // 尾巴
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.moveTo(s*0.5,0);
      ctx.lineTo(s*0.9,s*0.3);
      ctx.lineTo(s*0.9,-s*0.3);
      ctx.closePath();
      ctx.fill();
    }
    
    // 眼睛（通用）
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-s*0.2,-s*0.2,s*0.15,0,7);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(s*0.2,-s*0.2,s*0.15,0,7);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-s*0.2,-s*0.2,s*0.07,0,7);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(s*0.2,-s*0.2,s*0.07,0,7);
    ctx.fill();
    
    // 稀有度光環
    if(rarityColor){
      ctx.strokeStyle = hexA(rarityColor, 0.4);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0,0,s*0.8,0,7);
      ctx.stroke();
    }
    
    ctx.restore();
  }
  
  // ========== 初始化 ==========
  function reset(){
    S.player = {
      x: 540, y: 2900, r: 15,
      displaySpeed: 10,
      trailMul: 1, carry: null, stun: 0, tsLv: 1,
      knockbackTimer: 0, vx: 0, vy: 0,
      training: false, trainTickTimer: 0,
    };
    S.cash = 0; S.eggs = []; S.guards = []; S.pets = [];
    S.biomeIdx = 0; S.eggTimer = 0; S.cps = 0;
    S.selectedPet = null; S.camera = {x: 540, y: 2650}; S.zoom = 1.0;
    IndexData.discovered.clear();
    IndexData.claimed.clear();
    for(let bi=0; bi<WORLD.biomes.length; bi++){
      spawnEggsForBiome(bi);
      spawnGuardsForBiome(bi);
    }
    buildIndexUI();
    updateUI();
  }
  
  function spawnEggsForBiome(bi){
    const b = WORLD.biomes[bi];
    for(const nx of b.nestXs){
      for(let i=0; i<3; i++){
        const sr = Math.random();
        let size = 'normal', mul = 1, r = 12;
        if(sr > 0.9) { size = 'giant'; mul = 4; r = 20; }
        else if(sr > 0.65) { size = 'huge'; mul = 2.2; r = 16; }
        const petIdx = Math.floor(Math.random()*8);
        S.eggs.push({
          x: nx + rnd(-50,50), y: b.nestsY + rnd(-35,35),
          r, size, mul, petIdx, biomeIdx: bi, collected: false, float: Math.random()*10,
        });
      }
    }
  }
  
  function spawnGuardsForBiome(bi){
    const b = WORLD.biomes[bi];
    const gx = b.nestXs[Math.floor(b.nestXs.length/2)];
    S.guards.push({
      x: gx, y: b.nestsY - 60, r: 18,
      spd: 0.5 + bi*0.08,
      alert: false, stun: 0, hx: gx, hy: b.nestsY - 60,
      biomeIdx: bi,
    });
  }
  
  // ========== 圖鑑 UI ==========
  function buildIndexUI(){
    const tabs = document.getElementById('indexTabs');
    tabs.innerHTML = '';
    WORLD.biomes.forEach((b,i) => {
      const tab = document.createElement('div');
      tab.className = 'index-tab' + (i===S.indexTab ? ' active' : '');
      tab.textContent = b.icon + ' ' + b.name;
      tab.onclick = () => { S.indexTab = i; buildIndexUI(); };
      tabs.appendChild(tab);
    });
    
    const grid = document.getElementById('indexGrid');
    grid.innerHTML = '';
    const bi = S.indexTab;
    const b = WORLD.biomes[bi];
    for(let pi=0; pi<8; pi++){
      const key = bi + '_' + pi;
      const unlocked = IndexData.discovered.has(key);
      const claimed = IndexData.claimed.has(key);
      const rar = WORLD.petRarity[bi][pi];
      const rc = WORLD.rarities[rar].c;
      
      const card = document.createElement('div');
      card.className = 'index-card ' + (unlocked ? 'unlocked' : 'locked');
      
      const cv = document.createElement('canvas');
      cv.width = 36; cv.height = 36;
      const cx = cv.getContext('2d');
      if(unlocked){
        const palette = BIOME_PALETTES[bi];
        const shape = PET_SHAPES[bi][pi];
        cx.translate(18, 18);
        drawPetShape(shape, palette, 16, performance.now()/1000, rc);
      } else {
        cx.fillStyle = '#2a3a4a';
        cx.font = '18px "Segoe UI"';
        cx.textAlign = 'center';
        cx.textBaseline = 'middle';
        cx.fillText('?', 18, 18);
      }
      card.appendChild(cv);
      
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = unlocked ? b.petNames[pi] : '???';
      card.appendChild(name);
      
      const rl = document.createElement('div');
      rl.className = 'rarity-label';
      rl.style.color = rc;
      rl.style.background = hexA(rc, 0.15);
      rl.textContent = unlocked ? WORLD.rarities[rar].n : '未知';
      card.appendChild(rl);
      
      if(unlocked && !claimed){
        const rb = document.createElement('button');
        rb.className = 'reward-btn';
        rb.textContent = '🎁';
        rb.onclick = (e) => {
          e.stopPropagation();
          IndexData.claimed.add(key);
          const reward = WORLD.petIncome[bi][pi] * 20;
          S.cash += reward;
          buildIndexUI();
          updateUI();
        };
        card.appendChild(rb);
      } else if(claimed){
        const rb = document.createElement('button');
        rb.className = 'reward-btn claimed';
        rb.textContent = '✓';
        rb.disabled = true;
        card.appendChild(rb);
      }
      
      grid.appendChild(card);
    }
    
    document.getElementById('uiIndex').textContent = IndexData.discovered.size + '/' + (WORLD.biomes.length*8);
  }

  function sellSelectedPet(){

    const pet = S.selectedPet;
    const sellPrice = pet.inc * 15;
    S.cash += sellPrice;
    
    const idx = S.pets.indexOf(pet);
    if(idx >= 0) S.pets.splice(idx, 1);

    closePetPanel();
    updateUI();
    saveGame();

  // ========== 更新邏輯 ==========
  function update(dt){
    const p = S.player;
    S.time += dt;
    
    if(p.knockbackTimer > 0){
      p.knockbackTimer -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.88;
      p.vy *= 0.88;
      p.x = clamp(p.x, 20, 1000);
      p.y = clamp(p.y, -1900, 3180);
      p.stun = Math.max(0, p.stun - dt);
      updateUI();
      return;
    }
    
    if(p.stun > 0){
      p.stun = Math.max(0, p.stun - dt);
      updateUI();
      return;
    }
    
    const onTreadmill = dist(p.x, p.y, S.treadmill.x, S.treadmill.y) < 60;
    p.training = onTreadmill;
    
    if(onTreadmill){
      p.trainTickTimer += dt;
      while(p.trainTickTimer >= 0.25){
        p.trainTickTimer -= 0.25;
        const gain = 0.8 + p.tsLv * 0.7 + Math.sqrt(p.displaySpeed) * 0.08;
        p.displaySpeed += gain;
      }
    }
    
    // 移動輸入
    let dx = 0, dy = 0;
    if(keys['w'] || keys['arrowup']) dy -= 1;
    if(keys['s'] || keys['arrowdown']) dy += 1;
    if(keys['a'] || keys['arrowleft']) dx -= 1;
    if(keys['d'] || keys['arrowright']) dx += 1;
    
    if(S.joystickActive){
      dx += S.joystickDX;
      dy += S.joystickDY;
    }
    
    if(dx !== 0 || dy !== 0){
      const len = Math.hypot(dx, dy);
      dx /= len; dy /= len;
      const realSpeed = displayToReal(p.displaySpeed);
      let moveSpeed = realSpeed * 2.5 * p.trailMul;
      if(p.carry){
        const w = p.carry.size === 'giant' ? 0.35 : (p.carry.size === 'huge' ? 0.55 : 0.75);
        moveSpeed *= w;
      }
      p.x += dx * moveSpeed * dt;
      p.y += dy * moveSpeed * dt;
      p.x = clamp(p.x, 20, 1000);
      p.y = clamp(p.y, -1900, 3180);
    }
    
    // 速度門檻檢查
    const currentBiome = findBiomeAtY(p.y);
    if(currentBiome > 0 && !canEnterBiome(currentBiome)){
      const dirY = Math.sign(2500 - p.y) || 1;
      triggerKnockback(rnd(-200, 200), dirY * 800);
      updateUI();
      return;
    }
    
    // 守衛 AI
    for(const g of S.guards){
      if(g.stun > 0) { g.stun -= dt; continue; }
      const b = WORLD.biomes[g.biomeIdx];
      const d = dist(p.x, p.y, g.x, g.y);
      const playerInBiome = p.y > b.yMin - 100 && p.y < b.yMax + 100;
      
      let tx = g.hx, ty = g.hy;
      if(p.carry && playerInBiome && d < 350) { g.alert = true; tx = p.x; ty = p.y; }
      else if(g.alert && d > 500) g.alert = false;
      
      if(g.alert){
        const gx = p.x - g.x, gy = p.y - g.y;
        const len = Math.hypot(gx, gy) || 1;
        const boost = canEnterBiome(g.biomeIdx) ? 1 : 3;
        g.x += (gx/len) * g.spd * 2.0 * boost;
        g.y += (gy/len) * g.spd * 2.0 * boost;
      } else {
        if(dist(g.x, g.y, g.hx, g.hy) > 40){
          const gx = g.hx - g.x, gy = g.hy - g.y;
          const len = Math.hypot(gx, gy) || 1;
          g.x += (gx/len) * g.spd * 0.5;
          g.y += (gy/len) * g.spd * 0.5;
        } else {
          g.hx = b.nestXs[Math.floor(Math.random()*b.nestXs.length)] + rnd(-60, 60);
          g.hy = b.nestsY - 60 + rnd(-30, 30);
        }
      }
      g.x = clamp(g.x, 30, 1000);
      g.y = clamp(g.y, b.yMin + 20, b.yMax - 20);
    }
    
    // 撿蛋（簡化，無卡死）
    if(!p.carry){
      for(const e of S.eggs){
        if(e.collected) continue;
        if(dist(p.x, p.y, e.x, e.y) < p.r + e.r + 4){
          if(!canEnterBiome(e.biomeIdx)){
            triggerKnockback(rnd(-200, 200), 700);
            break;
          }
          e.collected = true;
          p.carry = {...e};
          for(const g of S.guards){
            if(g.biomeIdx === e.biomeIdx) g.alert = true;
          }
          updateUI();
          break;
        }
      }
    }
    
    // 回基地
    if(p.carry && p.y > 2500){
      const egg = p.carry;
      const b = WORLD.biomes[egg.biomeIdx];
      const inc = WORLD.petIncome[egg.biomeIdx][egg.petIdx] * egg.mul;
      const rar = WORLD.petRarity[egg.biomeIdx][egg.petIdx];
      const usedSlots = new Set(S.pets.map(pt => pt.slot).filter(s => s !== undefined));
      let slot = -1;
      for(let i=0; i<S.farmPods.length; i++){
        if(!usedSlots.has(i)) { slot = i; break; }
      }
      if(slot === -1) slot = Math.floor(Math.random() * S.farmPods.length);
      
      S.pets.push({
        id: Math.random().toString(36).slice(2),
        name: b.petNames[egg.petIdx],
        inc, rar, biomeIdx: egg.biomeIdx, petIdx: egg.petIdx,
        x: S.farmPods[slot].x, y: S.farmPods[slot].y,
        vx: rnd(-8, 8), vy: rnd(-8, 8),
        selected: false, slot,
      });
      discoverPet(egg.biomeIdx, egg.petIdx);
      p.carry = null;
      for(const g of S.guards) g.alert = false;
      S.cps = S.pets.reduce((s,pt) => s + pt.inc, 0) * 0.05;
      updateUI();
      saveGame();
    }
    
    // 守衛抓人
    for(const g of S.guards){
      if(g.stun > 0) continue;
      if(dist(p.x, p.y, g.x, g.y) < p.r + g.r + 6 && p.stun <= 0 && p.knockbackTimer <= 0){
        if(p.carry){
          const drop = p.carry;
          S.eggs.push({...drop, x: p.x + rnd(-15, 15), y: p.y + rnd(-15, 15), collected: false});
          p.carry = null;
        }
        const kbx = p.x - g.x, kby = p.y - g.y;
        const kblen = Math.hypot(kbx, kby) || 1;
        const force = 350 + displayToReal(p.displaySpeed) * 5;
        triggerKnockback((kbx/kblen) * force, (kby/kblen) * force);
        g.stun = 1.2;
        g.alert = false;
        updateUI();
        break;
      }
    }
    
    S.eggTimer += dt;
    if(S.eggTimer > 20){
      S.eggTimer = 0;
      S.eggs = S.eggs.filter(e => !e.collected);
      if(S.eggs.length < 25){
        for(let bi=0; bi<WORLD.biomes.length; bi++) spawnEggsForBiome(bi);
      }
    }
    
    S.cash += S.cps * dt;
    
    for(let i=1; i<WORLD.biomes.length; i++){
      if(S.biomeIdx < i && p.displaySpeed >= WORLD.biomes[i].reqDisplay){
        S.biomeIdx = i;
        updateUI();
        break;
      }
    }
    
    for(const pt of S.pets){
      pt.x += pt.vx * dt * 3;
      pt.y += pt.vy * dt * 3;
      const pod = S.farmPods[pt.slot];
      if(pod && dist(pt.x, pt.y, pod.x, pod.y) > 45){
        pt.vx = (pod.x - pt.x) * 0.02;
        pt.vy = (pod.y - pt.y) * 0.02;
      }
      pt.x = clamp(pt.x, 80, 1000);
      pt.y = clamp(pt.y, 2700, 3150);
    }
    
    S.camera.x += (p.x - S.camera.x) * 0.08;
    S.camera.y += (p.y - 200 - S.camera.y) * 0.08;
    
    updateUI();
  }
  
  function findBiomeAtY(y){
    for(let i=0; i<WORLD.biomes.length; i++){
      const b = WORLD.biomes[i];
      if(y >= b.yMin && y <= b.yMax) return i;
    }
    return y < 0 ? WORLD.biomes.length - 1 : 0;
  }
  
  function canEnterBiome(bi){
    return S.player.displaySpeed >= WORLD.biomes[bi].reqDisplay;
  }
  
  // ========== 繪製主函數 ==========
  function draw(){
    if(W === 0 || H === 0) return;
    
    ctx.clearRect(0, 0, W, H);
    
    // 背景
    ctx.fillStyle = '#0a1018';
    ctx.fillRect(0, 0, W, H);
    
    // 生物群系
    for(let bi = WORLD.biomes.length - 1; bi >= 0; bi--){
      const b = WORLD.biomes[bi];
      const p1 = worldToScreen(0, b.yMax);
      const p2 = worldToScreen(W, b.yMin);
      const y1 = p1.y, y2 = p2.y;
      if(y2 > H || y1 < 0) continue;
      
      const grad = ctx.createLinearGradient(0, y2, 0, y1);
      grad.addColorStop(0, shade(b.color, 12));
      grad.addColorStop(0.5, b.color);
      grad.addColorStop(1, shade(b.color, -12));
      ctx.fillStyle = grad;
      ctx.fillRect(0, y2, W, y1 - y2);
      
      ctx.font = '800 12px "Segoe UI"';
      ctx.fillStyle = hexA(b.accent, 0.8);
      ctx.textAlign = 'left';
      const reqStr = b.reqDisplay > 0 ? '⚡' + fmtSpeed(b.reqDisplay) : '新手區';
      ctx.fillText(`${b.icon} ${b.name}  ${reqStr}`, 10, y2 + 20);
    }
    
    // 安全線
    const safeY = worldToScreen(0, 2500).y;
    if(safeY > -20 && safeY < H + 20){
      ctx.save();
      ctx.setLineDash([10, 6]);
      ctx.strokeStyle = '#ff5a5a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, safeY);
      ctx.lineTo(W, safeY);
      ctx.stroke();
      ctx.restore();
    }
    
    // 蛋
    for(const e of S.eggs){
      if(e.collected) continue;
      const sp = worldToScreen(e.x, e.y);
      if(sp.y < -50 || sp.y > H + 50) continue;
      const rar = WORLD.petRarity[e.biomeIdx][e.petIdx];
      const rc = WORLD.rarities[rar].c;
      const bob = Math.sin(S.time*2 + e.float) * 3;
      const sc = S.zoom;
      
      ctx.save();
      ctx.translate(sp.x, sp.y + bob*sc);
      ctx.scale(sc, sc);
      drawEggShape(e.r, rc, e.size, 0);
      if(rar >= 4){
        ctx.font = 'bold 12px "Segoe UI"';
        ctx.fillStyle = rc;
        ctx.textAlign = 'center';
        ctx.fillText('★', 0, -e.r*1.6);
      }
      ctx.restore();
    }
    
    // 守衛
    for(const g of S.guards){
      const sp = worldToScreen(g.x, g.y);
      if(sp.y < -60 || sp.y > H + 60) continue;
      const sc = S.zoom;
      ctx.save();
      ctx.translate(sp.x, sp.y);
      ctx.scale(sc, sc);
      drawGuardShape(g.r, S.time, g.alert, g.biomeIdx);
      ctx.restore();
    }
    
    // 基地
    const baseP1 = worldToScreen(0, 2700);
    const baseP2 = worldToScreen(0, 3200);
    if(baseP2.y > 0 && baseP1.y < H){
      ctx.fillStyle = 'rgba(28, 58, 36, 0.6)';
      ctx.fillRect(0, baseP1.y, W, baseP2.y - baseP1.y);
      ctx.strokeStyle = '#4a7a4a';
      ctx.lineWidth = 2;
      ctx.strokeRect(4, baseP1.y, W-8, baseP2.y - baseP1.y - 4);
    }
    
    // 跑步機
    const tm = worldToScreen(S.treadmill.x, S.treadmill.y);
    if(tm.y > -50 && tm.y < H + 50){
      ctx.save();
      if(S.player.training){
        const gl = ctx.createRadialGradient(tm.x, tm.y, 20, tm.x, tm.y, 70);
        gl.addColorStop(0, 'rgba(94,200,255,0.5)');
        gl.addColorStop(1, 'rgba(94,200,255,0)');
        ctx.fillStyle = gl;
        ctx.beginPath();
        ctx.arc(tm.x, tm.y, 70, 0, 7);
        ctx.fill();
      }
      ctx.fillStyle = S.player.training ? '#3a5a8a' : '#2a4a6a';
      ctx.beginPath();
      ctx.roundRect(tm.x - 50, tm.y - 28, 100, 56, 10);
      ctx.fill();
      ctx.strokeStyle = S.player.training ? '#7addff' : '#5ec8ff';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.font = 'bold 11px "Segoe UI"';
      ctx.fillStyle = S.player.training ? '#cceeff' : '#aaddff';
      ctx.textAlign = 'center';
      ctx.fillText('🏃', tm.x, tm.y + 4);
      ctx.restore();
    }
    
    // 農場底座
    for(const pod of S.farmPods){
      const sp = worldToScreen(pod.x, pod.y);
      if(sp.y < -30 || sp.y > H + 30) continue;
      ctx.fillStyle = 'rgba(42, 74, 42, 0.5)';
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, 18, 0, 7);
      ctx.fill();
      ctx.strokeStyle = 'rgba(74, 122, 74, 0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    
    // 玩家
    const pp = worldToScreen(S.player.x, S.player.y);
    if(pp.y > -60 && pp.y < H + 60){
      const sc = S.zoom;
      ctx.save();
      ctx.translate(pp.x, pp.y);
      ctx.scale(sc, sc);
      drawPlayerShape(S.player.r, S.time, S.player.stun > 0);
      
      if(S.player.carry){
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ffaa00';
        const cg = ctx.createRadialGradient(-3, -22, 3, 0, -16, 14);
        cg.addColorStop(0, '#ffe68f');
        cg.addColorStop(1, '#b8860b');
        ctx.beginPath();
        ctx.ellipse(0, -18, 10, 14, 0, 0, 7);
        ctx.fillStyle = cg;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      ctx.restore();
    }
    
    // 農場寵物
    for(const pt of S.pets){
      const sp = worldToScreen(pt.x, pt.y);
      if(sp.y < -30 || sp.y > H + 30) continue;
      const sc = S.zoom;
      const rc = WORLD.rarities[pt.rar].c;
      
      ctx.save();
      ctx.translate(sp.x, sp.y);
      ctx.scale(sc, sc);
      
      if(pt.selected){
        const gl = ctx.createRadialGradient(0,0,6, 0,0,30);
        gl.addColorStop(0, hexA(rc, 0.6));
        gl.addColorStop(1, hexA(rc, 0));
        ctx.fillStyle = gl;
        ctx.beginPath();
        ctx.arc(0,0,30,0,7);
        ctx.fill();
      }
      
      const palette = BIOME_PALETTES[pt.biomeIdx];
      const shape = PET_SHAPES[pt.biomeIdx][pt.petIdx];
      drawPetShape(shape, palette, 16, S.time, rc);
      ctx.restore();
    }
    
    // 擊飛提示
    if(S.player.knockbackTimer > 0){
      ctx.textAlign = 'center';
      ctx.font = '900 24px "Segoe UI"';
      ctx.fillStyle = '#ff6a6a';
      ctx.shadowBlur = 18;
      ctx.shadowColor = '#ff0000';
      ctx.fillText('💥 被擊飛!', W/2, H/2 - 80);
      ctx.shadowBlur = 0;
    }
    
    if(S.player.training){
      ctx.textAlign = 'center';
      ctx.font = '900 20px "Segoe UI"';
      ctx.fillStyle = '#7affb0';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00ff88';
      ctx.fillText('⚡ 訓練中...', W/2, 60);
      ctx.shadowBlur = 0;
    }
  }
  
  // ========== 觸控 ==========
  function initTouchControls(){
    S.isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || 
                 ('ontouchstart' in window && window.innerWidth < 1024);
    
    if(S.isMobile){
      const joystick = document.getElementById('joystickZone');
      const knob = document.getElementById('joystickKnob');
      let jc = {x:0, y:0};
      let active = false;
      
      const start = (e) => {
        e.preventDefault();
        const t = e.touches ? e.touches[0] : e;
        const rect = joystick.getBoundingClientRect();
        jc = {x: rect.left + rect.width/2, y: rect.top + rect.height/2};
        active = true;
        S.joystickActive = true;
        update(t.clientX, t.clientY);
      };
      
      const update = (cx, cy) => {
        if(!active) return;
        const dx = cx - jc.x, dy = cy - jc.y;
        const len = Math.hypot(dx, dy);
        const maxD = 30;
        const cl = Math.min(len, maxD);
        const nx = len > 0 ? dx/len : 0;
        const ny = len > 0 ? dy/len : 0;
        knob.style.transform = `translate(calc(-50% + ${nx*cl}px), calc(-50% + ${ny*cl}px))`;
        S.joystickDX = nx * (cl/maxD);
        S.joystickDY = ny * (cl/maxD);
      };
      
      const end = () => {
        active = false;
        S.joystickActive = false;
        S.joystickDX = 0;
        S.joystickDY = 0;
        knob.style.transform = 'translate(-50%,-50%)';
      };
      
      joystick.addEventListener('touchstart', start, {passive: false});
      joystick.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if(active) update(e.touches[0].clientX, e.touches[0].clientY);
      }, {passive: false});
      joystick.addEventListener('touchend', end);
      joystick.addEventListener('touchcancel', end);
      
      joystick.classList.add('active');
      
      c.addEventListener('touchstart', (e) => {
        const t = e.touches[0];
        const rect = c.getBoundingClientRect();
        const sx = (t.clientX - rect.left) * (W / rect.width);
        const sy = (t.clientY - rect.top) * (H / rect.height);
        const w = screenToWorld(sx, sy);
        
        for(const pt of S.pets){
          if(dist(w.x, w.y, pt.x, pt.y) < 40){
            openPetPanel(pt);
            e.preventDefault();
            return;
          }
        }
        
        if(S.panelOpen){
          closePetPanel();
          e.preventDefault();
        }
      }, {passive: false});
    } else {
      let dragging = false, lx = 0, ly = 0;
      c.addEventListener('mousedown', (e) => {
        const rect = c.getBoundingClientRect();
        const sx = (e.clientX - rect.left) * (W / rect.width);
        const sy = (e.clientY - rect.top) * (H / rect.height);
        const w = screenToWorld(sx, sy);
        
        for(const pt of S.pets){
          if(dist(w.x, w.y, pt.x, pt.y) < 30){
            openPetPanel(pt);
            return;
          }
        }
        
        if(S.panelOpen){ closePetPanel(); return; }
        
        dragging = true;
        lx = e.clientX;
        ly = e.clientY;
      });
      
      c.addEventListener('mousemove', (e) => {
        if(!dragging) return;
        const rect = c.getBoundingClientRect();
        const dx = (e.clientX - lx) * (W / rect.width);
        const dy = (e.clientY - ly) * (H / rect.height);
        S.camera.x -= dx / S.zoom;
        S.camera.y -= dy / S.zoom;
        lx = e.clientX;
        ly = e.clientY;
      });
      
      c.addEventListener('mouseup', () => dragging = false);
      c.addEventListener('mouseleave', () => dragging = false);
    }
  }
  
  // ========== 鍵盤 ==========
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){
      e.preventDefault();
    }
    if(k === 'escape'){
      if(S.panelOpen) closePetPanel();
      if(S.indexOpen){ S.indexOpen = false; document.getElementById('indexPanel').classList.remove('open'); }
    }
  });
  window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
  });
  
  // ========== UI ==========
  function updateUI(){
    const p = S.player;
    document.getElementById('uiSpeed').textContent = fmtSpeed(p.displaySpeed);
    document.getElementById('uiCash').textContent = fmt(S.cash);
    document.getElementById('uiEgg').textContent = p.carry ? '1' : '0';
    document.getElementById('lvTxt').textContent = p.tsLv;
    document.getElementById('costTxt').textContent = '$' + fmt(treadmillCost(p.tsLv));
    
    const b = WORLD.biomes[S.biomeIdx];
    document.getElementById('uiBiome').textContent = b.name;
    document.getElementById('uiBiomeIcon').textContent = b.icon;
    
    document.getElementById('trainStatus').textContent = p.training ? '⚡ 訓練中' : '🚶 未訓練';
    document.getElementById('uiIndex').textContent = IndexData.discovered.size + '/' + (WORLD.biomes.length*8);
    
    document.getElementById('btnUp').disabled = S.cash < treadmillCost(p.tsLv);
    document.getElementById('btnSellSelected').disabled = !S.selectedPet;
  }
  
  // ========== 按鈕事件 ==========
  document.getElementById('btnUp').addEventListener('click', () => {
    const cost = treadmillCost(S.player.tsLv);
    if(S.cash >= cost){
      S.cash -= cost;
      S.player.tsLv++;
      updateUI();
      saveGame();
    }
  });
  
  document.getElementById('btnIndex').addEventListener('click', () => {
    S.indexOpen = true;
    document.getElementById('indexPanel').classList.add('open');
    buildIndexUI();
  });
  
  document.getElementById('btnCloseIndex').addEventListener('click', () => {
    S.indexOpen = false;
    document.getElementById('indexPanel').classList.remove('open');
  });
  
  document.getElementById('btnEquip').addEventListener('click', () => {
    if(S.pets.length === 0) return;
    S.cps = S.pets.reduce((s,pt) => s + pt.inc, 0) * 0.05;
    updateUI();
  });
  
  document.getElementById('btnSellSelected').addEventListener('click', sellSelectedPet);
  document.getElementById('btnSellPanel').addEventListener('click', sellSelectedPet);
  document.getElementById('btnClosePanel').addEventListener('click', closePetPanel);
  document.getElementById('btnSave').addEventListener('click', saveGame);
  
  // ========== 主循環 ==========
  let lastTime = 0;
  function loop(now){
    const dt = Math.min(0.05, (now - (lastTime || now)) / 1000);
    lastTime = now;
    if(dt > 0) update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  
  // ========== 啟動 ==========
  resizeCanvas();
  reset();
  
  const loaded = loadGame();
  if(loaded){
    S.cps = S.pets.reduce((s,pt) => s + pt.inc, 0) * 0.05;
    S.camera.x = S.player.x;
    S.camera.y = S.player.y - 200;
    buildIndexUI();
    updateUI();
  } else {
    setTimeout(saveGame, 1000);
  }
  
  initTouchControls();
  requestAnimationFrame(loop);
  
  setInterval(updateUI, 150);
  setInterval(() => { if(S.indexOpen) buildIndexUI(); }, 200);
  setInterval(saveGame, 10000);
  
  window.addEventListener('beforeunload', saveGame);
  document.addEventListener('visibilitychange', () => {
    if(document.hidden) saveGame();
  });
})();
</script>
