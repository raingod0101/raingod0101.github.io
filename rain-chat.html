<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聊天室 | 雨神</title>
    <link rel="stylesheet" href="menu.css">
    <style>
        :root {
            --me-bg: #007aff;
            --other-bg: #f2f2f7;
            --danger: #ff3b30;
            --text-gray: #8e8e93;
            --success: #34c759;
            --border: #e2e6ed;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #f3f5f8;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow-x: hidden;
        }
        #nav_bar { position: relative; z-index: 10; }

        .tab-bar {
            display: flex;
            gap: 4px;
            max-width: 860px;
            margin: 20px auto 0;
            padding: 5px;
            background: #e8ecf2;
            border-radius: 12px;
            width: calc(100% - 32px);
        }
        .tab-btn {
            flex: 1;
            padding: 11px 8px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: #5b6470;
            font: inherit;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            position: relative;
        }
        .tab-btn.active {
            background: #fff;
            color: #1d1d1f;
            box-shadow: 0 1px 4px rgba(25, 40, 60, 0.12);
        }
        .tab-btn .tab-badge {
            display: none;
            min-width: 17px;
            height: 17px;
            padding: 0 4px;
            margin-left: 4px;
            border-radius: 9px;
            background: var(--danger);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            line-height: 17px;
            text-align: center;
            vertical-align: middle;
        }
        .tab-btn .tab-badge.show { display: inline-block; }

        .page-wrap {
            max-width: 860px;
            margin: 18px auto 40px;
            padding: 0 16px;
        }
        .page { display: none; }
        .page.active { display: block; }

        .card {
            margin-bottom: 18px;
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 8px 24px rgba(25, 40, 60, 0.06);
        }
        .card h2 { margin: 0 0 8px; font-size: 1.1rem; }
        .card h3 { margin: 18px 0 8px; font-size: 0.95rem; }
        .profile-help, .profile-status {
            color: #606a78; font-size: 0.88rem; line-height: 1.5;
        }
        .profile-status { min-height: 1.4em; margin: 10px 0 0; }
        .profile-status.error { color: #b42318; }
        .profile-status.ok { color: var(--success); }

        .page-heading {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; margin-bottom: 18px;
        }
        .page-heading h1 { margin: 0; font-size: 1.55rem; }

        .profile-avatar-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .avatar-wrap { position: relative; width: 104px; height: 104px; flex: 0 0 auto; }
        .profile-avatar {
            width: 104px; height: 104px; border: 2px solid var(--border);
            border-radius: 50%; object-fit: cover; background: #fff;
        }
        .avatar-edit-btn {
            position: absolute; right: -2px; bottom: -2px;
            width: 34px; height: 34px; border-radius: 50%;
            border: 2px solid #fff; background: var(--me-bg); color: #fff;
            font-size: 16px; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
        }

        .profile-form { display: grid; gap: 14px; margin-top: 16px; }
        .profile-form label { display: grid; gap: 7px; font-size: 0.9rem; font-weight: 600; }
        .profile-form input {
            width: 100%; padding: 11px 12px; border: 1px solid #cbd2dc;
            border-radius: 8px; font: inherit;
        }
        .profile-form input:focus {
            border-color: #4285f4; outline: 2px solid rgba(66, 133, 244, 0.18);
        }
        .profile-button {
            width: fit-content; padding: 10px 16px; border: 0;
            border-radius: 8px; background: #2878e3; color: #fff;
            font: inherit; font-weight: 600; cursor: pointer;
        }
        .profile-button:disabled { cursor: wait; opacity: 0.65; }
        .profile-button.secondary { background: #687385; }
        .profile-button.danger { background: var(--danger); }

        .search-row { display: flex; gap: 8px; }
        .search-row input {
            flex: 1; padding: 10px 12px; border: 1px solid #cbd2dc;
            border-radius: 8px; font: inherit;
        }
        .friend-list, .request-list, .search-results {
            list-style: none; margin: 0; padding: 0;
            display: flex; flex-direction: column; gap: 8px;
        }
        .friend-item, .request-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px; border-radius: 12px; background: #f7f9fc;
            border: 1px solid transparent;
        }
        .friend-item.active { border-color: var(--me-bg); background: #eaf2ff; }
        .friend-avatar {
            width: 42px; height: 42px; border-radius: 50%;
            object-fit: cover; background: #fff; flex: 0 0 auto;
            border: 1px solid var(--border);
        }
        .friend-name {
            flex: 1; font-weight: 600; font-size: 0.95rem;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .friend-unread {
            min-width: 18px; height: 18px; padding: 0 5px;
            border-radius: 9px; background: var(--danger); color: #fff;
            font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
            display: none;
        }
        .friend-unread.show { display: inline-block; }
        .friend-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .mini-btn {
            padding: 6px 11px; border-radius: 7px; border: 1px solid #ccc;
            background: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
        }
        .mini-btn.primary { background: var(--me-bg); color: #fff; border-color: var(--me-bg); }
        .mini-btn.success { background: var(--success); color: #fff; border-color: var(--success); }
        .mini-btn.danger { background: #fff0f0; color: var(--danger); border-color: #ffc9c9; }

        .chat-panel {
            display: flex; flex-direction: column;
            background: #fff; border-radius: 16px; overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 8px 24px rgba(25, 40, 60, 0.06);
            height: calc(100vh - 190px);
            min-height: 460px;
        }
        .chat-layout { display: flex; height: 100%; }
        .chat-sidebar {
            width: 210px; flex-shrink: 0; border-right: 1px solid #eee;
            overflow-y: auto; background: #fafbfd;
        }
        .chat-sidebar-title {
            padding: 12px 14px 6px; font-size: 12px; font-weight: 700;
            color: var(--text-gray); letter-spacing: 0.4px;
        }
        .chat-sidebar .friend-item { border-radius: 0; border: 0; background: transparent; }
        .chat-sidebar .friend-item.active { background: #eaf2ff; }
        .chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

        .chat-mobile-picker {
            display: none;
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            background: #fff;
            flex-shrink: 0;
        }
        .chat-mobile-picker select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd2dc;
            border-radius: 9px;
            font: inherit;
            background: #fff;
            color: #1d1d1f;
        }

        .chat-header {
            padding: 13px 16px; border-bottom: 1px solid #eee;
            display: flex; justify-content: space-between; align-items: center;
            background: #fff; flex-shrink: 0;
        }
        .chat-header .title { font-weight: 700; }
        .chat-header .sub { font-size: 12px; color: var(--text-gray); }
        .chat-header-actions { display: flex; gap: 8px; }
        .chat-box {
            flex: 1; overflow-y: auto; padding: 15px;
            display: flex; flex-direction: column; gap: 12px;
            background: #fbfcfe;
        }
        .chat-empty {
            margin: auto; text-align: center; color: var(--text-gray);
            font-size: 0.92rem; padding: 30px;
        }

        .msg-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            width: 100%;
        }
        .msg-row.me { flex-direction: row-reverse; }
        .msg-avatar {
            width: 34px; height: 34px; border-radius: 50%;
            object-fit: cover; background: #fff; flex: 0 0 auto;
            border: 1px solid var(--border);
        }
        .msg-body {
            display: flex; flex-direction: column;
            max-width: 78%;
        }
        .msg-row.me .msg-body { align-items: flex-end; }
        .msg-row.other .msg-body { align-items: flex-start; }
        .msg-info { font-size: 11px; color: var(--text-gray); margin-bottom: 3px; padding: 0 5px; }
        .bubble {
            padding: 10px 13px; border-radius: 16px; font-size: 14px;
            word-break: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
            white-space: pre-wrap;
            position: relative;
        }
        .me .bubble { background: var(--me-bg); color: #fff; border-bottom-right-radius: 4px; }
        .other .bubble { background: var(--other-bg); color: #111; border-bottom-left-radius: 4px; }
        .bubble.recalled {
            background: transparent !important;
            color: var(--text-gray) !important;
            font-style: italic;
            box-shadow: none;
            padding: 4px 8px;
        }
        .msg-recall-btn {
            display: none;
            margin-top: 3px;
            font-size: 11px;
            color: var(--text-gray);
            background: transparent;
            border: 0;
            cursor: pointer;
            padding: 2px 5px;
        }
        .msg-row.me .msg-recall-btn { align-self: flex-end; }
        .msg-row:hover .msg-recall-btn { display: inline-block; }
        @media (hover: none) {
            .msg-row .msg-recall-btn { display: inline-block; opacity: 0.6; }
        }

        .chat-input-area {
            padding: 10px 12px; border-top: 1px solid #eee;
            display: flex; gap: 8px; align-items: center; background: #fff;
        }
        .chat-input-area input[type="text"] {
            flex: 1; padding: 11px 14px; border: none; background: #f2f2f7;
            border-radius: 22px; outline: none; font-size: 15px;
        }
        .chat-send-btn {
            border: none; background: var(--me-bg); color: #fff;
            font-weight: 700; padding: 10px 16px; border-radius: 20px;
            cursor: pointer; font-size: 14px; flex-shrink: 0;
        }
        .chat-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .hidden { display: none !important; }

        @media (max-width: 640px) {
            .chat-sidebar { display: none; }
            .chat-mobile-picker { display: block; }
            .chat-panel { height: calc(100vh - 210px); }
            .tab-btn { font-size: 0.82rem; padding: 10px 4px; }
            .page-wrap { padding: 0 10px; }
            .card { padding: 18px; }
            .msg-body { max-width: 82%; }
        }
    </style>
</head>
<body>
    <div id="nav_bar"></div>

    <p id="login-required" class="profile-help" style="text-align:center;margin:24px;" hidden>請先登入帳號，再管理個人檔案與好友。</p>

    <div id="app-area" hidden>
        <div class="tab-bar" role="tablist">
            <button class="tab-btn" data-page="profile" role="tab">個人檔案</button>
            <button class="tab-btn" data-page="friends" role="tab">好友 <span class="tab-badge" id="tab-badge-requests"></span></button>
            <button class="tab-btn active" data-page="chat" role="tab">聊天室 <span class="tab-badge" id="tab-badge-unread"></span></button>
        </div>

        <div class="page-wrap">
            <!-- ===== 個人檔案 ===== -->
            <section class="page" id="page-profile">
                <div class="page-heading">
                    <h1>個人檔案</h1>
                    <button id="sign-out" class="profile-button secondary" type="button">登出</button>
                </div>

                <section class="card">
                    <h2>個人頭像</h2>
                    <div class="profile-avatar-row">
                        <div class="avatar-wrap">
                            <img id="profile-avatar" class="profile-avatar" src="https://raingod0101.github.io/catdragon.png" alt="個人頭像">
                            <button id="avatar-edit-btn" class="avatar-edit-btn" type="button" title="更換頭像">✎</button>
                        </div>
                        <div>
                            <p class="profile-help">點擊右下角鉛筆更換頭像，儲存後會同步到帳號資料庫。</p>
                            <input id="avatar-file-input" type="file" accept="image/*" class="hidden">
                        </div>
                    </div>
                    <p id="avatar-status" class="profile-status" role="status"></p>
                </section>

                <section class="card">
                    <h2>顯示名稱</h2>
                    <form id="name-form" class="profile-form">
                        <label>
                            名稱
                            <input id="display-name" type="text" maxlength="40" autocomplete="nickname" required>
                        </label>
                        <button class="profile-button" type="submit">儲存名稱</button>
                    </form>
                    <p id="name-status" class="profile-status" role="status"></p>
                </section>

                <section class="card">
                    <h2>變更密碼</h2>
                    <p class="profile-help">為保護帳號安全，變更密碼時需要驗證目前密碼。</p>
                    <form id="password-form" class="profile-form">
                        <label>
                            目前密碼
                            <input id="current-password" type="password" autocomplete="current-password" required>
                        </label>
                        <label>
                            新密碼（至少 6 個字元）
                            <input id="new-password" type="password" minlength="6" autocomplete="new-password" required>
                        </label>
                        <label>
                            確認新密碼
                            <input id="confirm-password" type="password" minlength="6" autocomplete="new-password" required>
                        </label>
                        <button class="profile-button" type="submit">變更密碼</button>
                    </form>
                    <p id="password-status" class="profile-status" role="status"></p>
                </section>
            </section>

            <!-- ===== 好友 ===== -->
            <section class="page" id="page-friends">
                <div class="page-heading">
                    <h1>好友</h1>
                </div>

                <section class="card">
                    <h2>搜尋好友</h2>
                    <p class="profile-help">輸入對方帳號（@ 前面的名稱）送出好友申請。</p>
                    <div class="search-row">
                        <input id="friend-search-input" type="text" placeholder="輸入帳號搜尋" autocomplete="off">
                        <button id="friend-search-btn" class="profile-button" type="button" style="width:auto;padding:10px 16px;">搜尋</button>
                    </div>
                    <ul id="search-results" class="search-results" style="margin-top:12px;"></ul>
                </section>

                <section class="card">
                    <h2>好友申請</h2>
                    <ul id="request-list" class="request-list">
                        <li class="profile-help" id="request-empty">目前沒有待處理的好友申請。</li>
                    </ul>
                </section>

                <section class="card">
                    <h2>好友列表</h2>
                    <ul id="friend-list" class="friend-list">
                        <li class="profile-help" id="friend-empty">尚未加入任何好友。</li>
                    </ul>
                </section>
            </section>

            <!-- ===== 聊天室 ===== -->
            <section class="page active" id="page-chat">
                <div class="chat-panel">
                    <div class="chat-layout">
                        <aside class="chat-sidebar">
                            <div class="chat-sidebar-title">好友對話</div>
                            <ul id="chat-sidebar-friends" style="list-style:none;margin:0;padding:0;"></ul>
                        </aside>
                        <div class="chat-main">
                            <div class="chat-mobile-picker">
                                <select id="chat-mobile-select">
                                    <option value="">選擇好友開始聊天…</option>
                                </select>
                            </div>
                            <div class="chat-header">
                                <div>
                                    <div class="title" id="chat-title">聊天室</div>
                                    <div class="sub" id="chat-subtitle">請選擇一位好友開始聊天。</div>
                                </div>
                                <div class="chat-header-actions">
                                    <button id="chat-clear-friend" class="mini-btn" type="button" hidden>關閉對話</button>
                                </div>
                            </div>
                            <div class="chat-box" id="chat-box">
                                <div class="chat-empty" id="chat-empty">請選擇一位好友開始聊天。</div>
                            </div>
                            <div class="chat-input-area">
                                <input type="text" id="msg-input" placeholder="輸入訊息..." disabled>
                                <button class="chat-send-btn" id="chat-send-btn" type="button" disabled>傳送</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="menu.js"></script>
    <script>
        (function() {
            var ready = window.raingodFirebaseReady || Promise.resolve();
            var authReady = window.raingodAuthReady || Promise.resolve(null);

            // ===== DOM =====
            var fallbackAvatar = 'https://raingod0101.github.io/catdragon.png';
            var loginRequired = document.getElementById('login-required');
            var appArea = document.getElementById('app-area');

            var avatarImg = document.getElementById('profile-avatar');
            var avatarEditBtn = document.getElementById('avatar-edit-btn');
            var avatarFileInput = document.getElementById('avatar-file-input');
            var nameForm = document.getElementById('name-form');
            var displayNameInput = document.getElementById('display-name');
            var passwordForm = document.getElementById('password-form');
            var signOutButton = document.getElementById('sign-out');
            var friendSearchInput = document.getElementById('friend-search-input');
            var friendSearchBtn = document.getElementById('friend-search-btn');
            var searchResults = document.getElementById('search-results');
            var requestList = document.getElementById('request-list');
            var friendList = document.getElementById('friend-list');
            var chatSidebarFriends = document.getElementById('chat-sidebar-friends');
            var chatMobileSelect = document.getElementById('chat-mobile-select');

            var chatTitle = document.getElementById('chat-title');
            var chatSubtitle = document.getElementById('chat-subtitle');
            var chatBox = document.getElementById('chat-box');
            var chatEmpty = document.getElementById('chat-empty');
            var msgInput = document.getElementById('msg-input');
            var chatSendBtn = document.getElementById('chat-send-btn');
            var chatClearFriend = document.getElementById('chat-clear-friend');

            var tabBadgeRequests = document.getElementById('tab-badge-requests');
            var tabBadgeUnread = document.getElementById('tab-badge-unread');

            // ===== 狀態 =====
            var currentUser = null;
            var currentUid = '';
            var currentUsername = '';
            var currentAvatar = fallbackAvatar;
            var chatListeners = [];
            var friendUnreadListeners = [];
            var activeFriendUid = '';
            var activeFriendName = '';
            var friendsCache = {};
            var unreadCache = {};
            var requestsCount = 0;
            var chatInitialized = false;

            // 好友頭像監聽
            var friendAvatarRefs = {};

            // ===== 工具 =====
            function db() { return window.firebase.database(); }
            function setStatus(id, message, type) {
                var el = document.getElementById(id);
                if (!el) return;
                el.textContent = message;
                el.classList.remove('error', 'ok');
                if (type) el.classList.add(type);
            }
            function setFormDisabled(form, disabled) {
                var els = form.querySelectorAll('button, input');
                for (var i = 0; i < els.length; i++) els[i].disabled = disabled;
            }
            function errorMessage(error) {
                if (!error) return '操作失敗，請稍後再試。';
                if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential')
                    return '目前密碼不正確，請確認後再試。';
                if (error.code === 'auth/requires-recent-login')
                    return '登入時間過久，請重新登入後再變更密碼。';
                if (error.code === 'auth/email-already-in-use')
                    return '該帳號名稱已被使用。';
                return error.message || '操作失敗，請稍後再試。';
            }
            function escapeHtml(str) {
                return String(str == null ? '' : str).replace(/[&<>"']/g, function(s) {
                    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s];
                });
            }
            function chatIdFor(a, b) {
                return [a, b].sort().join('__');
            }
            function formatTime(ts) {
                if (!ts) return '';
                var d = new Date(ts);
                var now = new Date();
                var time = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
                if (d.toDateString() === now.toDateString()) return '今天 ' + time;
                var yesterday = new Date(now);
                yesterday.setDate(now.getDate() - 1);
                if (d.toDateString() === yesterday.toDateString()) return '昨天 ' + time;
                return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + time;
            }
            function friendAvatarOf(uid) {
                var f = friendsCache[uid];
                return (f && f.avatar) || fallbackAvatar;
            }

            // ===== 分頁 =====
            var tabBtns = document.querySelectorAll('.tab-btn');
            for (var i = 0; i < tabBtns.length; i++) {
                (function(btn) {
                    btn.addEventListener('click', function() {
                        var all = document.querySelectorAll('.tab-btn');
                        for (var j = 0; j < all.length; j++) all[j].classList.remove('active');
                        var pages = document.querySelectorAll('.page');
                        for (var k = 0; k < pages.length; k++) pages[k].classList.remove('active');
                        btn.classList.add('active');
                        var page = document.getElementById('page-' + btn.dataset.page);
                        if (page) page.classList.add('active');
                        if (btn.dataset.page === 'chat') {
                            chatBox.scrollTop = chatBox.scrollHeight;
                        }
                    });
                })(tabBtns[i]);
            }
            function switchTab(name) {
                var all = document.querySelectorAll('.tab-btn');
                for (var i = 0; i < all.length; i++) {
                    all[i].classList.toggle('active', all[i].dataset.page === name);
                }
                var pages = document.querySelectorAll('.page');
                for (var j = 0; j < pages.length; j++) {
                    pages[j].classList.toggle('active', pages[j].id === 'page-' + name);
                }
            }

            // ===== 使用者資料 =====
            function fetchUserProfile(username, cb) {
                db().ref('users/' + username).once('value', function(snap) {
                    cb(snap.exists() ? snap.val() : null);
                }, function(err) {
                    console.warn('讀取使用者資料失敗', err);
                    cb(null);
                });
            }

            // ===== 初始化 =====
            function initProfile(user) {
                currentUser = user;
                currentUid = user.uid;
                currentUsername = user.email ? user.email.split('@')[0] : '';

                loginRequired.hidden = true;
                appArea.hidden = false;

                avatarImg.src = user.photoURL || fallbackAvatar;
                displayNameInput.value = user.displayName || currentUsername;

                fetchUserProfile(currentUsername, function(profile) {
                    if (profile && profile.profile) {
                        if (profile.profile.avatar) {
                            avatarImg.src = profile.profile.avatar;
                            currentAvatar = profile.profile.avatar;
                        }
                        if (profile.profile.displayName) {
                            displayNameInput.value = profile.profile.displayName;
                        }
                    }
                });

                // 監聽自己的頭像（確保 currentAvatar 是最新的）
                db().ref('users/' + currentUsername + '/profile/avatar').on('value', function(snap) {
                    var url = snap.val();
                    currentAvatar = url || fallbackAvatar;
                    avatarImg.src = currentAvatar;
                    updateMyMessageAvatars();
                });

                listenFriendRequests();
                listenFriends();

                if (!chatInitialized) {
                    chatInitialized = true;
                    switchTab('chat');
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            }

            // ===== 頭像 =====
            avatarEditBtn.addEventListener('click', function() { avatarFileInput.click(); });
            avatarFileInput.addEventListener('change', function() {
                var file = avatarFileInput.files && avatarFileInput.files[0];
                if (!file) return;
                if (file.type.indexOf('image/') !== 0) {
                    setStatus('avatar-status', '請選擇圖片檔案。', 'error');
                    return;
                }
                if (file.size > 2 * 1024 * 1024) {
                    setStatus('avatar-status', '圖片大小需小於 2MB。', 'error');
                    return;
                }
                setStatus('avatar-status', '正在上傳頭像…');
                var reader = new FileReader();
                reader.onload = function() {
                    var dataUrl = reader.result;
                    db().ref('users/' + currentUsername + '/profile/avatar').set(dataUrl, function(err) {
                        if (err) {
                            console.error('頭像儲存失敗', err);
                            setStatus('avatar-status', '頭像儲存失敗：' + errorMessage(err), 'error');
                            return;
                        }
                        avatarImg.src = dataUrl;
                        currentAvatar = dataUrl;
                        setStatus('avatar-status', '頭像已更新並儲存。', 'ok');
                        refreshFriendsUI();
                        updateMyMessageAvatars();
                    });
                    avatarFileInput.value = '';
                };
                reader.readAsDataURL(file);
            });

            // ===== 名稱 =====
            nameForm.addEventListener('submit', function(e) {
                e.preventDefault();
                var name = displayNameInput.value.trim();
                if (!name) {
                    setStatus('name-status', '請輸入顯示名稱。', 'error');
                    return;
                }
                setFormDisabled(nameForm, true);
                setStatus('name-status', '正在儲存…');
                currentUser.updateProfile({ displayName: name }).then(function() {
                    return db().ref('users/' + currentUsername + '/profile/displayName').set(name);
                }).then(function() {
                    return currentUser.reload();
                }).then(function() {
                    var navAvatar = document.getElementById('user-avatar');
                    if (navAvatar) navAvatar.title = '個人檔案：' + name;
                    setStatus('name-status', '顯示名稱已更新。', 'ok');
                }).catch(function(err) {
                    setStatus('name-status', errorMessage(err), 'error');
                }).finally(function() {
                    setFormDisabled(nameForm, false);
                });
            });

            // ===== 密碼 =====
            passwordForm.addEventListener('submit', function(e) {
                e.preventDefault();
                if (!currentUser || !currentUser.email) return;
                var cur = document.getElementById('current-password').value;
                var nw = document.getElementById('new-password').value;
                var cf = document.getElementById('confirm-password').value;
                if (nw.length < 6) {
                    setStatus('password-status', '新密碼至少需要 6 個字元。', 'error');
                    return;
                }
                if (nw !== cf) {
                    setStatus('password-status', '兩次輸入的新密碼不一致。', 'error');
                    return;
                }
                setFormDisabled(passwordForm, true);
                setStatus('password-status', '正在變更密碼…');
                var cred = window.firebase.auth.EmailAuthProvider.credential(currentUser.email, cur);
                currentUser.reauthenticateWithCredential(cred).then(function() {
                    return currentUser.updatePassword(nw);
                }).then(function() {
                    passwordForm.reset();
                    setStatus('password-status', '密碼已成功變更。', 'ok');
                }).catch(function(err) {
                    setStatus('password-status', errorMessage(err), 'error');
                }).finally(function() {
                    setFormDisabled(passwordForm, false);
                });
            });

            // ===== 登出 =====
            signOutButton.addEventListener('click', function() {
                signOutButton.disabled = true;
                window.firebase.auth().signOut().then(function() {
                    if (typeof window.raingodClearLocalAccountData === 'function') {
                        window.raingodClearLocalAccountData();
                    }
                    window.location.href = 'index.html';
                }).catch(function(err) {
                    signOutButton.disabled = false;
                    alert('登出失敗：' + err.message);
                });
            });

            // ===== 好友搜尋 =====
            friendSearchBtn.addEventListener('click', function() {
                var keyword = friendSearchInput.value.trim().toLowerCase();
                searchResults.innerHTML = '';
                if (!keyword) {
                    searchResults.innerHTML = '<li class="profile-help">請輸入帳號關鍵字。</li>';
                    return;
                }
                if (keyword === currentUsername) {
                    searchResults.innerHTML = '<li class="profile-help">不能加入自己為好友。</li>';
                    return;
                }
                fetchUserProfile(keyword, function(profile) {
                    if (!profile) {
                        searchResults.innerHTML = '<li class="profile-help">找不到此帳號。</li>';
                        return;
                    }
                    db().ref('users/' + currentUsername + '/friends/' + profile.uid).once('value').then(function(friendSnap) {
                        return db().ref('users/' + keyword + '/friend_requests/' + currentUsername).once('value').then(function(reqSnap) {
                            var isFriend = friendSnap.exists();
                            var requestSent = reqSnap.exists();
                            var name = (profile.profile && profile.profile.displayName) || keyword;
                            var avatar = (profile.profile && profile.profile.avatar) || fallbackAvatar;
                            var li = document.createElement('li');
                            li.className = 'friend-item';
                            var actionHtml = isFriend ? '<span class="profile-help">已是好友</span>' :
                                requestSent ? '<span class="profile-help">已送出申請</span>' :
                                '<button class="mini-btn primary" data-uid="' + escapeHtml(profile.uid) + '" data-name="' + escapeHtml(name) + '" data-username="' + escapeHtml(keyword) + '">加好友</button>';
                            li.innerHTML =
                                '<img class="friend-avatar" src="' + escapeHtml(avatar) + '" alt="">' +
                                '<div class="friend-name">' + escapeHtml(name) + ' <small style="color:var(--text-gray);font-weight:400;">@' + escapeHtml(keyword) + '</small></div>' +
                                '<div class="friend-actions">' + actionHtml + '</div>';
                            searchResults.appendChild(li);
                            var addBtn = li.querySelector('button[data-uid]');
                            if (addBtn) {
                                addBtn.addEventListener('click', function() {
                                    addBtn.disabled = true;

                                    sendFriendRequest(keyword, profile.uid, name).then(function() {
                                        addBtn.textContent = '已送出';
                                    }).catch(function(e) {
                                        console.error(e);
                                        addBtn.disabled = false;
                                        addBtn.textContent = '加好友';
                                        alert('送出好友申請失敗：' + errorMessage(e));
                                    });
                                });
                            }
                        });
                    }).catch(function(e) {
                        console.error(e);
                        searchResults.innerHTML = '<li class="profile-help">查詢好友狀態失敗。</li>';
                    });
                });
            });

            function sendFriendRequest(toUsername, toUid, toName) {
                var myName = currentUser.displayName || currentUsername;
                var myAvatar = currentAvatar || fallbackAvatar;
                return db().ref('users/' + toUsername + '/friend_requests/' + currentUsername).set({
                    fromUid: currentUid,
                    fromName: myName,
                    fromUsername: currentUsername,
                    fromAvatar: myAvatar,
                    ts: window.firebase.database.ServerValue.TIMESTAMP
                });
            }

            // ===== 好友申請監聽 =====
            function listenFriendRequests() {
                db().ref('users/' + currentUsername + '/friend_requests').on('value', function(snap) {
                    var val = snap.val() || {};
                    var entries = Object.keys(val).map(function(k) { return [k, val[k]]; });
                    requestList.innerHTML = '';
                    requestsCount = entries.length;
                    updateTabBadges();
                    if (!entries.length) {
                        requestList.innerHTML = '<li class="profile-help" id="request-empty">目前沒有待處理的好友申請。</li>';
                        return;
                    }
                    entries.forEach(function(pair) {
                        var fromUsername = pair[0];
                        var req = pair[1];
                        var li = document.createElement('li');
                        li.className = 'request-item';
                        li.innerHTML =
                            '<img class="friend-avatar" src="' + escapeHtml(req.fromAvatar || fallbackAvatar) + '" alt="">' +
                            '<div class="friend-name">' + escapeHtml(req.fromName || fromUsername) + '</div>' +
                            '<div class="friend-actions">' +
                                '<button class="mini-btn success" data-accept="' + escapeHtml(fromUsername) + '" data-uid="' + escapeHtml(req.fromUid) + '" data-name="' + escapeHtml(req.fromName || fromUsername) + '" data-avatar="' + escapeHtml(req.fromAvatar || fallbackAvatar) + '">接受</button>' +
                                '<button class="mini-btn danger" data-reject="' + escapeHtml(fromUsername) + '">拒絕</button>' +
                            '</div>';
                        requestList.appendChild(li);
                    });
                    var acceptBtns = requestList.querySelectorAll('[data-accept]');
                    for (var i = 0; i < acceptBtns.length; i++) {
                        (function(btn) {
                            btn.addEventListener('click', function() {
                                btn.disabled = true;
                                acceptFriendRequest(btn.dataset.accept, btn.dataset.uid, btn.dataset.name, btn.dataset.avatar).catch(function(e) {
                                    console.error(e);
                                    alert('接受好友申請失敗：' + errorMessage(e));
                                    btn.disabled = false;
                                });
                            });
                        })(acceptBtns[i]);
                    }
                    var rejectBtns = requestList.querySelectorAll('[data-reject]');
                    for (var j = 0; j < rejectBtns.length; j++) {
                        (function(btn) {
                            btn.addEventListener('click', function() {
                                btn.disabled = true;
                                rejectFriendRequest(btn.dataset.reject).catch(function(e) {
                                    console.error(e);
                                    alert('拒絕好友申請失敗：' + errorMessage(e));
                                    btn.disabled = false;
                                });
                            });
                        })(rejectBtns[j]);
                    }
                });
            }

            function acceptFriendRequest(fromUsername, fromUid, fromName, fromAvatar) {
                var myName = currentUser.displayName || currentUsername;
                var myAvatar = currentAvatar || fallbackAvatar;
                var updates = {};
                updates['users/' + currentUsername + '/friends/' + fromUid] = {
                    name: fromName, avatar: fromAvatar, username: fromUsername,
                    since: window.firebase.database.ServerValue.TIMESTAMP
                };
                updates['users/' + fromUsername + '/friends/' + currentUid] = {
                    name: myName, avatar: myAvatar, username: currentUsername,
                    since: window.firebase.database.ServerValue.TIMESTAMP
                };
                updates['users/' + currentUsername + '/friend_requests/' + fromUsername] = null;
                return db().ref().update(updates);
            }

            function rejectFriendRequest(fromUsername) {
                return db().ref('users/' + currentUsername + '/friend_requests/' + fromUsername).remove();
            }

            // ===== 好友頭像即時監聽 =====
            function stopFriendAvatarWatchers() {
                Object.keys(friendAvatarRefs).forEach(function(uid) {
                    var item = friendAvatarRefs[uid];
                    try { item.ref.off('value', item.handler); } catch (e) {}
                });
                friendAvatarRefs = {};
            }

            function watchFriendAvatars() {
                stopFriendAvatarWatchers();
                Object.keys(friendsCache).forEach(function(uid) {
                    var f = friendsCache[uid];
                    var username = f.username;
                    if (!username) return;
                    var ref = db().ref('users/' + username + '/profile/avatar');
                    var handler = function(snap) {
                        var url = snap.val();
                        if (url) {
                            friendsCache[uid].avatar = url;
                        }
                        // 更新好友列表、側邊欄、手機選單
                        refreshFriendsUI();
                        // 更新聊天泡泡頭像
                        updateMessageAvatars();
                    };
                    ref.on('value', handler);
                    friendAvatarRefs[uid] = { ref: ref, handler: handler };
                });
            }

            // ===== 好友列表 =====
            function listenFriends() {
                db().ref('users/' + currentUsername + '/friends').on('value', function(snap) {
                    friendsCache = snap.val() || {};
                    refreshFriendsUI();
                    listenAllUnread();
                    watchFriendAvatars();
                });
            }

            function refreshFriendsUI() {
                friendList.innerHTML = '';
                var entries = Object.keys(friendsCache).map(function(k) { return [k, friendsCache[k]]; });
                if (!entries.length) {
                    friendList.innerHTML = '<li class="profile-help" id="friend-empty">尚未加入任何好友。</li>';
                } else {
                    entries.forEach(function(pair) {
                        var uid = pair[0];
                        var f = pair[1];
                        var li = document.createElement('li');
                        li.className = 'friend-item' + (uid === activeFriendUid ? ' active' : '');
                        li.innerHTML =
                            '<img class="friend-avatar" src="' + escapeHtml(f.avatar || fallbackAvatar) + '" alt="">' +
                            '<div class="friend-name">' + escapeHtml(f.name || f.username || '好友') + '</div>' +
                            '<span class="friend-unread" data-uid="' + escapeHtml(uid) + '"></span>' +
                            '<div class="friend-actions">' +
                                '<button class="mini-btn primary" data-chat-uid="' + escapeHtml(uid) + '" data-chat-name="' + escapeHtml(f.name || f.username || '好友') + '" data-chat-avatar="' + escapeHtml(f.avatar || fallbackAvatar) + '">私訊</button>' +
                            '</div>';
                        friendList.appendChild(li);
                    });
                    var chatBtns = friendList.querySelectorAll('[data-chat-uid]');
                    for (var i = 0; i < chatBtns.length; i++) {
                        (function(btn) {
                            btn.addEventListener('click', function() {
                                openPrivateChat(btn.dataset.chatUid, btn.dataset.chatName, btn.dataset.chatAvatar);
                                switchTab('chat');
                            });
                        })(chatBtns[i]);
                    }
                }

                chatSidebarFriends.innerHTML = '';
                if (!entries.length) {
                    chatSidebarFriends.innerHTML = '<li class="profile-help" style="padding:12px;">尚無好友</li>';
                } else {
                    entries.forEach(function(pair) {
                        var uid = pair[0];
                        var f = pair[1];
                        var li = document.createElement('li');
                        li.className = 'friend-item' + (uid === activeFriendUid ? ' active' : '');
                        li.style.cursor = 'pointer';
                        li.innerHTML =
                            '<img class="friend-avatar" src="' + escapeHtml(f.avatar || fallbackAvatar) + '" alt="">' +
                            '<div class="friend-name">' + escapeHtml(f.name || f.username || '好友') + '</div>' +
                            '<span class="friend-unread" data-uid="' + escapeHtml(uid) + '"></span>';
                        li.addEventListener('click', (function(u, ff) {
                            return function() {
                                openPrivateChat(u, ff.name || ff.username || '好友', ff.avatar || fallbackAvatar);
                            };
                        })(uid, f));
                        chatSidebarFriends.appendChild(li);
                    });
                }

                refreshMobileSelect(entries);
                updateUnreadBadges();
            }

            function refreshMobileSelect(entries) {
                var currentVal = activeFriendUid;
                chatMobileSelect.innerHTML = '<option value="">選擇好友開始聊天…</option>';
                entries.forEach(function(pair) {
                    var uid = pair[0];
                    var f = pair[1];
                    var opt = document.createElement('option');
                    opt.value = uid;
                    opt.textContent = (f.name || f.username || '好友') + (unreadCache[uid] ? ' (' + unreadCache[uid] + ')' : '');
                    if (uid === currentVal) opt.selected = true;
                    chatMobileSelect.appendChild(opt);
                });
            }

            chatMobileSelect.addEventListener('change', function() {
                var uid = chatMobileSelect.value;
                if (!uid) return;
                var f = friendsCache[uid];
                if (!f) return;
                openPrivateChat(uid, f.name || f.username || '好友', f.avatar || fallbackAvatar);
            });

            // ===== 未讀 =====
            function listenAllUnread() {
                for (var i = 0; i < friendUnreadListeners.length; i++) friendUnreadListeners[i]();
                friendUnreadListeners = [];
                unreadCache = {};

                Object.keys(friendsCache).forEach(function(friendUid) {
                    var cid = chatIdFor(currentUid, friendUid);
                    var msgsRef = db().ref('private_chats/' + cid + '/msgs');
                    var readRef = db().ref('private_chats/' + cid + '/read/' + currentUid);
                    var handler = function(snap) {
                        var msgs = snap.val() || {};
                        readRef.once('value').then(function(readSnap) {
                            var lastRead = readSnap.val() || 0;
                            var unread = 0;
                            Object.keys(msgs).forEach(function(id) {
                                var m = msgs[id];
                                if (m.from !== currentUid && (m.ts || 0) > lastRead && !m.recalled) unread++;
                            });
                            unreadCache[friendUid] = unread;
                            updateUnreadBadges();
                            refreshMobileSelect(Object.keys(friendsCache).map(function(k) { return [k, friendsCache[k]]; }));
                        }).catch(function() {});
                    };
                    msgsRef.on('value', handler);
                    friendUnreadListeners.push((function(ref) {
                        return function() { ref.off('value', handler); };
                    })(msgsRef));
                });
            }

            function updateUnreadBadges() {
                var unreadEls = document.querySelectorAll('.friend-unread');
                for (var i = 0; i < unreadEls.length; i++) {
                    var uid = unreadEls[i].dataset.uid;
                    var count = unreadCache[uid] || 0;
                    unreadEls[i].textContent = count > 99 ? '99+' : String(count);
                    unreadEls[i].classList.toggle('show', count > 0);
                }
                var total = 0;
                Object.keys(unreadCache).forEach(function(k) { total += unreadCache[k] || 0; });
                tabBadgeUnread.textContent = total > 99 ? '99+' : String(total);
                tabBadgeUnread.classList.toggle('show', total > 0);
                updateTabBadges();
            }

            function updateTabBadges() {
                tabBadgeRequests.textContent = requestsCount > 99 ? '99+' : String(requestsCount);
                tabBadgeRequests.classList.toggle('show', requestsCount > 0);
            }

            // ===== 聊天室 =====
            function clearChatListeners() {
                for (var i = 0; i < chatListeners.length; i++) chatListeners[i]();
                chatListeners = [];
            }

            function openPrivateChat(friendUid, friendName, friendAvatar) {
                activeFriendUid = friendUid;
                activeFriendName = friendName;
                clearChatListeners();
                chatTitle.textContent = friendName;
                chatSubtitle.textContent = '私訊對話';
                chatClearFriend.hidden = false;
                msgInput.disabled = false;
                chatSendBtn.disabled = false;
                chatEmpty.style.display = 'none';
                var oldRows = chatBox.querySelectorAll('.msg-row');
                for (var i = 0; i < oldRows.length; i++) oldRows[i].remove();

                var cid = chatIdFor(currentUid, friendUid);
                var msgsRef = db().ref('private_chats/' + cid + '/msgs');
                var handler = function(snap) {
                    var msgs = snap.val() || {};
                    var list = Object.keys(msgs).map(function(id) { return [id, msgs[id]]; });
                    list.sort(function(a, b) { return (a[1].ts || 0) - (b[1].ts || 0); });
                    var rows = chatBox.querySelectorAll('.msg-row');
                    for (var r = 0; r < rows.length; r++) rows[r].remove();
                    if (!list.length) {
                        chatEmpty.style.display = 'block';
                        return;
                    }
                    chatEmpty.style.display = 'none';
                    list.forEach(function(pair) {
                        var id = pair[0];
                        var m = pair[1];
                        var isMe = m.from === currentUid;
                        var row = document.createElement('div');
                        row.className = 'msg-row ' + (isMe ? 'me' : 'other');

                        var avatarUrl;
                        if (isMe) {
                            avatarUrl = currentAvatar || fallbackAvatar;
                        } else {
                            // 優先使用 friendsCache（已被即時監聽更新），再 fallback 到訊息當時的頭像
                            avatarUrl = friendAvatarOf(friendUid) || m.fromAvatar || friendAvatar || fallbackAvatar;
                        }
                        var name = m.name || (isMe ? (currentUser.displayName || currentUsername) : friendName);

                        var avatarEl = document.createElement('img');
                        avatarEl.className = 'msg-avatar';
                        avatarEl.src = avatarUrl;
                        avatarEl.alt = '';

                        var bodyEl = document.createElement('div');
                        bodyEl.className = 'msg-body';

                        var info = document.createElement('div');
                        info.className = 'msg-info';
                        info.textContent = name + ' • ' + formatTime(m.ts);
                        bodyEl.appendChild(info);

                        if (m.recalled) {
                            var recalled = document.createElement('div');
                            recalled.className = 'bubble recalled';
                            recalled.textContent = isMe ? '你收回了一則訊息' : (name + ' 收回了一則訊息');
                            bodyEl.appendChild(recalled);
                        } else {
                            var bubble = document.createElement('div');
                            bubble.className = 'bubble';
                            bubble.textContent = m.text;
                            bodyEl.appendChild(bubble);
                        }

                        if (isMe && !m.recalled) {
                            var recallBtn = document.createElement('button');
                            recallBtn.type = 'button';
                            recallBtn.className = 'msg-recall-btn';
                            recallBtn.textContent = '收回';
                            recallBtn.addEventListener('click', function() {
                                if (!confirm('確定要收回這則訊息嗎？')) return;
                                db().ref('private_chats/' + cid + '/msgs/' + id + '/recalled').set(true).catch(function(e) {
                                    console.error(e);
                                    alert('收回失敗：' + errorMessage(e));
                                });
                            });
                            bodyEl.appendChild(recallBtn);
                        }

                        row.appendChild(avatarEl);
                        row.appendChild(bodyEl);
                        chatBox.appendChild(row);
                    });
                    chatBox.scrollTop = chatBox.scrollHeight;
                    markChatRead(cid);
                };
                msgsRef.on('value', handler);
                chatListeners.push((function(ref) {
                    return function() { ref.off('value', handler); };
                })(msgsRef));

                chatMobileSelect.value = friendUid;
                refreshFriendsUI();
                markChatRead(cid);
            }

            // 即時更新目前對話的頭像（好友換頭像時）
            function updateMessageAvatars() {
                if (!activeFriendUid) return;
                var otherAvatars = chatBox.querySelectorAll('.msg-row.other .msg-avatar');
                var url = friendAvatarOf(activeFriendUid);
                for (var i = 0; i < otherAvatars.length; i++) {
                    otherAvatars[i].src = url;
                }
                updateMyMessageAvatars();
            }

            function updateMyMessageAvatars() {
                var mine = chatBox.querySelectorAll('.msg-row.me .msg-avatar');
                for (var i = 0; i < mine.length; i++) {
                    mine[i].src = currentAvatar || fallbackAvatar;
                }
            }

            function markChatRead(cid) {
                if (!currentUid) return;
                db().ref('private_chats/' + cid + '/read/' + currentUid).set(window.firebase.database.ServerValue.TIMESTAMP).then(function() {
                    if (activeFriendUid) {
                        unreadCache[activeFriendUid] = 0;
                        updateUnreadBadges();
                    }
                }).catch(function(e) {
                    console.warn('標記已讀失敗', e);
                });
            }

            chatClearFriend.addEventListener('click', function() {
                activeFriendUid = '';
                activeFriendName = '';
                clearChatListeners();
                chatTitle.textContent = '聊天室';
                chatSubtitle.textContent = '請選擇一位好友開始聊天。';
                chatClearFriend.hidden = true;
                msgInput.disabled = true;
                chatSendBtn.disabled = true;
                var rows = chatBox.querySelectorAll('.msg-row');
                for (var i = 0; i < rows.length; i++) rows[i].remove();
                chatEmpty.style.display = 'block';
                chatMobileSelect.value = '';
                refreshFriendsUI();
            });

            var sending = false;

function sendMessage() {
    if (sending || !activeFriendUid) return;
    var text = msgInput.value.trim();
    if (!text) {
        msgInput.focus();
        return;
    }

    var cid = chatIdFor(currentUid, activeFriendUid);
    var payload = {
        from: currentUid,
        to: activeFriendUid,
        name: currentUser.displayName || currentUsername,
        fromAvatar: currentAvatar || fallbackAvatar,
        text: text,
        ts: window.firebase.database.ServerValue.TIMESTAMP
    };

    // 先清空输入栏，再送出（不等 Firebase 回调）
    sending = true;
    msgInput.value = '';
    msgInput.focus();
    chatSendBtn.disabled = true;

    db().ref('private_chats/' + cid + '/msgs').push(payload)
      .catch(function(e) {
          console.error('訊息傳送失敗', e.code, e.message);
          // 失败时把文字填回去，避免用户白打
          if (!msgInput.value) msgInput.value = text;
          alert('訊息傳送失敗：' + (e.code || e.message || '未知錯誤'));
      })
      .finally(function() {
          sending = false;
          chatSendBtn.disabled = false;
      });
}

            chatSendBtn.addEventListener('click', sendMessage);
            msgInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // ===== 啟動 =====
            ready.then(function() {
                return authReady;
            }).then(function(user) {
                if (!user) {
                    loginRequired.hidden = false;
                    appArea.hidden = true;
                    return;
                }
                initProfile(user);
                window.firebase.auth().onAuthStateChanged(function(u) {
                    if (u) {
                        initProfile(u);
                    } else {
                        currentUser = null; currentUid = ''; currentUsername = ''; currentAvatar = fallbackAvatar;
                        appArea.hidden = true;
                        loginRequired.hidden = false;
                        clearChatListeners();
                        for (var i = 0; i < friendUnreadListeners.length; i++) friendUnreadListeners[i]();
                        friendUnreadListeners = [];
                        stopFriendAvatarWatchers();
                        friendsCache = {};
                        unreadCache = {};
                        requestList.innerHTML = '';
                        friendList.innerHTML = '';
                        chatSidebarFriends.innerHTML = '';
                        searchResults.innerHTML = '';
                        chatMobileSelect.innerHTML = '<option value="">選擇好友開始聊天…</option>';
                        var rows = chatBox.querySelectorAll('.msg-row');
                        for (var j = 0; j < rows.length; j++) rows[j].remove();
                        chatEmpty.style.display = 'block';
                        chatClearFriend.hidden = true;
                        msgInput.disabled = true;
                        chatSendBtn.disabled = true;
                        updateUnreadBadges();
                    }
                });
            }).catch(function(e) {
                console.error('初始化失敗', e);
                loginRequired.hidden = false;
                loginRequired.textContent = '載入個人檔案失敗：' + errorMessage(e);
                loginRequired.classList.add('error');
            });
        })();
    </script>
</body>
</html>
