<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一分鐘點擊次數測試</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            color: #2d3436;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 320px;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #2d3436;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
        }
        .stat-box {
            background: #f1f2f6;
            padding: 15px;
            border-radius: 10px;
            width: 40%;
        }
        .stat-box h3 {
            margin: 0 0 5px 0;
            font-size: 14px;
            color: #636e72;
        }
        .stat-box span {
            font-size: 24px;
            font-weight: bold;
            color: #0984e3;
        }
        #clickBtn {
            width: 100%;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: #00b894;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        #clickBtn:hover:not(:disabled) {
            background-color: #00cec9;
        }
        #clickBtn:active:not(:disabled) {
            transform: scale(0.95);
        }
        #clickBtn:disabled {
            background-color: #b2bec3;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>一分鐘點擊挑戰</h1>
        
        <div class="stats">
            <div class="stat-box">
                <h3>時間</h3>
                <span id="timer">60</span>s
            </div>
            <div class="stat-box">
                <h3>次數</h3>
                <span id="score">0</span>
            </div>
        </div>

        <button id="clickBtn" onclick="handleClick()">點擊開始！</button>
    </div>

    <script>
        let timeLeft = 60;
        let score = 0;
        let isPlaying = false;
        let timerId = null;

        const timerDisplay = document.getElementById('timer');
        const scoreDisplay = document.getElementById('score');
        const clickBtn = document.getElementById('clickBtn');

        function handleClick() {
            // 如果遊戲尚未開始，初始化計時器
            if (!isPlaying) {
                isPlaying = true;
                score = 0;
                timeLeft = 60;
                scoreDisplay.textContent = score;
                clickBtn.textContent = '狂點我！';

                // 開始倒數
                timerId = setInterval(() => {
                    timeLeft--;
                    timerDisplay.textContent = timeLeft;

                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        endGame();
                    }
                }, 1000);
            }

            // 遊戲進行中，累加點擊次數
            if (isPlaying) {
                score++;
                scoreDisplay.textContent = score;
            }
        }

        function endGame() {
            isPlaying = false;
            clickBtn.disabled = true;
            clickBtn.textContent = `時間到！共點擊 ${score} 下`;

            // 3秒後自動重置按鈕讓使用者可以再玩一次
            setTimeout(() => {
                clickBtn.disabled = false;
                clickBtn.textContent = '再玩一次';
                timerDisplay.textContent = '60';
            }, 3000);
        }
    </script>

</body>
</html>
