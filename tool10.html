<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>點擊次數測試</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            color: #2d3436;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 320px;
        }
        h1 {
            margin-bottom: 15px;
            font-size: 24px;
            color: #2d3436;
        }
        .mode-select {
            margin-bottom: 20px;
        }
        .mode-select select {
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #dfe6e9;
            background-color: #f1f2f6;
            color: #2d3436;
            cursor: pointer;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
        }
        .stat-box {
            background: #f1f2f6;
            padding: 15px;
            border-radius: 10px;
            width: 40%;
        }
        .stat-box h3 {
            margin: 0 0 5px 0;
            font-size: 14px;
            color: #636e72;
        }
        .stat-box span {
            font-size: 24px;
            font-weight: bold;
            color: #0984e3;
        }
        #clickBtn {
            width: 100%;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: #00b894;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        #clickBtn:hover:not(:disabled) {
            background-color: #00cec9;
        }
        #clickBtn:active:not(:disabled) {
            transform: scale(0.95);
        }
        #clickBtn:disabled {
            background-color: #b2bec3;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="gameTitle">一分鐘點擊挑戰</h1>
        
        <div class="mode-select">
            <select id="modeSelector" onchange="changeMode()">
                <option value="60">模式一：一分鐘挑戰 (60s)</option>
                <option value="1">模式二：一秒極速點擊 (1s)</option>
            </select>
        </div>
        
        <div class="stats">
            <div class="stat-box">
                <h3>時間</h3>
                <span id="timer">60</span>s
            </div>
            <div class="stat-box">
                <h3>次數</h3>
                <span id="score">0</span>
            </div>
        </div>

        <button id="clickBtn" onclick="handleClick()">點擊開始！</button>
    </div>

    <script>
        let gameDuration = 60; // 預設 60 秒
        let timeLeft = 60;
        let score = 0;
        let isPlaying = false;
        let isCountingDown = false;
        let timerId = null;

        const timerDisplay = document.getElementById('timer');
        const scoreDisplay = document.getElementById('score');
        const clickBtn = document.getElementById('clickBtn');
        const modeSelector = document.getElementById('modeSelector');
        const gameTitle = document.getElementById('gameTitle');

        function changeMode() {
            if (isPlaying || isCountingDown) return; // 遊戲中途不能切換模式
            
            gameDuration = parseInt(modeSelector.value);
            timeLeft = gameDuration;
            timerDisplay.textContent = timeLeft;
            score = 0;
            scoreDisplay.textContent = score;

            if (gameDuration === 60) {
                gameTitle.textContent = '一分鐘點擊挑戰';
            } else {
                gameTitle.textContent = '一秒極速點擊';
            }
        }

        function handleClick() {
            // 如果正在倒數或遊戲中，直接算作點擊加分
            if (isPlaying) {
                score++;
                scoreDisplay.textContent = score;
                return;
            }

            if (isCountingDown) return;

            // 點擊開始後，執行 3、2、1 倒數
            isCountingDown = true;
            modeSelector.disabled = true;
            clickBtn.disabled = true;
            
            let count = 3;
            clickBtn.textContent = count;

            let countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    clickBtn.textContent = count;
                } else if (count === 0) {
                    clickBtn.textContent = '開始！';
                } else {
                    clearInterval(countdownInterval);
                    startOfficialGame();
                }
            }, 1000);
        }

        function startOfficialGame() {
            isCountingDown = false;
            isPlaying = true;
            score = 0;
            timeLeft = gameDuration;
            
            scoreDisplay.textContent = score;
            timerDisplay.textContent = timeLeft;
            clickBtn.disabled = false;
            clickBtn.textContent = gameDuration === 60 ? '狂點我！' : '猛按！';

            // 開始計時
            const intervalTime = gameDuration === 1 ? 100 : 1000; // 一秒模式用 100ms 更新以保持流暢，60秒用 1000ms
            const step = gameDuration === 1 ? 0.1 : 1;

            timerId = setInterval(() => {
                timeLeft = Number((timeLeft - step).toFixed(1));
                timerDisplay.textContent = gameDuration === 1 ? timeLeft.toFixed(1) : timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    endGame();
                }
            }, intervalTime);
        }

        function endGame() {
            isPlaying = false;
            clickBtn.disabled = true;
            clickBtn.textContent = `時間到！共點擊 ${score} 下`;

            // 3秒後自動重置按鈕
            setTimeout(() => {
                clickBtn.disabled = false;
                clickBtn.textContent = '再玩一次';
                timerDisplay.textContent = gameDuration;
                modeSelector.disabled = false;
            }, 3000);
        }
    </script>

</body>
</html>
