<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雨神大亨 | Raingod</title>
    <style>
        * { touch-action: none; user-select: none; box-sizing: border-box; }
        body { margin: 0; background: #020617; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        /* 頂部 HUD：避開遊戲畫面主體 */
        .top-bar {
    position: absolute !important;
    top: 110px !important; /* 👈 改這個數字！(例如 50px 表示距離頂部 50px，數字越大越靠下) */
    left: 50% !important;
    transform: translateX(-50%) !important;
    background: rgba(15, 23, 42, 0.92);
    border: 1px solid #38bdf8;
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
    padding: 8px 20px;
    border-radius: 30px;
    pointer-events: auto;
    backdrop-filter: blur(8px);
    display: flex;
    gap: 20px;
    align-items: center;
    white-space: nowrap;
    z-index: 999 !important; /* 確保放在最上層 */
}
        .hud-item { font-size: 13px; font-weight: bold; color: #f8fafc; }
        .money { color: #4ade80; font-size: 16px; font-weight: 900; }
        .dark-matter { color: #c084fc; font-size: 13px; }

        .skill-bar {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; pointer-events: auto;
        }
        .skill-btn {
            background: rgba(15, 23, 42, 0.9); border: 1px solid #38bdf8; color: #fff;
            padding: 8px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; transition: all 0.2s;
        }
        .skill-btn:hover:not(:disabled) { background: #0284c7; }
        .skill-btn:disabled { opacity: 0.4; border-color: #475569; cursor: not-allowed; }

        .panel { 
            position: absolute; bottom: 15px; right: 15px; 
            width: 320px; max-height: 80vh; overflow-y: auto;
            background: rgba(15, 23, 42, 0.95); border: 1px solid #334155; border-radius: 12px;
            pointer-events: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px);
        }
        .panel::-webkit-scrollbar { width: 4px; }
        .panel::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 4px; }

        .tabs { display: flex; gap: 4px; margin-bottom: 4px; }
        .tab-btn { 
            flex: 1; background: #1e293b; color: #94a3b8; border: none; padding: 6px 2px; 
            font-size: 10px; font-weight: bold; border-radius: 6px; cursor: pointer;
        }
        .tab-btn.active { background: #0284c7; color: #fff; }

        .btn { 
            background: linear-gradient(135deg, #1e293b, #0f172a); color: #fff; border: 1px solid #38bdf8; 
            padding: 8px 10px; font-weight: bold; font-size: 11px; border-radius: 8px; cursor: pointer; 
            display: flex; justify-content: space-between; align-items: center; transition: all 0.2s;
        }
        .btn:hover:not(:disabled) { background: linear-gradient(135deg, #0284c7, #0369a1); border-color: #38bdf8; }
        .btn:disabled { opacity: 0.35; border-color: #475569; cursor: not-allowed; }
        .rebirth-btn { background: linear-gradient(135deg, #7e22ce, #581c87); border-color: #c084fc; }

        .quest-box {
            background: rgba(30, 41, 59, 0.6); border: 1px dashed #38bdf8; padding: 6px 8px;
            border-radius: 6px; font-size: 10px; color: #e2e8f0; margin-bottom: 2px;
        }
        
        #tycoon-leaderboard-button { position: absolute; top: 160px; right: 15px; z-index: 20; pointer-events: auto; padding: 9px 14px; border: 1px solid #38bdf8; border-radius: 20px; color: #fff; background: rgba(15,23,42,0.9); font-weight: bold; cursor: pointer; }
        #tycoon-leaderboard { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(2,6,23,0.94); color: #fff; }
        .tycoon-leaderboard-card { width: min(520px, 100%); max-height: 80vh; overflow-y: auto; padding: 20px; border: 1px solid #38bdf8; border-radius: 16px; background: #0b1020; }
        .tycoon-leaderboard-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 4px; border-bottom: 1px solid #26334a; }
        .mobile-shop-toggle, .mobile-panel-close { display: none; }

        @media (max-width: 700px), (max-height: 500px) and (pointer: coarse) {
            .nav-content { gap: 6px; padding: 0 8px !important; }
            .brand { flex: 0 0 auto; white-space: nowrap; }
            .nav-links {
                flex: 1;
                min-width: 0;
                justify-content: space-evenly;
                gap: 0 !important;
                margin-left: 4px !important;
            }
            .nav-item {
                padding: 6px 3px !important;
                font-size: 11px !important;
                white-space: nowrap;
            }
            .login-btn { flex: 0 0 auto; padding: 6px 8px !important; white-space: nowrap; }

            .top-bar {
                top: calc(60px + env(safe-area-inset-top)) !important;
                left: 8px !important;
                width: calc(100% - 16px) !important;
                transform: none !important;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 5px 8px;
                padding: 7px 10px;
                border-radius: 12px;
                white-space: normal;
            }
            .hud-item { font-size: 11px; }
            .money { font-size: 14px; }
            .dark-matter { font-size: 11px; }

            #tycoon-leaderboard-button {
                top: 132px;
                right: 8px;
                max-width: 46%;
                padding: 8px 10px;
                font-size: 11px;
            }

            .skill-bar {
                bottom: max(8px, env(safe-area-inset-bottom));
                left: 8px;
                right: 8px;
                transform: none;
                gap: 5px;
            }
            .skill-btn {
                flex: 1;
                min-width: 0;
                padding: 7px 4px;
                font-size: 9px;
            }

            .panel {
                display: none;
                left: 0;
                right: 0;
                bottom: 0;
                width: 100%;
                max-height: 52dvh;
                padding: 10px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
                border-radius: 14px 14px 0 0;
                touch-action: pan-y;
                -webkit-overflow-scrolling: touch;
            }
            #ui.shop-open .panel { display: flex; }
            #ui.shop-open .skill-bar { display: none; }
            .mobile-panel-close {
                display: block;
                align-self: flex-end;
                padding: 7px 12px;
                border: 1px solid #64748b;
                border-radius: 8px;
                background: #1e293b;
                color: #fff;
                font-weight: bold;
                touch-action: manipulation;
            }
            .mobile-shop-toggle {
                display: block;
                position: absolute;
                right: 10px;
                bottom: calc(62px + env(safe-area-inset-bottom));
                z-index: 15;
                padding: 9px 13px;
                border: 1px solid #38bdf8;
                border-radius: 20px;
                background: rgba(15, 23, 42, 0.95);
                color: #fff;
                font-weight: bold;
                pointer-events: auto;
                touch-action: manipulation;
            }
            #ui.shop-open .mobile-shop-toggle { display: none; }

            .tab-btn { min-height: 38px; font-size: 10px; }
            .btn { min-height: 40px; font-size: 11px; touch-action: manipulation; }
            #tycoon-leaderboard {
                padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom));
            }
            .tycoon-leaderboard-card {
                max-height: 85dvh;
                padding: 14px;
                touch-action: pan-y;
                -webkit-overflow-scrolling: touch;
            }
            .tycoon-leaderboard-row { flex-direction: column; gap: 4px; }
        }
    </style>
</head>
<body>
        <link rel="stylesheet" href="menu.css">

<div id="nav_bar"></div>

<script src="menu.js"></script>
<canvas id="c"></canvas>
<div id="ui">
    <div class="top-bar">
        <div class="hud-item">$<span id="m" class="money">0</span></div>
        <div class="hud-item dark-matter">🌌 暗物質: <span id="dm">0</span></div>
        <div class="hud-item" style="color: #ef4444;">⚔️ 第 <span id="waveNum">1</span> 波 (剩餘 <span id="enemyCount">0</span>)</div>
        <div class="hud-item" style="color:#4ade80;">🛡️ ♾️ 永不死亡</div>
    </div>

    <div class="skill-bar">
        <button class="skill-btn" onclick="useSkill(1)">
            <span>⚡ 超頻過載</span><span id="cd1" style="font-size:9px; color:#f59e0b;">就緒</span>
        </button>
        <button class="skill-btn" onclick="useSkill(2)">
            <span>💥 軌道砲轟炸</span><span id="cd2" style="font-size:9px; color:#f59e0b;">就緒</span>
        </button>
    </div>

    <div class="panel" id="tycoon-panel">
        <button class="mobile-panel-close" type="button" onclick="toggleTycoonShop(false)">收起商店 ▲</button>
        <div class="quest-box">
            🎯 任務：<span id="questText">載入中...</span> (<span id="questProg">0/0</span>)
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tab-turret')">⚔️ 武器塔</button>
            <button class="tab-btn" onclick="switchTab('tab-prod')">🏭 工廠解鎖</button>
            <button class="tab-btn" onclick="switchTab('tab-upg')">⚙️ 基礎升級</button>
            <button class="tab-btn" onclick="switchTab('tab-tech')">🌌 暗天賦</button>
        </div>

        <div id="tab-turret">
            <button class="btn" onclick="buildTurret('gatling')">
                <span>🔫 機槍塔</span><span style="color:#4ade80" id="costGatling">$1,000</span>
            </button>
            <button class="btn" onclick="buildTurret('laser')">
                <span>⚡ 雷射塔</span><span style="color:#4ade80" id="costLaser">$5,000</span>
            </button>
            <button class="btn" onclick="buildTurret('mortar')">
                <span>💥 迫擊砲塔</span><span style="color:#4ade80" id="costMortar">$20,000</span>
            </button>
            <button class="btn" onclick="buildTurret('frost')">
                <span>❄️ 緩慢冰凍塔</span><span style="color:#4ade80" id="costFrost">$50,000</span>
            </button>
            <button class="btn" onclick="buildTurret('blackhole')">
                <span>🌌 暗物質黑洞塔</span><span style="color:#c084fc" id="costBlackhole">$200,000</span>
            </button>
            <button class="btn" style="background: linear-gradient(135deg, #b91c1c, #991b1b); border-color: #f87171; margin-top:4px;" onclick="triggerNextWave()">
                <span>⚠️️ 立即召喚下一波敵人</span>
            </button>
        </div>

        <div id="tab-prod" style="display:none;">
            <button class="btn" onclick="unlockTier(2)">
                <span>🔓 矽晶/晶片廠</span><span style="color:#4ade80">$2,500</span>
            </button>
            <button class="btn" onclick="unlockTier(3)">
                <span>🔓 鈾能/電池中心</span><span style="color:#4ade80">$25,000</span>
            </button>
            <button class="btn" onclick="unlockTier(4)">
                <span>🔓 量子合成廠</span><span style="color:#4ade80">$200,000</span>
            </button>
            <button class="btn" onclick="unlockTier(5)">
                <span>🔓 反物質研究所</span><span style="color:#4ade80">$2,000,000</span>
            </button>
        </div>

        <div id="tab-upg" style="display:none;">
            <button class="btn" onclick="buyBot()">
                <span>🤖 雇用運輸機兵</span><span style="color:#4ade80" id="bCost">$500</span>
            </button>
            <button class="btn" onclick="upgrade('miner')">
                <span>⚙️ 採礦速率 Lv.<span id="minerLv">0</span></span><span style="color:#4ade80" id="mCost">$1,000</span>
            </button>
            <button class="btn" onclick="upgrade('capacity')">
                <span>🎒 機兵容量 Lv.<span id="capLv">4</span></span><span style="color:#4ade80" id="cCost">$1,500</span>
            </button>
            <button class="btn" onclick="upgrade('playerDamage')">
                <span>⚔️ 玩家傷害 Lv.<span id="playerDamageLv">0</span>（+25%）</span><span style="color:#4ade80" id="playerDamageCost">$1,000</span>
            </button>
            <button class="btn" onclick="upgrade('turretDamage')">
                <span>🛡️ 防衛塔傷害 Lv.<span id="turretDamageLv">0</span>（+20%）</span><span style="color:#4ade80" id="turretDamageCost">$1,500</span>
            </button>
        </div>

        <div id="tab-tech" style="display:none;">
            <button class="btn rebirth-btn" onclick="buyTalent('dmg')">
                <span>🧬 基因傷害 +20%</span><span style="color:#c084fc" id="tDmgCost">5 DM</span>
            </button>
            <button class="btn rebirth-btn" onclick="buyTalent('speed')">
                <span>🤖 自動化機兵速度 +15%</span><span style="color:#c084fc" id="tSpdCost">5 DM</span>
            </button>
            <button class="btn rebirth-btn" style="margin-top:8px;" onclick="triggerRebirth()">
                <span>🌌 暗物質量子轉生</span><span style="color:#c084fc" id="rebirthGain">+0 DM</span>
            </button>
        </div>
    </div>
    <button class="mobile-shop-toggle" type="button" aria-controls="tycoon-panel" aria-expanded="false" onclick="toggleTycoonShop()">🛠️ 建造 / 升級</button>
</div>

<button id="tycoon-leaderboard-button" onclick="openTycoonLeaderboard()">🏆 登入後查看排行榜</button>
<div id="tycoon-leaderboard">
    <div class="tycoon-leaderboard-card">
        <h2 style="color:#38bdf8; margin-top:0;">🏆 雨神大亨排行榜</h2>
        <p id="tycoon-leaderboard-status" style="color:#aaa;">請登入帳號後查看。</p>
        <div id="tycoon-leaderboard-list"></div>
        <div style="display:flex; gap:8px; justify-content:center; margin-top:14px;">
            <button class="btn" onclick="refreshTycoonLeaderboard()">重新整理</button>
            <button class="btn" onclick="closeTycoonLeaderboard()">關閉</button>
        </div>
    </div>
</div>

<script>
    const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
    const SAVE_KEY = 'raingod_tycoon_save';
    const TYCOON_LEADERBOARD_URL = 'https://game-24b43-default-rtdb.firebaseio.com/raingod_tycoon_leaderboard';

    let money = 2000, darkMatter = 0, frame = 0;
    let bestWave = 0;
    let minerLevel = 0, capacity = 4, techTier = 1;
    let playerDamageLevel = 0, turretDamageLevel = 0;
    let p = { x: 350, y: 350, r: 18, tx: 350, ty: 350, bag: [], atkRange: 220, cooldown: 0 };
    
    let bots = [], items = [], floatTexts = [], particles = [], bullets = [];
    let turrets = [], enemies = [];
    let shakeTime = 0;

    // 天賦系統
    let talents = { dmgLv: 0, spdLv: 0 };

    // 波次
    let wave = 1;
    let waveTimer = 20 * 60;
    let isWaveActive = false;

    // 技能
    let skillCd = [0, 0];
    let isOverclocked = false, overclockTimer = 0;

    // 任務
    let quest = { type: 'kill', target: 20, current: 0, reward: 1500, desc: '擊殺 20 隻異形蟲' };
    let storageReady = false;

    function saveGame() {
        if (!storageReady) return;
        localStorage.setItem(SAVE_KEY, JSON.stringify({
            money, darkMatter, minerLevel, capacity, techTier, playerDamageLevel, turretDamageLevel,
            player: p, bots, turrets, talents, wave, bestWave, waveTimer,
            isWaveActive, items, enemies, skillCd, isOverclocked, overclockTimer, quest
        }));
    }

    function loadGame(data) {
        if (!data || typeof data !== 'object' || Array.isArray(data)) return;
        const finiteOr = (value, fallback) => Number.isFinite(Number(value)) ? Number(value) : fallback;
        const objectArray = value => Array.isArray(value) ? value.filter(item => item && typeof item === 'object').slice(0, 1000) : [];
        money = Math.max(0, finiteOr(data.money, money));
        darkMatter = Math.max(0, finiteOr(data.darkMatter, darkMatter));
        minerLevel = Math.max(0, Math.floor(finiteOr(data.minerLevel, minerLevel)));
        capacity = Math.max(1, Math.floor(finiteOr(data.capacity, capacity)));
        techTier = Math.min(5, Math.max(1, Math.floor(finiteOr(data.techTier, techTier))));
        playerDamageLevel = Math.max(0, Math.floor(finiteOr(data.playerDamageLevel, playerDamageLevel)));
        turretDamageLevel = Math.max(0, Math.floor(finiteOr(data.turretDamageLevel, turretDamageLevel)));
        if (data.player && typeof data.player === 'object') Object.assign(p, data.player);
        bots = objectArray(data.bots);
        turrets = objectArray(data.turrets);
        if (data.talents && typeof data.talents === 'object') talents = { ...talents, ...data.talents };
        wave = Math.max(1, Math.floor(finiteOr(data.wave, wave)));
        bestWave = Math.max(0, Math.floor(finiteOr(data.bestWave, bestWave)));
        waveTimer = Math.max(0, Math.floor(finiteOr(data.waveTimer, waveTimer)));
        const wasWaveActive = data.isWaveActive === true;
        isWaveActive = false;
        items = objectArray(data.items);
        enemies = wasWaveActive ? [] : objectArray(data.enemies);
        if (wasWaveActive) waveTimer = 0;
        if (Array.isArray(data.skillCd) && data.skillCd.length >= 2) skillCd = data.skillCd.slice(0, 2).map(value => Math.max(0, finiteOr(value, 0)));
        isOverclocked = data.isOverclocked === true;
        overclockTimer = Math.max(0, Math.floor(finiteOr(data.overclockTimer, overclockTimer)));
        if (data.quest && typeof data.quest === 'object') quest = { ...quest, ...data.quest };
    }

    async function openTycoonLeaderboard() {
        if (!await window.raingodRequireAuth('排行榜')) return;
        document.getElementById('tycoon-leaderboard').style.display = 'flex';
        await refreshTycoonLeaderboard();
    }

    function closeTycoonLeaderboard() {
        document.getElementById('tycoon-leaderboard').style.display = 'none';
    }

    async function refreshTycoonLeaderboard() {
        const status = document.getElementById('tycoon-leaderboard-status');
        const list = document.getElementById('tycoon-leaderboard-list');
        if (!await window.raingodRequireAuth('排行榜')) return;
        const uid = window.raingodCurrentUser.uid;
        status.textContent = '排行榜載入中…';
        try {
            const response = await fetch(`${TYCOON_LEADERBOARD_URL}.json`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            if (window.raingodCurrentUser?.uid !== uid) return;
            const rows = await response.json() || {};
            const entries = Object.entries(rows)
                .filter(([, row]) => row && Number.isFinite(Number(row.wave)))
                .sort((a, b) => Number(b[1].wave) - Number(a[1].wave) || Number(b[1].darkMatter || 0) - Number(a[1].darkMatter || 0))
                .slice(0, 50);
            list.replaceChildren();
            entries.forEach(([entryUid, row], index) => {
                const item = document.createElement('div');
                item.className = 'tycoon-leaderboard-row';
                const name = document.createElement('span');
                name.textContent = `${index + 1}. ${row.name || '玩家'}${entryUid === uid ? '（你）' : ''}`;
                const value = document.createElement('strong');
                value.textContent = `第 ${Math.floor(Number(row.wave))} 波 · ${Math.floor(Number(row.darkMatter) || 0)} 暗物質`;
                item.append(name, value);
                list.appendChild(item);
            });
            status.textContent = entries.length ? `已載入 ${entries.length} 位玩家，依最高波數排序。` : '目前還沒有排行榜資料。';
        } catch (error) {
            console.error('載入雨神大亨排行榜失敗：', error);
            status.textContent = '排行榜載入失敗，請稍後重試。';
        }
    }

    async function uploadTycoonLeaderboardScore() {
        const currentUser = window.raingodCurrentUser;
        if (!currentUser) return;
        const uid = currentUser.uid;
        const scoreWave = Math.max(1, bestWave, wave);
        const scoreDarkMatter = Math.floor(darkMatter);
        const entryUrl = `${TYCOON_LEADERBOARD_URL}/${encodeURIComponent(uid)}.json`;
        try {
            const previousResponse = await fetch(entryUrl);
            if (!previousResponse.ok) throw new Error(`HTTP ${previousResponse.status}`);
            const previous = await previousResponse.json();
            if (window.raingodCurrentUser?.uid !== uid) return;
            if (previous && (Number(previous.wave) > scoreWave ||
                (Number(previous.wave) === scoreWave && Number(previous.darkMatter) >= scoreDarkMatter))) return;
            const response = await fetch(entryUrl, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: currentUser.displayName || (currentUser.email ? currentUser.email.split('@')[0] : '雨神玩家'),
                    wave: scoreWave,
                    darkMatter: scoreDarkMatter,
                    updatedAt: Date.now()
                })
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
        } catch (error) {
            console.error('上傳雨神大亨排行榜失敗：', error);
        }
    }

    async function initializeTycoon() {
        await window.raingodFirebaseReady;
        await window.raingodAuthReady;
        await window.raingodBindStorage('raingod-tycoon', [SAVE_KEY], { [SAVE_KEY]: null }, data => {
            loadGame(data[SAVE_KEY]);
            storageReady = true;
            saveGame();
            if (window.raingodCurrentUser) uploadTycoonLeaderboardScore();
        });
        window.raingodOnAuthStateChanged(currentUser => {
            const button = document.getElementById('tycoon-leaderboard-button');
            button.textContent = currentUser ? '🏆 排行榜' : '🏆 登入後查看排行榜';
            if (currentUser) uploadTycoonLeaderboardScore();
            else {
                closeTycoonLeaderboard();
                document.getElementById('tycoon-leaderboard-list').replaceChildren();
                document.getElementById('tycoon-leaderboard-status').textContent = '請登入帳號後查看。';
            }
        });
        draw();
    }

    const ITEMS = {
        RAW:     { name: '原礦', val: 10, color: '#ef4444' },
        STEEL:   { name: '鋼鐵', val: 50, color: '#f59e0b' },
        SILICON: { name: '矽晶', val: 80, color: '#0284c7' },
        CHIP:    { name: '晶片', val: 300, color: '#3b82f6' },
        URANIUM: { name: '鈾礦', val: 500, color: '#10b981' },
        BATTERY: { name: '核電池', val: 2500, color: '#22c55e' },
        CORE:    { name: '量子核心', val: 12000, color: '#a855f7' },
        ANTIM:   { name: '反物質', val: 100000, color: '#e11d48' }
    };

    function switchTab(tabId) {
        document.querySelectorAll('.panel > div[id^="tab-"]').forEach(d => d.style.display = 'none');
        document.getElementById(tabId).style.display = 'block';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        if (event) event.target.classList.add('active');
    }

    function toggleTycoonShop(open = !document.getElementById('ui').classList.contains('shop-open')) {
        const ui = document.getElementById('ui');
        const toggle = document.querySelector('.mobile-shop-toggle');
        ui.classList.toggle('shop-open', open);
        toggle.setAttribute('aria-expanded', String(open));
    }

    // 📍 調整建築位置：整體向下向右移動，避免與左上角 UI 重疊
    function getBuildings() {
        const startX = 80, startY = 100;
        const b = {
            extractor: { x: startX, y: startY, w: 110, h: 70, color: '#ef4444', label: '🔴 採礦塔' },
            smelter:   { x: startX, y: startY + 110, w: 110, h: 70, color: '#f59e0b', label: '🟠 鋼鐵廠' },
            hub:       { x: startX, y: cvs.height - 150, w: 140, h: 100, color: '#38bdf8', label: '💎 總部基地' }
        };
        if (techTier >= 2) b.chipFab = { x: startX, y: startY + 220, w: 110, h: 70, color: '#3b82f6', label: '🔵 晶片廠' };
        if (techTier >= 3) b.nukeFab = { x: startX, y: startY + 330, w: 110, h: 70, color: '#22c55e', label: '🟢 鈾能廠' };
        if (techTier >= 4) b.qFab    = { x: startX, y: startY + 440, w: 110, h: 70, color: '#a855f7', label: '🟣 量子合成' };
        if (techTier >= 5) b.antiFab = { x: startX, y: startY + 550, w: 110, h: 70, color: '#e11d48', label: '💎 反物質所' };
        return b;
    }

    const resize = () => { cvs.width = window.innerWidth; cvs.height = window.innerHeight; };
    window.addEventListener('resize', resize); resize();
    window.addEventListener('pointermove', e => {
        if (e.pointerType !== 'touch') { p.tx = e.clientX; p.ty = e.clientY; }
    });
    cvs.addEventListener('pointerdown', e => {
        if (e.pointerType === 'touch') { p.tx = e.clientX; p.ty = e.clientY; }
    });
    cvs.addEventListener('pointermove', e => {
        if (e.pointerType === 'touch') { p.tx = e.clientX; p.ty = e.clientY; }
    });

    function triggerShake(duration = 10) { shakeTime = duration; }
    function spawnFloatText(x, y, text, color='#4ade80') { floatTexts.push({ x, y, text, color, alpha: 1 }); }
    function spawnParticles(x, y, color, count=6) {
        for(let i=0; i<count; i++) {
            particles.push({ x, y, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8, size: Math.random()*5+2, color, alpha: 1 });
        }
    }

    function useSkill(num) {
        if (skillCd[num-1] > 0) return;
        if (num === 1) {
            isOverclocked = true; overclockTimer = 600; skillCd[0] = 1800;
            spawnFloatText(p.x, p.y, "⚡ 系統極速超頻！", "#f59e0b");
        } else if (num === 2) {
            enemies.forEach(e => { e.hp -= 300 + wave * 60; spawnParticles(e.x, e.y, '#e11d48', 12); });
            triggerShake(25); skillCd[1] = 2400;
            spawnFloatText(cvs.width/2, cvs.height/2, "💥 軌道離子砲全螢幕打擊！", "#e11d48");
        }
    }

    function buildTurret(type) {
        const costs = { gatling: 1000, laser: 5000, mortar: 20000, frost: 50000, blackhole: 200000 };
        let cost = costs[type] * Math.pow(1.3, turrets.filter(t=>t.type===type).length);
        if (money >= cost) {
            money -= cost;
            let tx = 260 + Math.random() * 200;
            let ty = 100 + Math.random() * (cvs.height - 220);
            turrets.push({ x: tx, y: ty, type, cd: 0, range: type==='laser'?350:(type==='blackhole'?280:240) });
            spawnFloatText(tx, ty, `防禦塔建造完成！`, '#38bdf8');
        }
    }

    function triggerNextWave() {
        if (!isWaveActive) {
            waveTimer = 0;
            saveGame();
        }
    }

    function spawnWave() {
        isWaveActive = true;
        bestWave = Math.max(bestWave, wave);
        saveGame();
        uploadTycoonLeaderboardScore();
        let count = 8 + wave * 4;
        let isBossWave = (wave % 5 === 0);

        for (let i = 0; i < count; i++) {
            setTimeout(() => {
                let type = 'normal';
                let rand = Math.random();
                if (rand < 0.25) type = 'runner';
                else if (rand < 0.45) type = 'tank';
                else if (rand < 0.6) type = 'bomber';

                if (isBossWave && i === count - 1) type = 'boss';

                let hpMap = { normal: 50, runner: 30, tank: 180, bomber: 40, boss: 1800 + wave * 600 };
                let spdMap = { normal: 1.5, runner: 2.8, tank: 0.8, bomber: 2.0, boss: 0.5 };

                enemies.push({
                    x: cvs.width + 40,
                    y: 80 + Math.random() * (cvs.height - 160),
                    type,
                    hp: (hpMap[type] + wave * 35),
                    maxHp: (hpMap[type] + wave * 35),
                    speed: spdMap[type],
                    reward: (type === 'boss' ? 3500 : 80) + wave * 30
                });
            }, i * 400);
        }
    }

    function buyBot() {
        let cost = Math.floor(500 * Math.pow(1.3, bots.length));
        if(money >= cost) { money -= cost; bots.push({ x: 120, y: cvs.height/2, bag: [], speed: 4.5 }); saveGame(); }
    }

    function upgrade(type) {
        if (type === 'miner') {
            let cost = Math.floor(1000 * Math.pow(1.5, minerLevel));
            if (money >= cost) { money -= cost; minerLevel++; saveGame(); }
        } else if (type === 'capacity') {
            let cost = Math.floor(1500 * (capacity / 2));
            if (money >= cost) { money -= cost; capacity += 2; saveGame(); }
        } else if (type === 'playerDamage') {
            let cost = Math.floor(1000 * Math.pow(1.6, playerDamageLevel));
            if (money >= cost) { money -= cost; playerDamageLevel++; saveGame(); }
        } else if (type === 'turretDamage') {
            let cost = Math.floor(1500 * Math.pow(1.6, turretDamageLevel));
            if (money >= cost) { money -= cost; turretDamageLevel++; saveGame(); }
        }
    }

    function buyTalent(type) {
        if (type === 'dmg' && darkMatter >= (talents.dmgLv + 1) * 5) {
            darkMatter -= (talents.dmgLv + 1) * 5; talents.dmgLv++;
        } else if (type === 'speed' && darkMatter >= (talents.spdLv + 1) * 5) {
            darkMatter -= (talents.spdLv + 1) * 5; talents.spdLv++;
        }
        saveGame();
    }

    function unlockTier(tier) {
        const costs = { 2: 2500, 3: 25000, 4: 200000, 5: 2000000 };
        if (money >= costs[tier] && techTier === tier - 1) {
            money -= costs[tier]; techTier = tier;
            saveGame();
        }
    }

    function triggerRebirth() {
        let earnedDM = Math.floor(money / 100000);
        if (earnedDM > 0 || money >= 100000) {
            darkMatter += Math.max(1, earnedDM);
            money = 2000; minerLevel = 0; capacity = 4; techTier = 1;
            playerDamageLevel = 0; turretDamageLevel = 0;
            p.bag = []; bots = []; items = []; turrets = []; enemies = []; wave = 1;
            spawnFloatText(cvs.width/2, cvs.height/2, `🌌 暗物質量子轉生成功！`, '#c084fc');
            triggerShake(30);
            saveGame();
        }
    }

    function updateQuests(type, amount = 1) {
        if (quest.type === type) {
            quest.current += amount;
            if (quest.current >= quest.target) {
                money += quest.reward;
                spawnFloatText(cvs.width/2, 100, `🎉 完成任務！獲得 +$${quest.reward}`, '#f59e0b');
                let targets = [30, 50, 100];
                let t = targets[Math.floor(Math.random() * targets.length)];
                quest = { type: 'kill', target: t, current: 0, reward: t * 120, desc: `擊殺 ${t} 隻異形蟲` };
            }
        }
    }

    function update() {
        frame++;
        const b = getBuildings();

        p.x += (p.tx - p.x) * 0.18; p.y += (p.ty - p.y) * 0.18;

        for (let i = 0; i < skillCd.length; i++) { if (skillCd[i] > 0) skillCd[i]--; }
        if (overclockTimer > 0) { overclockTimer--; if (overclockTimer === 0) isOverclocked = false; }

        if (!isWaveActive) {
            waveTimer--;
            if (waveTimer <= 0) spawnWave();
        } else {
            if (enemies.length === 0) {
                isWaveActive = false; wave++; waveTimer = 20 * 60;
                money += 1200 * wave; darkMatter += 1;
                spawnFloatText(cvs.width/2, cvs.height/2, `🎉 第 ${wave-1} 波完成！`, '#f59e0b');
                saveGame();
                uploadTycoonLeaderboardScore();
            }
        }

        // 產礦
        const spawnInterval = isOverclocked ? 4 : Math.max(6, 35 - minerLevel * 4);
        if(frame % spawnInterval === 0 && items.length < 50) {
            items.push({ x: b.extractor.x + b.extractor.w + 15, y: b.extractor.y + b.extractor.h/2 + (Math.random()-0.5)*30, type: 'RAW' });
        }

        // 機兵 AI
        bots.forEach(bot => {
            let speed = (bot.speed * (1 + talents.spdLv * 0.15)) * (isOverclocked ? 1.8 : 1);
            let target = null;
            if (bot.bag.length === 0) {
                let it = items[0];
                target = it ? { x: it.x, y: it.y } : { x: b.extractor.x + b.extractor.w + 15, y: b.extractor.y + b.extractor.h/2 };
            } else {
                let top = bot.bag[bot.bag.length - 1];
                if (top.type === 'RAW') target = { x: b.smelter.x + b.smelter.w/2, y: b.smelter.y + b.smelter.h/2 };
                else if (top.type === 'STEEL' && b.chipFab) target = { x: b.chipFab.x + b.chipFab.w/2, y: b.chipFab.y + b.chipFab.h/2 };
                else if (top.type === 'CHIP' && b.nukeFab) target = { x: b.nukeFab.x + b.nukeFab.w/2, y: b.nukeFab.y + b.nukeFab.h/2 };
                else if (top.type === 'BATTERY' && b.qFab) target = { x: b.qFab.x + b.qFab.w/2, y: b.qFab.y + b.qFab.h/2 };
                else if (top.type === 'CORE' && b.antiFab) target = { x: b.antiFab.x + b.antiFab.w/2, y: b.antiFab.y + b.antiFab.h/2 };
                else target = { x: b.hub.x + b.hub.w/2, y: b.hub.y + b.hub.h/2 };
            }

            let dx = target.x - bot.x, dy = target.y - bot.y, dist = Math.hypot(dx, dy);
            if(dist > 5) { bot.x += (dx / dist) * speed; bot.y += (dy / dist) * speed; }
            interact(bot, b);
        });

        interact(p, b);

        // 玩家電漿砲
        p.cooldown--;
        let totalDmgMult = (1 + darkMatter * 0.1) * (1 + talents.dmgLv * 0.2);
        if (p.cooldown <= 0 && enemies.length > 0) {
            let target = enemies.find(e => Math.hypot(p.x - e.x, p.y - e.y) < p.atkRange);
            if (target) {
                bullets.push({ x: p.x, y: p.y, tx: target.x, ty: target.y, dmg: 30 * totalDmgMult * (1 + playerDamageLevel * 0.25), speed: 15, color: '#38bdf8' });
                p.cooldown = isOverclocked ? 4 : 9;
            }
        }

        // 🏰 防衛塔射擊
        turrets.forEach(t => {
            t.cd--;
            if (t.cd <= 0 && enemies.length > 0) {
                let target = enemies.find(e => Math.hypot(t.x - e.x, t.y - e.y) < t.range);
                if (target) {
                    if (t.type === 'gatling') {
                        bullets.push({ x: t.x, y: t.y, tx: target.x, ty: target.y, dmg: 18 * totalDmgMult * (1 + turretDamageLevel * 0.2), speed: 16, color: '#f59e0b' });
                        t.cd = isOverclocked ? 3 : 8;
                    } else if (t.type === 'laser') {
                        bullets.push({ x: t.x, y: t.y, tx: target.x, ty: target.y, dmg: 60 * totalDmgMult * (1 + turretDamageLevel * 0.2), speed: 22, color: '#3b82f6' });
                        t.cd = 24;
                    } else if (t.type === 'mortar') {
                        bullets.push({ x: t.x, y: t.y, tx: target.x, ty: target.y, dmg: 140 * totalDmgMult * (1 + turretDamageLevel * 0.2), speed: 11, color: '#a855f7', splash: 90 });
                        t.cd = 48;
                    } else if (t.type === 'frost') {
                        target.speed = Math.max(0.4, target.speed * 0.5);
                        spawnParticles(target.x, target.y, '#0284c7', 4);
                        t.cd = 15;
                    } else if (t.type === 'blackhole') {
                        enemies.forEach(e => {
                            if (Math.hypot(t.x - e.x, t.y - e.y) < t.range) {
                                e.hp -= 8 * totalDmgMult * (1 + turretDamageLevel * 0.2);
                                e.x += (t.x - e.x) * 0.05; // 牽引吸引效果
                            }
                        });
                        spawnParticles(t.x, t.y, '#c084fc', 3);
                        t.cd = 5;
                    }
                }
            }
        });

        // 子彈傷害處理
        for (let i = bullets.length - 1; i >= 0; i--) {
            let bul = bullets[i];
            let dx = bul.tx - bul.x, dy = bul.ty - bul.y, dist = Math.hypot(dx, dy);
            if (dist < 12) {
                if (bul.splash) {
                    enemies.forEach(e => {
                        if (Math.hypot(bul.x - e.x, bul.y - e.y) < bul.splash) {
                            e.hp -= bul.dmg; spawnParticles(e.x, e.y, bul.color, 6);
                        }
                    });
                    triggerShake(10);
                } else {
                    enemies.forEach(e => {
                        if (Math.hypot(bul.x - e.x, bul.y - e.y) < 25) {
                            e.hp -= bul.dmg; spawnParticles(e.x, e.y, bul.color, 3);
                        }
                    });
                }
                bullets.splice(i, 1);
            } else {
                bul.x += (dx / dist) * bul.speed; bul.y += (dy / dist) * bul.speed;
            }
        }

        // 👾 敵群更新
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            e.x -= e.speed;

            if (e.hp <= 0) {
                money += e.reward;
                updateQuests('kill', 1);
                spawnFloatText(e.x, e.y, `+$${Math.floor(e.reward)}`, '#4ade80');
                spawnParticles(e.x, e.y, '#22c55e', 8);
                enemies.splice(i, 1);
                continue;
            }

            if (e.x < -40) e.x = cvs.width + 40;
        }

        if (shakeTime > 0) shakeTime--;
        for(let i = floatTexts.length-1; i>=0; i--) { floatTexts[i].y -= 1; floatTexts[i].alpha -= 0.02; if(floatTexts[i].alpha<=0) floatTexts.splice(i,1); }
        for(let i = particles.length-1; i>=0; i--) { particles[i].x += particles[i].vx; particles[i].y += particles[i].vy; particles[i].alpha -= 0.04; if(particles[i].alpha<=0) particles.splice(i,1); }

        // UI 數據同步
        document.getElementById('m').innerText = Math.floor(money).toLocaleString();
        document.getElementById('dm').innerText = darkMatter;
        document.getElementById('waveNum').innerText = wave;
        document.getElementById('enemyCount').innerText = enemies.length;

        document.getElementById('cd1').innerText = skillCd[0] > 0 ? `${Math.ceil(skillCd[0]/60)}s` : '就緒';
        document.getElementById('cd2').innerText = skillCd[1] > 0 ? `${Math.ceil(skillCd[1]/60)}s` : '就緒';

        document.getElementById('questText').innerText = quest.desc;
        document.getElementById('questProg').innerText = `${quest.current}/${quest.target}`;

        document.getElementById('tDmgCost').innerText = `${(talents.dmgLv + 1) * 5} DM`;
        document.getElementById('tSpdCost').innerText = `${(talents.spdLv + 1) * 5} DM`;
        const getTurretCost = (type, base) => Math.floor(base * Math.pow(1.3, turrets.filter(t=>t.type===type).length));
        document.getElementById('costGatling').innerText = `$${getTurretCost('gatling', 1000).toLocaleString()}`;
        document.getElementById('costLaser').innerText = `$${getTurretCost('laser', 5000).toLocaleString()}`;
        document.getElementById('costMortar').innerText = `$${getTurretCost('mortar', 20000).toLocaleString()}`;
        document.getElementById('costFrost').innerText = `$${getTurretCost('frost', 50000).toLocaleString()}`;
        document.getElementById('costBlackhole').innerText = `$${getTurretCost('blackhole', 200000).toLocaleString()}`;

        document.getElementById('minerLv').innerText = minerLevel;
        document.getElementById('capLv').innerText = capacity;
        document.getElementById('bCost').innerText = `$${Math.floor(500 * Math.pow(1.3, bots.length)).toLocaleString()}`;
        document.getElementById('mCost').innerText = `$${Math.floor(1000 * Math.pow(1.5, minerLevel)).toLocaleString()}`;
        document.getElementById('cCost').innerText = `$${Math.floor(1500 * (capacity / 2)).toLocaleString()}`;
        document.getElementById('playerDamageLv').innerText = playerDamageLevel;
        document.getElementById('playerDamageCost').innerText = `$${Math.floor(1000 * Math.pow(1.6, playerDamageLevel)).toLocaleString()}`;
        document.getElementById('turretDamageLv').innerText = turretDamageLevel;
        document.getElementById('turretDamageCost').innerText = `$${Math.floor(1500 * Math.pow(1.6, turretDamageLevel)).toLocaleString()}`;

        document.getElementById('rebirthGain').innerText = `+${Math.floor(money / 100000)} DM`;
        if (frame % 180 === 0) saveGame();
    }

    function processConvert(obj, from, to, bld) {
        if (obj.bag.some(i => i.type === from)) {
            let idx = obj.bag.findIndex(i => i.type === from);
            obj.bag[idx] = { type: to };
            spawnParticles(bld.x + bld.w/2, bld.y + bld.h/2, ITEMS[to].color, 6);
        }
    }

    function interact(obj, b) {
        for (let i = items.length - 1; i >= 0; i--) {
            if (Math.hypot(obj.x - items[i].x, obj.y - items[i].y) < 30 && obj.bag.length < capacity) {
                obj.bag.push(items.splice(i, 1)[0]);
            }
        }

        if (Math.hypot(obj.x - (b.smelter.x + b.smelter.w/2), obj.y - (b.smelter.y + b.smelter.h/2)) < 50) processConvert(obj, 'RAW', 'STEEL', b.smelter);
        if (b.chipFab && Math.hypot(obj.x - (b.chipFab.x + b.chipFab.w/2), obj.y - (b.chipFab.y + b.chipFab.h/2)) < 50) processConvert(obj, 'STEEL', 'CHIP', b.chipFab);
        if (b.nukeFab && Math.hypot(obj.x - (b.nukeFab.x + b.nukeFab.w/2), obj.y - (b.nukeFab.y + b.nukeFab.h/2)) < 50) processConvert(obj, 'CHIP', 'BATTERY', b.nukeFab);
        if (b.qFab && Math.hypot(obj.x - (b.qFab.x + b.qFab.w/2), obj.y - (b.qFab.y + b.qFab.h/2)) < 50) processConvert(obj, 'BATTERY', 'CORE', b.qFab);
        if (b.antiFab && Math.hypot(obj.x - (b.antiFab.x + b.antiFab.w/2), obj.y - (b.antiFab.y + b.antiFab.h/2)) < 50) processConvert(obj, 'CORE', 'ANTIM', b.antiFab);

        if (Math.hypot(obj.x - (b.hub.x + b.hub.w/2), obj.y - (b.hub.y + b.hub.h/2)) < 70) {
            if (obj.bag.length > 0) {
                let mult = 1 + (darkMatter * 0.1);
                let total = obj.bag.reduce((sum, item) => sum + (ITEMS[item.type].val * mult), 0);
                obj.bag = []; money += total;
                spawnFloatText(b.hub.x, b.hub.y - 20, `+$${Math.floor(total).toLocaleString()}`, '#4ade80');
            }
        }
    }

    function draw() {
        ctx.save();
        ctx.clearRect(0, 0, cvs.width, cvs.height);

        if (shakeTime > 0) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);

        ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, cvs.width, cvs.height);

        // 網格底圖
        ctx.strokeStyle = 'rgba(30, 41, 59, 0.25)'; ctx.lineWidth = 1;
        for (let x = 0; x < cvs.width; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, cvs.height); ctx.stroke(); }
        for (let y = 0; y < cvs.height; y += 50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cvs.width, y); ctx.stroke(); }

        const b = getBuildings();

        // 繪製建築物
        Object.values(b).forEach(bld => {
            ctx.shadowColor = bld.color; ctx.shadowBlur = 10;
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)'; ctx.strokeStyle = bld.color; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.roundRect(bld.x, bld.y, bld.w, bld.h, 10); ctx.fill(); ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(bld.label, bld.x + bld.w/2, bld.y - 8);
        });

        // 繪製防衛塔
        turrets.forEach(t => {
            let colorMap = { gatling: '#f59e0b', laser: '#3b82f6', mortar: '#a855f7', frost: '#0284c7', blackhole: '#c084fc' };
            ctx.fillStyle = colorMap[t.type];
            ctx.beginPath(); ctx.arc(t.x, t.y, 16, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
        });

        // 子彈
        bullets.forEach(bul => {
            ctx.fillStyle = bul.color;
            ctx.beginPath(); ctx.arc(bul.x, bul.y, bul.splash ? 7 : 4, 0, Math.PI * 2); ctx.fill();
        });

        // 異形敵人
        enemies.forEach(e => {
            let sizeMap = { normal: 14, runner: 10, tank: 20, bomber: 12, boss: 32 };
            let colorMap = { normal: '#ef4444', runner: '#f59e0b', tank: '#64748b', bomber: '#22c55e', boss: '#e11d48' };

            ctx.shadowColor = colorMap[e.type]; ctx.shadowBlur = e.type === 'boss' ? 15 : 0;
            ctx.fillStyle = colorMap[e.type];
            ctx.beginPath(); ctx.arc(e.x, e.y, sizeMap[e.type], 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;

            let barW = sizeMap[e.type] * 2.2;
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(e.x - barW/2, e.y - sizeMap[e.type] - 10, barW, 4);
            ctx.fillStyle = '#22c55e'; ctx.fillRect(e.x - barW/2, e.y - sizeMap[e.type] - 10, (e.hp / e.maxHp) * barW, 4);
        });

        // 掉落物
        items.forEach(it => {
            ctx.fillStyle = ITEMS[it.type].color;
            ctx.beginPath(); ctx.roundRect(it.x - 7, it.y - 7, 14, 14, 3); ctx.fill();
        });

        // 運輸機兵
        bots.forEach(bot => {
            ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(bot.x, bot.y, 12, 0, Math.PI * 2); ctx.fill();
            drawStack(bot);
        });

        // 玩家機兵
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.15)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.atkRange, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
        drawStack(p);

        // 特效與文字
        particles.forEach(pt => { ctx.fillStyle = pt.color; ctx.globalAlpha = Math.max(0, pt.alpha); ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1; });
        floatTexts.forEach(ft => { ctx.fillStyle = ft.color; ctx.globalAlpha = Math.max(0, ft.alpha); ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(ft.text, ft.x, ft.y); ctx.globalAlpha = 1; });

        ctx.restore();
        update(); requestAnimationFrame(draw);
    }

    function drawStack(obj) {
        obj.bag.forEach((it, i) => {
            ctx.fillStyle = ITEMS[it.type].color;
            ctx.beginPath(); ctx.roundRect(obj.x - 10, obj.y - 28 - (i * 8), 20, 6, 2); ctx.fill();
        });
    }

    window.addEventListener('pagehide', saveGame);
    window.addEventListener('beforeunload', saveGame);
    initializeTycoon().catch(error => {
        console.error('雨神大亨初始化失敗：', error);
        document.getElementById('tycoon-leaderboard-status').textContent = '遊戲初始化失敗，請重新整理頁面。';
    });
</script>
</body>
</html>
