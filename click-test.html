<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>點擊次數測試 | Raingod</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            color: #2d3436;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px;
            overflow-x: hidden;
        }
        .container {
            background: white; padding: 30px; border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15); text-align: center;
            width: 100%; max-width: 600px; display: flex;
            flex-direction: column; align-items: center;
            position: relative; z-index: 1;
        }
        h1 { margin-top: 0; margin-bottom: 15px; font-size: 28px; color: #2d3436; }
        .mode-select { margin-bottom: 20px; width: 100%; }
        .mode-select select {
            padding: 10px 16px; font-size: 16px; border-radius: 10px;
            border: 2px solid #dfe6e9; background-color: #f1f2f6;
            color: #2d3436; cursor: pointer; width: 100%;
            max-width: 320px; font-weight: bold;
        }
        .stats {
            display: flex; justify-content: space-around;
            margin-bottom: 25px; width: 100%; gap: 15px;
        }
        .stat-box { background: #f1f2f6; padding: 15px; border-radius: 12px; flex: 1; }
        .stat-box h3 { margin: 0 0 5px 0; font-size: 16px; color: #636e72; }
        .stat-box span { font-size: 32px; font-weight: bold; color: #0984e3; }
        #clickBtn {
            width: 100%; height: 320px; font-size: 48px; font-weight: 900;
            color: white; background: linear-gradient(145deg, #00b894, #00cec9);
            border: 6px solid #00a884; border-radius: 25px; cursor: pointer;
            transition: all 0.05s ease-in-out;
            box-shadow: 0 12px 25px rgba(0, 184, 148, 0.4);
            user-select: none; -webkit-user-select: none;
            touch-action: manipulation; display: flex;
            justify-content: center; align-items: center;
            text-align: center; line-height: 1.2; word-break: break-word;
            position: relative; overflow: hidden; z-index: 2;
        }
        #clickBtn:hover:not(:disabled) {
            background: linear-gradient(145deg, #00cec9, #00b894);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 184, 148, 0.5);
        }
        #clickBtn:active:not(:disabled) {
            transform: scale(0.96) translateY(4px);
            box-shadow: 0 5px 10px rgba(0, 184, 148, 0.4);
            background-color: #009473;
        }
        #clickBtn:disabled {
            background: #b2bec3; border-color: #636e72;
            box-shadow: none; cursor: not-allowed; color: #dfe6e9;
        }
        .login-hint { margin-bottom: 15px; font-size: 14px; color: #e17055; font-weight: 600; }
        .leaderboard-section {
            width: 100%; margin-top: 30px;
            border-top: 2px solid #dfe6e9; padding-top: 20px;
        }
        .leaderboard-section h2 { font-size: 22px; margin: 0 0 15px 0; color: #2d3436; }
        .lb-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .lb-tab {
            padding: 8px 20px; border-radius: 20px; border: 2px solid #dfe6e9;
            background: #f1f2f6; cursor: pointer; font-weight: bold;
            font-size: 14px; color: #636e72; transition: all 0.2s;
        }
        .lb-tab.active { background: #0984e3; border-color: #0984e3; color: white; }
        .lb-list { list-style: none; padding: 0; margin: 0; max-height: 300px; overflow-y: auto; text-align: left; }
        .lb-list li {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; border-bottom: 1px solid #f1f2f6; font-size: 15px;
        }
        .lb-list li:nth-child(1) { background: #ffeaa7; font-weight: bold; border-radius: 8px; }
        .lb-list li:nth-child(2) { background: #dfe6e9; border-radius: 8px; }
        .lb-list li:nth-child(3) { background: #fab1a0; border-radius: 8px; }
        .lb-rank { font-weight: bold; color: #636e72; min-width: 30px; }
        .lb-name { flex: 1; margin-left: 10px; }
        .lb-score { font-weight: bold; color: #0984e3; font-size: 18px; }
        .lb-empty { text-align: center; color: #b2bec3; padding: 20px; }
        .auto-clicker-warning { color: #d63031; font-weight: bold; font-size: 16px; margin-top: 10px; }
        #particleCanvas {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none; z-index: 9999;
        }
    </style>
</head>
<body>
    <link rel="stylesheet" href="menu.css">
    <div id="nav_bar"></div>
    <script src="menu.js"></script>

    <canvas id="particleCanvas"></canvas>

    <div class="container">
        <h1 id="gameTitle">一秒極速點擊</h1>
        <div class="login-hint" id="loginHint">🔒 請先登入才能參與排行榜</div>
        <div class="mode-select">
            <select id="modeSelector" onchange="changeMode()">
                <option value="1" selected>模式二：一秒極速點擊 (1s)</option>
                <option value="60">模式一：一分鐘挑戰 (60s)</option>
            </select>
        </div>
        <div class="stats">
            <div class="stat-box"><h3>時間</h3><span id="timer">1.0</span>s</div>
            <div class="stat-box"><h3>次數</h3><span id="score">0</span></div>
        </div>
        <button id="clickBtn" onclick="handleClick(event)">點擊開始！</button>
        <div id="autoClickerWarning" class="auto-clicker-warning" style="display:none;"></div>
        <div class="leaderboard-section">
            <h2>🏆 排行榜</h2>
            <div class="lb-tabs">
                <button class="lb-tab active" data-mode="1" onclick="switchLeaderboard(1)">1秒模式</button>
                <button class="lb-tab" data-mode="60" onclick="switchLeaderboard(60)">60秒模式</button>
            </div>
            <ul id="leaderboardList" class="lb-list"><li class="lb-empty">載入中...</li></ul>
        </div>
    </div>

    <script>
        // ==================== 粒子特效系統（高效版） ====================
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
        let animationFrameId = null;

        // 用固定大小物件池，避免每帧 GC
        const MAX_PARTICLES = 600;            // 硬上限，超過就丟掉最舊的
        const particlePool = [];
        let particleCount = 0;

        function acquireParticle() {
            if (particleCount < MAX_PARTICLES) {
                return particlePool[particleCount++] || (particlePool[particleCount - 1] = {});
            }
            // 池滿：覆蓋最舊的一顆（用環狀位移）—簡單起見直接覆蓋 index 0 並往前搬
            const p = particlePool[0];
            particlePool.copyWithin(0, 1);
            particlePool[MAX_PARTICLES - 1] = p;
            return p;
        }

        // 為降低 draw call，把粒子按顏色分組批次繪製
        // 但先求正確，這裡用簡化繪製：只畫圓形與方形，不用 star、不用 shadowBlur
        const PARTICLE_COLORS = [
            '#00cec9', '#00b894', '#0984e3', '#6c5ce7', '#e84393',
            '#fd79a8', '#fdcb6e', '#e17055', '#ffeaa7', '#55efc4',
            '#81ecec', '#74b9ff', '#a29bfe', '#ff7675', '#fab1a0'
        ];

        // 每下點擊固定參數
        const PARTICLES_PER_CLICK = 22;
        const BASE_SPEED_MIN = 3;
        const BASE_SPEED_MAX = 10;
        const BASE_SIZE_MIN = 4;
        const BASE_SIZE_MAX = 10;
        const BASE_DECAY_MIN = 0.016;
        const BASE_DECAY_MAX = 0.022;

        // 快取按鈕 rect，避免每下點擊都 layout
        let cachedBtnRect = null;
        let rectDirty = true;
        function markRectDirty() { rectDirty = true; }
        window.addEventListener('resize', markRectDirty);
        window.addEventListener('scroll', markRectDirty, { passive: true });

        function getBtnRect() {
            if (rectDirty || !cachedBtnRect) {
                cachedBtnRect = clickBtn.getBoundingClientRect();
                rectDirty = false;
            }
            return cachedBtnRect;
        }

        function spawnButtonEffect() {
            const rect = getBtnRect();
            const left = rect.left, top = rect.top;
            const width = rect.width, height = rect.height;
            const cx = left + width / 2, cy = top + height / 2;

            // 1) 邊緣取樣 12 點
            const perimeterSamples = 12;
            const per = 2 * (width + height);
            for (let s = 0; s < perimeterSamples; s++) {
                const t = s / perimeterSamples;
                let bx, by;
                let d = t * per;
                if (d < width) { bx = left + d; by = top; }
                else if (d < width + height) { bx = left + width; by = top + (d - width); }
                else if (d < 2 * width + height) { bx = left + width - (d - width - height); by = top + height; }
                else { bx = left; by = top + height - (d - 2 * width - height); }

                const outAngle = Math.atan2(by - cy, bx - cx) + (Math.random() - 0.5) * 0.5;
                const speed = BASE_SPEED_MIN + Math.random() * (BASE_SPEED_MAX - BASE_SPEED_MIN);
                const size = BASE_SIZE_MIN + Math.random() * (BASE_SIZE_MAX - BASE_SIZE_MIN);
                const color = PARTICLE_COLORS[(Math.random() * PARTICLE_COLORS.length) | 0];
                const shape = Math.random() < 0.35 ? 1 : 0; // 1=方形, 0=圓形
                const p = acquireParticle();
                p.x = bx; p.y = by;
                p.vx = Math.cos(outAngle) * speed;
                p.vy = Math.sin(outAngle) * speed;
                p.size = size;
                p.color = color;
                p.life = 1;
                p.decay = BASE_DECAY_MIN + Math.random() * (BASE_DECAY_MAX - BASE_DECAY_MIN);
                p.gravity = 0.16;
                p.rotation = Math.random() * Math.PI * 2;
                p.rotSpeed = (Math.random() - 0.5) * 0.25;
                p.shape = shape;
                p.isRing = false;
            }

            // 2) 內部隨機 10 顆
            const innerCount = PARTICLES_PER_CLICK - perimeterSamples;
            for (let i = 0; i < innerCount; i++) {
                const bx = left + Math.random() * width;
                const by = top + Math.random() * height;
                const angle = Math.random() * Math.PI * 2;
                const speed = BASE_SPEED_MIN + Math.random() * (BASE_SPEED_MAX - BASE_SPEED_MIN);
                const size = BASE_SIZE_MIN + Math.random() * (BASE_SIZE_MAX - BASE_SIZE_MIN);
                const color = PARTICLE_COLORS[(Math.random() * PARTICLE_COLORS.length) | 0];
                const shape = Math.random() < 0.35 ? 1 : 0;
                const p = acquireParticle();
                p.x = bx; p.y = by;
                p.vx = Math.cos(angle) * speed;
                p.vy = Math.sin(angle) * speed - 1;
                p.size = size;
                p.color = color;
                p.life = 1;
                p.decay = BASE_DECAY_MIN + Math.random() * (BASE_DECAY_MAX - BASE_DECAY_MIN);
                p.gravity = 0.16;
                p.rotation = Math.random() * Math.PI * 2;
                p.rotSpeed = (Math.random() - 0.5) * 0.25;
                p.shape = shape;
                p.isRing = false;
            }

            // 3) 衝擊波環：用輕量做法，直接畫 stroke，不用 shadowBlur
            const ring = acquireParticle();
            ring.isRing = true;
            ring.x = cx; ring.y = cy;
            ring.radius = Math.min(width, height) * 0.35;
            ring.maxRadius = Math.max(width, height) * 0.75;
            ring.life = 1;
            ring.decay = 0.03;
            ring.color = PARTICLE_COLORS[(Math.random() * PARTICLE_COLORS.length) | 0];
            ring.lineWidth = 4;

            ensureAnimation();
        }

        function ensureAnimation() {
            if (!animationFrameId) {
                animationFrameId = requestAnimationFrame(animateParticles);
            }
        }

        // 避免 shadowBlur；整體用 'lighter' 讓重疊更亮，但沒有每顆 save/restore
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'lighter';

            // 先更新與畫「非環」粒子（用統一 fillStyle，切換次數少）
            // 為避免每顆換色，把顏色排序或分批；這裡改用逐顆畫但省掉 save/restore/shadow
            for (let i = particleCount - 1; i >= 0; i--) {
                const p = particlePool[i];
                if (!p || p.life === undefined) { // 空槽（理論上不會有）
                    continue;
                }

                if (p.isRing) {
                    p.radius += (p.maxRadius - p.radius) * 0.12 + 1.5;
                    p.life -= p.decay;
                    if (p.life <= 0) { removeParticle(i); continue; }
                    ctx.globalAlpha = p.life * 0.7;
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = p.lineWidth * p.life;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.stroke();
                    continue;
                }

                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.vx *= 0.985;
                p.vy *= 0.985;
                p.life -= p.decay;

                if (p.life <= 0) { removeParticle(i); continue; }

                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;

                const s = p.size * p.life;
                if (p.shape === 1) {
                    // 方形：用 rotate 才需要 transform，這裡為省效能直接不旋轉畫方形
                    ctx.fillRect(p.x - s * 0.5, p.y - s * 0.5, s, s);
                } else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, s * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = 'source-over';

            if (particleCount > 0) {
                animationFrameId = requestAnimationFrame(animateParticles);
            } else {
                animationFrameId = null;
            }
        }

        function removeParticle(i) {
            // 與最後一個交換，然後 particleCount--
            particleCount--;
            if (i !== particleCount) {
                particlePool[i] = particlePool[particleCount];
                particlePool[particleCount] = null;
            } else {
                particlePool[i] = null;
            }
        }

        function resizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2); // 限制 DPR 避免 4K 爆卡
            canvas.width = Math.floor(window.innerWidth * dpr);
            canvas.height = Math.floor(window.innerHeight * dpr);
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // 用 CSS px 座標繪製
            markRectDirty();
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ==================== 遊戲核心 ====================
        let gameDuration = 1;
        let timeLeft = 1.0;
        let score = 0;
        let isPlaying = false;
        let isCountingDown = false;
        let timerId = null;

        let clickTimestamps = [];
        let autoClickerDetected = false;
        const AUTO_CLICKER_WARNING_TEXT = '⚠️ 偵測到異常點擊頻率，本次成績不列入排行榜！';
        const MIN_CLICK_INTERVAL = 30;

        let currentUser = null;
        let currentUsername = '';
        let currentLeaderboardMode = 1;

        const timerDisplay = document.getElementById('timer');
        const scoreDisplay = document.getElementById('score');
        const clickBtn = document.getElementById('clickBtn');
        const modeSelector = document.getElementById('modeSelector');
        const gameTitle = document.getElementById('gameTitle');
        const loginHint = document.getElementById('loginHint');
        const autoClickerWarning = document.getElementById('autoClickerWarning');
        const leaderboardList = document.getElementById('leaderboardList');

        // 按鈕 rect 在 DOM 變動時要重算（例如視窗大小改變、按鈕文字改變）
        const rectObserver = new ResizeObserver(markRectDirty);
        rectObserver.observe(clickBtn);

        function waitForAuth() {
            return new Promise((resolve) => {
                const check = () => {
                    if (window.firebase && window.firebase.auth) {
                        window.raingodFirebaseReady.then(() => {
                            window.raingodAuthReady.then(() => resolve(window.firebase.auth().currentUser));
                        });
                    } else {
                        setTimeout(check, 100);
                    }
                };
                check();
            });
        }

        waitForAuth().then((user) => {
            updateLoginState(user);
            if (window.firebase && window.firebase.auth) {
                window.firebase.auth().onAuthStateChanged((u) => updateLoginState(u));
            }
        });

        function updateLoginState(user) {
            currentUser = user;
            if (user && user.email) {
                currentUsername = user.email.split('@')[0];
                loginHint.textContent = '✅ 已登入：' + currentUsername + '，成績將列入排行榜';
                loginHint.style.color = '#00b894';
            } else {
                currentUsername = '';
                loginHint.textContent = '🔒 請先登入才能參與排行榜';
                loginHint.style.color = '#e17055';
            }
            loadLeaderboard(currentLeaderboardMode);
        }

        function getLeaderboardRef(mode) {
            return window.firebase.database().ref('leaderboard/' + mode);
        }

        function loadLeaderboard(mode) {
            currentLeaderboardMode = mode;
            document.querySelectorAll('.lb-tab').forEach(tab => {
                tab.classList.toggle('active', parseInt(tab.dataset.mode) === mode);
            });
            leaderboardList.innerHTML = '<li class="lb-empty">載入中...</li>';
            if (!window.firebase || !window.firebase.database) {
                leaderboardList.innerHTML = '<li class="lb-empty">Firebase 未就緒</li>';
                return;
            }
            getLeaderboardRef(mode).orderByChild('score').limitToLast(10).once('value')
                .then(snapshot => {
                    const entries = [];
                    snapshot.forEach(child => {
                        const val = child.val();
                        if (val && typeof val.score === 'number') {
                            entries.push({ username: child.key, score: val.score });
                        }
                    });
                    entries.sort((a, b) => b.score - a.score);
                    if (entries.length === 0) {
                        leaderboardList.innerHTML = '<li class="lb-empty">暫無成績，快來挑戰！</li>';
                        return;
                    }
                    leaderboardList.innerHTML = entries.map((e, i) => `
                        <li>
                            <span class="lb-rank">${i + 1}</span>
                            <span class="lb-name">${escapeHtml(e.username)}</span>
                            <span class="lb-score">${e.score}</span>
                        </li>
                    `).join('');
                })
                .catch(err => {
                    console.warn('讀取排行榜失敗', err);
                    leaderboardList.innerHTML = '<li class="lb-empty">排行榜載入失敗</li>';
                });
        }

        function switchLeaderboard(mode) { loadLeaderboard(mode); }

        async function submitScore(mode, scoreValue) {
            if (!currentUser || !currentUsername) return;
            if (autoClickerDetected) return;
            if (!window.firebase || !window.firebase.database) return;
            try {
                const ref = getLeaderboardRef(mode).child(currentUsername);
                const existing = await ref.once('value');
                const oldScore = existing.val() && existing.val().score ? existing.val().score : 0;
                if (scoreValue > oldScore) {
                    await ref.set({ score: scoreValue, timestamp: window.firebase.database.ServerValue.TIMESTAMP });
                }
                loadLeaderboard(currentLeaderboardMode);
            } catch (e) {
                console.warn('提交成績失敗', e);
            }
        }

        function changeMode() {
            if (isPlaying || isCountingDown) return;
            gameDuration = parseInt(modeSelector.value);
            timeLeft = gameDuration;
            timerDisplay.textContent = gameDuration === 1 ? '1.0' : timeLeft;
            score = 0;
            scoreDisplay.textContent = score;
            if (gameDuration === 60) {
                gameTitle.textContent = '一分鐘點擊挑戰';
                currentLeaderboardMode = 60;
            } else {
                gameTitle.textContent = '一秒極速點擊';
                currentLeaderboardMode = 1;
            }
            loadLeaderboard(currentLeaderboardMode);
        }

        function resetClickDetection() {
            clickTimestamps = [];
            autoClickerDetected = false;
            autoClickerWarning.style.display = 'none';
            autoClickerWarning.textContent = '';
        }

        function detectAutoClicker(timestamp) {
            clickTimestamps.push(timestamp);
            if (clickTimestamps.length > 20) clickTimestamps.shift();
            if (clickTimestamps.length < 5) return;
            const intervals = [];
            for (let i = 1; i < clickTimestamps.length; i++) {
                intervals.push(clickTimestamps[i] - clickTimestamps[i - 1]);
            }
            let suspiciousCount = 0;
            for (let i = 0; i < intervals.length; i++) {
                if (intervals[i] < MIN_CLICK_INTERVAL) suspiciousCount++;
            }
            if (suspiciousCount >= 3) {
                if (!autoClickerDetected) {
                    autoClickerDetected = true;
                    autoClickerWarning.textContent = AUTO_CLICKER_WARNING_TEXT;
                    autoClickerWarning.style.display = 'block';
                }
                return;
            }
            if (intervals.length >= 5) {
                const lastFive = intervals.slice(-5);
                const avg = lastFive.reduce((a, b) => a + b, 0) / lastFive.length;
                if (avg < 80) {
                    const variance = lastFive.reduce((sum, v) => sum + Math.pow(v - avg, 2), 0) / lastFive.length;
                    if (Math.sqrt(variance) < 5) {
                        if (!autoClickerDetected) {
                            autoClickerDetected = true;
                            autoClickerWarning.textContent = AUTO_CLICKER_WARNING_TEXT;
                            autoClickerWarning.style.display = 'block';
                        }
                    }
                }
            }
        }

        function handleClick(event) {
            const now = performance.now();
            if (isPlaying) {
                detectAutoClicker(now);
                spawnButtonEffect();
                score++;
                scoreDisplay.textContent = score;
                return;
            }
            if (isCountingDown) return;
            isCountingDown = true;
            modeSelector.disabled = true;
            clickBtn.disabled = true;
            resetClickDetection();
            let count = 3;
            clickBtn.textContent = count;
            const countdownInterval = setInterval(() => {
                count--;
                if (count > 0) { clickBtn.textContent = count; }
                else if (count === 0) { clickBtn.textContent = '開始！'; }
                else {
                    clearInterval(countdownInterval);
                    startOfficialGame();
                }
                markRectDirty();
            }, 1000);
        }

        function startOfficialGame() {
            isCountingDown = false;
            isPlaying = true;
            score = 0;
            timeLeft = gameDuration;
            resetClickDetection();
            scoreDisplay.textContent = score;
            timerDisplay.textContent = gameDuration === 1 ? '1.0' : timeLeft;
            clickBtn.disabled = false;
            clickBtn.textContent = gameDuration === 60 ? '狂點我！' : '猛按！';
            markRectDirty();
            const intervalTime = gameDuration === 1 ? 100 : 1000;
            const step = gameDuration === 1 ? 0.1 : 1;
            timerId = setInterval(() => {
                timeLeft = Number((timeLeft - step).toFixed(1));
                timerDisplay.textContent = gameDuration === 1 ? timeLeft.toFixed(1) : timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    endGame();
                }
            }, intervalTime);
        }

        function endGame() {
            isPlaying = false;
            clickBtn.disabled = true;
            clickBtn.textContent = `時間到！共點擊 ${score} 下`;
            markRectDirty();
            spawnButtonEffect();
            if (currentUser && !autoClickerDetected) {
                submitScore(gameDuration, score);
            } else if (autoClickerDetected) {
                autoClickerWarning.style.display = 'block';
                autoClickerWarning.textContent = AUTO_CLICKER_WARNING_TEXT;
            }
            setTimeout(() => {
                clickBtn.disabled = false;
                clickBtn.textContent = '再玩一次';
                timerDisplay.textContent = gameDuration === 1 ? '1.0' : gameDuration;
                modeSelector.disabled = false;
                markRectDirty();
            }, 3000);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.addEventListener('load', () => {
            const checkFirebase = setInterval(() => {
                if (window.firebase && window.firebase.database) {
                    clearInterval(checkFirebase);
                    loadLeaderboard(currentLeaderboardMode);
                }
            }, 200);
        });
    </script>
</body>
</html>
