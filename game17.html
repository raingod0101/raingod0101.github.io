<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2048 貪吃蛇 | Raingod</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #111;
            color: #fff;
            font-family: "Clear Sans", Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
        }

        /* 預留導覽列空間 (top 設為 70px) */
        .ui-container {
            position: absolute;
            top: 70px;
            left: 15px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.65);
            padding: 12px 20px;
            border-radius: 12px;
            pointer-events: none;
            backdrop-filter: blur(5px);
        }

        .leaderboard-container {
            position: absolute;
            top: 70px;
            right: 15px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.65);
            padding: 12px 18px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            min-width: 200px;
            transition: all 0.3s ease;
        }

        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 4px;
            margin-bottom: 8px;
        }

        .leaderboard-title {
            font-size: 14px;
            font-weight: bold;
            color: #edc22e;
        }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            padding: 2px 6px;
        }

        .leaderboard-list {
            display: block;
        }

        .leaderboard-container.collapsed .leaderboard-list {
            display: none;
        }

        .leaderboard-item {
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .leaderboard-item.is-player {
            color: #edc22e;
            font-weight: bold;
        }

        /* 擊殺播報容器 */
        .kill-feed-container {
            position: absolute;
            top: 130px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            pointer-events: none;
        }

        .kill-msg {
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease-out;
            backdrop-filter: blur(4px);
        }

        .kill-msg .killer { color: #ffd700; }
        .kill-msg .victim { color: #ff6b6b; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 進入遊戲前的設定選單 Overlay */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .start-card {
            background: rgba(30, 30, 30, 0.95);
            padding: 25px 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            width: 320px;
            text-align: center;
        }

        .start-card h2 {
            margin-top: 0;
            color: #edc22e;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            color: #ccc;
        }

        .input-group input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .color-picker-container input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        .start-btn {
            width: 100%;
            padding: 12px;
            background: #edc22e;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .start-btn:hover {
            background: #f5d76e;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 5px 0;
            color: #edc22e;
        }

        .score-container {
            font-size: 16px;
            font-weight: bold;
        }

        .shield-status {
            font-size: 13px;
            color: #51cf66;
            font-weight: bold;
            margin-top: 4px;
        }

        canvas {
            display: block;
            background-color: #bbada0;
        }

        #joystick-base {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            z-index: 20;
            touch-action: none;
        }

        #joystick-stick {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(237, 194, 46, 0.85);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
    </style>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://game-24b43-default-rtdb.firebaseio.com/"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const playerId = 'player_' + Math.random().toString(36).substr(2, 9);

        const MAP_SIZE = 3600;
        const BLOCK_SIZE = 42;
        const SPEED = 4.5;
        const FOOD_COUNT = 200;
        const AI_COUNT = 8;
        const BODY_SPACING = 28;
        const SHIELD_DURATION = 3000;
        const AFK_TIMEOUT = 15000;

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score");
        const shieldUi = document.getElementById("shield-ui");
        const shieldTimeDisplay = document.getElementById("shield-time");
        const leaderboardList = document.getElementById("leaderboard-list");
        const killFeedContainer = document.getElementById("kill-feed");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        const colors = {
            2: { bg: "#eee4da", text: "#776e65" },
            4: { bg: "#ede0c8", text: "#776e65" },
            8: { bg: "#f2b179", text: "#f9f6f2" },
            16: { bg: "#f59563", text: "#f9f6f2" },
            32: { bg: "#f67c5f", text: "#f9f6f2" },
            64: { bg: "#f65e3b", text: "#f9f6f2" },
            128: { bg: "#edcf72", text: "#f9f6f2" },
            256: { bg: "#edcc61", text: "#f9f6f2" },
            512: { bg: "#edc850", text: "#f9f6f2" },
            1024: { bg: "#edc53f", text: "#f9f6f2" },
            2048: { bg: "#edc22e", text: "#f9f6f2" },
            4096: { bg: "#3c3a32", text: "#f9f6f2" },
            8192: { bg: "#222222", text: "#f9f6f2" }
        };

        let gameStarted = false;
        let player = {
            id: playerId,
            name: '',
            isAI: false,
            body: [{ x: Math.random() * (MAP_SIZE - 400) + 200, y: Math.random() * (MAP_SIZE - 400) + 200, value: 2 }],
            angle: 0,
            score: 0,
            color: '#edc22e',
            shieldUntil: Date.now() + SHIELD_DURATION,
            lastMoved: Date.now()
        };

        let remotePlayers = {}; 
        let aiSnakes = [];
        let foods = [];
        let gameOver = false;
        let playerRef = null;

        // 判斷當前玩家是否為 Host（ID 字典序最小者為房主，負責 AI 運算）
        function isHost() {
            const allIds = [playerId, ...Object.keys(remotePlayers)].sort();
            return allIds[0] === playerId;
        }

        // 排行榜收合/展開邏輯
        const leaderboardContainer = document.getElementById("leaderboard-container");
        const toggleBtn = document.getElementById("toggle-leaderboard");
        toggleBtn.addEventListener("click", () => {
            leaderboardContainer.classList.toggle("collapsed");
            toggleBtn.innerText = leaderboardContainer.classList.contains("collapsed") ? "展開" : "隱藏";
        });

        // 啟動選單設定
        const startOverlay = document.getElementById("start-overlay");
        const nameInput = document.getElementById("player-name-input");
        const colorInput = document.getElementById("player-color-input");
        const startBtn = document.getElementById("start-game-btn");

        nameInput.value = '玩家_' + Math.floor(1000 + Math.random() * 9000);

        startBtn.addEventListener("click", () => {
            player.name = nameInput.value.trim() || '無名蛇';
            player.color = colorInput.value;
            player.shieldUntil = Date.now() + SHIELD_DURATION;
            player.lastMoved = Date.now();

            playerRef = ref(db, 'snakes/' + playerId);
            onDisconnect(playerRef).remove();

            startOverlay.style.display = "none";
            gameStarted = true;
            requestAnimationFrame(gameLoop);
        });

        // 監聽所有玩家
        const snakesRef = ref(db, 'snakes');
        onValue(snakesRef, (snapshot) => {
            const data = snapshot.val() || {};
            const now = Date.now();
            remotePlayers = {};
            
            for (let id in data) {
                if (id !== playerId) {
                    const rp = data[id];
                    if (rp.lastUpdated && now - rp.lastUpdated > AFK_TIMEOUT) {
                        remove(ref(db, 'snakes/' + id));
                    } else {
                        remotePlayers[id] = rp;
                    }
                }
            }
        });

        // 監聽 AI 蛇資料同步 (非 Host 玩家使用同步下來的 AI)
        const aiRef = ref(db, 'aiSnakes');
        onValue(aiRef, (snapshot) => {
            if (!isHost()) {
                const data = snapshot.val();
                if (data) {
                    aiSnakes = Array.isArray(data) ? data : Object.values(data);
                } else {
                    aiSnakes = [];
                }
            }
        });

        for (let i = 0; i < FOOD_COUNT; i++) foods.push(generateFood());
        for (let i = 0; i < AI_COUNT; i++) aiSnakes.push(generateAISnake(i));

        function generateFood() {
            const possibleValues = [2, 4, 8, 16, 32, 64, 128];
            return {
                x: Math.random() * (MAP_SIZE - 300) + 150,
                y: Math.random() * (MAP_SIZE - 300) + 150,
                value: possibleValues[Math.floor(Math.random() * possibleValues.length)]
            };
        }

        function generateAISnake(id) {
            const startX = Math.random() * (MAP_SIZE - 400) + 200;
            const startY = Math.random() * (MAP_SIZE - 400) + 200;
            const baseValues = [2, 4, 8, 16, 32, 64];
            const startVal = baseValues[Math.floor(Math.random() * baseValues.length)];

            return {
                id: 'ai_' + id,
                name: 'AI-蛇王 ' + (id + 1),
                isAI: true,
                body: [
                    { x: startX, y: startY, value: startVal },
                    { x: startX - BODY_SPACING, y: startY, value: Math.max(2, Math.floor(startVal / 2)) }
                ],
                angle: Math.random() * Math.PI * 2,
                score: 0,
                color: `hsl(${Math.random() * 360}, 60%, 50%)`,
                shieldUntil: Date.now() + SHIELD_DURATION,
                lastMoved: Date.now()
            };
        }

        function showKillAnnouncement(killerName, victimName) {
            const msg = document.createElement("div");
            msg.className = "kill-msg";
            msg.innerHTML = `<span class="killer">⚔️ ${killerName}</span> 擊殺了 <span class="victim">${victimName}</span>`;
            
            killFeedContainer.appendChild(msg);

            setTimeout(() => {
                msg.style.transition = "opacity 0.5s ease";
                msg.style.opacity = "0";
                setTimeout(() => msg.remove(), 500);
            }, 3000);
        }

        // 搖桿與鍵盤控制
        const joyBase = document.getElementById("joystick-base");
        const joyStick = document.getElementById("joystick-stick");
        let joyActive = false;
        let joyCenter = { x: 0, y: 0 };

        function handleJoystickStart(e) {
            joyActive = true;
            const rect = joyBase.getBoundingClientRect();
            joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            handleJoystickMove(e);
        }

        function handleJoystickMove(e) {
            if (!joyActive) return;
            const touch = e.touches ? e.touches[0] : e;
            const dx = touch.clientX - joyCenter.x;
            const dy = touch.clientY - joyCenter.y;

            const dist = Math.min(Math.hypot(dx, dy), 45);
            player.angle = Math.atan2(dy, dx);
            joyStick.style.transform = `translate(${Math.cos(player.angle) * dist}px, ${Math.sin(player.angle) * dist}px)`;
        }

        function handleJoystickEnd() {
            joyActive = false;
            joyStick.style.transform = `translate(0px, 0px)`;
        }

        joyBase.addEventListener("touchstart", handleJoystickStart, { passive: false });
        window.addEventListener("touchmove", handleJoystickMove, { passive: false });
        window.addEventListener("touchend", handleJoystickEnd);
        joyBase.addEventListener("mousedown", handleJoystickStart);
        window.addEventListener("mousemove", handleJoystickMove);
        window.addEventListener("mouseup", handleJoystickEnd);

        const keys = {};
        window.addEventListener("keydown", e => keys[e.key] = true);
        window.addEventListener("keyup", e => keys[e.key] = false);

        function processKeyboardInput() {
            let kx = 0, ky = 0;
            if (keys["ArrowUp"] || keys["w"] || keys["W"]) ky -= 1;
            if (keys["ArrowDown"] || keys["s"] || keys["S"]) ky += 1;
            if (keys["ArrowLeft"] || keys["a"] || keys["A"]) kx -= 1;
            if (keys["ArrowRight"] || keys["d"] || keys["D"]) kx += 1;

            if (kx !== 0 || ky !== 0) {
                player.angle = Math.atan2(ky, kx);
            }
        }

        function reorderAndMergeSnake(snakeObj) {
            let values = snakeObj.body.map(seg => seg.value).sort((a, b) => b - a);
            let mergedValues = [];
            let i = 0;
            while (i < values.length) {
                if (i < values.length - 1 && values[i] === values[i + 1]) {
                    let newVal = values[i] * 2;
                    mergedValues.push(newVal);
                    snakeObj.score += newVal;
                    if (snakeObj.id === playerId) scoreDisplay.innerText = snakeObj.score;
                    i += 2;
                } else {
                    mergedValues.push(values[i]);
                    i++;
                }
            }

            snakeObj.body = snakeObj.body.slice(0, mergedValues.length);
            for (let k = 0; k < mergedValues.length; k++) {
                snakeObj.body[k].value = mergedValues[k];
            }
        }

        function updateAISnake(ai) {
            const head = ai.body[0];
            let target = null;
            let minDist = Infinity;

            foods.forEach(f => {
                if (f.value <= head.value) {
                    const d = Math.hypot(head.x - f.x, head.y - f.y);
                    if (d < minDist) {
                        minDist = d;
                        target = f;
                    }
                }
            });

            let avoidAngle = null;
            const margin = 150;
            if (head.x < margin) avoidAngle = 0;
            else if (head.x > MAP_SIZE - margin) avoidAngle = Math.PI;
            else if (head.y < margin) avoidAngle = Math.PI / 2;
            else if (head.y > MAP_SIZE - margin) avoidAngle = -Math.PI / 2;

            if (avoidAngle !== null) {
                ai.angle = avoidAngle;
            } else if (target) {
                ai.angle = Math.atan2(target.y - head.y, target.x - head.x);
            }
        }

        function moveSnake(snakeObj) {
            const head = snakeObj.body[0];
            let nextX = head.x + Math.cos(snakeObj.angle) * SPEED;
            let nextY = head.y + Math.sin(snakeObj.angle) * SPEED;

            if (Math.abs(nextX - head.x) > 0.01 || Math.abs(nextY - head.y) > 0.01) {
                snakeObj.lastMoved = Date.now();
            }

            if (nextX < BLOCK_SIZE / 2 || nextX > MAP_SIZE - BLOCK_SIZE / 2 ||
                nextY < BLOCK_SIZE / 2 || nextY > MAP_SIZE - BLOCK_SIZE / 2) {
                return false;
            }

            foods.forEach(f => {
                if (f.value > head.value) {
                    const dist = Math.hypot(nextX - f.x, nextY - f.y);
                    const minDist = BLOCK_SIZE;
                    if (dist < minDist) {
                        const pushAngle = Math.atan2(nextY - f.y, nextX - f.x);
                        nextX = f.x + Math.cos(pushAngle) * minDist;
                        nextY = f.y + Math.sin(pushAngle) * minDist;
                    }
                }
            });

            head.x = nextX;
            head.y = nextY;

            for (let i = 1; i < snakeObj.body.length; i++) {
                const prev = snakeObj.body[i - 1];
                const curr = snakeObj.body[i];
                const dx = prev.x - curr.x;
                const dy = prev.y - curr.y;
                const dist = Math.hypot(dx, dy);

                if (dist > BODY_SPACING) {
                    const angle = Math.atan2(dy, dx);
                    curr.x = prev.x - Math.cos(angle) * BODY_SPACING;
                    curr.y = prev.y - Math.sin(angle) * BODY_SPACING;
                }
            }
            return true;
        }

        function killSnake(snakeObj) {
            snakeObj.body.forEach(seg => {
                foods.push({
                    x: seg.x + (Math.random() - 0.5) * 40,
                    y: seg.y + (Math.random() - 0.5) * 40,
                    value: seg.value
                });
            });
        }

        function updateLeaderboard() {
            const allSnakes = [player, ...Object.values(remotePlayers), ...aiSnakes];
            allSnakes.sort((a, b) => b.score - a.score);

            leaderboardList.innerHTML = '';
            const top5 = allSnakes.slice(0, 5);

            top5.forEach((s, idx) => {
                const item = document.createElement('div');
                item.className = 'leaderboard-item' + (s.id === playerId ? ' is-player' : '');
                const tag = s.isAI ? '🤖' : '👤';
                item.innerHTML = `<span>${idx + 1}. ${tag} ${s.name}</span><span>${s.score}分</span>`;
                leaderboardList.appendChild(item);
            });
        }

        // 資料寫入與同步循環
        setInterval(() => {
            if (gameStarted && !gameOver && playerRef) {
                // 1. 寫入本地玩家資料
                set(playerRef, {
                    id: player.id,
                    name: player.name,
                    body: player.body,
                    score: player.score,
                    color: player.color,
                    shieldUntil: player.shieldUntil,
                    lastUpdated: Date.now()
                });

                // 2. 若自己是 Host 房主，同步 AI 資料至 Firebase
                if (isHost()) {
                    set(ref(db, 'aiSnakes'), aiSnakes);
                }
            }
        }, 80);

        function update() {
            if (!gameStarted || gameOver) return;

            processKeyboardInput();

            const now = Date.now();

            if (now - player.lastMoved > AFK_TIMEOUT) {
                endGame("因閒置超過 15 秒未移動，已自動清理退出遊戲！");
                return;
            }

            const pShieldRemaining = Math.max(0, (player.shieldUntil - now) / 1000);
            if (pShieldRemaining > 0) {
                shieldTimeDisplay.innerText = pShieldRemaining.toFixed(1);
            } else {
                shieldUi.style.display = 'none';
            }

            if (!moveSnake(player)) {
                endGame("撞到地圖邊界牆壁了！");
                return;
            }

            // 僅 Host 房主玩家計算 AI 的移動與生成
            if (isHost()) {
                for (let i = aiSnakes.length - 1; i >= 0; i--) {
                    const ai = aiSnakes[i];
                    updateAISnake(ai);
                    
                    if (!moveSnake(ai) || (now - ai.lastMoved > AFK_TIMEOUT)) {
                        killSnake(ai);
                        aiSnakes.splice(i, 1);
                        aiSnakes.push(generateAISnake(Math.floor(Math.random() * 1000)));
                    }
                }
            }

            const allOtherSnakes = [...Object.values(remotePlayers), ...aiSnakes];

            // 玩家碰撞檢測
            const head = player.body[0];
            const isShielded = now < player.shieldUntil;

            if (!isShielded) {
                for (let other of allOtherSnakes) {
                    if (other.body) {
                        for (let k = 0; k < other.body.length; k++) {
                            const seg = other.body[k];
                            if (Math.hypot(head.x - seg.x, head.y - seg.y) < BLOCK_SIZE * 0.75) {
                                showKillAnnouncement(other.name, player.name);
                                endGame(`撞到了【${other.name}】的身體！`);
                                return;
                            }
                        }
                    }
                }
            }

            // AI 蛇碰撞檢測 (僅 Host 計算)
            if (isHost()) {
                for (let i = aiSnakes.length - 1; i >= 0; i--) {
                    const ai = aiSnakes[i];
                    if (now < ai.shieldUntil) continue;

                    const aiHead = ai.body[0];
                    const targetSnakes = [player, ...Object.values(remotePlayers), ...aiSnakes.filter(s => s.id !== ai.id)];

                    let died = false;
                    for (let other of targetSnakes) {
                        if (died) break;
                        if (other.body) {
                            for (let k = 0; k < other.body.length; k++) {
                                const seg = other.body[k];
                                if (Math.hypot(aiHead.x - seg.x, aiHead.y - seg.y) < BLOCK_SIZE * 0.75) {
                                    showKillAnnouncement(other.name, ai.name);
                                    killSnake(ai);
                                    aiSnakes.splice(i, 1);
                                    aiSnakes.push(generateAISnake(Math.floor(Math.random() * 1000)));
                                    died = true;
                                    break;
                                }
                            }
                        }
                    }
                }
            }

            // 吃食物邏輯 (Host 負責 AI 吃食物，玩家自己負責玩家吃食物)
            const activeSnakesToEat = isHost() ? [player, ...aiSnakes] : [player];
            activeSnakesToEat.forEach(s => {
                const sHead = s.body[0];
                for (let i = foods.length - 1; i >= 0; i--) {
                    const f = foods[i];
                    if (Math.hypot(sHead.x - f.x, sHead.y - f.y) < BLOCK_SIZE * 0.8) {
                        if (f.value > sHead.value) continue;

                        const last = s.body[s.body.length - 1];
                        s.body.push({ x: last.x, y: last.y, value: f.value });
                        reorderAndMergeSnake(s);

                        foods.splice(i, 1);
                        foods.push(generateFood());
                    }
                }
            });

            updateLeaderboard();
        }

        function draw() {
            ctx.fillStyle = "#1e1e1e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!gameStarted) return;

            const head = player.body[0];

            ctx.save();
            ctx.translate(canvas.width / 2 - head.x, canvas.height / 2 - head.y);

            ctx.fillStyle = "#bbada0";
            ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);

            ctx.strokeStyle = "#ff4444";
            ctx.lineWidth = 12;
            ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

            ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
            ctx.lineWidth = 2;
            for (let x = 0; x <= MAP_SIZE; x += 100) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
            }
            for (let y = 0; y <= MAP_SIZE; y += 100) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke();
            }

            foods.forEach(f => drawBlock(f.x, f.y, f.value));

            aiSnakes.forEach(ai => {
                if (ai.body && ai.body.length > 0) {
                    const isShielded = Date.now() < ai.shieldUntil;
                    for (let i = ai.body.length - 1; i >= 0; i--) {
                        drawBlock(ai.body[i].x, ai.body[i].y, ai.body[i].value, i === 0, ai.color, ai.name, isShielded);
                    }
                }
            });

            Object.values(remotePlayers).forEach(rp => {
                if (rp.body && rp.body.length > 0) {
                    const isShielded = Date.now() < (rp.shieldUntil || 0);
                    for (let i = rp.body.length - 1; i >= 0; i--) {
                        drawBlock(rp.body[i].x, rp.body[i].y, rp.body[i].value, i === 0, rp.color || "#00ffff", rp.name, isShielded);
                    }
                }
            });

            const isPlayerShielded = Date.now() < player.shieldUntil;
            for (let i = player.body.length - 1; i >= 0; i--) {
                drawBlock(player.body[i].x, player.body[i].y, player.body[i].value, i === 0, player.color, player.name, isPlayerShielded);
            }

            ctx.restore();
        }

        function drawBlock(x, y, value, isHead = false, headColor = "#ffffff", name = "", isShielded = false) {
            const style = colors[value] || { bg: "#3c3a32", text: "#f9f6f2" };
            const half = BLOCK_SIZE / 2;

            ctx.save();
            ctx.translate(x, y);

            if (isHead && isShielded) {
                ctx.beginPath();
                ctx.arc(0, 0, BLOCK_SIZE * 0.9, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 215, 0, 0.3)";
                ctx.fill();
                ctx.strokeStyle = "#ffd700";
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            ctx.fillStyle = style.bg;
            ctx.shadowColor = "rgba(0,0,0,0.25)";
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.roundRect(-half, -half, BLOCK_SIZE, BLOCK_SIZE, 8);
            ctx.fill();

            if (isHead) {
                ctx.strokeStyle = headColor;
                ctx.lineWidth = 4;
                ctx.stroke();

                if (name) {
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 12px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(name, 0, -half - 8);
                }
            }

            ctx.fillStyle = style.text;
            ctx.font = "bold 16px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowBlur = 0;
            ctx.fillText(value, 0, 0);

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            if (!gameOver && gameStarted) {
                requestAnimationFrame(gameLoop);
            }
        }

        function endGame(msg) {
            gameOver = true;
            if (playerRef) remove(playerRef);
            setTimeout(() => {
                alert(msg + "\n最終得分: " + player.score);
                location.reload();
            }, 100);
        }
    </script>
</head>
<body>
    <link rel="stylesheet" href="menu.css">
    <div id="nav_bar"></div>
    <script src="menu.js"></script>

    <!-- 進入遊戲設定視窗 -->
    <div id="start-overlay">
        <div class="start-card">
            <h2>遊戲設定</h2>
            <div class="input-group">
                <label for="player-name-input">玩家暱稱</label>
                <input type="text" id="player-name-input" maxlength="10" placeholder="輸入你的暱稱">
            </div>
            <div class="input-group">
                <label for="player-color-input">外框顏色</label>
                <div class="color-picker-container">
                    <input type="color" id="player-color-input" value="#edc22e">
                    <span style="font-size: 13px; color: #aaa;">點擊選擇蛇頭顏色</span>
                </div>
            </div>
            <button class="start-btn" id="start-game-btn">開始遊戲</button>
        </div>
    </div>

    <!-- UI 計分板 -->
    <div class="ui-container">
        <h1>2048 貪吃蛇</h1>
        <div class="score-container">玩家分數: <span id="score">0</span></div>
        <div id="shield-ui" class="shield-status">🛡️ 防護罩倒數: <span id="shield-time">3.0</span>s</div>
    </div>

    <!-- 擊殺播報容器 -->
    <div class="kill-feed-container" id="kill-feed"></div>

    <!-- 排行榜 (支援折疊) -->
    <div class="leaderboard-container" id="leaderboard-container">
        <div class="leaderboard-header">
            <span class="leaderboard-title">🏆 即時排行榜</span>
            <button class="toggle-btn" id="toggle-leaderboard">隱藏</button>
        </div>
        <div class="leaderboard-list" id="leaderboard-list"></div>
    </div>

    <div id="joystick-base">
        <div id="joystick-stick"></div>
    </div>

    <canvas id="gameCanvas"></canvas>
</body>
</html>
