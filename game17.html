<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2048 貪吃蛇 | Raingod</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #111;
            color: #fff;
            font-family: "Clear Sans", Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
        }

        /* UI 容器 */
        .ui-container {
            position: absolute;
            top: 70px;
            left: 15px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.65);
            padding: 12px 20px;
            border-radius: 12px;
            pointer-events: none;
            backdrop-filter: blur(5px);
        }

        /* 排行榜升級版樣式 */
        .leaderboard-container {
            position: absolute;
            top: 70px;
            right: 15px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 16px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            min-width: 240px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 6px;
            margin-bottom: 8px;
        }

        .leaderboard-title {
            font-size: 14px;
            font-weight: bold;
            color: #edc22e;
        }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            padding: 2px 6px;
        }
        .toggle-btn:hover { background: rgba(255, 255, 255, 0.3); }

        /* 切換頁籤 (Tab) 樣式 */
        .lb-controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }
        .lb-tab-group {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 2px;
        }
        .lb-tab {
            flex: 1;
            text-align: center;
            font-size: 11px;
            padding: 4px 0;
            cursor: pointer;
            border-radius: 4px;
            color: #aaa;
            transition: all 0.2s;
        }
        .lb-tab.active {
            background: #edc22e;
            color: #111;
            font-weight: bold;
        }

        .leaderboard-list {
            display: block;
            max-height: 180px;
            overflow-y: auto;
        }

        .leaderboard-container.collapsed .leaderboard-list,
        .leaderboard-container.collapsed .lb-controls {
            display: none;
        }

        .leaderboard-item {
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .leaderboard-item.is-player {
            color: #edc22e;
            font-weight: bold;
        }

        /* 擊殺播報容器 */
        .kill-feed-container {
            position: absolute;
            top: 130px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            pointer-events: none;
        }

        .kill-msg {
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease-out;
            backdrop-filter: blur(4px);
        }

        .kill-msg .killer { color: #ffd700; }
        .kill-msg .victim { color: #ff6b6b; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 進入遊戲前的設定選單 Overlay */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .start-card {
            background: rgba(30, 30, 30, 0.95);
            padding: 25px 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            width: 320px;
            text-align: center;
        }

        .start-card h2 {
            margin-top: 0;
            color: #edc22e;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            color: #ccc;
        }

        .input-group input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .color-picker-container input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        .start-btn {
            width: 100%;
            padding: 12px;
            background: #edc22e;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .start-btn:hover {
            background: #f5d76e;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 5px 0;
            color: #edc22e;
        }

        .score-container {
            font-size: 15px;
            font-weight: bold;
        }

        .shield-status {
            font-size: 13px;
            color: #51cf66;
            font-weight: bold;
            margin-top: 4px;
        }

        canvas {
            display: block;
            background-color: #bbada0;
        }

        #joystick-base {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            z-index: 20;
            touch-action: none;
        }

        #joystick-stick {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(237, 194, 46, 0.85);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
    </style>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect, remove, runTransaction } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://game-24b43-default-rtdb.firebaseio.com/"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const playerId = 'player_' + Math.random().toString(36).substr(2, 9);

        const MAP_SIZE = 3600;
        const BLOCK_SIZE = 42;
        const SPEED = 4.5;
        const FOOD_COUNT = 200;
        const AI_COUNT = 8;
        const BODY_SPACING = 28;
        const SHIELD_DURATION = 3000;
        const AFK_TIMEOUT = 15000;

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score");
        const killsDisplay = document.getElementById("kills");
        const shieldUi = document.getElementById("shield-ui");
        const shieldTimeDisplay = document.getElementById("shield-time");
        const leaderboardList = document.getElementById("leaderboard-list");
        const killFeedContainer = document.getElementById("kill-feed");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        const colors = {
            2: { bg: "#eee4da", text: "#776e65" },
            4: { bg: "#ede0c8", text: "#776e65" },
            8: { bg: "#f2b179", text: "#f9f6f2" },
            16: { bg: "#f59563", text: "#f9f6f2" },
            32: { bg: "#f67c5f", text: "#f9f6f2" },
            64: { bg: "#f65e3b", text: "#f9f6f2" },
            128: { bg: "#edcf72", text: "#f9f6f2" },
            256: { bg: "#edcc61", text: "#f9f6f2" },
            512: { bg: "#edc850", text: "#f9f6f2" },
            1024: { bg: "#edc53f", text: "#f9f6f2" },
            2048: { bg: "#edc22e", text: "#f9f6f2" },
            4096: { bg: "#3c3a32", text: "#f9f6f2" },
            8192: { bg: "#222222", text: "#f9f6f2" }
        };

        let gameStarted = false;
        let player = {
            id: playerId,
            name: '',
            isAI: false,
            body: [{ x: Math.random() * (MAP_SIZE - 400) + 200, y: Math.random() * (MAP_SIZE - 400) + 200, value: 2 }],
            angle: 0,
            score: 0,
            kills: 0,
            color: '#edc22e',
            shieldUntil: Date.now() + SHIELD_DURATION,
            lastMoved: Date.now()
        };

        let remotePlayers = {}; 
        let aiSnakes = [];
        let foods = [];
        let historyLeaderboard = {};
        let gameOver = false;
        let playerRef = null;

        // 排行榜顯示狀態控制
        let currentLbTimeMode = 'live'; // 'live' | 'history'
        let currentLbTypeMode = 'score'; // 'score' | 'kills'

        function isHost() {
            const allIds = [playerId, ...Object.keys(remotePlayers)].sort();
            return allIds[0] === playerId;
        }

        // 排行榜 UI 事件綁定
        const leaderboardContainer = document.getElementById("leaderboard-container");
        const toggleBtn = document.getElementById("toggle-leaderboard");
        toggleBtn.addEventListener("click", () => {
            leaderboardContainer.classList.toggle("collapsed");
            toggleBtn.innerText = leaderboardContainer.classList.contains("collapsed") ? "展開" : "隱藏";
        });

        document.querySelectorAll('.lb-tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                const group = e.target.getAttribute('data-group');
                const val = e.target.getAttribute('data-val');
                
                // 設為 active
                document.querySelectorAll(`.lb-tab[data-group="${group}"]`).forEach(t => t.classList.remove('active'));
                e.target.classList.add('active');

                if (group === 'time') currentLbTimeMode = val;
                if (group === 'type') currentLbTypeMode = val;

                updateLeaderboard();
            });
        });

        // 啟動選單設定
        const startOverlay = document.getElementById("start-overlay");
        const nameInput = document.getElementById("player-name-input");
        const colorInput = document.getElementById("player-color-input");
        const startBtn = document.getElementById("start-game-btn");

        nameInput.value = '玩家_' + Math.floor(1000 + Math.random() * 9000);

        startBtn.addEventListener("click", () => {
            player.name = nameInput.value.trim() || '無名蛇';
            player.color = colorInput.value;
            player.shieldUntil = Date.now() + SHIELD_DURATION;
            player.lastMoved = Date.now();

            playerRef = ref(db, 'snakes/' + playerId);
            onDisconnect(playerRef).remove();

            startOverlay.style.display = "none";
            gameStarted = true;
            requestAnimationFrame(gameLoop);
        });

        // 監聽所有線上玩家
        const snakesRef = ref(db, 'snakes');
        onValue(snakesRef, (snapshot) => {
            const data = snapshot.val() || {};
            const now = Date.now();
            remotePlayers = {}; 
            for (let id in data) {
                if (id !== playerId) {
                    const rp = data[id];
                    if (rp.lastUpdated && now - rp.lastUpdated > AFK_TIMEOUT) {
                        remove(ref(db, 'snakes/' + id));
                    } else {
                        remotePlayers[id] = rp;
                    }
                }
            }
        });

        // 監聽歷史最高排行榜
        const historyRef = ref(db, 'historyLeaderboard');
        onValue(historyRef, (snapshot) => {
            historyLeaderboard = snapshot.val() || {};
            updateLeaderboard();
        });

        // 監聽 AI 蛇資料
        const aiRef = ref(db, 'aiSnakes');
        onValue(aiRef, (snapshot) => {
            if (!isHost()) {
                const data = snapshot.val();
                aiSnakes = data ? (Array.isArray(data) ? data : Object.values(data)) : [];
            }
        });

        for (let i = 0; i < FOOD_COUNT; i++) foods.push(generateFood());
        for (let i = 0; i < AI_COUNT; i++) aiSnakes.push(generateAISnake(i));

        function generateFood() {
            const possibleValues = [2, 4, 8, 16, 32, 64, 128];
            return {
                x: Math.random() * (MAP_SIZE - 300) + 150,
                y: Math.random() * (MAP_SIZE - 300) + 150,
                value: possibleValues[Math.floor(Math.random() * possibleValues.length)]
            };
        }

        function generateAISnake(id) {
            const startX = Math.random() * (MAP_SIZE - 400) + 200;
            const startY = Math.random() * (MAP_SIZE - 400) + 200;
            const baseValues = [2, 4, 8, 16, 32, 64];
            const startVal = baseValues[Math.floor(Math.random() * baseValues.length)];

            return {
                id: 'ai_' + id,
                name: 'AI-蛇王 ' + (id + 1),
                isAI: true,
                body: [
                    { x: startX, y: startY, value: startVal },
                    { x: startX - BODY_SPACING, y: startY, value: Math.max(2, Math.floor(startVal / 2)) }
                ],
                angle: Math.random() * Math.PI * 2,
                score: 0,
                kills: 0,
                color: `hsl(${Math.random() * 360}, 60%, 50%)`,
                shieldUntil: Date.now() + SHIELD_DURATION,
                lastMoved: Date.now()
            };
        }

        function showKillAnnouncement(killerName, victimName) {
            const msg = document.createElement("div");
            msg.className = "kill-msg";
            msg.innerHTML = `<span class="killer">⚔️ ${killerName}</span> 擊殺了 <span class="victim">${victimName}</span>`;
            killFeedContainer.appendChild(msg);

            setTimeout(() => {
                msg.style.transition = "opacity 0.5s ease";
                msg.style.opacity = "0";
                setTimeout(() => msg.remove(), 500);
            }, 3000);
        }

        // 更新歷史紀錄至 Firebase (若破紀錄)
        function checkAndUpdateHistoryScore(snake) {
            if (!snake.name || snake.isAI) return;
            const recordRef = ref(db, 'historyLeaderboard/' + snake.id);
            runTransaction(recordRef, (currentData) => {
                if (!currentData) {
                    return { name: snake.name, score: snake.score || 0, kills: snake.kills || 0 };
                } else {
                    return {
                        name: snake.name,
                        score: Math.max(currentData.score || 0, snake.score || 0),
                        kills: Math.max(currentData.kills || 0, snake.kills || 0)
                    };
                }
            });
        }

        // 控制邏輯
        const joyBase = document.getElementById("joystick-base");
        const joyStick = document.getElementById("joystick-stick");
        let joyActive = false;
        let joyCenter = { x: 0, y: 0 };

        function handleJoystickStart(e) {
            joyActive = true;
            const rect = joyBase.getBoundingClientRect();
            joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            handleJoystickMove(e);
        }

        function handleJoystickMove(e) {
            if (!joyActive) return;
            const touch = e.touches ? e.touches[0] : e;
            const dx = touch.clientX - joyCenter.x;
            const dy = touch.clientY - joyCenter.y;
            const dist = Math.min(Math.hypot(dx, dy), 45);
            player.angle = Math.atan2(dy, dx);
            joyStick.style.transform = `translate(${Math.cos(player.angle) * dist}px, ${Math.sin(player.angle) * dist}px)`;
        }

        function handleJoystickEnd() {
            joyActive = false;
            joyStick.style.transform = `translate(0px, 0px)`;
        }

        joyBase.addEventListener("touchstart", handleJoystickStart, { passive: false });
        window.addEventListener("touchmove", handleJoystickMove, { passive: false });
        window.addEventListener("touchend", handleJoystickEnd);
        joyBase.addEventListener("mousedown", handleJoystickStart);
        window.addEventListener("mousemove", handleJoystickMove);
        window.addEventListener("mouseup", handleJoystickEnd);

        const keys = {};
        window.addEventListener("keydown", e => keys[e.key] = true);
        window.addEventListener("keyup", e => keys[e.key] = false);

        function processKeyboardInput() {
            let kx = 0, ky = 0;
            if (keys["ArrowUp"] || keys["w"] || keys["W"]) ky -= 1;
            if (keys["ArrowDown"] || keys["s"] || keys["S"]) ky += 1;
            if (keys["ArrowLeft"] || keys["a"] || keys["A"]) kx -= 1;
            if (keys["ArrowRight"] || keys["d"] || keys["D"]) kx += 1;

            if (kx !== 0 || ky !== 0) player.angle = Math.atan2(ky, kx);
        }

        function reorderAndMergeSnake(snakeObj) {
            let values = snakeObj.body.map(seg => seg.value).sort((a, b) => b - a);
            let mergedValues = [];
            let i = 0;
            while (i < values.length) {
                if (i < values.length - 1 && values[i] === values[i + 1]) {
                    let newVal = values[i] * 2;
                    mergedValues.push(newVal);
                    snakeObj.score += newVal;
                    if (snakeObj.id === playerId) scoreDisplay.innerText = snakeObj.score;
                    i += 2;
                } else {
                    mergedValues.push(values[i]);
                    i++;
                }
            }

            snakeObj.body = snakeObj.body.slice(0, mergedValues.length);
            for (let k = 0; k < mergedValues.length; k++) {
                snakeObj.body[k].value = mergedValues[k];
            }
        }

        function updateAISnake(ai) {
            const head = ai.body[0];
            let target = null;
            let minDist = Infinity;

            foods.forEach(f => {
                // AI 優先尋找 <= 自己頭部分數的食物吃
                if (f.value <= head.value) {
                    const d = Math.hypot(head.x - f.x, head.y - f.y);
                    if (d < minDist) {
                        minDist = d;
                        target = f;
                    }
                }
            });

            let avoidAngle = null;
            const margin = 150;
            if (head.x < margin) avoidAngle = 0;
            else if (head.x > MAP_SIZE - margin) avoidAngle = Math.PI;
            else if (head.y < margin) avoidAngle = Math.PI / 2;
            else if (head.y > MAP_SIZE - margin) avoidAngle = -Math.PI / 2;

            if (avoidAngle !== null) {
                ai.angle = avoidAngle;
            } else if (target) {
                ai.angle = Math.atan2(target.y - head.y, target.x - head.x);
            }
        }

        function moveSnake(snakeObj) {
            const head = snakeObj.body[0];
            let nextX = head.x + Math.cos(snakeObj.angle) * SPEED;
            let nextY = head.y + Math.sin(snakeObj.angle) * SPEED;

            if (Math.abs(nextX - head.x) > 0.01 || Math.abs(nextY - head.y) > 0.01) {
                snakeObj.lastMoved = Date.now();
            }

            if (nextX < BLOCK_SIZE / 2 || nextX > MAP_SIZE - BLOCK_SIZE / 2 ||
                nextY < BLOCK_SIZE / 2 || nextY > MAP_SIZE - BLOCK_SIZE / 2) {
                return false;
            }

            head.x = nextX;
            head.y = nextY;

            for (let i = 1; i < snakeObj.body.length; i++) {
                const prev = snakeObj.body[i - 1];
                const curr = snakeObj.body[i];
                const dx = prev.x - curr.x;
                const dy = prev.y - curr.y;
                const dist = Math.hypot(dx, dy);

                if (dist > BODY_SPACING) {
                    const angle = Math.atan2(dy, dx);
                    curr.x = prev.x - Math.cos(angle) * BODY_SPACING;
                    curr.y = prev.y - Math.sin(angle) * BODY_SPACING;
                }
            }
            return true;
        }

        function killSnake(snakeObj) {
            snakeObj.body.forEach(seg => {
                foods.push({
                    x: seg.x + (Math.random() - 0.5) * 40,
                    y: seg.y + (Math.random() - 0.5) * 40,
                    value: seg.value
                });
            });
        }

        function updateLeaderboard() {
            let listData = [];

            if (currentLbTimeMode === 'live') {
                // 即時排行榜
                const allSnakes = [player, ...Object.values(remotePlayers), ...aiSnakes];
                listData = allSnakes.map(s => ({
                    id: s.id,
                    name: s.name,
                    score: s.score || 0,
                    kills: s.kills || 0,
                    isAI: !!s.isAI
                }));
            } else {
                // 歷史排行榜 (從 Firebase 取得)
                listData = Object.keys(historyLeaderboard).map(key => ({
                    id: key,
                    name: historyLeaderboard[key].name || '未知',
                    score: historyLeaderboard[key].score || 0,
                    kills: historyLeaderboard[key].kills || 0,
                    isAI: false
                }));
            }

            // 排序 (分數或擊殺數)
            if (currentLbTypeMode === 'score') {
                listData.sort((a, b) => b.score - a.score);
            } else {
                listData.sort((a, b) => b.kills - a.kills);
            }

            leaderboardList.innerHTML = '';
            const top5 = listData.slice(0, 5);

            top5.forEach((s, idx) => {
                const item = document.createElement('div');
                item.className = 'leaderboard-item' + (s.id === playerId ? ' is-player' : '');
                const tag = s.isAI ? '🤖' : '👤';
                const valText = currentLbTypeMode === 'score' ? `${s.score}分` : `${s.kills}擊殺`;
                item.innerHTML = `<span>${idx + 1}. ${tag} ${s.name}</span><span>${valText}</span>`;
                leaderboardList.appendChild(item);
            });
        }

        // 資料同步
        setInterval(() => {
            if (gameStarted && !gameOver && playerRef) {
                set(playerRef, {
                    id: player.id,
                    name: player.name,
                    body: player.body,
                    score: player.score,
                    kills: player.kills,
                    color: player.color,
                    shieldUntil: player.shieldUntil,
                    lastUpdated: Date.now()
                });

                checkAndUpdateHistoryScore(player);

                if (isHost()) {
                    set(ref(db, 'aiSnakes'), aiSnakes);
                }
            }
        }, 80);

        function update() {
            if (!gameStarted || gameOver) return;

            processKeyboardInput();

            const now = Date.now();

            if (now - player.lastMoved > AFK_TIMEOUT) {
                endGame("因閒置超過 15 秒未移動，已自動清理退出遊戲！");
                return;
            }

            const pShieldRemaining = Math.max(0, (player.shieldUntil - now) / 1000);
            if (pShieldRemaining > 0) {
                shieldTimeDisplay.innerText = pShieldRemaining.toFixed(1);
            } else {
                shieldUi.style.display = 'none';
            }

            if (!moveSnake(player)) {
                endGame("撞到地圖邊界牆壁了！");
                return;
            }

            // AI 邏輯
            if (isHost()) {
                for (let i = aiSnakes.length - 1; i >= 0; i--) {
                    const ai = aiSnakes[i];
                    updateAISnake(ai);
                    
                    if (!moveSnake(ai) || (now - ai.lastMoved > AFK_TIMEOUT)) {
                        killSnake(ai);
                        aiSnakes.splice(i, 1);
                        aiSnakes.push(generateAISnake(Math.floor(Math.random() * 1000)));
                    }
                }
            }

            const allOtherSnakes = [...Object.values(remotePlayers), ...aiSnakes];
            const head = player.body[0];
            const isShielded = now < player.shieldUntil;

            // 玩家碰撞檢測
            if (!isShielded) {
                for (let other of allOtherSnakes) {
                    if (other.body) {
                        for (let k = 0; k < other.body.length; k++) {
                            const seg = other.body[k];
                            // 修改點：只有「蛇身數字 <= 自己頭部數字」時，才會發生碰撞導致死亡！
                            // 若 seg.value > head.value，直接穿透 (碰不到)
                            if (seg.value <= head.value) {
                                if (Math.hypot(head.x - seg.x, head.y - seg.y) < BLOCK_SIZE * 0.75) {
                                    showKillAnnouncement(other.name, player.name);
                                    other.kills = (other.kills || 0) + 1;
                                    endGame(`撞到了【${other.name}】小於等於你分數的身體！`);
                                    return;
                                }
                            }
                        }
                    }
                }
            }

            // AI 蛇碰撞檢測 (僅 Host 計算)
            if (isHost()) {
                for (let i = aiSnakes.length - 1; i >= 0; i--) {
                    const ai = aiSnakes[i];
                    if (now < ai.shieldUntil) continue;

                    const aiHead = ai.body[0];
                    const targetSnakes = [player, ...Object.values(remotePlayers), ...aiSnakes.filter(s => s.id !== ai.id)];

                    let died = false;
                    for (let other of targetSnakes) {
                        if (died) break;
                        if (other.body) {
                            for (let k = 0; k < other.body.length; k++) {
                                const seg = other.body[k];
                                // 修改點：AI 同樣只有碰到 <= 自己頭部數字的身體時才會撞死
                                if (seg.value <= aiHead.value) {
                                    if (Math.hypot(aiHead.x - seg.x, aiHead.y - seg.y) < BLOCK_SIZE * 0.75) {
                                        showKillAnnouncement(other.name, ai.name);
                                        if (other.id === playerId) {
                                            player.kills++;
                                            killsDisplay.innerText = player.kills;
                                        } else {
                                            other.kills = (other.kills || 0) + 1;
                                        }
                                        killSnake(ai);
                                        aiSnakes.splice(i, 1);
                                        aiSnakes.push(generateAISnake(Math.floor(Math.random() * 1000)));
                                        died = true;
                                        break;
                                    }
                                }
                            }
                        }
                    }
                }
            }

            // 吃食物與吃掉比自己小的方塊邏輯
            const activeSnakesToEat = isHost() ? [player, ...aiSnakes] : [player];
            activeSnakesToEat.forEach(s => {
                const sHead = s.body[0];
                for (let i = foods.length - 1; i >= 0; i--) {
                    const f = foods[i];
                    // 關鍵修正：當食物 value <= 頭部 value 時才能吃到，否則直接穿透！
                    if (f.value <= sHead.value) {
                        if (Math.hypot(sHead.x - f.x, sHead.y - f.y) < BLOCK_SIZE * 0.8) {
                            const last = s.body[s.body.length - 1];
                            s.body.push({ x: last.x, y: last.y, value: f.value });
                            reorderAndMergeSnake(s);

                            foods.splice(i, 1);
                            foods.push(generateFood());
                        }
                    }
                }
            });

            updateLeaderboard();
        }

        function draw() {
            ctx.fillStyle = "#1e1e1e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!gameStarted) return;

            const head = player.body[0];

            ctx.save();
            ctx.translate(canvas.width / 2 - head.x, canvas.height / 2 - head.y);

            ctx.fillStyle = "#bbada0";
            ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);

            ctx.strokeStyle = "#ff4444";
            ctx.lineWidth = 12;
            ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

            ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
            ctx.lineWidth = 2;
            for (let x = 0; x <= MAP_SIZE; x += 100) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
            }
            for (let y = 0; y <= MAP_SIZE; y += 100) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke();
            }

            // 繪製食物：若食物數字 > 玩家頭部數字，繪製半透明效果表示「穿透無效/碰不到」
            foods.forEach(f => {
                const canEat = f.value <= head.value;
                drawBlock(f.x, f.y, f.value, false, "#ffffff", "", false, canEat ? 1.0 : 0.4);
            });

            // 繪製 AI 蛇
            aiSnakes.forEach(ai => {
                if (ai.body && ai.body.length > 0) {
                    const isShielded = Date.now() < ai.shieldUntil;
                    for (let i = ai.body.length - 1; i >= 0; i--) {
                        // 若該身體區塊數字 > 玩家頭部，顯示半透明 (表示玩家可穿透它)
                        const isPassable = ai.body[i].value > head.value;
                        drawBlock(ai.body[i].x, ai.body[i].y, ai.body[i].value, i === 0, ai.color, ai.name, isShielded, isPassable ? 0.4 : 1.0);
                    }
                }
            });

            // 繪製其他玩家
            Object.values(remotePlayers).forEach(rp => {
                if (rp.body && rp.body.length > 0) {
                    const isShielded = Date.now() < (rp.shieldUntil || 0);
                    for (let i = rp.body.length - 1; i >= 0; i--) {
                        const isPassable = rp.body[i].value > head.value;
                        drawBlock(rp.body[i].x, rp.body[i].y, rp.body[i].value, i === 0, rp.color || "#00ffff", rp.name, isShielded, isPassable ? 0.4 : 1.0);
                    }
                }
            });

            // 繪製本地玩家自己
            const isPlayerShielded = Date.now() < player.shieldUntil;
            for (let i = player.body.length - 1; i >= 0; i--) {
                drawBlock(player.body[i].x, player.body[i].y, player.body[i].value, i === 0, player.color, player.name, isPlayerShielded, 1.0);
            }

            ctx.restore();
        }

        function drawBlock(x, y, value, isHead = false, headColor = "#ffffff", name = "", isShielded = false, opacity = 1.0) {
            const style = colors[value] || { bg: "#3c3a32", text: "#f9f6f2" };
            const half = BLOCK_SIZE / 2;

            ctx.save();
            ctx.globalAlpha = opacity;
            ctx.translate(x, y);

            if (isHead && isShielded) {
                ctx.beginPath();
                ctx.arc(0, 0, BLOCK_SIZE * 0.9, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 215, 0, 0.3)";
                ctx.fill();
                ctx.strokeStyle = "#ffd700";
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            ctx.fillStyle = style.bg;
            ctx.shadowColor = "rgba(0,0,0,0.25)";
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.roundRect(-half, -half, BLOCK_SIZE, BLOCK_SIZE, 8);
            ctx.fill();

            if (isHead) {
                ctx.strokeStyle = headColor;
                ctx.lineWidth = 4;
                ctx.stroke();

                if (name) {
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 12px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(name, 0, -half - 8);
                }
            }

            ctx.fillStyle = style.text;
            ctx.font = "bold 16px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowBlur = 0;
            ctx.fillText(value, 0, 0);

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            if (!gameOver && gameStarted) {
                requestAnimationFrame(gameLoop);
            }
        }

        function endGame(msg) {
            gameOver = true;
            checkAndUpdateHistoryScore(player);
            if (playerRef) remove(playerRef);
            setTimeout(() => {                alert(`${msg}\n最終得分: ${player.score}\n總擊殺數: ${player.kills}`);
                location.reload();
            }, 100);
        }
    </script>
</head>
<body>
    <link rel="stylesheet" href="menu.css">
    <div id="nav_bar"></div>
    <script src="menu.js"></script>

    <!-- 進入遊戲設定視窗 -->
    <div id="start-overlay">
        <div class="start-card">
            <h2>遊戲設定</h2>
            <div class="input-group">
                <label for="player-name-input">玩家暱稱</label>
                <input type="text" id="player-name-input" maxlength="10" placeholder="輸入你的暱稱">
            </div>
            <div class="input-group">
                <label for="player-color-input">外框顏色</label>
                <div class="color-picker-container">
                    <input type="color" id="player-color-input" value="#edc22e">
                    <span style="font-size: 13px; color: #aaa;">點擊選擇蛇頭顏色</span>
                </div>
            </div>
            <button class="start-btn" id="start-game-btn">開始遊戲</button>
        </div>
    </div>

    <!-- UI 計分板 -->
    <div class="ui-container">
        <h1>2048 貪吃蛇</h1>
        <div class="score-container">分數: <span id="score">0</span> | 擊殺: <span id="kills">0</span></div>
        <div id="shield-ui" class="shield-status">🛡️ 防護罩倒數: <span id="shield-time">3.0</span>s</div>
    </div>

    <!-- 擊殺播報容器 -->
    <div class="kill-feed-container" id="kill-feed"></div>

    <!-- 升級版排行榜 (支援 即時/歷史最高 & SCORE/KILL 多維度切換) -->
    <div class="leaderboard-container" id="leaderboard-container">
        <div class="leaderboard-header">
            <span class="leaderboard-title">🏆 英雄排行榜</span>
            <button class="toggle-btn" id="toggle-leaderboard">隱藏</button>
        </div>
        
        <div class="lb-controls">
            <!-- 時間維度切換 -->
            <div class="lb-tab-group">
                <div class="lb-tab active" data-group="time" data-val="live">即時戰況</div>
                <div class="lb-tab" data-group="time" data-val="history">歷史最高</div>
            </div>
            <!-- 指標維度切換 -->
            <div class="lb-tab-group">
                <div class="lb-tab active" data-group="type" data-val="score">分數 SCORE</div>
                <div class="lb-tab" data-group="type" data-val="kills">擊殺 KILL</div>
            </div>
        </div>

        <div class="leaderboard-list" id="leaderboard-list"></div>
    </div>

    <div id="joystick-base">
        <div id="joystick-stick"></div>
    </div>

    <canvas id="gameCanvas"></canvas>
</body>
</html>
