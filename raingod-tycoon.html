<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雨神大亨 | Raingod</title>
    <style>
        * { touch-action: none; user-select: none; box-sizing: border-box; }
        body { margin: 0; background: #020617; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        .top-bar {
            position: absolute !important;
            top: 110px !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
            padding: 8px 20px;
            border-radius: 30px;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            display: flex;
            gap: 16px;
            align-items: center;
            white-space: nowrap;
            z-index: 999 !important;
        }
        .hud-item { font-size: 13px; font-weight: bold; color: #f8fafc; }
        .money { color: #4ade80; font-size: 16px; font-weight: 900; }
        .dark-matter { color: #c084fc; font-size: 13px; }

        .skill-bar {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; pointer-events: auto;
        }
        .skill-btn {
            background: rgba(15, 23, 42, 0.9); border: 1px solid #38bdf8; color: #fff;
            padding: 8px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; transition: all 0.2s;
        }
        .skill-btn:hover:not(:disabled) { background: #0284c7; }
        .skill-btn:disabled { opacity: 0.4; border-color: #475569; cursor: not-allowed; }

        .panel { 
            position: absolute; bottom: 15px; right: 15px; 
            width: 340px; max-height: 82vh; overflow-y: auto;
            background: rgba(15, 23, 42, 0.95); border: 1px solid #334155; border-radius: 12px;
            pointer-events: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px);
        }
        .panel::-webkit-scrollbar { width: 4px; }
        .panel::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 4px; }

        .tabs { display: flex; gap: 4px; margin-bottom: 4px; flex-wrap: wrap; }
        .tab-btn { 
            flex: 1 0 30%; background: #1e293b; color: #94a3b8; border: none; padding: 6px 2px; 
            font-size: 10px; font-weight: bold; border-radius: 6px; cursor: pointer;
        }
        .tab-btn.active { background: #0284c7; color: #fff; }

        .btn { 
            background: linear-gradient(135deg, #1e293b, #0f172a); color: #fff; border: 1px solid #38bdf8; 
            padding: 8px 10px; font-weight: bold; font-size: 11px; border-radius: 8px; cursor: pointer; 
            display: flex; justify-content: space-between; align-items: center; transition: all 0.2s;
        }
        .btn:hover:not(:disabled) { background: linear-gradient(135deg, #0284c7, #0369a1); border-color: #38bdf8; }
        .btn:disabled { opacity: 0.35; border-color: #475569; cursor: not-allowed; }
        .rebirth-btn { background: linear-gradient(135deg, #7e22ce, #581c87); border-color: #c084fc; }

        .quest-box {
            background: rgba(30, 41, 59, 0.6); border: 1px dashed #38bdf8; padding: 6px 8px;
            border-radius: 6px; font-size: 10px; color: #e2e8f0; margin-bottom: 2px;
        }
        
        #tycoon-leaderboard-button { position: absolute; top: 160px; right: 15px; z-index: 20; pointer-events: auto; padding: 9px 14px; border: 1px solid #38bdf8; border-radius: 20px; color: #fff; background: rgba(15,23,42,0.9); font-weight: bold; cursor: pointer; }
        #tycoon-leaderboard { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(2,6,23,0.94); color: #fff; }
        .tycoon-leaderboard-card { width: min(520px, 100%); max-height: 80vh; overflow-y: auto; padding: 20px; border: 1px solid #38bdf8; border-radius: 16px; background: #0b1020; }
        .tycoon-leaderboard-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 4px; border-bottom: 1px solid #26334a; }
        .mobile-shop-toggle, .mobile-panel-close { display: none; }

        /* 世界地圖 UI */
        #view-toggle {
            position: absolute; top: 160px; left: 15px; z-index: 30; pointer-events: auto;
            padding: 10px 18px; border: 2px solid #f59e0b; border-radius: 24px;
            background: linear-gradient(135deg, #b45309, #78350f); color: #fff;
            font-weight: 900; font-size: 13px; cursor: pointer; box-shadow: 0 0 20px rgba(245,158,11,0.4);
        }
        #world-ui {
            position: absolute; inset: 0; pointer-events: none; z-index: 20; display: none;
        }
        #world-ui.active { display: block; }
        .world-hud {
            position: absolute; top: 110px; left: 50%; transform: translateX(-50%);
            background: rgba(15,23,42,0.92); border: 1px solid #f59e0b; border-radius: 16px;
            padding: 8px 18px; pointer-events: auto; display: flex; gap: 16px; align-items: center;
            backdrop-filter: blur(8px); font-size: 12px; font-weight: bold; color: #fcd34d;
            white-space: nowrap;
        }
        .world-ctrl {
            position: absolute; bottom: 15px; left: 15px; pointer-events: auto;
            display: flex; flex-direction: column; gap: 6px;
        }
        .world-ctrl button {
            width: 46px; height: 46px; border-radius: 12px; border: 1px solid #38bdf8;
            background: rgba(15,23,42,0.92); color: #fff; font-weight: bold; font-size: 18px;
            cursor: pointer;
        }
        #territory-panel {
            position: absolute; bottom: 15px; right: 15px; width: 300px; max-height: 70vh;
            overflow-y: auto; background: rgba(15,23,42,0.96); border: 1px solid #f59e0b;
            border-radius: 12px; padding: 14px; pointer-events: auto; color: #fff;
            display: none; flex-direction: column; gap: 8px;
        }
        #territory-panel.active { display: flex; }
        #territory-panel h3 { margin: 0; color: #fcd34d; font-size: 15px; }
        .terr-row { display: flex; justify-content: space-between; font-size: 12px; color: #cbd5e1; }
        .terr-bar { height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; }
        .terr-bar > div { height: 100%; background: linear-gradient(90deg, #ef4444, #f59e0b); transition: width 0.3s; }

        /* 戰鬥畫面特效 */
        #battle-overlay {
            position: fixed; inset: 0; z-index: 1500; display: none;
            pointer-events: none;
        }
        #battle-overlay.active { display: block; }
        .battle-flash {
            position: absolute; inset: 0;
            background: radial-gradient(circle, rgba(239,68,68,0.3) 0%, transparent 70%);
            animation: battleFlash 0.6s ease-out forwards;
        }
        @keyframes battleFlash {
            0% { opacity: 0.8; transform: scale(0.8); }
            100% { opacity: 0; transform: scale(1.5); }
        }
        .battle-text {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 36px; font-weight: 900; color: #fbbf24;
            text-shadow: 0 0 20px #f59e0b, 0 0 40px #ef4444;
            animation: battleTextAnim 1.2s ease-out forwards;
            white-space: nowrap;
        }
        @keyframes battleTextAnim {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
            30% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5) translateY(-30px); }
        }

        @media (max-width: 700px), (max-height: 500px) and (pointer: coarse) {
            .nav-content { gap: 6px; padding: 0 8px !important; }
            .brand { flex: 0 0 auto; white-space: nowrap; }
            .nav-links {
                flex: 1; min-width: 0; justify-content: space-evenly; gap: 0 !important; margin-left: 4px !important;
            }
            .nav-item { padding: 6px 3px !important; font-size: 11px !important; white-space: nowrap; }
            .login-btn { flex: 0 0 auto; padding: 6px 8px !important; white-space: nowrap; }

            .top-bar {
                top: calc(60px + env(safe-area-inset-top)) !important; left: 8px !important;
                width: calc(100% - 16px) !important; transform: none !important;
                display: grid; grid-template-columns: 1fr 1fr; gap: 5px 8px;
                padding: 7px 10px; border-radius: 12px; white-space: normal;
            }
            .hud-item { font-size: 11px; }
            .money { font-size: 14px; }
            .dark-matter { font-size: 11px; }

            #tycoon-leaderboard-button { top: 132px; right: 8px; max-width: 46%; padding: 8px 10px; font-size: 11px; }
            #view-toggle { top: 132px; left: 8px; padding: 8px 12px; font-size: 11px; }

            .skill-bar {
                bottom: max(8px, env(safe-area-inset-bottom));
                left: 8px; right: 8px; transform: none; gap: 5px;
            }
            .skill-btn { flex: 1; min-width: 0; padding: 7px 4px; font-size: 9px; }

            .panel {
                display: none; left: 0; right: 0; bottom: 0; width: 100%; max-height: 52dvh;
                padding: 10px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
                border-radius: 14px 14px 0 0; touch-action: pan-y; -webkit-overflow-scrolling: touch;
            }
            #ui.shop-open .panel { display: flex; }
            #ui.shop-open .skill-bar { display: none; }
            .mobile-panel-close {
                display: block; align-self: flex-end; padding: 7px 12px; border: 1px solid #64748b;
                border-radius: 8px; background: #1e293b; color: #fff; font-weight: bold; touch-action: manipulation;
            }
            .mobile-shop-toggle {
                display: block; position: absolute; right: 10px; bottom: calc(62px + env(safe-area-inset-bottom));
                z-index: 15; padding: 9px 13px; border: 1px solid #38bdf8; border-radius: 20px;
                background: rgba(15, 23, 42, 0.95); color: #fff; font-weight: bold;
                pointer-events: auto; touch-action: manipulation;
            }
            #ui.shop-open .mobile-shop-toggle { display: none; }

            .tab-btn { min-height: 38px; font-size: 10px; }
            .btn { min-height: 40px; font-size: 11px; touch-action: manipulation; }
            #tycoon-leaderboard { padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom)); }
            .tycoon-leaderboard-card { max-height: 85dvh; padding: 14px; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
            .tycoon-leaderboard-row { flex-direction: column; gap: 4px; }

            .world-hud {
                top: calc(60px + env(safe-area-inset-top)) !important; left: 8px !important;
                right: 8px !important; transform: none !important; width: auto !important;
                font-size: 10px; gap: 8px; padding: 7px 10px; white-space: normal;
                flex-wrap: wrap; justify-content: center;
            }
            #territory-panel {
                left: 8px; right: 8px; width: auto;
                top: calc(120px + env(safe-area-inset-top));
                bottom: auto; max-height: 38vh;
            }
            .world-ctrl { bottom: calc(80px + env(safe-area-inset-bottom)); }
            .world-ctrl button { width: 40px; height: 40px; font-size: 16px; }
            .battle-text { font-size: 22px; }
        }
    </style>
</head>
<body>
    <link rel="stylesheet" href="menu.css">
    <div id="nav_bar"></div>
    <script src="menu.js"></script>
    <canvas id="c"></canvas>
    <div id="ui">
        <div class="top-bar">
            <div class="hud-item">$<span id="m" class="money">0</span></div>
            <div class="hud-item dark-matter">🌌 暗物質: <span id="dm">0</span></div>
            <div class="hud-item" style="color: #ef4444;">⚔️ 第 <span id="waveNum">1</span> 波 (剩餘 <span id="enemyCount">0</span>)</div>
            <div class="hud-item" style="color:#4ade80;">🛡️ 領地 <span id="territoryCount">0</span>/<span id="territoryMax">12</span></div>
        </div>

        <div class="skill-bar">
            <button class="skill-btn" onclick="useSkill(1)">
                <span>⚡ 超頻過載</span><span id="cd1" style="font-size:9px; color:#f59e0b;">就緒</span>
            </button>
            <button class="skill-btn" onclick="useSkill(2)">
                <span>💥 軌道砲轟炸</span><span id="cd2" style="font-size:9px; color:#f59e0b;">就緒</span>
            </button>
            <button class="skill-btn" onclick="useSkill(3)">
                <span>🪖 軍隊衝鋒</span><span id="cd3" style="font-size:9px; color:#f59e0b;">就緒</span>
            </button>
        </div>

        <div class="panel" id="tycoon-panel">
            <button class="mobile-panel-close" type="button" onclick="toggleTycoonShop(false)">收起商店 ▲</button>
            <div class="quest-box">
                🎯 任務：<span id="questText">載入中...</span> (<span id="questProg">0/0</span>)
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('tab-turret')">⚔️ 武器塔</button>
                <button class="tab-btn" onclick="switchTab('tab-prod')">🏭 工廠解鎖</button>
                <button class="tab-btn" onclick="switchTab('tab-upg')">⚙️ 基礎升級</button>
                <button class="tab-btn" onclick="switchTab('tab-army')">🪖 軍隊</button>
                <button class="tab-btn" onclick="switchTab('tab-tech')">🌌 暗天賦</button>
            </div>

            <div id="tab-turret">
                <button class="btn" onclick="buildTurret('gatling')">
                    <span>🔫 機槍塔</span><span style="color:#4ade80" id="costGatling">$1,000</span>
                </button>
                <button class="btn" onclick="buildTurret('laser')">
                    <span>⚡ 雷射塔</span><span style="color:#4ade80" id="costLaser">$5,000</span>
                </button>
                <button class="btn" onclick="buildTurret('mortar')">
                    <span>💥 迫擊砲塔</span><span style="color:#4ade80" id="costMortar">$20,000</span>
                </button>
                <button class="btn" onclick="buildTurret('frost')">
                    <span>❄️ 緩慢冰凍塔</span><span style="color:#4ade80" id="costFrost">$50,000</span>
                </button>
                <button class="btn" onclick="buildTurret('blackhole')">
                    <span>🌌 暗物質黑洞塔</span><span style="color:#c084fc" id="costBlackhole">$200,000</span>
                </button>
                <button class="btn" style="background: linear-gradient(135deg, #b91c1c, #991b1b); border-color: #f87171; margin-top:4px;" onclick="triggerNextWave()">
                    <span>⚠️️ 立即召喚下一波敵人</span>
                </button>
            </div>

            <div id="tab-prod" style="display:none;">
                <button class="btn" onclick="unlockTier(2)">
                    <span>🔓 矽晶/晶片廠</span><span style="color:#4ade80">$2,500</span>
                </button>
                <button class="btn" onclick="unlockTier(3)">
                    <span>🔓 鈾能/電池中心</span><span style="color:#4ade80">$25,000</span>
                </button>
                <button class="btn" onclick="unlockTier(4)">
                    <span>🔓 量子合成廠</span><span style="color:#4ade80">$200,000</span>
                </button>
                <button class="btn" onclick="unlockTier(5)">
                    <span>🔓 反物質研究所</span><span style="color:#4ade80">$2,000,000</span>
                </button>
            </div>

            <div id="tab-upg" style="display:none;">
                <button class="btn" onclick="buyBot()">
                    <span>🤖 雇用運輸機兵</span><span style="color:#4ade80" id="bCost">$500</span>
                </button>
                <button class="btn" onclick="upgrade('miner')">
                    <span>⚙️ 採礦速率 Lv.<span id="minerLv">0</span></span><span style="color:#4ade80" id="mCost">$1,000</span>
                </button>
                <button class="btn" onclick="upgrade('capacity')">
                    <span>🎒 機兵容量 Lv.<span id="capLv">4</span></span><span style="color:#4ade80" id="cCost">$1,500</span>
                </button>
                <button class="btn" onclick="upgrade('playerDamage')">
                    <span>⚔️ 玩家傷害 Lv.<span id="playerDamageLv">0</span>（+25%）</span><span style="color:#4ade80" id="playerDamageCost">$1,000</span>
                </button>
                <button class="btn" onclick="upgrade('turretDamage')">
                    <span>🛡️ 防衛塔傷害 Lv.<span id="turretDamageLv">0</span>（+20%）</span><span style="color:#4ade80" id="turretDamageCost">$1,500</span>
                </button>
            </div>

            <div id="tab-army" style="display:none;">
                <div class="quest-box" style="border-color:#f59e0b; color:#fcd34d;">
                    🪖 切換到世界地圖，用鍵盤/搖桿移動指揮官，點擊領地發起進攻！
                </div>
                <button class="btn" onclick="recruitSoldier()">
                    <span>🪖 招募士兵 (現有 <span id="soldierCount">0</span>)</span><span style="color:#4ade80" id="soldierCost">$800</span>
                </button>
                <button class="btn" onclick="recruitTank()">
                    <span>🚀 生產坦克 (現有 <span id="tankCount">0</span>)</span><span style="color:#4ade80" id="tankCost">$5,000</span>
                </button>
                <button class="btn" onclick="switchView('world')" style="background: linear-gradient(135deg, #b45309, #78350f); border-color: #fbbf24;">
                    <span>🌍 前往世界地圖</span>
                </button>
                <div class="quest-box" style="margin-top:4px;">
                    總戰力：<span id="armyPower" style="color:#fbbf24;">0</span> ｜ 已佔領：<span id="ownedTerritories">無</span>
                </div>
            </div>

            <div id="tab-tech" style="display:none;">
                <button class="btn rebirth-btn" onclick="buyTalent('dmg')">
                    <span>🧬 基因傷害 +20%</span><span style="color:#c084fc" id="tDmgCost">5 DM</span>
                </button>
                <button class="btn rebirth-btn" onclick="buyTalent('speed')">
                    <span>🤖 自動化機兵速度 +15%</span><span style="color:#c084fc" id="tSpdCost">5 DM</span>
                </button>
                <button class="btn rebirth-btn" onclick="buyTalent('army')">
                    <span>🪖 軍隊攻擊力 +30%</span><span style="color:#c084fc" id="tArmyCost">5 DM</span>
                </button>
                <button class="btn rebirth-btn" style="margin-top:8px;" onclick="triggerRebirth()">
                    <span>🌌 暗物質量子轉生</span><span style="color:#c084fc" id="rebirthGain">+0 DM</span>
                </button>
            </div>
        </div>
        <button class="mobile-shop-toggle" type="button" aria-controls="tycoon-panel" aria-expanded="false" onclick="toggleTycoonShop()">🛠️ 建造 / 升級</button>
    </div>

    <button id="view-toggle" onclick="switchView('world')">🌍 世界地圖</button>

    <div id="world-ui">
        <div class="world-hud">
            <span>🌍 世界地圖</span>
            <span>🪖 <span id="wSoldiers">0</span> 兵 · <span id="wTanks">0</span> 坦克</span>
            <span>⚔️ <span id="wPower" style="color:#fbbf24;">0</span> 戰力</span>
            <span>🛡️ <span id="wOwned">0</span>/<span id="wTotal">12</span> 領地</span>
            <span style="font-size:10px; color:#94a3b8;">⌨️ WASD / 方向鍵 · 📱 右側搖桿</span>
        </div>
        <div class="world-ctrl">
            <button onclick="zoomWorld(1.2)" title="放大">＋</button>
            <button onclick="zoomWorld(1/1.2)" title="縮小">－</button>
            <button onclick="centerOnCapital()" title="回到基地">🏠</button>
            <button onclick="switchView('base')" title="返回基地" style="border-color:#4ade80;">↩</button>
        </div>
        <div id="territory-panel">
            <h3 id="terrName">選擇領地</h3>
            <div class="terr-row"><span>歸屬</span><span id="terrOwner">中立</span></div>
            <div class="terr-row"><span>守軍</span><span id="terrGarrison">0</span></div>
            <div class="terr-row"><span>每波收益</span><span id="terrIncome" style="color:#4ade80;">$0</span></div>
            <div class="terr-bar"><div id="terrBar" style="width:0%;"></div></div>
            <button class="btn" id="attackBtn" onclick="attackSelected()" style="background: linear-gradient(135deg, #b91c1c, #7f1d1d); border-color: #f87171; margin-top:6px;">
                <span>⚔️ 發起進攻</span><span id="attackCost" style="color:#fbbf24;">需要 0 戰力</span>
            </button>
            <button class="btn" onclick="closeTerritoryPanel()" style="border-color:#64748b;">關閉</button>
        </div>
    </div>

    <!-- 戰鬥畫面覆蓋層 -->
    <div id="battle-overlay"></div>

    <button id="tycoon-leaderboard-button" onclick="openTycoonLeaderboard()">🏆 登入後查看排行榜</button>
    <div id="tycoon-leaderboard">
        <div class="tycoon-leaderboard-card">
            <h2 style="color:#38bdf8; margin-top:0;">🏆 雨神大亨排行榜</h2>
            <p id="tycoon-leaderboard-status" style="color:#aaa;">請登入帳號後查看。</p>
            <div id="tycoon-leaderboard-list"></div>
            <div style="display:flex; gap:8px; justify-content:center; margin-top:14px;">
                <button class="btn" onclick="refreshTycoonLeaderboard()">重新整理</button>
                <button class="btn" onclick="closeTycoonLeaderboard()">關閉</button>
            </div>
        </div>
    </div>

    <script src="raingod-tycoon-core.js"></script>
    <script src="raingod-tycoon-ui.js"></script>
    <script src="raingod-tycoon-world.js"></script>
    <script src="raingod-tycoon-battle.js"></script>
    <script src="raingod-tycoon-loop.js"></script>
</body>
</html>
