<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raingod 登入</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #111827;
      --panel: rgba(17, 24, 39, 0.8);
      --card: rgba(15, 23, 42, 0.75);
      --line: rgba(255,255,255,0.12);
      --text: #e5eefb;
      --muted: #9fb5d8;
      --primary: #60a5fa;
      --primary-2: #8b5cf6;
      --danger: #f87171;
      --success: #34d399;
      --shadow: 0 20px 50px rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
      background: radial-gradient(circle at top, #1f3b73 0%, var(--bg1) 30%, var(--bg2) 100%);
      color: var(--text);
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(470px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .header {
      padding: 24px 24px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
    }

    .header h1 {
      margin: 0;
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      letter-spacing: 0.04em;
    }

    .header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 14px 16px 0;
    }

    .tab {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .tab.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      border-color: transparent;
      color: white;
    }

    .panel {
      display: none;
      padding: 16px 20px 20px;
    }

    .panel.active {
      display: block;
    }

    .form-group {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    label {
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: rgba(96,165,250,0.9);
      box-shadow: 0 0 0 3px rgba(96,165,250,0.15);
    }

    .submit {
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white;
      font-size: 1rem;
      font-weight: 700;
      padding: 12px 16px;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.2s ease;
    }

    .submit:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .submit.danger {
      background: linear-gradient(135deg, #ef4444, #f97316);
    }

    .notice {
      margin-top: 14px;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.92rem;
      display: none;
      border: 1px solid transparent;
    }

    .notice.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(248, 113, 113, 0.4);
      color: #fecaca;
    }

    .notice.success {
      display: block;
      background: rgba(52, 211, 153, 0.1);
      border-color: rgba(52, 211, 153, 0.4);
      color: #bbf7d0;
    }

    .help {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.87rem;
      line-height: 1.6;
    }

    .inline-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .link-btn {
      background: transparent;
      color: var(--primary);
      border: 0;
      cursor: pointer;
      padding: 0;
      font-weight: 700;
    }

    @media (max-width: 420px) {
      .tabs {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Raingod</h1>
      <p>登入、註冊與帳號重設</p>
    </div>

    <div class="tabs">
      <button class="tab active" data-panel="signin-panel">登入</button>
      <button class="tab" data-panel="signup-panel">註冊</button>
      <button class="tab" data-panel="reset-panel">重設</button>
    </div>

    <div id="signin-panel" class="panel active">
      <div class="form-group">
        <label for="signin-user">帳號</label>
        <input id="signin-user" type="text" placeholder="例如：raingod" />
      </div>
      <div class="form-group">
        <label for="signin-pass">密碼</label>
        <input id="signin-pass" type="password" placeholder="請輸入密碼" />
      </div>
      <button id="signin-btn" class="submit" type="button">登入</button>
      <div id="signin-notice" class="notice"></div>
    </div>

    <div id="signup-panel" class="panel">
      <div class="form-group">
        <label for="signup-user">新帳號</label>
        <input id="signup-user" type="text" placeholder="只能輸入英數字" />
      </div>
      <div class="form-group">
        <label for="signup-pass">密碼</label>
        <input id="signup-pass" type="password" placeholder="至少 6 碼" />
      </div>
      <div class="form-group">
        <label for="signup-pass2">確認密碼</label>
        <input id="signup-pass2" type="password" placeholder="再輸入一次" />
      </div>
      <button id="signup-btn" class="submit" type="button">註冊新帳號</button>
      <div id="signup-notice" class="notice"></div>
      <div class="help">
        每台裝置只允許綁定一個帳號。若要重新註冊，請使用「重設」分頁清掉舊帳號資料。
      </div>
    </div>

    <div id="reset-panel" class="panel">
      <div class="form-group">
        <label for="reset-user">帳號</label>
        <input id="reset-user" type="text" placeholder="例如：raingod" />
      </div>
      <div class="form-group">
        <label for="reset-pass">密碼</label>
        <input id="reset-pass" type="password" placeholder="輸入要重設的帳號密碼" />
      </div>
      <button id="reset-btn" class="submit danger" type="button">刪除此帳號並重設</button>
      <div id="reset-notice" class="notice"></div>
      <div class="help">
        這會把目前登入的帳號從 Firebase Authentication 刪除，並清除備份帳號和裝置綁定。若帳號已從 Firebase 控制台刪除，請使用相同帳號重新註冊即可。
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB6ddhbgcV0aUgezkJVr61XMrJkcFWYzxI",
      authDomain: "project-245615336743.firebaseapp.com",
      databaseURL: "https://project-161757768102958224-default-rtdb.firebaseio.com",
      projectId: "project-245615336743",
      storageBucket: "project-245615336743.firebasestorage.app",
      messagingSenderId: "245615336743",
      appId: "1:245615336743:web:5f1b46b5a74668a2ac5d02",
      measurementId: "G-067PR7PJVE"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.database();
    const ACCOUNTS_ROOT = 'raingod_accounts';
    const AUTH_BACKUP_ROOT = 'raingod_auth_backup';
    const DEVICE_REGISTRY_ROOT = 'raingod_device_registry';

    function showNotice(id, message, type) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = message;
      el.className = 'notice ' + type;
    }

    function showTab(panelId) {
      document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.panel === panelId);
      });
      document.querySelectorAll('.panel').forEach(panel => {
        panel.classList.toggle('active', panel.id === panelId);
      });
    }

    function normalizeUsername(raw) {
      return String(raw || '').trim().toLowerCase();
    }

    function makeEmail(user) {
      return `${user}@raingod.app`;
    }

    function getDeviceId() {
      let deviceId = localStorage.getItem('raingod_device_id');
      if (!deviceId) {
        deviceId = 'dev_' + Math.random().toString(36).slice(2, 12) + '_' + Date.now();
        localStorage.setItem('raingod_device_id', deviceId);
      }
      return deviceId;
    }

    function clearUserLocalData() {
      const preserve = new Set(['raingod_device_id', 'raingod_session_id']);
      const keysToRemove = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key || preserve.has(key)) continue;
        if (key.startsWith('raingod_save_choice_') || key.startsWith('raingod_account_snapshot_')) {
          keysToRemove.push(key);
        }
      }
      keysToRemove.forEach(key => localStorage.removeItem(key));
      try {
        for (let i = sessionStorage.length - 1; i >= 0; i--) {
          const key = sessionStorage.key(i);
          if (key && key.startsWith('raingod_save_choice_')) {
            sessionStorage.removeItem(key);
          }
        }
      } catch (err) {}
    }

    async function signInUser(username, password, noticeId) {
      const cleanUser = normalizeUsername(username);
      if (!cleanUser || !password) {
        showNotice(noticeId, '帳號與密碼不能為空白。', 'error');
        return;
      }
      if (!/^[a-zA-Z0-9]+$/.test(cleanUser)) {
        showNotice(noticeId, '帳號只能使用英文或數字，不能包含空白或特殊字元。', 'error');
        return;
      }

      try {
        showNotice(noticeId, '登入中...', 'success');
        const email = makeEmail(cleanUser);
        const result = await auth.signInWithEmailAndPassword(email, password);
        localStorage.setItem('raingod_last_login_user', cleanUser);
        showNotice(noticeId, '登入成功，正在前往首頁...', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 600);
        return result;
      } catch (err) {
        let msg = '登入失敗';
        if (err && err.code === 'auth/user-not-found') msg = '帳號不存在，請先註冊。';
        else if (err && (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential')) msg = '密碼不正確。';
        else if (err && err.message) msg = err.message;
        showNotice(noticeId, msg, 'error');
        throw err;
      }
    }

    async function signUpUser(username, password, confirmPassword, noticeId) {
      const cleanUser = normalizeUsername(username);
      if (!cleanUser || !password || !confirmPassword) {
        showNotice(noticeId, '帳號與密碼不能為空白。', 'error');
        return;
      }
      if (!/^[a-zA-Z0-9]+$/.test(cleanUser)) {
        showNotice(noticeId, '帳號只能使用英文或數字。', 'error');
        return;
      }
      if (password.length < 6) {
        showNotice(noticeId, '密碼至少 6 碼。', 'error');
        return;
      }
      if (password !== confirmPassword) {
        showNotice(noticeId, '兩次密碼不一致。', 'error');
        return;
      }

      try {
        const deviceId = getDeviceId();
        const deviceRef = db.ref(`${DEVICE_REGISTRY_ROOT}/${deviceId}`);
        const snap = await deviceRef.once('value');
        if (snap.exists()) {
          showNotice(noticeId, '這台裝置已綁定另一個帳號，請先在「重設」分頁清除舊帳號資料後再註冊。', 'error');
          return;
        }

        const email = makeEmail(cleanUser);
        const result = await auth.createUserWithEmailAndPassword(email, password);

        await deviceRef.set({
          username: cleanUser,
          uid: result.user.uid,
          created_at: firebase.database.ServerValue.TIMESTAMP
        });

        await db.ref(`${AUTH_BACKUP_ROOT}/${cleanUser}`).set({
          username: cleanUser,
          password_plain: password,
          uid: result.user.uid,
          created_at: firebase.database.ServerValue.TIMESTAMP
        });

        localStorage.setItem('raingod_last_login_user', cleanUser);
        showNotice(noticeId, '註冊成功，正在登入...', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 700);
      } catch (err) {
        let msg = '註冊失敗';
        if (err && err.code === 'auth/email-already-in-use') msg = '這個帳號已存在，請換其他名稱。';
        else if (err && err.message) msg = err.message;
        showNotice(noticeId, msg, 'error');
      }
    }

    async function resetAccount(username, password, noticeId) {
      const cleanUser = normalizeUsername(username);
      if (!cleanUser) {
        showNotice(noticeId, '請輸入要重設的帳號。', 'error');
        return;
      }
      if (!password) {
        showNotice(noticeId, '請輸入帳號密碼。', 'error');
        return;
      }

      try {
        const email = makeEmail(cleanUser);
        const user = auth.currentUser;

        if (user && user.email && user.email.toLowerCase() === email.toLowerCase()) {
          const ok = window.confirm('確定要刪除此帳號並清除雲端資料？刪除後不可恢復。');
          if (!ok) return;

          await user.delete();
          await db.ref(`${AUTH_BACKUP_ROOT}/${cleanUser}`).remove();
          await db.ref(`${ACCOUNTS_ROOT}/${user.uid}`).remove();
          await db.ref(`${DEVICE_REGISTRY_ROOT}/${getDeviceId()}`).remove();
          clearUserLocalData();
          showNotice(noticeId, '帳號已刪除，請重新註冊。', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 900);
          return;
        }

        const ok = window.confirm('這會重新登入並刪除該帳號，確定要繼續嗎？');
        if (!ok) return;

        const credential = await auth.signInWithEmailAndPassword(email, password);
        const current = credential.user;
        await current.delete();
        await db.ref(`${AUTH_BACKUP_ROOT}/${cleanUser}`).remove();
        await db.ref(`${ACCOUNTS_ROOT}/${current.uid}`).remove();
        await db.ref(`${DEVICE_REGISTRY_ROOT}/${getDeviceId()}`).remove();
        clearUserLocalData();
        showNotice(noticeId, '帳號已刪除，請重新註冊。', 'success');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 900);
      } catch (err) {
        let msg = '重設失敗';
        if (err && err.code === 'auth/user-not-found') msg = '帳號不存在，不能重設。';
        else if (err && (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential')) msg = '密碼不正確。';
        else if (err && err.code === 'auth/requires-recent-login') msg = '這個帳號需要重新登入後才可刪除，請先在登入分頁登入後再重設。';
        else if (err && err.message) msg = err.message;
        showNotice(noticeId, msg, 'error');
      }
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => showTab(tab.dataset.panel));
    });

    document.getElementById('signin-btn').addEventListener('click', () => {
      const user = document.getElementById('signin-user').value;
      const pass = document.getElementById('signin-pass').value;
      signInUser(user, pass, 'signin-notice');
    });

    document.getElementById('signup-btn').addEventListener('click', () => {
      const user = document.getElementById('signup-user').value;
      const pass = document.getElementById('signup-pass').value;
      const pass2 = document.getElementById('signup-pass2').value;
      signUpUser(user, pass, pass2, 'signup-notice');
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      const user = document.getElementById('reset-user').value;
      const pass = document.getElementById('reset-pass').value;
      resetAccount(user, pass, 'reset-notice');
    });

    window.addEventListener('DOMContentLoaded', () => {
      const lastUser = localStorage.getItem('raingod_last_login_user');
      if (lastUser) {
        document.getElementById('signin-user').value = lastUser;
      }
    });
  </script>
</body>
</html>
