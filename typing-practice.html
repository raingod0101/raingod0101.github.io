<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 90px 15px 30px;

  background: linear-gradient(135deg, #07172f, #102e58, #07172f);

  justify-content: center;
  align-items: center;
}

.container {
  width: 100%;
  max-width: 720px;
  padding: 30px;
  text-align: center;
  border: 1px solid #315783;
  border-radius: 20px;
  background: rgba(12, 31, 57, .96);
  box-shadow: 0 15px 45px #0005;
}

h1 { color: #60a5fa; margin-top: 0; }

.hidden { display: none !important; }

.form-group {
  margin: 20px 0;
  text-align: left;
}

label {
  display: block;
  margin-bottom: 8px;
  color: #bfdbfe;
  font-weight: bold;
}

select, input[type="number"], input[type="text"] {
  width: 100%;
  padding: 14px;
  border: 1px solid #42658e;
  border-radius: 10px;
  outline: none;
  background: #08172c;
  color: white;
  font-size: 17px;
}

input[type="text"]:focus, select:focus {
  border-color: #60a5fa;
  box-shadow: 0 0 0 3px #3b82f633;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 0;
  border-radius: 10px;

  background: #2563eb;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:hover { background: #3b82f6; }
button:disabled { opacity: .5; cursor: not-allowed; }

.secondary { background: #334155; }
.secondary:hover { background: #475569; }

.word-display {
  display: flex;
  flex-wrap: wrap;

}

.char-card {

.char-card.active {

.char-card.preview { opacity: .55; }

.progress-info {

}

#duel-info {

  border-radius: 12px;

}

#duel-status { color: #93c5fd; }

#duel-score {

}

.result-item {

@media(max-width: 500px) {

}

/* 題目禁止選取與複製 */
#word-display, #word-display * {
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;

  -webkit-touch-callout: none;
}

/* 題目禁止拖曳 */
#word-display {
  -webkit-user-drag: none;
}

/* 題目區域不顯示文字游標 */

<body>
<div id="nav_bar"></div>

<div class="container">

  <section id="setup-screen">
    <h1>⚡ Raingod 打字對決</h1>

    <div class="form-group">
      <label for="play-mode">遊戲模式</label>
      <select id="play-mode">
        <option value="practice">個人練習（不配對）</option>

    <div class="form-group">

      <select id="mode">
        <option value="zh">中文同音搶答</option>

    <!-- 中文難度選擇 -->
    <div class="form-group" id="difficulty-group">
      <label for="difficulty">中文難度</label>

  <section id="game-screen" class="hidden">

<script>
"use strict";

// ================================================
// 1. 題庫
// ================================================
// 原本的 5000 多字題庫（保持不變，請自行貼上）
const ZH_CHAR_POOL = "";

// ================================================
// 【請把實際的「簡單 3000 字」貼到下面這個字串中】
// ================================================
const ZH_CHAR_POOL_SIMPLE = "";

// 建立各難度的去重字集
const ZH_SIMPLE_SET = new Set(Array.from(ZH_CHAR_POOL_SIMPLE));
const ZH_ALL_SET = new Set(Array.from(ZH_CHAR_POOL));

// 困難模式：從 5000 多字中扣除簡單模式已存在的字
const ZH_HARD_CHARS = Array.from(ZH_ALL_SET).filter(
  char => !ZH_SIMPLE_SET.has(char)
);

const ZH_SIMPLE_CHARS = Array.from(ZH_SIMPLE_SET);

const EN_WORDS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const PREVIEW_COUNT = 3;

let currentMode = "zh";
let currentDifficulty = "simple";
let playMode = "practice";
let totalTargetCount = 20;
let wordQueue = [];
let currentIndex = 0;
let startTime = 0;
let activeInput = null;
let finished = false;
let busy = false;

// Firebase / 對戰狀態
const FIREBASE_URL =
  "https://game-24b43-default-rtdb.firebaseio.com";

let db = null;
let rootRef = null;
let rootListener = null;
let currentRoomId = null;
let currentMatchToken = "";
let matchmaking = false;
let playerId = "";
let playerName = "玩家";
let latestRoom = null;
let lastRoomIndex = -1;

// ================================================
// 計分與分數儲存
// ================================================
// 簡單題 1 分、困難題 2 分
function getPointValue(mode, difficulty) {
  if (mode === "zh" && difficulty === "hard") return 2;
  return 1;
}

// 本局累計分數（練習與對戰都共用這個變數記錄「你」的得分）
let playerTotalScore = 0;

// 分數儲存路徑（Firebase）：typingDuelScores/<playerId>/total
function getScoreRef() {
  if (!db) return null;
  return db.ref("typingDuelScores/" + playerId);
}

// 讀取已儲存分數（回傳 Promise<number>）
async function loadSavedScore() {
  const ref = getScoreRef();
  if (!ref) return 0;
  try {
    const snapshot = await ref.child("total").get();
    const value = Number(snapshot.val());
    return Number.isFinite(value) ? value : 0;
  } catch (error) {
    console.error("讀取分數失敗：", error);
    return 0;
  }
}

// 將本局得分累加寫入 Firebase（transaction 避免競態）
async function addScoreToStorage(points) {
  if (!points || points <= 0) return;
  const ref = getScoreRef();
  if (!ref) return;
  try {
    await ref.child("total").transaction(current => {
      const base = Number(current) || 0;
      return base + points;
    }, undefined, false);

    await ref.child("name").set(playerName);
    await ref.child("updatedAt").set(Date.now());
  } catch (error) {
    console.error("儲存分數失敗：", error);
  }
}

// ================================================
// 2. 畫面元素
// ================================================
const setupScreen = document.getElementById("setup-screen");
const gameScreen = document.getElementById("game-screen");
const resultScreen = document.getElementById("result-screen");
const startBtn = document.getElementById("start-btn");
const restartBtn = document.getElementById("restart-btn");
const cancelBtn = document.getElementById("cancel-btn");
const wordDisplay = document.getElementById("word-display");
const progressInfo = document.getElementById("progress-info");
const inputWrapper = document.getElementById("input-wrapper");
const duelInfo = document.getElementById("duel-info");
const duelStatus = document.getElementById("duel-status");
const duelScore = document.getElementById("duel-score");
const notice = document.getElementById("notice");
const modeSelect = document.getElementById("mode");
const difficultyGroup = document.getElementById("difficulty-group");
const difficultySelect = document.getElementById("difficulty");

// 切換文字模式時，只有中文才顯示難度選單
function updateDifficultyVisibility() {
  const isZh = modeSelect.value === "zh";
  difficultyGroup.classList.toggle("hidden", !isZh);
}
modeSelect.addEventListener("change", updateDifficultyVisibility);
updateDifficultyVisibility();

startBtn.addEventListener("click", startGame);
wordDisplay.addEventListener("contextmenu", function (event) {
  event.preventDefault();
});
wordDisplay.addEventListener("dragstart", function (event) {
  event.preventDefault();
});
document.addEventListener("keydown", function (event) {
  const key = event.key.toLowerCase();
  if (
    (event.ctrlKey || event.metaKey) &&
    (key === "c" || key === "x")
  ) {
    const selection = window.getSelection();
    const selectedText = selection ? selection.toString() : "";
    if (selectedText) {
      event.preventDefault();
    }
  }
});
restartBtn.addEventListener("click", resetToSetup);
cancelBtn.addEventListener("click", resetToSetup);

// ================================================
// 3. 通用工具
// ================================================
function randomId() {
  return "r_" + Date.now() + "_" +
    Math.random().toString(36).slice(2, 10);
}

function getPlayerId() {
  try {
    let id = sessionStorage.getItem("typingDuelPlayerId");
    if (!id) {
      id = randomId();
      sessionStorage.setItem("typingDuelPlayerId", id);
    }
    return id;
  } catch (error) {
    return randomId();
  }
}

// 依照模式與難度取得字串來源
function getCharSource(mode, difficulty) {
  if (mode === "en") {
    return EN_WORDS.join("");
  }
  if (difficulty === "simple") {
    return ZH_SIMPLE_CHARS.join("");
  }
  // 困難：只使用簡單模式沒有的字
  return ZH_HARD_CHARS.join("");
}

function randomWords(mode, count, difficulty) {
  const source = getCharSource(mode, difficulty);
  const result = [];
  for (let i = 0; i < count; i++) {
    result.push(source[Math.floor(Math.random() * source.length)]);
  }
  return result;
}

function showScreen(name) {
  setupScreen.classList.toggle("hidden", name !== "setup");
  gameScreen.classList.toggle("hidden", name !== "game");
  resultScreen.classList.toggle("hidden", name !== "result");
}

function setNotice(message) {
  notice.textContent = message || "";
}

function setStartButton(enabled, text) {
  startBtn.disabled = !enabled;
  startBtn.textContent = text;
}

// ================================================
// 4. 開始遊戲
// ================================================
function startGame() {
  if (busy || matchmaking) return;

  setNotice("");

  const count = Number(
    document.getElementById("word-count").value
  );

  if (!Number.isFinite(count) || count < 1) {
    setNotice("請輸入 1～1000 之間的題目數量。");
    return;
  }

  totalTargetCount = Math.min(1000, Math.floor(count));
  document.getElementById("word-count").value = totalTargetCount;

  currentMode = document.getElementById("mode").value;
  currentDifficulty = document.getElementById("difficulty").value;
  playMode = document.getElementById("play-mode").value;
  playerName = (
    document.getElementById("player-name").value.trim() || "玩家"
  ).slice(0, 16);

  if (playMode === "practice") {
    startPractice();
  } else {
    startDuel();
  }
}

// ================================================
// 5. 個人練習
// ================================================
function startPractice() {
  stopListening();

  // 練習模式也需要 Firebase 才能儲存分數
  try {
    initializeFirebase();
    playerId = getPlayerId();
  } catch (error) {
    console.error("Firebase 初始化失敗，分數將不會儲存：", error);
  }

  currentRoomId = null;
  latestRoom = null;
  finished = false;
  busy = false;
  currentIndex = 0;

  // 重置本局分數
  playerTotalScore = 0;

  wordQueue = randomWords(currentMode, totalTargetCount, currentDifficulty);

  showScreen("game");
  duelInfo.classList.add("hidden");

  createNewInput();
  updateDisplay();

  startTime = Date.now();
}

function createNewInput() {
  inputWrapper.innerHTML = "";

  const input = document.createElement("input");
  input.type = "text";
  input.autocomplete = "off";
  input.autocapitalize = "off";
  input.spellcheck = false;
  input.placeholder = "直接打字／選字，不用按 Enter";

  input.addEventListener("input", checkAnswer);

  input.addEventListener("compositionend", () => {
    setTimeout(checkAnswer, 0);
  });

  inputWrapper.appendChild(input);
  activeInput = input;

  setTimeout(() => {
    if (activeInput === input && !finished) input.focus();
  }, 0);
}

function updateDisplay() {
  wordDisplay.innerHTML = "";

  for (let i = 0; i <= PREVIEW_COUNT; i++) {
    const index = currentIndex + i;
    if (index >= wordQueue.length) break;

    const card = document.createElement("div");
    card.className = "char-card " +
      (i === 0 ? "active" : "preview");
    card.textContent = wordQueue[index];

    wordDisplay.appendChild(card);
  }

  progressInfo.textContent =
    `進度：${currentIndex} / ${totalTargetCount}`;
}

// ================================================
// 6. 答案判定
// ================================================
function getPinyinKeys(char) {
  if (!char) return [];

  if (typeof pinyinPro === "undefined") {
    return [char];
  }

  try {
    const result = pinyinPro.pinyin(char, {
      toneType: "none",
      type: "array",
      multiple: true
    });

    const values = Array.isArray(result) ? result : [result];

    return [...new Set(
      values.map(value => String(value).toLowerCase())
    )];
  } catch (error) {
    return [char];
  }
}

function isSameSound(char1, char2) {
  if (char1 === char2) return true;

  const first = getPinyinKeys(char1);
  const second = getPinyinKeys(char2);

  return first.some(sound => second.includes(sound));
}

function isCorrectAnswer(value, target) {
  if (!value || !target) return false;

  if (currentMode === "zh") {
    for (const char of value) {
      if (isSameSound(char, target)) return true;
    }
    return false;
  }

  return value.toUpperCase().includes(target.toUpperCase());
}

function checkAnswer() {
  if (!activeInput || finished || busy) return;

  if (playMode === "duel") {
    checkDuelAnswer();
    return;
  }

  const target = wordQueue[currentIndex];
  const value = activeInput.value.trim();

  if (!value || !isCorrectAnswer(value, target)) return;

  // 答對，依難度加分
  playerTotalScore += getPointValue(currentMode, currentDifficulty);

  currentIndex++;

  if (currentIndex >= wordQueue.length) {
    endPractice();
  } else {
    createNewInput();
    updateDisplay();
  }
}

async function endPractice() {
  finished = true;

  const seconds = (Date.now() - startTime) / 1000;

  // 儲存本局分數
  await addScoreToStorage(playerTotalScore);
  const savedTotal = await loadSavedScore();

  document.getElementById("result-title").textContent = "練習完成！";
  document.getElementById("result-line-1").innerHTML =
    `本局得分：<span class="result-value">${playerTotalScore}</span> 分（累計 ${savedTotal} 分）`;
  document.getElementById("result-line-2").innerHTML =
    `總共耗時：<span class="result-value">${seconds.toFixed(2)}</span> 秒，平均每題 <span class="result-value">${(seconds / totalTargetCount).toFixed(2)}</span> 秒`;

  showScreen("result");
}

// ================================================
// 7. Firebase 初始化
// ================================================
function initializeFirebase() {
  if (typeof firebase === "undefined") {
    throw new Error(
      "Firebase SDK 載入失敗，請檢查網路或 CDN 是否被阻擋。"
    );
  }

  if (!firebase.apps.length) {
    firebase.initializeApp({
      databaseURL: FIREBASE_URL
    });
  }

  db = firebase.database();
  rootRef = db.ref("typingDuel");

  return rootRef;
}

// ================================================
// 8. 線上配對
// ================================================
async function startDuel() {
  stopListening();

  busy = true;
  matchmaking = true;
  finished = false;

  currentRoomId = null;
  latestRoom = null;
  lastRoomIndex = -1;
  currentIndex = 0;

  currentMatchToken = randomId();
  playerId = getPlayerId();

  setStartButton(false, "連線中……");
  showScreen("game");

  duelInfo.classList.remove("hidden");
  duelStatus.textContent = "正在尋找新的對手……";
  duelScore.textContent = "你 0 : 0 對手";

  wordDisplay.innerHTML = "";
  inputWrapper.innerHTML = "";
  progressInfo.textContent = "正在配對……";

  try {
    initializeFirebase();
    await findOpponent();
  } catch (error) {
    console.error(error);
    stopListening();

    duelStatus.textContent = "配對失敗";
    progressInfo.textContent =
      error.message || "請檢查 Firebase 設定與網路。";

    busy = false;
    matchmaking = false;

    setStartButton(true, "開始遊戲");
  }
}

async function findOpponent() {
  const newRoomId = randomId();
  const myMatchToken = currentMatchToken;
  const myDifficulty =
    currentMode === "zh" ? currentDifficulty : "simple";

  const transaction = await rootRef.transaction(state => {
    state = state || {};
    state.rooms = state.rooms || {};

    const now = Date.now();

    for (const [id, room] of Object.entries(state.rooms)) {
      if (now - (room.createdAt || 0) > 3600000) {
        delete state.rooms[id];
      }
    }

    let waiting = state.waiting;

    if (
      waiting &&
      now - (waiting.createdAt || 0) > 60000
    ) {
      state.waiting = null;
      waiting = null;
    }

    if (waiting && waiting.playerId === playerId) {
      state.waiting = null;
      waiting = null;
    }

    if (waiting && waiting.playerId !== playerId) {
      const roomMode = waiting.mode === "en" ? "en" : "zh";
      // 以先等待者的難度為準
      const roomDifficulty =
        roomMode === "zh"
          ? (waiting.difficulty === "hard" ? "hard" : "simple")
          : "simple";

      const roomCount = Math.max(
        1,
        Math.min(1000, Math.floor(Number(waiting.count) || 20))
      );

      const source = getCharSource(roomMode, roomDifficulty);

      const words = [];
      for (let i = 0; i < roomCount; i++) {
        words.push(
          source[Math.floor(Math.random() * source.length)]
        );
      }

      state.rooms[newRoomId] = {
        id: newRoomId,
        status: "playing",
        mode: roomMode,
        difficulty: roomDifficulty,
        words: words,
        index: 0,
        createdAt: now,

        matchTokens: {
          [waiting.playerId]: waiting.matchToken,
          [playerId]: myMatchToken
        },

        players: {
          [waiting.playerId]: {
            name: waiting.name || "玩家",
            score: 0
          },
          [playerId]: {
            name: playerName,
            score: 0
          }
        }
      };

      state.waiting = null;
    } else {
      state.waiting = {
        playerId: playerId,
        matchToken: myMatchToken,
        name: playerName,
        mode: currentMode,
        difficulty: myDifficulty,
        count: totalTargetCount,
        createdAt: now
      };
    }

    return state;
  }, undefined, false);

  if (!transaction.committed) {
    throw new Error("配對資料寫入失敗，請重新開始。");
  }

  if (currentMatchToken !== myMatchToken) {
    return;
  }

  listenForUpdates();
}

function listenForUpdates() {
  stopListening();

  const myMatchToken = currentMatchToken;

  rootListener = snapshot => {
    if (currentMatchToken !== myMatchToken) {
      return;
    }

    if (!matchmaking && !currentRoomId) {
      return;
    }

    const state = snapshot.val() || {};
    const rooms = state.rooms || {};

    let foundRoom = null;

    for (const room of Object.values(rooms)) {
      if (!room.players || !room.players[playerId]) {
        continue;
      }

      const token = room.matchTokens &&
        room.matchTokens[playerId];

      if (token !== myMatchToken) {
        continue;
      }

      foundRoom = room;
      break;
    }

    if (foundRoom) {
      currentRoomId = foundRoom.id;
      latestRoom = foundRoom;

      matchmaking = false;
      busy = false;

      currentMode = foundRoom.mode;
      currentDifficulty =
        foundRoom.difficulty === "hard" ? "hard" : "simple";
      wordQueue = foundRoom.words || [];
      totalTargetCount = wordQueue.length;

      setStartButton(true, "開始遊戲");

      renderDuel(foundRoom);
      return;
    }

    const waiting = state.waiting;

    if (
      waiting &&
      waiting.playerId === playerId &&
      waiting.matchToken === myMatchToken
    ) {
      duelStatus.textContent =
        "配對中……請等待另一位玩家。";

      progressInfo.textContent =
        "配對成功後會自動開始。";
    }
  };

  rootRef.on(
    "value",
    rootListener,
    error => {
      if (currentMatchToken !== myMatchToken) {
        return;
      }

      console.error(error);

      duelStatus.textContent = "Firebase 讀取失敗";
      progressInfo.textContent =
        error.message || "請檢查資料庫 Rules。";

      busy = false;
      matchmaking = false;

      stopListening();
      setStartButton(true, "開始遊戲");
    }
  );
}

// ================================================
// 9. 對戰畫面與搶答
// ================================================
function renderDuel(room) {
  if (!room || !room.players) return;

  const mine = room.players[playerId];
  if (!mine) return;

  const opponentEntry = Object.entries(room.players)
    .find(([id]) => id !== playerId);

  const opponent = opponentEntry ? opponentEntry[1] : null;

  duelScore.textContent =
    `${mine.name} ${mine.score || 0} : ${
      opponent ? opponent.score || 0 : 0
    } ${opponent ? opponent.name : "對手"}`;

  if (room.status === "finished") {
    endDuel(room);
    return;
  }

  if (!opponent) {
    duelStatus.textContent = "等待對手加入……";
    return;
  }

  duelStatus.textContent = "對戰中！搶先答對就能得分。";

  if (room.index !== lastRoomIndex) {
    lastRoomIndex = room.index;
    currentIndex = room.index;
    busy = false;

    if (currentIndex < wordQueue.length) {
      createNewInput();
      updateDisplay();
    }
  }

  progressInfo.textContent =
    `搶答進度：${Math.min(room.index, totalTargetCount)} / ${totalTargetCount}`;
}

async function checkDuelAnswer() {
  if (
    !activeInput ||
    !currentRoomId ||
    !latestRoom ||
    busy ||
    finished ||
    matchmaking
  ) return;

  const expectedIndex = currentIndex;
  const target = wordQueue[expectedIndex];
  const value = activeInput.value.trim();

  if (!value || !isCorrectAnswer(value, target)) return;

  busy = true;
  activeInput.disabled = true;

  try {
    const result = await rootRef.transaction(state => {
      if (!state || !state.rooms) return;

      const room = state.rooms[currentRoomId];

      if (
        !room ||
        room.status !== "playing" ||
        room.index !== expectedIndex ||
        !room.players ||
        !room.players[playerId]
      ) {
        return;
      }

      // 依難度加分（簡單 1 分、困難 2 分）
      const point = getPointValue(room.mode, room.difficulty);
      room.players[playerId].score =
        (room.players[playerId].score || 0) + point;

      room.index++;

      if (room.index >= room.words.length) {
        room.status = "finished";
        room.finishedAt = Date.now();
      }

      return state;
    }, undefined, false);

    if (!result.committed) {
      busy = false;

      if (activeInput) {
        activeInput.value = "";
        activeInput.disabled = false;
      }
    }
  } catch (error) {
    console.error(error);
    busy = false;

    if (activeInput) {
      activeInput.disabled = false;
      activeInput.focus();
    }

    duelStatus.textContent = "答案送出失敗，請檢查連線。";
  }
}

async function endDuel(room) {
  finished = true;
  busy = false;
  matchmaking = false;

  const players = room.players || {};
  const mine = players[playerId];

  if (!mine) return;

  const opponentEntry = Object.entries(players)
    .find(([id]) => id !== playerId);

  const opponent = opponentEntry ? opponentEntry[1] : null;
  const myScore = mine.score || 0;
  const opponentScore = opponent ? opponent.score || 0 : 0;

  // 本局分數寫入個人累計
  playerTotalScore = myScore;
  await addScoreToStorage(playerTotalScore);
  const savedTotal = await loadSavedScore();

  let title = "平手！";

  if (myScore > opponentScore) title = "🏆 對決勝利！";
  if (myScore < opponentScore) title = "再接再厲！";

  document.getElementById("result-title").textContent = title;

  document.getElementById("result-line-1").innerHTML =
    `你的得分：<span class="result-value">${myScore}</span> 分（累計 ${savedTotal} 分）`;

  document.getElementById("result-line-2").innerHTML =
    `對手得分：<span class="result-value">${opponentScore}</span> 分`;

  showScreen("result");
}

// ================================================
// 10. 離開、重新開始
// ================================================
function stopListening() {
  if (rootRef && rootListener) {
    rootRef.off("value", rootListener);
  }
  rootListener = null;
}

async function resetToSetup() {
  const oldPlayerId = playerId;
  const oldMatchToken = currentMatchToken;
  const oldRoomId = currentRoomId;

  stopListening();

  currentMatchToken = randomId();
  finished = true;
  busy = false;
  matchmaking = false;

  currentRoomId = null;
  latestRoom = null;
  activeInput = null;
  lastRoomIndex = -1;

  wordQueue = [];
  currentIndex = 0;

  wordDisplay.innerHTML = "";
  inputWrapper.innerHTML = "";
  progressInfo.textContent = "";

  showScreen("setup");
  duelInfo.classList.add("hidden");

  setNotice("");
  setStartButton(true, "開始遊戲");

  document.getElementById("result-title").textContent =
    "成績統計";

  if (rootRef && oldPlayerId && oldMatchToken) {
    try {
      await rootRef.transaction(state => {
        if (!state) return state;

        const waiting = state.waiting;

        if (
          waiting &&
          waiting.playerId === oldPlayerId &&
          waiting.matchToken === oldMatchToken
        ) {
          state.waiting = null;
        }

        return state;
      }, undefined, false);
    } catch (error) {
      console.error("清理等待資料失敗：", error);
    }
  }
};
