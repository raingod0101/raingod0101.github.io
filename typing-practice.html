<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 90px 15px 30px;
  font-family: Arial, "Microsoft JhengHei", sans-serif;
  background: linear-gradient(135deg, #07172f, #102e58, #07172f);
  color: #eff6ff;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: 100%;
  max-width: 720px;
  padding: 30px;
  text-align: center;
  border: 1px solid #315783;
  border-radius: 20px;
  background: rgba(12, 31, 57, .96);
  box-shadow: 0 15px 45px #0005;
}

h1 { color: #60a5fa; margin-top: 0; }

.hidden { display: none !important; }

.form-group {
  margin: 20px 0;
  text-align: left;
}

label {
  display: block;
  margin-bottom: 8px;
  color: #bfdbfe;
  font-weight: bold;
}

select, input[type="number"], input[type="text"] {
  width: 100%;
  padding: 14px;
  border: 1px solid #42658e;
  border-radius: 10px;
  outline: none;
  background: #08172c;
  color: white;
  font-size: 17px;
}

input[type="text"]:focus, select:focus {
  border-color: #60a5fa;
  box-shadow: 0 0 0 3px #3b82f633;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 0;
  border-radius: 10px;
  color: white;
  background: #2563eb;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:hover { background: #3b82f6; }
button:disabled { opacity: .5; cursor: not-allowed; }

.secondary { background: #334155; }
.secondary:hover { background: #475569; }

.word-display {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 12px;
  min-height: 100px;
  margin: 28px 0;
}

.char-card {
  min-width: 58px;
  padding: 12px 17px;
  border-radius: 12px;
  background: #243d5c;
  font-size: 27px;
}

.char-card.active {
  background: #60a5fa;
  color: #06162b;
  font-size: 38px;
  font-weight: bold;
  box-shadow: 0 0 22px #60a5fa66;
}

.char-card.preview { opacity: .55; }

.progress-info {
  margin-top: 20px;
  color: #bfdbfe;
}

#duel-info {
  padding: 16px;
  border: 1px solid #315783;
  border-radius: 12px;
  background: #08172c;
}

#duel-status { color: #93c5fd; }

#duel-score {
  margin-top: 10px;
  font-size: 23px;
  font-weight: bold;
}

.result-box {
  margin: 25px 0;
  padding: 20px;
  border-radius: 12px;
  background: #08172c;
}

.result-item {
  margin: 15px 0;
  font-size: 18px;
  color: #bfdbfe;
}

.result-value {
  color: #60a5fa;
  font-size: 28px;
  font-weight: bold;
}

#notice {
  margin-top: 15px;
  color: #fbbf24;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

@media(max-width: 500px) {
  .container { padding: 20px 14px; }
  .char-card { min-width: 45px; padding: 10px; }
}
/* 題目禁止選取與複製 */
#word-display,
#word-display * {
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

/* 題目禁止拖曳 */
#word-display {
  -webkit-user-drag: none;
}

/* 題目區域不顯示文字游標 */
#word-display .char-card {
  cursor: default;
}
</style>
</head>

<div id="nav_bar"></div>

<div class="container">

  <section id="setup-screen">
    <h1>⚡ Raingod 打字對決</h1>

    <div class="form-group">
      <label for="play-mode">遊戲模式</label>
      <select id="play-mode">
        <option value="practice">個人練習（不配對）</option>
        <option value="duel">搶答對決（線上配對）</option>
      </select>
    </div>

    <div class="form-group">
      <label for="mode">文字模式</label>
      <select id="mode">
        <option value="zh">中文同音搶答</option>
        <option value="en">英文搶答</option>
      </select>
    </div>

    <div class="form-group">
      <label for="word-count">題目數量（1～1000）</label>
      <input type="number" id="word-count"
             value="20" min="1" max="1000">
    </div>

    <div class="form-group">
      <label for="player-name">對戰暱稱</label>
      <input type="text" id="player-name"
             maxlength="16" placeholder="輸入你的暱稱">
    </div>

    <button id="start-btn" type="button">開始遊戲</button>
    <div id="notice"></div>
  </section>

  <section id="game-screen" class="hidden">
    <div id="duel-info" class="hidden">
      <div id="duel-status">正在準備……</div>
      <div id="duel-score">你 0 : 0 對手</div>
    </div>

    <div class="word-display" id="word-display"></div>
    <div id="input-wrapper"></div>
    <div class="progress-info" id="progress-info"></div>

    <button id="cancel-btn" class="secondary" type="button">
      返回設定
    </button>
  </section>

  <section id="result-screen" class="hidden">
    <h1 id="result-title">成績統計</h1>
    <div class="result-box">
      <div class="result-item" id="result-line-1">
        總共耗時：
        <span class="result-value" id="total-time">0</span> 秒
      </div>
      <div class="result-item" id="result-line-2">
        平均每題：
        <span class="result-value" id="avg-time">0</span> 秒
      </div>
    </div>
    <button id="restart-btn" type="button">再玩一次</button>
  </section>

</div>

<script src="menu.js"></script>

function randomId() {
  return "r_" + Date.now() + "_" +
    Math.random().toString(36).slice(2, 10);
}

function getPlayerId() {
  try {
    let id = sessionStorage.getItem("typingDuelPlayerId");

    if (!id) {
      id = randomId();
      sessionStorage.setItem("typingDuelPlayerId", id);
    }

    return id;
  } catch (error) {
    return randomId();
  }
}

function randomWords(mode, count) {
  const source = mode === "zh" ? ZH_CHAR_POOL : EN_WORDS.join("");
  const result = [];

  for (let i = 0; i < count; i++) {
    result.push(source[Math.floor(Math.random() * source.length)]);
  }

  return result;
}

  setupScreen.classList.toggle("hidden", name !== "setup");

}

  startBtn.textContent = text;
}

// ================================================
// 4. 開始遊戲
// ================================================

function startGame() {
  // 這裡先處理按鈕，確保點擊有明確反應。
  if (busy || matchmaking) return;

  setNotice("");

  const count = Number(
    document.getElementById("word-count").value
  );

  if (!Number.isFinite(count) || count < 1) {
    setNotice("請輸入 1～1000 之間的題目數量。");
    return;
  }

  totalTargetCount = Math.min(1000, Math.floor(count));
  document.getElementById("word-count").value = totalTargetCount;

  currentMode = document.getElementById("mode").value;
  playMode = document.getElementById("play-mode").value;
  playerName = (
    document.getElementById("player-name").value.trim() || "玩家"
  ).slice(0, 16);

  if (playMode === "practice") {
    startPractice();
  } else {
    startDuel();
  }
}

// ================================================
// 5. 個人練習
// ================================================

function startPractice() {
  stopListening();

  currentRoomId = null;
  latestRoom = null;
  finished = false;
  busy = false;
  currentIndex = 0;

  wordQueue = randomWords(currentMode, totalTargetCount);

  showScreen("game");
  duelInfo.classList.add("hidden");

  createNewInput();
  updateDisplay();

  startTime = Date.now();
}

function createNewInput() {
  inputWrapper.innerHTML = "";

  const input = document.createElement("input");
  input.type = "text";
  input.autocomplete = "off";
  input.autocapitalize = "off";
  input.spellcheck = false;
  input.placeholder = "直接打字／選字，不用按 Enter";

  input.addEventListener("input", checkAnswer);

  // 中文輸入法選字完成後再次檢查。
  input.addEventListener("compositionend", () => {
    setTimeout(checkAnswer, 0);
  });

  inputWrapper.appendChild(input);
  activeInput = input;

  setTimeout(() => {
    if (activeInput === input && !finished) input.focus();
  }, 0);
}

function updateDisplay() {
  wordDisplay.innerHTML = "";

  for (let i = 0; i <= PREVIEW_COUNT; i++) {
    const index = currentIndex + i;
    if (index >= wordQueue.length) break;

    const card = document.createElement("div");
    card.className = "char-card " +
      (i === 0 ? "active" : "preview");
    card.textContent = wordQueue[index];

    wordDisplay.appendChild(card);
  }

  progressInfo.textContent =
    `進度：${currentIndex} / ${totalTargetCount}`;
}

// ================================================
// 6. 答案判定
// ================================================

function getPinyinKeys(char) {
  if (!char) return [];

  if (typeof pinyinPro === "undefined") {
    return [char];
  }

  try {
    const result = pinyinPro.pinyin(char, {
      toneType: "none",
      type: "array",
      multiple: true
    });

    const values = Array.isArray(result) ? result : [result];

    return [...new Set(
      values.map(value => String(value).toLowerCase())
    )];
  } catch (error) {
    return [char];
  }
}

function isSameSound(char1, char2) {
  if (char1 === char2) return true;

  const first = getPinyinKeys(char1);
  const second = getPinyinKeys(char2);

  return first.some(sound => second.includes(sound));
}

function isCorrectAnswer(value, target) {
  if (!value || !target) return false;

  if (currentMode === "zh") {
    // 只要輸入的字中有一個字與題目同音，就算答對。
    for (const char of value) {
      if (isSameSound(char, target)) return true;
    }
    return false;
  }

  return value.toUpperCase().includes(target.toUpperCase());
}

function checkAnswer() {
  if (!activeInput || finished || busy) return;

  if (playMode === "duel") {
    checkDuelAnswer();
    return;
  }

  const target = wordQueue[currentIndex];
  const value = activeInput.value.trim();

  if (!value || !isCorrectAnswer(value, target)) return;

  currentIndex++;

  if (currentIndex >= wordQueue.length) {
    endPractice();
  } else {
    createNewInput();
    updateDisplay();
  }
}

function endPractice() {
  finished = true;

  const seconds = (Date.now() - startTime) / 1000;

  document.getElementById("result-title").textContent = "練習完成！";
  document.getElementById("result-line-1").innerHTML =
    `總共耗時：<span class="result-value">${seconds.toFixed(2)}</span> 秒`;

  document.getElementById("result-line-2").innerHTML =
    `平均每題：<span class="result-value">${
      (seconds / totalTargetCount).toFixed(2)
    }</span> 秒`;

  showScreen("result");
}

// ================================================
// 7. Firebase 初始化
// ================================================

function initializeFirebase() {
  if (typeof firebase === "undefined") {
    throw new Error(
      "Firebase SDK 載入失敗，請檢查網路或 CDN 是否被阻擋。"
    );
  }

  if (!firebase.apps.length) {
    firebase.initializeApp({
      databaseURL: FIREBASE_URL
    });
  }

  db = firebase.database();
  rootRef = db.ref("typingDuel");

  return rootRef;
}

// ================================================
// 8. 線上配對（修正版）
// ================================================

async function startDuel() {
  // 一開始就解除上一場的 Firebase 監聽。
  stopListening();

  busy = true;
  matchmaking = true;
  finished = false;

  currentRoomId = null;
  latestRoom = null;
  lastRoomIndex = -1;
  currentIndex = 0;

  // 每次配對都產生新的識別碼。
  // 舊房間即使還存在，也不會被當成這一場。
  currentMatchToken = randomId();

  playerId = getPlayerId();

  setStartButton(false, "連線中……");
  showScreen("game");

  duelInfo.classList.remove("hidden");
  duelStatus.textContent = "正在尋找新的對手……";
  duelScore.textContent = "你 0 : 0 對手";

  wordDisplay.innerHTML = "";
  inputWrapper.innerHTML = "";
  progressInfo.textContent = "正在配對……";

  try {
    initializeFirebase();

    await findOpponent();
  } catch (error) {
    console.error(error);

    stopListening();

    duelStatus.textContent = "配對失敗";
    progressInfo.textContent =
      error.message || "請檢查 Firebase 設定與網路。";

    busy = false;
    matchmaking = false;

    setStartButton(true, "開始遊戲");
  }
}


async function findOpponent() {
  const newRoomId = randomId();

  // 每次嘗試配對都使用自己的識別碼。
  const myMatchToken = currentMatchToken;

  const transaction = await rootRef.transaction(state => {
    state = state || {};
    state.rooms = state.rooms || {};

    const now = Date.now();

    // 清理超過一小時的舊房間。
    for (const [id, room] of Object.entries(state.rooms)) {
      if (now - (room.createdAt || 0) > 3600000) {
        delete state.rooms[id];
      }
    }

    let waiting = state.waiting;

    // 過期的等待玩家不能再被配對。
    if (
      waiting &&
      now - (waiting.createdAt || 0) > 60000
    ) {
      state.waiting = null;
      waiting = null;
    }

    // 如果等待資料是自己上一次留下的，
    // 就不可以拿它當成新的對手。
    if (waiting && waiting.playerId === playerId) {
      state.waiting = null;
      waiting = null;
    }

    // 找到另一位仍在等待的玩家。
    if (waiting && waiting.playerId !== playerId) {
      const roomMode = waiting.mode === "en" ? "en" : "zh";

      // 以先等待的玩家設定為準，確保兩人題目一致。
      const roomCount = Math.max(
        1,
        Math.min(1000, Math.floor(Number(waiting.count) || 20))
      );

      const source = roomMode === "zh"
        ? ZH_CHAR_POOL
        : "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

      const words = [];

      for (let i = 0; i < roomCount; i++) {
        words.push(
          source[Math.floor(Math.random() * source.length)]
        );
      }

      state.rooms[newRoomId] = {
        id: newRoomId,
        status: "playing",
        mode: roomMode,
        words: words,
        index: 0,
        createdAt: now,

        // 這場對戰專屬的識別碼。
        matchTokens: {
          [waiting.playerId]: waiting.matchToken,
          [playerId]: myMatchToken
        },

        players: {
          [waiting.playerId]: {
            name: waiting.name || "玩家",
            score: 0
          },

          [playerId]: {
            name: playerName,
            score: 0
          }
        }
      };

      state.waiting = null;
    } else {
      // 沒有對手就建立新的等待資料。
      state.waiting = {
        playerId: playerId,
        matchToken: myMatchToken,
        name: playerName,
        mode: currentMode,
        count: totalTargetCount,
        createdAt: now
      };
    }

    return state;
  }, undefined, false);

  if (!transaction.committed) {
    throw new Error("配對資料寫入失敗，請重新開始。");
  }

  // 避免等待期間已經開始下一次配對。
  if (currentMatchToken !== myMatchToken) {
    return;
  }

  listenForUpdates();
}


function listenForUpdates() {
  stopListening();

  const myMatchToken = currentMatchToken;

  rootListener = snapshot => {
    // 舊的配對監聽器不能影響新的對戰。
    if (currentMatchToken !== myMatchToken) {
      return;
    }

    if (!matchmaking && !currentRoomId) {
      return;
    }

    const state = snapshot.val() || {};
    const rooms = state.rooms || {};

    let foundRoom = null;

    // 只接受屬於這一次配對的房間。
    for (const room of Object.values(rooms)) {
      if (!room.players || !room.players[playerId]) {
        continue;
      }

      const token = room.matchTokens &&
        room.matchTokens[playerId];

      if (token !== myMatchToken) {
        continue;
      }

      foundRoom = room;
      break;
    }

    if (foundRoom) {
      currentRoomId = foundRoom.id;
      latestRoom = foundRoom;

      matchmaking = false;
      busy = false;

      currentMode = foundRoom.mode;
      wordQueue = foundRoom.words || [];
      totalTargetCount = wordQueue.length;

      setStartButton(true, "開始遊戲");

      renderDuel(foundRoom);
      return;
    }

    const waiting = state.waiting;

    // 必須同時符合玩家 ID 和本次配對識別碼。
    if (
      waiting &&
      waiting.playerId === playerId &&
      waiting.matchToken === myMatchToken
    ) {
      duelStatus.textContent =
        "配對中……請等待另一位玩家。";

      progressInfo.textContent =
        "配對成功後會自動開始。";
    }
  };

  rootRef.on(
    "value",
    rootListener,
    error => {
      // 舊監聽器的錯誤不應影響新遊戲。
      if (currentMatchToken !== myMatchToken) {
        return;
      }

      console.error(error);

      duelStatus.textContent = "Firebase 讀取失敗";
      progressInfo.textContent =
        error.message || "請檢查資料庫 Rules。";

      busy = false;
      matchmaking = false;

      stopListening();

      setStartButton(true, "開始遊戲");
    }
  );
}
// ================================================
// 9. 對戰畫面與搶答
// ================================================

function renderDuel(room) {
  if (!room || !room.players) return;

  const mine = room.players[playerId];
  if (!mine) return;

  const opponentEntry = Object.entries(room.players)
    .find(([id]) => id !== playerId);

  const opponent = opponentEntry ? opponentEntry[1] : null;

  duelScore.textContent =
    `${mine.name} ${mine.score || 0} : ${
      opponent ? opponent.score || 0 : 0
    } ${opponent ? opponent.name : "對手"}`;

  if (room.status === "finished") {
    endDuel(room);
    return;
  }

  if (!opponent) {
    duelStatus.textContent = "等待對手加入……";
    return;
  }

  duelStatus.textContent = "對戰中！搶先答對就能得分。";

  if (room.index !== lastRoomIndex) {
    lastRoomIndex = room.index;
    currentIndex = room.index;
    busy = false;

    if (currentIndex < wordQueue.length) {
      createNewInput();
      updateDisplay();
    }
  }

  progressInfo.textContent =
    `搶答進度：${Math.min(room.index, totalTargetCount)} / ${totalTargetCount}`;
}

async function checkDuelAnswer() {
  if (
    !activeInput ||
    !currentRoomId ||
    !latestRoom ||
    busy ||
    finished ||
    matchmaking
  ) return;

  const expectedIndex = currentIndex;
  const target = wordQueue[expectedIndex];
  const value = activeInput.value.trim();

  if (!value || !isCorrectAnswer(value, target)) return;

  // 先鎖住本地輸入，避免同一玩家重複送出。
  busy = true;
  activeInput.disabled = true;

  try {
    const result = await rootRef.transaction(state => {
      if (!state || !state.rooms) return;

      const room = state.rooms[currentRoomId];

      if (
        !room ||
        room.status !== "playing" ||
        room.index !== expectedIndex ||
        !room.players ||
        !room.players[playerId]
      ) {
        return;
      }

      // 原子交易：只有第一個成功的答案能取得這題分數。
      room.players[playerId].score =
        (room.players[playerId].score || 0) + 1;

      room.index++;

      if (room.index >= room.words.length) {
        room.status = "finished";
        room.finishedAt = Date.now();
      }

      return state;
    }, undefined, false);

    if (!result.committed) {
      // 對手先搶到時，等待 Firebase 推送新題目。
      busy = false;

      if (activeInput) {
        activeInput.value = "";
        activeInput.disabled = false;
      }
    }
  } catch (error) {
    console.error(error);
    busy = false;

    if (activeInput) {
      activeInput.disabled = false;
      activeInput.focus();
    }

    duelStatus.textContent = "答案送出失敗，請檢查連線。";
  }
}

function endDuel(room) {
  finished = true;
  busy = false;
  matchmaking = false;

  const players = room.players || {};
  const mine = players[playerId];

  if (!mine) return;

  const opponentEntry = Object.entries(players)
    .find(([id]) => id !== playerId);

  const opponent = opponentEntry ? opponentEntry[1] : null;
  const myScore = mine.score || 0;
  const opponentScore = opponent ? opponent.score || 0 : 0;

  let title = "平手！";

  if (myScore > opponentScore) title = "🏆 對決勝利！";
  if (myScore < opponentScore) title = "再接再厲！";

  document.getElementById("result-title").textContent = title;

  document.getElementById("result-line-1").innerHTML =
    `你的得分：<span class="result-value">${myScore}</span> 分`;

  document.getElementById("result-line-2").innerHTML =
    `對手得分：<span class="result-value">${opponentScore}</span> 分`;

  showScreen("result");
}

// ================================================
// 10. 離開、重新開始（修正版）
// ================================================

function stopListening() {
  if (rootRef && rootListener) {
    rootRef.off("value", rootListener);
  }

  rootListener = null;
}


async function resetToSetup() {
  // 先記住這次配對的資料，再解除監聽。
  const oldPlayerId = playerId;
  const oldMatchToken = currentMatchToken;
  const oldRoomId = currentRoomId;

  stopListening();

  // 立刻讓舊的非同步操作失效。
  currentMatchToken = randomId();

  finished = true;
  busy = false;
  matchmaking = false;

  currentRoomId = null;
  latestRoom = null;
  activeInput = null;
  lastRoomIndex = -1;

  wordQueue = [];
  currentIndex = 0;

  wordDisplay.innerHTML = "";
  inputWrapper.innerHTML = "";
  progressInfo.textContent = "";

  showScreen("setup");
  duelInfo.classList.add("hidden");

  setNotice("");
  setStartButton(true, "開始遊戲");

  document.getElementById("result-title").textContent =
    "成績統計";

  // 從 Firebase 移除自己留下的等待資料。
  // 不能直接清空整個 typingDuel，否則會影響其他玩家。
  if (
    rootRef &&
    oldPlayerId &&
    oldMatchToken
  ) {
    try {
      await rootRef.transaction(state => {
        if (!state) return state;

        const waiting = state.waiting;

        if (
          waiting &&
          waiting.playerId === oldPlayerId &&
          waiting.matchToken === oldMatchToken
        ) {
          state.waiting = null;
        }

        // 不刪除整個房間或其他玩家的資料。
        // 每次新配對都會使用新的 matchToken，
        // 所以舊房間不會被誤認為新的一場。
        return state;
      }, undefined, false);
    } catch (error) {
      console.error("清理等待資料失敗：", error);
    }
  }
};
