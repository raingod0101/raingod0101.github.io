<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打字對決 | Raingod</title>

<script src="https://unpkg.com/pinyin-pro"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 90px 15px 30px;
  font-family: Arial, "Microsoft JhengHei", sans-serif;
  background: linear-gradient(135deg, #07172f, #102e58, #07172f);
  color: #eff6ff;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: 100%;
  max-width: 720px;
  padding: 30px;
  text-align: center;
  border: 1px solid #315783;
  border-radius: 20px;
  background: rgba(12, 31, 57, .96);
  box-shadow: 0 15px 45px #0005;
}

h1 { color: #60a5fa; margin-top: 0; }

.hidden { display: none !important; }

.form-group {
  margin: 20px 0;
  text-align: left;
}

label {
  display: block;
  margin-bottom: 8px;
  color: #bfdbfe;
  font-weight: bold;
}

select, input[type="number"], input[type="text"] {
  width: 100%;
  padding: 14px;
  border: 1px solid #42658e;
  border-radius: 10px;
  outline: none;
  background: #08172c;
  color: white;
  font-size: 17px;
}

input[type="text"]:focus, select:focus {
  border-color: #60a5fa;
  box-shadow: 0 0 0 3px #3b82f633;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 0;
  border-radius: 10px;
  color: white;
  background: #2563eb;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:hover { background: #3b82f6; }
button:disabled { opacity: .5; cursor: not-allowed; }

.secondary { background: #334155; }
.secondary:hover { background: #475569; }

.word-display {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 12px;
  min-height: 100px;
  margin: 28px 0;
  position: relative;
}

.char-card {
  min-width: 58px;
  padding: 12px 17px;
  border-radius: 12px;
  background: #243d5c;
  font-size: 27px;
  position: relative;
}

.char-card.active {
  background: #60a5fa;
  color: #06162b;
  font-size: 38px;
  font-weight: bold;
  box-shadow: 0 0 22px #60a5fa66;
}

/* 注音提示區（練習模式才出現） */
#zhuyin-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
}

.zhuyin-toggle {
  display: inline-block;
  padding: 6px 14px;
  font-size: 14px;
  border-radius: 8px;
  background: #334155;
  color: #bfdbfe;
  cursor: pointer;
  border: none;
  width: auto;
  margin: 0;
}

.zhuyin-toggle:hover { background: #475569; }

.zhuyin-answer {
  display: none;
  padding: 10px 16px;
  border-radius: 10px;
  background: #0f2a45;
  border: 1px solid #315783;
  color: #fbbf24;
  font-size: 22px;
  letter-spacing: 4px;
  line-height: 1.5;
}

.zhuyin-answer.show { display: block; }

.progress-info {
  margin-top: 20px;
  color: #bfdbfe;
}

#duel-info {
  padding: 16px;
  border: 1px solid #315783;
  border-radius: 12px;
  background: #08172c;
}

#duel-status { color: #93c5fd; }

#duel-score {
  margin-top: 10px;
  font-size: 23px;
  font-weight: bold;
}

.result-box {
  margin: 25px 0;
  padding: 20px;
  border-radius: 12px;
  background: #08172c;
}

.result-item {
  margin: 15px 0;
  font-size: 18px;
  color: #bfdbfe;
}

.result-value {
  color: #60a5fa;
  font-size: 28px;
  font-weight: bold;
}

#notice {
  margin-top: 15px;
  color: #fbbf24;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

@media(max-width: 500px) {
  .container { padding: 20px 14px; }
  .char-card { min-width: 45px; padding: 10px; }
}
/* 題目禁止選取與複製 */
#word-display,
#word-display * {
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

/* 題目禁止拖曳 */
#word-display {
  -webkit-user-drag: none;
}

/* 題目區域不顯示文字游標 */
#word-display .char-card {
  cursor: default;
}
</style>
</head>

<body>
<div id="nav_bar"></div>

<div class="container">

  <section id="setup-screen">
    <h1>⚡ Raingod 打字對決</h1>

    <div class="form-group">
      <label for="play-mode">遊戲模式</label>
      <select id="play-mode">
        <option value="practice">個人練習（不配對）</option>
        <option value="duel">搶答對決（線上配對）</option>
      </select>
    </div>

    <div class="form-group">
      <label for="mode">文字模式</label>
      <select id="mode">
        <option value="zh">中文同音搶答</option>
        <option value="en">英文搶答</option>
      </select>
    </div>

    <div class="form-group" id="difficulty-group">
      <label for="difficulty">中文難度</label>
      <select id="difficulty">
        <option value="simple">簡單</option>
        <option value="hard">困難</option>
      </select>
    </div>

    <div class="form-group">
      <label for="word-count">題目數量（1～1000）</label>
      <input type="number" id="word-count"
             value="20" min="1" max="1000">
    </div>

    <div class="form-group">
      <label for="player-name">對戰暱稱</label>
      <input type="text" id="player-name"
             maxlength="16" placeholder="輸入你的暱稱">
    </div>

    <button id="start-btn" type="button">開始遊戲</button>
    <div id="notice"></div>
  </section>

  <section id="game-screen" class="hidden">
    <div id="duel-info" class="hidden">
      <div id="duel-status">正在準備……</div>
      <div id="duel-score">你 0 : 0 對手</div>
    </div>

    <div class="word-display" id="word-display"></div>
    <div id="zhuyin-area"></div>
    <div id="input-wrapper"></div>
    <div class="progress-info" id="progress-info"></div>

    <button id="cancel-btn" class="secondary" type="button">
      返回設定
    </button>
  </section>

  <section id="result-screen" class="hidden">
    <h1 id="result-title">成績統計</h1>
    <div class="result-box">
      <div class="result-item" id="result-line-1">
        總共耗時：
        <span class="result-value" id="total-time">0</span> 秒
      </div>
      <div class="result-item" id="result-line-2">
        平均每題：
        <span class="result-value" id="avg-time">0</span> 秒
      </div>
    </div>
    <button id="restart-btn" type="button">再玩一次</button>
  </section>

</div>

<script src="menu.js"></script>

const restartBtn = document.getElementById("restart-btn");

// 切換文字模式時，只有中文才顯示難度選單
function updateDifficultyVisibility() {
  const isZh = modeSelect.value === "zh";
  difficultyGroup.classList.toggle("hidden", !isZh);
}
modeSelect.addEventListener("change", updateDifficultyVisibility);
updateDifficultyVisibility();

startBtn.addEventListener("click", startGame);
wordDisplay.addEventListener("contextmenu", function (event) {
  event.preventDefault();
});
wordDisplay.addEventListener("dragstart", function (event) {
  event.preventDefault();
});
document.addEventListener("keydown", function (event) {
  const key = event.key.toLowerCase();
  if (
    (event.ctrlKey || event.metaKey) &&
    (key === "c" || key === "x")
  ) {
    const selection = window.getSelection();
    const selectedText = selection ? selection.toString() : "";
    if (selectedText) {
      event.preventDefault();
    }
  }
});
restartBtn.addEventListener("click", resetToSetup);
cancelBtn.addEventListener("click", resetToSetup);

// ================================================
// 3. 通用工具
// ================================================

function randomId() {
  return "r_" + Date.now() + "_" +
    Math.random().toString(36).slice(2, 10);
}

function getPlayerId() {
  try {
    let id = sessionStorage.getItem("typingDuelPlayerId");
    if (!id) {
      id = randomId();
      sessionStorage.setItem("typingDuelPlayerId", id);
    }
    return id;
  } catch (error) {
    return randomId();
  }
}

function getCharSource(mode, difficulty) {
  if (mode === "en") {
    return EN_WORDS.join("");
  }
  if (difficulty === "simple") {
    return ZH_SIMPLE_CHARS.join("");
  }
  return ZH_HARD_CHARS.join("");
}

function randomWords(mode, count, difficulty) {
  const source = getCharSource(mode, difficulty);
  const result = [];
  for (let i = 0; i < count; i++) {
    result.push(source[Math.floor(Math.random() * source.length)]);
  }
  return result;
}

function showScreen(name) {
  setupScreen.classList.toggle("hidden", name !== "setup");
  gameScreen.classList.toggle("hidden", name !== "game");
  resultScreen.classList.toggle("hidden", name !== "result");
}

function setNotice(message) {
  notice.textContent = message || "";
}

function setStartButton(enabled, text) {
  startBtn.disabled = !enabled;
  startBtn.textContent = text;
}

// ================================================
// 4. 注音轉換（含聲調）
// ================================================

// 拼音（帶數字聲調）→ 注音對照
const PINYIN_INITIALS = {
  b: "ㄅ", p: "ㄆ", m: "ㄇ", f: "ㄈ",
  d: "ㄉ", t: "ㄊ", n: "ㄋ", l: "ㄌ",
  g: "ㄍ", k: "ㄎ", h: "ㄏ",
  j: "ㄐ", q: "ㄑ", x: "ㄒ",
  zh: "ㄓ", ch: "ㄔ", sh: "ㄕ", r: "ㄖ",
  z: "ㄗ", c: "ㄘ", s: "ㄙ"
};

const PINYIN_FINALS = {
  a: "ㄚ", o: "ㄛ", e: "ㄜ", er: "ㄦ",
  ai: "ㄞ", ei: "ㄟ", ao: "ㄠ", ou: "ㄡ",
  an: "ㄢ", en: "ㄣ", ang: "ㄤ", eng: "ㄥ",
  ong: "ㄨㄥ",
  i: "ㄧ", ia: "ㄧㄚ", ie: "ㄧㄝ", iao: "ㄧㄠ",
  iu: "ㄧㄡ", ian: "ㄧㄢ", in: "ㄧㄣ",
  iang: "ㄧㄤ", ing: "ㄧㄥ", iong: "ㄩㄥ",
  u: "ㄨ", ua: "ㄨㄚ", uo: "ㄨㄛ", uai: "ㄨㄞ",
  ui: "ㄨㄟ", uan: "ㄨㄢ", un: "ㄨㄣ",
  uang: "ㄨㄤ", ueng: "ㄨㄥ",
  ü: "ㄩ", üe: "ㄩㄝ", üan: "ㄩㄢ", ün: "ㄩㄣ",
  // 特殊拼寫
  v: "ㄩ", ve: "ㄩㄝ", van: "ㄩㄢ", vn: "ㄩㄣ"
};

// 聲調符號（注音使用輕聲、ˊ、ˇ、ˋ）
const TONE_MARKS = {
  1: "",       // 一聲不標
  2: "ˊ",
  3: "ˇ",
  4: "ˋ",
  5: "˙"       // 輕聲
};

// 把單一拼音音節（例如 "zhuang4"）轉成注音（例如 "ㄓㄨㄤˋ"）
function pinyinSyllableToZhuyin(syllable) {
  if (!syllable) return "";
  const match = syllable.toLowerCase().match(/^([a-züv]+)([1-5])?$/);
  if (!match) return syllable;

  let body = match[1];
  const tone = match[2] ? Number(match[2]) : 1;

  // 處理 ü 的各種寫法
  body = body.replace(/ü/g, "v").replace(/u:/g, "v");

  // 先找聲母（最長優先）
  let initial = "";
  let finalPart = body;

  const initialCandidates = ["zh", "ch", "sh", "b", "p", "m", "f",
    "d", "t", "n", "l", "g", "k", "h", "j", "q", "x",
    "r", "z", "c", "s"];

  for (const cand of initialCandidates) {
    if (body.startsWith(cand)) {
      initial = cand;
      finalPart = body.slice(cand.length);
      break;
    }
  }

  // 處理 y、w 開頭的整體認讀音節
  // 例如 yi→i, ya→ia, ye→ie, yao→iao, you→iu, yan→ian,
  // yin→in, yang→iang, ying→ing, yong→iong
  // wu→u, wa→ua, wo→uo, wai→uai, wei→ui, wan→uan,
  // wen→un, wang→uang, weng→ueng
  if (body === "yi") { initial = ""; finalPart = "i"; }
  else if (body === "ya") { initial = ""; finalPart = "ia"; }
  else if (body === "ye") { initial = ""; finalPart = "ie"; }
  else if (body === "yao") { initial = ""; finalPart = "iao"; }
  else if (body === "you") { initial = ""; finalPart = "iu"; }
  else if (body === "yan") { initial = ""; finalPart = "ian"; }
  else if (body === "yin") { initial = ""; finalPart = "in"; }
  else if (body === "yang") { initial = ""; finalPart = "iang"; }
  else if (body === "ying") { initial = ""; finalPart = "ing"; }
  else if (body === "yong") { initial = ""; finalPart = "iong"; }
  else if (body === "yu") { initial = ""; finalPart = "v"; }
  else if (body === "yue") { initial = ""; finalPart = "ve"; }
  else if (body === "yuan") { initial = ""; finalPart = "van"; }
  else if (body === "yun") { initial = ""; finalPart = "vn"; }
  else if (body === "wu") { initial = ""; finalPart = "u"; }
  else if (body === "wa") { initial = ""; finalPart = "ua"; }
  else if (body === "wo") { initial = ""; finalPart = "uo"; }
  else if (body === "wai") { initial = ""; finalPart = "uai"; }
  else if (body === "wei") { initial = ""; finalPart = "ui"; }
  else if (body === "wan") { initial = ""; finalPart = "uan"; }
  else if (body === "wen") { initial = ""; finalPart = "un"; }
  else if (body === "wang") { initial = ""; finalPart = "uang"; }
  else if (body === "weng") { initial = ""; finalPart = "ueng"; }

  // 處理 j/q/x 後面接 u 的情況（實際是 ü）
  if (["j", "q", "x"].includes(initial) && finalPart.startsWith("u")) {
    finalPart = "v" + finalPart.slice(1);
    // 修正 ve, van, vn
    if (finalPart === "ve") finalPart = "ve";
  }

  // 處理 iu、ui、un 等縮寫
  if (finalPart === "iu") finalPart = "iu";
  if (finalPart === "ui") finalPart = "ui";
  if (finalPart === "un") finalPart = "un";

  const initialZhuyin = PINYIN_INITIALS[initial] || "";
  let finalZhuyin = PINYIN_FINALS[finalPart];

  if (finalZhuyin === undefined) {
    // 嘗試組合
    finalZhuyin = "";
    // 有時候 finalPart 是 "ueng" 等
    if (PINYIN_FINALS[finalPart]) {
      finalZhuyin = PINYIN_FINALS[finalPart];
    } else {
      // 逐字嘗試
      for (const key of Object.keys(PINYIN_FINALS)) {
        if (finalPart === key) {
          finalZhuyin = PINYIN_FINALS[key];
          break;
        }
      }
    }
  }

  if (!finalZhuyin) {
    // 最後備援：直接回傳原始拼音
    return body + (tone !== 1 ? TONE_MARKS[tone] : "");
  }

  // 處理 ㄓㄔㄕㄖㄗㄘㄙ 單獨成音節時要加 ㄭ
  if (!finalPart && ["zh", "ch", "sh", "r", "z", "c", "s"].includes(initial)) {
    finalZhuyin = "ㄭ";
  }

  const toneMark = TONE_MARKS[tone] || "";
  return initialZhuyin + finalZhuyin + toneMark;
}

// 取得單一字的注音（含聲調）
function getZhuyinWithTone(char) {
  if (!char) return "";
  if (typeof pinyinPro === "undefined") return "（注音套件未載入）";

  try {
    // 先嘗試 pinyin-pro 是否直接支援 zhuyin
    if (typeof pinyinPro.pinyin === "function") {
      const direct = pinyinPro.pinyin(char, {
        toneType: "num",
        type: "array",
        multiple: false
      });
      // 直接用拼音轉注音
      const values = Array.isArray(direct) ? direct : [direct];
      if (values.length && values[0]) {
        const syllables = String(values[0]).split(/\s+/);
        return syllables
          .map(s => pinyinSyllableToZhuyin(s))
          .join(" ");
      }
    }
  } catch (error) {
    console.error("注音轉換失敗：", error);
  }

  return "（無法取得注音）";
}

// ================================================
// 5. 開始遊戲
// ================================================

function startGame() {
  if (busy || matchmaking) return;

  setNotice("");

  const count = Number(
    document.getElementById("word-count").value
  );

  if (!Number.isFinite(count) || count < 1) {
    setNotice("請輸入 1～1000 之間的題目數量。");
    return;
  }

  totalTargetCount = Math.min(1000, Math.floor(count));
  document.getElementById("word-count").value = totalTargetCount;

  currentMode = document.getElementById("mode").value;
  currentDifficulty = document.getElementById("difficulty").value;
  playMode = document.getElementById("play-mode").value;
  playerName = (
    document.getElementById("player-name").value.trim() || "玩家"
  ).slice(0, 16);

  if (playMode === "practice") {
    startPractice();
  } else {
    startDuel();
  }
}

// ================================================
// 6. 個人練習
// ================================================

function startPractice() {
  stopListening();

  currentRoomId = null;
  latestRoom = null;
  finished = false;
  busy = false;
  currentIndex = 0;

  wordQueue = randomWords(currentMode, totalTargetCount, currentDifficulty);

  showScreen("game");
  duelInfo.classList.add("hidden");

  createNewInput();
  updateDisplay();

  startTime = Date.now();
}

function createNewInput() {
  inputWrapper.innerHTML = "";

  const input = document.createElement("input");
  input.type = "text";
  input.autocomplete = "off";
  input.autocapitalize = "off";
  input.spellcheck = false;
  input.placeholder = "直接打字／選字，不用按 Enter";

  input.addEventListener("input", checkAnswer);

  input.addEventListener("compositionend", () => {
    setTimeout(checkAnswer, 0);
  });

  inputWrapper.appendChild(input);
  activeInput = input;

  setTimeout(() => {
    if (activeInput === input && !finished) input.focus();
  }, 0);
}

function updateDisplay() {
  wordDisplay.innerHTML = "";
  zhuyinArea.innerHTML = "";

  // 只顯示當前題目，不預覽下一個字
  const target = wordQueue[currentIndex];

  if (target) {
    const card = document.createElement("div");
    card.className = "char-card active";
    card.textContent = target;
    wordDisplay.appendChild(card);

    // 練習模式 + 中文：顯示「看注音」按鈕
    if (playMode === "practice" && currentMode === "zh") {
      const toggleBtn = document.createElement("button");
      toggleBtn.type = "button";
      toggleBtn.className = "zhuyin-toggle";
      toggleBtn.textContent = "👀 看注音";

      const answerDiv = document.createElement("div");
      answerDiv.className = "zhuyin-answer";

      toggleBtn.addEventListener("click", function () {
        if (answerDiv.classList.contains("show")) {
          answerDiv.classList.remove("show");
          toggleBtn.textContent = "👀 看注音";
        } else {
          answerDiv.textContent = getZhuyinWithTone(target);
          answerDiv.classList.add("show");
          toggleBtn.textContent = "🙈 收起注音";
        }
      });

      zhuyinArea.appendChild(toggleBtn);
      zhuyinArea.appendChild(answerDiv);
    }
  }

  progressInfo.textContent =
    `進度：${currentIndex} / ${totalTargetCount}`;
}

// ================================================
// 7. 答案判定
// ================================================

function getPinyinKeys(char) {
  if (!char) return [];

  if (typeof pinyinPro === "undefined") {
    return [char];
  }

  try {
    const result = pinyinPro.pinyin(char, {
      toneType: "none",
      type: "array",
      multiple: true
    });

    const values = Array.isArray(result) ? result : [result];

    return [...new Set(
      values.map(value => String(value).toLowerCase())
    )];
  } catch (error) {
    return [char];
  }
}

function isSameSound(char1, char2) {
  if (char1 === char2) return true;

  const first = getPinyinKeys(char1);
  const second = getPinyinKeys(char2);

  return first.some(sound => second.includes(sound));
}

function isCorrectAnswer(value, target) {
  if (!value || !target) return false;

  if (currentMode === "zh") {
    for (const char of value) {
      if (isSameSound(char, target)) return true;
    }
    return false;
  }

  return value.toUpperCase().includes(target.toUpperCase());
}

function checkAnswer() {
  if (!activeInput || finished || busy) return;

  if (playMode === "duel") {
    checkDuelAnswer();
    return;
  }

  const target = wordQueue[currentIndex];
  const value = activeInput.value.trim();

  if (!value || !isCorrectAnswer(value, target)) return;

  currentIndex++;

  if (currentIndex >= wordQueue.length) {
    endPractice();
  } else {
    createNewInput();
    updateDisplay();
  }
}

function endPractice() {
  finished = true;

  const seconds = (Date.now() - startTime) / 1000;

  document.getElementById("result-title").textContent = "練習完成！";
  document.getElementById("result-line-1").innerHTML =
    `總共耗時：<span class="result-value">${seconds.toFixed(2)}</span> 秒`;

  document.getElementById("result-line-2").innerHTML =
    `平均每題：<span class="result-value">${
      (seconds / totalTargetCount).toFixed(2)
    }</span> 秒`;

  showScreen("result");
}

// ================================================
// 8. Firebase 初始化
// ================================================

function initializeFirebase() {
  if (typeof firebase === "undefined") {
    throw new Error(
      "Firebase SDK 載入失敗，請檢查網路或 CDN 是否被阻擋。"
    );
  }

  if (!firebase.apps.length) {
    firebase.initializeApp({
      databaseURL: FIREBASE_URL
    });
  }

  db = firebase.database();
  rootRef = db.ref("typingDuel");

  return rootRef;
}

// ================================================
// 9. 線上配對
// ================================================

async function startDuel() {
  stopListening();

  busy = true;
  matchmaking = true;
  finished = false;

  currentRoomId = null;
  latestRoom = null;
  lastRoomIndex = -1;
  currentIndex = 0;

  currentMatchToken = randomId();
  playerId = getPlayerId();

  setStartButton(false, "連線中……");
  showScreen("game");

  duelInfo.classList.remove("hidden");
  duelStatus.textContent = "正在尋找新的對手……";
  duelScore.textContent = "你 0 : 0 對手";

  wordDisplay.innerHTML = "";
  zhuyinArea.innerHTML = "";
  inputWrapper.innerHTML = "";
  progressInfo.textContent = "正在配對……";

  try {
    initializeFirebase();
    await findOpponent();
  } catch (error) {
    console.error(error);
    stopListening();

    duelStatus.textContent = "配對失敗";
    progressInfo.textContent =
      error.message || "請檢查 Firebase 設定與網路。";

    busy = false;
    matchmaking = false;

    setStartButton(true, "開始遊戲");
  }
}

async function findOpponent() {
  const newRoomId = randomId();
  const myMatchToken = currentMatchToken;
  const myDifficulty =
    currentMode === "zh" ? currentDifficulty : "simple";

  const transaction = await rootRef.transaction(state => {
    state = state || {};
    state.rooms = state.rooms || {};

    const now = Date.now();

    for (const [id, room] of Object.entries(state.rooms)) {
      if (now - (room.createdAt || 0) > 3600000) {
        delete state.rooms[id];
      }
    }

    let waiting = state.waiting;

    if (
      waiting &&
      now - (waiting.createdAt || 0) > 60000
    ) {
      state.waiting = null;
      waiting = null;
    }

    if (waiting && waiting.playerId === playerId) {
      state.waiting = null;
      waiting = null;
    }

    if (waiting && waiting.playerId !== playerId) {
      const roomMode = waiting.mode === "en" ? "en" : "zh";
      const roomDifficulty =
        roomMode === "zh"
          ? (waiting.difficulty === "hard" ? "hard" : "simple")
          : "simple";

      const roomCount = Math.max(
        1,
        Math.min(1000, Math.floor(Number(waiting.count) || 20))
      );

      const source = getCharSource(roomMode, roomDifficulty);

      const words = [];
      for (let i = 0; i < roomCount; i++) {
        words.push(
          source[Math.floor(Math.random() * source.length)]
        );
      }

      state.rooms[newRoomId] = {
        id: newRoomId,
        status: "playing",
        mode: roomMode,
        difficulty: roomDifficulty,
        words: words,
        index: 0,
        createdAt: now,

        matchTokens: {
          [waiting.playerId]: waiting.matchToken,
          [playerId]: myMatchToken
        },

        players: {
          [waiting.playerId]: {
            name: waiting.name || "玩家",
            score: 0
          },
          [playerId]: {
            name: playerName,
            score: 0
          }
        }
      };

      state.waiting = null;
    } else {
      state.waiting = {
        playerId: playerId,
        matchToken: myMatchToken,
        name: playerName,
        mode: currentMode,
        difficulty: myDifficulty,
        count: totalTargetCount,
        createdAt: now
      };
    }

    return state;
  }, undefined, false);

  if (!transaction.committed) {
    throw new Error("配對資料寫入失敗，請重新開始。");
  }

  if (currentMatchToken !== myMatchToken) {
    return;
  }

  listenForUpdates();
}

function listenForUpdates() {
  stopListening();

  const myMatchToken = currentMatchToken;

  rootListener = snapshot => {
    if (currentMatchToken !== myMatchToken) {
      return;
    }

    if (!matchmaking && !currentRoomId) {
      return;
    }

    const state = snapshot.val() || {};
    const rooms = state.rooms || {};

    let foundRoom = null;

    for (const room of Object.values(rooms)) {
      if (!room.players || !room.players[playerId]) {
        continue;
      }

      const token = room.matchTokens &&
        room.matchTokens[playerId];

      if (token !== myMatchToken) {
        continue;
      }

      foundRoom = room;
      break;
    }

    if (foundRoom) {
      currentRoomId = foundRoom.id;
      latestRoom = foundRoom;

      matchmaking = false;
      busy = false;

      currentMode = foundRoom.mode;
      currentDifficulty =
        foundRoom.difficulty === "hard" ? "hard" : "simple";
      wordQueue = foundRoom.words || [];
      totalTargetCount = wordQueue.length;

      setStartButton(true, "開始遊戲");

      renderDuel(foundRoom);
      return;
    }

    const waiting = state.waiting;

    if (
      waiting &&
      waiting.playerId === playerId &&
      waiting.matchToken === myMatchToken
    ) {
      duelStatus.textContent =
        "配對中……請等待另一位玩家。";

      progressInfo.textContent =
        "配對成功後會自動開始。";
    }
  };

  rootRef.on(
    "value",
    rootListener,
    error => {
      if (currentMatchToken !== myMatchToken) {
        return;
      }

      console.error(error);

      duelStatus.textContent = "Firebase 讀取失敗";
      progressInfo.textContent =
        error.message || "請檢查資料庫 Rules。";

      busy = false;
      matchmaking = false;

      stopListening();
      setStartButton(true, "開始遊戲");
    }
  );
}

// ================================================
// 10. 對戰畫面與搶答
// ================================================

function renderDuel(room) {
  if (!room || !room.players) return;

  const mine = room.players[playerId];
  if (!mine) return;

  const opponentEntry = Object.entries(room.players)
    .find(([id]) => id !== playerId);

  const opponent = opponentEntry ? opponentEntry[1] : null;

  duelScore.textContent =
    `${mine.name} ${mine.score || 0} : ${
      opponent ? opponent.score || 0 : 0
    } ${opponent ? opponent.name : "對手"}`;

  if (room.status === "finished") {
    endDuel(room);
    return;
  }

  if (!opponent) {
    duelStatus.textContent = "等待對手加入……";
    return;
  }

  duelStatus.textContent = "對戰中！搶先答對就能得分。";

  if (room.index !== lastRoomIndex) {
    lastRoomIndex = room.index;
    currentIndex = room.index;
    busy = false;

    if (currentIndex < wordQueue.length) {
      createNewInput();
      updateDisplay();
    }
  }

  progressInfo.textContent =
    `搶答進度：${Math.min(room.index, totalTargetCount)} / ${totalTargetCount}`;
}

async function checkDuelAnswer() {
  if (
    !activeInput ||
    !currentRoomId ||
    !latestRoom ||
    busy ||
    finished ||
    matchmaking
  ) return;

  const expectedIndex = currentIndex;
  const target = wordQueue[expectedIndex];
  const value = activeInput.value.trim();

  if (!value || !isCorrectAnswer(value, target)) return;

  busy = true;
  activeInput.disabled = true;

  try {
    const result = await rootRef.transaction(state => {
      if (!state || !state.rooms) return;

      const room = state.rooms[currentRoomId];

      if (
        !room ||
        room.status !== "playing" ||
        room.index !== expectedIndex ||
        !room.players ||
        !room.players[playerId]
      ) {
        return;
      }

      room.players[playerId].score =
        (room.players[playerId].score || 0) + 1;

      room.index++;

      if (room.index >= room.words.length) {
        room.status = "finished";
        room.finishedAt = Date.now();
      }

      return state;
    }, undefined, false);

    if (!result.committed) {
      busy = false;

      if (activeInput) {
        activeInput.value = "";
        activeInput.disabled = false;
      }
    }
  } catch (error) {
    console.error(error);
    busy = false;

    if (activeInput) {
      activeInput.disabled = false;
      activeInput.focus();
    }

    duelStatus.textContent = "答案送出失敗，請檢查連線。";
  }
}

function endDuel(room) {
  finished = true;
  busy = false;
  matchmaking = false;

  const players = room.players || {};
  const mine = players[playerId];

  if (!mine) return;

  const opponentEntry = Object.entries(players)
    .find(([id]) => id !== playerId);

  const opponent = opponentEntry ? opponentEntry[1] : null;
  const myScore = mine.score || 0;
  const opponentScore = opponent ? opponent.score || 0 : 0;

  let title = "平手！";

  if (myScore > opponentScore) title = "🏆 對決勝利！";
  if (myScore < opponentScore) title = "再接再厲！";

  document.getElementById("result-title").textContent = title;

  document.getElementById("result-line-1").innerHTML =
    `你的得分：<span class="result-value">${myScore}</span> 分`;

  document.getElementById("result-line-2").innerHTML =
    `對手得分：<span class="result-value">${opponentScore}</span> 分`;

  showScreen("result");
}

// ================================================
// 11. 離開、重新開始
// ================================================

function stopListening() {
  if (rootRef && rootListener) {
    rootRef.off("value", rootListener);
  }
  rootListener = null;
}

async function resetToSetup() {
  const oldPlayerId = playerId;
  const oldMatchToken = currentMatchToken;

  stopListening();

  currentMatchToken = randomId();

  finished = true;
  busy = false;
  matchmaking = false;

  currentRoomId = null;
  latestRoom = null;
  activeInput = null;
  lastRoomIndex = -1;

  wordQueue = [];
  currentIndex = 0;

  wordDisplay.innerHTML = "";
  zhuyinArea.innerHTML = "";
  inputWrapper.innerHTML = "";
  progressInfo.textContent = "";

  showScreen("setup");
  duelInfo.classList.add("hidden");

  setNotice("");
  setStartButton(true, "開始遊戲");

  document.getElementById("result-title").textContent =
    "成績統計";

  if (rootRef && oldPlayerId && oldMatchToken) {
    try {
      await rootRef.transaction(state => {
        if (!state) return state;

        const waiting = state.waiting;

        if (
          waiting &&
          waiting.playerId === oldPlayerId &&
          waiting.matchToken === oldMatchToken
        ) {
          state.waiting = null;
        }

        return state;
      }, undefined, false);
    } catch (error) {
      console.error("清理等待資料失敗：", error);
    }
  }
};
