<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>爆炸 | Raingod</title>
    <style>
        :root { 
            --neon: #00f2ff; --pink: #ff007b; --gold: #ffcc00; --purple: #bc13fe; 
            --bg: #020205; --white: #ffffff; --emerald: #00ff88; --orange: #ff6600;
        }
        html, body { 
            margin: 0; padding: 0; height: 100%; overflow: hidden; 
            background: var(--bg); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; flex-direction: column; 
            -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
        }
        #nav_bar { height: 60px; background: #0a0a14; border-bottom: 1px solid #333; z-index: 100; }
        #game-container { 
            flex-grow: 1; position: relative; overflow: hidden; 
            cursor: crosshair; touch-action: none; 
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        /* UI Overlay */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; padding: 15px; box-sizing: border-box; z-index: 10; }
        .stat-group { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
        .panel { background: rgba(0, 0, 0, 0.85); border: 1px solid #222; border-left: 4px solid var(--neon); padding: 8px 15px; backdrop-filter: blur(5px); }
        .label { color: #888; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .value { color: #fff; font-size: 18px; font-weight: 900; }
        
        .ctrl-btn { padding: 10px 14px; background: #111; color: #fff; border: 1px solid var(--pink); cursor: pointer; pointer-events: auto; font-weight: bold; font-size: 12px; transition: 0.2s; }
        .ctrl-btn:active { background: var(--pink); color: #000; }
        .ctrl-btn:disabled { color: #777; border-color: #555; cursor: not-allowed; opacity: 0.6; }

        /* Boss Gauge */
        #boss-hud {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            width: 60%; max-width: 500px; display: none; flex-direction: column; align-items: center; z-index: 30;
        }
        #boss-name { color: var(--pink); font-weight: 900; letter-spacing: 2px; margin-bottom: 4px; text-shadow: 0 0 10px var(--pink); }
        #boss-bar-wrap { width: 100%; height: 14px; background: rgba(0,0,0,0.8); border: 2px solid var(--pink); border-radius: 7px; overflow: hidden; }
        #boss-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, var(--pink), var(--purple)); transition: width 0.1s linear; }

        /* Modal Windows */
        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 90%; max-width: 500px; height: 75vh; 
            overflow-y: auto; background: rgba(5, 5, 12, 0.98); 
            border: 2px solid var(--neon); padding: 20px; display: none; 
            pointer-events: auto; z-index: 100; touch-action: auto;
            box-shadow: 0 0 30px rgba(0,242,255,0.2);
        }
        .card { background: #0a0a0f; margin-bottom: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; }
        .card-title { color: var(--neon); font-size: 14px; font-weight: bold; }
        .btn-act { background: var(--gold); border: none; padding: 8px 12px; font-weight: 900; min-width: 80px; cursor: pointer; }
        .btn-act:disabled { background: #333; color: #666; cursor: not-allowed; }

        #combo-wrap { position: absolute; bottom: 20px; left: 20px; }
        .combo-n { font-size: 45px; color: #fff; line-height: 0.7; font-style: italic; font-weight: 900; opacity: 0.5; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--neon); }
    </style>
</head>
<body>
    
<link rel="stylesheet" href="menu.css">
<div id="nav_bar"></div>
<script src="menu.js"></script>

    <div id="game-container">
        <canvas id="canvas"></canvas>
        <div id="hud">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div class="stat-group">
                    <div class="panel"><div class="label">CREDITS</div><div class="value">$ <span id="money-display">0</span></div></div>
                    <div class="panel" style="border-left-color: var(--pink);"><div class="label">POWER</div><div class="value">ATK <span id="damage-display">1</span></div></div>
                    <div class="panel" style="border-left-color: var(--gold);"><div class="label">TALENT PTS</div><div class="value">TP <span id="tp-display">0</span></div></div>
                </div>
                <div class="stat-group">
                    <button class="ctrl-btn" onclick="toggleModal('shop-window')">商店 (SHOP)</button>
                    <button class="ctrl-btn" style="border-color:var(--gold)" onclick="toggleModal('talent-window')">天賦 (TALENTS)</button>
                    <button id="leaderboard-btn" class="ctrl-btn" style="border-color:var(--neon)" onclick="toggleLeaderboard()">登入後查看排行榜</button>
                    <button id="boss-btn" class="ctrl-btn" style="border-color:var(--pink); background:#200;" onclick="spawnBoss()">召喚 BOSS</button>
                    <button id="prestige-btn" class="ctrl-btn" style="border-color: var(--gold); display:none;" onclick="doPrestige()">轉生 (ASCEND)</button>
                </div>
            </div>
            
            <!-- Boss HUD -->
            <div id="boss-hud">
                <div id="boss-name">BOSS ENTERING...</div>
                <div id="boss-bar-wrap"><div id="boss-bar-fill"></div></div>
            </div>

            <div id="combo-wrap">
                <div class="label" style="color:var(--neon)">CHAIN STREAK</div>
                <div class="combo-n" id="combo-display">0</div>
            </div>
        </div>
        
        <!-- 商店 Modal -->
        <div id="shop-window" class="modal">
            <h2 style="color:#fff; border-bottom: 2px solid var(--neon); padding-bottom:10px; margin-top:0;">基礎強化 (UPGRADES)</h2>
            <div id="shop-content"></div>
            <button onclick="toggleModal('shop-window')" style="width:100%; margin-top:20px; padding:12px; background:#222; color:#fff; border:none; cursor:pointer; font-weight:bold;">關閉</button>
        </div>

        <!-- 天賦樹 Modal -->
        <div id="talent-window" class="modal">
            <h2 style="color:var(--gold); border-bottom: 2px solid var(--gold); padding-bottom:10px; margin-top:0;">天賦天梯樹 (TALENT TREE)</h2>
            <p style="color:#aaa; font-size:12px;">透過轉生獲得天賦點數 (TP)，天賦效果跨轉生永久保留。</p>
            <div id="talent-content"></div>
            <button onclick="toggleModal('talent-window')" style="width:100%; margin-top:20px; padding:12px; background:#222; color:#fff; border:none; cursor:pointer; font-weight:bold;">關閉</button>
        </div>

        <div id="leaderboard-window" class="modal">
            <h2 style="color:var(--neon); border-bottom:2px solid var(--neon); padding-bottom:10px; margin-top:0;">🏆 轉生排行榜</h2>
            <p id="leaderboard-status" style="color:#aaa; font-size:12px;">登入帳號後即可查看排行榜。</p>
            <div id="leaderboard-list"></div>
            <button onclick="refreshLeaderboard()" style="width:100%; margin-top:10px; padding:12px; background:#123; color:#fff; border:1px solid var(--neon); cursor:pointer; font-weight:bold;">重新整理</button>
            <button onclick="toggleModal('leaderboard-window')" style="width:100%; margin-top:10px; padding:12px; background:#222; color:#fff; border:none; cursor:pointer; font-weight:bold;">關閉</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');

        const MOB_TYPES = {
            COMMON:   { name: 'Drone', color: '#00f2ff', hp: 2, reward: 15, size: 30, behavior: 'normal' },
            ELITE:    { name: 'Hunter', color: '#ff007b', hp: 12, reward: 120, size: 45, behavior: 'fast' },
            VOID:     { name: 'Void', color: '#bc13fe', hp: 60, reward: 750, size: 55, behavior: 'sine' },
            MAGMA:    { name: 'Magma', color: '#ff6600', hp: 300, reward: 4500, size: 65, behavior: 'jitter' },
            SOLAR:    { name: 'Solar', color: '#ffcc00', hp: 1800, reward: 30000, size: 85, behavior: 'pulse' },
            RAINGOD:  { name: 'RAINGOD', color: '#00ff88', hp: 12000, reward: 250000, size: 140, behavior: 'chaos' },
            CREATOR:  { name: '創世神', color: '#ffeeaa', hp: 100000, reward: 2500000, size: 180, behavior: 'vortex' },
            ZENITH:   { name: '絕對頂點', color: '#ffffff', hp: 800000, reward: 20000000, size: 210, behavior: 'chaos' }
        };

        const SAVE_KEY = 'raingod_eternal_v3_save';
        const LEADERBOARD_URL = 'https://game-24b43-default-rtdb.firebaseio.com/explosion_clicker_leaderboard';
        let gameData = createDefaultGameData();

        let width, height, combo = 0;
        let cubes = [], particles = [], floaters = [];
        let activeBoss = null;
        let gameStarted = false;
        let leaderboardTimer = null;

        // BOSS 冷卻與動態難度變數
        let bossSpawnCount = 0;
        let bossCooldownTime = 0;
        let bossCooldownTimer = null;

        async function init() {
            width = canvas.width = container.clientWidth;
            height = canvas.height = container.clientHeight;
            await window.raingodFirebaseReady;
            await window.raingodAuthReady;
            window.raingodBindStorage('explosion-clicker', [SAVE_KEY], { [SAVE_KEY]: null }, data => {
                gameData = createDefaultGameData();
                loadGame(data[SAVE_KEY]);
                gameStarted = true;
                refreshUI();
                scheduleLeaderboardUpload();
            });
            window.raingodOnAuthStateChanged(user => {
                const button = document.getElementById('leaderboard-btn');
                button.textContent = user ? '排行榜 (RANK)' : '登入後查看排行榜';
                if (!user) {
                    document.getElementById('leaderboard-window').style.display = 'none';
                    document.getElementById('leaderboard-list').replaceChildren();
                    document.getElementById('leaderboard-status').textContent = '登入帳號後即可查看排行榜。';
                }
            });
        }

        function createDefaultGameData() {
            return {
                money: 0, totalEarned: 0, prestige: 1, tp: 0,
                upgrades: {
                    damage: { lv: 1, cost: 25, mult: 1.35, name: "量子核心", desc: "提升每次點擊的基礎攻擊力" },
                    range: { lv: 1, cost: 100, mult: 1.45, name: "共振距離", desc: "擴大連鎖爆炸的傳播範圍" },
                    luck: { lv: 1, cost: 200, mult: 1.8, name: "命運干涉", desc: "提高高階與極稀有怪出現機率" }
                },
                talents: {
                    critDmg: { lv: 0, max: 10, cost: 1, name: "超頻暴擊", desc: "暴擊傷害倍率 +50% / 級" },
                    chainAtk: { lv: 0, max: 5, cost: 2, name: "量子連鎖", desc: "連鎖傳導傷害提升 +15% / 級" },
                    goldMult: { lv: 0, max: 10, cost: 1, name: "點金術", desc: "所有金幣收益增加 +20% / 級" }
                }
            };
        }

        function saveGame() {
            if (!gameStarted) return;
            localStorage.setItem(SAVE_KEY, JSON.stringify(gameData));
            scheduleLeaderboardUpload();
        }

        function loadGame() {
            const localData = localStorage.getItem(SAVE_KEY);
            if (localData) {
                try {
                    const parsed = JSON.parse(localData);
                    gameData = { ...gameData, ...parsed };
                    // 確保舊存檔相容 luck 屬性
                    if (!gameData.upgrades.luck) {
                        gameData.upgrades.luck = { lv: 1, cost: 200, mult: 1.8, name: "命運干涉", desc: "提高高階與極稀有怪出現機率" };
                    }
                } catch(e) { console.error(e); }
            }
        }

        function getAtkPower() {
            let baseDmg = gameData.upgrades.damage.lv;
            let mult = Math.pow(1.3, gameData.upgrades.damage.lv - 1) * Math.pow(2.0, gameData.prestige - 1);
            return Math.floor(baseDmg * mult);
        }

        function getUpgradeCost(upKey) {
            const up = gameData.upgrades[upKey];
            return Math.floor(up.cost * Math.pow(up.mult, up.lv - 1));
        }

        class Cube {
            constructor() {
                const roll = Math.random();
                // 命運干涉 (Luck) 等級越高，稀有怪機率提升越明顯
                const luckFactor = (gameData.upgrades.luck.lv - 1) * 0.03;

                if (roll < 0.0005 + luckFactor * 0.005)     this.type = MOB_TYPES.ZENITH;
                else if (roll < 0.003 + luckFactor * 0.015) this.type = MOB_TYPES.CREATOR;
                else if (roll < 0.015 + luckFactor * 0.035) this.type = MOB_TYPES.RAINGOD;
                else if (roll < 0.05 + luckFactor * 0.06)   this.type = MOB_TYPES.SOLAR;
                else if (roll < 0.12 + luckFactor * 0.08)   this.type = MOB_TYPES.MAGMA;
                else if (roll < 0.22 + luckFactor * 0.10)   this.type = MOB_TYPES.VOID;
                else if (roll < 0.40)                       this.type = MOB_TYPES.ELITE;
                else                                        this.type = MOB_TYPES.COMMON;

                this.x = Math.random() * (width - 100) + 50;
                this.y = Math.random() * (height - 100) + 50;
                this.size = this.type.size;

                const hpScale = Math.pow(1.15, gameData.prestige - 1);
                this.hp = Math.max(1, Math.floor(this.type.hp * hpScale));
                this.maxHp = this.hp;
                this.color = this.type.color;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.tick = Math.random() * 100;
                this.dead = false;
            }

            update() {
                this.tick += 0.05;
                switch(this.type.behavior) {
                    case 'fast': this.x += this.vx * 2.5; this.y += this.vy * 2.5; break;
                    case 'sine': this.x += this.vx; this.y += Math.sin(this.tick) * 4; break;
                    case 'jitter': this.x += this.vx + (Math.random()-0.5)*4; this.y += this.vy + (Math.random()-0.5)*4; break;
                    case 'pulse': this.size = this.type.size + Math.sin(this.tick * 2) * 6; this.x += this.vx; this.y += this.vy; break;
                    case 'vortex': this.x += this.vx + Math.cos(this.tick) * 3; this.y += this.vy + Math.sin(this.tick) * 3; break;
                    case 'chaos': this.vx += (Math.random()-0.5)*0.3; this.vy += (Math.random()-0.5)*0.3; this.x += this.vx; this.y += this.vy; break;
                    default: this.x += this.vx; this.y += this.vy;
                }
                
                if(this.x < 30 || this.x > width - 30) this.vx *= -1;
                if(this.y < 30 || this.y > height - 30) this.vy *= -1;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                ctx.shadowBlur = 10; ctx.shadowColor = this.color;
                ctx.strokeRect(-this.size/2, -this.size/2, this.size, this.size);
                
                let p = Math.max(0, this.hp / this.maxHp);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#111'; ctx.fillRect(-20, -this.size/2 - 12, 40, 5);
                ctx.fillStyle = this.color; ctx.fillRect(-20, -this.size/2 - 12, 40 * p, 5);
                ctx.restore();
            }

            explode() {
                combo++;
                let goldBonus = 1 + (gameData.talents.goldMult.lv * 0.2);
                let reward = this.type.reward * Math.pow(1.5, gameData.prestige - 1) * goldBonus;
                gameData.money += reward;
                gameData.totalEarned += reward;

                spawnEffect(this.x, this.y, this.color);
                spawnText(this.x, this.y, `+$${Math.floor(reward).toLocaleString()}`, this.color);

                let range = 100 + (gameData.upgrades.range.lv * 20);
                let chainFactor = 0.6 + (gameData.talents.chainAtk.lv * 0.15);

                cubes.forEach(c => {
                    if(!c.dead && Math.hypot(this.x - c.x, this.y - c.y) < range) {
                        setTimeout(() => c.takeDamage(getAtkPower() * chainFactor), 60);
                    }
                });

                if(gameData.totalEarned >= 50000) document.getElementById('prestige-btn').style.display = 'block';
                refreshUI(); saveGame();
            }

            takeDamage(dmg) {
                if(this.dead) return;

                let isCrit = Math.random() < 0.25;
                if(isCrit) {
                    let critMult = 2.0 + (gameData.talents.critDmg.lv * 0.5);
                    dmg *= critMult;
                    spawnText(this.x, this.y - 10, `CRIT! ${Math.floor(dmg).toLocaleString()}`, '#ffcc00', 16);
                }

                this.hp -= dmg;
                if(this.hp <= 0) { this.dead = true; this.explode(); }
            }
        }

        // --- 大 Boss 戰場機制 (防刷 TP 強化版) ---
        class Boss {
            constructor() {
                this.name = `【滅世核心·虛空主宰 MK-${bossSpawnCount + 1}】`;
                this.x = width / 2;
                this.y = height / 3;
                this.size = 180;
                
                // 基礎倍率 + 轉生倍率 + 本次召喚遞增指數 (每次召喚血量 * 1.8)
                let baseHp = 150000;
                let scale = Math.pow(1.8, gameData.prestige - 1) * Math.pow(1.8, bossSpawnCount);
                this.maxHp = Math.floor(baseHp * scale);
                this.hp = this.maxHp;
                this.color = "#ff007b";
                this.dead = false;

                document.getElementById('boss-hud').style.display = 'flex';
                document.getElementById('boss-name').innerText = this.name;
                this.updateBar();
            }

            updateBar() {
                let pct = Math.max(0, (this.hp / this.maxHp) * 100);
                document.getElementById('boss-bar-fill').style.width = `${pct}%`;
            }

            update() {
                this.x += Math.sin(Date.now() * 0.002) * 3;
                this.y += Math.cos(Date.now() * 0.001) * 1.5;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 6;
                ctx.shadowBlur = 25; ctx.shadowColor = this.color;
                ctx.strokeRect(-this.size/2, -this.size/2, this.size, this.size);

                ctx.rotate(Date.now() * 0.001);
                ctx.strokeStyle = '#00f2ff';
                ctx.lineWidth = 2;
                ctx.strokeRect(-this.size/4, -this.size/4, this.size/2, this.size/2);
                ctx.restore();
            }

            takeDamage(dmg) {
                if(this.dead) return;
                this.hp -= dmg;
                this.updateBar();

                spawnEffect(this.x + (Math.random()-0.5)*100, this.y + (Math.random()-0.5)*100, this.color);

                if(this.hp <= 0) {
                    this.dead = true;
                    this.onDefeat();
                }
            }

            onDefeat() {
                document.getElementById('boss-hud').style.display = 'none';
                activeBoss = null;
                bossSpawnCount++; // 召喚次數加 1

                let rewardMoney = this.maxHp * 1.2;
                let rewardTP = 2 + Math.floor(gameData.prestige * 1.2);
                
                gameData.money += rewardMoney;
                gameData.tp += rewardTP;

                spawnText(width/2, height/2, `BOSS CLEAR! +${rewardTP} TP`, '#ffcc00', 30);
                startBossCooldown(30); // 觸發 30 秒冷卻
                refreshUI(); saveGame();
            }
        }

        function startBossCooldown(seconds) {
            bossCooldownTime = seconds;
            const btn = document.getElementById('boss-btn');
            btn.disabled = true;

            clearInterval(bossCooldownTimer);
            bossCooldownTimer = setInterval(() => {
                bossCooldownTime--;
                if (bossCooldownTime <= 0) {
                    clearInterval(bossCooldownTimer);
                    btn.disabled = false;
                    btn.innerText = '召喚 BOSS';
                } else {
                    btn.innerText = `冷卻中 (${bossCooldownTime}s)`;
                }
            }, 1000);
        }

        function spawnBoss() {
            if(activeBoss || bossCooldownTime > 0) return;
            activeBoss = new Boss();
        }

        function refreshUI() {
            document.getElementById('money-display').innerText = Math.floor(gameData.money).toLocaleString();
            document.getElementById('damage-display').innerText = Math.floor(getAtkPower()).toLocaleString();
            document.getElementById('tp-display').innerText = gameData.tp;
            document.getElementById('combo-display').innerText = combo;
        }

        function spawnEffect(x, y, color) {
            for(let i=0; i<12; i++) {
                particles.push({ x, y, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10, life:1, color });
            }
        }

        function spawnText(x, y, txt, color, size = 14) {
            floaters.push({ x, y, txt, color, size, life:1.2, vy:-1.5 });
        }

        function toggleModal(id) {
            const el = document.getElementById(id);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
            if(el.style.display === 'block') {
                if(id === 'shop-window') renderShop();
                if(id === 'talent-window') renderTalents();
            }
        }

        window.toggleLeaderboard = async () => {
            if (!await window.raingodRequireAuth('排行榜')) return;
            const modal = document.getElementById('leaderboard-window');
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
            if (modal.style.display === 'block') await window.refreshLeaderboard();
        };

        window.refreshLeaderboard = async () => {
            const status = document.getElementById('leaderboard-status');
            const list = document.getElementById('leaderboard-list');
            if (!await window.raingodRequireAuth('排行榜')) return;
            const uid = window.raingodCurrentUser.uid;
            status.textContent = '排行榜載入中…';
            try {
                const response = await fetch(`${LEADERBOARD_URL}.json`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                if (window.raingodCurrentUser?.uid !== uid) return;
                const rows = await response.json() || {};
                const entries = Object.entries(rows)
                    .filter(([, row]) => row && Number.isFinite(Number(row.prestige)))
                    .map(([entryUid, row]) => ({ uid: entryUid, ...row }))
                    .sort((a, b) => Number(b.prestige) - Number(a.prestige) ||
                        Number(b.tp) - Number(a.tp) || Number(b.totalEarned) - Number(a.totalEarned))
                    .slice(0, 50);
                if (!entries.length) {
                    list.innerHTML = '<div class="card"><span style="color:#aaa">目前還沒有排行榜資料</span></div>';
                } else {
                    list.innerHTML = entries.map((entry, index) => `
                        <div class="card">
                            <span class="card-title">${index + 1}. ${escapeLeaderboardText(entry.name || '玩家')}</span>
                            <span style="color:#fff">轉生 ${Number(entry.prestige) || 1}｜TP ${Number(entry.tp) || 0}</span>
                        </div>`).join('');
                }
                status.textContent = `已載入 ${entries.length} 位玩家，依轉生次數排序。`;
            } catch (error) {
                console.error('載入爆炸點擊排行榜失敗：', error);
                status.textContent = '排行榜載入失敗，請稍後重試。';
            }
        };

        function escapeLeaderboardText(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[char]);
        }

        function scheduleLeaderboardUpload() {
            if (!gameStarted || !window.raingodCurrentUser) return;
            clearTimeout(leaderboardTimer);
            leaderboardTimer = setTimeout(uploadLeaderboardScore, 1200);
        }

        async function uploadLeaderboardScore() {
            const user = window.raingodCurrentUser;
            if (!gameStarted || !user) return;
            const uid = user.uid;
            const username = user.email ? user.email.split('@')[0] : '玩家';
            const payload = {
                name: username,
                prestige: Math.max(1, Number(gameData.prestige) || 1),
                tp: Math.max(0, Number(gameData.tp) || 0),
                totalEarned: Math.max(0, Number(gameData.totalEarned) || 0),
                updatedAt: Date.now()
            };
            try {
                const response = await fetch(`${LEADERBOARD_URL}/${encodeURIComponent(uid)}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
            } catch (error) {
                console.error('上傳爆炸點擊排行榜失敗：', error);
            }
        }

        function renderShop() {
            const cont = document.getElementById('shop-content');
            cont.innerHTML = '';
            for(let k in gameData.upgrades) {
                const up = gameData.upgrades[k];
                const cost = getUpgradeCost(k);
                cont.innerHTML += `<div class="card">
                    <div><div class="card-title">${up.name} [LV.${up.lv}]</div><small style="color:#888">${up.desc}</small></div>
                    <button class="btn-act" onclick="buyUpgrade('${k}')" ${gameData.money < cost ? 'disabled' : ''}>$${cost.toLocaleString()}</button>
                </div>`;
            }
        }

        function renderTalents() {
            const cont = document.getElementById('talent-content');
            cont.innerHTML = '';
            for(let k in gameData.talents) {
                const t = gameData.talents[k];
                const isMax = t.lv >= t.max;
                cont.innerHTML += `<div class="card">
                    <div><div class="card-title">${t.name} [LV.${t.lv}/${t.max}]</div><small style="color:#aaa">${t.desc}</small></div>
                    <button class="btn-act" onclick="buyTalent('${k}')" ${gameData.tp < t.cost || isMax ? 'disabled' : ''}>${isMax ? 'MAX' : t.cost + ' TP'}</button>
                </div>`;
            }
        }

        window.buyUpgrade = (k) => {
            const cost = getUpgradeCost(k);
            if(gameData.money >= cost) {
                gameData.money -= cost;
                gameData.upgrades[k].lv++;
                refreshUI(); saveGame();
                renderShop();
            }
        }

        window.buyTalent = (k) => {
            const t = gameData.talents[k];
            if(gameData.tp >= t.cost && t.lv < t.max) {
                gameData.tp -= t.cost;
                t.lv++;
                refreshUI(); saveGame();
                renderTalents();
            }
        }

        function doPrestige() {
            let tpEarned = Math.max(1, Math.floor(Math.log10(gameData.totalEarned) - 3));
            gameData.tp += tpEarned;
            gameData.prestige++;
            gameData.money = 0; gameData.totalEarned = 0;
            bossSpawnCount = 0; // 轉生時重置 BOSS 難度疊加

            for (let k in gameData.upgrades) gameData.upgrades[k].lv = 1;
            document.getElementById('prestige-btn').style.display = 'none';
            refreshUI(); saveGame();
        }

        function loop() {
            ctx.fillStyle = 'rgba(2, 2, 5, 0.3)';
            ctx.fillRect(0, 0, width, height);

            if(cubes.length < 20) cubes.push(new Cube());
            cubes = cubes.filter(c => !c.dead);
            cubes.forEach(c => { c.update(); c.draw(); });

            if(activeBoss) {
                activeBoss.update();
                activeBoss.draw();
            }

            particles = particles.filter(p => (p.life -= 0.03) > 0);
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, 3, 3);
            });

            floaters = floaters.filter(f => (f.life -= 0.02) > 0);
            floaters.forEach(f => {
                f.y += f.vy; ctx.fillStyle = f.color; ctx.globalAlpha = f.life;
                ctx.font = `bold ${f.size || 14}px Segoe UI`; ctx.fillText(f.txt, f.x, f.y);
            });

            ctx.globalAlpha = 1;
            requestAnimationFrame(loop);
        }

        function handleAction(ex, ey) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = ex - rect.left;
            const mouseY = ey - rect.top;
            let hit = false;

            if(activeBoss) {
                if(Math.hypot(mouseX - activeBoss.x, mouseY - activeBoss.y) < activeBoss.size / 1.2) {
                    activeBoss.takeDamage(getAtkPower());
                    hit = true;
                }
            }

            if(!hit) {
                for (let i = cubes.length - 1; i >= 0; i--) {
                    const c = cubes[i];
                    if(Math.hypot(mouseX - c.x, mouseY - c.y) < (c.size/1.5) + 30) {
                        c.takeDamage(getAtkPower());
                        hit = true; break;
                    }
                }
            }

            if(!hit) combo = 0;
            refreshUI();
        }

        canvas.addEventListener('mousedown', (e) => handleAction(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            const touch = e.touches[0];
            handleAction(touch.clientX, touch.clientY);
        }, { passive: false });

        window.onload = init;
        loop();
    </script>
</body>
</html>
