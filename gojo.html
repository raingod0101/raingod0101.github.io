<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>五條悟 VS 兩面宿儺｜五階段完整對決（受傷與恢復分離版）</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b13;font-family:system-ui,"Noto Sans TC",sans-serif;overflow:hidden}
main{max-width:1200px;margin:auto;padding:10px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:10px}
.stage,aside{background:#0d111a;border:1px solid #2a3548;border-radius:14px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.6)}
canvas{width:100%;height:auto;display:block;aspect-ratio:16/9;background:#0a0e16}
.hud{padding:10px 14px}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:space-between}
button,select{background:#1a2436;color:#eef3ff;border:1px solid #3a4a66;border-radius:8px;padding:8px 14px;min-height:38px;font-weight:700;font-size:16px;transition:all 0.15s}
button{cursor:pointer}button:hover{background:#2a3a55;border-color:#6a8ab5}
.primary{background:#3a52b5;border-color:#5a72d5}.primary:hover{background:#4a62c5}
.progress{height:5px;background:#1a2235;margin:6px 0;border-radius:3px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,#3ed5ff,#9d6bff,#ff526a);transition:width 0.08s linear;border-radius:3px}
aside{padding:10px}.list{display:grid;gap:4px;max-height:520px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#3a4a66 #0d111a}
.list button{text-align:left;font-size:11px;min-height:32px;padding:6px 10px;border-radius:6px;background:#151d2e;border-color:#2a3548;font-weight:600}
.list button[aria-current=true]{background:#2a3a8a;border-color:#5a72d5;box-shadow:0 0 12px rgba(90,114,213,0.3)}
@media(max-width:820px){.grid{grid-template-columns:1fr}.list{grid-template-columns:repeat(3,minmax(0,1fr));max-height:180px;gap:3px}.list button{font-size:10px;padding:5px 6px;min-height:26px}main{padding:6px}.hud{padding:8px 10px}button{padding:6px 10px;min-height:32px;font-size:14px}}
</style></head><body><main>
<div class="grid"><section class="stage"><canvas id="cv" width="1280" height="720"></canvas><div class="hud">
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="row"><button class="primary" id="play">▶</button><button id="pause">Ⅱ</button><button id="reset">↻</button><button id="prev">←</button><button id="next">→</button><select id="speed"><option>.5</option><option>.75</option><option selected>1</option><option>1.5</option><option>2</option></select></div>
</div></section><aside><div class="list" id="list"></div></aside></div>
</main>
<script>
(()=>{
const c=document.getElementById('cv'),ctx=c.getContext('2d'),W=1280,H=720;
// 五階段完整對決 — 每個場景對應具體攻擊與傷勢，有來有回，受傷與恢復分離
const scenes=[
// 第一階段：遠程先制與近身拆樓
['','','shrine200'],      // 200%虛式·茈 — 炸毀宿儺右手、左臂重創，後續恢復
['','','demolish'],       // 近身拆樓 — 大樓殘骸砸擊，雙方表皮擦傷，微量反轉恢復
// 第二階段：領域五連發大戰
['','','domainFirst'],    // 第一回合領域戰 — 無量空處vs伏魔御神子，五條全身斬切，逆轉恢復
['','','domainHollow'],   // 五條反擊 — 赫炸飛宿儺，臉胸凹陷，宿儺逆轉恢復
['','','domainSmall'],    // 小丸子領域 — 壓縮領域近身肉搏，宿儺內臟受損，持續恢復
['','','domainFinal'],    // 第五次領域 — 無量空處命中，貫穿心臟，宿儺無法自癒，魔虛羅登場
// 第三階段：魔虛羅破局
['','','mahoraga'],       // 魔虛羅斬碎無量空處，伏黑惠頂缸真相
['','','brainDamage'],    // 雙方大腦永久損傷 — 鼻血特寫，不可逆
// 第四階段：三打一混戰
['','','threeOne'],       // 魔虛羅+顎吐夾擊 — 斬斷五條右臂，五條逆轉再生
['','','crushAgito'],     // 五條蒼碾碎顎吐，顎吐永久死亡
// 第五階段：高空戰術與無定向紫
['','','blackFlash4'],    // 黑閃四連發 — 重創宿儺腹部臉部，五條狀態回復
['','','skySetup'],       // 高空佈局 — 蒼與赫滯空
['','','purpleExplode'],  // 無定向紫大爆炸 — 魔虛羅灰飛煙滅，宿儺左臂炸飛上半身燒焦
['','','sukunaFallen'],   // 宿儺重傷 — 左臂炸飛、上半身燒焦，無法立即恢復
['','','memeEnd']         // 迷因版結局 — 宿儺被殺、五條屹立
];
// 每幕持續時間（秒），受傷與恢復分離，所以需要更長時間
const durations=[4.5,4,5,4,5,5,4,3.5,4,3.5,4.5,3,5,4,3];
const total=durations.reduce((a,b)=>a+b,0);
let starts=[],sum=0;durations.forEach(v=>{starts.push(sum);sum+=v});
let time=0,playing=false,last=0,raf=0,speed=1,sceneIndex=0;
let particles=[],shake=0,hitFlash=0,knockback=0,flashAlpha=0;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=v=>{v=clamp(v,0,1);return v*v*(3-2*v)};
const easeOut=v=>{v=clamp(v,0,1);return 1-(1-v)*(1-v)};
const lerp=(a,b,t)=>a+(b-a)*t;
const random=(a,b)=>a+Math.random()*(b-a);

// ===== 粒子系統 =====
function addBurst(x,y,color,n=30,power=8,spread=1){
  for(let i=0;i<n;i++){
    let a=Math.random()*Math.PI*2;
    let sp=(0.3+Math.random())*power*spread;
    particles.push({
      x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:0.4+Math.random()*0.7,max:0.4+Math.random()*0.7,
      r:1.5+Math.random()*6,color,
      grav:0.08+Math.random()*0.06,shrink:0.98+Math.random()*0.02
    });
  }
}
function addTrail(x,y,color,n=2,spread=12){
  for(let i=0;i<n;i++){
    particles.push({
      x:x+random(-spread,spread),y:y+random(-spread,spread),
      vx:random(-2,2),vy:random(-2,2),
      life:0.15+Math.random()*0.2,max:0.35,
      r:1.5+Math.random()*5,color,
      grav:0,shrink:0.96+Math.random()*0.02
    });
  }
}
function addSpark(x,y,color,n=6,power=12){
  for(let i=0;i<n;i++){
    let a=Math.random()*Math.PI*2;
    let sp=(0.5+Math.random())*power;
    particles.push({
      x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:0.2+Math.random()*0.3,max:0.5,
      r:1+Math.random()*3,color,
      grav:0.02,shrink:0.95
    });
  }
}
function updateParticles(dt){
  particles=particles.filter(p=>p.life>0);
  for(const p of particles){
    p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;
    p.vy+=p.grav*dt*60;p.vx*=0.99;p.vy*=0.99;
    p.r*=p.shrink;p.life-=dt;
  }
}
function drawParticles(){
  for(const p of particles){
    let a=clamp(p.life/p.max,0,1);
    ctx.save();
    ctx.globalAlpha=a;ctx.fillStyle=p.color;
    ctx.shadowBlur=16;ctx.shadowColor=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0.5,p.r),0,Math.PI*2);
    ctx.fill();ctx.restore();
  }
}

// ===== 繪圖工具 =====
function line(x1,y1,x2,y2,color,w=3,alpha=1){
  ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=w;
  ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
  ctx.stroke();ctx.restore();
}
function glow(x,y,r,color,alpha=1){
  ctx.save();ctx.globalAlpha=alpha;ctx.shadowBlur=50;ctx.shadowColor=color;
  let g=ctx.createRadialGradient(x,y,1,x,y,r);
  g.addColorStop(0,'white');g.addColorStop(0.15,color);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();
}
function ring(x,y,r,color,alpha=1,w=8){
  ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=w;
  ctx.shadowBlur=30;ctx.shadowColor=color;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.restore();
}
function beam(x1,y1,x2,y2,color,width,alpha=1){
  ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=width;
  ctx.shadowBlur=40;ctx.shadowColor=color;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.strokeStyle='white';ctx.lineWidth=Math.max(1.5,width*0.15);ctx.shadowBlur=20;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.restore();
}
function blast(x,y,r,color,p){
  let a=ease(p);
  glow(x,y,Math.max(10,r*a),color,1-a*0.4);
  ring(x,y,20+a*r,color,1-a*0.4,12*(1-p)+2);
  ring(x,y,12+a*r*0.72,'white',0.8*(1-p),5);
  if(p<0.6){ctx.fillStyle=`rgba(255,255,255,${0.3*(1-p/0.6)})`;ctx.fillRect(0,0,W,H);}
}
function shakeCam(intensity){shake=Math.max(shake,intensity);}

// ===== 背景 =====
function background(t){
  let g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0c1424');g.addColorStop(0.72,'#1f2436');g.addColorStop(1,'#060a12');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<28;i++){
    let xx=i*52-(t*18%52),hh=80+(i*67%240);
    ctx.fillStyle=i%2?'#111a2b':'#1a2236';
    ctx.fillRect(xx,580-hh,40,hh);
  }
  ctx.fillStyle='#121828';ctx.fillRect(0,590,W,130);
  for(let i=0;i<22;i++){let xx=i*70-(t*45%70);line(xx,590,xx-30,660,'#2a3548',2,0.6);}
  for(let i=0;i<14;i++){
    let xx=(i*127-t*200%1600+1600)%1600;
    line(xx,120+i*32,xx+60,115+i*32,'#8aa8cc',1,0.1);
  }
}

// ===== 角色繪製（支援受傷部位與恢復視覺）=====
function drawFighter(x,y,type,pose,t,scale=1,isHit=false,dead=false,injuries={},recoveryGlow=0){
  ctx.save();
  ctx.translate(x,y);ctx.scale(scale,scale);
  if(dead){
    ctx.globalAlpha=0.45;ctx.rotate(0.85);ctx.translate(0,55);
    ctx.filter='grayscale(85%) brightness(0.35)';
  }
  if(isHit&&hitFlash>0){
    ctx.globalAlpha=0.5+0.5*Math.sin(hitFlash*55);
    ctx.translate(random(-12,12),random(-12,12));
    ctx.rotate(random(-0.12,0.12));
  }
  let go=type==='gojo';
  let skin=go?'#f0d6c4':'#e0bca8';
  let cloth=go?'#e4ecf8':'#3d1f2e';
  let inner=go?'#182640':'#5a2238';
  let hairCol=go?'#e8f0ff':'#d4808e';
  let bob=Math.sin(t*8+(go?0:1.5))*4;
  let lean=pose==='dash'?(go?-0.25:0.22):pose==='hit'?(go?0.35:-0.32):pose==='dodge'?0.42:0;
  ctx.translate(0,bob);ctx.rotate(lean);

  // 恢復光暈（表示正在用反轉術式修復）
  if(recoveryGlow>0.05){
    let rr=1+recoveryGlow*0.35;
    ctx.save();
    ctx.globalAlpha=0.15+recoveryGlow*0.25;
    ctx.shadowBlur=40;ctx.shadowColor='#7dffb0';
    ctx.fillStyle='#7dffb0';
    ctx.beginPath();ctx.ellipse(0,-90,60*rr,130*rr,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // 腿部
  function limb(ax,ay,bx,by,w,col){
    line(ax,ay,bx,by,col,w);
    ctx.fillStyle=col;
    ctx.beginPath();ctx.arc(bx,by,w*0.46,0,7);ctx.fill();
  }
  // 右腿受傷
  if(injuries.rightLeg){limb(-14,-62,-24,-6,18,'#8a2030');}
  else{limb(-14,-62,-24,-6,18,cloth);}
  limb(15,-62,30,-6,18,cloth);

  // 身體
  ctx.fillStyle=inner;ctx.fillRect(-26,-142,52,72);
  // 胸口燒焦
  if(injuries.chest){
    ctx.fillStyle='#1a0a0a';ctx.fillRect(-20,-130,40,40);
    for(let k=0;k<5;k++) addTrail(x+random(-15,15),y-100+random(-10,10),'#ff4a60',1);
  }
  // 外袍
  ctx.fillStyle=cloth;
  ctx.beginPath();
  ctx.moveTo(-28,-138);ctx.lineTo(0,-116);ctx.lineTo(28,-138);
  ctx.lineTo(42,-6);ctx.lineTo(9,-24);ctx.lineTo(0,-80);
  ctx.lineTo(-16,-24);ctx.lineTo(-44,-6);ctx.closePath();ctx.fill();

  // 手臂
  let punch=pose==='punch'||pose==='cast'||pose==='slash';
  let guard=pose==='guard';
  let armX=punch?(pose==='cast'?65:pose==='slash'?-65:90):guard?40:32;
  let armY=punch?(pose==='cast'?-175:pose==='slash'?-162:-108):guard?-168:-98;

  // 左臂（正常）
  limb(-21,-124,-45,-92,14,cloth);
  limb(-45,-92,-52,-78,10,skin);
  // 右臂受傷/斷臂
  if(injuries.rightArmLost){
    line(21,-124,30,-100,'#8a2030',14);
    if(Math.random()<0.3) addBurst(x+30,y-100,'#ff2a40',3,8);
  }else if(injuries.rightArmHurt){
    limb(21,-124,armX,armY,14,'#8a2030');
    limb(armX,armY,armX+20,armY-8,10,'#c08080');
    if(Math.random()<0.2) addTrail(x+armX,y+armY,'#ff2a40',1);
  }else{
    limb(21,-124,armX,armY,14,cloth);
    limb(armX,armY,armX+20,armY-8,10,skin);
  }

  // 頭部
  ctx.fillStyle=skin;
  ctx.beginPath();ctx.arc(0,-180,27,0,7);ctx.fill();
  // 臉部燒焦
  if(injuries.faceBurn){
    ctx.fillStyle='#1a0a0a';ctx.beginPath();ctx.arc(10,-185,18,0,7);ctx.fill();
  }

  // 頭髮
  ctx.fillStyle=hairCol;
  ctx.beginPath();
  ctx.moveTo(-26,-186);ctx.lineTo(-36,-220);ctx.lineTo(-12,-204);
  ctx.lineTo(-6,-236);ctx.lineTo(9,-208);ctx.lineTo(25,-228);
  ctx.lineTo(23,-202);ctx.lineTo(37,-214);ctx.lineTo(26,-172);
  ctx.lineTo(-24,-169);ctx.fill();

  // 面部
  if(go){
    ctx.fillStyle='#0e1828';ctx.fillRect(-27,-191,54,12);
  }else{
    line(-18,-182,-4,-175,'#8a3044',3,0.9);
    line(7,-188,21,-179,'#8a3044',3,0.9);
  }

  // 氣場
  if(pose==='cast'){
    glow(armX+20,armY-8,20,go?'#4ad8ff':'#ff4a60',0.7);
    glow(armX+20,armY-8,10,'white',0.5);
  }
  ctx.restore();
}

// ===== 斬擊特效 =====
function slashFX(x,y,p,color='#ff4a60',intensity=1){
  for(let i=0;i<12;i++){
    let yy=y+i*24,xx=x+i*20;
    line(xx-100,yy-28,xx+100,yy+28,color,4*intensity,0.15+0.75*(1-p));
    line(xx-80,yy-28,xx+80,yy+28,'white',1.5,0.4*(1-p));
  }
  if(p<0.5){
    for(let i=0;i<8;i++){
      let a=random(-0.5,0.5);
      let sx=x+random(-60,60),sy=y+random(-40,40);
      line(sx,sy,sx+Math.cos(a)*40,sy+Math.sin(a)*40,color,2,0.6*(1-p*2));
    }
  }
}

// ===== 主渲染 =====
function render(){
  let i=sceneIndex;
  let p=(time-starts[i])/durations[i];
  let kind=scenes[i][2];
  let t=time;

  let gojoHit=false,sukunaHit=false;
  hitFlash=Math.max(0,hitFlash-0.055);
  knockback*=0.87;

  ctx.save();
  let cam=shake*(0.35+Math.random()*0.65);
  ctx.translate(random(-cam,cam),random(-cam,cam));
  background(t);

  let gx=330,sx=1010,gPose='idle',sPose='idle';
  let travel=ease(clamp((p-0.15)/0.5,0,1));
  let gojoKbX=0,sukunaKbX=0;
  let sukunaDead=false;
  let gInjuries={},sInjuries={};
  let gRecovery=0,sRecovery=0;

  // ===== 迷因結局 =====
  if(kind==='memeEnd'){
    gx=330;sx=980;gPose='idle';sPose='dead';sukunaDead=true;
    if(p>0.15&&p<0.85){
      glow(650,380,130,'#a967ff',0.55);
      glow(650,380,65,'white',0.25);
      if(Math.random()<0.35) addBurst(650,380,'#c58aff',6,12);
      if(Math.random()<0.15) addBurst(650,380,'white',4,8);
    }
    if(p>0.35){
      for(let k=0;k<4;k++){
        let a=random(0,Math.PI*2);
        addTrail(sx+Math.cos(a)*45,500+Math.sin(a)*45,'#ff4a60',2);
      }
    }
    drawFighter(gx,590,'gojo',gPose,t,1.05,false,false,{});
    drawFighter(sx,590,'sukuna','hit',t,1.05,true,true,{faceBurn:true,rightArmLost:true});
    drawParticles();
    ctx.restore();
    return;
  }

  // ===== 1. 200%虛式·茈（炸毀宿儺右手，左臂重創，後續恢復）=====
  if(kind==='shrine200'){
    gPose='cast';sPose='guard';gx=300;sx=1010;
    let charge=clamp(p/0.35,0,1);
    let flight=clamp((p-0.35)/0.3,0,1);
    let hit=clamp((p-0.65)/0.25,0,1);
    let recoveryPhase=clamp((p-0.9)/0.1,0,1); // 最後10%時間恢復
    let sx0=380,sy0=415,ex=1010,ey=380;
    
    // 蓄力
    ring(sx0,sy0,35+charge*45,'#4ad8ff',1,12);
    ring(sx0+35,sy0,30+charge*38,'#ff4a60',1,12);
    glow(sx0+18,sy0,40+charge*60,'#9c65ff',1);
    if(p<0.25){
      for(let k=0;k<12;k++){
        let a=k*Math.PI/6+t*2;
        line(sx0+Math.cos(a)*80,sy0+Math.sin(a)*80,sx0+Math.cos(a)*120,sy0+Math.sin(a)*120,'#4ad8ff',2,0.3);
      }
    }
    
    // 飛行
    if(p>0.35&&p<0.65){
      let q=ease(flight),px=lerp(sx0,ex,q),py=lerp(sy0,ey,q);
      beam(sx0,sy0,px,py,'#a967ff',30,1);
      beam(sx0,sy0,px,py,'white',12,1);
      glow(px,py,80,'#c58aff',1);
      glow(px,py,40,'white',0.9);
      addTrail(px,py,'#bd7cff',6);
      addTrail(px,py,'white',4);
      shakeCam(14);
    }
    
    // 命中 — 炸毀右手、左臂重傷
    if(p>=0.65){
      blast(ex,ey,450,'#d7a6ff',hit);
      if(p<0.9) shakeCam(50*(1-hit));
      sukunaHit=true;hitFlash=2.2;
      sukunaKbX=-knockback*55;
      // 受傷部位：右手炸毀、左臂重創、胸口燒傷
      sInjuries.rightArmLost=true;
      sInjuries.leftArmHurt=true;
      sInjuries.chest=true;
      if(p>0.68&&p<0.85){
        addBurst(ex,ey,'#d7a6ff',130,30);
        addBurst(ex,ey,'white',70,24);
        addBurst(ex,ey,'#9d6bff',80,22);
        for(let k=0;k<8;k++) addBurst(ex-40,ey+random(-30,30),'#ff4a60',10,15);
      }
      if(p>0.65&&p<0.78){
        flashAlpha=0.9*(1-(p-0.65)/0.13);
        ctx.fillStyle=`rgba(255,255,255,${flashAlpha})`;
        ctx.fillRect(0,0,W,H);
      }
      // 恢復階段：最後0.9~1.0 顯示反轉術式修復右手
      if(p>0.88){

  // ===== 14. 宿儺重傷（左臂炸飛、上半身燒焦，無法立即恢復）=====
  if(kind==='sukunaFallen'){
    gPose='idle';sPose='hit';gx=330;sx=980;
    sInjuries.leftArmLost=true;sInjuries.faceBurn=true;sInjuries.chest=true;
    sukunaHit=true;hitFlash=0.6;
    if(p>0.15){
      for(let k=0;k<5;k++) addTrail(sx+random(-40,40),480+random(-40,40),'#ff4a60',1);
      glow(gx,400,60,'#4ad8ff',0.3);
    }
    // 宿儺嘗試恢復但失敗（重傷，反轉術式效率極低）
    if(p>0.4){
      sRecovery=clamp((p-0.4)/0.6,0,1)*0.15;
      // 傷口幾乎沒有癒合
    }
    // 五條屹立，輕微恢復
    if(p>0.5){
      gRecovery=clamp((p-0.5)/0.5,0,1)*0.3;
    }
  }

  // 應用擊退
  gx+=gojoKbX;
  sx+=sukunaKbX;

  // 繪製角色（帶恢復光暈）
  drawFighter(gx,590,'gojo',gPose,t,1.05,gojoHit,false,gInjuries,gRecovery);
  drawFighter(sx,590,'sukuna',sPose,t,1.05,sukunaHit,sukunaDead,sInjuries,sRecovery);

  drawParticles();
  ctx.restore();
}

// ===== 場景管理 =====
function setScene(){
  sceneIndex=0;
  for(let j=0;j<scenes.length;j++) if(time>=starts[j]) sceneIndex=j;
  $('bar').style.width=(time/total*100)+'%';
  [...$('list').children].forEach((b,j)=>b.setAttribute('aria-current',j===sceneIndex?'true':'false'));
}
function stop(){playing=false;cancelAnimationFrame(raf);$('play').textContent='▶';}
function frame(now){
  if(!playing)return;
  if(!last)last=now;
  let dt=Math.min(0.04,(now-last)/1000)*speed;
  last=now;
  time+=dt;
  if(time>=total){time=total;stop();}
  updateParticles(dt);
  shake*=0.86;
  setScene();
  render();
  if(playing)raf=requestAnimationFrame(frame);
}
function start(){
  if(time>=total){time=0;particles=[];}
  playing=true;last=0;$('play').textContent='▶';
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(frame);
}
// 初始化列表
scenes.forEach((s,j)=>{
  let b=document.createElement('button');
  b.textContent=String(j+1).padStart(2,'0');
  b.onclick=()=>{stop();time=starts[j];particles=[];setScene();render();};
  $('list').appendChild(b);
});
$('play').onclick=start;
$('pause').onclick=stop;
$('reset').onclick=()=>{stop();time=0;particles=[];setScene();render();};
$('next').onclick=()=>{stop();time=starts[Math.min(scenes.length-1,sceneIndex+1)];particles=[];setScene();render();};
$('prev').onclick=()=>{stop();time=starts[Math.max(0,sceneIndex-1)];particles=[];setScene();render();};
$('speed').onchange=e=>speed=Number(e.target.value)||1;
setScene();
render();
})();
</script></body></html>
