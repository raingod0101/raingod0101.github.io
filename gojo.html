<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>五條悟 VS 兩面宿儺 · 不間斷全螢幕</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body {
      background: #000; overflow: hidden; width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, 'Noto Sans TC', sans-serif;
    }
    canvas {
      display: block; width: 100vw; height: 100vh;
      object-fit: contain; background: #080b13; cursor: none;
    }
  </style>
</head>
<body>
  <canvas id="cv" width="1280" height="720"></canvas>
  <script>
    (() => {
      const c = document.getElementById('cv');
      const ctx = c.getContext('2d');
      const W = 1280, H = 720;

      const scenes = [
        ['', '', 'shrine200'],
        ['', '', 'demolish'],
        ['', '', 'domainFirst'],
        ['', '', 'domainHollow'],
        ['', '', 'domainSmall'],
        ['', '', 'domainFinal'],
        ['', '', 'mahoraga'],
        ['', '', 'brainDamage'],
        ['', '', 'threeOne'],
        ['', '', 'crushAgito'],
        ['', '', 'blackFlash4'],
        ['', '', 'skySetup'],
        ['', '', 'purpleExplode'],
        ['', '', 'sukunaFallen'],
        ['', '', 'memeEnd']
      ];

      const durations = [3.2, 2.8, 3.2, 2.8, 3.0, 3.2, 2.8, 2.4, 2.6, 2.4, 3.0, 2.0, 3.2, 2.8, 2.4];
      const total = durations.reduce((a, b) => a + b, 0);
      let starts = [], sum = 0;
      durations.forEach(v => { starts.push(sum); sum += v; });

      let time = 0;
      let lastTimestamp = 0;
      let raf = 0;
      let sceneIndex = 0;
      let particles = [];
      let shake = 0;
      let hitFlash = 0;
      let knockback = 0;
      let flashAlpha = 0;

      // ★ 關鍵：記錄上一場景結束時的角色位置，用於場景間平滑過渡
      let prevGx = 330, prevSx = 1010;
      let lastSceneIndex = -1;
      // 場景切換過渡時長（秒）
      const TRANSITION_DUR = 0.5;

      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const ease = v => { v = clamp(v, 0, 1); return v * v * (3 - 2 * v); };
      const easeOut = v => { v = clamp(v, 0, 1); return 1 - (1 - v) * (1 - v); };
      const lerp = (a, b, t) => a + (b - a) * t;
      const random = (a, b) => a + Math.random() * (b - a);

      // ===== 粒子系統 =====
      function addBurst(x, y, color, n = 30, power = 8, spread = 1) {
        for (let i = 0; i < n; i++) {
          let a = Math.random() * Math.PI * 2;
          let sp = (0.3 + Math.random()) * power * spread;
          particles.push({
            x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            life: 0.4 + Math.random() * 0.7, max: 0.4 + Math.random() * 0.7,
            r: 1.5 + Math.random() * 6, color,
            grav: 0.08 + Math.random() * 0.06, shrink: 0.98 + Math.random() * 0.02
          });
        }
      }
      function addTrail(x, y, color, n = 2, spread = 12) {
        for (let i = 0; i < n; i++) {
          particles.push({
            x: x + random(-spread, spread), y: y + random(-spread, spread),
            vx: random(-2, 2), vy: random(-2, 2),
            life: 0.15 + Math.random() * 0.2, max: 0.35,
            r: 1.5 + Math.random() * 5, color,
            grav: 0, shrink: 0.96 + Math.random() * 0.02
          });
        }
      }
      function updateParticles(dt) {
        particles = particles.filter(p => p.life > 0);
        for (const p of particles) {
          p.x += p.vx * dt * 60; p.y += p.vy * dt * 60;
          p.vy += p.grav * dt * 60; p.vx *= 0.99; p.vy *= 0.99;
          p.r *= p.shrink; p.life -= dt;
        }
      }
      function drawParticles() {
        for (const p of particles) {
          let a = clamp(p.life / p.max, 0, 1);
          ctx.save();
          ctx.globalAlpha = a; ctx.fillStyle = p.color;
          ctx.shadowBlur = 16; ctx.shadowColor = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.5, p.r), 0, Math.PI * 2);
          ctx.fill(); ctx.restore();
        }
      }

      // ===== 繪圖工具 =====
      function line(x1, y1, x2, y2, color, w = 3, alpha = 1) {
        ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = w;
        ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
        ctx.stroke(); ctx.restore();
      }
      function glow(x, y, r, color, alpha = 1) {
        ctx.save(); ctx.globalAlpha = alpha; ctx.shadowBlur = 50; ctx.shadowColor = color;
        let g = ctx.createRadialGradient(x, y, 1, x, y, r);
        g.addColorStop(0, 'white'); g.addColorStop(0.15, color); g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      }
      function ring(x, y, r, color, alpha = 1, w = 8) {
        ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = w;
        ctx.shadowBlur = 30; ctx.shadowColor = color;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
      }
      function beam(x1, y1, x2, y2, color, width, alpha = 1) {
        ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = width;
        ctx.shadowBlur = 40; ctx.shadowColor = color; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        ctx.strokeStyle = 'white'; ctx.lineWidth = Math.max(1.5, width * 0.15); ctx.shadowBlur = 20;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        ctx.restore();
      }
      function blast(x, y, r, color, p) {
        let a = ease(p);
        glow(x, y, Math.max(10, r * a), color, 1 - a * 0.4);
        ring(x, y, 20 + a * r, color, 1 - a * 0.4, 12 * (1 - p) + 2);
        ring(x, y, 12 + a * r * 0.72, 'white', 0.8 * (1 - p), 5);
        if (p < 0.6) { ctx.fillStyle = `rgba(255,255,255,${0.3 * (1 - p / 0.6)})`; ctx.fillRect(0, 0, W, H); }
      }
      function shakeCam(intensity) { shake = Math.max(shake, intensity); }

      // ===== 背景 =====
      function background(t) {
        let g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, '#0c1424'); g.addColorStop(0.72, '#1f2436'); g.addColorStop(1, '#060a12');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        for (let i = 0; i < 28; i++) {
          let xx = i * 52 - (t * 18 % 52), hh = 80 + (i * 67 % 240);
          ctx.fillStyle = i % 2 ? '#111a2b' : '#1a2236';
          ctx.fillRect(xx, 580 - hh, 40, hh);
        }
        ctx.fillStyle = '#121828'; ctx.fillRect(0, 590, W, 130);
        for (let i = 0; i < 22; i++) { let xx = i * 70 - (t * 45 % 70); line(xx, 590, xx - 30, 660, '#2a3548', 2, 0.6); }
        for (let i = 0; i < 14; i++) {
          let xx = (i * 127 - t * 200 % 1600 + 1600) % 1600;
          line(xx, 120 + i * 32, xx + 60, 115 + i * 32, '#8aa8cc', 1, 0.1);
        }
      }

      // ===== 角色繪製 =====
      function drawFighter(x, y, type, pose, t, scale = 1, isHit = false, dead = false, injuries = {}, recoveryGlow = 0) {
        ctx.save();
        ctx.translate(x, y); ctx.scale(scale, scale);
        if (dead) {
          ctx.globalAlpha = 0.45; ctx.rotate(0.85); ctx.translate(0, 55);
          ctx.filter = 'grayscale(85%) brightness(0.35)';
        }
        if (isHit && hitFlash > 0) {
          ctx.globalAlpha = 0.5 + 0.5 * Math.sin(hitFlash * 55);
          ctx.translate(random(-12, 12), random(-12, 12));
          ctx.rotate(random(-0.12, 0.12));
        }
        let go = type === 'gojo';
        let skin = go ? '#f0d6c4' : '#e0bca8';
        let cloth = go ? '#e4ecf8' : '#3d1f2e';
        let inner = go ? '#182640' : '#5a2238';
        let hairCol = go ? '#e8f0ff' : '#d4808e';
        let bob = Math.sin(t * 8 + (go ? 0 : 1.5)) * 4;
        let lean = pose === 'dash' ? (go ? -0.25 : 0.22) : pose === 'hit' ? (go ? 0.35 : -0.32) : pose === 'dodge' ? 0.42 : 0;
        ctx.translate(0, bob); ctx.rotate(lean);

        if (recoveryGlow > 0.05) {
          let rr = 1 + recoveryGlow * 0.35;
          ctx.save();
          ctx.globalAlpha = 0.15 + recoveryGlow * 0.25;
          ctx.shadowBlur = 40; ctx.shadowColor = '#7dffb0';
          ctx.fillStyle = '#7dffb0';
          ctx.beginPath(); ctx.ellipse(0, -90, 60 * rr, 130 * rr, 0, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }

        function limb(ax, ay, bx, by, w, col) {
          line(ax, ay, bx, by, col, w);
          ctx.fillStyle = col;
          ctx.beginPath(); ctx.arc(bx, by, w * 0.46, 0, 7); ctx.fill();
        }
        if (injuries.rightLeg) { limb(-14, -62, -24, -6, 18, '#8a2030'); }
        else { limb(-14, -62, -24, -6, 18, cloth); }
        limb(15, -62, 30, -6, 18, cloth);

        ctx.fillStyle = inner; ctx.fillRect(-26, -142, 52, 72);
        if (injuries.chest) {
          ctx.fillStyle = '#1a0a0a'; ctx.fillRect(-20, -130, 40, 40);
          for (let k = 0; k < 5; k++) addTrail(x + random(-15, 15), y - 100 + random(-10, 10), '#ff4a60', 1);
        }
        ctx.fillStyle = cloth;
        ctx.beginPath();
        ctx.moveTo(-28, -138); ctx.lineTo(0, -116); ctx.lineTo(28, -138);
        ctx.lineTo(42, -6); ctx.lineTo(9, -24); ctx.lineTo(0, -80);
        ctx.lineTo(-16, -24); ctx.lineTo(-44, -6); ctx.closePath(); ctx.fill();

        let punch = pose === 'punch' || pose === 'cast' || pose === 'slash';
        let guard = pose === 'guard';
        let armX = punch ? (pose === 'cast' ? 65 : pose === 'slash' ? -65 : 90) : guard ? 40 : 32;
        let armY = punch ? (pose === 'cast' ? -175 : pose === 'slash' ? -162 : -108) : guard ? -168 : -98;

        limb(-21, -124, -45, -92, 14, cloth);
        limb(-45, -92, -52, -78, 10, skin);

        if (injuries.rightArmLost) {
          line(21, -124, 30, -100, '#8a2030', 14);
          if (Math.random() < 0.3) addBurst(x + 30, y - 100, '#ff2a40', 3, 8);
        } else if (injuries.rightArmHurt) {
          limb(21, -124, armX, armY, 14, '#8a2030');
          limb(armX, armY, armX + 20, armY - 8, 10, '#c08080');
          if (Math.random() < 0.2) addTrail(x + armX, y + armY, '#ff2a40', 1);
        } else {
          limb(21, -124, armX, armY, 14, cloth);
          limb(armX, armY, armX + 20, armY - 8, 10, skin);
        }

        ctx.fillStyle = skin;
        ctx.beginPath(); ctx.arc(0, -180, 27, 0, 7); ctx.fill();
        if (injuries.faceBurn) {
          ctx.fillStyle = '#1a0a0a'; ctx.beginPath(); ctx.arc(10, -185, 18, 0, 7); ctx.fill();
        }

        ctx.fillStyle = hairCol;
        ctx.beginPath();
        ctx.moveTo(-26, -186); ctx.lineTo(-36, -220); ctx.lineTo(-12, -204);
        ctx.lineTo(-6, -236); ctx.lineTo(9, -208); ctx.lineTo(25, -228);
        ctx.lineTo(23, -202); ctx.lineTo(37, -214); ctx.lineTo(26, -172);
        ctx.lineTo(-24, -169); ctx.fill();

        if (go) {
          ctx.fillStyle = '#0e1828'; ctx.fillRect(-27, -191, 54, 12);
        } else {
          line(-18, -182, -4, -175, '#8a3044', 3, 0.9);
          line(7, -188, 21, -179, '#8a3044', 3, 0.9);
        }

        if (pose === 'cast') {
          glow(armX + 20, armY - 8, 20, go ? '#4ad8ff' : '#ff4a60', 0.7);
          glow(armX + 20, armY - 8, 10, 'white', 0.5);
        }
        ctx.restore();
      }

      function slashFX(x, y, p, color = '#ff4a60', intensity = 1) {
        for (let i = 0; i < 12; i++) {
          let yy = y + i * 24, xx = x + i * 20;
          line(xx - 100, yy - 28, xx + 100, yy + 28, color, 4 * intensity, 0.15 + 0.75 * (1 - p));
          line(xx - 80, yy - 28, xx + 80, yy + 28, 'white', 1.5, 0.4 * (1 - p));
        }
        if (p < 0.5) {
          for (let i = 0; i < 8; i++) {
            let a = random(-0.5, 0.5);
            let sx = x + random(-60, 60), sy = y + random(-40, 40);
            line(sx, sy, sx + Math.cos(a) * 40, sy + Math.sin(a) * 40, color, 2, 0.6 * (1 - p * 2));
          }
        }
      }

      // ===== 主渲染 =====
      function render() {
        let i = sceneIndex;
        let p = (time - starts[i]) / durations[i];
        let kind = scenes[i][2];
        let t = time;

        let gojoHit = false, sukunaHit = false;
        hitFlash = Math.max(0, hitFlash - 0.055);
        knockback *= 0.87;

        ctx.save();
        let cam = shake * (0.35 + Math.random() * 0.65);
        ctx.translate(random(-cam, cam), random(-cam, cam));
        background(t);

        // ★ 這裡每個場景先算出「本場景的目標位置」
        let targetGx = 330, targetSx = 1010, gPose = 'idle', sPose = 'idle';
        let travel = ease(clamp((p - 0.15) / 0.5, 0, 1));
        let gojoKbX = 0, sukunaKbX = 0;
        let sukunaDead = false;
        let gInjuries = {}, sInjuries = {};
        let gRecovery = 0, sRecovery = 0;

        // ===== 迷因結局 =====
        if (kind === 'memeEnd') {
          targetGx = 330; targetSx = 980; gPose = 'idle'; sPose = 'dead'; sukunaDead = true;
          if (p > 0.15 && p < 0.85) {
            glow(650, 380, 130, '#a967ff', 0.55);
            glow(650, 380, 65, 'white', 0.25);
            if (Math.random() < 0.35) addBurst(650, 380, '#c58aff', 6, 12);
            if (Math.random() < 0.15) addBurst(650, 380, 'white', 4, 8);
          }
          if (p > 0.35) {
            for (let k = 0; k < 4; k++) {
              let a = random(0, Math.PI * 2);
              addTrail(targetSx + Math.cos(a) * 45, 500 + Math.sin(a) * 45, '#ff4a60', 2);
            }
          }
        }
        // 其他場景先設定目標位置（詳細邏輯在下面各 if 內，但位置會用 target 變數）
        // 為了保持原邏輯完整，各場景內改寫 targetGx/targetSx 而非 gx/sx

        // ===== 1. 200%虛式·茈 =====
        if (kind === 'shrine200') {
          gPose = 'cast'; sPose = 'guard'; targetGx = 300; targetSx = 1010;
          let charge = clamp(p / 0.35, 0, 1);
          let flight = clamp((p - 0.35) / 0.3, 0, 1);
          let hit = clamp((p - 0.65) / 0.25, 0, 1);
          let sx0 = 380, sy0 = 415, ex = 1010, ey = 380;

          ring(sx0, sy0, 35 + charge * 45, '#4ad8ff', 1, 12);
          ring(sx0 + 35, sy0, 30 + charge * 38, '#ff4a60', 1, 12);
          glow(sx0 + 18, sy0, 40 + charge * 60, '#9c65ff', 1);
          if (p < 0.25) {
            for (let k = 0; k < 12; k++) {
              let a = k * Math.PI / 6 + t * 2;
              line(sx0 + Math.cos(a) * 80, sy0 + Math.sin(a) * 80, sx0 + Math.cos(a) * 120, sy0 + Math.sin(a) * 120, '#4ad8ff', 2, 0.3);
            }
          }
          if (p > 0.35 && p < 0.65) {
            let q = ease(flight), px = lerp(sx0, ex, q), py = lerp(sy0, ey, q);
            beam(sx0, sy0, px, py, '#a967ff', 30, 1);
            beam(sx0, sy0, px, py, 'white', 12, 1);
            glow(px, py, 80, '#c58aff', 1);
            glow(px, py, 40, 'white', 0.9);
            addTrail(px, py, '#bd7cff', 6);
            addTrail(px, py, 'white', 4);
            shakeCam(14);
          }
          if (p >= 0.65) {
            blast(ex, ey, 450, '#d7a6ff', hit);
            if (p < 0.9) shakeCam(50 * (1 - hit));
            sukunaHit = true; hitFlash = 2.2;
            sukunaKbX = -knockback * 55;
            sInjuries.rightArmLost = true;
            sInjuries.leftArmHurt = true;
            sInjuries.chest = true;
            if (p > 0.68 && p < 0.85) {
              addBurst(ex, ey, '#d7a6ff', 130, 30);
              addBurst(ex, ey, 'white', 70, 24);
              addBurst(ex, ey, '#9d6bff', 80, 22);
              for (let k = 0; k < 8; k++) addBurst(ex - 40, ey + random(-30, 30), '#ff4a60', 10, 15);
            }
            if (p > 0.65 && p < 0.78) {
              flashAlpha = 0.9 * (1 - (p - 0.65) / 0.13);
              ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
              ctx.fillRect(0, 0, W, H);
            }
            if (p > 0.88) {
              sRecovery = clamp((p - 0.88) / 0.12, 0, 1);
              if (p > 0.9 && p < 0.98) {
                glow(ex - 30, ey - 60, 40, '#7dffb0', 0.6);
                if (Math.random() < 0.5) addTrail(ex - 30 + random(-10, 10), ey - 60 + random(-15, 15), '#7dffb0', 1);
              }
              if (p > 0.96) { sInjuries.rightArmLost = false; }
            }
          }
        }

        // ===== 2. 近身拆樓 =====
        if (kind === 'demolish') {
          gPose = 'punch'; sPose = 'punch'; 
          targetGx = lerp(330, 560, travel); targetSx = lerp(1010, 780, travel);
          for (let k = 0; k < 12; k++) {
            let bx = random(200, 1000), by = random(300, 560);
            ctx.fillStyle = '#2a3548'; ctx.fillRect(bx, by, random(20, 50), random(15, 35));
            if (k % 3 === 0) line(bx, by, bx + random(-30, 30), by + random(-30, 30), '#3a4a66', 2, 0.6);
          }
          if (p > 0.05 && p < 0.35) {
            sukunaHit = true; hitFlash = 1.3; shakeCam(30);
            sukunaKbX = -knockback * 30;
            addBurst(targetSx - 20, 400, '#8899bb', 40, 18);
            addBurst(targetSx - 10, 380, '#ffb3c1', 20, 12);
            sInjuries.chest = true;
            gPose = 'punch';
          }
          if (p > 0.35 && p < 0.65) {
            gojoHit = true; hitFlash = 1.0; shakeCam(25);
            gojoKbX = knockback * 20;
            addBurst(targetGx + 30, 400, '#b9eaff', 35, 15);
            gInjuries.chest = true;
            sPose = 'slash';
          }
          if (p > 0.65 && p < 0.85) {
            sukunaHit = true; hitFlash = 1.1; shakeCam(20);
            sukunaKbX = -knockback * 20;
            addBurst(targetSx - 20, 400, '#8899bb', 25, 12);
            sPose = 'guard';
          }
          if (p > 0.85) {
            gRecovery = clamp((p - 0.85) / 0.15, 0, 1);
            sRecovery = clamp((p - 0.85) / 0.15, 0, 1);
            if (p > 0.95) { gInjuries.chest = false; sInjuries.chest = false; }
          }
        }

        // ===== 3. 第一回合領域戰 =====
        if (kind === 'domainFirst') {
          gPose = 'cast'; sPose = 'cast';
          // 位置保持不動（原場景就沒改 gx/sx，所以用默認 330/1010，但為了流暢用上一場景位置過渡）
          targetGx = 330; targetSx = 1010;
          let centerX = 640;
          let r = 40 + easeOut(p) * 600;
          ring(centerX - r * 0.15, 360, r * 0.85, '#4ad8ff', 0.9, 14);
          ring(centerX - r * 0.15, 360, r * 0.65, 'white', 0.35, 6);
          ring(centerX + r * 0.3, 360, r * 1.15, '#ff4a60', 0.9, 14);
          ring(centerX + r * 0.3, 360, r * 0.9, 'white', 0.3, 5);
          if (p > 0.25) {
            for (let k = 0; k < 10; k++) {
              let a = k * Math.PI / 5 + t * 3;
              line(centerX - r * 0.15 + Math.cos(a) * r * 0.85, 360 + Math.sin(a) * r * 0.85,
                centerX + r * 0.3 + Math.cos(a) * r * 1.15, 360 + Math.sin(a) * r * 1.15, '#ff4a60', 3, 0.6);
            }
          }
          if (p > 0.3 && p < 0.65) {
            gojoHit = true; hitFlash = 1.2; shakeCam(25);
            gInjuries.faceBurn = true; gInjuries.chest = true; gInjuries.rightArmHurt = true;
            for (let k = 0; k < 8; k++) {
              addBurst(targetGx + random(-30, 30), 400 + random(-40, 40), '#ff4a60', 8, 12);
            }
          }
          if (p > 0.65 && p < 0.9) {
            glow(targetGx + 80, 360, 100, '#ff4a60', 0.8);
            blast(targetSx, 360, 300, '#ff4a60', clamp((p - 0.65) / 0.25, 0, 1));
            sukunaHit = true; hitFlash = 1.5; shakeCam(35);
            sukunaKbX = -knockback * 40;
            sInjuries.chest = true;
          }
          if (p > 0.75) {
            gRecovery = clamp((p - 0.75) / 0.2, 0, 1);
            if (p > 0.88) { gInjuries.faceBurn = false; gInjuries.chest = false; gInjuries.rightArmHurt = false; }
          }
        }

        // ===== 4. 五條貼身「赫」轟飛宿儺 =====
        if (kind === 'domainHollow') {
          gPose = 'cast'; sPose = 'hit'; targetGx = 400; targetSx = 850;
          if (p > 0.2 && p < 0.6) {
            glow(targetGx + 80, 380, 120, '#ff4a60', 0.9);
            beam(targetGx + 80, 380, targetSx - 60, 380, '#ff4a60', 25, 1);
            beam(targetGx + 80, 380, targetSx - 60, 380, 'white', 8, 1);
            blast(targetSx, 380, 350, '#ff4a60', clamp((p - 0.2) / 0.4, 0, 1));
          }
          if (p > 0.35 && p < 0.7) {
            sukunaHit = true; hitFlash = 1.8; shakeCam(45);
            sukunaKbX = -knockback * 50;
            sInjuries.chest = true; sInjuries.faceBurn = true;
            addBurst(targetSx - 50, 380, '#ff4a60', 80, 25);
            addBurst(targetSx - 50, 380, 'white', 40, 18);
          }
          if (p > 0.7) {
            sRecovery = clamp((p - 0.7) / 0.3, 0, 1);
            if (p > 0.85) { sInjuries.chest = false; sInjuries.faceBurn = false; }
          }
        }

        // ===== 5. 壓縮小丸子領域內部肉搏 =====
        if (kind === 'domainSmall') {
          gPose = 'punch'; sPose = 'punch'; targetGx = 560; targetSx = 720;
          let r = 20 + ease(p) * 60;
          ring(640, 360, r, '#4ad8ff', 0.9, 10);
          ring(640, 360, r * 0.8, 'white', 0.4, 4);
          ring(640, 360, r * 1.2, '#ff4a60', 0.6, 6);
          if (p > 0.15 && p < 0.7) {
            for (let k = 0; k < 6; k++) {
              let a = k * Math.PI / 3 + t * 5;
              line(640 + Math.cos(a) * r * 0.5, 360 + Math.sin(a) * r * 0.5,
                640 + Math.cos(a) * r, 360 + Math.sin(a) * r, '#e8f0ff', 3, 0.7);
            }
          }
          if (p > 0.3 && p < 0.5) {
            sukunaHit = true; hitFlash = 1.2; shakeCam(25);
            sukunaKbX = -knockback * 20;
            addBurst(targetSx - 20, 380, '#ffb3c1', 30, 14);
            sInjuries.chest = true;
          }
          if (p > 0.5 && p < 0.7) {
            gojoHit = true; hitFlash = 1.0; shakeCam(22);
            gojoKbX = knockback * 15;
            addBurst(targetGx + 20, 380, '#b9eaff', 25, 12);
            gInjuries.chest = true;
          }
          if (p > 0.5) {
            sRecovery = clamp((p - 0.5) / 0.5, 0, 1) * 0.8;
            if (p > 0.85) { sInjuries.chest = false; }
          }
          if (p > 0.7) {
            gRecovery = clamp((p - 0.7) / 0.3, 0, 1);
            if (p > 0.9) gInjuries.chest = false;
          }
        }

        // ===== 6. 第五回合領域戰 =====
        if (kind === 'domainFinal') {
          gPose = 'punch'; sPose = 'hit'; 
          targetGx = lerp(400, 650, travel); targetSx = 850;
          if (p > 0.15) {
            glow(640, 360, 150, '#4ad8ff', 0.7);
            ring(640, 360, 200 + ease(p) * 100, '#4ad8ff', 0.6, 12);
            for (let k = 0; k < 20; k++) {
              let a = k * Math.PI / 10 + t * 4;
              line(640 + Math.cos(a) * 180, 360 + Math.sin(a) * 180,
                640 + Math.cos(a) * 280, 360 + Math.sin(a) * 280, '#4ad8ff', 3, 0.5);
            }
            sukunaHit = true; hitFlash = 1.5; shakeCam(30);
            sInjuries.chest = true;
          }
          if (p > 0.45) {
            let hx = lerp(targetGx, targetSx - 40, ease(clamp((p - 0.45) / 0.3, 0, 1)));
            glow(hx, 380, 60, '#ff4a60', 1);
            glow(hx, 380, 30, 'white', 0.9);
            beam(hx - 100, 380, hx + 100, 380, '#ff4a60', 12, 1);
            if (p > 0.6) {
              sukunaHit = true; hitFlash = 2.0; shakeCam(50);
              sukunaKbX = -knockback * 45;
              sInjuries.chest = true; sInjuries.heartPuncture = true;
              addBurst(hx, 380, '#ff4a60', 80, 25);
              addBurst(hx, 380, 'white', 40, 18);
            }
          }
          if (p > 0.85) {
            glow(850, 480, 120, '#1a1428', 0.6);
            glow(850, 480, 60, '#f1d99a', 0.3);
            if (Math.random() < 0.3) addBurst(850, 480, '#f1d99a', 5, 10);
          }
        }

        // ===== 7. 魔虛羅斬碎領域 =====
        if (kind === 'mahoraga') {
          sPose = 'cast'; gPose = 'guard'; targetGx = 330; targetSx = 1010;
          let a = t * 4.5;
          ring(780, 205, 75, '#f1d99a', 0.9, 12);
          ctx.save(); ctx.translate(780, 205); ctx.rotate(a);
          for (let k = 0; k < 12; k++) {
            let an = k * Math.PI / 6;
            line(Math.cos(an) * 50, Math.sin(an) * 50, Math.cos(an) * 100, Math.sin(an) * 100, '#f4dfa8', 9);
          }
          ctx.restore();
          glow(780, 480, 130, '#1a1428', 0.7);
          glow(780, 480, 65, '#f1d99a', 0.3);
          if (p > 0.1 && p < 0.5) {
            glow(850, 420, 80, '#5a2238', 0.5);
            ring(850, 420, 50, '#8a3044', 0.4, 5);
          }
          if (p > 0.25) {
            let q = clamp((p - 0.25) / 0.35, 0, 1);
            beam(lerp(900, 600, ease(q)), 200, lerp(900, 600, ease(q)) - 150, 600, '#f4dfa8', 12, 1);
            if (p > 0.45) {
              for (let k = 0; k < 12; k++) {
                let ang = k * Math.PI / 6;
                line(640 + Math.cos(ang) * 200, 360 + Math.sin(ang) * 200,
                  640 + Math.cos(ang) * 280, 360 + Math.sin(ang) * 280, '#4ad8ff', 3, 0.5);
              }
              gojoHit = true; hitFlash = 1.0; shakeCam(25);
              gInjuries.faceBurn = true;
              addBurst(640, 360, '#4ad8ff', 40, 18);
            }
          }
          if (p > 0.8) {
            gRecovery = clamp((p - 0.8) / 0.2, 0, 1) * 0.6;
            if (p > 0.95) gInjuries.faceBurn = false;
          }
        }

        // ===== 8. 雙方大腦永久性毀損 =====
        if (kind === 'brainDamage') {
          gPose = 'guard'; sPose = 'guard'; targetGx = 400; targetSx = 880;
          let zoom = 1 + clamp((p - 0.2) / 0.6, 0, 1) * 0.5;
          ctx.save();
          ctx.translate(640, 360); ctx.scale(zoom, zoom); ctx.translate(-640, -360);
          gInjuries.faceBurn = true; gInjuries.brainDamage = true;
          sInjuries.brainDamage = true; sInjuries.faceBurn = true;
          if (p > 0.1 && p < 0.9) {
            let noseY = 380;
            let dropY = 390 + clamp((p - 0.2) / 0.6, 0, 1) * 80;
            if (p > 0.2) {
              line(targetGx + 5, noseY, targetGx + 5, dropY, '#ff2a40', 3, 0.9);
              glow(targetGx + 5, dropY, 8, '#ff2a40', 0.7);
            }
            line(targetGx - 15, 368, targetGx - 25, 378, '#ff2a40', 2, 0.7);
          }
          if (p > 0.3 && p < 0.9) {
            let dropY2 = 390 + clamp((p - 0.4) / 0.5, 0, 1) * 70;
            line(targetSx + 5, 380, targetSx + 5, dropY2, '#ff2a40', 3, 0.9);
            glow(targetSx + 5, dropY2, 8, '#ff2a40', 0.7);
          }
          if (p > 0.4 && p < 0.8) {
            shakeCam(8 + Math.sin(p * 40) * 6);
          }
          ctx.restore();
        }

        // ===== 9. 三打一混戰 =====
        if (kind === 'threeOne') {
          gPose = 'dodge'; sPose = 'slash'; 
          targetGx = lerp(450, 380, travel); targetSx = 1010;
          if (p > 0.1) {
            let mx = 200 + p * 100, my = 500;
            glow(mx, my, 90, '#1a1428', 0.8);
            ring(mx, my, 55, '#f1d99a', 0.7, 7);
          }
          if (p > 0.25) {
            let ax = 900 - p * 80, ay = 480;
            glow(ax, ay, 70, '#5a2238', 0.7);
            ring(ax, ay, 45, '#ff4a60', 0.6, 5);
          }
          if (p > 0.4 && p < 0.7) {
            gojoHit = true; hitFlash = 1.5; shakeCam(40);
            gojoKbX = knockback * 30;
            gInjuries.rightArmLost = true;
            addBurst(targetGx + 40, 400, '#ff4a60', 50, 20);
            addBurst(targetGx + 40, 380, 'white', 25, 15);
          }
          if (p > 0.7) {
            gRecovery = clamp((p - 0.7) / 0.3, 0, 1);
            if (p > 0.75 && p < 0.95) {
              glow(targetGx + 40, 380, 35, '#7dffb0', 0.7);
              if (Math.random() < 0.5) addTrail(targetGx + 40 + random(-15, 15), 380 + random(-15, 15), '#7dffb0', 1);
            }
            if (p > 0.92) gInjuries.rightArmLost = false;
          }
        }

        // ===== 10. 五條「蒼」碾碎顎吐 =====
        if (kind === 'crushAgito') {
          gPose = 'punch'; sPose = 'guard'; 
          targetGx = lerp(330, 600, travel); targetSx = 850;
          if (p > 0.15) {
            let ax = 900 - p * 200, ay = 480;
            glow(ax, ay, 100, '#4ad8ff', 0.8);
            ring(ax, ay, 70, '#4ad8ff', 0.7, 7);
            for (let k = 0; k < 10; k++) {
              let ang = k * Math.PI / 5 + t * 3;
              line(ax + Math.cos(ang) * 120, ay + Math.sin(ang) * 120,
                ax + Math.cos(ang) * 60, ay + Math.sin(ang) * 60, '#4ad8ff', 3, 0.6);
            }
          }
          if (p > 0.4) {
            let ax = 700, ay = 480;
            glow(ax, ay, 150, '#4ad8ff', 1);
            glow(ax, ay, 75, 'white', 0.8);
            addBurst(ax, ay, '#4ad8ff', 60, 22);
            addBurst(ax, ay, '#ff4a60', 30, 16);
            addBurst(ax, ay, 'white', 20, 12);
            shakeCam(30);
          }
        }

        // ===== 11. 五條連續黑閃四連發 =====
        if (kind === 'blackFlash4') {
          gPose = 'punch'; sPose = 'hit'; 
          targetGx = lerp(380, 650, travel); targetSx = 850;
          for (let n = 0; n < 4; n++) {
            let np = (p - n * 0.15) / 0.12;
            if (np > 0 && np < 1) {
              let hx = lerp(targetGx + 50, targetSx - 40, ease(np));
              glow(hx, 380, 50, '#090b12', 1);
              glow(hx, 380, 25, '#b9eaff', 0.9);
              for (let k = 0; k < 10; k++) {
                let a = t * 12 + k * Math.PI / 5;
                line(hx, 380, hx + Math.cos(a) * 160, 380 + Math.sin(a) * 160, '#090b12', 8, 0.95);
                line(hx, 380, hx + Math.cos(a) * 130, 380 + Math.sin(a) * 130, '#b9eaff', 3, 0.9);
              }
              if (np > 0.5) {
                sukunaHit = true; hitFlash = 1.8; shakeCam(40);
                sukunaKbX = -knockback * 40;
                sInjuries.chest = true; sInjuries.faceBurn = true;
                addBurst(hx, 380, '#090b12', 40, 20);
                addBurst(hx, 380, '#b9eaff', 25, 15);
              }
            }
          }
          if (p > 0.6) {
            gRecovery = clamp((p - 0.6) / 0.4, 0, 1);
            if (p > 0.9) gInjuries.chest = false;
          }
          if (p > 0.7 && p < 0.95) {
            sRecovery = clamp((p - 0.7) / 0.25, 0, 1) * 0.3;
          }
        }

        // ===== 12. 高空佈局 =====
        if (kind === 'skySetup') {
          gPose = 'cast'; sPose = 'guard'; targetGx = 400; targetSx = 900;
          if (p > 0.15) {
            glow(600, 200, 80, '#4ad8ff', 0.8);
            ring(600, 200, 50, '#4ad8ff', 0.7, 8);
            addTrail(600, 200, '#4ad8ff', 2);
          }
          if (p > 0.4) {
            glow(700, 150, 70, '#ff4a60', 0.8);
            ring(700, 150, 45, '#ff4a60', 0.7, 7);
            addTrail(700, 150, '#ff4a60', 2);
          }
          if (p > 0.6) {
            let mx = lerp(600, 700, ease((p - 0.6) / 0.4));
            let my = lerp(200, 150, ease((p - 0.6) / 0.4));
            glow(mx, my, 100, '#9c65ff', 1);
            ring(mx, my, 60, '#9c65ff', 0.8, 9);
          }
        }

        // ===== 13. 無定向紫大爆炸 =====
        if (kind === 'purpleExplode') {
          gPose = 'cast'; sPose = 'hit'; targetGx = 400; targetSx = 900;
          let mx = 650, my = 175;
          if (p < 0.25) {
            glow(mx, my, 120, '#9c65ff', 1);
            glow(mx, my, 60, 'white', 0.8);
            ring(mx, my, 80, '#9c65ff', 0.8, 10);
          }
          if (p >= 0.25) {
            let q = clamp((p - 0.25) / 0.45, 0, 1);
            blast(mx, my, 500, '#d7a6ff', q);
            if (p > 0.35) {
              addBurst(mx, my, '#d7a6ff', 100, 30);
              addBurst(mx, my, 'white', 50, 24);
              addBurst(mx, my, '#9d6bff', 60, 22);
              sukunaHit = true; hitFlash = 2.0; shakeCam(45);
              sInjuries.leftArmLost = true; sInjuries.faceBurn = true; sInjuries.chest = true;
              sukunaKbX = -knockback * 50;
            }
            gInjuries.chest = true;
          }
          if (p > 0.25 && p < 0.45) {
            flashAlpha = 0.85 * (1 - (p - 0.25) / 0.2);
            ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
            ctx.fillRect(0, 0, W, H);
          }
          if (p > 0.7) {
            gRecovery = clamp((p - 0.7) / 0.3, 0, 1);
            if (p > 0.9) gInjuries.chest = false;
          }
        }

        // ===== 14. 宿儺重傷 =====
        if (kind === 'sukunaFallen') {
          gPose = 'idle'; sPose = 'hit'; targetGx = 330; targetSx = 980;
          sInjuries.leftArmLost = true; sInjuries.faceBurn = true; sInjuries.chest = true;
          sukunaHit = true; hitFlash = 0.6;
          if (p > 0.15) {
            for (let k = 0; k < 5; k++) addTrail(targetSx + random(-40, 40), 480 + random(-40, 40), '#ff4a60', 1);
            glow(targetGx, 400, 60, '#4ad8ff', 0.3);
          }
          if (p > 0.4) {
            sRecovery = clamp((p - 0.4) / 0.6, 0, 1) * 0.15;
          }
          if (p > 0.5) {
            gRecovery = clamp((p - 0.5) / 0.5, 0, 1) * 0.3;
          }
        }

        // ★ 場景切換時，用上一場景位置到目標位置做平滑過渡（解決傳送問題）
        let transitionT = 1;
        if (lastSceneIndex !== sceneIndex) {
          // 剛切換場景，記錄起始位置
          prevGx = prevGx; prevSx = prevSx;
          lastSceneIndex = sceneIndex;
        }
        // 場景開始後的前 TRANSITION_DUR 秒內做插值過渡
        let sceneElapsed = time - starts[sceneIndex];
        if (sceneElapsed < TRANSITION_DUR) {
          transitionT = ease(sceneElapsed / TRANSITION_DUR);
        }
        let gx = lerp(prevGx, targetGx, transitionT);
        let sx = lerp(prevSx, targetSx, transitionT);

        // 應用擊退（擊退是相對增量，加在插值後的基礎位置上）
        gx += gojoKbX;
        sx += sukunaKbX;

        // 記錄本幀最終位置，供下一幀/下一場景過渡使用
        // 注意：記錄的是「目標位置」而非擊退後位置，避免擊退抖動累積
        prevGx = targetGx + gojoKbX * 0.2;  // 輕微保留擊退慣性
        prevSx = targetSx + sukunaKbX * 0.2;

        // 繪製角色
        drawFighter(gx, 590, 'gojo', gPose, t, 1.05, gojoHit, false, gInjuries, gRecovery);
        drawFighter(sx, 590, 'sukuna', sPose, t, 1.05, sukunaHit, sukunaDead, sInjuries, sRecovery);

        drawParticles();
        ctx.restore();
      }

      // ===== 動畫循環 =====
      function frame(now) {
        if (!lastTimestamp) lastTimestamp = now;
        let dt = Math.min(0.04, (now - lastTimestamp) / 1000);
        lastTimestamp = now;
        time += dt;
        if (time >= total) {
          time = 0;
          particles = [];
          shake = 0;
          // 循環回第一幕時，重置過渡記錄，避免從最後一幕位置突然跳到第一幕
          prevGx = 330; prevSx = 1010;
          lastSceneIndex = -1;
        }

        // 更新當前場景索引
        sceneIndex = 0;
        for (let j = 0; j < scenes.length; j++) {
          if (time >= starts[j]) sceneIndex = j;
        }

        updateParticles(dt);
        shake *= 0.86;

        render();

        raf = requestAnimationFrame(frame);
      }

      requestAnimationFrame((t) => {
        lastTimestamp = 0;
        raf = requestAnimationFrame(frame);
      });
    })();
  </script>
</body>
</html>
