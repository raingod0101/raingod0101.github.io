<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加權平均計算 | Raingod</title>
    <style>
        :root {
            --primary: #007aff;
            --bg: #f5f5f7;
            --card: #ffffff;
            --border: #e5e5ea;
            --muted: #86868b;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, "PingFang TC", "Heiti TC", sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 24px 16px;
            color: #1d1d1f;
        }

        .container { max-width: 520px; margin: 0 auto; }

        h1 {
            font-size: 22px;
            text-align: center;
            margin: 0 0 20px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            margin-bottom: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .item { text-align: center; }

        .item label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .item label .w { color: #c7c7cc; }

        input {
            width: 100%;
            padding: 10px 4px;
            border: 1px solid var(--border);
            border-radius: 10px;
            text-align: center;
            font-size: 16px;
            font-variant-numeric: tabular-nums;
            transition: 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,122,255,0.12);
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .result {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px 10px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        .result .label {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .result .value {
            font-size: 28px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: #1d1d1f;
        }

        .result.primary .value { color: var(--primary); }

        .hint {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
            min-height: 18px;
        }

        @media (max-width: 520px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>加權平均計算</h1>

    <div class="card">
        <div class="grid">
            <div class="item">
                <label>國文 <span class="w">×5</span></label>
                <input type="number" id="s1" inputmode="decimal" placeholder="－">
            </div>
            <div class="item">
                <label>數學 <span class="w">×4</span></label>
                <input type="number" id="s2" inputmode="decimal" placeholder="－">
            </div>
            <div class="item">
                <label>生物 <span class="w">×3</span></label>
                <input type="number" id="s3" inputmode="decimal" placeholder="－">
            </div>
            <div class="item">
                <label>英語 <span class="w">×3</span></label>
                <input type="number" id="s4" inputmode="decimal" placeholder="－">
            </div>
            <div class="item">
                <label>社會 <span class="w">×3</span></label>
                <input type="number" id="s5" inputmode="decimal" placeholder="－">
            </div>
        </div>
    </div>

    <div class="results">
        <div class="result primary">
            <div class="label">加權平均</div>
            <div class="value" id="weighted">–</div>
        </div>
        <div class="result">
            <div class="label">未加權平均</div>
            <div class="value" id="plain">–</div>
        </div>
    </div>

    <div class="hint" id="hint"></div>
</div>

<script>
    // 固定權重（可自行修改，不影響未加權平均）
    const WEIGHTS = [5, 4, 3, 3, 3];

    const inputs = [1, 2, 3, 4, 5].map(i => document.getElementById('s' + i));

    function calculate() {
        let sumWeight = 0;   // 已填科目的權重總和
        let sumWeighted = 0; // 已填科目的加權總分
        let sumScore = 0;    // 已填科目的原始總分
        let filled = 0;      // 已填科目數

        inputs.forEach((el, i) => {
            const raw = el.value.trim();
            if (raw === '') return;            // 未填 → 直接略過
            const score = parseFloat(raw);
            if (isNaN(score)) return;

            const w = WEIGHTS[i];
            sumWeight   += w;
            sumWeighted += score * w;
            sumScore    += score;
            filled++;
        });

        document.getElementById('weighted').textContent =
            sumWeight > 0 ? (sumWeighted / sumWeight).toFixed(2) : '–';

        document.getElementById('plain').textContent =
            filled > 0 ? (sumScore / filled).toFixed(2) : '–';

        let msg = `已填 ${filled} / 5 科`;
        if (filled > 0 && filled < 5) {
            msg += '（分母只計算已填科目）';
        }
        document.getElementById('hint').textContent = msg;
    }

    inputs.forEach((el, i) => {
        el.addEventListener('input', calculate);

        // Enter 跳到下一個輸入框
        el.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                (inputs[i + 1] || el).focus();
            }
        });
    });

    calculate();
</script>

</body>
</html>
