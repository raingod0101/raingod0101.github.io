<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成績紀錄 | Raingod</title>
    <style>
        :root {
            --primary: #007aff;
            --bg: #f5f5f7;
            --card: #ffffff;
            --border: #e5e5ea;
            --muted: #86868b;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, "PingFang TC", "Heiti TC", sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 24px 16px;
            color: #1d1d1f;
        }

        .container { max-width: 560px; margin: 0 auto; }

        h1 {
            font-size: 22px;
            text-align: center;
            margin: 0 0 20px;
        }

        .main-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 4px;
        }
        .main-tab {
            flex: 1;
            padding: 10px 6px;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            transition: 0.2s;
        }
        .main-tab.active {
            background: var(--primary);
            color: #fff;
        }

        .tab-row {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .tab {
            flex: 1;
            min-width: 60px;
            padding: 8px 6px;
            border: 1px solid var(--border);
            background: var(--card);
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 500;
            color: #1d1d1f;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .tab.active {
            border-color: var(--primary);
            background: rgba(0, 122, 255, 0.08);
            color: var(--primary);
            font-weight: 600;
        }

        #rank-subject-tabs {
            flex-wrap: nowrap;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        #rank-subject-tabs .tab {
            flex: 0 0 auto;
            min-width: 62px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            margin-bottom: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        .item { text-align: center; }
        .item label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .item label .w { color: #c7c7cc; }

        input[type=number] {
            width: 100%;
            padding: 10px 4px;
            border: 1px solid var(--border);
            border-radius: 10px;
            text-align: center;
            font-size: 16px;
            font-variant-numeric: tabular-nums;
            transition: 0.2s;
        }
        input[type=number]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.12);
        }
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        .result {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px 10px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        .result .label {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 8px;
        }
        .result .value {
            font-size: 28px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .result.primary .value { color: var(--primary); }

        .hint {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
            min-height: 18px;
        }

        .empty {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            padding: 32px 16px;
            line-height: 1.6;
        }

        .rank-row {
            display: grid;
            grid-template-columns: 40px 1fr auto;
            align-items: center;
            gap: 12px;
            padding: 12px 4px;
            border-bottom: 1px solid var(--border);
            font-size: 15px;
        }
        .rank-row:last-child { border-bottom: none; }
        .rank-row.me {
            background: rgba(0, 122, 255, 0.08);
            margin: 0 -18px;
            padding: 12px 22px;
            border-radius: 10px;
        }
        .rank-num {
            font-weight: 700;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }
        .rank-name {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .rank-row.me .rank-name {
            font-weight: 700;
            color: var(--primary);
        }
        .rank-score {
            font-variant-numeric: tabular-nums;
            font-weight: 700;
        }

        .records-table-wrap {
            overflow-x: auto;
            margin: 0 -18px;
            padding: 0 18px;
        }
        .records-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            white-space: nowrap;
        }
        .records-table th,
        .records-table td {
            padding: 8px 6px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        .records-table th {
            color: var(--muted);
            font-weight: 500;
            font-size: 12px;
            background: #fafafa;
        }
        .records-table td:first-child,
        .records-table th:first-child {
            text-align: left;
        }

        .admin-row { cursor: pointer; transition: 0.15s; }
        .admin-row:hover { background: #f9f9fb; }

        .action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
        }
        .action-btn.primary { background: var(--primary); color: #fff; }
        .action-btn.danger {
            background: #fff;
            color: #ff3b30;
            border: 1px solid #ff3b30;
            margin-top: 8px;
            padding: 10px;
            font-size: 14px;
        }

        @media (max-width: 520px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
            .main-tab { font-size: 11.5px; padding: 10px 4px; }
        }
    </style>
</head>
<body>
    <link rel="stylesheet" href="menu.css">
    <div id="nav_bar"></div>
    <script src="menu.js"></script>

    <div class="container">
        <h1>成績紀錄</h1>

        <div class="main-tabs">
            <button type="button" class="main-tab active" data-view="input">📝 輸入</button>
            <button type="button" class="main-tab" data-view="records">📋 記錄</button>
            <button type="button" class="main-tab" data-view="ranking">🏆 排行</button>
            <button type="button" class="main-tab" data-view="admin" id="admin-tab" style="display:none;">🛠 管理</button>
        </div>

        <div class="view" id="view-input">
            <div class="tab-row" id="input-grade-tabs"></div>
            <div class="tab-row" id="input-sem-tabs"></div>
            <div class="tab-row" id="input-exam-tabs"></div>

            <div class="card" id="lock-message" style="display:none;"></div>

            <div class="card" id="input-card">
                <div class="grid" id="score-inputs"></div>
            </div>

            <div class="results" id="results">
                <div class="result primary">
                    <div class="label">加權平均</div>
                    <div class="value" id="weighted">–</div>
                </div>
                <div class="result">
                    <div class="label">未加權平均</div>
                    <div class="value" id="plain">–</div>
                </div>
            </div>

            <div class="hint" id="hint"></div>
        </div>

        <div class="view" id="view-records" style="display:none;">
            <div class="card" id="records-card">
                <div class="empty">載入中…</div>
            </div>
        </div>

        <div class="view" id="view-ranking" style="display:none;">
            <div class="tab-row" id="rank-grade-tabs"></div>
            <div class="tab-row" id="rank-sem-tabs"></div>
            <div class="tab-row" id="rank-exam-tabs"></div>
            <div class="tab-row" id="rank-subject-tabs"></div>

            <div class="card" id="ranking-list">
                <div class="empty">載入中…</div>
            </div>
        </div>

        <div class="view" id="view-admin" style="display:none;">
            <div class="tab-row" id="admin-grade-tabs"></div>
            <div class="tab-row" id="admin-sem-tabs"></div>
            <div class="tab-row" id="admin-exam-tabs"></div>

            <div class="card" id="admin-student-list">
                <div class="empty">載入中…</div>
            </div>

            <div class="card" id="admin-edit-card" style="display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                    <div style="font-weight:600; font-size:15px;" id="admin-edit-title">編輯</div>
                    <button type="button" id="admin-edit-close"
                        style="border:none; background:none; cursor:pointer; font-size:18px; color:var(--muted);">✕</button>
                </div>

                <div class="grid" id="admin-score-inputs"></div>

                <div class="hint" id="admin-edit-preview" style="margin-top:12px;"></div>
                <div class="hint" id="admin-edit-uid" style="font-size:11px; margin-top:4px;"></div>

                <div style="margin-top:14px;">
                    <button type="button" class="action-btn primary" id="admin-save-btn">儲存</button>
                    <button type="button" class="action-btn danger" id="admin-delete-btn">刪除記錄</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        // ═════════════════ 常數 ═════════════════
        // 註：key 沿用 'biology' 只是為了不破壞已存的資料，
        //     顯示名稱已統一改為「自然」。
        const SUBJECTS = [
            { key: 'chinese', name: '國文', weight: 5 },
            { key: 'math',    name: '數學', weight: 4 },
            { key: 'biology', name: '自然', weight: 3 },
            { key: 'english', name: '英語', weight: 3 },
            { key: 'social',  name: '社會', weight: 3 },
        ];

        const EXAM_UNLOCK = {
            '7-1-1': '2025-10-15',
            '7-1-2': '2025-12-05',
            '7-1-3': '2026-01-16',
            '7-2-1': '2026-03-27',
            '7-2-2': '2026-05-15',
            '7-2-3': '2026-06-30',
            '8-1-1': '2026-10-14',
            '8-1-2': '2026-11-26',
            '8-1-3': '2027-01-15',
            '8-2-1': '2027-03-26',
            '8-2-2': '2027-05-14',
            '8-2-3': '2027-06-30',
            '9-1-1': '2027-10-15',
            '9-1-2': '2027-11-26',
            '9-1-3': '2028-01-14',
            '9-2-1': '2028-02-25',
            '9-2-2': '2028-04-14',
            '9-2-3': '2028-05-10',
        };

        const DB_OWN_ROOT  = 'raingod_exam_scores';
        const DB_RANK_ROOT = 'raingod_exam_rankings';
        const ADMIN_USERNAME = 'raingod';

        // ═════════════════ 狀態 ═════════════════
        const state = {
            view: 'input',
            grade: 8, sem: 1, exam: 1,
            rankGrade: 8, rankSem: 1, rankExam: 1,
            rankSubject: 'weighted',
            adminGrade: 8, adminSem: 1, adminExam: 1,
            adminEditingUid: null,
            adminStudents: {},
        };

        // ═════════════════ 工具函式 ═════════════════
        function todayStr() {
            const d = new Date();
            const t = d.toLocaleString('sv-SE', { timeZone: 'Asia/Taipei' });
            return t.slice(0, 10);
        }

        function isUnlocked(grade, sem, exam) {
            const unlockDate = EXAM_UNLOCK[`${grade}-${sem}-${exam}`];
            if (!unlockDate) return false;
            return todayStr() >= unlockDate;
        }

        function isCurrentExamUnlocked() {
            return isUnlocked(state.grade, state.sem, state.exam);
        }

        function examIdOf(grade, sem, exam) {
            return `${grade}_${sem}_${exam}`;
        }

        function currentExamId() {
            return examIdOf(state.grade, state.sem, state.exam);
        }

        function getExamOptions(grade, sem) {
            const isMock = grade === 9 && sem === 2;
            return [1, 2, 3].map(n => ({
                value: n,
                label: isMock ? `第 ${n} 次模擬考` : `第 ${n} 次段考`,
            }));
        }

        // ★ 只有五科全填才回傳 weighted / plain，否則都是 null
        function computeWeighted(scores) {
            let sumWeight = 0, sumWeighted = 0, sumScore = 0, filled = 0;
            SUBJECTS.forEach(sub => {
                const v = scores[sub.key];
                if (typeof v === 'number' && !isNaN(v)) {
                    sumWeight   += sub.weight;
                    sumWeighted += v * sub.weight;
                    sumScore    += v;
                    filled++;
                }
            });
            const complete = filled === SUBJECTS.length;
            return {
                weighted: complete ? +(sumWeighted / sumWeight).toFixed(2) : null,
                plain:    complete ? +(sumScore / filled).toFixed(2)       : null,
                filled,
                complete,
            };
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }

        function currentUsername() {
            const u = window.firebase && firebase.auth && firebase.auth().currentUser;
            if (!u || !u.email) return '';
            return u.email.split('@')[0];
        }

        function isAdmin() {
            const name = currentUsername();
            return name && name.toLowerCase() === ADMIN_USERNAME;
        }

        function renderTabs(containerEl, options, activeValue, onSelect) {
            if (!containerEl) return;
            containerEl.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'tab' + (opt.value === activeValue ? ' active' : '');
                btn.textContent = opt.label;
                btn.addEventListener('click', () => onSelect(opt.value));
                containerEl.appendChild(btn);
            });
        }

        // ═════════════════ 輸入分頁 ═════════════════
        function renderInputTabs() {
            renderTabs(
                document.getElementById('input-grade-tabs'),
                [7, 8, 9].map(n => ({ value: n, label: `${n} 年級` })),
                state.grade,
                v => { state.grade = v; renderInputTabs(); loadCurrentExam(); }
            );
            renderTabs(
                document.getElementById('input-sem-tabs'),
                [{ value: 1, label: '上學期' }, { value: 2, label: '下學期' }],
                state.sem,
                v => { state.sem = v; renderInputTabs(); loadCurrentExam(); }
            );
            renderTabs(
                document.getElementById('input-exam-tabs'),
                getExamOptions(state.grade, state.sem),
                state.exam,
                v => { state.exam = v; renderInputTabs(); loadCurrentExam(); }
            );
        }

        function renderRankingTabs() {
            renderTabs(
                document.getElementById('rank-grade-tabs'),
                [7, 8, 9].map(n => ({ value: n, label: `${n} 年級` })),
                state.rankGrade,
                v => { state.rankGrade = v; renderRankingTabs(); loadRankingData(); }
            );
            renderTabs(
                document.getElementById('rank-sem-tabs'),
                [{ value: 1, label: '上學期' }, { value: 2, label: '下學期' }],
                state.rankSem,
                v => { state.rankSem = v; renderRankingTabs(); loadRankingData(); }
            );
            renderTabs(
                document.getElementById('rank-exam-tabs'),
                getExamOptions(state.rankGrade, state.rankSem),
                state.rankExam,
                v => { state.rankExam = v; renderRankingTabs(); loadRankingData(); }
            );

            const subjectOpts = [
                ...SUBJECTS.map(s => ({ value: s.key, label: s.name })),
                { value: 'weighted', label: '加權' },
                { value: 'plain',    label: '平均' },
            ];
            renderTabs(
                document.getElementById('rank-subject-tabs'),
                subjectOpts,
                state.rankSubject,
                v => { state.rankSubject = v; renderRankingTabs(); loadRankingData(); }
            );
        }

        function renderAdminTabs() {
            renderTabs(
                document.getElementById('admin-grade-tabs'),
                [7, 8, 9].map(n => ({ value: n, label: `${n} 年級` })),
                state.adminGrade,
                v => { state.adminGrade = v; renderAdminTabs(); closeAdminEdit(); loadAdminStudents(); }
            );
            renderTabs(
                document.getElementById('admin-sem-tabs'),
                [{ value: 1, label: '上學期' }, { value: 2, label: '下學期' }],
                state.adminSem,
                v => { state.adminSem = v; renderAdminTabs(); closeAdminEdit(); loadAdminStudents(); }
            );
            renderTabs(
                document.getElementById('admin-exam-tabs'),
                getExamOptions(state.adminGrade, state.adminSem),
                state.adminExam,
                v => { state.adminExam = v; renderAdminTabs(); closeAdminEdit(); loadAdminStudents(); }
            );
        }

        function renderInputBoxes() {
            const container = document.getElementById('score-inputs');
            container.innerHTML = '';
            SUBJECTS.forEach((sub, idx) => {
                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML =
                    `<label>${sub.name} <span class="w">×${sub.weight}</span></label>` +
                    `<input type="number" id="score-${sub.key}" min="0" max="100" inputmode="decimal" placeholder="－">`;
                container.appendChild(item);

                const input = item.querySelector('input');
                input.addEventListener('input', onScoreInput);
                input.addEventListener('keydown', e => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const nextIdx = idx + 1;
                        if (nextIdx < SUBJECTS.length) {
                            document.getElementById(`score-${SUBJECTS[nextIdx].key}`).focus();
                        }
                    }
                });
            });
        }

        // ═════════════════ 使用者輸入與儲存 ═════════════════
        let saveTimer = null;

        function onScoreInput() {
            updateComputed();
            clearTimeout(saveTimer);
            saveTimer = setTimeout(saveCurrentScores, 800);
        }

        function collectScores() {
            const scores = {};
            let filled = 0;
            SUBJECTS.forEach(sub => {
                const el = document.getElementById(`score-${sub.key}`);
                if (!el) return;
                const raw = el.value.trim();
                if (raw === '') return;
                const v = parseFloat(raw);
                if (isNaN(v)) return;
                scores[sub.key] = v;
                filled++;
            });
            return { scores, filled };
        }

        function updateComputed() {
            const { scores, filled } = collectScores();
            const calc = computeWeighted(scores);

            document.getElementById('weighted').textContent =
                calc.weighted != null ? calc.weighted.toFixed(2) : '–';
            document.getElementById('plain').textContent =
                calc.plain != null ? calc.plain.toFixed(2) : '–';

            let msg = `已填 ${filled} / ${SUBJECTS.length} 科`;
            if (filled > 0 && !calc.complete) {
                msg += '（五科全填完才會計算加權與平均）';
            } else if (filled === 0) {
                msg += '（請輸入成績）';
            }
            document.getElementById('hint').textContent = msg;
        }

        async function saveCurrentScores() {
            if (!isCurrentExamUnlocked()) return;

            const { scores, filled } = collectScores();
            const examId = currentExamId();
            const calc = computeWeighted(scores);

            // 只有五科全填才寫入 weighted / plain
            const data = { ...scores };
            if (calc.complete) {
                data.weighted = calc.weighted;
                data.plain = calc.plain;
            }

            try {
                if (filled > 0) {
                    localStorage.setItem(`raingod_exam_scores_${examId}`, JSON.stringify(data));
                } else {
                    localStorage.removeItem(`raingod_exam_scores_${examId}`);
                }
            } catch (e) {}

            if (!window.firebase || !firebase.auth().currentUser) return;

            const user = firebase.auth().currentUser;
            const uid = user.uid;
            const username = user.email ? user.email.split('@')[0] : uid;

            try {
                if (filled > 0) {
                    const cloudData = {
                        ...data,
                        username,
                        updated_at: firebase.database.ServerValue.TIMESTAMP,
                    };
                    await Promise.all([
                        firebase.database().ref(`${DB_OWN_ROOT}/${uid}/${examId}`).set(cloudData),
                        firebase.database().ref(`${DB_RANK_ROOT}/${examId}/${uid}`).set(cloudData),
                    ]);
                } else {
                    await Promise.all([
                        firebase.database().ref(`${DB_OWN_ROOT}/${uid}/${examId}`).remove(),
                        firebase.database().ref(`${DB_RANK_ROOT}/${examId}/${uid}`).remove(),
                    ]);
                }
            } catch (e) {
                console.warn('雲端儲存失敗：', e);
            }
        }

        // ═════════════════ 載入目前段考 ═════════════════
        let loadRequestId = 0;

        async function loadCurrentExam() {
            const reqId = ++loadRequestId;
            const examId = currentExamId();
            const unlocked = isCurrentExamUnlocked();

            const inputCard = document.getElementById('input-card');
            const resultsEl = document.getElementById('results');
            const lockMsg   = document.getElementById('lock-message');
            const hintEl    = document.getElementById('hint');

            if (!unlocked) {
                inputCard.style.display = 'none';
                resultsEl.style.display = 'none';
                lockMsg.style.display = 'block';
                const unlockDate = EXAM_UNLOCK[`${state.grade}-${state.sem}-${state.exam}`] || '未知';
                lockMsg.innerHTML =
                    `🔒 尚未開放<br><small style="color:var(--muted);">${unlockDate} 後才可填寫</small>`;
                hintEl.textContent = '';
                return;
            }

            inputCard.style.display = '';
            resultsEl.style.display = '';
            lockMsg.style.display = 'none';

            SUBJECTS.forEach(sub => {
                const el = document.getElementById(`score-${sub.key}`);
                if (el) el.value = '';
            });
            document.getElementById('weighted').textContent = '–';
            document.getElementById('plain').textContent = '–';
            hintEl.textContent = '';

            let data = null;
            try {
                const raw = localStorage.getItem(`raingod_exam_scores_${examId}`);
                if (raw) data = JSON.parse(raw);
            } catch (e) {}

            if (window.firebase && firebase.auth().currentUser) {
                try {
                    const uid = firebase.auth().currentUser.uid;
                    const snap = await firebase.database()
                        .ref(`${DB_OWN_ROOT}/${uid}/${examId}`).once('value');
                    if (reqId !== loadRequestId) return;
                    if (snap.exists()) {
                        data = snap.val();
                        try {
                            localStorage.setItem(`raingod_exam_scores_${examId}`, JSON.stringify(data));
                        } catch (e) {}
                    }
                } catch (e) {
                    console.warn('雲端讀取失敗：', e);
                }
            }

            if (reqId !== loadRequestId) return;

            if (data) {
                SUBJECTS.forEach(sub => {
                    const v = data[sub.key];
                    if (typeof v === 'number' && !isNaN(v)) {
                        const el = document.getElementById(`score-${sub.key}`);
                        if (el) el.value = v;
                    }
                });
            }
            updateComputed();
        }

        // ═════════════════ 我的記錄 ═════════════════
        async function loadMyRecords() {
            const card = document.getElementById('records-card');
            card.innerHTML = '<div class="empty">載入中…</div>';

            let records = {};

            if (window.firebase && firebase.auth().currentUser) {
                try {
                    const uid = firebase.auth().currentUser.uid;
                    const snap = await firebase.database()
                        .ref(`${DB_OWN_ROOT}/${uid}`).once('value');
                    records = snap.val() || {};
                } catch (e) {
                    card.innerHTML =
                        `<div class="empty">載入失敗：${escapeHtml(e.message)}</div>`;
                    return;
                }
            } else {
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    if (!k || !k.startsWith('raingod_exam_scores_')) continue;
                    const examId = k.slice('raingod_exam_scores_'.length);
                    try {
                        const v = JSON.parse(localStorage.getItem(k));
                        if (v && typeof v === 'object') records[examId] = v;
                    } catch (e) {}
                }
            }

            renderRecordsTable(records);
        }

        function renderRecordsTable(records) {
            const card = document.getElementById('records-card');
            const rows = [];

            for (const examId in records) {
                const parts = examId.split('_');
                if (parts.length !== 3) continue;
                const g = Number(parts[0]);
                const s = Number(parts[1]);
                const e = Number(parts[2]);
                if (!g || !s || !e) continue;
                if (!isUnlocked(g, s, e)) continue;
                rows.push({ g, s, e, r: records[examId] || {} });
            }

            if (!rows.length) {
                card.innerHTML = '<div class="empty">尚無儲存的成績</div>';
                return;
            }

            rows.sort((a, b) => a.g - b.g || a.s - b.s || a.e - b.e);

            let html = '<div class="records-table-wrap"><table class="records-table"><thead><tr>';
            html += '<th>年級</th><th>學期</th><th>考試</th>';
            SUBJECTS.forEach(sub => { html += `<th>${sub.name}</th>`; });
            html += '<th>加權</th><th>平均</th>';
            html += '</tr></thead><tbody>';

            rows.forEach(row => {
                const semLabel  = row.s === 1 ? '上' : '下';
                const examLabel = (row.g === 9 && row.s === 2) ? `${row.e}模` : `${row.e}段`;
                html += '<tr>';
                html += `<td>${row.g}</td><td>${semLabel}</td><td>${examLabel}</td>`;
                SUBJECTS.forEach(sub => {
                    const v = row.r[sub.key];
                    html += `<td>${typeof v === 'number' && !isNaN(v) ? v : '–'}</td>`;
                });
                html += `<td>${typeof row.r.weighted === 'number' ? row.r.weighted.toFixed(2) : '–'}</td>`;
                html += `<td>${typeof row.r.plain    === 'number' ? row.r.plain.toFixed(2)    : '–'}</td>`;
                html += '</tr>';
            });

            html += '</tbody></table></div>';
            card.innerHTML = html;
        }

        // ═════════════════ 排行榜 ═════════════════
        async function loadRankingData() {
            const listEl = document.getElementById('ranking-list');
            const examId = examIdOf(state.rankGrade, state.rankSem, state.rankExam);

            if (!window.firebase || !firebase.auth().currentUser) {
                listEl.innerHTML = '<div class="empty">請先登入以查看排行榜</div>';
                return;
            }

            if (!isUnlocked(state.rankGrade, state.rankSem, state.rankExam)) {
                const unlockDate =
                    EXAM_UNLOCK[`${state.rankGrade}-${state.rankSem}-${state.rankExam}`] || '未知';
                listEl.innerHTML =
                    `<div class="empty">🔒 此段考尚未開放<br><small>${unlockDate} 後才可查看</small></div>`;
                return;
            }

            listEl.innerHTML = '<div class="empty">載入中…</div>';

            try {
                const snap = await firebase.database()
                    .ref(`${DB_RANK_ROOT}/${examId}`).once('value');
                const records = snap.val() || {};

                const key = state.rankSubject;
                const arr = [];

                for (const uid in records) {
                    const r = records[uid];
                    if (!r) continue;
                    let val;
                    if (key === 'weighted')      val = r.weighted;
                    else if (key === 'plain')    val = r.plain;
                    else                         val = r[key];
                    if (typeof val === 'number' && !isNaN(val)) {
                        arr.push({ username: r.username || uid, val });
                    }
                }

                if (!arr.length) {
                    listEl.innerHTML = '<div class="empty">尚無資料</div>';
                    return;
                }

                arr.sort((a, b) => b.val - a.val);

                let rank = 1;
                for (let i = 0; i < arr.length; i++) {
                    if (i > 0 && arr[i].val !== arr[i - 1].val) rank = i + 1;
                    arr[i].rank = rank;
                }

                const myName = currentUsername();

                listEl.innerHTML = arr.map(r => {
                    const isMe = myName && r.username === myName;
                    const medal =
                        r.rank === 1 ? '🥇' :
                        r.rank === 2 ? '🥈' :
                        r.rank === 3 ? '🥉' : '';
                    const num = medal || `#${r.rank}`;
                    return (
                        `<div class="rank-row${isMe ? ' me' : ''}">` +
                          `<span class="rank-num">${num}</span>` +
                          `<span class="rank-name">${escapeHtml(r.username)}</span>` +
                          `<span class="rank-score">${r.val.toFixed(2)}</span>` +
                        `</div>`
                    );
                }).join('');
            } catch (e) {
                listEl.innerHTML =
                    `<div class="empty">載入失敗：${escapeHtml(e.message)}</div>`;
            }
        }

        // ═════════════════ 管理員 ═════════════════
        async function loadAdminStudents() {
            if (!isAdmin()) return;
            const examId = examIdOf(state.adminGrade, state.adminSem, state.adminExam);
            const listEl = document.getElementById('admin-student-list');
            listEl.innerHTML = '<div class="empty">載入中…</div>';

            try {
                const snap = await firebase.database()
                    .ref(`${DB_RANK_ROOT}/${examId}`).once('value');
                state.adminStudents = snap.val() || {};
            } catch (e) {
                listEl.innerHTML =
                    `<div class="empty">載入失敗：${escapeHtml(e.message)}</div>`;
                return;
            }

            renderAdminStudents();
        }

        function renderAdminStudents() {
            const listEl = document.getElementById('admin-student-list');
            const students = state.adminStudents;
            const keys = Object.keys(students);

            if (!keys.length) {
                listEl.innerHTML = '<div class="empty">此段考尚無學生填寫</div>';
                return;
            }

            const arr = keys.map(uid => ({ uid, r: students[uid] || {} }));
            arr.sort((a, b) =>
                (a.r.username || a.uid).localeCompare(b.r.username || b.uid)
            );

            let html = '<div class="records-table-wrap"><table class="records-table"><thead><tr>';
            html += '<th>學生</th>';
            SUBJECTS.forEach(sub => { html += `<th>${sub.name}</th>`; });
            html += '<th>加權</th><th>平均</th>';
            html += '</tr></thead><tbody>';

            arr.forEach(({ uid, r }) => {
                html += `<tr class="admin-row" data-uid="${escapeHtml(uid)}">`;
                html += `<td>${escapeHtml(r.username || uid)}</td>`;
                SUBJECTS.forEach(sub => {
                    const v = r[sub.key];
                    html += `<td>${typeof v === 'number' && !isNaN(v) ? v : '–'}</td>`;
                });
                html += `<td>${typeof r.weighted === 'number' ? r.weighted.toFixed(2) : '–'}</td>`;
                html += `<td>${typeof r.plain    === 'number' ? r.plain.toFixed(2)    : '–'}</td>`;
                html += '</tr>';
            });

            html += '</tbody></table></div>';
            listEl.innerHTML = html;

            listEl.querySelectorAll('.admin-row').forEach(row => {
                row.addEventListener('click', () => openAdminEdit(row.dataset.uid));
            });
        }

        function openAdminEdit(uid) {
            const r = state.adminStudents[uid] || {};
            state.adminEditingUid = uid;

            const card    = document.getElementById('admin-edit-card');
            const title   = document.getElementById('admin-edit-title');
            const uidEl   = document.getElementById('admin-edit-uid');
            const preview = document.getElementById('admin-edit-preview');
            const container = document.getElementById('admin-score-inputs');

            title.textContent = `編輯：${r.username || uid}`;
            uidEl.textContent = `UID: ${uid}`;
            preview.textContent = '';

            container.innerHTML = '';
            SUBJECTS.forEach(sub => {
                const item = document.createElement('div');
                item.className = 'item';
                const v = typeof r[sub.key] === 'number' ? r[sub.key] : '';
                item.innerHTML =
                    `<label>${sub.name} <span class="w">×${sub.weight}</span></label>` +
                    `<input type="number" id="admin-score-${sub.key}" min="0" max="100" inputmode="decimal" placeholder="－" value="${v}">`;
                container.appendChild(item);

                item.querySelector('input').addEventListener('input', updateAdminPreview);
            });

            card.style.display = '';
            updateAdminPreview();
            card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function closeAdminEdit() {
            state.adminEditingUid = null;
            const card = document.getElementById('admin-edit-card');
            if (card) card.style.display = 'none';
        }

        function updateAdminPreview() {
            const scores = {};
            let filled = 0;
            SUBJECTS.forEach(sub => {
                const el = document.getElementById(`admin-score-${sub.key}`);
                if (!el) return;
                const raw = el.value.trim();
                if (raw === '') return;
                const v = parseFloat(raw);
                if (!isNaN(v)) { scores[sub.key] = v; filled++; }
            });
            const calc = computeWeighted(scores);
            const preview = document.getElementById('admin-edit-preview');
            if (!preview) return;
            if (calc.complete) {
                preview.textContent =
                    `加權 ${calc.weighted.toFixed(2)} ・ 平均 ${calc.plain.toFixed(2)}`;
            } else {
                preview.textContent =
                    `已填 ${filled} / ${SUBJECTS.length} 科（五科全填才會算出加權與平均）`;
            }
        }

        async function saveAdminEdit() {
            if (!isAdmin() || !state.adminEditingUid) return;

            const uid = state.adminEditingUid;
            const examId = examIdOf(state.adminGrade, state.adminSem, state.adminExam);

            const scores = {};
            let filled = 0;
            SUBJECTS.forEach(sub => {
                const el = document.getElementById(`admin-score-${sub.key}`);
                if (!el) return;
                const raw = el.value.trim();
                if (raw === '') return;
                const v = parseFloat(raw);
                if (isNaN(v) || v < 0 || v > 100) return;
                scores[sub.key] = v;
                filled++;
            });

            if (filled === 0) {
                if (confirm('目前沒有任何分數，是否刪除此學生的記錄？')) {
                    await deleteAdminRecord();
                }
                return;
            }

            const calc = computeWeighted(scores);
            const existing = state.adminStudents[uid] || {};
            const username = existing.username || uid;

            const cloudData = {
                ...scores,
                username,
                updated_at: firebase.database.ServerValue.TIMESTAMP,
            };
            if (calc.complete) {
                cloudData.weighted = calc.weighted;
                cloudData.plain = calc.plain;
            }

            const btn = document.getElementById('admin-save-btn');
            btn.disabled = true;
            btn.textContent = '儲存中…';

            try {
                await Promise.all([
                    firebase.database().ref(`${DB_RANK_ROOT}/${examId}/${uid}`).set(cloudData),
                    firebase.database().ref(`${DB_OWN_ROOT}/${uid}/${examId}`).set(cloudData),
                ]);
                alert('已儲存');
                await loadAdminStudents();
                if (state.adminStudents[uid]) openAdminEdit(uid);
                else closeAdminEdit();
            } catch (e) {
                alert('儲存失敗：' + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '儲存';
            }
        }

        async function deleteAdminRecord() {
            if (!isAdmin() || !state.adminEditingUid) return;
            if (!confirm('確定要刪除這筆記錄嗎？此操作無法復原。')) return;

            const uid = state.adminEditingUid;
            const examId = examIdOf(state.adminGrade, state.adminSem, state.adminExam);

            try {
                await Promise.all([
                    firebase.database().ref(`${DB_RANK_ROOT}/${examId}/${uid}`).remove(),
                    firebase.database().ref(`${DB_OWN_ROOT}/${uid}/${examId}`).remove(),
                ]);
                closeAdminEdit();
                await loadAdminStudents();
            } catch (e) {
                alert('刪除失敗：' + e.message);
            }
        }

        // ═════════════════ 主分頁切換 ═════════════════
        function switchView(view) {
            if (view === 'admin' && !isAdmin()) return;

            state.view = view;

            document.querySelectorAll('.main-tab').forEach(b => {
                b.classList.toggle('active', b.dataset.view === view);
            });
            document.querySelectorAll('.view').forEach(v => {
                v.style.display = 'none';
            });
            const el = document.getElementById(`view-${view}`);
            if (el) el.style.display = '';

            if (view === 'records') loadMyRecords();
            else if (view === 'ranking') loadRankingData();
            else if (view === 'admin') loadAdminStudents();
            else if (view === 'input') loadCurrentExam();
        }

        function updateAdminTabVisibility() {
            const tab = document.getElementById('admin-tab');
            if (!tab) return;
            if (isAdmin()) {
                tab.style.display = '';
            } else {
                tab.style.display = 'none';
                if (state.view === 'admin') switchView('input');
            }
        }

        // ═════════════════ 初始化 ═════════════════
        function init() {
            renderInputTabs();
            renderInputBoxes();
            renderRankingTabs();
            renderAdminTabs();

            document.querySelectorAll('.main-tab').forEach(btn => {
                btn.addEventListener('click', () => switchView(btn.dataset.view));
            });

            document.getElementById('admin-edit-close')
                .addEventListener('click', closeAdminEdit);
            document.getElementById('admin-save-btn')
                .addEventListener('click', saveAdminEdit);
            document.getElementById('admin-delete-btn')
                .addEventListener('click', deleteAdminRecord);

            loadCurrentExam();

            if (window.raingodFirebaseReady) {
                window.raingodFirebaseReady.then(() => {
                    const waitAuth = window.raingodAuthReady || Promise.resolve();
                    waitAuth.then(() => {
                        updateAdminTabVisibility();
                        if (state.view === 'input')        loadCurrentExam();
                        else if (state.view === 'records') loadMyRecords();
                        else if (state.view === 'ranking') loadRankingData();
                        else if (state.view === 'admin')   loadAdminStudents();
                    });
                });
            }

            if (window.raingodOnAuthStateChanged) {
                window.raingodOnAuthStateChanged(() => {
                    updateAdminTabVisibility();
                });
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
