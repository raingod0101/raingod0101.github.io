<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>個人檔案 - 雨神</title>
    <link rel="stylesheet" href="menu.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #f3f5f8;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .profile-page {
            width: min(100% - 32px, 560px);
            margin: 48px auto;
        }

        .profile-page h1 {
            margin: 0 0 24px;
            font-size: 1.8rem;
        }

        .profile-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .profile-card {
            margin-bottom: 18px;
            padding: 24px;
            border: 1px solid #e2e6ed;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 8px 24px rgba(25, 40, 60, 0.06);
        }

        .profile-card h2 {
            margin: 0 0 8px;
            font-size: 1.15rem;
        }

        .profile-help,
        .profile-status {
            color: #606a78;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .profile-avatar-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .profile-avatar {
            width: 104px;
            height: 104px;
            flex: 0 0 auto;
            border: 2px solid #e2e6ed;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-form {
            display: grid;
            gap: 14px;
            margin-top: 18px;
        }

        .profile-form label {
            display: grid;
            gap: 7px;
            font-size: 0.92rem;
            font-weight: 600;
        }

        .profile-form input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd2dc;
            border-radius: 8px;
            font: inherit;
        }

        .profile-form input:focus {
            border-color: #4285f4;
            outline: 2px solid rgba(66, 133, 244, 0.18);
        }

        .profile-button {
            width: fit-content;
            padding: 10px 16px;
            border: 0;
            border-radius: 8px;
            background: #2878e3;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .profile-button:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        .profile-button.secondary {
            background: #687385;
        }

        .profile-status {
            min-height: 1.4em;
            margin: 12px 0 0;
        }

        .profile-status.error {
            color: #b42318;
        }

        @media (max-width: 480px) {
            .profile-page {
                margin-top: 28px;
            }

            .profile-card {
                padding: 18px;
            }
        }
    </style>
</head>
<body>
    <div id="nav_bar"></div>
    <main class="profile-page">
        <div class="profile-heading">
            <h1>個人檔案</h1>
            <button id="sign-out" class="profile-button secondary" type="button" hidden>登出</button>
        </div>
        <p id="login-required" class="profile-help" hidden>請先登入帳號，再管理個人檔案。</p>
        <section id="profile-content" hidden>
            <section class="profile-card" aria-labelledby="avatar-heading">
                <h2 id="avatar-heading">個人頭像</h2>
                <div class="profile-avatar-row">
                    <img id="profile-avatar" class="profile-avatar" src="catdragon.png" alt="個人頭像">
                </div>
            </section>

            <section class="profile-card" aria-labelledby="name-heading">
                <h2 id="name-heading">顯示名稱</h2>
                <p class="profile-help">這項設定不需要輸入密碼。</p>
                <form id="name-form" class="profile-form">
                    <label>
                        名稱
                        <input id="display-name" type="text" maxlength="40" autocomplete="nickname" required>
                    </label>
                    <button class="profile-button" type="submit">儲存名稱</button>
                </form>
                <p id="name-status" class="profile-status" role="status"></p>
            </section>

            <section class="profile-card" aria-labelledby="password-heading">
                <h2 id="password-heading">變更密碼</h2>
                <p class="profile-help">為保護帳號安全，變更密碼時需要驗證目前密碼。</p>
                <form id="password-form" class="profile-form">
                    <label>
                        目前密碼
                        <input id="current-password" type="password" autocomplete="current-password" required>
                    </label>
                    <label>
                        新密碼（至少 6 個字元）
                        <input id="new-password" type="password" minlength="6" autocomplete="new-password" required>
                    </label>
                    <label>
                        確認新密碼
                        <input id="confirm-password" type="password" minlength="6" autocomplete="new-password" required>
                    </label>
                    <button class="profile-button" type="submit">變更密碼</button>
                </form>
                <p id="password-status" class="profile-status" role="status"></p>
            </section>
        </section>
    </main>
    <script src="menu.js"></script>
    <script>
        (async function() {
            const fallbackAvatar = 'https://raingod0101.github.io/catdragon.png';
            const content = document.getElementById('profile-content');
            const loginRequired = document.getElementById('login-required');
            const avatar = document.getElementById('profile-avatar');
            const nameForm = document.getElementById('name-form');
            const displayNameInput = document.getElementById('display-name');
            const passwordForm = document.getElementById('password-form');
            const signOutButton = document.getElementById('sign-out');
            let currentUser = null;

            function setStatus(id, message, isError = false) {
                const status = document.getElementById(id);
                if (status) {
                    status.textContent = message;
                    status.classList.toggle('error', isError);
                }
            }

            function setFormDisabled(form, disabled) {
                form.querySelectorAll('button, input').forEach(control => {
                    control.disabled = disabled;
                });
            }

            function errorMessage(error) {
                if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    return '目前密碼不正確，請確認後再試。';
                }
                if (error.code === 'auth/requires-recent-login') {
                    return '登入時間過久，請重新登入後再變更密碼。';
                }
                return error.message || '操作失敗，請稍後再試。';
            }

            nameForm.addEventListener('submit', async event => {
                event.preventDefault();
                const activeUser = (typeof firebase !== 'undefined' && firebase.auth) ? firebase.auth().currentUser : currentUser;
                if (!activeUser) return;

                const displayName = displayNameInput.value.trim();
                if (!displayName) {
                    setStatus('name-status', '請輸入顯示名稱。', true);
                    return;
                }

                setFormDisabled(nameForm, true);
                setStatus('name-status', '正在儲存…');
                try {
                    await activeUser.updateProfile({ displayName });
                    if (typeof activeUser.reload === 'function') {
                        await activeUser.reload();
                    }
                    const navAvatar = document.getElementById('user-avatar');
                    if (navAvatar) navAvatar.title = `個人檔案：${displayName}`;
                    setStatus('name-status', '顯示名稱已更新。');
                } catch (error) {
                    setStatus('name-status', errorMessage(error), true);
                } finally {
                    setFormDisabled(nameForm, false);
                }
            });

            passwordForm.addEventListener('submit', async event => {
                event.preventDefault();
                const activeUser = (typeof firebase !== 'undefined' && firebase.auth) ? firebase.auth().currentUser : currentUser;
                if (!activeUser || !activeUser.email) return;

                const currentPassword = document.getElementById('current-password').value;
                const newPassword = document.getElementById('new-password').value;
                const confirmPassword = document.getElementById('confirm-password').value;

                if (newPassword.length < 6) {
                    setStatus('password-status', '新密碼至少需要 6 個字元。', true);
                    return;
                }
                if (newPassword !== confirmPassword) {
                    setStatus('password-status', '兩次輸入的新密碼不一致。', true);
                    return;
                }

                setFormDisabled(passwordForm, true);
                setStatus('password-status', '正在變更密碼…');
                try {
                    const credential = firebase.auth.EmailAuthProvider.credential(activeUser.email, currentPassword);
                    await activeUser.reauthenticateWithCredential(credential);
                    await activeUser.updatePassword(newPassword);
                    passwordForm.reset();
                    setStatus('password-status', '密碼已成功變更。');
                } catch (error) {
                    setStatus('password-status', errorMessage(error), true);
                } finally {
                    setFormDisabled(passwordForm, false);
                }
            });

            try {
                if (window.raingodFirebaseReady) {
                    await window.raingodFirebaseReady;
                }
                if (window.raingodAuthReady) {
                    currentUser = await window.raingodAuthReady;
                }

                if (!currentUser && typeof firebase !== 'undefined' && firebase.auth) {
                    currentUser = firebase.auth().currentUser;
                }

                if (!currentUser) {
                    loginRequired.hidden = false;
                    return;
                }

                avatar.src = currentUser.photoURL || fallbackAvatar;
                displayNameInput.value = currentUser.displayName || (currentUser.email ? currentUser.email.split('@')[0] : '');
                signOutButton.hidden = false;

                signOutButton.addEventListener('click', async () => {
                    signOutButton.disabled = true;
                    try {
                        await firebase.auth().signOut();
                        if (typeof window.raingodClearLocalAccountData === 'function') {
                            window.raingodClearLocalAccountData();
                        }
                        window.location.href = 'index.html';
                    } catch (error) {
                        signOutButton.disabled = false;
                        alert(`登出失敗：${error.message}`);
                    }
                });

                content.hidden = false;
            } catch (error) {
                loginRequired.hidden = false;
                loginRequired.textContent = `載入個人檔案失敗：${errorMessage(error)}`;
                loginRequired.classList.add('error');
            }
        })();
    </script>
</body>
</html>
