    <title>Raingod</title>
    <style>
        :root {
            --sky-blue: #d1e9ff;    /* 淺天藍背景 */
            --deep-blue: #1e3a5f;   /* 深藍色文字 */
            --rain-blue: #5d8aa8;   /* 雨滴藍 */
            --glass-white: rgba(255, 255, 255, 0.25);
            --glass-card: rgba(255, 255, 255, 0.35);
            --btn-hover-bg: rgba(255, 255, 255, 0.5);
        }

        body, html {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #e3f2fd 0%, var(--sky-blue) 100%);
            color: var(--deep-blue);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* 雨絲 Canvas */
        #canvas-bg {
            position: fixed;
            top: 0; left: 0;
            z-index: 1;
            filter: blur(0.5px);
            pointer-events: none;
        }

        .hero-section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
            padding: 2rem 1rem;
            box-sizing: border-box;
        }

        /* 標題與內容卡片：毛玻璃質感 */
        .title-container {
            padding: 2.5rem 3rem;
            background: var(--glass-white);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(30, 58, 95, 0.08);
            text-align: center;
            max-width: 650px;
            width: 100%;
            box-sizing: border-box;
        }

        .raingod-title {
            font-size: clamp(2.2rem, 6vw, 4.5rem);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            margin: 0;
            background: linear-gradient(to bottom, var(--deep-blue), #4a90e2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tech-line {
            width: 80px; height: 1px;
            background: var(--deep-blue);
            margin: 1.5rem auto;
            opacity: 0.3;
        }

        /* 連結按鈕區塊 */
        .promo-links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .promo-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.4rem;
            background: rgba(255, 255, 255, 0.35);
            color: var(--deep-blue);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .promo-btn:hover {
            background: var(--btn-hover-bg);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 58, 95, 0.15);
            color: #000;
        }

        /* 最近更新記錄區塊 (Update Log) */
        .changelog-box {
            background: var(--glass-card);
            border-radius: 12px;
            padding: 1.2rem 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: left;
            margin-top: 1rem;
        }

        .changelog-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin: 0 0 0.8rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--deep-blue);
        }

        .changelog-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 0.9rem;
            max-height: 150px;
            overflow-y: auto;
        }

        .changelog-item {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .changelog-item:last-child {
            margin-bottom: 0;
        }

        .changelog-date {
            font-size: 0.8rem;
            font-weight: 600;
            background: rgba(30, 58, 95, 0.1);
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            white-space: nowrap;
        }

        .changelog-text {
            color: rgba(30, 58, 95, 0.9);
        }
    </style>

<body>

    <canvas id="canvas-bg"></canvas>

    <section class="hero-section">

    <!-- 下背景動態雨滴腳本 -->
    <script>
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const rainCount = 100;
        const rains = [];

        class Rain {
            constructor() {
                this.init();
            }
            init() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height - canvas.height;
                this.length = Math.random() * 30 + 20;
                this.speed = Math.random() * 10 + 10;
                this.opacity = Math.random() * 0.4 + 0.3;
            }
            draw() {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(93, 138, 168, ${this.opacity})`;
                ctx.lineWidth = 1.5;
                ctx.lineCap = 'round';
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x, this.y + this.length);
                ctx.stroke();
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.height) this.init();
                this.draw();
            }
        }

        for (let i = 0; i < rainCount; i++) {
            rains.push(new Rain());
        }

        function animate() {
            ctx.fillStyle = "rgba(209, 233, 255, 0.5)"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            rains.forEach(r => r.update());
            requestAnimationFrame(animate);
        }

        animate();
    </script>

    <!-- 裝置獨立追蹤與次數累加腳本 (Firebase Realtime Database) -->
    <script>
        (async function trackDevice() {
            const dbBaseUrl = "https://game-24b43-default-rtdb.firebaseio.com/devices";

            // 1. 檢查 localStorage 是否已有裝置 ID，沒有就產生一個專屬 ID
            let deviceId = localStorage.getItem("raingod_device_id");
            if (!deviceId) {
                deviceId = 'dev_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
                localStorage.setItem("raingod_device_id", deviceId);
            }

            const deviceUrl = `${dbBaseUrl}/${deviceId}.json`;

            // 2. 取得裝置與瀏覽器資訊
            const userAgent = navigator.userAgent;
            const isMobile = /Mobi|Android|iPhone|iPad/i.test(userAgent);
            const deviceType = isMobile ? "Mobile" : "Desktop";

            let browser = "Unknown";
            if (userAgent.includes("Firefox")) browser = "Firefox";
            else if (userAgent.includes("SamsungBrowser")) browser = "Samsung Internet";
            else if (userAgent.includes("Opera") || userAgent.includes("OPR")) browser = "Opera";
            else if (userAgent.includes("Trident")) browser = "Internet Explorer";
            else if (userAgent.includes("Edge") || userAgent.includes("Edg")) browser = "Edge";
            else if (userAgent.includes("Chrome")) browser = "Chrome";
            else if (userAgent.includes("Safari")) browser = "Safari";

            // 3. 取得 IP 與地理位置資訊
            let geoData = {};
            try {
                const response = await fetch("https://ipapi.co/json/");
                if (response.ok) {
                    geoData = await response.json();
                }
            } catch (err) {
                console.warn("無法取得 IP 資訊：", err);
            }

            // 4. 先向 Firebase 取得該裝置先前的紀錄（判斷是否有舊資料以累加次數）
            let existingData = null;
            try {
                const getRes = await fetch(deviceUrl);
                if (getRes.ok) {
                    existingData = await getRes.json();
                }
            } catch (err) {
                console.error("讀取裝置資料失敗：", err);
            }

            const now = new Date().toISOString();
            const localTime = new Date().toLocaleString("zh-TW", { timeZoneName: "short" });

            let visitCount = 1;
            let firstVisitTime = now;

            if (existingData) {
                visitCount = (existingData.visitCount || 0) + 1;
                firstVisitTime = existingData.firstVisit || now;
            }

            // 5. 組合要寫入 Firebase 的資料包
            const payload = {
                deviceId: deviceId,
                visitCount: visitCount,
                firstVisit: firstVisitTime,
                lastVisit: now,
                localTime: localTime,
                ip: geoData.ip || (existingData ? existingData.ip : "Unknown"),
                country: geoData.country_name || (existingData ? existingData.country : "Unknown"),
                city: geoData.city || (existingData ? existingData.city : "Unknown"),
                region: geoData.region || (existingData ? existingData.region : "Unknown"),
                org: geoData.org || (existingData ? existingData.org : "Unknown"),
                device: deviceType,
                browser: browser,
                screenResolution: `${window.screen.width}x${window.screen.height}`,
                language: navigator.language || "Unknown",
                pageTitle: document.title
            };

            // 6. 使用 PUT 將該裝置的獨立資料更新到 Firebase (同裝置永遠只會有一筆，次數會疊加)
            try {
                await fetch(deviceUrl, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });
                console.log(`裝置資料已同步。目前此裝置總造訪次數: ${visitCount}`);
            } catch (error) {
                console.error("寫入 Firebase 失敗：", error);
            }
        })();
    </script>
