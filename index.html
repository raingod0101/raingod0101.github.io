<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raingod</title>
    <style>
        :root {
            --sky-blue: #d1e9ff;    /* 淺天藍背景 */
            --deep-blue: #1e3a5f;   /* 深藍色文字 */
            --rain-blue: #5d8aa8;   /* 雨滴藍 */
            --glass-white: rgba(255, 255, 255, 0.25);
            --btn-hover-bg: rgba(255, 255, 255, 0.4);
        }

        body, html {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #e3f2fd 0%, var(--sky-blue) 100%);
            color: var(--deep-blue);
            font-family: 'Inter', -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* 讓雨絲 Canvas 稍微帶點模糊感，增加雨天的濕潤氣息 */
        #canvas-bg {
            position: fixed;
            top: 0; left: 0;
            z-index: 1;
            filter: blur(0.5px);
        }

        .hero-section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        /* 標題區域：增加毛玻璃質感，模擬窗戶霧氣 */
        .title-container {
            padding: 3rem 4rem;
            background: var(--glass-white);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(30, 58, 95, 0.08);
            text-align: center;
            max-width: 90%;
        }

        .raingod-title {
            font-size: clamp(2.5rem, 8vw, 5.5rem);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5em;
            margin: 0;
            background: linear-gradient(to bottom, var(--deep-blue), #4a90e2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tech-line {
            width: 80px; height: 1px;
            background: var(--deep-blue);
            margin: 2rem auto;
            opacity: 0.3;
        }

        /* 推薦連結區塊樣式 */
        .promo-links {
            display: flex;
            gap: 1.2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .promo-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.6rem;
            background: rgba(255, 255, 255, 0.3);
            color: var(--deep-blue);
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .promo-btn:hover {
            background: var(--btn-hover-bg);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 58, 95, 0.15);
            color: #000;
        }

        .promo-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
    <meta name="google-site-verification" content="DHoxyhTQd1xafZ8eeKqYGzC76x6YkDO3Z8jWS9muSTw" />
</head>
<body>
<link rel="stylesheet" href="menu.css">

<div id="nav_bar"></div>

<script src="menu.js"></script>
    <canvas id="canvas-bg"></canvas>

    <section class="hero-section">
        <div class="title-container">
            <h1 class="raingod-title">RAINGOD</h1>
            <div class="tech-line"></div>

            <!-- 新增的連結按鈕區域 -->
            <div class="promo-links">
                <!-- 請將下面的 href 改成你的 Roblox 遊戲網址 -->
                <a href="https://www.roblox.com/games/139127575355680" target="_blank" rel="noopener noreferrer" class="promo-btn">
                    我的 Roblox 遊戲
                </a>
                <!-- 請將下面的 href 改成你的 YouTube 頻道網址 -->
                <a href="https://www.youtube.com/@raingod0101" target="_blank" rel="noopener noreferrer" class="promo-btn">
                     我的 YouTube 頻道
                </a>
            </div>
        </div>
    </section>

    <script>
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const rainCount = 100;
        const rains = [];

        class Rain {
            constructor() {
                this.init();
            }
            init() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height - canvas.height;
                this.length = Math.random() * 30 + 20; // 增長的雨絲更清晰
                this.speed = Math.random() * 10 + 10;  // 穩定中速
                this.opacity = Math.random() * 0.4 + 0.3; // 較高透明度確保藍色顯現
            }
            draw() {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(93, 138, 168, ${this.opacity})`; // 使用雨滴藍
                ctx.lineWidth = 1.5;
                ctx.lineCap = 'round';
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x, this.y + this.length);
                ctx.stroke();
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.height) this.init();
                this.draw();
            }
        }

        for (let i = 0; i < rainCount; i++) {
            rains.push(new Rain());
        }

        function animate() {
            // 使用淺色刷掉背景，保留適度殘影
            ctx.fillStyle = "rgba(209, 233, 255, 0.5)"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            rains.forEach(r => r.update());
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
