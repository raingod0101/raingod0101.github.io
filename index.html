<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d1e9ff">
<title>Raingod</title>
<style>
    :root {
        --sky-blue: #d1e9ff;
        --deep-blue: #1e3a5f;
        --rain-blue: #5d8aa8;
        --glass-white: rgba(255, 255, 255, 0.25);
        --glass-card: rgba(255, 255, 255, 0.35);
        --btn-hover-bg: rgba(255, 255, 255, 0.5);
    }
    body, html {
        margin: 0; padding: 0;
        background: linear-gradient(135deg, #e3f2fd 0%, var(--sky-blue) 100%);
        color: var(--deep-blue);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
    }
    #canvas-bg {
        position: fixed;
        top: 0; left: 0;
        z-index: 1;
        filter: blur(0.5px);
        pointer-events: none;
    }
    .hero-section {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        z-index: 10;
        padding: 2rem 1rem;
        box-sizing: border-box;
        transition: opacity .25s ease, visibility .25s;
    }
    .title-container {
        padding: 2.5rem 3rem;
        background: transparent;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border-radius: 16px;
        border: 1px solid transparent;
        box-shadow: none;
        text-align: center;
        max-width: 650px;
        width: 100%;
        box-sizing: border-box;
    }
    .raingod-title {
        font-size: clamp(2.2rem, 6vw, 4.5rem);
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        margin: 0;
        background: linear-gradient(to bottom, var(--deep-blue), #4a90e2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .tech-line {
        width: 80px; height: 1px;
        background: var(--deep-blue);
        margin: 1.5rem auto;
        opacity: 0.3;
    }
    .promo-links {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 2rem;
    }
    .promo-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.7rem 1.4rem;
        background: rgba(255, 255, 255, 0.35);
        color: var(--deep-blue);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(4px);
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        cursor: pointer;
        font-family: inherit;
    }
    .promo-btn:hover {
        background: var(--btn-hover-bg);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(30, 58, 95, 0.15);
        color: #000;
    }
    .changelog-box {
        background: var(--glass-card);
        border-radius: 12px;
        padding: 1.2rem 1.5rem;
        border: 1px solid rgba(255, 255, 255, 0.5);
        text-align: left;
        margin-top: 1rem;
    }
    .changelog-title {
        font-size: 1.05rem;
        font-weight: 700;
        margin: 0 0 0.8rem 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--deep-blue);
    }
    .changelog-list {
        list-style: none;
        padding: 0;
        margin: 0;
        font-size: 0.9rem;
        max-height: 150px;
        overflow-y: auto;
    }
    .changelog-item {
        display: flex;
        align-items: baseline;
        gap: 0.8rem;
        margin-bottom: 0.5rem;
        line-height: 1.4;
    }
    .changelog-item:last-child { margin-bottom: 0; }
    .changelog-date {
        font-size: 0.8rem;
        font-weight: 600;
        background: rgba(30, 58, 95, 0.1);
        padding: 0.15rem 0.5rem;
        border-radius: 4px;
        white-space: nowrap;
    }
    .changelog-text { color: rgba(30, 58, 95, 0.9); }

    * { box-sizing: border-box; }
    body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, "Microsoft JhengHei", sans-serif;
        user-select: none;
    }
    #game {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: linear-gradient(#64c6ff, #d8f6ff 78%);
    }
    #title {
        display: none !important;
        position: absolute;
        z-index: 20;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        color: #174a70;
        font-size: 24px;
        font-weight: 900;
        white-space: nowrap;
        text-shadow: 0 2px white;
    }
    #help {
        position: absolute;
        z-index: 20;
        top: 55px;
        left: 50%;
        transform: translateX(-50%);
        color: #174a70;
        font-size: 13px;
        white-space: nowrap;
    }
    #info {
        position: absolute;
        z-index: 20;
        top: 84px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 15px;
        border-radius: 20px;
        background: #ffffffdf;
        color: #174a70;
        font-weight: bold;
        white-space: nowrap;
    }
    #restart {
        position: absolute;
        z-index: 30;
        top: 15px;
        right: 15px;
        border: 0;
        border-radius: 12px;
        padding: 11px 15px;
        color: white;
        background: #1675c1;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    }
    .cloud {
        position: absolute;
        width: 110px;
        height: 35px;
        border-radius: 40px;
        background: white;
        opacity: .9;
        animation: cloudMove 24s linear infinite;
    }
    .cloud::before, .cloud::after {
        content: "";
        position: absolute;
        bottom: 0;
        border-radius: 50%;
        background: white;
    }
    .cloud::before { width: 45px; height: 45px; left: 15px; }
    .cloud::after { width: 55px; height: 55px; right: 15px; }
    @keyframes cloudMove {
        from { translate: -150px 0; }
        to { translate: calc(100vw + 180px) 0; }
    }
    #farGrass {
        position: absolute;
        bottom: 60px;
        width: 100%;
        height: 100px;
        background: #91dc79;
        border-radius: 50% 50% 0 0 / 25% 25% 0 0;
    }
    #ground {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 85px;
        background: linear-gradient(#61c94c, #36a83d);
        border-top: 7px solid #318e38;
    }
    #ground::after {
        content: "";
        position: absolute;
        top: 13px;
        width: 100%;
        height: 8px;
        background: repeating-linear-gradient(90deg, transparent 0 25px, #a1e77e 25px 40px);
    }
    #rideCloud {
        position: absolute;
        display: none;
        width: 210px;
        height: 145px;
        z-index: 4;
        pointer-events: none;
        overflow: visible;
        filter: drop-shadow(0 7px 3px #31516b30);
        will-change: left, bottom;
    }
    #rideCloud svg { display: block; width: 100%; height: 100%; overflow: visible; }
    #rideCloud.flying {
        display: block;
        animation: cloudBob .65s ease-in-out infinite alternate;
    }
    @keyframes cloudBob { from { margin-top: -2px; } to { margin-top: 4px; } }
    #rideCloud.flying .evilEyes { animation: eyeGlow 1.2s ease-in-out infinite alternate; }
    @keyframes eyeGlow {
        from { filter: drop-shadow(0 0 0 transparent); }
        to { filter: drop-shadow(0 0 4px #ff2638); }
    }
    #monster {
        position: absolute;
        width: 260px;
        height: 195px;
        left: 50px;
        bottom: 65px;
        z-index: 5;
        transform-origin: 50% 100%;
        will-change: left, bottom;
    }
    #monster svg { width: 100%; height: 100%; overflow: visible; }
    .monster {
        fill: #24ed32;
        stroke: #000;
        stroke-width: 1.1;
        stroke-linejoin: round;
        stroke-linecap: round;
    }
    .leg { transform-box: view-box; }
    #leg1 { transform-origin: 126px 245px; }
    #leg2 { transform-origin: 155px 253px; }
    #leg3 { transform-origin: 191px 251px; }
    #leg4 { transform-origin: 220px 244px; }
    .walking #leg1, .walking #leg3 { animation: stepA .28s ease-in-out infinite alternate; }
    .walking #leg2, .walking #leg4 { animation: stepB .28s ease-in-out infinite alternate; }
    @keyframes stepA {
        from { transform: rotate(-20deg) translateY(0); }
        to { transform: rotate(20deg) translateY(-4px); }
    }
    @keyframes stepB {
        from { transform: rotate(20deg) translateY(-4px); }
        to { transform: rotate(-20deg) translateY(0); }
    }
    #bodyGroup { transform-box: view-box; transform-origin: 190px 220px; }
    .walking #bodyGroup { animation: bodyRun .28s ease-in-out infinite alternate; }
    @keyframes bodyRun {
        from { transform: translateY(1px) rotate(-1deg); }
        to { transform: translateY(-4px) rotate(1deg); }
    }
    #tail { transform-box: view-box; transform-origin: 120px 185px; }
    .walking #tail { animation: tailRun .28s ease-in-out infinite alternate; }
    #monster:not(.walking):not(.riding):not(.airborne) #tail { animation: tailIdle 1.5s ease-in-out infinite alternate; }
    @keyframes tailRun {
        from { transform: rotate(-12deg); }
        to { transform: rotate(12deg); }
    }
    @keyframes tailIdle {
        from { transform: rotate(-4deg); }
        to { transform: rotate(5deg); }
    }
    #monster:not(.walking):not(.riding):not(.airborne) #bodyGroup { animation: breathe 1.4s ease-in-out infinite; }
    @keyframes breathe {
        0%, 100% { transform: translateY(0) scaleY(1); }
        50% { transform: translateY(-2px) scaleY(1.015); }
    }
    .airborne #leg1, .airborne #leg3 { transform: rotate(-12deg) translateY(-5px); }
    .airborne #leg2, .airborne #leg4 { transform: rotate(12deg) translateY(-5px); }
    #monster.riding #bodyGroup { animation: ridingBody .6s ease-in-out infinite alternate; }
    #monster.riding #tail { animation: ridingTail .8s ease-in-out infinite alternate; }
    #monster.riding #leg1, #monster.riding #leg2, #monster.riding #leg3, #monster.riding #leg4 { animation: ridingLeg .6s ease-in-out infinite alternate; }
    @keyframes ridingBody {
        from { transform: translateY(0) rotate(-1deg); }
        to { transform: translateY(-3px) rotate(1deg); }
    }
    @keyframes ridingTail {
        from { transform: rotate(-8deg); }
        to { transform: rotate(9deg); }
    }
    @keyframes ridingLeg {
        from { transform: rotate(-5deg); }
        to { transform: rotate(7deg); }
    }
    #monster.landing { animation: land .16s ease-out; }
    @keyframes land {
        0% { scale: 1 1; }
        45% { scale: 1.04 .91; }
        100% { scale: 1 1; }
    }
    #mobileControls {
        position: absolute;
        z-index: 30;
        bottom: 100px;
        left: 0;
        width: 100%;
        padding: 0 20px;
        display: flex;
        justify-content: space-between;
        pointer-events: none;
    }
    .controlGroup { display: flex; gap: 10px; pointer-events: auto; }
    .control {
        width: 56px;
        height: 56px;
        border: 2px solid white;
        border-radius: 16px;
        background: #1768aacc;
        color: white;
        font-size: 24px;
        font-weight: bold;
        touch-action: none;
    }
    #flyBtn {
        width: auto;
        padding: 0 15px;
        font-size: 15px;
        background: #7550b9;
    }
    @media (min-width: 800px) {
        #mobileControls { opacity: .45; }
        #mobileControls:hover { opacity: 1; }
    }
    @media (max-width: 600px) {
        #title { top: 12px; font-size: 18px; }
        #help { top: 42px; font-size: 11px; }
        #info { top: 69px; font-size: 11px; }
        #restart { top: 10px; right: 8px; padding: 8px; font-size: 11px; }
        #monster { width: 210px; height: 157.5px; }
        #rideCloud { width: 175px; height: 121px; }
        #mobileControls { bottom: 90px; padding: 0 10px; }
        .controlGroup { gap: 6px; }
        .control { width: 47px; height: 47px; font-size: 21px; }
        #flyBtn { padding: 0 9px; font-size: 12px; }
    }
    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; overflow-y: auto; }
    #canvas-bg { pointer-events: none; }
    #game {
        display: block;
        position: relative;
        width: 100%;
        height: 100vh;
        min-height: 560px;
        overflow: hidden;
        z-index: 2;
    }
    #game #title, #game #help, #game #info,
    #game #mobileControls, #game .cloud, #game #farGrass, #game #ground,
    #game #rideCloud, #game #monster { position: absolute; }
    @media (max-width: 600px) { #game { min-height: 520px; } }
    :root { --weather-sky: #cfe7ff; }
    body { background: linear-gradient(180deg, #b8dcff 0%, #eaf6ff 58%, #c6e5ff 100%); transition: background 1s ease; }
    body.weather-sunset { background: linear-gradient(180deg, #ffb98b 0%, #ffd8a8 42%, #a7d9ff 100%); }
    body.weather-sunset #game { background: linear-gradient(180deg, #ffbd8f 0%, #ffe1b5 58%, #a7d9ff 100%); }
    #canvas-bg { z-index: 1; }
    #nav_bar { position: relative; z-index: 1000; }
    .hero-section { min-height: calc(100vh - 53px); z-index: 5; pointer-events: none; }
    .title-container { pointer-events: auto; }
    #game { position: fixed; inset: 53px 0 0; width: 100%; height: calc(100vh - 53px); min-height: 0; z-index: 3; background: linear-gradient(180deg, #cfe7ff 0%, #edf8ff 76%); transition: background 1s ease; }
    #game #title, #game #help, #game #info { display: none !important; }
    #game #mobileControls { z-index: 8; }
    #farGrass { opacity: .72; }
    #ground { opacity: .85; }
    .home-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: .65rem; margin: .25rem 0 .65rem; }
    #introCaption { min-height: 1.4em; margin: 0 0 .75rem; font-size: .9rem; color: #234b75; font-weight: 600; display: none; }
    #introBtn { background: #dff2ff; }
    #weatherBtn { font-family: inherit; cursor: pointer; outline: none; max-width: 100%; }
    #weatherBtn option { background: #e8f5ff; color: #1e3a5f; }
    #weatherEffects {
        position: fixed;
        inset: 53px 0 0;
        z-index: 2;
        pointer-events: none;
        overflow: hidden;
        transition: background 0.6s ease;
    }
    #monster, #rideCloud { z-index: 5; }
    #monster #petSpeech { z-index: 80; }

    /* 晴天 */
    body.weather-sunny #game { background: linear-gradient(#54baff, #d9f5ff 78%); }
    /* 多雲 */
    body.weather-cloudy #game { background: linear-gradient(#9dbbd0, #e2edf4 78%); }
    /* 陰天 */
    body.weather-overcast #game { background: linear-gradient(#778999, #c2ccd4 78%); }
    /* 降雨 */
    body.weather-shower #game,
    body.weather-light-rain #game { background: linear-gradient(#789bb8, #c5d9e8 78%); }
    body.weather-moderate-rain #game,
    body.weather-heavy-rain #game,
    body.weather-rainstorm #game,
    body.weather-severe-rainstorm #game,
    body.weather-extreme-rainstorm #game,
    body.weather-light-moderate-rain #game,
    body.weather-moderate-heavy-rain #game,
    body.weather-heavy-rainstorm #game,
    body.weather-rainstorm-severe #game,
    body.weather-severe-extreme-rain #game { background: linear-gradient(#526a83, #a4bbce 78%); }
    /* 雷雨 */
    body.weather-thunderstorm #game,
    body.weather-hailstorm #game { background: linear-gradient(#29394e, #8b9daf 78%); }
    /* 雪天 */
    body.weather-snow-shower #game,
    body.weather-light-snow #game,
    body.weather-moderate-snow #game,
    body.weather-heavy-snow #game,
    body.weather-blizzard #game,
    body.weather-light-moderate-snow #game,
    body.weather-moderate-heavy-snow #game,
    body.weather-heavy-blizzard #game,
    body.weather-sleet #game { background: linear-gradient(#a6c8e0, #eff8ff 78%); }
    /* 霧 */
    body.weather-fog #game { background: linear-gradient(#b8c6ce, #e2e8eb 78%); }
    body.weather-fog #weatherEffects {
        background: linear-gradient(180deg, #e7edf0a0, #ffffff99, #d8e1e799);
    }
    /* 凍雨 */
    body.weather-freezing-rain #game { background: linear-gradient(#839caf, #d7e7f2 78%); }
    /* 沙塵、浮塵、揚沙 */
    body.weather-sandstorm #game,
    body.weather-floating-dust #game,
    body.weather-blowing-sand #game,
    body.weather-strong-sandstorm #game { background: linear-gradient(#b69b72, #e2d0aa 78%); }
    body.weather-sandstorm #weatherEffects,
    body.weather-floating-dust #weatherEffects,
    body.weather-blowing-sand #weatherEffects,
    body.weather-strong-sandstorm #weatherEffects {
        background: linear-gradient(90deg, #b68b4a33, #d6b77955, #b68b4a33);
    }
    /* 陽光 */
    #sunlight {
        position: absolute;
        width: 180px;
        height: 180px;
        top: 35px;
        right: 8%;
        border-radius: 50%;
        background: radial-gradient(circle, #fffbdc 0%, #fff4a855 40%, #fff4a800 72%);
        display: none;
        animation: sunPulse 3s ease-in-out infinite alternate;
    }
    body.weather-sunny #sunlight { display: block; }
    @keyframes sunPulse {
        from { transform: scale(.95); opacity: .75; }
        to { transform: scale(1.08); opacity: 1; }
    }
    /* 閃電 */
    #lightning {
        position: absolute;
        inset: 0;
        background: white;
        opacity: 0;
    }
    body.weather-thunderstorm #lightning,
    body.weather-hailstorm #lightning { animation: lightningFlash 7s linear infinite; }
    @keyframes lightningFlash {
        0%, 88%, 91%, 94%, 100% { opacity: 0; }
        89% { opacity: .65; }
        90% { opacity: .05; }
        92% { opacity: .45; }
    }
    #weatherParticles {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
    }
    #weatherEffects, #weatherParticles, #sunlight, #lightning { pointer-events: none; }
    #monster.intro-flying { filter: drop-shadow(0 8px 8px #21476b45); }
    @media(max-width:600px) {
        .hero-section { min-height: calc(100vh - 53px); padding: 1rem .6rem; }
        .title-container { padding: 1.3rem 1rem; }
    }
    /* 聊天框 */
    #petSpeech {
        position: absolute;
        z-index: 80;
        left: 72%;
        top: 42px;
        transform: translateY(-50%);
        transform-origin: center center;
        width: max-content;
        max-width: min(260px, 65vw);
        padding: 10px 14px;
        border: 2px solid #234b75;
        border-radius: 16px;
        background: #fff;
        color: #173653;
        font: 600 14px/1.45 Arial, "Microsoft JhengHei", sans-serif;
        white-space: normal;
        overflow-wrap: anywhere;
        box-shadow: 0 5px 18px #17365330;
        display: none;
        pointer-events: none;
    }
    #petSpeechText { transform: none; transform-origin: center center; }
    #monster[style*="scaleX(-1)"] #petSpeechText { transform: scaleX(-1); }
    #petSpeech::after {
        content: "";
        position: absolute;
        left: -8px;
        top: 50%;
        width: 14px;
        height: 14px;
        background: #fff;
        border-left: 2px solid #234b75;
        border-bottom: 2px solid #234b75;
        transform: translateY(-50%) rotate(45deg);
    }
    #petSpeech.show { display: block; animation: bubblePop .18s ease-out; }
    @keyframes bubblePop {
        from { opacity: 0; scale: .92; }
        to { opacity: 1; scale: 1; }
    }
    @media (max-width: 600px) {
        #petSpeech {
            left: 70%;
            top: 35px;
            max-width: min(210px, 60vw);
            padding: 8px 10px;
            font-size: 12px;
        }
    }

    /* ===== 多段循環隱藏按鈕 ===== */
    #toggleBattleButtons {
        position: fixed;
        z-index: 20000;
        top: 64px;
        right: 14px;
        border: 1px solid #ffffff;
        border-radius: 14px;
        padding: 10px 14px;
        background: #1768b8;
        color: #fff;
        box-shadow: 0 4px 14px #17365340;
        font: 800 14px Arial, "Microsoft JhengHei", sans-serif;
        cursor: pointer;
    }
    #toggleBattleButtons:hover { background: #0e5598; transform: translateY(-1px); }

    /* 導覽列永遠顯示 */
    #nav_bar {
        visibility: visible !important;
        pointer-events: auto !important;
    }

    /* 第 1 段：隱藏首頁資訊與連結（Roblox / YouTube / 偷蛋 / 商家） */
    body.hide-links .hero-section {
        visibility: hidden !important;
        opacity: 0;
        pointer-events: none !important;
    }
    body.hide-links .hero-section .title-container { pointer-events: none !important; }

    /* 第 2 段：隱藏技能按鈕、血條、戰鬥訊息 */
    body.hide-skills #battleUI .battle-top,
    body.hide-skills #battleUI .hpbox,
    body.hide-skills #battleMessage,
    body.hide-skills .overhead-hp {
        visibility: hidden !important;
        pointer-events: none !important;
    }

    /* 第 3 段：隱藏移動按鈕 */
    body.hide-controls #mobileControls {
        visibility: hidden !important;
        pointer-events: none !important;
    }

    /* 保留舊的 ui-hidden 規則，避免與其他功能衝突 */
    body.ui-hidden .hero-section,
    body.ui-hidden #battleUI .battle-top button:not(#toggleBattleButtons),
    body.ui-hidden #battleUI .hpbox,
    body.ui-hidden #battleMessage,
    body.ui-hidden #mobileControls,
    body.ui-hidden #title,
    body.ui-hidden #help,
    body.ui-hidden #info {
        visibility: hidden !important;
        pointer-events: none !important;
    }
    body.ui-hidden .hero-section { pointer-events: none !important; }

    /* 頭頂血量 */
    .overhead-hp {
        position: absolute;
        z-index: 40;
        width: 132px;
        padding: 5px 7px;
        box-sizing: border-box;
        border: 1px solid #ffffffed;
        border-radius: 10px;
        background: rgba(255, 255, 255, .92);
        color: #173653;
        text-align: center;
        font: 800 12px Arial, "Microsoft JhengHei", sans-serif;

<script>
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();
    const rainCount = 100;
    const rains = [];
    class Rain {
        constructor() { this.init(); }
        init() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height - canvas.height;
            this.length = Math.random() * 30 + 20;
            this.speed = Math.random() * 10 + 10;
            this.opacity = Math.random() * 0.4 + 0.3;
        }
        draw() {
            ctx.beginPath();
            ctx.strokeStyle = `rgba(93, 138, 168, ${this.opacity})`;
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x, this.y + this.length);
            ctx.stroke();
        }
        update() {
            this.y += this.speed;
            if (this.y > canvas.height) this.init();
            this.draw();
        }
    }
    for (let i = 0; i < rainCount; i++) rains.push(new Rain());
    function animate() {
        ctx.fillStyle = "rgba(209, 233, 255, 0.5)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        rains.forEach(r => r.update());
        requestAnimationFrame(animate);
    }
    animate();
</script>

<script>
    (async function trackDevice() {
        const dbBaseUrl = "https://game-24b43-default-rtdb.firebaseio.com/devices";
        let deviceId = localStorage.getItem("raingod_device_id");
        if (!deviceId) {
            deviceId = 'dev_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
            localStorage.setItem("raingod_device_id", deviceId);
        }
        const deviceUrl = `${dbBaseUrl}/${deviceId}.json`;
        const userAgent = navigator.userAgent;
        const isMobile = /Mobi|Android|iPhone|iPad/i.test(userAgent);
        const deviceType = isMobile ? "Mobile" : "Desktop";
        let browser = "Unknown";
        if (userAgent.includes("Firefox")) browser = "Firefox";
        else if (userAgent.includes("SamsungBrowser")) browser = "Samsung Internet";
        else if (userAgent.includes("Opera") || userAgent.includes("OPR")) browser = "Opera";
        else if (userAgent.includes("Trident")) browser = "Internet Explorer";
        else if (userAgent.includes("Edge") || userAgent.includes("Edg")) browser = "Edge";
        else if (userAgent.includes("Chrome")) browser = "Chrome";
        else if (userAgent.includes("Safari")) browser = "Safari";
        let geoData = {};
        try {
            const response = await fetch("https://ipapi.co/json/");
            if (response.ok) geoData = await response.json();
        } catch (err) { console.warn("無法取得 IP 資訊：", err); }
        let existingData = null;
        try {
            const getRes = await fetch(deviceUrl);
            if (getRes.ok) existingData = await getRes.json();
        } catch (err) { console.error("讀取裝置資料失敗：", err); }
        const now = new Date().toISOString();
        const localTime = new Date().toLocaleString("zh-TW", { timeZoneName: "short" });
        let visitCount = 1;
        let firstVisitTime = now;
        if (existingData) {
            visitCount = (existingData.visitCount || 0) + 1;
            firstVisitTime = existingData.firstVisit || now;
        }
        const payload = {
            deviceId: deviceId, visitCount: visitCount, firstVisit: firstVisitTime,
            lastVisit: now, localTime: localTime,
            ip: geoData.ip || (existingData ? existingData.ip : "Unknown"),
            country: geoData.country_name || (existingData ? existingData.country : "Unknown"),
            city: geoData.city || (existingData ? existingData.city : "Unknown"),
            region: geoData.region || (existingData ? existingData.region : "Unknown"),
            org: geoData.org || (existingData ? existingData.org : "Unknown"),
            device: deviceType, browser: browser,
            screenResolution: `${window.screen.width}x${window.screen.height}`,
            language: navigator.language || "Unknown", pageTitle: document.title
        };
        try {
            await fetch(deviceUrl, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            console.log(`裝置資料已同步。目前此裝置總造訪次數: ${visitCount}`);
        } catch (error) { console.error("寫入 Firebase 失敗：", error); }
    })();
</script>

<script>
    const game = document.getElementById("game");
    const monster = document.getElementById("monster");
    const cloud = document.getElementById("rideCloud");
    const statusText = document.getElementById("status");

    const keys = { left: false, right: false, up: false, down: false };
    const player = {
        x: 50, y: 0, vy: 0,
        speed: 300, jumpPower: 650, gravity: 1700,
        onGround: true, facing: 1, flying: false,
        dizzy: false, dizzyTimer: null,
        shakeCount: 0, lastDirection: 0, shakeTimer: null
    };
    const groundHeight = 65;
    let lastTime = performance.now();
    let landingTimer = null;

    function startFlying() {
        if (player.flying || player.dizzy) return;
        player.flying = true;
        player.vy = 0;
        player.onGround = false;
        player.y = Math.max(player.y, 155);
        monster.classList.remove("walking", "airborne", "landing");
        monster.classList.add("riding");
        cloud.classList.add("flying");
        cloud.style.display = "block";
        statusText.textContent = "邪惡雲朵載著你飛行！";
    }
    function stopFlying() {
        if (!player.flying) return;
        player.flying = false;
        player.vy = 0;
        cloud.classList.remove("flying");
        cloud.style.display = "none";
        monster.classList.remove("riding");
        player.y = Math.max(0, player.y);
        player.vy = -80;
        player.onGround = false;
        statusText.textContent = "準備降落";
    }
    function toggleFlying() {
        if (player.dizzy) return;
        if (player.flying) stopFlying();
        else startFlying();
    }
    function jump() {
        if (player.dizzy) return;
        if (player.flying) {
            player.y += 35;
            player.y = Math.min(player.y, game.clientHeight - 300);
            return;
        }
        if (!player.onGround) return;
        player.vy = player.jumpPower;
        player.onGround = false;
        monster.classList.remove("walking", "riding");
        monster.classList.add("airborne");
        statusText.textContent = "跳躍中！";
    }
    function setKey(code, down) {
        if (code === "ArrowLeft" || code === "KeyA") keys.left = down;
        if (code === "ArrowRight" || code === "KeyD") keys.right = down;
        if (code === "ArrowUp" || code === "KeyW") keys.up = down;
        if (code === "ArrowDown" || code === "KeyS") keys.down = down;
    }
    document.addEventListener("keydown", event => {
        if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(event.code)) event.preventDefault();
        setKey(event.code, true);
        if (event.code === "KeyF" && !event.repeat) toggleFlying();
        if (["Space", "ArrowUp", "KeyW"].includes(event.code) && !event.repeat) jump();
    });
    document.addEventListener("keyup", event => setKey(event.code, false));
    window.addEventListener("blur", () => Object.keys(keys).forEach(key => keys[key] = false));

    function bindHoldButton(button, keyName) {
        function activate() {
            if (player.dizzy) return;
            if (keyName === "up" && !player.flying) { jump(); return; }
            keys[keyName] = true;
        }
        button.addEventListener("mouseenter", () => {
            if (window.matchMedia("(hover: hover)").matches) activate();
        });
        button.addEventListener("mouseleave", () => {
            if (window.matchMedia("(hover: hover)").matches) keys[keyName] = false;
        });
        button.addEventListener("pointerdown", event => {
            event.preventDefault();
            activate();
            try { button.setPointerCapture(event.pointerId); } catch (_) {}
        });
        function release() { keys[keyName] = false; }
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("lostpointercapture", release);
        button.addEventListener("touchstart", event => { event.preventDefault(); activate(); }, { passive: false });
        button.addEventListener("touchend", release, { passive: true });
    }
    bindHoldButton(document.getElementById("leftBtn"), "left");
    bindHoldButton(document.getElementById("rightBtn"), "right");
    bindHoldButton(document.getElementById("upBtn"), "up");
    bindHoldButton(document.getElementById("downBtn"), "down");

    const flyButton = document.getElementById("flyBtn");
    flyButton.addEventListener("mouseenter", () => {
        if (window.matchMedia("(hover: hover)").matches) toggleFlying();
    });
    flyButton.addEventListener("pointerdown", event => {
        if (event.pointerType === "touch") { event.preventDefault(); toggleFlying(); }
    });

    function triggerDizzy() {
        if (player.dizzy) return;
        player.dizzy = true;
        keys.left = keys.right = keys.up = keys.down = false;
        if (player.flying) stopFlying();
        monster.classList.add("dizzy");
        statusText.textContent = "(@_@) 好暈喔……";
        clearTimeout(player.dizzyTimer);
        player.dizzyTimer = setTimeout(() => {
            player.dizzy = false;
            monster.classList.remove("dizzy");
            statusText.textContent = "待機中";
        }, 3000);
    }

    function update(dt) {
        const gameWidth = game.clientWidth;
        const gameHeight = game.clientHeight;
        const monsterWidth = monster.offsetWidth;
        const maxX = Math.max(0, gameWidth - monsterWidth);
        let direction = 0;
        if (keys.left) direction--;
        if (keys.right) direction++;
        if (direction !== 0 && direction !== player.lastDirection) {
            player.shakeCount++;
            player.lastDirection = direction;
            clearTimeout(player.shakeTimer);
            player.shakeTimer = setTimeout(() => player.shakeCount = 0, 600);
            if (player.shakeCount >= 4) { triggerDizzy(); player.shakeCount = 0; }
        }
        if (player.dizzy) {
            cloud.style.display = "none";
            monster.classList.remove("walking", "airborne");
            statusText.textContent = "(@_@) 好暈喔……";
            monster.style.left = player.x + "px";
            monster.style.bottom = (groundHeight + player.y) + "px";
            return;
        }
        if (direction !== 0) {
            player.x += direction * player.speed * dt;
            player.facing = direction;
        }
        player.x = Math.max(0, Math.min(maxX, player.x));
        if (player.flying) {
            if (keys.up) player.y += player.speed * dt;
            if (keys.down) player.y -= player.speed * dt;
            const maxHeight = Math.max(100, gameHeight - groundHeight - monster.offsetHeight - 20);
            player.y = Math.max(0, Math.min(maxHeight, player.y));
            monster.classList.add("riding");
            monster.classList.remove("walking", "airborne");
            cloud.style.left = (player.x + monsterWidth / 2 - cloud.offsetWidth / 2) + "px";
            cloud.style.bottom = (groundHeight + player.y - cloud.offsetHeight + 7) + "px";
            cloud.style.display = "block";
            statusText.textContent = (direction !== 0 || keys.up || keys.down) ? "騎著邪惡雲朵飛行中 ☁" : "乘坐雲朵中 ☁";
        } else {
            if (!player.onGround) {
                const previousY = player.y;
                player.vy -= player.gravity * dt;
                player.y += player.vy * dt;
                if (player.y <= 0 && previousY >= 0) {
                    player.y = 0;
                    player.vy = 0;
                    player.onGround = true;
                    monster.classList.remove("airborne", "landing");
                    void monster.offsetWidth;
                    monster.classList.add("landing");
                    clearTimeout(landingTimer);
                    landingTimer = setTimeout(() => monster.classList.remove("landing"), 180);
                }
            }
            cloud.style.display = "none";
            if (player.onGround && direction !== 0) {
                monster.classList.add("walking");
                statusText.textContent = "走路中";
            } else if (!player.onGround) {
                monster.classList.remove("walking");
                statusText.textContent = player.vy > 0 ? "跳躍中！" : "落下中";
            } else {
                monster.classList.remove("walking");
                statusText.textContent = "待機中";
            }
        }
        monster.style.left = player.x + "px";
        monster.style.bottom = (groundHeight + player.y) + "px";
        monster.style.transform = player.facing < 0 ? "scaleX(-1)" : "scaleX(1)";
    }

    function gameLoop(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.033);
        lastTime = now;
        if (!introRunning) update(dt);
        requestAnimationFrame(gameLoop);
    }

    function initializePet() {
        player.x = Math.max(20, Math.min(70, game.clientWidth - monster.offsetWidth));
        player.y = 0; player.vy = 0; player.onGround = true;
        player.facing = 1; player.flying = false; player.dizzy = false;
        Object.keys(keys).forEach(key => keys[key] = false);
        monster.classList.remove("walking", "airborne", "riding", "landing", "intro-flying", "dizzy");
        monster.style.left = player.x + "px";
        monster.style.bottom = groundHeight + "px";
        monster.style.transform = "scaleX(1)";
        cloud.classList.remove("flying");
        cloud.style.display = "none";
        statusText.textContent = "待機中";
    }

    let introRunning = false;
    const introCaption = document.getElementById("introCaption");
    const introBtn = document.getElementById("introBtn");
    const navLabels = [
        { match: ["益智", "智益"], speech: "這裡是益智區，可以找到動腦解謎的內容。" },
        { match: ["遊戲"], speech: "這裡是遊戲區，收集了各種有趣的遊戲。" },
        { match: ["工具"], speech: "這裡是工具區，可以使用方便的小工具。" }
    ];

    function speak(text) {
        const bubble = document.getElementById("petSpeech");
        document.getElementById("petSpeechText").textContent = text;
        bubble.classList.add("show");
        introCaption.textContent = text;
        return new Promise(resolve => {
            const duration = Math.min(3500, Math.max(1200, text.length * 200));
            setTimeout(resolve, duration);
        });
    }
    function findNavItem(words) {
        const candidates = [...document.querySelectorAll('#nav_bar a, #nav_bar button, #nav_bar [role="button"], #nav_bar summary')];
        return candidates.find(el => words.some(word => (el.innerText || el.textContent || "").trim().includes(word)));
    }
    function flyPetTo(targetWorldX, targetWorldY) {
        return new Promise(resolve => {
            const startX = player.x;
            const startY = player.y;
            const finalX = Math.max(0, Math.min(game.clientWidth - monster.offsetWidth, targetWorldX - monster.offsetWidth / 2));
            const finalY = Math.max(20, Math.min(game.clientHeight - monster.offsetHeight - 40, targetWorldY));
            const duration = 800;
            const began = performance.now();
            player.flying = true;
            player.onGround = false;
            player.vy = 0;
            monster.classList.remove("walking", "airborne");
            monster.classList.add("riding", "intro-flying");
            cloud.classList.add("flying");
            cloud.style.display = "block";
            function frame(now) {
                const t = Math.min(1, (now - began) / duration);
                const eased = t * t * (3 - 2 * t);
                player.x = startX + (finalX - startX) * eased;
                player.y = startY + (finalY - startY) * eased;
                player.facing = finalX < startX ? -1 : 1;
                monster.style.left = player.x + "px";
                monster.style.bottom = (groundHeight + player.y) + "px";
                monster.style.transform = player.facing < 0 ? "scaleX(-1)" : "scaleX(1)";
                cloud.style.left = (player.x + monster.offsetWidth / 2 - cloud.offsetWidth / 2) + "px";
                cloud.style.bottom = (groundHeight + player.y - cloud.offsetHeight + 7) + "px";
                if (t < 1) requestAnimationFrame(frame);
                else resolve();
            }
            requestAnimationFrame(frame);
        });
    }
    async function runIntroduction() {
        if (introRunning) return;
        introRunning = true;
        introBtn.disabled = true;
        const intro = "你好！我是雨神的小怪獸。今天由我帶你認識雨神網站！";
        await speak(intro);
        const tourY = game.clientHeight * 0.65;
        await flyPetTo(game.clientWidth * 0.5, tourY);
        for (const item of navLabels) {
            const el = findNavItem(item.match);
            let targetX = game.clientWidth * 0.5;
            if (el) {
                const r = el.getBoundingClientRect();
                const gameRect = game.getBoundingClientRect();
                targetX = (r.left + r.width / 2) - gameRect.left;
            }
            await flyPetTo(targetX, tourY);
            await speak(item.speech);
        }
        await speak("介紹完畢！我回去囉！");
        await flyPetTo(Math.min(100, game.clientWidth * 0.12), 20);
        player.flying = false;
        player.onGround = true;
        player.y = 0;
        player.vy = 0;
        monster.classList.remove("riding", "intro-flying");
        cloud.classList.remove("flying");
        cloud.style.display = "none";
        statusText.textContent = "待機中";
        introCaption.textContent = "介紹完成！想再聽一次，按「介紹一下」。";
        document.getElementById("petSpeech").classList.remove("show");
        introRunning = false;
        introBtn.disabled = false;
    }
    introBtn.addEventListener("click", runIntroduction);

    const weatherSelect = document.getElementById("weatherBtn");
    const weatherCanvas = document.getElementById("weatherParticles");
    const weatherCtx = weatherCanvas.getContext("2d");
    const weatherEffects = document.getElementById("weatherEffects");

    const weatherTypes = [
        "sunny", "cloudy", "overcast", "shower", "thunderstorm", "hailstorm", "sleet",
        "light-rain", "moderate-rain", "heavy-rain", "rainstorm", "severe-rainstorm", "extreme-rainstorm",
        "snow-shower", "light-snow", "moderate-snow", "heavy-snow", "blizzard", "fog", "freezing-rain",
        "sandstorm", "light-moderate-rain", "moderate-heavy-rain", "heavy-rainstorm", "rainstorm-severe",
        "severe-extreme-rain", "light-moderate-snow", "moderate-heavy-snow", "heavy-blizzard",
        "floating-dust", "blowing-sand", "strong-sandstorm"
    ];
    let weatherParticles = [];
    let weatherWidth = 0, weatherHeight = 0;
    let weatherLastTime = 0, lightningTimer = 0, lightningPower = 0, windTime = 0;

    const weatherConfig = {
        sunny: { kind: "sun", count: 35, speed: 1, wind: 0.2 },
        cloudy: { kind: "cloud", count: 45, speed: 1, wind: 0.7 },
        overcast: { kind: "cloud", count: 75, speed: 1.2, wind: 1 },
        shower: { kind: "rain", count: 180, speed: 1.6, wind: 2 },
        "light-rain": { kind: "rain", count: 90, speed: 1, wind: 0.7 },
        "moderate-rain": { kind: "rain", count: 260, speed: 1.5, wind: 1.5 },
        "heavy-rain": { kind: "rain", count: 520, speed: 2.2, wind: 3 },
        rainstorm: { kind: "rain", count: 850, speed: 2.8, wind: 5 },
        "severe-rainstorm": { kind: "rain", count: 1250, speed: 3.5, wind: 7 },
        "extreme-rainstorm": { kind: "rain", count: 1800, speed: 4.2, wind: 10 },
        "light-moderate-rain": { kind: "rain", count: 175, speed: 1.3, wind: 1 },
        "moderate-heavy-rain": { kind: "rain", count: 390, speed: 2, wind: 2.5 },
        "heavy-rainstorm": { kind: "rain", count: 680, speed: 2.5, wind: 4 },
        "rainstorm-severe": { kind: "rain", count: 1050, speed: 3.2, wind: 6 },
        "severe-extreme-rain": { kind: "rain", count: 1500, speed: 3.9, wind: 8 },
        thunderstorm: { kind: "storm", count: 650, speed: 3, wind: 7 },
        hailstorm: { kind: "hail", count: 180, speed: 4, wind: 7 },
        sleet: { kind: "sleet", count: 300, speed: 2.2, wind: 4 },
        "freezing-rain": { kind: "ice", count: 360, speed: 2.5, wind: 3 },
        "snow-shower": { kind: "snow", count: 65, speed: 0.8, wind: 1 },
        "light-snow": { kind: "snow", count: 45, speed: 0.55, wind: 0.5 },
        "moderate-snow": { kind: "snow", count: 130, speed: 0.9, wind: 1.5 },
        "heavy-snow": { kind: "snow", count: 280, speed: 1.4, wind: 2.5 },
        blizzard: { kind: "snowstorm", count: 550, speed: 3, wind: 10 },
        "light-moderate-snow": { kind: "snow", count: 90, speed: 0.75, wind: 1 },
        "moderate-heavy-snow": { kind: "snow", count: 210, speed: 1.2, wind: 2 },
        "heavy-blizzard": { kind: "snowstorm", count: 750, speed: 3.8, wind: 13 },
        fog: { kind: "fog", count: 40, speed: 0.4, wind: 0.4 },
        sandstorm: { kind: "sand", count: 250, speed: 2, wind: 5 },
        "floating-dust": { kind: "dust", count: 100, speed: 0.6, wind: 1 },
        "blowing-sand": { kind: "sand", count: 200, speed: 2.5, wind: 7 },
        "strong-sandstorm": { kind: "sandstorm", count: 650, speed: 4, wind: 13 }
    };

    function resizeWeather() {
        const rect = weatherCanvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        weatherWidth = rect.width;
        weatherHeight = rect.height;
        weatherCanvas.width = Math.round(weatherWidth * dpr);
        weatherCanvas.height = Math.round(weatherHeight * dpr);
        weatherCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function makeParticle(kind, randomY = true) {
        const snow = kind === "snow" || kind === "snowstorm";
        const hail = kind === "hail";
        const sand = kind === "sand" || kind === "sandstorm";
        const fog = kind === "fog";
        const dust = kind === "dust";
        return {
            x: Math.random() * weatherWidth,
            y: randomY ? Math.random() * weatherHeight : -Math.random() * 100,
            size: snow ? 1.5 + Math.random() * 4 :
                  hail ? 2 + Math.random() * 4 :
                  fog ? 35 + Math.random() * 90 :
                  sand ? 1 + Math.random() * 3 :
                  dust ? 0.5 + Math.random() * 1.5 :
                  1 + Math.random() * 2.5,
            length: 12 + Math.random() * 28,
            speed: 0.5 + Math.random() * 1.5,
            phase: Math.random() * Math.PI * 2,
            alpha: 0.25 + Math.random() * 0.65,
            kind
        };
    }
    function createWeatherParticles() {
        const config = weatherConfig[weatherSelect.value] || weatherConfig.sunny;
        const mobile = window.innerWidth < 700;
        const count = Math.round(config.count * (mobile ? 0.45 : 1));
        weatherParticles = Array.from({ length: count }, () => makeParticle(config.kind));
    }
    function applyWeather() {
        const type = weatherSelect.value;
        document.body.classList.remove("weather-sunset", ...weatherTypes.map(name => "weather-" + name));
        document.body.classList.add("weather-" + type);
        lightningPower = 0; lightningTimer = 0; weatherLastTime = 0;
        resizeWeather();
        createWeatherParticles();
        weatherEffects.style.background = "";
        if (type === "fog") {
            weatherEffects.style.background = "linear-gradient(180deg,#e9f1f0aa,#ffffff77,#cdd9dfaa)";
        }
        if (["sandstorm", "floating-dust", "blowing-sand", "strong-sandstorm"].includes(type)) {
            weatherEffects.style.background = "linear-gradient(90deg,#b68b4a22,#d6b77955,#b68b4a22)";
        }
    }
    function drawWeather(now) {
        const dt = Math.min((now - (weatherLastTime || now)) / 16.67, 2);
        weatherLastTime = now;
        const config = weatherConfig[weatherSelect.value] || weatherConfig.sunny;
        const kind = config.kind;
        windTime += dt * 0.025;
        weatherCtx.clearRect(0, 0, weatherWidth, weatherHeight);
        if (kind === "storm" || kind === "hail") {
            lightningTimer -= dt;
            if (lightningTimer <= 0 && Math.random() < 0.035 * dt) {
                lightningPower = 0.35 + Math.random() * 0.5;
                lightningTimer = 10 + Math.random() * 25;
            }
            if (lightningPower > 0) {
                weatherCtx.fillStyle = `rgba(255,255,255,${lightningPower})`;
                weatherCtx.fillRect(0, 0, weatherWidth, weatherHeight);
                lightningPower *= Math.pow(0.72, dt);
                if (lightningPower < 0.025) lightningPower = 0;
            }
        }
        if (kind === "rain" || kind === "storm") {
            const intensity = config.count / 90;
            if (intensity >= 4) {
                const bands = Math.min(8, Math.floor(intensity));
                for (let i = 0; i < bands; i++) {
                    const x = (windTime * config.wind * 100 + i * 173) % (weatherWidth + 250) - 125;
                    const gradient = weatherCtx.createLinearGradient(x, 0, x - config.wind * 15, weatherHeight);
                    gradient.addColorStop(0, "rgba(180,210,235,0)");
                    gradient.addColorStop(0.5, `rgba(180,210,235,${0.025 + intensity * 0.004})`);
                    gradient.addColorStop(1, "rgba(180,210,235,0)");
                    weatherCtx.fillStyle = gradient;
                    weatherCtx.fillRect(x, 0, 220, weatherHeight);
                }
            }
        }
        for (const p of weatherParticles) {
            const gust = Math.sin(windTime + p.phase) * config.wind * 0.35;
            const drift = config.wind * 0.65 + gust;
            if (p.kind === "rain" || p.kind === "storm" || p.kind === "ice" || p.kind === "sleet") {
                const isExtreme = config.count >= 850;
                const isLight = config.count <= 100;
                weatherCtx.strokeStyle = p.kind === "ice"
                    ? `rgba(225,248,255,${p.alpha})`
                    : `rgba(${isExtreme ? "195,220,242" : "65,115,160"},${p.alpha})`;
                weatherCtx.lineWidth = isExtreme ? 1.6 + p.size * 0.35 : isLight ? 0.8 : 1;
                weatherCtx.beginPath();
                weatherCtx.moveTo(p.x, p.y);
                weatherCtx.lineTo(p.x - drift * (isExtreme ? 1.8 : 0.55), p.y + p.length * config.speed);
                weatherCtx.stroke();
                p.x -= drift * config.speed * dt;
                p.y += p.speed * config.speed * 5 * dt;
                if (p.kind === "sleet" && Math.random() < 0.025) {
                    weatherCtx.fillStyle = "#ffffff";
                    weatherCtx.beginPath();
                    weatherCtx.arc(p.x, p.y, p.size + 1, 0, Math.PI * 2);
                    weatherCtx.fill();
                }
            } else if (p.kind === "hail") {
                weatherCtx.fillStyle = `rgba(235,248,255,${p.alpha})`;
                weatherCtx.beginPath();
                weatherCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                weatherCtx.fill();
                weatherCtx.fillStyle = "rgba(255,255,255,.9)";
                weatherCtx.beginPath();
                weatherCtx.arc(p.x - 1, p.y - 1, p.size * 0.35, 0, Math.PI * 2);
                weatherCtx.fill();
                p.x -= drift * config.speed * dt;
                p.y += p.speed * config.speed * 5 * dt;
            } else if (p.kind === "snow" || p.kind === "snowstorm") {
                weatherCtx.fillStyle = `rgba(255,255,255,${p.alpha})`;
                weatherCtx.beginPath();
                weatherCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                weatherCtx.fill();
                p.x += (Math.sin(windTime + p.phase) * 1.5 - drift * 0.4) * config.speed * dt;
                p.y += p.speed * config.speed * (p.kind === "snowstorm" ? 3 : 1.5) * dt;
            } else if (p.kind === "sand" || p.kind === "sandstorm" || p.kind === "dust") {
                weatherCtx.fillStyle = p.kind === "dust"
                    ? `rgba(150,125,90,${p.alpha * 0.4})`
                    : `rgba(190,143,75,${p.alpha * 0.7})`;
                weatherCtx.beginPath();
                weatherCtx.ellipse(p.x, p.y, p.size * 1.8, p.size, 0, 0, Math.PI * 2);
                weatherCtx.fill();
                p.x += (config.wind * 1.5 + p.speed * 2) * dt;
                p.y += Math.sin(windTime + p.phase) * config.speed * dt;
            } else if (p.kind === "fog") {
                const fogGradient = weatherCtx.createRadialGradient(p.x, p.y, 2, p.x, p.y, p.size);
                fogGradient.addColorStop(0, "rgba(255,255,255,0.16)");
                fogGradient.addColorStop(1, "rgba(255,255,255,0)");
                weatherCtx.fillStyle = fogGradient;
                weatherCtx.beginPath();
                weatherCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                weatherCtx.fill();
                p.x += Math.sin(windTime + p.phase) * 0.6 * dt;
                p.y += Math.cos(windTime + p.phase) * 0.25 * dt;
            } else if (p.kind === "cloud") {
                weatherCtx.fillStyle = "rgba(255,255,255,0.07)";
                weatherCtx.beginPath();
                weatherCtx.ellipse(p.x, p.y, 55 + p.size * 5, 18 + p.size * 2, 0, 0, Math.PI * 2);
                weatherCtx.fill();
                p.x += config.wind * 0.3 * dt;
            }
            if (p.y > weatherHeight + 50) {
                p.y = -Math.random() * 80;
                p.x = Math.random() * weatherWidth;
            }
            if (p.x > weatherWidth + 80) p.x = -30;
            if (p.x < -80) p.x = weatherWidth + 30;
        }
        requestAnimationFrame(drawWeather);
    }
    weatherSelect.addEventListener("change", applyWeather);
    window.addEventListener("resize", () => { resizeWeather(); createWeatherParticles(); });
    applyWeather();
    requestAnimationFrame(drawWeather);
    window.addEventListener("resize", () => {
        player.x = Math.max(0, Math.min(player.x, game.clientWidth - monster.offsetWidth));
    });
    initializePet();
    requestAnimationFrame(gameLoop);
</script>

    @keyframes headTiltUp {
        0% { transform: rotate(0deg) translateY(0); }
        35% { transform: rotate(-7deg) translateY(-2px); }
        65% { transform: rotate(-5deg) translateY(-1px); }
        100% { transform: rotate(0deg) translateY(0); }
    }
    #fireGod.lost #eye, #monster.lost #eye { display: none !important; }
    #fireGod.lost .xeyes, #monster.lost .xeyes { display: block !important; }
    .xeyes { display: none; pointer-events: none; }
    .xeyes line { stroke: #000; stroke-width: 5; stroke-linecap: round; }
    #battleUI button.cooling { opacity: .58; filter: grayscale(.35); cursor: not-allowed; }
    #battleUI button .cooldown-count { font-weight: 800; margin-left: 4px; color: #b42318; }
    .battleCloudMount {
        position: absolute;
        z-index: 22;
        width: 145px; height: 99px;
        pointer-events: none;
        transition: left .7s cubic-bezier(.2, .75, .25, 1), top .7s cubic-bezier(.2, .75, .25, 1);
        filter: drop-shadow(0 5px 5px #0004);
    }
    .battleCloudMount svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .battleCloudMount #rideCloud { display: block !important; position: static !important; width: 100% !important; height: 100% !important; filter: none !important; animation: none !important; }
    .battleCloudMount .evilEyes { animation: eyeGlow .65s ease-in-out infinite alternate; }
    .battleProjectile { position: absolute; font-size: 30px; z-index: 20; animation: projectileFly .55s linear forwards; white-space: nowrap; }
    @keyframes projectileFly {
        from { transform: translate(0, 0) scale(.7); opacity: 1; }
        to { transform: translate(var(--dx), var(--dy)) scale(1.25); opacity: .1; }
    }
    @keyframes bitePop {
        0% { transform: scale(1); }
        45% { transform: scale(1.1) rotate(-4deg); }
        100% { transform: scale(1); }
    }
    #monster.eating, #fireGod.eating { animation: bitePop .35s ease; }
    .battleCloud { position: absolute; z-index: 22; font-size: 50px; left: 0; top: 0; transition: left .55s ease, top .55s ease; filter: drop-shadow(0 3px 3px #0002); }
    .battleLightning { position: absolute; z-index: 23; font-size: 62px; transform: translateX(-50%); animation: lightningHit 1.1s ease-out forwards; }
    @keyframes lightningHit {
        0% { opacity: 0; transform: translateX(-50%) scaleY(.2); }
        15% { opacity: 1; transform: translateX(-50%) scaleY(1.15); }
        78% { opacity: 1; }
        100% { opacity: 0; }
    }
    .tsunamiWave { position: absolute; z-index: 22; font-size: 90px; left: -130px; top: 0; animation: tsunamiRun 1.05s linear forwards; }
    @keyframes tsunamiRun {
        from { transform: translateX(0) scale(1); }
        to { transform: translateX(var(--wave-distance)) scale(1.5); }
    }
    @keyframes fireRush {
        0% { transform: scaleX(-1) translateX(0); }
        50% { transform: scaleX(-1) translateX(-65px) scale(1.08); }
        100% { transform: scaleX(-1) translateX(0); }
    }
    #fireGod.rushing { animation: fireRush .55s ease-in-out; }
    @media(max-width:600px) {
        #battleUI { top: 5px; width: 98vw; }
        #battleUI button { padding: 5px 7px; font-size: 10px; }
        #battleUI .hpbox { min-width: 95px; font-size: 11px; }
        #battleMessage { font-size: 10px; }
        #fireGod { width: 160px; height: 120px; right: 2%; bottom: 65px; }
        .tsunamiWave { font-size: 65px; }
    }
</style>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const stage = document.getElementById('game');
        const pet = document.getElementById('monster');
        const ui = document.getElementById('battleUI');
        if (!stage || !pet || !ui) return;

        const svgNS = 'http://www.w3.org/2000/svg';
        const effects = document.createElement('div');
        effects.id = 'battleEffects';
        stage.appendChild(effects);

        const fire = document.createElement('div');
        fire.id = 'fireGod';
        fire.innerHTML = pet.querySelector('svg').outerHTML;
        fire.querySelector('#petSpeech')?.remove();
        fire.querySelectorAll('#petSpeechText').forEach(e => e.remove());
        fire.querySelectorAll('#eye').forEach((e, i) => e.id = 'fireEye' + i);
        fire.querySelectorAll('#headGroup').forEach(e => { e.classList.add('headGroup'); e.removeAttribute('id'); });
        fire.querySelectorAll('#tail,#legs,#bodyGroup').forEach(e => e.removeAttribute('id'));
        const fireSvg = fire.querySelector('svg');
        stage.appendChild(fire);

        function makeOverheadHP(id, label, type) {
            const el = document.createElement('div');
            el.id = id;
            el.className = 'overhead-hp ' + type;
            el.innerHTML = '<div class="overhead-label">' + label + ' <span class="overhead-number">100</span>/100</div><div class="overhead-track"><div class="overhead-fill"></div></div>';
            stage.appendChild(el);
            return el;
        }
        const rainHeadHP = makeOverheadHP('rainHeadHP', ' 雨神', 'rain');
        const fireHeadHP = makeOverheadHP('fireHeadHP', ' 火神', 'fire');

        function positionOverheadHP(el, character, visible) {
            if (!visible || !character || getComputedStyle(character).display === 'none') {
                el.style.display = 'none';
                return;
            }
            el.style.display = 'block';
            const cr = character.getBoundingClientRect();
            const sr = stage.getBoundingClientRect();
            el.style.left = (cr.left + cr.width / 2 - sr.left) + 'px';
            el.style.top = Math.max(4, cr.top - sr.top - 8) + 'px';
        }
        function updateOverheadHP() {
            rainHeadHP.querySelector('.overhead-number').textContent = rainHP;
            rainHeadHP.querySelector('.overhead-fill').style.width = rainHP + '%';
            fireHeadHP.querySelector('.overhead-number').textContent = fireHP;
            fireHeadHP.querySelector('.overhead-fill').style.width = fireHP + '%';
            positionOverheadHP(rainHeadHP, pet, rainHP > 0);
            positionOverheadHP(fireHeadHP, fire, fireSummoned && fireHP > 0);
        }

        function addXEyes(monster) {
            const svg = monster.querySelector('svg');
            const x = document.createElementNS(svgNS, 'g');
            x.setAttribute('class', 'xeyes');
            x.innerHTML = '<line x1="243" y1="160" x2="260" y2="177"/><line x1="260" y1="160" x2="243" y2="177"/>';
            svg.appendChild(x);
        }
        addXEyes(pet);
        addXEyes(fire);

        let butterflies = [];
        let rainHP = 100;
        let fireHP = 100;
        let fireSummoned = false;
        let rainRecoverTimer = null;
        let fireAutoTimer = null;
        let fireRemovalTimer = null;   // 新增：火神死亡後消失計時器

        const message = document.getElementById('battleMessage');
        let messageHideTimer = null;
        let messageFadeTimer = null;

        function say(t) {
            if (!message) return;
            if (messageHideTimer) clearTimeout(messageHideTimer);
            if (messageFadeTimer) clearTimeout(messageFadeTimer);
            message.textContent = t;
            message.hidden = false;
            message.style.opacity = '1';
            messageHideTimer = setTimeout(() => {
                message.style.opacity = '0';
                messageFadeTimer = setTimeout(() => {
                    message.hidden = true;
                    message.style.opacity = '1';
                    messageFadeTimer = null;
                }, 200);
            }, 3000);
        }
        function flying() {
            try { return typeof player !== 'undefined' && !!player.flying; }
            catch (e) { return false; }
        }
        function rect(el) { return el.getBoundingClientRect(); }
        function overlap(a, b) { return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top; }
        function hpUI(which) {
            const hp = which === 'rain' ? rainHP : fireHP;
            document.getElementById(which + 'HP').style.width = hp + '%';
            document.getElementById(which + 'HPText').textContent = hp;
            updateOverheadHP();
        }
        function spawnButterfly() {
            if (butterflies.length >= 5) return;
            const b = document.createElement('div');
            b.className = 'butterfly';
            b.innerHTML = '<svg viewBox="0 0 60 50"><path d="M30 25 C5 -3 0 24 24 31 C2 48 19 52 30 32 C41 52 58 48 36 31 C60 24 55 -3 30 25Z" fill="#ff73c8" stroke="#8b3b86" stroke-width="2"/><path d="M30 17 L30 37" stroke="#4b3151" stroke-width="4" stroke-linecap="round"/><path d="M29 18 Q18 4 15 10 M31 18 Q42 4 45 10" fill="none" stroke="#4b3151" stroke-width="2"/></svg>';
            const w = Math.max(100, stage.clientWidth);
            const h = Math.max(200, stage.clientHeight);
            b.style.left = (30 + Math.random() * Math.max(30, w - 80)) + 'px';
            b.style.top = Math.max(100, Math.random() * Math.max(100, h - 220)) + 'px';
            stage.appendChild(b);
            butterflies.push({ el: b, dx: (Math.random() - .5) * 1.1, dy: (Math.random() - .5) * .8 });
        }
        function bite(monster, label) {
            if (monster.classList.contains('lost')) return;
            monster.classList.remove('eating');
            void monster.offsetWidth;
            monster.classList.add('eating');
            say('咔嚓！' + label + '吃掉蝴蝶！🦋');
            setTimeout(() => monster.classList.remove('eating'), 450);
        }
        function tickButterflies() {
            updateOverheadHP();
            const pr = rect(pet);
            butterflies = butterflies.filter(o => {
                if (!o.el.isConnected) return false;
                let x = parseFloat(o.el.style.left) || 0;
                let y = parseFloat(o.el.style.top) || 0;
                x += o.dx; y += o.dy;
                if (x < 0 || x > stage.clientWidth - 42) o.dx *= -1;
                if (y < 75 || y > stage.clientHeight - 110) o.dy *= -1;
                o.el.style.left = Math.max(0, Math.min(stage.clientWidth - 42, x)) + 'px';
                o.el.style.top = Math.max(75, Math.min(stage.clientHeight - 110, y)) + 'px';
                if (overlap(pr, rect(o.el))) {
                    o.el.remove();
                    bite(pet, '雨神');
                    return false;
                }
                return true;
            });
            requestAnimationFrame(tickButterflies);
        }
        function defeat(target) {
            if (target === 'fire') {
                fireHP = 0;
                hpUI('fire');
                fire.classList.add('lost');
                say('火神被打敗了！3 秒後消失，可重新召喚。');
                if (fireAutoTimer) { clearInterval(fireAutoTimer); fireAutoTimer = null; }
                // 新增：3 秒後自動消失並重置召喚狀態
                if (fireRemovalTimer) clearTimeout(fireRemovalTimer);
                fireRemovalTimer = setTimeout(() => {
                    fireSummoned = false;
                    fire.style.display = 'none';
                    fire.classList.remove('lost');
                    fireHP = 100;
                    hpUI('fire');
                    say('火神已消失，可以重新召喚！');
                    fireRemovalTimer = null;
                }, 3000);
            } else {
                rainHP = 0;
                hpUI('rain');
                pet.classList.add('lost');
                say('雨神倒下了！稍後會恢復。');
                if (rainRecoverTimer) clearTimeout(rainRecoverTimer);
                rainRecoverTimer = setTimeout(() => {
                    rainHP = 100;
                    hpUI('rain');
                    pet.classList.remove('lost');
                    say('雨神恢復精神了！');
                }, 6000);
            }
        }
        function damage(target, amount, attackName) {
            if (target === 'fire') {
                if (!fireSummoned || fireHP <= 0) return;
                fireHP = Math.max(0, fireHP - amount);
                hpUI('fire');
                if (fireHP === 0) defeat('fire');
                else say(attackName + '命中火神！-' + amount + ' HP');
            } else {
                if (rainHP <= 0) return;
                rainHP = Math.max(0, rainHP - amount);
                hpUI('rain');
                if (rainHP === 0) defeat('rain');
                else say(attackName + '命中雨神！-' + amount + ' HP');
            }
        }
        function emojiProjectile(from, to, emoji, amount, target, name, originTail = false) {
            if ((target === 'fire' && (!fireSummoned || fireHP <= 0)) || (target === 'rain' && rainHP <= 0)) return;
            const a = rect(from);
            const b = rect(to);
            const sr = rect(stage);
            const p = document.createElement('div');
            p.className = 'battleProjectile';
            p.textContent = emoji;
            p.style.left = ((originTail ? a.left + a.width * .12 : a.left + a.width * .55) - sr.left) + 'px';
            p.style.top = (a.top + a.height * .48 - sr.top) + 'px';
            p.style.setProperty('--dx', (b.left + b.width * .45 - a.left - a.width * .45) + 'px');
            p.style.setProperty('--dy', (b.top + b.height * .45 - a.top - a.height * .45) + 'px');
            effects.appendChild(p);
            setTimeout(() => { p.remove(); damage(target, amount, name + '：'); }, 560);
        }
        function summon() {
            if (fireSummoned) { say('火神已經在場上了！'); return; }
            fireSummoned = true;
            fire.style.display = 'block';
            fire.style.left = '';
            fire.style.right = '8%';
            if (fireHP <= 0) { fireHP = 100; hpUI('fire'); }
            fire.classList.remove('lost');
            say('火神登場！火神會自動攻擊雨神！');
            if (fireAutoTimer) clearInterval(fireAutoTimer);
            fireAutoTimer = setInterval(() => {
                if (!fireSummoned || fireHP <= 0 || rainHP <= 0) return;
                const roll = Math.random();
                if (roll < 0.42) emojiProjectile(fire, pet, '☄️🔥', 18, 'rain', '火神烈焰球', true);
                else if (roll < 0.68) {
                    fire.classList.add('rushing');
                    setTimeout(() => fire.classList.remove('rushing'), 600);
                    emojiProjectile(fire, pet, '💥', 20, 'rain', '火神衝撞', true);
                } else if (roll < 0.88) {
                    say('火神召喚火焰風暴！');
                    emojiProjectile(fire, pet, '🌋🔥', 24, 'rain', '火焰風暴', true);
                } else emojiProjectile(fire, pet, '👊🔥', 25, 'rain', '火神打雨神', true);
            }, 2600);
        }
        function cloudLightning() {
            if (flying()) { say('雨神正在騎雲飛行，不能使用雲端雷擊！請先降落。'); return false; }
            if (!fireSummoned || fireHP <= 0) { say('請先召喚還有生命值的火神，再使用雲端雷擊！'); return false; }
            const originalCloud = document.getElementById('rideCloud');
            const sr = rect(stage);
            const tr = rect(fire);
            const cloud = document.createElement('div');
            cloud.className = 'battleCloudMount';
            cloud.innerHTML = originalCloud ? originalCloud.innerHTML : '';
            const svg = cloud.querySelector('svg');
            if (!svg) { say('找不到邪惡雲朵圖案，請確認 rideCloud SVG 還在 HTML 裡。'); return false; }
            cloud.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
            cloud.style.left = (sr.width + 25) + 'px';
            cloud.style.top = Math.max(70, tr.top - sr.top - 115) + 'px';
            effects.appendChild(cloud);
            const targetX = Math.max(0, Math.min(sr.width - 145, tr.left - sr.left + tr.width * .5 - 72));
            const targetY = Math.max(55, tr.top - sr.top - 110);
            requestAnimationFrame(() => {
                cloud.style.left = targetX + 'px';
                cloud.style.top = targetY + 'px';
            });
            say('劈下閃電！');
            setTimeout(() => {
                if (!cloud.isConnected) return;
                const bolt = document.createElement('div');
                bolt.className = 'battleLightning';
                bolt.textContent = '⚡';
                bolt.style.left = (targetX + 72) + 'px';
                bolt.style.top = Math.max(85, tr.top - sr.top - 8) + 'px';
                effects.appendChild(bolt);
                damage('fire', 20, '雲端雷擊');
                setTimeout(() => { bolt.remove(); cloud.remove(); }, 1150);
            }, 760);
            return true;
        }
        function tsunami() {
            if (!fireSummoned) summon();
            if (!fireSummoned || fireHP <= 0) return;
            const sr = rect(stage);
            const tr = rect(fire);
            const wave = document.createElement('div');
            wave.className = 'tsunamiWave';
            wave.textContent = '🌊';
            wave.style.top = Math.max(100, tr.top - sr.top + tr.height * .25) + 'px';
            wave.style.setProperty('--wave-distance', (tr.left - sr.left + tr.width * .5 + 150) + 'px');
            effects.appendChild(wave);
            say('巨大海嘯！');
            setTimeout(() => { wave.remove(); damage('fire', 28, '海嘯攻擊'); }, 1050);
        }
        function resetFire() {
            fireSummoned = false;
            fire.style.display = 'none';
            if (fireAutoTimer) { clearInterval(fireAutoTimer); fireAutoTimer = null; }
            if (fireRemovalTimer) { clearTimeout(fireRemovalTimer); fireRemovalTimer = null; }
        }
        document.getElementById('summonFire').addEventListener('click', summon);
        document.getElementById('newButterfly').addEventListener('click', () => { spawnButterfly(); say('蝴蝶生成了！'); });

        const cooldowns = new Map();
        function withCooldown(id, seconds, action, precheck) {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.addEventListener('click', () => {
                const now = Date.now();
                const until = cooldowns.get(id) || 0;
                if (until > now) { say('技能冷卻中，請再等 ' + Math.ceil((until - now) / 1000) + ' 秒！'); return; }
                if (precheck && !precheck()) return;
                const started = action();
                if (started === false) return;
                const end = Date.now() + seconds * 1000;
                cooldowns.set(id, end);
                btn.classList.add('cooling');
                btn.disabled = true;
                const original = btn.dataset.originalLabel || btn.textContent;
                btn.dataset.originalLabel = original;
                const update = () => {
                    const remain = (cooldowns.get(id) || 0) - Date.now();
                    if (remain <= 0) {
                        btn.disabled = false;
                        btn.classList.remove('cooling');
                        btn.textContent = original;
                        return;
                    }
                    btn.textContent = original + ' (' + (remain / 1000).toFixed(1) + 's)';
                    requestAnimationFrame(update);
                };
                update();
            });
        }
        withCooldown('skillWater', 2.5, () => {
            if (!fireSummoned || fireHP <= 0) { say('請先召喚還有生命值的火神！'); return false; }
            emojiProjectile(pet, fire, '💧', 12, 'fire', '尾巴水砲', true);
            say('雨神發射水砲！');
        });
        withCooldown('skillStorm', 6, cloudLightning, () => {
            if (flying()) { say('雨神正在騎雲飛行，不能使用雲端雷擊！請先降落。'); return false; }
            if (!fireSummoned || fireHP <= 0) { say('請先召喚還有生命值的火神！'); return false; }
            return true;
        });
        withCooldown('skillTsunami', 8, () => {
            if (!fireSummoned || fireHP <= 0) { say('請先召喚還有生命值的火神！'); return false; }
            tsunami();
        });
        withCooldown('skillFlame', 4, () => {
            if (!fireSummoned || fireHP <= 0) { say('請先召喚還有生命值的火神！'); return false; }
            emojiProjectile(pet, fire, '🔥', 15, 'fire', '雨神火焰衝擊', true);
            say('雨神發動火焰衝擊！');
        });
        setInterval(() => { if (butterflies.length < 5) spawnButterfly(); }, 6500);
        spawnButterfly();
        spawnButterfly();
        updateOverheadHP();
        requestAnimationFrame(tickButterflies);
    });
</script>

<script id="raingod-intro-splash-script">
    (() => {
        const splash = document.getElementById('raingodIntroSplash');
        if (!splash) return;
        window.setTimeout(() => splash.remove(), 3000);
    })();
</script>

<script id="raingod-multi-stage-toggle-script">
    (() => {
        const button = document.getElementById("toggleBattleButtons");
        if (!button) return;

        const CLASSES = ["hide-links", "hide-skills", "hide-controls"];
        const STORAGE_KEY = "raingod_hide_stage";   // localStorage 的 key

        const STAGES = [
            { classes: [], label: "隱藏", aria: "隱藏資訊欄" },
            { classes: ["hide-links"], label: "隱藏", aria: "隱藏技能" },
            { classes: ["hide-links", "hide-skills"], label: "隱藏", aria: "隱藏移動按鈕" },
            { classes: ["hide-links", "hide-skills", "hide-controls"], label: "顯示", aria: "顯示全部" }
        ];

        // 讀取上次記住的段數（失敗就回 0）
        function readStage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw === null) return 0;
                const n = parseInt(raw, 10);
                if (Number.isInteger(n) && n >= 0 && n < STAGES.length) return n;
            } catch (err) {
                console.warn("讀取隱藏狀態失敗：", err);
            }
            return 0;
        }

        // 寫入目前段數
        function saveStage(n) {
            try {
                localStorage.setItem(STORAGE_KEY, String(n));
            } catch (err) {
                console.warn("儲存隱藏狀態失敗：", err);
            }
        }

        let stage = readStage();

        function render() {
            const current = STAGES[stage];
            CLASSES.forEach(c => document.body.classList.remove(c));
            current.classes.forEach(c => document.body.classList.add(c));

            button.textContent = current.label;
            // 原本用 label === "顯示" 判斷，繁簡不一致會永遠 false，改用段數判斷
            button.setAttribute("aria-pressed", String(stage === STAGES.length - 1));
            button.setAttribute("aria-label", current.aria);
            button.title = current.aria;
        }

        button.addEventListener("click", () => {
            stage = (stage + 1) % STAGES.length;
            saveStage(stage);   // 每次切換就存一次
            render();
        });

        render();   // 頁面載入時直接還原上次狀態
    })();
</script>
